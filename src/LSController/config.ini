; LSController sample configuration.
; Place a copy of this file NEXT TO LSController.exe and adjust the paths.
;
; [ServiceN] keys:
;   Name  - optional display name (defaults to the exe file name)
;   Dir   - working directory; the server resolves its INI from here
;   Exe   - exe path (absolute, or relative to Dir)
;   INI   - config file passed to the server via "-c"
;   Order - Start All ordering (ascending)
; Empty/skipped sections are ignored.

[common]
MaxService = 7

[Service1]
Name=dbagent (game)
Dir=D:\deploy\Server\ls_dbagent
Exe=ls_dbagent.exe
INI=ls_dbagent_game.ini
Order=1

[Service2]
Name=dbagent (log)
Dir=D:\deploy\Server\ls_dbagent
Exe=ls_dbagent.exe
INI=ls_dbagent_log.ini
Order=2

[Service3]
Name=billingsvr
Dir=D:\deploy\Server\ls_billingsvr
Exe=ls_billingsvr.exe
INI=ls_billingsvr_script.ini
Order=3

[Service4]
Name=mainsvr
Dir=D:\deploy\Server\ls_mainsvr
Exe=ls_mainsvr.exe
INI=ls_mainsvr_script.ini
Order=4

[Service5]
Name=gamesvr
Dir=D:\deploy\Server\ls_gamesvr
Exe=ls_gamesvr.exe
INI=ls_gamesvr_1.ini
Order=5

[Service6]
Name=filewritesvr
Dir=D:\deploy\Server\ls_filewritesvr
Exe=ls_filewritesvr.exe
INI=ls_filewritesvr_script.ini
Order=6

[Service7]
Name=loginsvr
Dir=D:\deploy\Server\ls_loginsvr
Exe=ls_loginsvr.exe
INI=ls_loginsvr_script.ini
Order=7
