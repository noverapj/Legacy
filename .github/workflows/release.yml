name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MAX=15

          PREV_TAG=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | sort -V | tail -n 1 || true)
          RANGE="HEAD"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          fi
          echo "Release ${TAG} generated from range: ${RANGE}" >> "${GITHUB_STEP_SUMMARY}"

          workdir=$(mktemp -d)
          for f in feat fix revert perf refactor docs misc; do
            : > "${workdir}/${f}.txt"
          done

          git log --no-merges --format='%h %s' "${RANGE}" | while read -r sha subject; do
            [ -n "${subject}" ] || continue
            prefix=${subject%%[(:! ]*}
            prefix=${prefix,,}
            case "${prefix}" in
              feat) file=feat ;;
              fix) file=fix ;;
              revert) file=revert ;;
              perf) file=perf ;;
              refactor) file=refactor ;;
              docs) file=docs ;;
              *) file=misc ;;
            esac
            printf '%s\n' "- [${subject}](COMMITURL/${sha})" >> "${workdir}/${file}.txt"
          done

          emit() {
            local title="$1" file="$2" count
            [ -s "${file}" ] || return 0
            count=$(wc -l < "${file}")
            if [ -n "${PREV_TAG}" ] || [ "${count}" -le "${MAX}" ]; then
              {
                echo "## ${title}"
                echo ""
                cat "${file}"
                echo ""
              }
            else
              {
                echo "## ${title} (${count} commits, latest ${MAX} shown)"
                echo ""
                head -n "${MAX}" "${file}"
                echo ""
              }
            fi
          }

          {
            emit "Features" "${workdir}/feat.txt"
            emit "Bug Fixes" "${workdir}/fix.txt"
            emit "Reverts" "${workdir}/revert.txt"
            emit "Performance" "${workdir}/perf.txt"
            emit "Refactoring" "${workdir}/refactor.txt"
            emit "Documentation" "${workdir}/docs.txt"
            emit "Miscellaneous" "${workdir}/misc.txt"
          } > notes.md

          [ -s notes.md ] || echo "No changes." > notes.md

          sed 's#COMMITURL#https://github.com/noverapj/Legacy/commit#g' notes.md > notes-github.md
          sed 's#COMMITURL#https://gitea.com/NOVERA/Legacy/commit#g' notes.md > notes-gitea.md
          sed 's#COMMITURL#https://gitlab.com/noverapj/legacy/commit#g' notes.md > notes-gitlab.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes-github.md

      - name: Create Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --rawfile body notes-gitea.md \
            '{tag_name: $tag, name: $tag, body: $body}' > payload.json
          curl -sSf -X POST "https://gitea.com/api/v1/repos/NOVERA/Legacy/releases" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json

      - name: Create GitLab release
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --rawfile body notes-gitlab.md \
            '{tag_name: $tag, name: $tag, description: $body}' > payload.json
          curl -sSf -X POST "https://gitlab.com/api/v4/projects/noverapj%2Flegacy/releases" \
            -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
