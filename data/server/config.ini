; LSController configuration
;
; [ServiceN] keys:
;   Name  - optional display name (defaults to the exe file name)
;   Dir   - working directory; the server resolves its INI from here
;   Exe   - exe path (absolute, or relative to Dir)
;   INI   - config file passed to the server via "-c"
;   Order - Start All ordering (ascending)
;   Watchdog - optional per-service opt-out (0 = never auto-restart this server)
; Empty/skipped sections are ignored.
;
; Relative Dir entries assume LSController.exe and the service folders sit in
; the same directory, and that the controller is started from there.

[common]
MaxService = 10
Watchdog = 1

[Service1]
Name=dbagent (game)
Dir=ls_dbagent
Exe=ls_dbagent.exe
INI=ls_dbagent_game.ini
Order=1

[Service2]
Name=dbagent (log)
Dir=ls_dbagent
Exe=ls_dbagent.exe
INI=ls_dbagent_log.ini
Order=2

