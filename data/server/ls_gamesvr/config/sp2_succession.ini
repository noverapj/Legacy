[common]

; 기본 MMR

default_mmr = 1100

; 최소 MMR
; check_minimum_mmr이 1일 경우 MMR이 minimum_mmr 이하로 내려가지 않음.
; check_minimum_mmr이 1일 경우 로그인시 MMR이 minimum_mmr 에 의해 재조정됨.
minimum_mmr = 0

; 승리시 획득 포인트
win_point = 5

; 패배시 차감 포인트
lose_point = 5

; ELO를 사용할 것인가?
; 0 : win_point/lose_point 사용
; 1 : 기존 공식 사용
use_ELO = 1

; 최소MMR을 사용할 것인가?
check_minimum_mmr = 0


