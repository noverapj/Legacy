[NETWORK]
IP   = 127.0.0.1
PORT = 14090

[MemoryPool]
user_pool = 100
limit_user= 100

; 10만 바이트 파일까지 받을 수 있으므로 10만 이상으로 설정
[Session Buffer]
SendBufferSize = 131072
RecvBufferSize = 131072


[SECURITY]
ON = 1
ONE_SEC_RCV = 1000

[UserUpload]
Use	 = 1
Path     = D:\gearskin
TempPath = D:\gearskin\FileWriteServer\TempGear
ErrorPath= D:\gearskin\FileWriteServer\ErrorGear

[WriteFile]
Max=2

Ext1      = jpg
Path1     = D:\upFiles\guildmark
TempPath1 = D:\FileWriteServer\TempGuildMark
ErrorPath1= D:\FileWriteServer\ErrorGuildMark

Ext2      = lsc
Path2     = D:\upFiles\gear
TempPath2 = D:\FileWriteServer\TempGear
ErrorPath2= D:\FileWriteServer\ErrorGear