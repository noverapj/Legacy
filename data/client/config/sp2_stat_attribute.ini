;attribute_id 는 특성의 고유 값.
;group 은 특성의 속성. item의 group과 동일. 1 -> STR, 2 -> DEX, ...
;change_width 는 최대 변화폭을 의미. 배율 값. 0.5f는 최대 50%의 변화폭을 가짐.

; 특성단계 최대량과 스텟체감 상수
[common]
statattribute_cnt = 21

[race_max_attribute]
; 가로 STR, DEX, INT, VIT 순
; 세로 인간, 엘프, 드워프 순

line1 = 2 2 2 2
line2 = 1 3 3 1
line3 = 3 1 1 3

