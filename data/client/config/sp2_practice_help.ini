step9_title = 메이 - 레스티스롤링(ASD)
step9_help  = 레스티스롤링(ASD)은 빠른 회전 공격을 하는 스킬입니다 방향키와 공격키(D)를 이용해 원하는 방향으로 추가 공격을 할 수 있으며, 점프 중 사용가능합니다.

step10_title = 메이 - 오버헤드키스(AD)
step10_help  = 오버헤드키스(AD)는 대상을 잡아 공중으로 이동하는 스킬입니다. 이동 중  공격키(D)를 누르면 대상을 발로 차서 뒤로 보내는 공격을 합니다.

step11_title = 메이 - 박수로 맞이해주세요(AS)
step11_help  = 박수로 맞이해주세요(AS)는 돌고래 두 마리를 소환해 상대를 공격하는 스킬입니다. 돌고래는 대상을 공중에 띄우며, 넘어진 대상도 공격 할 수 있습니다.

step12_title = 메이 - 국민콤보 ①
step12_help  = ★대선풍(SD)→돌고래씨 세로(D 누름떼기) 대선풍(SD)으로 공격 후 돌고래씨 세로(D 누름떼기)를 연속 사용해 공격합니다.

step13_title = 메이 - 국민콤보 ②
