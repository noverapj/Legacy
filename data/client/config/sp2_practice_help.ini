step6_title  = 나이트메어 - 피격중 밤안개 변신 (피격중 D 오래누름)
step6_help   = 피격 중, 다운, 공중 피격 중 (D 오래 누름)을 누르면 밤안개로 변신하게 되며. D키 입력 시 대각선 아래로 빠르게 하강하며 공격합니다.

step7_title = 나이트메어 - 점프공격 (A → D →D →D →D)
step7_help  = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 공중 공격이 진행되며, 총 4회 연속 공격을 할 수 있습니다.

step8_title = 나이트메어 - 점프대시 (A → ->->)
step8_help  = 점프키(A)를 누르면 점프가 발동되며 이때 방향키를 빠르게 두 번 누르면 전방으로 돌진하는 공격을 진행합니다. 타격 성공 시 자동 점프 상태로 변환 됩니다.

step9_title = 나이트메어 - 대시공격 (->-> → D → D)
step9_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 2연타 하는 대시 공격이 가능합니다.

step10_title = 나이트메어 - 대시공격2 (->-> → D → D)
step10_help  = 2연타 공격 성공 시 자동 점프 상태로 변환되며 추가적으로 공격을 이어나갈 수 있습니다.

step11_title = 나이트메어 - 반격 (방어 성공 시 바로 공격)
step11_help  = 공격을 방어한 후 D키 입력 시 뒤로 점프하여 회피하게 됩니다.  강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약 공격을 반격하면 실패할 확률이 높습니다.

step12_title = 나이트메어 - 악몽의기체 / 무기스킬(SD)
step12_help  = 악몽의기체(SD)는 전방으로 밤안개를 발사한 뒤 D키 입력 시 밤안개 주변의 적을 모두 끌어모아 어두운 구렁텅이에 적을 모두 드랍시키는 스킬입니다.

step13_title = 나이트메어 - 즉각적인 저주 / 갑옷스킬(ASD)
step13_help  = 즉각적인 저주(ASD)는 자신의 주변을 밤안개 지역으로 만들고 시야를 흐릿하게 만드는 스킬입니다. 

step14_title = 나이트메어 - 블라인드 라인 / 투구스킬(AD)
step14_help  = 블라인드 라인(AD)는 상대방의 눈을 멀게 하는 밤안개를 발사하여, 앞이 보이지 않게 만드는 스킬입니다. 피격된 상대방은 일정시간 동안 앞을 보지 못합니다.

step15_title = 나이트메어 - 밤의 홍수 / 망토스킬(AS)
step15_help  = 밤의 홍수(AS)는 공중으로 점프하여 밤안개를 모아 자신이 원하는 위치에 밤안개를 발사하는 스킬입니다. 피격된 상대방은 혼란 속에 길을 잃고 헤맵니다.

step16_title = 나이트메어 - 국민콤보 ①
step16_help  = ★대시공격 (->-> → D → D) →점프 공격 4타 →(->->) 점프 대시 공격으로 마무리 합니다.

step17_title = 나이트메어 - 국민콤보 ②
