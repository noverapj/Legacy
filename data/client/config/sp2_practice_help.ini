[Set82]

max_step = 26

step0_title  = 쿠사나기 쿄 - 기본소개
step0_help   = 쿠사나기 쿄는 The  King Of Fighters 게임에 등장하는 캐릭터로 삼신기 중 한명으로 불의 힘으로 상대를 제압하는 프리미엄 캐릭터입니다.

step1_title  = 쿠사나기 쿄 - 기본공격(D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 쿠사나기 쿄 - 114식 황물기(D 오래누름)
step2_help   = D키를 오래 누르면 힘을 모았다가 강하게 타격하는 방어 파괴 공격을 합니다. 맞은 대상은 경직상태가 되어 추가공격을 하기에 용이합니다.

step3_title  = 쿠사나기 쿄 - 75식 개(->->)
step3_help   = 방향키를 빠르게 두 번 눌렀다 때면 전방으로 2회 연속 날라차기를 하여 대상을 타격합니다. 타격 당한 대상은 띄움상태가 됩니다.

step4_title  = 쿠사나기 쿄 -  R.E.D Kick (->-> → D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키는 내려찍기 공격을 합니다.

step5_title  = 쿠사나기 쿄 - 79식 (A → D )
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발차기 공격이 발동됩니다. 공격키 입력시 방향키를 통하여 원하는 방향의 공격이 가능합니다.

step6_title  = 쿠사나기 쿄 - 외식 나락 떨구기(A → D 오래누름 )
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 두 주먹으로 대상을 강하게 내리치는 공격을 하며, 맞은 대상은 경직상태가 됩니다.

step7_title  = 쿠사나기 쿄 - 115식 독물기 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 공격키(D)를 연속으로 입력하면 401식 죄읊기, 401식 벌읊기, 100식 귀신태우기로 이어집니다.

step8_title  = 쿠사나기 쿄 - 커맨드 기능 ①
step8_help   = 기본공격, 대시공격, 특별공격, 반격, 점프착지, 커맨드 공격 중에 지정된 방향키를 연속으로 입력하면 커맨드 및 스킬 공격을 즉시 발동 시킬 수 있습니다.

step9_title  = 쿠사나기 쿄 - 커맨드 기능 ②
step9_help   = 커맨드에 사용되는 방향키는 상하좌우(↑↓←→) 4개이며 캐릭터 방향과 관계 없이 입력키 그대로 적용하여 커맨드 기능을 발동 시킵니다.

step10_title  = 쿠사나기 쿄 - 전방 카스미( →→)
step10_help   = 전방으로 일정거리를 낮은 자세로 미끄러 지듯이 이동하는 카스미가 발동됩니다. 카스미를 사용하면 대상을 관통하는 이동이 가능합니다.

step11_title  = 쿠사나기 쿄 - 후방 카스미( ←←)
step11_help   = 후방으로 일정거리를 낮은 자세로 미끄러 지듯이 이동하는 카스미가 발동됩니다. 카스미를 사용하면 대상을 통하는 이동이 가능합니다.

step12_title = 쿠사나기 쿄 - 100식 귀신태우기 (→ ↓)
step12_help  = 회전하면서 대상을 불로 강타하는 공격이 발동됩니다. 대상을 공중에 띄우는 공격으로 기본 및 다른 커맨드 공격으로 연결하기에 유용합니다.

step13_title = 쿠사나기 쿄 - 114식 황물기(↓ →)
step13_help  = 특별 조작을 사용할 때보다 빠르게 발동되는 황물기 공격이 됩니다. 한번 더 커맨드를 입력하면, 128식 구상으로 연결되어 대상을 타격할 수 있습니다.

step14_title = 쿠사나기 쿄 - 황물기 연계기(114식 황물기 중 D or S)
step14_help  = 114식 황물기를 2회 사용 후 D키를 입력하면 대상을 내려찍는 127식 팔청이 발동되고, S키를 입력하면 대상을 날려버리는 125식 칠뢰가 발동됩니다.

step15_title = 쿠사나기 쿄 - 114식 황물기 (↓ ←)
step15_help  = 특별 조작을 사용할 때보다 빠르게 발동되는 황물기 공격을 합니다. 한번 더 커맨드를 입력하면, 127식 팔청으로 연결되어 대상을 타격할 수 있습니다.

step16_title = 쿠사나기쿄 - 황물기 연계기(황물기 사용 중 D or S)
step16_help  = 114식 황물기를 2회 사용 후 D키를 입력하면 대상을 바닥으로 내려치는 외식 섬돌뚫기가 발동되고, S키를 입력하면 대상을 날려버리는 125식 칠뢰가 발동됩니다.

step17_title = 쿠사나기쿄 - 75식 개 (↓→↑)
step17_help  = 대시조작으로 사용할 때보다 빠르게 발동되는 75식 개공격이 발동됩니다. 공격한 대상을 공중에 띄웁니다.

step18_title = 쿠사나기쿄 - R.E.D Kick (↓←↑)
step18_help  = 대시조작으로 사용할 때보다 빠르게 발동되는 R.E.D Kick이 발동됩니다. 맞은 대상은 잠시동안 경직상태가 됩니다.

step19_title  = 쿠사나기쿄- 금월 양/무기스킬(SD or →↓←)
step19_help   = 212식 금월 양(SD)은 일정 거리를 달려가 대상을 잡고들어 올린 후 불을 폭파시켜 공격하는 스킬입니다.(→↓←) 커맨드를 사용하여 발동 시킬 수 있습니다.

step20_title  = 쿠사나기쿄- 무식 / 갑옷스킬(ASD or ↓→↓→)
step20_help   = 최종결전오의 무식(ASD)은 넘어진 대상도 공격하며,대상을 불로 공격 후 5연타 공격을 하는 스킬입니다.(↓→↓→) 커맨드를 사용하여 발동 시킬 수 있습니다.

step21_title  = 쿠사나기쿄- 대사치 / 투구스킬(ADor↓←↓→)
step21_help   = 리 108식 대사치(AD)는 불의 힘을 모은 후 불로 대상을 타격하여 경직시키는 스킬입니다. (↓←↓→)커맨드를 사용하여 발동 시킬 수 있습니다.

step22_title = 쿠사나기 쿄 - 십권 / 망토스킬(AS or →↑→↑)
step22_help  = 최종결전비오의 십권(AS)은 전방으로 빠르게 이동 후 주변에 강력한 불을 폭파시켜 타격하는 스킬입니다 .(→↑→↑) 커맨드를 사용하여 발동 시킬 수 있습니다.

step23_title = 쿠사나기 쿄 - 국민콤보 ①
step23_help  = 대사치(AD)→금월 양(SD) 대사치(AD)로 타격한 후 금월 양(SD)로 마무리합니다.

step24_title = 쿠사나기 쿄 - 국민콤보 ②
step24_help  = 무식(ASD)→금월 양(SD)→대사치(AD)→십권(AS) 무식(ASD)으로 띄운 후 금월 양(SD)으로 대상을 잡아 공격하고 대사치(AD)사용 후 십권(AS)으로 마무리합니다.

step25_title = 쿠사나기 쿄 - 국민콤보 ③
step25_help  = 황물기(D오래누름)→75식개(↓→↑)→R.E.D kick(↓←↑)→금월양(→↓←)→기본4타→R.E.D Kick(↓←↑)→귀신태우기(→↓)→75식개(↓→↑)→황물기(↓← ×2 + S키)


[Set83]

max_step = 17

step0_title  = 데스페라도 - 기본소개
step0_help   = 데스페라도는 데저트 이글 2자루를 이용하여 대상에게 연속적으로 총알을 발사하고 스타일리시한 이동 및 공격으로 대상을 제압하는 원거리 계열 용병입니다.

step1_title  = 데스페라도 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 데스페라도 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며 사정거리 내 대상을 자동으로 조준해 줍니다. 조준된 상태에서 공격키를 떼면 대상에게 총알을 발사합니다.

step3_title  = 데스페라도 - 연속발사 (D 누름떼기 D연타)
step3_help   = 공격키(D)를 누름떼기하여 총알을 발사 한 후 공격키(D)를 연속으로 누르면 최대 5발까지 연속 발사가 가능합니다. 공격키 이후에 방향키를 누르면 이동이 가능합니다.

step4_title  = 데스페라도 - 대시공격1 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 대상을 총으로 가격하는 공격을 합니다.

step5_title  = 데스페라도 - 대시 플라잉 (->-> D오래)
step5_help   = 대시 달리기 중 D키를 오래 누르면 전방으로 뛰어 올라 바닥을 향하여 공격하는 대시 플라잉 기술이 발동됩니다. 대시 플라잉 중에 점프키를 누르면 점프 상태가 됩니다.

step6_title  = 데스페라도 - 대시공격2 (->-> D + D, D오래)
step6_help   = 대시공격1 후에 공격키(D)를 입력하면 공격한 총을 발사하여 대상을 넉백시키는 공격을 합니다. D오래누름 공격으로도 공격을 할 수 있습니다.

step7_title  = 데스페라도 - 이중점프 (A 두번 누름)
step7_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step8_title  = 데스페라도 - 점프공격 (A → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발로 차는 점프 공격을 합니다. 대상을 공격하면 점프가 다시 발동되어 추가 공격이 가능합니다

step9_title  = 데스페라도 - 점프사격 (A → D + D + D)
step9_help   = 점프를 한 후 공격키(D)를 누르면 점프 사격이 됩니다. 공격키를 오래 누르면 조준 상태가되며 최대 3연속까지 총알을 발사 할 수 있습니다.

step10_title  = 데스페라도 - 드라이브 샷(SD)
step10_help   = 드라이브 샷(SD)은 전방으로 총알을 7연속 발사하는 스킬입니다. 조준을 하여 사용할 시에는 고정으로 타겟을 잡아 공격을 하기 때문에 집중 사격을 하기에 좋습니다.

step11_title  = 데스페라도 - 스핀 샷(ASD)
step11_help   = 스핀 샷(ASD)은 360도 방향으로 총알을 발사하여 대상을 경직시키는 스킬입니다. 공중에서도 사용이 가능하며 다운된 대상을 일으키는 효과를 가지고 있습니다.

step12_title  = 데스페라도 - 래피드 샷(AD)
step12_help   = 래피드 샷(AD)은 후방으로 점프하여 대각선 아래로 총알을 난사하는 스킬입니다. 마법진을 이용하여 위치를 조정 할 수 있으며 공중에서도 사용이 가능합니다.

step13_title  = 데스페라도 - T.N.T(AS)
step13_help   = T.N.T(AS)는 대상을 붙잡고 폭탄을 설치하여 경직시키는 스킬입니다. 피격 당한 대상은 경직 후에 폭탄을 안고 이리저리 뛰어다니다가 터지는 스킬입니다.

step14_title = 데스페라도 - 국민콤보 ①
step14_help  = ★대시공격 → 대시 플라잉 → 연속발사 대시공격으로 대상을 경직시키고 대시 플라잉으로 강한 경직을 발생한 후 연속 발사로 마무리 합니다.

step15_title = 데스페라도 - 국민콤보 ②
step15_help  = 스핀 샷(ASD)→드라이브 샷(SD) 스핀 샷(ASD)으로 대상을 경직 시킨 후 드라이브 샷(SD)로 마무리 합니다.

step16_title = 데스페라도 - 국민콤보 ③
step16_help  = T.N.T(AS) → 공중 스핀샷(A → ASD) → 래피드 샷(AD) T.N.T(AS)로 대상을 공격하고 공중 스핀샷(A → ASD)으로 대상을 경직 시킨 후 래피드 샷(AD)으로 마무리합니다.


[Set84]

max_step = 26

step0_title  = 나코루루 - 기본소개
step0_help   = 나코루루는 사무라이 스피릿츠 게임에 등장하는 캐릭터로 단도 치치우시와 수호조 마마하하를 이용해 대상을 제압하는 프리미엄 용병입니다.

step1_title  = 나코루루 - 기본공격(D → D → D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 나코루루 - 마마하하 타기(D 오래누름)
step2_help   = D키를 오래 누르면 마마하하를 탑니다. 마마하하는 무기아이콘 상단의 게이지가 노란색일 때만 탈 수 있으며, 마마하하를 타면 게이지가 소모됩니다.

step3_title  = 나코루루 - 마마하하 타기 공격(마마하하타기 중 D)
step3_help   = 마마하하를 탄 상태에서 공격키를 누르면 아래에서 위로 대상을 올려베는 공격을 합니다. 타격당한 대상은 공중에 뜨게 됩니다.

step4_title  = 나코루루 - 신의 칼날(D 오래누름 후 D 오래누름)
step4_help   = 마마하하를 탄 상태에서 공격키를 오래 누르면 지상으로 하강하면서 대상을 타격하는 공격을 합니다. 맞은 대상은 경직상태가 됩니다.

step5_title  = 나코루루 - 대시공격(->-> → D )
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 올려베기는 공격을 합니다.

step6_title  = 나코루루 - 점프 공격(A → D )
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 위에서 아래로 내려찍는 발차기 공격을 합니다.

step7_title  = 나코루루 - 바람을 붙잡는 손 (A → D )
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 대상을 잡은 후 지상으로 내려찍는 잡기 공격을 합니다 .

step8_title  = 나코루루 - 연참 (방어 성공시 바로 공격)
step8_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 공격키(D)를 연속으로 입력 시 빠르게 대상을 연속 타격을 합니다.

step9_title  = 나코루루 - 커맨드 기능 ①
step9_help   = 기본공격, 대시공격, 특별공격, 반격, 점프착지, 커맨드 공격 중에 지정된 방향키를 연속으로 입력하면 커맨드 및 스킬 공격을 즉시 발동 시킬 수 있습니다.

step10_title  = 나코루루 - 커맨드 기능 ②
step10_help   = 커맨드에 사용되는 방향키는 상하좌우(↑↓←→) 4개이며 캐릭터 방향과 관계 없이 입력키 그대로 적용하여 커맨드 기능을 발동 시킵니다.

step11_title = 나코루루 - 승리의 칼날 ( ← ↓)
step11_help  = 대시 공격 조작을 할때보다 빠르게 시전되는 승리의 칼날 공격이 발동합니다. 전방으로 빠르게 이동하면서 대상을 공중에 띄우는 공격을 합니다.

step12_title = 나코루루 - 바람의 칼날  (→↓)
step12_help  = 공중으로 상승하며 대상을 타격하는 바람의 칼날 공격이 발동합니다. 타격한 대상을 공중에 띄우는 공격이며, 공격 후 점프 상태가 됩니다.

step13_title  = 나코루루 - 마마하하 커맨드
step13_help   = 커맨드를 사용하여 마마하하로 공격 할 수 있습니다. 마마하하가 공격 중에는 마마하하 커맨드를 중복으로 입력해도 발동되지 않습니다.

step14_title = 나코루루 - 바람회오리 ( →↓←)
step14_help  = 마마하하가 바람회오리를 발사하여 대상을 공격합니다. 공격 당한 대상은 공중에 띄워집니다. 연속으로 2회 사용이 가능합니다.

step15_title = 나코루루 - 매의 부리 (↓→)
step15_help  = 마마하하가 하강하며 전방에 있는 대상에게 날아가 타격을 합니다. 마마하하가 돌아올 때 다시 커맨드를 입력하여 총 2회 공격할 수 있습니다.

step16_title = 나코루루 - 매의 발톱 (↑→)
step16_help  = 마마하하가 하강하며 전방에 있는 대상에게 날아가 대상을 잡은 후 잠시동안 공중에 띄웁니다. 추가공격을 하기 용이합니다.

step17_title = 나코루루 - 전방대시 ( → →)
step17_help  = 전방으로 짧은 거리를 빠르게 굴러서 이동합니다. 기습적으로 빠르게 이동하기 때문에 상대에게 접근할 때 유용합니다.

step18_title = 나코루루 - 후방대시 (← ←)
step18_help  = 후방으로 짧은 거리를 빠르게 이동합니다. 기습적으로 빠르게 이동하기 때문에 상대의 타이밍을 끊기에 유용합니다.

step19_title  = 나코루루- 빛나는신의윤무/무기스킬(SD or←→↓)
step19_help   = 빛나는 신의 윤무(SD)는 뒤로 점프 후 앞으로 전진 하강하며 대상에게 5연타 후 마마하하로 공격하는 스킬입니다. 맞은 대상은 경직상태가 됩니다.

step20_title  = 나코루루- 신의 윤무 / 갑옷스킬(ASD or ←↓←)
step20_help   = 신의 윤무(ASD)는 앞으로 전진하면서 대상을 천으로 타격하는 스킬입니다. 방향키로 방향전환이 가능하며, 맞는 대상은 일정시간 유지되는 경직상태가 됩니다.

step21_title  = 나코루루- 바람을 타는 차기 / 투구스킬(AD)
step21_help   = 바람을 타는 차기(AD)는 대상을 잡은 후 발차기 연타 공격을 하는 스킬입니다. 피격 중 사용 가능하고, D키를 한번 더 누르면 대상을 내려찍어 바운딩 시킵니다.

step22_title = 나코루루 - 바람의 칼날 / 망토스킬(AS)
step22_help  = 바람의 칼날(AS)은 공중으로 상승하며 대상을 연타하는 스킬입니다. 타격 후 자신은 공중상태가 되며, 다운 중 에도 사용이 가능합니다.

step23_title = 나코루루 - 국민콤보 ①
step23_help  = ★빛나는 신의 윤무(SD) →바람을 타는 차기(AD) 빛나는 신의 윤무(SD)로 대상을 타격 한 후 바람을 타는 차기(AD)로 마무리합니다.

step24_title = 나코루루 - 국민콤보 ②
step24_help  = ★대시공격(->-> → D)으로 대상을 띄운 후→매의 발톱(↑→) →바람을 붙잡는 손(A → D오래누름)으로 마무리합니다.

step25_title = 나코루루 - 국민콤보 ③
step25_help  = ★신의칼날(비행 중 D오래누름)→대시공격(->->→D)→기본타4타→매의발톱(↑→)→바람을붙잡는손(A→D오래누름)→바람의칼날(AS)→바람을붙잡는손(A→D오래누름)


[Set85]

max_step = 17

step0_title  = 디스트로이어 - 기본소개
step0_help   = 디스트로이어는 빔라이플을 무기로 사용하며, 비행능력을 이동해 기동 사격으로 대상을 공략하는 원거리 계열 용병입니다.

step1_title  = 디스트로이어 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 디스트로이어 - 비행 (D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 비행 상태로 전환이 됩니다. 비행은 무기아이콘 상단의 비행게이지가 노란색일 때만 비행이 사용되며, 게이지가 소모됩니다.

step3_title  = 디스트로이어 - 비행 사용방법 ①
step3_help   = 대기, 걷기, 점프 중 공격키(D)를 오래 누르고 있으면 비행 상태가 됩니다. 점프 중이나, 고도가 상승된 상태에서 비행 종료 시 점프상태로 전환됩니다.

step4_title  = 디스트로이어 - 비행 사용방법 ②
step4_help   = 비행 게이지는 걷기나 대기상태에서 충전되며, 비행 중 방향키를 입력시 바라보는 방향을 유지한 상태로 대시 이동을 합니다. A키 입력 시 점프상태로 전환합니다.

step5_title  = 디스트로이어 - 비행 사용방법 ③
step5_help   = 비행 중 이동 시 전방을 방어하면서 이동합니다. 대신 대상의 공격을 방어하면 일정량의 비행 게이지가 소모 됩니다.

step6_title  = 디스트로이어 - 비행 사용방법 ④
step6_help   = 비행 중 공격키(D)를 누르면 조준점이 있는 곳으로 레이져를 발사합니다. 조준은 대상이 일정범위 안에 접근 시 자동조준이 됩니다.

step7_title  = 디스트로이어 - 비행 사용방법 ⑤
step7_help   = 비행 중 공격키(D)를 누른 체 유지하면, 특별공격으로 전환됩니다. 방향키를 입력으로 이동이 가능하며, D키를 떼면 조준점이 있는 곳으로 강력한 레이져를 발사합니다.

step8_title  = 디스트로이어 - 대시공격 (->-> → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 올려치는 공격을 한 후 자신도 점프상태가 됩니다.

step9_title  = 디스트로이어 - 점프공격(A →D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대각선 아래로 레이저를 발사해 공격합니다. 이후 한번 더 공격키(D)눌러 추가공격을 할 수 있습니다.

step10_title  = 디스트로이어 - 건 블레이징 / 무기스킬(SD)
step10_help   = 건 블레이징(SD)은 가장 가까이 있는 적을 타겟으로 잡은 후 D키 연타로 대상을 공격하는 스킬입니다. A키 또는 S키로 대상을 변경할 수 있습니다.

step11_title  = 디스트로이어 - 울티메이트 빔 / 갑옷스킬(ASD)
step11_help   = 울티메이트 빔(ASD)은 전방에 차원을 생성하여 빔을 연속으로 발사하는 스킬입니다. 맞은 대상은 경직상태가 되어 추가 공격을 하기에 용이합니다.

step12_title  = 디스트로이어 - 판넬 / 투구스킬(AD)
step12_help   = 판넬(AD)은 자신 주변에 판넬들을 소환하여 대상을 공격하는 스킬입니다. 판넬은 넘어진 대상도 공격을 할 수 있습니다.

step13_title  = 디스트로이어 - 일루젼 애로우 / 망토스킬(AS)
step13_help   = 일루젼 애로우(AS)는 공중 상승 후 방향키로 마법진을 움직여에 지정위치에 일루젼 애로우를 발사하는 스킬입니다 D키로 발사하고 점프 중 사용가능합니다.

step14_title = 디스트로이어 - 국민콤보 ①
step14_help  = ★울티메이트 빔(ASD) →건 블레이징(SD) 울티메이트 빔(ASD)으로 공격한 후 건 블레이징(SD)로 마무리합니다.

step15_title = 디스트로이어 - 국민콤보 ②
step15_help  = ★대시공격 (->-> → D) → 비행 중 사격(D 오래누름 후 D) 대시공격으로 대상을 띄운 후 비행상태로 전환 하여 D키를 연타하여 대상을 공격합니다.

step16_title = 디스트로이어 - 국민콤보 ③
step16_help  = ★울티메이트 빔(ASD)으로 대상을 경직 시킨 후 비행(D 오래노름)하여 D오래누름으로 대상을 날려 버린다음 바로 일루젼 애로우(AS)로 마무리합니다.


[Set86]

max_step = 16

step0_title  = 미카엘 - 기본소개
step0_help   = 미카엘은 천상의 군대를 이끄는 대천사로 강력한 천상의 검으로 비행을 하며 적을 끊임 없이 괴롭혀 제압하는 레어 용병입니다.

step1_title  = 미카엘 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 미카엘 - 특별공격(D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 전방으로 빠르게 비행해 날아갑니다.  특별 게이지가 노란색일 때만 사용이 가능하며, 사용할 때마다 게이지가 소모됩니다.

step3_title  = 미카엘 - 특별공격 사용방법 ①
step3_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 특별공격은 대기, 걷기, 점프, 대시 중에도 공격키(D)오래누름으로 사용이 가능합니다.

step4_title  = 미카엘 - 특별공격 사용방법 ②
step4_help   = 특별공격으로 대상을 공격 시 대상을 잡고 공중으로 올라가 타격합니다. 대상을 잡을 때 방향키를 입력하면 해당방향으로 이동합니다.

step5_title  = 미카엘 - 특별공격 사용방법 ③
step5_help   = 특별공격이 종료되면 점프상태로 전환이 됩니다. 점프상태로 전환이 되기 때문에 비행이나 점프공격을 할 수 있습니다.

step6_title  = 미카엘 - 대시공격 (->-> → D + D + D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 검으로 공격합니다. 최대 4회 타격이 가능합니다.

step7_title  = 미카엘 - 점프공격 - (A →D + D + D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 검으로 공격합니다. 이때 추가로 D키를 눌러 추가공격할 수 있습니다. 최대 3연타가 가능합니다.

step8_title  = 미카엘 - 튕겨내기 (공격 받는 순간 방어)
step8_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step9_title  = 미카엘 - 천상의 군대 / 무기스킬(SD)
step9_help   = 천상의 군대(SD)는 다수의 천사를 소환하여 공격하는 스킬입니다. 천사들은 대상을 쫓아가 타격을 하고 사라집니다. 점프 중 사용이 가능합니다.

step10_title = 미카엘 - 심판의 빛 / 갑옷스킬(ASD)
step10_help  = 심판의 빛(ASD)은 자신의 중심으로 일정 범위 안의 대상 머리 위로 떨어지는 천상의 빛을 발사해 공격하는 스킬입니다. 다운이 되면 스킬이 해제됩니다.

step11_title = 미카엘 - 천상의 가호 / 투구스킬(AD)
step11_help  = 천상의 가호(AD)는 일정 시간동안 무적파괴 효과 공격을 제외한 모든 공격과 상태이상에서 자신을 보호해주는 스킬입니다.

step12_title = 미카엘 - 저공비행 / 망토스킬(AS)
step12_help  = 저공비행(AS)는 점프 시 점프키(A)를 누르고 있으면 저공 비행상태로 전환하여 서서히 지상에 착지하게 해주는 스킬입니다. 점프키(A)를 떼면 해제됩니다.

step13_title = 미카엘 - 국민콤보 ①
step13_help  = ★천상의 군대(SD) → 기본공격 (D →D →D) 천상의 군대(SD)대상을 공격한 후 기본공격으로 공격해 마무리 합니다.

step14_title = 미카엘 - 국민콤보 ②
step14_help  = ★대시공격 (->-> → D+D+D+D) → 특별공격(D 오래누름) → 점프공격(A →D + D + D)으로 마무리 합니다.

step15_title = 미카엘 - 국민콤보 ③
step15_help  = ★대시공격(->->→D+D+D+D)→특별공격(D오래누름)→ 점프공격(A→D+D)→특별공격(D오래누름)→점프공격(A→D+D)→특별공격(D오래누름)→점프공격(A→D+D+D)


[Set87]

max_step = 16

step0_title  = 불도깨비 - 기본소개
step0_help   = 불도깨비은 강력한 금쇄봉를 다루는 강력한 힘과 뜨거운 화염을 자유자재로 사용하여 상대를 제압하는 근거리 계열 용병입니다.

step1_title  = 불도깨비 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 불도깨비 - 화둔술(D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 전방으로 불을 내뿜어 공격합니다. 일정시간동안 불을 내뿜을 수 있으며, 사용 중 A키를 눌러 점프상태로 전환이 가능합니다.

step3_title  = 불도깨비 - 대시공격1 (->-> → D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 발로 찬 후 점프상태로 전환하는 공격을 합니다.

step4_title  = 불도깨비 - 대시공격2 (->-> → D 오래누름)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 오래 누르면 대상을 위로 띄우는 공격을 합니다.

step5_title  = 불도깨비 - 이중점프 (A 두번 누름)
step5_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step6_title  = 불도깨비 - 점프공격 - (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발차기 공격을 합니다. 대상 타격 후 점프상태로 전환합니다.

step7_title  = 불도깨비 - 내려찍기 - (A →D 오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 하강하면서 금쇄봉으로 대상을 내려치는 공격을 합니다. 다운대상도 타격이 가능합니다.

step8_title  = 불도깨비 - 튕겨내기 (공격 받는 순간 방어)
step8_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step9_title  = 불도깨비 - 풍비박산 / 무기스킬(SD)
step9_help   = 풍비박산(SD)는 금쇄봉을 회전 이동하면서 휘두르는 스킬입니다. 공격 중 공격키(D) 입력 시 대상을 날려버리는 공격을 하며, S키와 A키로 멈출 수 있습니다.

step10_title = 불도깨비 - 지귀 / 갑옷스킬(ASD)
step10_help  = 지귀(ASD)는 작은 불도깨비를 소환하여 대상을 쫓아가 자폭 공격을 하는 스킬입니다. 폭파하면서 공격한 대상을 화염상태로 만듭니다.

step11_title = 불도깨비 - 인화 / 투구스킬(AD)
step11_help  = 인화(AD)는 일정 시간동안 자신을 공격한 대상을 화염상태로 만드는 스킬입니다. 유지 시간동안 공격력이 상승합니다. 스킬키(AD)를 눌러서 해제할 수 있습니다.

step12_title = 불도깨비 - 염화 / 망토스킬(AS)
step12_help  = 염화(AS)는 도깨비불로 변신해 대상을 쫓아가 공격하는 스킬입니다. 다운대상 공격이 가능하며, 방향키로 이동하고, D키는공격, S키는 하강, A키는 상승입니다.

step13_title = 불도깨비 - 국민콤보 ①
step13_help  = ★풍비박산(SD) → 내려찍기(A →D 오래누름) 풍비박산(SD)사용 중 D키를 입력해 대상 날린 후 내려찍기(A →D 오래누름)로 공격합니다.

step14_title = 불도깨비 - 국민콤보 ②
step14_help  = ★대시공격2 (->-> →D오래누름) → 점프공격(A → D) →내려찍기(A →D 오래누름)으로 마무리 합니다.

step15_title = 불도깨비 - 국민콤보 ③
step15_help  = ★대시공격2 (->-> →D오래누름) 2회 → 화둔술(D오래누름) 중 점프로 전환하여 점프공격(A → D) → 내려찍기(A →D 오래누름) → 지귀(ASD)로 마무리합니다.


[Set88]

max_step = 15

step0_title  = 구미호 - 기본소개
step0_help   = 천년의 전설을 간직한 구미호는 자신의 날카로운 손톱을 이용한 할퀴기 공격과 빠른 이동을 통한 기습 공격으로 상대방을 제압하는 레어 용병입니다.

step1_title  = 구미호 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 구미호 - 특별공격(D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 전방으로 빠르게 이동해 대상을 공격합니다. 특별 게이지가 노란색일 때만 사용이 가능하며, 사용할 때마다 게이지가 소모됩니다.

step3_title  = 구미호 - 특별공격 사용방법 ①
step3_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 특별공격은 대기, 걷기, 점프, 대시 중에도 공격키(D)오래누름으로 사용이 가능합니다.

step4_title  = 구미호 - 특별공격 사용방법 ②
step4_help   = 특별공격으로 이동을 하면 대상에게 가까이 가서 2회 연속 공격을 합니다. 이후 추가 공격키(D)키를 통해 대상을 바운딩 시키고 자신은 점프 상태로 전환됩니다.

step5_title  = 구미호 - 특별공격 사용방법 ③
step5_help   = 특별공격이 대상을 타격하면 점프 상태로 전환이 되며 점프 공격을 하거나 점프 특별 공격을 연속적으로 사용 할 수 있습니다.

step6_title  = 구미호 - 대시공격 (->-> → D + D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 손톱으로 공격합니다. 최대 3회 타격이 가능합니다.

step7_title  = 구미호 - 점프공격 - (A →D + D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 손톱으로 공격합니다. 이때 추가로 D키를 눌러 추가공격할 수 있습니다. 최대 2연타가 가능합니다.

step8_title  = 구미호 - 천년호 / 무기스킬(SD)
step8_help   = 천년호(SD)는 빠르게 전진이동하며 대상을 잡는 스킬입니다. 대상을 잡은 후에 공격키(D)연타로 추가 공격을 할 수 있고, 점프상태에서도 사용이 가능합니다.

step9_title = 구미호 - 원한 / 갑옷스킬(ASD)
step9_help  = 원한(ASD)은 자신의 중심으로 일정 범위 안의 대상에게 순간이동하여 4연속 공격하는 스킬입니다. HP가 일정량 아래로 내려가면 8연속 공격하는 스킬로 변경됩니다.

step10_title = 구미호 - 요술 / 투구스킬(AD)
step10_help  = 요술(AD)은 상태 이상을 해제하는 스킬입니다. 어떤 상황에서도 사용이 가능한 완전 회피 스킬이기 때문에 매우 유용한 스킬입니다.

step11_title = 구미호 - 나인테일 / 망토스킬(AS)
step11_help  = 나인테일(AS)은 일정 시간동안 무적파괴 효과 공격을 제외한 모든 공격과 상태이상에서 자신을 최대 5회까지 보호해주는 스킬입니다. 공중에서도 사용이 가능합니다.

step12_title = 구미호 - 국민콤보 ①
step12_help  = ★기본공격 (D →D →D →D)→ 특별공격(D오래누름 +D) 기본 공격(D →D →D →D)으로 대상을 띄운 뒤 특별공격(D오래누름 + D)로 마무리 합니다.

step13_title = 구미호 - 국민콤보 ②
step13_help  = ★대시공격 (->-> → D+D) → 특별공격 → 점프공격 대시 공격 2회로 대상을 띄운 후 특별공격(D오래)로 공격 시킨 후 점프 공격(D+D)으로 마무리합니다.

step14_title = 구미호 - 국민콤보 ③
step14_help  = ★특별공격(D오래)  → 천년호(SD) → 특별공격 (D오래) 특별 공격(D오래)으로 대상을 바운딩 시키고 천년호(SD)로 대상을 추가 공격 한후 특별공격으로 마무리합니다.


[Set89]

max_step = 18

step0_title  = 피터팬 - 기본소개
step0_help   = 피터팬은 단검을 무기로 사용하고 친구인 요정 팅커벨과 함께 하늘을 날아다니는 능력으로 상대를 제압하는 근거리 계열 용병입니다.

step1_title  = 피터팬 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 피터팬 - 비행 (D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 비행 상태로 전환이 됩니다 비행은 무기아이콘 상단의 플라이게이지가 노란색일 때만비행이 사용되며, 게이지가 소모됩니다.

step3_title  = 피터팬 - 플라이 사용방법 ①
step3_help   = 대기, 걷기, 점프 중 공격키(D)를 오래 누르고 있으면 비행 상태가 됩니다. 게이지 충전은 대기, 걷기, 대시 중에 자동으로 충전이 됩니다.

step4_title  = 피터팬 - 비행 사용방법 ②
step4_help   = 비행 시 전방으로 자동으로 이동되면서 고도가 하강합니다 A키로 고도상승을 할 수 있으며 방향키로 방향을 전환할 수 있습니다.

step5_title  = 피터팬 - 비행 사용방법 ③
step5_help   = 비행 중 공격키(D)를 누르거나, 지면에 가까이 일정시간 동안 날고 있으면 자동으로 해제됩니다. 비행상태 해제시 점프상태로 전환됩니다.

step6_title  = 피터팬 - 대시공격 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 칼로 공격합니다.

step7_title  = 피터팬 - 대시공격 확장 (->-> → D + D + D)
step7_help   = 대시 공격 후 바로 공격키(D)를 입력하여 확장공격을 할 수 있습니다. 최대 2번 더 타격 할 수 있으며, 마지막 타격에서 대상을 공중에 띄웁니다.

step8_title  = 피터팬 - 이중점프 (A 두번 누름)
step8_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step9_title  = 피터팬 - 점프공격(A →D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대각선 아래를 공격합니다. 이후 한번 더 공격키(D)눌러 추가공격을 할 수 있습니다.

step10_title  = 피터팬 - 공중대시(점프 중 ->->)
step10_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 검으로 찌르는 공격을 합니다. 공격당한 대상은 잠시동안 경직상태가 됩니다.

step11_title  = 피터팬 - 차일드 플라이 / 무기스킬(SD)
step11_help   = 차일드 플라이(SD)는 일정범위 대상들을 강제 비행하게 만드는스킬입니다. 점프 중 사용 및 다운대상 비행시키며 A키 상승, D키 날림공격을 합니다.

step12_title  = 피터팬 - 크로커다일 / 갑옷스킬(ASD)
step12_help   = 크로커다일(ASD)은 악어를 소환하여 돌아다니며 대상을 잡아먹는 스킬입니다. 일정시간이 지나거나, 타격으로 악어를 없애면 먹힌 대상을 날려버립니다.

step13_title  = 피터팬 - 에어바디 / 투구스킬(AD)
step13_help   = 에어바디(AD)는 자신 주변 범위의 대상의 몸을 가볍게 만들어, 밀림 및 날림거리가 늘어나고, 점프를 뛰면 비정상적으로 높게 띄게 만드는 스킬입니다.

step14_title  = 피터팬 - 팅커벨 소환 / 망토스킬(AS)
step14_help   = 팅커벨 소환(AS)은 팅커벨을 소환하여 상대의 스킬게이지와 이로운 버프들을 날려버리는 스킬입니다. 팅커벨은 돌아다니면서 총 4회 공격합니다.

step15_title = 피터팬 - 국민콤보 ①
step15_help  = ★차일드 플라이(SD) →비행(D오래누름) 차일드 플라이(SD)로 대상을 잡은 후 D키를 입력 해 날려버리고 비행(D오래누름)으로 마무리합니다.

step16_title = 피터팬 - 국민콤보 ②
step16_help  = ★비행(D오래누름)으로 타격 후 D키로 취소  →공중대시(점프 중 ->->) →대시공격 확장(->-> →D + D + D)으로 마무리합니다.

step17_title = 피터팬 - 국민콤보 ③
step17_help  = ★비행(D오래누름)으로 타격 후 D키로 취소   →공중대시(점프 중 ->->) →대시공격 확장(->-> →D + D + D)→ 비행(D오래누름) 후 점프공격(A →D + D)


[Set90]

max_step = 20

step0_title  = 드래곤 라이더 - 기본소개
step0_help   = 평소에는 라이더 모습을 하고 있다가, 필요한 순간에 라이딩 게이지를 사용해 드래곤을 타고 전장을 휩쓸며 상대를 제압하는 특수 계열 용병입니다.

step1_title  = 드래곤 라이더 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 드래곤 라이더 - 대시공격 (->-> D + D)
step2_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 내려치는 공격을 합니다. 추가 공격키로 추가 공격이 가능합니다.

step3_title  = 드래곤 라이더 - 점프공격(A →D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 검으로 내려치는 공격을 합니다. 점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 드래곤 라이더 - 드래곤 탑승 (D 오래누름)
step4_help   = 공격키(D)를 오래 누르면 드래곤에 탑승합니다. 드래곤에 탑승을 하면 방어파괴 공격과 특정 공격을 제외하고 피격시 모션이 나오지 않고 데미지만 입게 됩니다.

step5_title  = 드래곤 라이더 - 라이딩 게이지
step5_help   = 무기 아이콘 위에 게이지가 노란색 이상일 경우에만 탑승이 가능하며, 라이딩 게이지는 탑승 후에 지속적으로 감소되며 또한, 적에게 공격을 받았을때도 감소됩니다.

step6_title  = 드래곤 라이더 - 탑승 해제(탑승 상태에서  D 오래누름)
step6_help   = 탑승 상태에서 공격키(D)를 오래 누르면 다시 라이더로 되돌아 갑니다. 라이더로 되돌아 가면 소모되었던 라이딩 게이지가 다시 충전되기 시작합니다.

step7_title  = 드래곤 라이더 - 탑승 중 대시공격1 (->-> D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키를 누르면 대상을 잠시 경직시키는 찌르기 공격을 합니다.

step8_title  = 드래곤 라이더 - 탑승 중 대시공격2 (->-> D + D + D)
step8_help   = 탑승 중 대시공격1 사용 중 공격키를 추가 입력하면 대시 공격이 가능합니다. 총 3회 가능하며 마지막 타격은 대상을 높이 띄우는 공격을 합니다.

step9_title  = 드래곤 라이더 - 탑승 중 대시공격3 (->-> D 오래누름)
step9_help    = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키를 누르면 대상을 멀리 넉백시키는 드래곤 박치기 공격을 합니다.

step10_title  = 드래곤 라이더 - 탑승 중 점프공격1 (A →D)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 창을 휘둘러 대상을 잠시동안 경직시키는 공격을 합니다.

step11_title  = 드래곤 라이더 - 탑승 중 점프공격2 (A →D오래)
step11_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 높이 점프하여 드래곤으로 바닥을 찍어 상대를 넘어트리는 공격을 합니다.

step12_title  = 드래곤 라이더 - 라이더 스윙(SD)
step12_help   = 라이더 스윙(SD)은 빠른 속도로 상대에게 접근하여 5연속 베기 공격을 하는 스킬입니다. 라이더 스윙(SD)는 탑승을 하면 스킬이 바뀝니다.

step13_title  = 드래곤 라이더 - 드래곤 라이딩 (탑승 중 SD)
step13_help   = 드래곤 라이딩(SD)은 빠르게 앞으로 돌진하여 대상을 연속 공격하는 스킬입니다. 점프(A)키로 점프가 가능하며, 공격(D)키나 방어(S)키로 취소할 수 있습니다.

step14_title = 드래곤 라이더 - 라이더 스핀(ASD)
step14_help  = 라이더 스핀(ASD)은 몸을 회전시켜 일정 범위내 주변 대상을 경직시키는 스킬입니다. 스킬을 사용하면 라이딩 게이지를 모두 충전 시켜 줍니다.

step15_title = 드래곤 라이더 - 트랩(AD)
step15_help  = 트랩(AD)은 바닥에 덫을 설치하는 스킬입니다. 덫에 걸린 대상은 발을 잡고 아파하다가 일정 시간동안 이동에 제약을 받게되는 스킬입니다.

step16_title = 드래곤 라이더 - 후크 샷(AS)
step16_help  = 후크 샷(AS)은 석궁에 여러개의 줄달린 갈고리를 날리는 스킬입니다. 발사한 갈고리는 일정 시간뒤에 다시 되돌아오며 되돌아오는 적은 강력한 경직과 함께 끌려옵니다.

step17_title = 드래곤 라이더 - 국민콤보 ①
step17_help  = ★기본공격 (D→D→D) → 대시공격 (->->D+D) 기본공격으로 대상을 경직시킨 후 대시공격(->->D+D)으로 마무리 합니다.

step18_title = 드래곤 라이더 - 국민콤보 ②
step18_help  = ★라이딩 기본공격 → 대시공격(D오래 → D → D) 라이딩 기본공격((D→D→D)으로 대상을 경직시킨 후 대시공격(D오래 → D → D)으로 마무리합니다.

step19_title = 드래곤 라이더 - 국민콤보 ③
step19_help  = ★라이딩 대시공격 → 기본공격 → 점프공격2 라이딩 대시공격으로 대상을 띄운 후 기본 공격으로 대상을 공격 한 후 점프공격2로 마무리합니다.


[Set91]

max_step = 15

step0_title  = 서큐버스 - 기본소개
step0_help   = 꿈속의 악마인 서큐버스는 자신의 채찍을 이용해 상대를 끌어오거나 밀쳐버리는 공격과 채찍의 거리를 이용한 공격으로 상대방을 제압하는 레어 용병입니다.

step1_title  = 서큐버스 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 서큐버스 - 특별공격 (D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 전방으로 빠르게 채찍을 날려 상대를 공격합니다.특별 게이지가 노란색일 때만 가능하며 사용할 때마다 게이지가 소모됩니다.

step3_title  = 서큐버스 - 특별공격 사용방법 ①
step3_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 특별공격은 대기, 걷기, 대시 중에도 공격키(D)오래 누름으로 사용이 가능합니다.

step4_title  = 서큐버스 - 특별공격 사용방법 ②
step4_help   = 특별공격이 대상을 피격할 경우 대상은 속박되며,  공격키(D)를 눌러 대상을 내 쪽으로 끌고 올 수 있습니다.이 때 방향키 입력 시 해당방향으로 대상을 날립니다.

step5_title  = 서큐버스 - 대시공격1 (->-> D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 채찍으로 타격하는 대시 공격이 가능합니다.

step6_title  = 서큐버스 - 대시 확장공격2 (->-> D + D + D)
step6_help   = 대시공격1 중에 공격키(D)를 입력하면 대상을 발차기로 공격하여 공중에 띄우는 공격을 합니다. 한번 더 D키를 누르면 채찍으로 대상을 타격합니다.

step7_title  = 서큐버스 - 점프공격 - (A →D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 채찍으로 대각선 아래로 타격합니다.

step8_title  = 서큐버스 - 육체속박 / 무기스킬(SD)
step8_help   = 육체속박(SD)은 전방에 채찍을 날려 대상을 속박하는 스킬입니다. 연쇄공격으로 최대 4명까지 속박하며 방향키와 D키 같이 입력하면 해당방향으로 상대를 날립니다.

step9_title  = 서큐버스 - 정기흡수 / 갑옷스킬(ASD)
step9_help   = 정기흡수(ASD)는 상대에게 이동 후 정기를 흡수하여 이를 통하여 스킬 게이지를 회복할 수 있습니다. 날아갈 때 방향키로 자유로운 방향 전환이 가능합니다.

step10_title = 서큐버스 - 정기폭발 / 투구스킬(AD)
step10_help  = 정기폭발(AD)은 D키 연타로 정기를 전방에 폭발시켜 상대를 공격하는 스킬입니다. 상대를 잡은뒤에 D키 연타로 최대 낙하데미지까지 줄 수 있습니다.

step11_title = 서큐버스 - 유혹 / 망토스킬(AS)
step11_help  = 유혹(AS)은 자신 주변의 대상에게 유혹하는 기운을 발사해 자신에게 오게 만든 후 잠시 경직 상태로 만드는 스킬입니다. 넘어진 대상도 타격 가능합니다.

step12_title = 서큐버스 - 국민콤보 ①
step12_help  = ★정기흡수(ASD)→정기폭발(AD) 정기흡수(ASD)로  대상을 경직 시킨 후 →정기폭발(AD)로 잡아 D키 연타하여 낙하데미지로 마무리 합니다.

step13_title = 서큐버스 - 국민콤보 ②
step13_help  = ★정기폭발(AD)→유혹(AS)→대시 확장공격2 정기폭발 (AD)로 대상을 띄우고 →유혹(AS)으로 일으켜 →대시 확장공격2(->-> D + D + D)으로 마무리합니다.

step14_title = 서큐버스 - 국민콤보 ③
step14_help  = ★대시확장공격2(->-> D + D + D)로 상대를 데려와 → 유혹(AS) 일으켜 세우고 →정기흡수(ASD)로 경직 시킨 뒤 → 정기폭발(AD)로 마무리합니다.


[Set92]

max_step = 18

step0_title  = 사이보그 - 기본소개
step0_help   = 사이보그는 기본 상태일때 재빠른 몸놀림을 통해 공격을 하다가 특정 순간에 거대한 3종류의 중화기를 꺼내들어 진영을 초토화시키는 근거리계열 용병입니다.

step1_title  = 사이보그 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 사이보그 - 중화기 장착(D 오래누름)
step2_help   = 대기상태나 걷기 중 공격키(D)를 오래 누르고 있으면 중화기 장착 상태가 됩니다. 다시 공격키(D)를 오래누르면 해제됩니다.

step3_title  = 사이보그 - 중화기 사용방법 ①
step3_help   = 중화기는 무기아이콘 상단의 특별 게이지가 노란색일때만 중화기를 사용할 수 있습니다. A,S,D로 중화기를 사용하면 특별 게이지가 소모됩니다.

step4_title  = 사이보그 - 중화기 사용방법 ②
step4_help   = 특별 게이지는 걷기나 대기 상태에서 충전되며,게이지가 전부 소모되면 장착이 해제됩니다. 중화기를 장착 할 때 바라보는 방향을 유지한 상태로 이동 합니다.

step5_title  = 사이보그 - 중화기 기관총 사용방법
step5_help   = 중화기 장착 상태에서 공격키(D)를 누르면 총알이 3발씩 발사되고 일정량의 게이지가 감소가 됩니다. 2연속 타격시 대상이 다운됩니다.

step6_title  = 사이보그 - 중화기 런쳐 사용방법
step6_help   = 중화기 장착 중 방어키(S)를 누른 채 유지하면, 조준점이 생기고 방향키로 조준점을 움직일 수 있습니다. S키를 떼면 조준한 곳으로 런쳐미사일을 발사합니다.

step7_title  = 사이보그 - 중화기 바주카포 사용방법
step7_help   = 중화기 장착 중 점프키(A)를 누른 채 유지하면, 조준점이 생기고 방향키로 움직일 수 있습니다. A키를 떼면 조준점이 있는 곳으로 바주카포를 발사합니다.

step8_title  = 사이보그 - 대시공격1 (->-> → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시킬 수 있고 최대 3연속 타격을 할 수 있습니다.

step9_title  = 사이보그 - 대시공격2 (->-> → D오래)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 발로 올려차는 공격을 합니다.

step10_title  = 사이보그 - 점프공격(A →D)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발차기 공격을 합니다. 최대 3연속 타격을 할 수 있으며 3번째 타격은 적을 바운딩시킵니다.

step11_title  = 사이보그 - 익스플로젼 / 무기스킬(SD)
step11_help   = 익스플로젼(SD)은 적의 머리 위에 거대한 에너지포를 발사하여 분산시킨 후 바닥에서 폭발시켜 공격하는 스킬 입니다. 다운된 대상을 공격 할 수 있습니다.

step12_title  = 사이보그 - 크로스 빔 / 갑옷스킬(ASD)
step12_help   = 크로스 빔(ASD)은 지그재그로 이동하며 공격하는 빔을 발사하는 스킬입니다. 맞은 대상은 감전상태가 되어 추가 공격을 하기에 용이합니다.

step13_title  = 사이보그 - 익스큐션 / 투구스킬(AD)
step13_help   = 익스큐션(AD)을 누르면 벼락이 떨어질 공간을 지정 할수 있는 타겟존이 나타납니다. 타겟존은 방향키로 자유롭게 움직 일 수 있고 D를 누르면 공격합니다.

step14_title  = 사이보그 - 라이트닝 스텝 / 망토스킬(AS)
step14_help   = 라이트닝 스텝(AS)은 빠르게 이동하면서 지나가는 곳마다 전기를 남겨 공격합니다. 방향키로 방향을 조절 할 수 있고 A키는 점프, D,S키는 스킬을 취소합니다.

step15_title = 사이보그 - 국민콤보 ①
step15_help  = ★크로스 빔(ASD) →익스플로젼(SD) →익스큐션(AD) 크로스 빔으로 대상을 경직 시킨 후 익스플로젼으로 대상을 다운시키고 익스큐션으로 마무리합니다.

step16_title = 사이보그 - 국민콤보 ②
step16_help  = ★대시공격2(->-> →D오래누름) →점프공격(A→D) 대시공격2로 대상을 띄우고 점프 후 3연타를 성공시키면 대상을 바운딩 시킬 수 있습니다.

step17_title = 사이보그 - 국민콤보 ③
step17_help  = ★크로스 빔(ASD) →대시공격2 →익스큐션(AD) 크로스 빔으로 대상을 감전 시킨 후 대시공격2로 적을 띄우고 익스큐션으로 마무리합니다.


[Set93]

max_step = 17

step0_title  = 트리니티 - 기본소개
step0_help   = 트리니티는 블레이 블루에 등장하는 캐릭터로 아크에너미 무조령을 사용해 다양한 패턴의 공격으로 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 트리니티 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 트리니티 - 매지컬 웨폰(D 오래누름)
step2_help   = 걷기 중 공격키(D)를 오래 누르고 있으면 매지컬 웨폰 장착 상태가 됩니다. 색깔별로 다양한 종류의 공격을 할 수 있습니다.

step3_title  = 트리니티 - 매지컬 웨폰(D 누름떼기)
step3_help   = 공격키(D)를 살짝 눌렀다 떼면 총 6가지 종류의 매지컬 웨폰중 1가지가 장전되어 공격합니다. 사용횟수는 매지컬 웨폰마다 3번씩 사용할수 있습니다.

step4_title  = 트리니티 - 매지컬 웨폰(D 오래누름)
step4_help   = 공격키(D)를 오래 누르면 장착된 매지컬 웨폰의 모든 사용횟수를 소모하면서 무기를 날려 공격합니다. 매지컬 웨폰의 종류에 따라 다른 공격을 합니다.

step5_title  = 트리니티 - 매지컬 웨폰 종류별 효과1
step5_help   = 매지컬 웨폰의 종류는 총6가지로 다른효과를 가집니다. 녹색-후라이팬 (대상 경직타), 파란색-고양이(방어파괴) 노란색-폭탄(포물선으로 날가는 공격)

step6_title  = 트리니티 - 매지컬 웨폰 종류별 효과2
step6_help   = 주황색-방망이 (대상 넉백), 빨간색-망치(방어파괴,대상이 납짝하게 됩니다), 하늘색-미사일 (직선으로 날라가는 미사일 발사)이상 메지컬웨폰 종류 설명이었습니다.

step7_title  = 트리니티 - 대시공격 (->-> → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 띄우고 점프상태가 됩니다.

step8_title  = 트리니티 - 점프공격1 (A →D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 최대 3연속 타격을 할 수 있습니다.

step9_title  = 트리니티 - 점프공격2 (A →S)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 방어키(S)를 누르면 스왈로프 문을 소환해 일정시간 공중에 뜨며 키를 떼면 점프상태로 전환됩니다.

step10_title  = 트리니티 - 도트 타이푼 / 무기스킬(SD)
step10_help   = 도트 타이푼(SD)은 지팡이를 들고 회전 공격을 하며 방향키를 사용해 이동이 가능합니다. 일정횟수 이상 타격시 상대를 스턴상태로 만들게 됩니다.

step11_title  = 트리니티 - 레이어드 포스 / 갑옷스킬(ASD)
step11_help   = 레이어드 포스(ASD) 전방에 강력한 빔을 발사하며 방향키로 방향전환이 가능, D키 발사,A키 상승,S키 하강(HP15%이하 일때 공격범위가 증가합니다.)

step12_title  = 트리니티 - 드림샐리 / 투구스킬(AD)
step12_help   = 드림샐리(AD) 느리게 이동하는 물방울을 발사하며 맞은 대상을 물방울에 가두게 됩니다. 물방울에 갇힌 적은 드리블 가능하며, 점프중 사용 가능합니다.

step13_title  = 트리니티 - 드라마틱 루비 / 망토스킬(AS)
step13_help   = 드라마틱 루비(AS)는 빠르게 달려 닿은 적을 하트에 가둔 후 하트를 터트려 날려버립니다. D키 연타를 통해 데미지와 넉백 길이를 늘릴 수 있습니다.

step14_title = 트리니티 - 국민콤보 ①
step14_help  = ★대시공격 → 점프공격→ S →점프공격 대시공격으로 상대를 띄운 후 점프공격 D연타 공격후 S키로 점프상태로 만들어 점프공격으로 마무리 합니다.

step15_title = 트리니티 - 국민콤보 ②
step15_help  = ★기본공격(D →D →D →D) → 드라마틱 루비(AS) 기본공격으로 대상을 띄우고, 드라마틱 루비의 하트로 대상을 가두어 D키 연타로 마무리 합니다.

step16_title = 트리니티 - 국민콤보 ③
step16_help  = ★대시공격(->->→D)으로 상대를 띄우고, 점프공격(D,D,D)후 방어키(S)로 캔슬 후 다시 점프공격(D,D,D)→드림샐리(AD)로 묶고→레이어드 포스로 마무리합니다.


[Set94]

max_step = 19

step0_title  = 풍월주 - 기본소개
step0_help   = 풍월주는 화랑의 우두머리로 빠른 스피드를 이용해 상대에게 접근하여 바람의 힘을 사용한 스킬과 전진공격으로 상대를 제압하는 근거리 계열 용병입니다.

step1_title  = 풍월주 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 풍월주 - 점프공격1 (A →D)
step2_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 2연속 타격을 할 수 있고 대상을 경직시킵니다.

step3_title  = 풍월주 - 점프공격2 (A →D오래)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 D키를 오래누르면 대상을 넉백시키는 공격을 합니다. 다운된 대상도 공격이 가능합니다.

step4_title  = 풍월주 - 대시공격1 (->-> → D →D →D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 연타하면 대상을 띄우고 전진이동하여 내려찍는 공격을 합니다.

step5_title  = 풍월주 - 대시공격2 (->-> → D오래누름)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 오래누르면 대상을 내려찍는 공격을 합니다.

step6_title  = 풍월주 - 대시공격3 (->-> → D →D오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 D키를 누르고 다시 D키를 오래 누르면 대상을 띄우고 내려찍는 공격을 합니다.

step7_title  = 풍월주 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격키(D)를 누르면 상대를 띄우는 공격을 한 후 캐릭터는 점프상태로 전환되어 점프공격을 할 수 있습니다.

step8_title  = 풍월주 - 공격태세 게이지(D 오래누름)
step8_help   = 상대방의 공격을 맞거나 방어할 때, 상대방을 공격하면 무기 아이콘 상단의 게이지가 찹니다. 게이지가 노란색일 때 D키를 오래 누르면 공격태세가 발동됩니다.

step9_title  = 풍월주 - 공격태세(D 오래누름)
step9_help   = 공격키 D키를 오래누르면 공격태세가 발동되며 근접해있는 상대방을 공중에 띄웁니다. 공격태세일 때, 일정시간동안 이동속도, 공격력,방어력이 증가합니다.

step10_title  = 풍월주 - 전진공격 (D 누름떼기 →D →D →D →D →D)
step10_help   = 공격키(D)키를 1초가량 누르면 캐릭터가 바라보는 방향으로 빠르게 전진이동합니다. 이 때 D키를 연타하면 최대 6연속 공격을 할 수 있습니다.

step11_title  = 풍월주 - 전진공격 (D 누름떼기 →D →D →D →D →D)
step11_help   = D누름 떼기 후 공격키(D)를 연타하는 동안 대시가 가능합니다. 대시 이동 후 S키를 누르면 상대방을 띄우고 D키를 누르면 검기를 발사하여 방어파괴 공격을합니다.

step12_title = 풍월주 - 바람의 칼날 / 무기스킬(SD)
step12_help  = 바람의 칼날(SD)은 D키를 연타하여 바람의 검기를 날리는 스킬입니다. 방향키로 방향을 조종할 수 있고 D키를 오래 누르면 방어파괴가 가능한 차징공격을 합니다.

step13_title = 풍월주 - 바람의 분노 / 갑옷스킬(ASD)
step13_help  = 바람의 분노(ASD)는 바람의 힘을 모아 방출하여 주변 대상을 날려 다운시킵니다. D키를 연타하면 공격범위 공격 효과, 데미지가 증가합니다.

step14_title = 풍월주 - 바람의 보호 / 투구스킬(AD)
step14_help  = 바람의 보호(AD)는 공격을 받았을 때 대상을 날리는 스킬입니다. AD를 다시 누르면 스킬이 취소되며 피격되어 다운되었을 때에도 스킬이 해제되지 않습니다

step15_title = 풍월주 - 바람의 화살 / 망토스킬(AS)
step15_help  = 바람의 화살(AS)은 방향키로 조준 후 D키를 누르면 사정거리가 긴 바람의 화살이 발사됩니다. 대상이 화살에 스치면 넉백이되고 맞으면 폭팔합니다.

step16_title = 풍월주 - 국민콤보 ①
step16_help  = ★전진공격 → 대시공격 → 바람의 분노 전진공격 중 대시이동 후 D키로 검기를 발사해 다운시키거나 S키로 공중에 띄운 후 바람의 분노로 마무리 합니다.

step17_title = 풍월주 - 국민콤보 ②
step17_help  = ★기본공격 → 대시공격3 →바람의 화살 기본공격으로 대상을 경직시키고 대시공격3으로 다운시킵니다. 다운된 대상을 바람의 화살로 마무리합니다.

step18_title = 풍월주 - 국민콤보 ③
step18_help  = ★바람의 칼날(SD →D연타 →D오래누름) →바람의 화살 바람의 칼날 후 5연타를 한 후 D키를 오래눌러 차징 공격으로 대상을 다운시키고 바람의 화살로 마무리합니다.


[Set95]

max_step = 24

step0_title  = 윈드러너 - 기본소개
step0_help   = 윈드러너는 윈드러너 게임에 등장하는 캐릭터로,그리핀을 타고 빠르게 돌진하거나, 공중에서 상대를 공격하여 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 윈드러너 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 윈드러너 - 대시공격1 (->-> D + D)
step2_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 넉백시키는 공격을 합니다. 연속 타격을 할 수 있습니다.

step3_title  = 윈드러너 - 대시공격2 (->-> D 오래누름)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 빠른 전진 이동을 하며 부딪히는 대상을 공중에 띄웁니다.

step4_title  = 윈드러너 - 이중점프 (A 두번 누름)
step4_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step5_title  = 윈드러너 - 점프공격(A →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 넉백시키는 공격을 하고 캐릭터는 재점핑 상태가 되 연속 타격을 할 수 있습니다.

step6_title  = 윈드러너 - 반격 (방어 성공시 바로 공격)
step6_help   = 공격을 방어한 후 바로 공격키(D)를 누르면 어퍼컷으로 상대를 올려쳐 상대를 띄움 상태로 만들고 점프공격으로 연속 공격을 할 수 있습니다.

step7_title  = 윈드러너 - 그리핀 탑승 (D 오래누름)
step7_help   = 공격키(D)를 오래 누르면 그리핀에 탑승합니다. 그리핀에 탑승을 하면 방어파괴 공격과 특정 공격을 제외하고 피격시 모션이 나오지 않고 데미지만 입게 됩니다.

step8_title  = 윈드러너 - 그리핀 게이지
step8_help   = 무기 아이콘 위에 게이지가 노란색 이상일 경우에만 탑승이 가능하며, 그리핀 게이지는 탑승 후에 지속적으로 감소되며 또한, 적에게 공격을 받았을때도 감소됩니다.

step9_title  = 윈드러너 - 탑승 해제(탑승 상태에서  D 오래누름)
step9_help   = 탑승 상태에서 공격키(D)를 오래 누르면 다시 러너로 되돌아 갑니다. 러너로 되돌아 가면 소모되었던 그리핀 게이지가 다시 충전되기 시작합니다.

step10_title = 윈드러너 - 탑승 중 대시공격1 (->-> D + D)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키를 누르면 전진이동하며 대상을 부리로 찔러 경직시킨 후 공중에 띄우는 공격을 합니다.

step11_title = 윈드러너 - 탑승 중 대시공격2 (->-> →D 오래누름)
step11_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 그리핀의 몸통박치기로 상대를 공중에 띄우는 공격을 합니다.

step12_title = 윈드러너 - 탑승 중 활강 (A 세번누름)
step12_help  = 점프(A)키를 두 번 눌러 이중 점프한 상태에서 다시 점프키를 누르면 활강상태가 되어 공중에서 서서히 내려와 좀 더 멀리 이동할 수 있게 됩니다.

step13_title = 윈드러너 - 공중대시(점프 중 ->->)
step13_help  = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 부리로 찌르는 공격을 합니다. 공격당한 대상은 잠시동안 경직상태가 됩니다.

step14_title = 윈드러너 - 탑승 중 점프공격1 (A →D)
step14_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대각선 아래로 찌르기 공격을 해 대상을 바운딩시키고 캐릭터는 재점핑 되어 연속 공격이 가능합니다.

step15_title = 윈드러너 - 탑승 중 점프공격2 (A →D오래)
step15_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 회전공격을하여 상대를 잠시 경직시키고 캐릭터는 재점핑 되어 연속 공격이 가능합니다.

step16_title = 윈드러너 - 무적거인(SD)
step16_help  = 무적거인(SD)은 전진 이동하면서 부딪히는 대상을 날리는 스킬입니다. A키를 눌러 점프한 상태에서 대상과 충돌하면 재점프되고 착지할 때 바닥찍기 공격을 합니다.

step17_title = 윈드러너 - 윈드런 (탑승 중 SD)
step17_help  = 윈드런(SD)은 빠르게 앞으로 돌진해 대상을 날리고 A키를 눌러 점프 한 상태에서 대상과 충돌하면 재점핑 되고 착지할 때 바닥찍기 공격을 하고 파이어볼이 날아옵니다.

step18_title = 윈드러너 - 와이번의 격려(ASD)
step18_help  = 와이번의 격려(ASD)는 일정시간 동안 이동속도,공격력 방어력,그리핀 게이지 회복속도를 상승시켜줍니다.캐릭터가 다운되면 스킬이 해제됩니다.

step19_title = 윈드러너 - 별자석(AD)
step19_help  = 별자석(AD)은 대상을 끌어오는 스킬입니다.끌려온 대상은 캐릭터와 부딪히면 튕겨나가고 D키를 오래누르면 한꺼번에 대상을 잡고있다 D키를 떼면 튕겨나갑니다.

step20_title = 윈드러너 - 다크 콜렉터(AS)
step20_help  = 다크 콜렉터(AS)는 다크 콜렉터가 나타나 일정시간 동안 랜덤하게 돌아다니며 주변의 상대를 현혹하여 다크 콜렉터를 다니게 합니다.

step21_title = 윈드러너 - 국민콤보 ①
step21_help  = ★점프공격(A →D) →(D연타) → 무적거인(SD) 점프공격으로 재점핑 하여 연속 타격으로 상대를 경직시키고 공중에서 SD를 사용하여 마무리합니다.

step22_title = 윈드러너 - 국민콤보 ②
step22_help  = ★그리핀 기본공격 → 대시공격2 (->-> →D 오래누름) 그리핀 기본공격(D→D→D)으로 대상을 경직시킨 후 대시공격2(->-> →D 오래누름)로 마무리합니다.

step23_title = 윈드러너 - 국민콤보 ③
step23_help  = ★그리핀 대시공격1 → 점프공격1(A →D) 그리핀 대시공격으로 대상을 띄운 후 점프공격1(A →D)로 대상을 연속타격하여 다운시켜 마무리합니다.


[Set96]

max_step = 23

step0_title  = 수도승 - 기본소개
step0_help   = 수도승은 불교를 수호자로써 석장의 거리와 권각의 연타를 이용한 다양한 패턴의 공격 연계로 상대를 제압하는 근거리 계열 용병입니다.

step1_title  = 수도승 - 석장 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 수도승 - 석장 점프공격1 (A →D)
step2_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 석장으로 내려찍는 공격을 합니다. 대상을 경직시키며, 다운된 대상도 공격이 가능합니다.

step3_title  = 수도승 - 석장 점프공격2 (A →D오래)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 D키를 오래 누르면 수도승이 권각 상태로 변환되고 대상을 바닥으로 내려찍는 바운딩 공격을 합니다.

step4_title  = 수도승 - 석장 대시공격1 (->-> →D →D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 연타하면 대상을 두번 타격후 경직시킵니다.

step5_title  = 수도승 - 석장 대시공격2 (->-> → D오래누름)
step5_help   = 방향키를 빠르게 두 번 누르고 달리는 중에 공격키(D)를 오래누르면 수도승이 권각 상태로 변환되고 대상을 무릎꿇게하는 공격을 하게 됩니다.

step6_title  = 수도승 - 석장 대시공격2확장(->-> → D오래누름 → ->->)
step6_help   = 수도승이 석장 자세 대시공격2(->-> → D오래누름)을 한 후 방향키를 두번 입력하게 되면 수도승이 방향쪽으로 구르게 됩니다.

step7_title  = 수도승 - 자세변환 (D오래누름)
step7_help   = 공격키(D)를 누르고 있으면 현재와는 다른 자세로 변환되며 공격을 하게 됩니다. 특별 게이지가 노란색일 때만 사용 가능하며, 사용할 때마다 게이지가 소모됩니다.

step8_title  = 수도승 - 자세변환 확장공격 (D연타)
step8_help   = 수도승이 자세를 변환한 뒤 어떤 자세와 상관없이 공격키(D)를 연타하면 4연타 공격을 합니다.4연타의 마지막 공격은 띄움 공격을 합니다.

step9_title  = 수도승 - 권각 기본공격 (D →D →D →D)
step9_help   = 공격키(D)를 연속해서 누르면 5연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step10_title  = 수도승 - 권각 점프공격1 (A →D →D →D)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발차기 공격을 합니다. 공중에서 최대 3연속 타격을 할 수 있습니다.

step11_title  = 수도승 - 권각 점프공격2 (A →D오래)
step11_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 D키를 오래 누르면 수도승이 석장 상태로 변환되고 대상을 바닥에 내려찍는 바운딩 공격을 합니다.

step12_title  = 수도승 - 권각 대시공격1 (->-> →D →D)
step12_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 연타하면 공중제비 돌며 올려치는 공격을 합니다.

step13_title  = 수도승 - 권각 대시공격2 (->-> → D오래누름)
step13_help   = 방향키를 빠르게 두 번 누르고 달리는 중에 공격키(D)를 오래누르면 수도승이 석장 상태로 변환되고 대상을 올려치는 띄움 공격을 하게 됩니다.

step14_title  = 수도승 - 권각 대시공격2확장 (->-> → D오래누름 → ->->)
step14_help   = 수도승이 권각 자세 대시공격2(->-> → D오래누름)을 한 후 방향키를 두번 입력하게 되면 수도승이 방향쪽으로 구르게 됩니다.

step15_title  = 수도승 - 튕겨내기 (공격 받는 순간 방어)
step15_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step16_title = 수도승 - 금강나한수 / 무기스킬(SD)
step16_help  = 금강나한수(SD)는 D키를 미끄러지듯 전진하여 적을 난타하는 스킬입니다. 방향키로 방향을 조종할 수 있고 스킬 발동 중 S키를 누르면 전방위 공격을 합니다.

step17_title = 수도승 - 맹호출림 / 갑옷스킬(ASD)
step17_help  = 맹호출림(ASD)은 수도승의 기를 폭팔시켜 주변의 적을 날려버리는 스킬입니다. 대상은 다운상태가 됩니다. 피격 중이나 점프 중에도 사용할 수 있습니다.

step18_title = 수도승 - 전광석화 / 투구스킬(AD)
step18_help  = 전광석화(AD)는 전방에 대상에게 빠르게 날아가 이단 옆차기로 대상을 타격합니다. 스킬 사용 중 D키를 누르면 스킬이 중지되고 점프 상태로 전환됩니다.

step19_title = 수도승 - 퉁~바이권 / 망토스킬(AS)
step19_help  = 퉁~바이권(AS)은 전방에 대쉬하여 대상을 타격하고, 뒤에 있는 상대를 멀리 날려 버리는 기술입니다. 타격 된 대상은 기절상태가 됩니다.

step20_title = 수도승 - 국민콤보 ①
step20_help  = ★권각자세 대시공격2 → 퉁~바이권(AS) → 석장자세 대시공격2 → 전광석화(AD) → 권각자세 점프공격1 3연타로 마무리 합니다.

step21_title = 수도승 - 국민콤보 ②
step21_help  = ★석장자세 대시공격2 → 퉁~바이권(AS) → 권각자세 대시공격2 → 전광석화(AD) → 석장자세 점프공격1 1타로 마무리 합니다.

step22_title = 수도승 - 국민콤보 ③
step22_help  = ★석장상태 대시공격2→권각자세 대시공격2→퉁~바이권 →석장상태 대시공격2→권각자세 대시공격2→전광석화→맹호출림으로 마무리 합니다.


[Set97]

max_step = 16

step0_title  = 아누비스 - 기본소개
step0_help   = 아누비스는 고대 이집트의 죽음의 신으로 주술을 사용해 상대를 미라로 만들거나 창을 이용한 공격으로 대상을 제압하는 근거리 용병입니다.

step1_title  = 아누비스 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 아누비스 - 저주준비 (D누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준점이 나타납니다. 방향키를 눌러 조준점을 움직일 수 있고 원하는 위치일 때, 공격키를 떼면 마법진을 소환할 수 있습니다.

step3_title  = 아누비스 - 저주 (D누름떼기)
step3_help   = 마법진을 소환한 상태에서 공격키(D)를 살짝 눌렀다가 떼면 저주의 빛이 낙하하여 대상을 미라로 만듭니다. 미라가 된 대상에게 공격당하면 미라로 변신합니다.

step4_title  = 아누비스 - 대시공격1 (->-> →D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 경직시키는 공격을 하고 연타를 할 수 있습니다.

step5_title  = 아누비스 - 대시공격2 (->-> →D오래누름)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면 대상을 넉백시키는 공격을 할 수 있습니다.

step6_title  = 아누비스 - 점프공격1 (A →D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 위에서 아래로 창을 휘둘러 상대를 공격합니다. 공격당한 상대는 경직상태가 됩니다.

step7_title  = 아누비스 - 점프공격2 (A →D오래)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 D키를 오래 누르면 공중의 상대를 경직시켜 다운시킨 후 바닥을 내려찍어 대상을 띄웁니다. 다운된 대상도 공격가능합니다.

step8_title  = 아누비스 - 반격 (공격 받는 순간 방어)
step8_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다. 대상은 경직되면서 뒤로 밀리고 D키를 연속해서 누르면 대상을 넉 백 시키는 공격을 합니다.

step9_title  = 아누비스 - 모래파도 / 무기스킬(SD)
step9_help   = 모래파도(SD)는 모래파도를 생성하여 상대를 모래에 가두는 스킬입니다. 모래파도는 전진이동하며 다운된 대상을 공격할 수 있고 모래상태가 해제될 때 띄움상태가 됩니다.

step10_title = 아누비스 - 미라의 저주 / 갑옷스킬(ASD)
step10_help  = 미라의 저주(ASD)는 붕대를 던져 상대를 미라로 만드는 스킬입니다. 미라가 된 팀원에게 다가가면 이동속도가 느려집니다. 미라가 된 대상에게 공격당하면 미라가 됩니다.

step11_title = 아누비스 - 저승의 축복 / 투구스킬(AD)
step11_help  = 저승의 축복(AD)은 자칼을 소환하여 전방의 대상에게 달려들게 합니다. 자칼에게 공격당한 후 좌,우 방향키를 연타해야 하며, 연타에 실패하면 상태 이상에 걸립니다.

step12_title = 아누비스 - 재앙 / 망토스킬(AS)
step12_help  = 재앙(AS)은 모든 것을 먹어치우는 메뚜기떼를 소환하는 스킬입니다. 메뚜기떼는 사방으로 퍼져 나가 대상에게 달려들어 상태이상에 걸리게 합니다.

step13_title = 아누비스 - 국민콤보 ①
step13_help  = 대시공격2(->-> →D오래누름) →점프공격2(A →D오래) 대시공격2(->-> →D오래누름)으로 대상을 다운시킨 후 점프공격2(A →D오래)로 마무리합니다.

step14_title = 아누비스 - 국민콤보 ②
step14_help  = 대시공격1 (->-> →D) → D연타 → 점프공격2(A →D오래) 대시 공격으로 약경직 후 D키연타로 대상을 다운시키고 점프공격2(A →D오래)로 마무리합니다.

step15_title = 아누비스 - 국민콤보 ③
step15_help  = 점프공격1(A →D) →일반공격 →모래파도(SD) 점프공격1(A →D)로 대상을 경직시키고 일반공격으로 대상을 다운시킨 후 모래파도(SD)로 마무리합니다.


[Set98]

max_step = 17

step0_title  = 칼리 - 기본소개
step0_help   = 칼리는 드래곤 네스트의 등장하는 캐릭터로 상대의 분신 서먼퍼펫을 만들어 내어 서먼퍼펫을 타격해 상대에게 데미지를 주어 상대를 제압하는 용병입니다.

step1_title  = 칼리 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 칼리 - 스티그마 오브 커즈 (D누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며 사정거리 내 대상을 자동으로 조준하며, 조준된 상태에서 공격키를 떼면 대상에게 서먼퍼펫을 발사합니다.

step3_title  = 칼리 - 서먼퍼펫 (설명)
step3_help   = 특별공격으로 대상을 타격해 만들어진 서먼퍼펫을 타격 시 해당 대상에게 데미지가 가게 되며, 타격하여 파괴 시 대상은 강경직 상태로 전환되게 됩니다.

step4_title  = 칼리 - 스팅 브리즈1 (->-> →D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상에게 빠르게 접근하여 타격하는 대시 공격이 가능합니다.

step5_title  = 칼리 - 스팅 브리즈2 (->-> →D + D)
step5_help   = 대시공격1 중에 공격키(D)를 입력하면 대상을 팬으로 공격하여 공중에 띄우는 공격을 합니다. 대상이 공중에 띄워지기 때문에 다음 공격을 이어갈 때 유용합니다.

step6_title  = 칼리 - 터닝스탭(대시공격 중 ->->)
step6_help   = 대쉬공격 이후 방향키를 빠르게 두번 입력하면 해당방향으로 점프하며 이동합니다. 대시공격 이후 상대의 공격을 피할 때 유용합니다.

step7_title  = 칼리 - 고스트 스크림(대시공격 중 ->-> 후 D)
step7_help   = 터닝스탭 후 공격키 D키를 누르면 6방향으로 발사체를 발사하는 고스트 스크림 공격을 합니다. 공격 당한 대상은 짧은 경직 상태가 됩니다.

step8_title  = 칼리 - 팬텀스 레이지(A →D→D→D→D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 공격키(D)를 누르면 아래로 사령의 손을 날리는 공격을 합니다. 이 때 공격키(D)를 더 입력하면 최대 4타까지 추가공격이 가능합니다.

step9_title  = 칼리 - 고스트 킥 (A → ->->)
step9_help   = 점프키(A)로 점프 후 방향키를 빠르게 두 번 누르면 해당 방향으로공 대각선 하강하며 발차기 공격을 합니다. 대상을 띄우며 자신도 점프상태가 됩니다.

step10_title  = 칼리 - 리벤지 핸드 / 무기스킬(SD)
step10_help   = 리벤지 핸드(SD)는 지정된 위치를 중심으로 8방향으로 사령의 손이 뻣어 나와 대상을 중심으로 끌고가 마지막에 중심에서 터트리는 공격을합니다.

step11_title = 칼리 - 드래곤즈 소울 / 갑옷스킬(ASD)
step11_help  = 드래곤즈 소울(ASD)는 지정된 위치를 중심으로 대상을 빨아들여 중심에서 드래곤의 영혼이 대상을 타격하며, 타격된 대상은 띄워지게 됩니다.

step12_title = 칼리 - 팬텀가드 / 투구스킬(AD)
step12_help  = 팬텀가드(AD)는 자신과 자신의 주변 팀원을 경직에서 보호하는 스킬입니다. 팬텀가드 지속 시간 동안 자신과 주변 팀원, 모두가 피격 무시효과를 받습니다.

step13_title = 칼리 - 리젠트 에리어 / 망토스킬(AS)
step13_help  = 리젠트 에리어(AS)는 땅에 마법진을 설치해 해당 범위안에 대상이 접근 시 대상을 공격하는 지역을 생성하는 기술입니다.

step14_title = 칼리 - 국민콤보 ①
step14_help  = ★ 리벤지 핸드(SD) → 드래곤즈 소울(ASD) 리벤지 핸드로 상대방을 끌어온 뒤 드래곤즈 소울로 낙하데미지를 입히고 마무리합니다.

step15_title = 칼리 - 국민콤보 ②
step15_help  = ★고스트킥(A→->->) → 팬텀스레이지(A→D 4번) 고스트 킥으로 상대방을 띄운 뒤 팬텀스 레이지로 마무리합니다.

step16_title = 칼리 - 국민콤보 ③
step16_help  = ★스티그마 오브 커즈(D오래누름) → 서먼퍼펫 폭파시켜 경직→스팅 브리즈2(->-> →D + D)→ 고스트킥(A→->->)→팬텀스레이지(A →D→D→D→D)


[Set99]

max_step = 17

step0_title  = 스카디 - 기본소개
step0_help   = 스카디는 얼음 보드를 타고 상대를 얼리고, 빠른 이동을 이용하여 상대를 끊임 없는 히트 앤 런 전략으로 압박하는 특징을 가진 근거리 계열 용병입니다.

step1_title  = 스카디 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 스카디 - 아이스보드 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 아이스보드가 발동됩니다. 아이스보드는 탑승시 자동 전진이며 방향키를 이용해 방향전환이 가능하며 피격시 해제 됩니다.

step3_title  = 스카디 - 아이스보드2 (충돌)
step3_help   = 아이스보드 탑승시 상대와 부딪치면 약경직을 주고 D키 입력시 나오는 마무리 공격과 같은 넉백 공격을 하여 상대를 멀리 날려 버립니다.

step4_title  = 스카디 - 아이스보드 상태 (A,S,D)
step4_help   = 아이스보드 탑승시 A키를 누르면 점프가 발동 되며 S키는 엣지를 걸며 눈 뿌리는 공격 후 방향을 전환하며 D키 입력시 마무리 공격을 하고 일반상태로 전환됩니다.

step5_title  = 스카디 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 얼음창으로 대각선 아래로 강하게 내려찍는 점프 공격을 합니다.

step6_title  = 스카디 - 점프공격2 (A → D오래)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 한바퀴 돌며 눈 뿌리는 공격을 한 뒤 아이스보드 탑승 상태가 되어 착지 합니다.

step7_title  = 스카디 - 대시공격 (->-> + D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 잠시 경직시키는 공격을 합니다.

step8_title  = 스카디 - 대시공격2 (->-> + D + D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지해서 달리기가 발동되는 도중에 공격키(D)를 두번 누르면 대상을 공중에 띄우는 강력한 공격을 합니다.

step9_title  = 스카디 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step10_title  = 스카디 - 아이스러쉬 / 무기스킬(SD)
step10_help   = 아이스러쉬(SD)는 빠르게 이동하면서 부딪히는 대상을 얼려 버리는 스킬입니다. 아이스러쉬 역시 이동 중에 방향키를 이용해 방향 전환이 가능합니다.

step11_title  = 스카디 - 아이스타임 / 갑옷스킬(ASD)
step11_help   = 아이스타임(ASD)은 전방에 아이스 핵을 발사 후 폭팔시켜 각각의 조각에 맞은 상대방을 얼려 버리는 기술입니다. 공중에서도 사용 가능한 기술 입니다.

step12_title  = 스카디 - 아이스에이지 / 투구스킬(AD)
step12_help   = 아이스에이지(AD)는 전방에 얼음벽을 생성하여 얼음벽에 닿은 모든 대상을 얼려버리는 기술입니다. 스킬사용 후 D키 클릭시 발동되며 방향 조종이 가능합니다.

step13_title  = 스카디 - 프리즌아이스 / 망토스킬(AS)
step13_help   = 프리즌아이스(AS)는 자신 주변에 아이스 결정체들을 생성하여 주변에 오는 상대를 자동으로 공격하여 얼려버리는 기술입니다. 공중에서 사용 가능한 기술입니다.

step14_title = 스카디 - 국민콤보 ①
step14_help  = ★ 아이스보드 공격2 → 아이스에이지(AD) 아이스보드 공격2로 적에게 경직을 주고 날려 버린후에 아이스에이지(AD) 공격으로 마무리 합니다.

step15_title = 스카디 - 국민콤보 ②
step15_help  = ★ 아이스타임 → 아이스에이지 → 아이스러쉬 아이스타임으로 상대를 얼리고, 아이스에이지로 다시 얼려 아이스러쉬로 마무리 합니다.

step16_title = 스카디 - 국민콤보 ③
step16_help  = ★ 대시공격2 → 점프공격2 → 아이스러쉬(SD) 대시공격2로 상대를 띄운 후 점프공격2로 상대를 날린후에 아이스러쉬로 마무리 합니다.


[Set100]

max_step = 19

step0_title  = 악령도둑 - 기본소개
step0_help   = 악령도둑은 팔에 투영한 악령의 손을 사용하여 강력한 일격을 가하거나 악령을 소환하여 상대를 제압하는 특수계열 용병입니다.

step1_title  = 악령도둑 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 악령도둑 - 페이크 공격 (D →->->)
step2_help   = 공격키(D)를 눌러 기본공격을 하는 도중 페이크 공격을 합니다. 공격키(D)를 누른 후 방향키로 대시입력을 하면 상대를 속일 수 있는 페이크 공격이 발동됩니다.

step3_title  = 악령도둑 - 악령의 손 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 악령의 손이 나와 상대를 경직시키고 게이지를 소모합니다. D키를 바로 누르면 추가 공격을 할 수 있고 대상을 바운딩 시킵니다.

step4_title  = 악령도둑 - 악령의 점프 (D오래 + A)
step4_help   = 공격키(D)를 오래 눌러 악령의 손을 발동시킨 후 A키를 누르면 악령의 손으로 바닥을 짚어 공중으로 점프하여 점프상태로 전환됩니다.

step5_title  = 악령도둑 - 악령 게이지
step5_help   = 무기아이콘 상단에 게이지가 노란색일 때 악령의 손을 사용할 수 있습니다. 대시공격을 성공하거나 기본 공격을 성공할 때, 걷거나 서 있을 때 게이지가 회복됩니다.

step6_title  = 악령도둑 - 점프공격 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 아래서 위로 대상을 할퀴는 공격을 하여 대상을 경직시킵니다. 추가 공격을 할 수 있습니다.

step7_title  = 악령도둑 - 점프공격2 (A →D오래)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 게이지를 소모하는 악령의 손 공격을 할 수 있고 D키를 바로 누르면 대상을 바운딩 시킵니다.

step8_title  = 악령도둑 - 공중 점프 (A →D오래 + A)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 눌러 악령의 손 공격을 한 후 A키를 누르면 공중으로 점프하여 점프상태가 됩니다.

step9_title  = 악령도둑 - 공중대시(점프 중 ->->)
step9_help  = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 악령의 손으로 할퀴는 공격을 합니다. 공격당한 대상은 잠시동안 경직상태가 됩니다.

step10_title  = 악령도둑 - 대시공격 (->-> → D)
step10_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키는 공격을 합니다.

step11_title  = 악령도둑 - 반격 (방어 성공시 바로 공격)
step11_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 바닥에서 악령의 손이 솟아올라 상대를 경직시키는 공격을 합니다.

step12_title = 악령도둑 - 영혼도둑 / 무기스킬(SD)
step12_help  = 영혼도둑(SD)은 악령을 소환하여 대상의 영혼을 뺏어 먹어 잠시 동안 대상을 스턴시키는 기술입니다. 범위내에 있는 다수의 대상을 공격 할 수 있습니다.

step13_title = 악령도둑 - 악령의 손아귀 / 갑옷스킬(ASD)
step13_help  = 악령의 손아귀(ASD)는 범위내에 있는 대상을 바닥에서 솟아난 악령의 손으로 잡아 공중으로 띄운 후 대상을 바닥으로 던져 바운딩 시킬 수 있습니다.

step14_title = 악령도둑 - 포효 / 투구스킬(AD)
step14_help  = 포효(AD)는 범위내에 있는 대상의 시야를 잠시동안 멀게하는 기술입니다. 대상은 스턴상태가 되고 일정시간 동안 화면이 까맣게 변합니다.

step15_title = 악령도둑 - 스킬은뺏어야제맛 / 망토스킬(AS)
step15_help  = 스킬은뺏어야제맛(AS)은 가방에서 영혼을 발사하여 대상의 스킬을 뺏고 랜덤하게 자신의 스킬 중 하나의 게이지를 회복할 수 있는 스킬입니다.

step16_title = 악령도둑 - 국민콤보 ①
step16_help  = ★ 영혼도둑 → 악령의 손(D오래) → 악령의 손아귀 영혼도둑(SD)으로 상대를 스턴시킨 후 악령의 손으로 다운시키고 악령의 손아귀(ASD)로 마무리 합니다.

step17_title = 악령도둑 - 국민콤보 ②
step17_help  = ★ 대시공격 →악령의 손아귀 →점프공격2 (A →D오래) 대시공격으로 상대를 다운시킨 후 악령의 손아귀로 공중으로 띄운 후 점프공격2 (A →D오래)로 마무리 합니다.

step18_title = 악령도둑 - 국민콤보 ③
step18_help  = ★ 일반공격 →점프공격2(A →D오래) →점프공격 일반공격으로 상대를 띄운 후 점프공격2로 공중의 상대를 바운딩 시킨 후 점프공격으로 마무리 합니다.


[Set101]

max_step = 28

step0_title  = 진모리 - 기본소개
step0_help   = 진모리는 갓 오브 하이스쿨의 남자 주인공으로 리뉴얼 태권도를 사용하며 제천대성으로 각성해 대상을 제압하는 프리미엄 용병입니다.

step1_title  = 진모리 - 기본공격 (D → D → D  →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 진모리 - 대시공격 (->-> → D)
step2_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 리뉴얼 가위차기로 대상을 경직시킵니다.

step3_title  = 진모리 - 대시확장공격 (->-> →D + D + D)
step3_help   = 대시공격 성공 후 공격키(D)를 연속해서 누르면 확장공격을 할 수 있습니다. 리뉴얼 가위차기 후 리뉴얼 고려로 2연타를 한 후 리뉴얼 백록으로 대상을 띄울수 있습니다.

step4_title  = 진모리 - 대시특별공격 (->-> → D 오래누름)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 옆차기를하고 맞은 대상은 천천히 무릎을 꿇고 쓰러지게 됩니다.

step5_title  = 진모리 - 점프공격(A →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 위에서 아래로 날아찍어 대상을 바운딩 시킵니다. 대상을 바운딩 시킨 후 추가 공격을 할 수 있습니다.

step6_title  = 진모리 - 반격 (방어 성공시 바로 공격)
step6_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 팽이차기 2연타 공격으로 대상을 경직시킨 후 넉백시키는 공격 을 할 수 있습니다.

step7_title  = 진모리 - 옆차기 (D 누름떼기)
step7_help   = 공격키(D)를 살짝 눌렀다 떼면 옆차기로 상대를 경직시키는 공격을 합니다. 추가타를 넣기에 용이한 상태가되고 커맨드 공격을 할 수 있는 상태가 됩니다.

step8_title  = 진모리 - 호미걸이 (D 누름떼기 + →→OR ←← )
step8_help   = 공격키(D)를 살짝 눌렀다 떼 옆차기를 한 후 방향키를 연속으로 입력할 경우 호미걸이 공격이 발동되고 방어파괴 공격 후 대상을 잡을 수 있습니다.

step9_title  = 진모리 - 땅긋기 (D 누름떼기 + ↓↓OR ↑↑)
step9_help   = 공격키(D)를 살짝 눌렀다 떼 옆차기를 한 후 방향키를 연속으로 입력할 경우 땅긋기 공격이 발동되고 바닥에 누운 대상을 낮게 띄울 수 있습니다.

step10_title = 진모리 - 각성 (D 오래누름)
step10_help  = 공격키(D)를 오래 누르면 제천대성으로 각성해 금고아와 여의봉이 생깁니다.무기 스킬 게이지 상단의 각성 게이지가 노란색일 때만 제천대성으로 변신이 가능합니다.

step11_title = 진모리 - 각성상태
step11_help  = 각성 상태에서는 청룡의 각과 쌍룡의 각만 사용할 수 있으며 각성상태에서 타격을 당하면 게이지는 소모됩니다. 각성상태에서는 공격방식이 변경됩니다.

step12_title = 진모리 - 늘어나라 여의1(각성 상태에서  D 누름떼기)
step12_help  = 각성 상태에서 공격키(D)를 살짝 눌렀다 떼면 여의봉이 살짝 늘어나며 360도 회전공격을 합니다. 늘어나라 여의1 사용 시 각성 게이지를 소모하지 않습니다.

step13_title = 진모리 - 늘어나라 여의2(각성 상태에서  D 오래누름)
step13_help  = 각성 상태에서 공격키(D)를 오래 누르면 여의봉이 2배로 늘어나며 360도 회전 공격을 합니다. 늘어나라 여의2 사용 시 각성 게이지를 소모합니다.

step14_title = 진모리 - 각성 상태 중 기본공격 (D → D → D )
step14_help  = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step15_title = 진모리 - 각성 상태 중 대시공격1 (->-> → D)
step15_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키를 누르면 여의봉으로 대상을 잠시 경직시키 는 공격을 합니다.

step16_title = 진모리 - 각성 상태 중 이중 대시공격 (->-> → D + D)
step16_help  = 각성 중 대시공격1 사용 중 공격키를 한번 더 입력하면 여의봉을 잡고 대상을 돌려차기 공격을 합니다. 피격당한 대상은 넉백됩니다.

step17_title = 진모리 - 각성 상태 중 대시공격2 (->-> → D 오래누름)
step17_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키를 오래 누르면 여의봉이 길게 늘어나 대상을 다운시키는 공격을 합니다.

step18_title = 진모리 - 각성 상태 중 점프공격1(A → D)
step18_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 경직시키는 공격을 하고 바로 D키를 눌러 추가공격을 하면 대상을 다운시킵니다.

step19_title = 진모리 - 각성 상태 중 내려찍기(A → D오래)
step19_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D) 를 오래 누르면 여의봉이 굵고 길어져 바닥공격을 할 수 있고 대상은 넉백됩니다.

step20_title = 진모리 - 청룡의 각(SD)
step20_help  = 청룡의 각(SD)은 한 마리의 청룡이 나타나 일정범위를 전진이동 하는 스킬입니다. 청룡의 주위에 바람이 회오리쳐 대상을 높이 띄울 수 있습니다.

step21_title = 진모리 - 쌍룡의 각(SD)
step21_help  = 쌍룡의 각(SD)은 청룡의 각 스킬이 활성화 된 후 스킬 게이지를 한 번 더 채워 두 마리의 청룡을 내보낼 수 있습니다. 청룡의 각보다 효과와 범위가 증가합니다.

step22_title = 진모리 - 용잡기(ASD)
step22_help  = 용잡기(ASD)는 대상을 잡아 공중으로 점프 한 후 바닥에 대상을 내리 꽂는 스킬입니다. 바닥에 내리 꽂힌 대상은 바운딩 됩니다. 다운된 대상을 공격 할 수 있습니다.

step23_title = 진모리 - 나봉침류 혈맹봉침(AD)
step23_help  = 나봉침류 혈맥봉침(AD)은 순식간에 대상의 혈맥을 짚어 경직시키는 스킬입니다. 대상이 혈맥을 공격당해 경직 상태가 되므로 추가 공격을 하기에 용이합니다.

step24_title = 진모리 - 진 회축(AS)
step24_help  = 진 회축(AS)은 대상을 바람에 가둬 연속 타격하는 스킬입니다. 다운된 대상에게 공격이 가능하고 다운된 대상을 기립시킬 수 있습니다.

step25_title = 진모리 - 국민콤보 ①
step25_help  = ★점프공격(A →D) →진 회축(AS) →쌍룡의 각(SD) 점프공격(A →D)으로 대상을 다운시킨 후 진 회축(AS) 대상을 일으켜 세운 후 쌍룡의 각(SD)으로 마무리합니다.

step26_title = 진모리 - 국민콤보 ②
step26_help  = ★대시특별공격(->-> → D 오래누름) → 용잡기(ASD) → 점프공격(A→D) → 진 회축(AS)으로 상대를 기립시킨 후 → 점프공격(A→D)으로 마무리 합니다.

step27_title = 진모리 - 국민콤보 ③
step27_help  = ★대시특별공격(->-> → D오래)→점프공격(A→D)→ 진 회축(AS)→점프공격(A→D)→용잡기(ASD)→나봉침류 혈맥봉침(AD)→청룡의 각(SD)로 마무리합니다.


[Set102]

max_step = 17

step0_title  = 뱀파이어 - 기본소개
step0_help   = 뱀파이어는 트리실베니아의 귀족출신으로 박쥐로 변신해 유리한 위치로 이동하여 공중 콤보와 흡혈 능력으로 상대를 제압하는 레어 용병 입니다.

step1_title  = 뱀파이어 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 뱀파이어 - 박쥐 변신 (D 오래누름)
step2_help   = 공격키(D)를 일정시간 누르면, 게이지를 소모하여 박쥐로 변신해 이동(방향키,상승A,하강S)하며 일정시간이 지나거나 공격키(D)를 누르면 변신상태가 해제 됩니다.

step3_title  = 뱀파이어 - 반격 (방어 성공시 바로 공격)
step3_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 반격 성공시 상대의 체력을 뺏어오는 물기 공격을 하며 연타 약공격을 반격하면 실패할 확률이 높습니다.

step4_title  = 뱀파이어 - 대시공격 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 잠시 경직시키는 공격을 합니다.

step5_title  = 뱀파이어 - 대시 확장공격 (->-> D →D )
step5_help   = 방향키를 빠르게 두 번 누르고 유지해서 달리기가 발동 되는 도중에 공격키(D)를 두번 누르면 대상을 공중에 띄우는 강력한 공격을 합니다.

step6_title  = 뱀파이어 - 대시 중 박쥐 변신(->-> →D 오래누름)
step6_help   = 대시 상태에서 공격키(D)를 오래 누르면 박쥐로 변신해 하여 이동합니다. 박쥐 상태 해제 시 점프 상태가 되어, 게이지가 있을 시 재사용이 가능합니다.

step7_title  = 뱀파이어 - 점프공격(A →D 연타)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 검으로 대상을 공격을 합니다. 최대 4타 공격 가능하며, 4타에서 강하게 내려찍는 공격을 합니다.

step8_title  = 뱀파이어 - 점프 중 박쥐 변신(A →D 오래누름)
step8_help   = 점프 상태에서 공격키(D)를 오래 누르면 박쥐로 변신해 하여 이동합니다. 박쥐 상태 해제 시 점프 상태가 되어, 게이지가 있을 시 재사용이 가능합니다.

step9_title  = 뱀파이어 - 이중점프 (A 두번 누름)
step9_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step10_title  = 뱀파이어 - 노스페라투(SD)
step10_help   = 노스페라투(SD)는 전방에 붉은 회오리를 소환하여 상대를 띄우고, 매회 공격마다 상대의 체력을 뺏는 흡혈 공격을 합니다. 공중도 사용이 가능합니다.

step11_title  = 뱀파이어 - 안개화(ASD)
step11_help   = 안개화(ASD)는 뱀파이어가 타격에 맞지 않는 안개로 변신하여 이동하며 공격키(D)를 누르면 주변대상에게 순간 이동해 공격을 하며 변신상태가 해제 됩니다.

step12_title = 뱀파이어 - 흡혈(AD)
step12_help  = 흡혈(AD)은 사용시 잠시 무적이 되며 주변대상을 땡겨와 상대의 체력을 뺏는 흡혈 공격을 합니다. 주변에 성공한 상대가 많을수록 뺏는 체력도 증가합니다.

step13_title = 뱀파이어 - 라이징 로즈(AS)
step13_help  = 라이징(AS)는 장미 넝쿨을 소환하여 상대를 붙잡은 뒤 바닥으로 내려찍어 대상을 바운딩 시키는 공격을 합니다. 공중도 가능하며 넘어진 대상도 공격이 가능합니다.

step14_title = 뱀파이어 - 국민콤보 ①
step14_help  = ★ 대시 확장공격 (->-> D →D ) → 대상을 띄운 뒤에 점프공격 (A →D 연타) 으로 4타로 상대를 바닥 내려친 뒤 노스페라투(SD)로 공격을 마무리 합니다.

step15_title = 뱀파이어 - 국민콤보 ②
step15_help  = ★ 라이징 로즈(AS)→노스페라투(SD)→점프공격(A→D) 라이징 로즈(AS) 대상을 3번 바운딩 시킨 뒤 노스페라투 대상을 띄우고 점프공격으로 마무리 합니다.

step16_title = 뱀파이어 - 국민콤보 ③
step16_help  = ★ 대시 확장공격으로 대상을 띄운 뒤에 점프공격(A →D 연타)를 3타까지 때리고 박쥐 변신을 한 뒤 다시 점프공격을 때리고, 노스페라투(SD)로 마무리 합니다.


[Set103]

max_step = 16

step0_title  = 프로젝트k - 기본소개
step0_help   = 프로젝트k는 가시를 자유자재로 조종하거나 상대를 바이러스에 감염시키고 손에 박힌 칼을 순간적으로 늘어나게해 상대를 제압하는 특수 용병 입니다.

step1_title  = 프로젝트k - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 프로젝트k - 가시지옥 (D 오래누름)
step2_help   = 공격키(D)를 일정시간 누르면, 게이지를 소모하여 가시를 발사해 대상을 바이러스에 감염시킵니다. 감염된 대상의 몸에서 가시가 발사되어 연쇄 공격이 가능합니다.

step3_title  = 프로젝트k - 감염
step3_help   = 가시지옥 공격에 당한 대상은 일정시간 뒤에 폭파되거나 감염된 대상이 공격키(D)를 누를 경우 즉시 폭파되어 대상을 다운시킵니다.

step4_title  = 프로젝트K - 대시공격1 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 잠시 경직시키는 공격을 합니다.

step5_title  = 프로젝트K - 대시 확장공격 (->-> D →D →D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지해서 달리기가 발동되는 도중에 공격키(D)를 세 번 누르면 대상을 넉백시키는 공격을 합니다.

step6_title  = 프로젝트K - 대시공격2 (->-> →D 오래누름)
step6_help   = 대시 상태에서 공격키(D)를 오래 누르면 캐릭터가 회전하며 전진이동하고 순간적으로 칼이 늘어나 대상을 타격하고 대상은 띄움상태가 됩니다.

step7_title  = 프로젝트K - 점프공격(A →D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 올려치는 공격을 합니다. 피격된 대상은 잠시 경직되고 추가 공격을 하면 대상은 다운 됩니다.

step8_title  = 프로젝트K - 점프공격2(A →D 오래누름)
step8_help   = 점프 상태에서 공격키(D)를 오래 누르면 대상을 넉백시키는 공격을 합니다. 순간적으로 칼의 길이가 늘어나 범위가 넓어지고 다운된 대상도 공격이 가능 합니다.

step9_title = 프로젝트K - 스팅헬(SD)
step9_help  = 스팅헬(SD)은 캐릭터 주변 일정지역 바닥에 가시를 솟게해 대상을 공중으로 띄우고, 스킬모션이 끝나기 전에 공격키(D)를 누르면 감염된 대상을 포박할 수 있습니다.

step10_title = 프로젝트K - 스텁인스팅(ASD)
step10_help  = 스텁인스팅(ASD)은 몸 주변에 촉수를 두르고 일정시간 방향키를 조작하여 이동하면서 D키를 누르면 주변에 가시를 뻗어 피격된 대상을 공중에 띄웁니다.

step11_title = 프로젝트K - 매드니스(AD)
step11_help  = 매드니스(AD) 사용시 일정시간 동안 상대에게 공격받은 데미지의 일정량을 자신의 스킬 게이지로 전환해 스킬회복 속도가 빨라집니다.

step12_title = 프로젝트K - 인펙션(AS)
step12_help  = 인펙션(AS)은 일정범위 내의 대상에게 가시를 발사하고 피격된 대상의 몸에서 가시가 솟아납니다. 솟아난 가시는 자신의 숙주를 연타합니다.

step13_title = 프로젝트K - 국민콤보 ①
step13_help  = ★ 대시공격2 (->-> →D 오래누름) → 대상을 띄운 뒤에 점프공격(A →D)로 상대를 다운시킨 뒤 스팅헬(SD)로 마무리 공격을 합니다.

step14_title = 프로젝트K - 국민콤보 ②
step14_help  = ★ 기본공격 (D → D → D → D) 대상을 다운시킨 뒤 →가시지옥 (D 오래누름)로 대상을 일으켜 세운 뒤 인펙션(AS)으로 마무리 공격을 합니다.

step15_title = 프로젝트K - 국민콤보 ③
step15_help  = ★ 대시 확장공격 (->-> D →D →D) → 대상을 다운시킨뒤 → 가시지옥 (D 오래누름)으로 다운된 대상을 기립시킨 뒤  →점프공격2(A →D 오래누름)로 마무리 합니다.


[Set104]

max_step = 19

step0_title  = 하쿠멘 - 기본소개
step0_help   = 하쿠멘은 블레이블루의 6영웅중 한명으로 드라이브-참신의 카운터를 이용해 각종 연속 공격으로 상대를 제압하는 근거리 계열의 프리미엄 용병입니다.

step1_title  = 하쿠멘 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 하쿠멘 - 참신-지상(D 오래누름)
step2_help   = 공격키(D)를 오래누르고 있으면 방어상태가 되고 이후 상대의 기본공격이 타격 되면, 카운터 공격이 발동됩니다. 대상을 뒤로 넘겨 바운딩시키는 공격을 합니다.

step3_title  = 하쿠멘 - 참신-공중(D 오래누름)
step3_help   = 공격키(D)를 오래누르고 있으면 방어상태가 되고 이후 상대의 기본공격이 타격 되면, 카운터 공격이 발동됩니다. 대상을 위로 올려치는 띄움 공격을 합니다.

step4_title  = 하쿠멘 - 대시공격-연꽃(->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 경직시키는 2연타 넉백 공격이 발동됩니다.

step5_title  = 하쿠멘 - 대시공격-홍련(->-> D + D)
step5_help   = 대시공격-연꽃의 1타 이후 2타가 나오기전 D키 입력시 추가 공격이 발동됩니다. 연꽃의 1타 후 홍련 성공시 피격 대상은 무릎꿇기 효과가 발동됩니다.

step6_title  = 하쿠멘 - 대시이동-귀축(->-> →D오래누름)
step6_help   = 귀축은 달리기 도중 D키를 오래 입력시 방향키쪽으로 순간 대쉬를 합니다. 연꽃의 1타 후 2타 전에도 가능하며이 후 염마로 이어지는 공격이 가능합니다.

step7_title  = 하쿠멘 - 대시확장-염마(귀축 →D)
step7_help   = 염마는 대시이동 기술인 귀축 이후 D키 입력시 방향키쪽으로 대상을 띄우는 공격을 합니다. 한쪽방향으로 귀축과 염마를 같이쓰면 대상에게 빠르게 접근할 수 있습니다.

step8_title  = 하쿠멘 - 점프공격-동백(A → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 사선으로 타격하는 점프 공격을 합니다. 공중에 뜬 대상은 바닥으로 내려치게 됩니다.

step9_title  = 하쿠멘 - 점프공격-반딧불(A →D 누름떼기)
step9_help   = 점프상태에서 D키를 살짝 눌렀다 떼면 대상을 공중으로 띄우는 반딧불 공격을 합니다. 거리를 재서 지면에 내려오며 쓰면 지상에 대상도 공격이 가능합니다.

step10_title  = 하쿠멘 - 공중대시 (A → ->->)
step10_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 캐릭터가 보는 방향을 유지하면서 방향키 방향으로 공격합니다.

step11_title  = 하쿠멘 - 튕겨내기 (공격 받는 순간 방어)
step11_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step12_title  = 하쿠멘 - 질풍 (SD)
step12_help   = 질풍(SD)은 일직선으로 기의 파동을 보내 대상을 날리는 스킬입니다. 발동 후 D키 유지 시간에 비례하여 대상을 더 멀리 날려버리는것이 가능합니다.

step13_title  = 하쿠멘 - 악멸 (ASD)
step13_help   = 악멸(ASD)은 카운터 자세에서 상대방이 공격을 하면 자신 주변으로 범위 공격을 하는 카운터 스킬입니다. 스킬 공격도 카운터로 발동이 가능합니다.

step14_title  = 하쿠멘 - 몽환(AD)
step14_help   = 몽환(AD)은 일정시간 동안 이동속도,공격력,방어력을 상승시켜주며 하쿠멘의 드라이브-참신의 게이지도 모두 회복시켜주는 스킬입니다.

step15_title  = 하쿠멘 - 설풍(AS)
step15_help   = 설풍(AS)은 카운터 자세에서 상대방의 일반공격에 반응해 일직선 타격을 하여 일정시간 경직 후 대상에 띄움 공격을 합니다. 피격중 사용이 가능합니다.

step16_title  = 하쿠멘 - 국민콤보 ①
step16_help   = ★연꽃(->-> D) → 홍련(추가 D) → 질풍 풀차징 (SD) 연꽃1타 후 홍련을 성공시켜 대상을 경직 후 질풍(SD)를 풀 차징해 대상을 멀리 날려 마무리 합니다.

step17_title  = 하쿠멘 - 국민콤보 ②
step17_help   = ★참신-지상(D 오래누름)을 성공시켜 대상을 넘긴뒤→ 공중대시(A → ->->)2회 후→ 동백(A→D)으로 바닥에 내려찍어 → 연꽃(->-> D)으로 마무리 합니다.

step18_title  = 하쿠멘 - 국민콤보 ③
step18_help   = ★귀축(->->→D오래누름)이동→염마(귀축→D)로 대상을 띄운 후→공중대시(A→->->)2회 후→동백(A→D)으로 바닥에 내려찍어→연꽃(->-> D)으로 마무리 합니다.


