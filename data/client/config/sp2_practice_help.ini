step2_title  = 블랙 스피어 - 차지 스피어 (D 누름유지)
step2_help   = 공격키(D)를 오래 누르면 차징상태가 되고, 공격키(D)를 떼면 방향전환이 가능한 연타 돌진공격을 합니다. 풀차징 시 마지막 타격에서 넉백 공격을 합니다.

step3_title  = 블랙 스피어 - 점프공격 (A → D → D→ D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 경직시키고 마지막 타격시 상대를 띄웁니다.

step4_title  = 블랙 스피어 - 점프 대시공격 (점프 중 ->-> )
step4_help   = 점프중에 방향키를 빠르게 2번 입력하면 입력된 방향으로 빠르게 공격합니다. 최대 3회까지 점프 대시가 가능합니다.

step5_title  = 블랙 스피어 - 내려찍기  (A → D 오래누름)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 하강하면서 블랙 스피어로 대상을 내려찍는 공격을 합니다. 다운대상도 타격이 가능합니다.

step6_title = 블랙 스피어 - 대시공격1 (->-> → D →D )
step6_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 상대를 경직 시키고 마지막 타격시 밀어낼 수 있습니다.

step7_title = 블랙 스피어 - 대시공격2 (->-> →D 오래누름)
step7_help  = 대시 상태에서 공격키(D)를 오래 누르면 전진이동하며 내려치는 공격을 합니다. 다운된 대상을 공격할 수 있으며 바운딩 공격을 합니다.

step8_title = 블랙 스피어 - 낙인
step8_help  = 낙인은 블랙스피어가 사용하는 공격에 피격 시 대상에게 낙인을 겁니다. 최대 5회까지 중첩하여 걸 수 있습니다.

step9_title = 블랙 스피어 - 낙인 발동
step9_help  = 특정행동 중 방어키(S)를 누르면 무기아이콘 상단의 낙인 발동 개수만큼 낙인을 발동시킬 수 있습니다. 낙인이 발동되면 중첩된 낙인의 수만큼 하늘에서 창이 떨어지게 됩니다.

step10_title = 블랙 스피어 - 반격 (방어 성공시 바로 공격)
step10_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step11_title = 블랙 스피어 - 러시 스피어 / 무기스킬(SD)
step11_help  = 러시 스피어(SD)는 전방으로 3회를 찌른 후 창을 던지는 스킬입니다. 방향키로 방향을 조종할 수 있고 발동 중 S키를 누르면 바로 창을 던집니다.

step12_title = 블랙 스피어 - 블랙 스피어 / 갑옷스킬(ASD)
step12_help  = 블랙 스피어(ASD)는 공중으로 올라가 대상에게 블랙 스피어를 던져 공격하는 스킬 입니다. D키 누름 시 공격, A키 누름 시 상승, S키 누름 시 하강하게 됩니다.

step13_title = 블랙 스피어 - 검은 흔적 / 투구스킬(AD)
step13_help  = 검은흔적(AD)는 블랙 스피어를 이동시켜 흔적을 남긴 대상에게 창을 내리 꽂는 공격을 하는 스킬입니다. 방향키로 이동시키며, A키 누름 시 상승 S키 누름 시 하강, D키 누름 시 공격을 할 수 있습니다.

step14_title = 블랙 스피어 - 무한의 창 / 망토스킬(AS)
step14_help  = 무한의 창(AS)은 공중으로 올라가 일정 지역에 창을 쏟아내는 공격을 하는 스킬입니다. 공중에서 사용 가능하며, 방향키로 창으로 공격하는 지역을 이동시킬 수 있으며, D키 누름 시 거대한 창을 던집니다.

step15_title = 블랙 스피어 - 국민콤보 ①
step15_help  = ★기본타로 띄운 후 → 점프 공격으로 3회 공격 한 후 → 점프 대시 공격으로 대상을 타격 합니다.

step16_title = 블랙 스피어 - 국민콤보 ②
step16_help  = ★대시공격2로 대상을 바운딩 시킨 후→점프공격과 점프 대시 공격을 3회 번갈아 가면서 공격 후 → 내려찍기 공격과 동시에 낙인을 발동시켜 대상을 경직 시킨 후 → 러시 스피어로 날려 마무리 합니다.


[Set169]
max_step = 17

step0_title  = 메피스토 - 기본소개
step0_help   = 메피스토는 육체와 영혼을 분리시켜 상대를 혼란시키고 연옥의 불꽃으로 상대를 제압하는 유니크 용병 입니다.

step1_title  = 메피스토 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 메피스토 - 영혼분리 (D 오래누름)
step2_help   = 지상, 점프 중 공격키(D)를 오래 누르면 있던 자리에 자신의 분신을 남기고 영혼상태가 되는 영혼분리가 발동됩니다. 점프키를 누르면 상승, 방어키를 누르면 하강합니다.

step3_title  = 메피스토 - 영혼분리 (D 오래누름)
step3_help   = 영혼분리는 피격중, 방어중, 다운중에도 사용이 가능하지만, 남은 게이지를 모두 소진하게 됩니다. 유지시간 중 공격키(D)를 다시 누르면 불기둥으로 공격합니다.

step4_title  = 메피스토 - 점프공격 (A → D → D → D →D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 경직시키고 마지막 타격시 상대를 바운딩 시킵니다.

step5_title  = 메피스토 - 점프 대시공격 (점프 중 ->-> )
step5_help   = 점프중에 방향키를 빠르게 2번 입력하면 입력된 방향으로 빠르게 하강하면서 공격합니다. 공격키(D)를 한번 더 누르면 불기둥을 소환하여 띄우는 공격을 합니다.

step6_title  = 메피스토 - 대시공격1 (->-> → D → D → D → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 상대를 경직 시키고 마지막 타격시 띄울 수 있습니다.

step7_title  = 메피스토 - 대시공격2 (->-> → D 누름유지)
step7_help   = 대시 상태에서 공격키(D)를 오래 누르고 있으면 주변에 불덩이를 하나씩 생성합니다. 공격키(D)를 떼면 생성된 불덩이가 발사되며 피격된 상대는 끌려오게 됩니다.

step8_title  = 메피스토 - 특별게이지
step8_help   = 특별게이지는 영혼분리 사용 시 40, 대시공격2 사용 시 유지시간 당 감소하며 발사 시 90을 소진하게 됩니다.

step9_title  = 메피스토 - 반격(방어 성공시 바로 공격)
step9_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step10_title = 메피스토 - 연옥의 검 / 무기스킬(SD)
step10_help  = 연옥의 검(SD)은 전방으로 검을 발사하여 상대를 밀고 나간 후 불덩이를 떨어트려 공격하는 스킬입니다. 점프 중에도 사용이 가능합니다.

step11_title = 메피스토 - 연옥의 화염 / 갑옷스킬(ASD)
step11_help  = 연옥의 화염(ASD)은 주위를 맴돌며 공격하는 지옥의 화염을 소환하여 공격하는 스킬입니다. 스킬 사용 후 공격키(D)를 누르면 불덩이가 하나씩 생성됩니다.

step12_title = 메피스토 - 연옥의 비명 / 투구스킬(AD)
step12_help  = 연옥의 비명(AD)은 적들을 추적하여 공격하는 불기둥을 소환하여 공격하는 스킬입니다. 연속으로 공격하다가 마지막 공격 시 상대를 높게 띄워 올립니다.

step13_title = 메피스토 - 업화의 구 / 망토스킬(AS)
step13_help  = 업화의 구(AS)는 불덩이로 변신하여 이동하면서 불덩이로 공격하는 스킬입니다. 사용 후 방향키와 공격키를 통해 이동 및 공격이 가능합니다.

step14_title = 메피스토 - 국민콤보 ①
step14_help  = ★연옥의 비명(AD) → 연옥의 검(SD) 연옥의 비명으로 연속공격한 후 떨어지면 연옥의 검으로 밀어내며 마무리합니다.

step15_title = 메피스토 - 국민콤보 ②
step15_help  = ★업화의 구(AS) → 연옥의 검(SD) 업화의 구로 연속공격한 후 연옥의 검을 발사하여 마무리 합니다.

step16_title = 메피스토 - 국민콤보 ③
step16_help  = ★영혼분리(D오래누름 → D) → 점프공격(A → Dx4) → 점프대시(A → ->-> → D) 영혼분리로 상대를 띄운 후 점프 공격으로 바운딩시킨 다음 점프대시로 마무리 합니다.


[Set170]

max_step = 32

step0_title  = 던전앤파이터 거너 - 기본소개
step0_help   = 던전앤파이터 거너는 던전앤파이터 게임에 등장하는 캐릭터로 총과 각종 과학력을 사용한 다양하고 강력한 공격으로 상대를 제압하는 프리미엄 캐릭터입니다.

step1_title  = 던전앤파이터 거너 - 패시브 기능 ① (위기의 랜드러너)
step1_help   = 던전앤파이터 거너는 상대에게 피격시 일정 확률로 랜드러너라는 로봇을 소환합니다. 랜드러너는 상대를 찾아 공격 후 폭파 공격을 합니다.

step2_title  = 던전앤파이터 거너 - 기본공격(D → D → D → D)
step2_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step3_title  = 던전앤파이터 거너 - 잭스파이크(D 살짝누름)
step3_help   = D키를 살짝 누르면 전방에 대상을 무릎으로 올려치는 공격을 합니다. 발동 시 순간 슈퍼아머(방어가능공격무시)가 발동되어 반격에 용이합니다.

step4_title  = 던전앤파이터 거너 - 장전 준비(D 오래누름)
step4_help   = D키를 오래 누르면 수류탄을 장전 준비하게 됩니다. 이 후 추가 방향키 조작으로 수류탄 선택이 가능합니다.

step5_title  = 던전앤파이터 거너 - 파열류탄(D 오래누름 + ↑)
step5_help   = 장전 준비 중 방향키 ↑를 입력시 파열류탄이 장전되고 추가 D키 입력시 상대를 띄우는 파열류탄을 발사합니다.
               
step6_title  = 던전앤파이터 거너 - 섬광류탄(D 오래누름 + ←)
step6_help   = 장전 준비 중 방향키 ←를 입력시 섬광류탄이 장전되고 추가 D키 입력시 상대를 눕히는 섬광류탄을 발사합니다. 섬광류탄에 맞은 대상은 방어력이 감소 됩니다.

step7_title  = 던전앤파이터 거너 - 빙결류탄(D 오래누름 + →)
step7_help   = 장전 준비 중 방향키 →를 입력시 빙결류탄이 장전되고 추가 D키 입력시 상대를 얼리는 빙결류탄을 발사합니다. 빙결류탄에 맞은 대상은 그상태로 얼게 됩니다.

step8_title  = 던전앤파이터 거너 - 윈드밀 (->-> → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키는 윈드밀 공격이 발동됩니다.

step9_title  = 던전앤파이터 거너 - 마하킥 (->-> → D → D)
step9_help   = 달리는 중에 공격키를 눌러 윈드밀 공격을 발동 시킨 후 추가로 공격키를 입력하면 첫번째 윈드밀 공격과 연결되는 마하킥 공격이 발동됩니다.

step10_title  = 던전앤파이터 거너 - 라이징샷(->-> → D → D → D)
step10_help   = 마하킥 공격 발동중 추가 공격키를 입력하면 마하킥 공격과 연결되는 라이징 샷 공격을 하여, 대상을 높게 띄우는 공격을 합니다.
               
step11_title  = 던전앤파이터 거너 - 고각도 슬라이딩 (->-> → D 오래누름)
step11_help   = 대시 상태에서 공격키(D)를 오래 누르면 전방으로 미끄러지듯 슬라이딩 태클을 합니다. 태클 공격에 피격된 대상은 높게 떠 추가 공격에 용이합니다.

step12_title  = 던전앤파이터 거너 - 공중사격(A → D → D → D → D )
step12_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중사격 공격이 발동됩니다. 최대 4연타가 가능하며, 총에 반동에 의해 뒤로 조금씩 밀립니다.

step13_title  = 던전앤파이터 거너 - 데들리 어프로치 (방어 성공시 바로 공격)
step13_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 상대 뒤로 돌아가며, 사격을 3발 합니다. 강공격에 더욱 잘 발동됩니다.

step14_title  = 던전앤파이터 거너 - 커맨드 기능 ①
step14_help   = 기본공격, 대시공격, 특별공격, 반격, 점프착지, 커맨드 공격 중에 지정된 방향키를 연속으로 입력하면 커맨드 및 스킬 공격을 즉시 발동 시킬 수 있습니다.

step15_title  = 던전앤파이터 거너 - 커맨드 기능 ②
step15_help   = 커맨드에 사용되는 방향키는 상하좌우(↑↓←→) 4개이며 캐릭터 방향과 관계 없이 입력키 그대로 적용하여 커맨드 기능을 발동 시킵니다.

step16_title = 던전앤파이터 거너 - 슈타이어 대전차포 (→ ←)
step16_help  = 전방으로 중화기를 발사해 상대 몸에 폭탄을 박습니다. 일정시간 뒤에 폭발과 함께 피격된 대상은 띄워집니다.

step17_title = 던전앤파이터 거너 - 헤드샷 (↓ →)
step17_help  = 전방으로 회심의 총알을 발사합니다. 헤드샷은 방어 파괴 공격이며 피격된 대상은 밀림상태가 됩니다.

step18_title = 던전앤파이터 거너 - C4 원격조작 (↓ ←)
step18_help  = 전방으로 C4를 설치합니다. 최대 3번까지 가능 하며, 중첩 될때마다 폭파까지 걸리는 시간이 감소됩니다.

step19_title = 던전앤파이터 거너 - 백스텝 (← ←)
step19_help  = 사용자가 바라 보는 방향의 반대로 뜁니다. 연속적으로 가능하며, 상대와 거리를 벌리기에 용이합니다.

step20_title = 던전앤파이터 거너 - 백스텝2 (→ →)
step20_help  = 사용자가 바라 보는 방향으로 뜁니다. 연속적으로 가능하며, 상대의 뒤로 돌아가기에 용이합니다.

step21_title = 던전앤파이터 거너 - 윈드밀 (↓ ↓)
step21_help  = 전방으로 윈드밀 공격을 합니다. 최대 2번까지 가능하며, 2연타 공격을 합니다.

step22_title = 던전앤파이터 거너 - 에어레이드 (↓ ↓ + D)
step22_help  = 윈드밀 도중 추가 공격키 입력시 상대를 띄우는 에어레이드 공격을 합니다. 다운 대상을 띄우기 용이합니다.

step23_title = 던전앤파이터 거너 - 바베큐 (→ ↓ ← →)
step23_help  = 전방의 대상을 공중에 날려 보내어 개틀링 건을 꺼내 사격을 퍼붓습니다. 방어가능 공격이지만 공중에 뜬 대상도 공격이 가능합니다.

step24_title = 던전앤파이터 거너 - 퍼니셔 (↓ ← ↑)
step24_help  = 전방에 대상을 잡아서 밟고 사격하는 공격이 발동됩니다. 퍼니셔는 상대의 방어를 무시하고 공격할 뿐만 아니라 공중에 뜬 대상을 다운시킬 수 있습니다.

step25_title  = 던전앤파이터 거너 - 제압사격 / 무기스킬(SD)
step25_help   = 제압사격(SD)은 전방의 일정 영역에 무차별 사격을 하고, 마지막에 대상을 멀리 넉백시키는 스킬입니다. 다운된 대상도 공격이 가능합니다.

step26_title  = 던전앤파이터 거너 - 버스터 빔/ 갑옷스킬(ASD)
step26_help   = 버스터 빔(ASD)은 후방으로 뛰어 올라 레이저로 대상을 밀어낸 뒤에 충전된 레이져를 공격 후 폭파시키는 스킬입니다. 다운 대상도 공격이 가능합니다.

step27_title  = 던전앤파이터 거너 - 메카 드롭 / 투구스킬(AD)
step27_help   = 메카 드롭(AD)은 무전을 이용해 공중으로 부터 랜드 러너를 지원 받습니다. 바닥으로 떨어진 랜드러너는 주변의 공격 할 대상을 찾아 공격합니다.                

step28_title = 던전앤파이터 거너 - 네이팜 탄 / 망토스킬(AS)
step28_help  = 네이팜 탄(AS)은 전방의 위치에 네이팜을 쏘아 강력한 화염지대를 만듭니다. 대상이 화염지대에 들어 가면 지속적인 공격이 발동 됩니다.

step29_title = 던전앤파이터 거너 - 국민콤보 ①
step29_help  = ★네이팜 탄(AS) → 제압사격(SD) 네이팜 탄(AS)로 대상을 불태우는 중에 제압사격(SD)를 발동하여 연결 공격으로 마무리 합니다.

step30_title = 던전앤파이터 거너 - 국민콤보 ②
step30_help  = ★네이팜 탄(AS) → 메카드롭(AD) → 버스터 빔(ASD) 네이팜 탄(AS)으로 상대를 태우는 중 메카드롭(AD)을 소환하고, 버스터 빔(ASD)으로 마무리합니다.
                 
step31_title = 던전앤파이터 거너 - 국민콤보 ③
step31_help  = ★빙결류탄으로 상대를 얼린 뒤 → 섬광류탄으로 상대를 감전시킨 뒤 → 네이팜 탄(AS)으로 상대를 공격후 → 다운 된 대상에게 기본 공격으로 마무리 합니다.



[Set171]

max_step = 15

step0_title  = 파워드 - 기본소개
step0_help   = 파워드는 신체를 강화시켜주는 파워슈트를 착용하여 난전에서 다수의 적들을 쓰러트리는 범위형 충격파를 사용하는 근거리계열 레어용병입니다.

step1_title  = 파워드 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 파워드 - 크래쉬 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 크래쉬 공격이 발동됩니다. 크래쉬 공격은 범위형으로 오브젝트를 관통하는 공격입니다. 3번째 타격은 다운타격입니다.

step3_title  = 파워드 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 사선으로 치는 점프 공격을 합니다. 점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 파워드 - 점프 크래쉬(A → D 오래누름)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 바닥을 내려치는 공격이 발동됩니다. 공격에 성공하면 대상은 스턴에 걸리게 됩니다.

step5_title  = 파워드 - 대시공격 (->-> + D + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키며 추가공격 성공시 스턴상태로 만듭니다..

step6_title  = 파워드 - 대시 돌진 (->-> + D 오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 띄우는 공격을 할 수 있습니다.

step7_title  = 파워드 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step8_title  = 파워드 - 플라즈마 버스트 / 무기스킬(SD)
step8_help   = 플라즈마 버스트(SD)는 일직선으로 충격파를 날려 대상을 넉백시키는 스킬입니다. 발동 후 D키 유지 시간에 비례하여 대상을 더 멀리 날려버리는것이 가능합니다.

step9_title  = 파워드 - 메가 플라즈마 / 갑옷스킬(ASD)
step9_help   = 메가 플라즈마(ASD)는 기를 모아서 플라즈마 구체를 발사하는 스킬입니다. 기를 오래 모을수록 연타 및 넉백 거리가 증가됩니다.

step10_title  = 파워드 - 플라즈마 에어 / 투구스킬(AD)
step10_help   = 플라즈마 에어(AD)는 공중에서 작은 플라즈마 구체를 연속으로 발사하여 대상을 공격시키는 스킬입니다. 공중에서 공격하기 때문에 피격 당할 확률이 적습니다.

step11_title  = 파워드 - 플라즈마 익스큐션 / 망토스킬(AS)
step11_help   = 플라즈마 익스큐션(AS)은 곡선으로 점프하여 지면에 닿을때마다 폭발을 일으키는 스킬입니다. 다운대상도 타격이 가능합니다.

step12_title = 파워드 - 국민콤보 ①
step12_help  = ★대시 돌진 → 기본 2타 →크래쉬 X2 (D오래누름) 대시돌진으로 상대방을 띄운 후 기본 2타로 대상을 공격 한 후 크래쉬로 띄워 멀리 날려버립니다.

step13_title = 파워드 - 국민콤보 ②
step13_help  = ★점프 크래쉬(A →D오래) → 기본2타 → 크래쉬X2(D꾹) 점프 크래쉬로 대상을 경직시키고 기본2타 이후 크래쉬를 2번날립니다. 대상을 뒤로 날릴 수 있습니다.

step14_title = 파워드 - 국민콤보 ③
step14_help  = ★메가 플라즈마(ASD) → 플라즈마 버스트(SD) 메가 플라즈마(ASD)로 대상을 경직 시킨 후 플라즈마 버스트(SD)로 상대방을 날려버립니다.



[Set172]
max_step = 16

step0_title  = 함정전문가 - 기본소개
step0_help   = 함정전문가는 함정을 설치해 상대를 가두고 다양한 공격을 통해 상대를 제압하는 일반 용병입니다.

step1_title  = 함정전문가 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 함정전문가 - 함정설치 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 앞에다 함정을 설치합니다. 설치 후 다시 공격키(D)를 오래 누르면 설치된 함정을 강화시킬 수 있습니다. 최대 3단계까지 가능합니다.

step3_title  = 함정전문가 - 함정
step3_help   = 함정은 근처에 상대가 다가오면 발동됩니다. 함정안에서는 점프할 수 있는 높이가 낮아지며, 2단계에는 주기적으로 스턴에 걸리고, 3단계에서는 독에 감염됩니다.

step4_title  = 함정전문가 - 함정 게이지
step4_help   = 게이지는 함정을 설치하거나 강화시킬때마다 한개씩 소모됩니다. 게이지를 모두 사용한 상태에서 함정설치를 시도하면 처음에 생성된 함정이 사라지고 설치됩니다.

step5_title  = 함정전문가 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 경직시키고 마지막 타격시 상대를 밀어내며 경직시킵니다.

step6_title  = 함정전문가 - 내려치기 (A → D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 대상을 삽으로 강하게 내려치는 공격을 합니다. 다운된 상대도 공격이 가능합니다.

step7_title  = 함정전문가 - 대시공격1 (->-> → D → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 상대를 약경직시키면서 밀어내는 공격을 합니다.

step8_title  = 함정전문가 - 대시공격2 (->-> → D 오래누름 → D)
step8_help   = 대시 상태에서 공격키(D)를 오래 누르면 삽으로 내려쳐서 상대를 바운딩시킵니다. 바로 공격키(D)를 한번 더 누르면 상대를 뒤로 넘기는 공격을 합니다.

step9_title  = 함정전문가 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step10_title = 함정전문가 - 강화함정 / 무기스킬(SD)
step10_help  = 강화함정(SD)은 원거리에 각기 다른 효과의 함정을 설치하는 스킬입니다. A키를 누르면 드랍존, S키는 독, D키는 가시로 연속공격하는 함정을 설치합니다.

step11_title = 함정전문가 - 땅굴망 / 갑옷스킬(ASD)
step11_help  = 땅굴망(ASD)은 원하는 지점으로 이동할 수 있는 땅굴을 설치하는 스킬입니다. 사용하면 이동할 지점을 선택한 후 땅굴이 설치됩니다. 팀원도 이동이 가능합니다.

step12_title = 함정전문가 - 트랩마스터 / 투구스킬(AD)
step12_help  = 트랩마스터(AD)는 상대가 설치해놓은 함정을 먼거리에서도 볼 수 있게 해주는 패시브 스킬입니다.

step13_title = 함정전문가 - 굴착드릴 / 망토스킬(AS)
step13_help  = 굴착드릴(AS)은 드릴을 소환해 상대를 공격하는 스킬입니다. 마법진 정조준 시 공격 후 드랍존이 생성되어 상대를 드랍시킬 수 있습니다.

step14_title = 함정전문가 - 국민콤보 ①
step14_help  = ★강화함정(SD) → 굴착드릴(AS) 감화함정으로 상대를 다운시킨 뒤 굴착드릴로 바로 공격하여 마무리 합니다.

step15_title = 함정전문가 - 국민콤보 ②
step15_help  = ★함정(D 오래누름) → 기본공격(D → D → D)으로 벽에 튕기게 한 다음 내려치기(A → D 오래누름) → 대시공격2(->-> → D 오래누름 → D)로 마무리 합니다.


