step0_title  = 드릴 - 기본소개
step0_help   = 드릴은 땅속을 파고 다니면서 이동할 수 있는 땅굴을 생성해 상대를 제압하는 레어용병입니다.

step1_title  = 드릴 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 드릴 - 드릴머신 변신 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 드릴머신으로 변신하여 땅속으로 들어갑니다. 자동 이동되며, 이때 공격키(D)를 누르면 땅속에서 튀어나옵니다. 점프 중에도 가능합니다.

step3_title  = 드릴 - 땅굴 생성 (D 오래누름 → D)
step3_help   = 드릴머신으로 땅속을 파고 다니면 처음 들어간 자리와 나온 자리에 땅굴이 생성됩니다. 자신과 팀은 위에서 점프키(A)를 누르면 들어가고 상대팀은 바로 들어갑니다.

step4_title  = 드릴 - 드릴머신 점프 (D 오래누름 → A)
step4_help   = 드릴머신으로 땅속을 파고 다니다가 점프키(A)를 누르면 땅속에서 튀어나와 상대를 밀쳐내고 다시 들어갑니다. 이 경우 땅굴의 첫 생성지점이 변경됩니다.

step5_title  = 드릴 - 게이지 ①
step5_help   = 게이지는 대기, 걷기, 상태에서 회복됩니다. 드릴머신 변신과 점프 시 소모되며, 땅속을 파고 다닐 때 마다 지속적으로 감소합니다.

step6_title  = 드릴 - 점프공격 (A → D → D → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 무기를 휘둘러서 상대를 공격합니다. 최대 3회 공격이 가능합니다.

step7_title  = 드릴 - 점프대시 (A → ->->)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 방향키를 두 번 빠르게 누르면 전방으로 전진하면서 공격하는 점프대시가 발동됩니다.

step8_title  = 드릴 - 대시 공격 (->-> → D → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상에게 최대 2연타를 하는 대시 공격이 가능합니다.

step9_title  = 드릴 - 대시 전진공격 (->-> → D 오래누름)
step9_help   = 대시중 공격키(D)를 오래 누르면 전방으로 빠르게 전진하며 상대를 공격합니다. 이때 공격키(D)를 한번 더 누르면 회전하며 상대를 추가 공격합니다.

step10_title = 드릴 - 반격 (방어 성공시 바로 공격)
step10_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step11_title = 드릴 - 스파이럴 브레이크 / 무기스킬(SD)
step11_help  = 스파이럴 브레이크(SD)는 상대를 포박 시킨 뒤 전진하여 공격하는 스킬입니다. 스킬 사용 후 공격키(D)를 누른 시간에 따라 공격횟수가 달라집니다.

step12_title = 드릴 - 스파이럴 크래쉬 / 갑옷스킬(ASD)
step12_help  = 스파이럴 크래쉬(ASD)는 땅속으로 들어간 뒤 원하는 위치에서 튀어나와 공격하는 스킬입니다. 들어간 이후 마법진을 통해 나올 위치를 지정할 수 있습니다.

step13_title = 드릴 - 스파이럴 라이즈 / 투구스킬(AD)
step13_help  = 스파이럴 라이즈(AD)는 공중으로 올라가 지상으로 작은 드릴들을 발사하는 스킬입니다. 이후 공격키(D)를 누르면 넓게 드릴을 발사하여 상대를 바운딩 시킵니다.

step14_title = 드릴 - 스파이럴 대쉬 / 망토스킬(AS)
step14_help  = 스파이럴 대쉬(AS)는 전방으로 고속이동하며 상대를 드릴로 공격하는 스킬입니다. 이동 중 공격키(D)를 누르면 상대를 폭발시킵니다.

step15_title = 드릴 - 국민콤보 ①
step15_help  = ★스파이럴 대쉬(AS) → 스파이럴 크래쉬(ASD) 스파이럴 대쉬로 상대를 공격한 뒤 바로 스파이럴 크래쉬로 공격해서 마무리 합니다.

step16_title = 드릴 - 국민콤보 ②
step16_help  = ★스파이럴 크래쉬(ASD) → 스파이럴 라이즈(AD) 스파이럴 크래쉬로 상대를 공격한 뒤 공중에서 스파이럴 라이즈로 공격해 마무리 합니다.

step17_title = 드릴 - 국민콤보 ③
step17_help  = ★스파이럴 브레이크(SD) → 드릴머신 변신(D 오래누름) → 땅굴 생성(D 오래누름 → D) → 점프공격 (A → D → D → D)로 마무리 합니다.



