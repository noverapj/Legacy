step0_title  = 무에타이 - 기본소개
step0_help   = 무에타이는 태국의 전통무술로써 팔꿈치와 무릎을 이용한 공격과 방어상태에서도 데미지를 주는 강력한 연속 로우킥 공격으로 상대를 제압하는 근거리계열 용병입니다.

step1_title  = 무에타이 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 무에타이 - 연속 로우킥 (D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면, 방어 중인 대상도 데미지를 주는 로우킥으로 2번 연속 공격합니다. 3번 연속 사용 가능하며, 3타는 방어를 파괴하는 로우킥을 합니다.

step3_title  = 무에타이 - 플라잉 엘보우 (->-> D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 팔꿈치로 상대를 강하게 내려찍는 공격을 합니다.

step4_title  = 무에타이 - 대시 니킥 (->-> D오래누름)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 상대를 공중에 띄우는 니킥공격을 합니다.

step5_title  = 무에타이 - 점프공격(A →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 상대를 위에서 아래로 강하게 내려찍는 발차기 공격을 합니다.

step6_title  = 무에타이 - 무릎찍기(A →D 오래누름)
step6_help   = 점프 상태에서 공격키(D)를 오래 누르면 무릎으로 상대를 강하게 내려찍는 공격을 합니다. 공격 당한 대상은 경직 상태가 되며, 넘어진 대상도 공격할 수 있습니다.

step7_title  = 무에타이 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step8_title  = 무에타이 - 어퍼컷펀치(SD)
step8_help   = 어퍼컷펀치(SD)는 공중으로 뛰어 오르면서 대상을 연타하는 스킬입니다. 넘어진 대상도 공격할 수 있으며, 대상을 띄움상태로 만들어 추가공격을 하기에 용이합니다.

step9_title = 무에타이 - 스트롱니킥(ASD)
step9_help  = 스트롱니킥(ASD)은 대상을 잡고 니킥을 연타하는 스킬입니다.공격키(D)를 연타하면 최대 5연타공격을, 방어키(S)를 누르면 강력한 띄움공격을 합니다.

step10_title = 무에타이 - 플라잉니킥(AD)
step10_help  = 플라잉니킥(AD)은 공중으로 뛰어 오르면서 대상을 무릎 공격으로 연타하는 스킬 입니다.  공격키(D)를 한번 더 누르면 540도 회전 발차기공격을 합니다.

step11_title = 무에타이 - 스트롱풀링(AS)
step11_help  = 스트롱풀링(AS)은 대상을 잡아 당겨 자신의 뒤쪽으로 보내는 스킬입니다. 상대를 드랍시키거나, 다음 공격을 연계하기에 좋습니다.

step12_title = 무에타이 - 국민콤보 ①
step12_help  = ★어퍼컷펀치(SD)→스트롱니킥(ASD) 어퍼컷펀치(SD)로 상대를 공격한 후 스트롱니킥(ASD)으로 공격합니다.

step13_title = 무에타이 - 국민콤보 ②
step13_help  = ★대시 니킥(->-> D오래누름)→기본공격(D→D→D→D) 대시 니킥(->-> D오래누름)으로 상대를 띄운 후 기본공격(D→D→D→D)으로 마무리 합니다.

step14_title = 무에타이 - 국민콤보 ③
step14_help  = ★플라잉니킥(AD)→스트롱니킥(ASD)으로 D키 5연타→어퍼컷펀치(SD)공격 후 떨어지기 전 스트롱풀링(AS) → 대시 니킥(->->D오래누름)→기본공격(D→D→D→D)


[Set60]

max_step = 17

step0_title  = 카오스 레퍼드- 기본소개
step0_help   = 카오스 온라인 불사군단의 영웅으로 자신의 몸을 은신하여 적에게 은밀하게 접근해 강력한 공격과 연타공격으로 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 카오스 레퍼드- 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 카오스 레퍼드- 은신 (D 오래누름)
step2_help   = 은신 게이지가 있을 때 공격키(D)를 누르고 있으면, 앞으로 대시를 하면서 자신의 모습을 감춥니다. 은신 상태에서 대상을 공격하면 경직상태가 됩니다.

step3_title  = 카오스 레퍼드- 심판의 손(D 오래누름)
step3_help   = 은신 게이지가 없을 때 공격키(D)를 누르고 있으면, 심판의 손으로 대상을 공중에 띄우는 공격을 합니다. 이후 추가공격을 하기에 용이 합니다.

step4_title  = 카오스 레퍼드- 대시공격 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 심판의 손으로 상대를 공격합니다. D키 연타로 최대 4연타가 가능합니다.

step5_title  = 카오스 레퍼드- 대시 은신 (->-> D오래누름)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 은신을 합니다. 은신게이지가 없을 경우 대시공격을 합니다.

step6_title  = 카오스 레퍼드- 점프공격(A →D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 심판의 손으로 공격을 합니다. 이후 공격키(D)를 눌러 한번 더 공격 할 수 있습니다.

step7_title  = 카오스 레퍼드 - 이중점프 (A 두번 누름)
step7_help   = 점프한 상태에서 다시 점프키(A)를 누르면 공중에서 한번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있으며 이때 공격키를 누르면 점프공격을 합니다.

step8_title  = 카오스 레퍼드- 공중 은신(A →D 오래누름)
step8_help   = 점프 상태에서 공격키(D)를 오래 누르면 앞으로 대시를 하면서 자신의 모습을 감추는 은신을 합니다. 은신게이지가 없을 경우 점프공격을 합니다.

step9_title  = 카오스 레퍼드- 반격 (방어 성공시 바로 공격)
step9_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step10_title  = 카오스 레퍼드- 암흑의 습격(SD)
step10_help   = 암흑의습격(SD)은 가까운 대상의 뒤로 이동한 후 공격키(D) 연타로 상대를 공격하는 스킬입니다. 공격키(D) 연타 시 최대 4연타까지 가능합니다.

step11_title = 카오스 레퍼드- 라데스의 눈(ASD)
step11_help  = 라데스의눈(ASD)은 앞의 있는 대상을 손으로 빨아들인 후 상대를 잠시 공중에 묶어두는 스킬입니다. 넘어진 대상도 공격할 수 있습니다.

step12_title = 카오스 레퍼드- 어둠의 허상(AD)
step12_help  = 어둠의허상(AD)은 마법진 안에 있는 다수의 대상 머리 위로 분신들을 소환하여 공격 후 자신이 있는 위치로 던지는 스킬 입니다. 넘어진 대상도 공격가능 합니다.

step13_title = 카오스 레퍼드- 피의 문양(AS)
step13_help  = 피의문양(AS)은 피의 문양을 소환하여 일정 시간동안 피의 문양 범위에 있는 자신과 아군을 일반 공격에서 보호해 줍니다. 단 방어파괴 공격에는 효과가 없습니다.

step14_title = 카오스 레퍼드- 국민콤보 ①
step14_help  = ★라데스의눈(ASD)→암흑의습격(SD) 라데스의 눈(ASD)으로 대상을 공격한 후 암흑의 습격(SD)으로 연타하여 마무리합니다.

step15_title = 카오스 레퍼드- 국민콤보 ②
step15_help  = ★은신(D오래누름)→대시공격(->-> D) 은신(D오래누름)하여, 대상을 공격 후 대시공격(->-> D) D키 연타로 마무리합니다.

step16_title = 카오스 레퍼드- 국민콤보 ③
step16_help  = ★암흑의 습격(SD)→라데스의 눈(ASD)→대시공격(->-> D) 암흑의 습격(SD)으로 대상을 공격한 후 라데스의 눈(ASD) 끌어 당긴 후 대시공격(->-> D)으로 마무리합니다.


[Set61]

max_step = 14

step0_title  = 가토가챠 - 기본소개
step0_help   = 가토가챠는 인도네시아의 신화적 영웅으로 강력한 파워와 자유자재로 날아다니는 능력을 통해 상대방을 제압하는 파워형 근거리 용병입니다.

step1_title  = 가토가챠 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 가토가챠 - 테르반 (D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 사선으로 날아가며 대상을 공격하는 테르반 기술을 시전합니다. 테르반은 대상을 관통하며 공격하기 때문에 다수를 제압하기에 매우 좋습니다.

step3_title  = 가토가챠 - 대시공격 (->-> D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 주먹으로 대상을 강하게 띄우는 공격을 합니다.

step4_title  = 가토가챠 - 점프공격(A →D → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 빠르게 지상으로 내려가며 공격합니다. 점프 공격 이후, D키를 누르면 연속 공격이 발동됩니다.

step5_title  = 가토가챠 - 튕겨내기 (공격 받는 순간 방어)
step5_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step6_title  = 가토가챠 - 공중 테르반(A →D 오래누름)
step6_help   = 점프 상태에서 공격키(D)를 오래 누르면 직선으로 빠르게 날아가며 대상을 공격합니다. 테르반 이후, D키를 누르면 점프 공격이 발동 되어 연속공격에 유용합니다.

step7_title  = 가토가챠 - 테르반세라뇨르(SD)
step7_help   = 테르반세라뇨르(SD)는 전방으로 빠르게 돌진하여 대상을 공중으로 끌고 올라가 연타하는 스킬입니다.  공중에서 공격키(D)를 누르면 추가 공격이 발생됩니다.

step8_title  = 가토가챠 - 세라냔붐(ASD)
step8_help   = 세라냔붐(ASD)은 공중으로 올라가 공격 지점을 지정해서 공격키(D)를 누르면 해당 지점으로 빠르게 날아가 공격하고 추가 공격키(D)로 대상을 경직시키는 스킬입니다.

step9_title  = 가토가챠 - 메버르카티(AD)
step9_help   = 메버르카티(AD)는 일정 시간동안 자신의 몸을 돌처럼 단단하게 만드는 기술입니다. 메버르카티는 적의 공격을 켄슬 시켜주며 모든 데미지를 입지 않게 해줍니다.

step10_title = 가토가챠 - 후잔바단(AS)
step10_help  = 후잔바단(AS)은 하늘에서 뇌전의 힘을 받아 공격하는 스킬입니다. 후잔바단(AS)은 공격에 성공하면 주변 대상에게 연쇄적으로 뇌전 공격이 발동됩니다.

step11_title = 가토가챠 - 국민콤보 ①
step11_help  = ★후잔바단(AS) → 대시공격 (->-> D) → 기본공격(DDD) 후잔바단(AS)로 대상을 경직 시키고 대시공격 (->-> D)으로 대상을 띄워 기본공격(D→D→D)로 마무리합니다.

step12_title = 가토가챠 - 국민콤보 ②
step12_help  = ★대시공격(->-> D)→테르반(D꾹)→공중 테르반(D꾹) 대시공격으로 대상을 띄우고 테르반과 공중 테르반으로 연속 공격 후 점프 공격으로 마무리합니다.

step13_title = 가토가챠 - 국민콤보 ③
step13_help  = ★세라냔붐(ASD)→대시공격(->->D)→테르반세라뇨르(SD) 세라냔붐(ASD)로 대상을 경직시키고 대시공격(->->D)으로 띄운 후 테르반세라뇨르(SD)로 마무리 합니다.


