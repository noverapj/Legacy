step2_help   = 공격키(D)를 살짝 눌렀다 떼면 검으로 상대를 공중에 띄우는 공격을 합니다. 피격 대상은 공중에 띄움 상태가 되기 때문에 다음 공격을 하기에 유용합니다.

step3_title  = 웨어울프 - 대시공격 (->-> D)
