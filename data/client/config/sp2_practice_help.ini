[Set75]

max_step = 17

step0_title  = 귀신 - 기본소개
step0_help   = 억울하게 죽어 구천을 떠도는 귀신은 날카로운 손톱과 대상의 몸에 들어가 상대를 조종하는 빙의능력을 이용하여 대상을 제압하는 특수형 용병입니다.

step1_title  = 귀신 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 귀신 - 빙의모드(D 오래누름)
step2_help   = 공격키(D)를 오래 누르고 있으면 빙의모드로 전환이 됩니다. 원혼 상태는 무기아이콘 상단의 빙의게이지가 노란색일 때만 사용되며, 사용 시 게이지가 소모됩니다.

step3_title  = 귀신 - 빙의모드 사용방법 ①
step3_help   = 빙의 게이지는 걷기나 대기상태에서 충전되며, 빙의모드 중 방향키를 입력시 해당방향으로 이동을 합니다. 빙의모드 중 A키는 상승, S키는 하강을 합니다.

step4_title  = 귀신 - 빙의모드 사용방법 ②
step4_help   = 원혼상태 중 공격키(D)를 누르면 조준점이 있는 곳으로 빠르게 이동 후 대상을 몸에 붙는 빙의상태가 됩니다. 조준은 일정범위 안에 대상 접근 시 자동조준이 됩니다.

step5_title  = 귀신 - 빙의모드 사용방법 ③
step5_help   = 빙의가 되면 방향키를 조작하여 빙의된 대상의 움직임을 방해할 수 있습니다. 빙의 중 D키와 방향키를 누르면 해당 방향으로 점프상태로 빠져나옵니다.

step6_title  = 귀신 - 빙의모드 사용방법 ④
step6_help   = 빙의된 대상은 점프 및 대시, 공격이 불가능합니다. 하지만 빙의 된 대상이 스킬을 사용하거나, 피격 상태가 되면 빙의 상태에서 벗어날 수 있습니다.

step7_title  = 귀신 - 대시공격 (->-> →D)
step7_help   = 방향키를 빠르게 두 번 누르면 긴 거리를 빠르게 접근할수 있으며, 공격키(D)를 입력하면 한번 더 전진하여 손톱으로 대상을 찌르는 강력한 공격을 합니다.

step8_title  = 귀신 - 점프공격(A → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 손톱으로 공격합니다. 한번 더 공격키(D)를 눌러 추가 공격을 할 수 있습니다.

step9_title  = 귀신 - 점프대시 (점프 중 ->->)
step9_help   = 점프상태에서 방향키를 빠르게 두번 누르면 긴 거리를 빠르게 이동하는 점프 대시를 사용합니다. 점프 대시는 이동경로의 적들을 관통하며 지나갑니다.

step10_title  = 귀신 - 악귀 / 무기스킬(SD)
step10_help   = 악귀(SD)는 전방으로 빠르게 돌진하여 대상을 공중으로 끌고 올라가며 난타하는 스킬입니다. 넘어진 대상도 잡아서 공중으로 끌고 올라갈 수 있습니다.

step11_title  = 귀신 - 혼령비행 / 갑옷스킬(ASD)
step11_help   = 혼령비행(ASD)은 비행을 하면서 대상을 타격해 대상이 도망다니도록 만드는 스킬 입니다. 점프키(A)를 눌러 고도를 상승 시킬 수 있습니다.

step12_title  = 귀신 - 원귀소환 / 투구스킬(AD)
step12_help   = 원귀소환(AD)은 전방에 무덤을 생성하여 그 안에서 원귀가 소환되는 스킬입니다. 무덤의 일정범위에 대상이 접근하면 원귀들이 나타나 공격합니다.

step13_title  = 귀신 - 나비혼 / 망토스킬(AS)
step13_help   = 나비혼(AS)은 공격당한 대상의 몸에서 나비혼을 주기적으로 생성하여 대상의 기운을 빼앗으며 주변의 적들을 추가적으로 공격하는 스킬입니다.

step14_title = 귀신 - 국민콤보 ①
step14_help  = ★악귀(SD) → 점프공격(A → D) 악귀(SD)로 대상을 공격 한 뒤 점프상태가 되면 점프 공격을 2연타하여 마무리합니다.

step15_title = 귀신 - 국민콤보 ②
step15_help  = ★빙의(D 오래누름) →빙의해제(D)로 경직상태로 만든 후 기본공격(D키)로 연타로 대상을 공중에 띄워 점프공격(A →D)으로 마무리 합니다.

step16_title = 귀신 - 국민콤보 ③
step16_help  = ★빙의(D 오래누름) →빙의해제(D)로 경직상태로 만든 후 기본공격(D →D →D →D)→점프공격(A →D) → 악귀(SD)→점프공격(A →D)으로 마무리합니다.


;--------------------------------------076.  Sorcerer
[Set76]

max_step = 20

step0_title  = 마도사 - 기본소개
step0_help   = 마도사는 여러가지 속성의 마법을 자유롭게 다루어 상황에 따라 다른 속성의 마법으로 적들을 무력화 시키며 화려한 스킬로 적들을 제압하는 용병입니다.

step1_title  = 마도사 - 암흑 속성
step1_help   = 마도사는 암흑 속성의 힘을 기본적으로 사용합니다. 암흑 속성은 적들을 관통하며 잠시동안 대상을 대시가 불가능하게 되고 이동속도가 중첩되어 점점 느려집니다.

step2_title  = 마도사 - 화염 속성
step2_help   = 마도사는 화염속성을 공격키(D)로 활성화 시킵니다. 화염속성은 대상을 밀쳐내거나 쓰러뜨리며 대상의 몸을 불태워서 기상시간을 지연시키는 효과가 있습니다.

step3_title  = 마도사 - 빙결 속성
step3_help   = 마도사는 빙결속성을 방어키(S)로 활성화 시킵니다. 빙결속성은 잠시 동안 대상을 얼어붙게 만들어 대상의 모든 행동에 제약을 주어 무방비 상태를 만들어 냅니다.

step4_title  = 마도사 - 빛 속성
step4_help   = 마도사는 빛 속성을 점프키(A)로 활성화 시킵니다. 빛 속성은 적들을 관통하며 잠시 동안 시야를 빼앗거나 기절시키는 효과를 가지고 있습니다.

step5_title  = 마도사 - 기본공격 (D →D →D)
step5_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step6_title  = 마도사 - 속성공격 확장( 화염:D 빙결:S 빛:A )
step6_help   = 기본공격,대시차징,점프공격 이후 각 속성에 해당하는 키를 입력하여 상황에 따라 다양한 효과를 지닌 공격으로 보다 효과적인 전투를 벌일 수 있습니다.

step7_title  = 마도사 - 마법차징(D오래누름)
step7_help   = 공격키(D)를 누르고 있으면 무기 스킬의 게이지 회복 속도가 1.5배 증가하며, 동시에 암흑구를 모아서 해당 위치에 공격을 할 수 있습니다. 최대 3개까지 모입니다.

step8_title  = 마도사 - 마법방어 (S 누름)
step8_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든 방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step9_title  = 마도사 - 점프공격 (A → D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대각선 아래로 암흑구를 발사합니다. 암흑구에 피격당한 적은 잠시 동안 대시가 불가능 합니다.

step10_title  = 마도사 - 점프공격 확장( 화염:D 빙결:S 빛:A )
step10_help   = 점프공격(A → D)이후 각 속성에 해당하는 키를 입력하여 해당 속성의 구체를 대각선 아래로 발사 합니다. 상황에 따라 속성을 변환하여 적을 공격할 수 있습니다.

step11_title  = 마도사 - 이중점프 (A 두번 누름)
step11_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step12_title  = 마도사 - 차징 미사일 (->->)( 화염:D 빙결:S 빛:A )
step12_help   = 달리기가 불가능한 대신 방향키를 빠르게 두번 누르면 암흑구를 발사합니다. 공격키(D)를 오래 누르면 구체의 방향조작이 가능하며 속성변환이 가능합니다.

step13_title  = 마도사 - 마력탄 / 무기스킬(SD)
step13_help   = 마력탄(SD)은 강력한 마력구 세개를 떨어뜨리는 스킬입니다. 스킬 사용 후 방어키(S)로 속성을 변환할 수 있으며 공격키(D)로 지정한 위치에 마력탄을 발사 합니다.

step14_title  = 마도사 - 공.간 / 갑옷스킬(ASD)
step14_help   = 공.간(ASD)은 차원의 능력을 구체로 공격한 대상을 시전자의 주변으로 끌고오는 스킬입니다. 방향조작과 점프키(A), 방어키(S)로 고도 조절이 가능합니다.

step15_title  = 마도사 - 마력방출 / 투구스킬(AD)
step15_help   = 마력방출(AD)은 전방으로 다수의 유도 마력탄을 발사하여 적들을 공격하는 스킬입니다. 유도 마력탄은 다수의 적을 추적 하며 넓은 범위를 공격 할 수 있습니다.

step16_title  = 마도사 - 마력봉인 / 망토스킬(AS)
step16_help   = 마력봉인(AS)은 마도사의 주변대상들의 마력을 봉인하여 범위내에 있는 대상들의 스킬을 사용 불가능 하게 만드는 스킬입니다. 다수의 적을 상대하는데 효과적입니다.

step17_title = 마도사 - 국민콤보 ①
step17_help  = ★기본공격 확장(S)→점프공격 확장(D)→마력탄(SD) 기본공격 후 빙결(S)로 대상을 쓰러뜨린 후, 점프공격 확장(D)으로 추가 공격한 뒤 마력탄(SD)로 마무리 합니다.

step18_title = 마도사 - 국민콤보 ②
step18_help  = ★점프공격 확장(D) →마력탄(SD) →공.간(ASD) 점프공격 확장(D)로 점프공격 후 쓰러진 대상에게 마력탄을 사용하여 공격한 후 공.간(ASD)로 마무리 합니다.

step19_title = 마도사 - 국민콤보 ③
step19_help  = ★마력탄(SD) →공.간(ASD) →암흑구(D오래누름) 마력탄(SD)로 적을 쓰러뜨린 후 공.간(ASD)으로 대상을 공격 후 암흑구(D오래누름)으로 연계하여 마무리 합니다.


;------------------------/ 077. Shiranui Mai
[Set77]

max_step = 24

step0_title  = 시라누이 마이 - 기본소개
step0_help   = 시라누이 마이는 The  King Of Fighters 게임에 등장하는 캐릭터로 시라누이 인술과 화염을 이용한 공격으로 상대를 제압하는 프리미엄 캐릭터입니다.

step1_title  = 시라누이 마이 - 기본공격(D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 시라누이 마이 - 화접선(D 오래누름)
step2_help   = D키를 오래 누르면 들고 있는 부채를 던지는 원거리 공격을 합니다. 공격 당한 대상은 잠시동안 경직상태가 되어 추가공격을 하기에 용이합니다.

step3_title  = 시라누이 마이 - 용염무(->->)
step3_help   = 방향키를 빠르게 두 번 눌렀다 때면 대상을 2연타하는 용염무가 발동됩니다. 마지막 타격에 화염속성의 공격과 함께 대상을 공중에 띄웁니다.

step4_title  = 시라누이 마이 - 필살인봉(->-> → D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 전진하면서 대상을 3연타하는 필살인봉이 사용됩니다.

step5_title  = 시라누이 마이 - 점프공격(A → D )
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 부채로 내려치는 공격을 합니다. 방향키를 통하여 원하는 방향의 공격이 가능합니다.

step6_title  = 시라누이 마이 - 이중점프 (A 두번 누름)
step6_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step7_title  = 시라누이 마이 - 부우(A → D 오래누름 )
step7_help   = 점프 중 공격키(D)를 오래누르면 대상을 무릎으로 내려찍는 공격을 합니다. 공격 당한 대상은 바운딩 상태가 되어 추가공격을 하기에 용이합니다.

step8_title  = 시라누이 마이 - 날다람쥐의 춤(점프 중 ->-> )
step8_help   = 점프중에 방향키를 빠르게 2번 입력하면 입력된 방향으로 빠르게 하강이동 하면서 상대를 공격을 합니다. 맞은 대상은 잠시동안 고개를 숙이게 되어 추가공격에 용이합니다.

step9_title  = 시라누이 마이 - 반격 (방어 성공시 바로 공격)
step9_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step10_title  = 시라누이 마이 - 커맨드 기능 ①
step10_help   = 기본공격, 대시공격, 특별공격, 반격, 점프착지, 커맨드 공격 중에 지정된 방향키를 연속으로 입력하면 커맨드 및 스킬 공격을 즉시 발동 시킬 수 있습니다.

step11_title  = 시라누이 마이 - 커맨드 기능 ②
step11_help   = 커맨드에 사용되는 방향키는 상하좌우(↑↓←→) 4개이며 캐릭터 방향과 관계 없이 입력키 그대로 적용하여 커맨드 기능을 발동 시킵니다.

step12_title = 시라누이 마이 - 용염무 (↓ ←)
step12_help  = 대시조작을 사용할 때보다 빠르게 발동되는 용염무 공격이 발동됩니다. 동일한 공격은 최대 2회 연속까지만 커맨드를 통하여 발동 시킬 수 있습니다.

step13_title = 시라누이 마이 - 화접선 (↓ →)
step13_help  = 특별조작을 사용할 때보다 빠르게 발동되는 화접선 공격이 발동됩니다. 연속으로 사용하여 대상을 넘어트릴 수 있습니다.

step14_title = 시라누이 마이 - 필살인봉 (←↓→)
step14_help  = 대시 조작을 사용할 때보다 빠르게 발동되는 필살인봉 공격이 발동됩니다. 대상을 공중에 띄우기 때문에 추가공격을 하기가 용이합니다.

step15_title = 시라누이 마이 - 전방 회피 ( → →)
step15_help  = 전방으로 짧은 거리를 빠르게 굴러서 이동합니다. 기습적으로 빠르게 이동하기 때문에 상대에게 접근할 때 유용합니다.

step16_title = 시라누이 마이 - 후방 회피 (← ←)
step16_help  = 후방으로 짧은 거리를 빠르게 이동합니다. 기습적으로 빠르게 이동하기 때문에 상대의 타이밍을 끊기에 유용합니다.

step17_title  = 시라누이 마이- 초필살인봉/무기스킬(SD or ↓←↓→)
step17_help   = 초필살인봉(SD)은 전방으로 전진하면서 대상을 화염공격을 6연타하는 스킬입니다. 점프 중에도 사용이 가능하며, 방향키로 방향전환을 할 수 있습니다.

step18_title  = 시라누이 마이- 여닌자의 춤/갑옷스킬(ASD or ↓→↓←)
step18_help   = 시라누이류 여닌자의 춤(ASD)은 점프 중 사용가능 하며 후방 점프 후 앞으로 빠르게 하강하면서 대상을 공중으로 끌고 올라가 연타공격하는 스킬입니다.

step19_title  = 시라누이 마이- 풍차 무너뜨리기/투구스킬(AD or →←)
step19_help   = 풍차무너뜨리기(AD)은 대상을 다리로 잡아서 뒤로 넘긴 후 지면에 내려찍어 바운딩시키는 스킬입니다. 점프 중 사용 및 넘어진 대상을 공격할 수 있습니다.

step20_title = 시라누이 마이 - 날다람쥐의 춤/망토스킬(AS or ↓↑)
step20_help  = 날다람쥐의 춤(AS)는 후방 점프 후 앞으로 빠르게 하강하면서 대상을 타격하는 스킬로 다운/기립/점프 사용 가능합니다. 방향키 입력으로 방향전환이 가능합니다.

step21_title = 시라누이 마이 - 국민콤보 ①
step21_help  = ★초필살인봉(SD) → 시라누이류 여닌자의 춤(ASD) 초필살인봉(SD)로 대상을 공격한 후 여닌자의 춤(ASD)로 마무리 합니다.

step22_title = 시라누이 마이 - 국민콤보 ②
step22_help  = ★화접선(D오래누름)→필살인봉(←↓→)→풍차(AD) 화접선(D오래누름)으로 타격 후 필살인봉(←↓→)으로 대상을 띄우고 풍차(AD)로 마무리 합니다.

step23_title = 시라누이 마이 - 국민콤보 ③
step23_help  = ★날다람쥐(A+→→)→필살인봉(←↓→)→기본3타→용염무(↓←)→화접선(↓→)→기본3타→풍차(→←)→기본3타 필살인봉(←↓→)→초필살인봉↓←↓→)→여닌자의춤(ASD)


;------------------------/ 078. 제갈량
[Set78]
max_step = 14

step0_title  = 제갈량 - 기본소개
step0_help   = 제갈량은 촉한의 승상으로써 유비를 도와 싸운 계략가로 백우선을 이용하여 바람을 다스려 대상을 날려버리는 마법계열 용병입니다.

step1_title  = 제갈량 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 제갈량 - 마법차징 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 무기 스킬의 게이지 회복 속도가 1.5배 증가하며, 소환된 마법진을 방향키로 조종하여 원하는 위치에 무기 스킬을 사용할 수 있습니다.

step3_title  = 제갈량 - 마법방어 (S 누름)
step3_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든 방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step4_title  = 제갈량 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대각선 아래로 회오리를 발사하는 공격을 합니다 점프 공격은 지상의 대상을 공격할 때 유용합니다.

step5_title  = 제갈량 - 이중점프 (A 두번 누름)
step5_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step6_title  = 제갈량 - 회오리 강타 (->->)
step6_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 앞으로 전진한 후 전방에 회오리를 생성하여 대상을 공중에 띄웁니다.

step7_title  = 제갈량 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step8_title  = 제갈량 - 풍전등화 / 무기스킬(SD)
step8_help   = 풍전등화(SD)는 마법진으로 5번 위치를 지정하여 회오리가 생성되면 대상을 끌고 다음 마법진 위치로 이동하는 스킬입니다. 마법차징 중 S키를 눌러 시전이 가능합니다.

step9_title  = 제갈량 - 풍운조화 / 갑옷스킬(ASD)
step9_help   = 풍운조화(ASD)는 큰 회오리를 만들어 방향키로 조종하여 대상을 공중에 띄우는 스킬입니다. 스킬 시전 시 마법진이 생성되며 A, S, D키 중 하나를 누르면 시전이 됩니다.

step10_title  = 제갈량 - 일진광풍 / 투구스킬(AD)
step10_help   = 일진광풍(AD)은 광풍을 일으켜 자신의 앞에 있는 대상을 날려버리는 스킬입니다. 시전자 뒤에서 바라보는 방향으로 바람이 불어오면서 대상들을 날려버립니다.

step11_title  = 제갈량 - 화공계 / 망토스킬(AS)
step11_help   = 화공계(AS)는 칠현금을 연주하여 불화살 지원을 받아 대상을 공격하는 스킬입니다. 스킬키 입력으로 스킬을 종료할 수 있고, 방향키로 화살방향을 조종할 수 있습니다.

step12_title = 제갈량 - 국민콤보 ①
step12_help  = ★풍전등화(SD) → 화공계(AS) 풍전등화(SD)로 대상을 공격하여 대상을 밀어낸 뒤 화공계(AS)로 마무리합니다..

step13_title = 제갈량 - 국민콤보 ②
step13_help  = ★회오리 강타(->->) →기본공격(D → D → D) 회오리 강타(->->)로 대상을 공중에 띄운 후 기본공격(D → D → D)으로 마무리합니다..



[Set79]
max_step = 17

step0_title  = 기공사 - 기본소개
step0_help   = 기공사는 몸안에 축적된 기를 이용해 기공탄을 만들어 자유자재로 조종하고 튕기는 속성과 폭발하는 속성을 사용해서 대상을 제압하는 원거리 레어 용병입니다.

step1_title  = 기공사 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 기공사 - 기공탄 설명
step2_help   = 기공탄은 발사로 인해 방향이 꺽이거나 맵, 오브젝트, 적팀 용병에 맞추면 색깔이 변하며, 색깔이 3번째 바뀌면 피격시 폭발하는 속성을 가지고 있습니다.

step3_title  = 기공사 - 조준 설명
step3_help   = 기공탄은 적을 조준하면 발사된 모든 기공탄이 조준된 대상에게 날아가고 조준을 하지 않으면 자신을 향해 돌아오는 속성을 가지고 있습니다.

step4_title  = 기공사 - 조준 (D 누름유지)
step4_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며 사정거리 내 대상을 자동으로 조준해 줍니다. 조준된 상태에서 공격키를 떼면 대상에게 기공탄을 발사합니다.

step5_title  = 기공사 - 점프사격 (A→D)
step5_help   = 점프를 한 후 공격키를 누르면 점프 사격이 됩니다. 점프사격 역시 공격키를 오래 누르면 사정거리 내 대상을 조준하여 사격할 수 있으나 정조준은 되지 않습니다.

step6_title  = 기공사 - 하이점프 (A 오래)
step6_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다. 하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어 높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step7_title  = 기공사 - 허공답보 (A → ->->)
step7_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 직선 이동을 하는 허공답보가 발동됩니다.

step8_title  = 기공사 - 축적 (자동)
step8_help   = 기공사의 기공사는 체내에 축적된 내공을 사용하기 때문에 탄수의 제약이 없는 대신에 다음 발사를 위해 1초의 자동 재축적이 필요합니다.

step9_title  = 기공사 - 대시공격 (->-> + D)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상에게 빠르게 접근하여 타격하는 대시 공격이 가능합니다.

step10_title  = 기공사 - 이중 대시공격 (->-> + D,D)
step10_help   = 대시공격 중에 공격키(D)를 한번 더 입력하면 대시공격이 한번 더 가능합니다. 빠르게 2연속 공격이 성공하면 대상을 넉백시키는 효과가 발동됩니다.

step11_title  = 기공사 - 분열기공탄 / 무기스킬(SD)
step11_help   = 분열기공탄(SD)은 거대한 기공탄을 발사 한 후 D키 혹은 일정 시간이 지난 뒤 자동으로 기공탄이 4개로 분열되는 스킬입니다. 분열된 기공탄도 조종이 가능합니다.

step12_title = 기공사 - 태극 기원폭 / 갑옷스킬(ASD)
step12_help  = 태극기원폭(ASD)은 공중에서 기를 모아 거대한 기공탄을 지정된 곳으로 발사하는 기술입니다. 지상 및 공중 피격 중에도 사용이 가능하여 회피 후 반격에 유용합니다.

step13_title = 기공사 - 초속 기원탄 / 투구스킬(AD)
step13_help  = 초속 기원탄(AD)은 폭발형 기공탄을 자유자재로 조종하여 대상을 공격하는 스킬입니다. 방향키 조작으로 조종하며 점프키(A), 방어키(S)로 고도 조절을 할 수 있습니다.

step14_title = 기공사 - 기원 회전폭 / 망토스킬(AS)
step14_help  = 기원 회전폭(AS)은 주변을 도는 2개의 기체를 소환하는 스킬입니다. 기체에 부딪치면 대상은 멀리 점프 상태가 되어 날아가게 됩니다.

step15_title = 기공사 - 국민콤보 ①
step15_help  = ★기본 공격 → 대시 2연타 → 분열기공탄(SD) 기본 공격을 사용하여 대상을 기절시킨 후 대시 2연타로 넘어트린 후 분열기공탄(SD)으로 마무리합니다.

step16_title = 기공사 - 국민콤보 ②
step16_help  = ★태극 기원폭 → 초속기원탄 → 분열기공탄 태극 기원폭으로 대상을 띄우고 곧 바로 초속기원탄으로 대상을 맞춘 후 분열기공탄으로 마무리합니다.


[Set80]

max_step = 24

step0_title  = 유미라 - 기본소개
step0_help   = 유미라는 갓 오브 하이스쿨의 여자 주인공으로 월광검법과 여포 봉선의 힘을 빌려 강력한 차력으로 대상을 제압하는 프리미엄 용병입니다.

step1_title  = 유미라 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 유미라 - 목검베기 (D누름 떼기)
step2_help   = 공격키(D)를 살짝 눌렀다 떼면 목검으로 상대를 타격하는 공격을 합니다. 맞은 대상은 잠시동안 경직상태과 되어 추가공격을 하기에 용이합니다.

step3_title  = 유미라 - 대시공격1 (->-> D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 목검으로 대상을 타격하며, 한번 더 D키를 누르면 띄우는 공격을 합니다.

step4_title  = 유미라 - 대시공격2 (->-> D 오래누름)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 아래에서 위로 올려 치는 공격을 하여 대상을 공중에 띄웁니다.

step5_title  = 유미라 - 점프공격(A →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 목검으로 위에서 아래로 휘둘러 대상을 타격하는 공격을 합니다.

step6_title  = 유미라 - 내려찍기(A →D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 목검으로 내려찍는 공격을 합니다. 다운대상도 공격이 가능합니다.

step7_title  = 유미라 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step8_title  = 유미라 - 무검류 & 차력 (D 오래누름)
step8_help   = 공격키(D)를 오래 누르면 차력을 사용하는 형태로 변합니다. 무기 스킬 게이지 상단의 차력 게이지가 노란색일 때만 변신이 가능합니다.

step9_title  = 유미라 - 차력상태
step9_help   = 차력 상태에서는 모든 스킬이 사용불가 상태가 됩니다. 또한 차력 게이지는 자동으로 충전이 되며, 변신 중 타격을 당하면 게이지는 소모됩니다.

step10_title  = 유미라 - 무쌍난무(차력 상태에서  D 누름떼기)
step10_help   = 차력 상태에서 공격키(D)를 살짝 눌렀다 떼면 전방으로 전진하며 대상을 3연타 공격을 하는 무쌍난무를 사용합니다 무쌍난무 사용 시 차력 게이지를 소모합니다.

step11_title  = 유미라 - 방천화극(차력 상태에서  D 오래누름)
step11_help   = 차력 상태에서 공격키(D)를 오래 누르면 전방으로 방천 화극 공격을 합니다. 다운 대상도 공격이 가능하며, 사용 시 차력 게이지를 소모합니다.

step12_title  = 유미라 - 차력 상태 중 대시공격1 (->-> D)
step12_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키를 누르면 대상을 잠시 경직시키는 공격을 합니다.

step13_title  = 유미라 - 차력 상태 중 이중 대시공격 (->-> + D, D)
step13_help   = 차력 중 대시공격1 사용 중 공격키를 한번 더 입력하면 대상을 공중에 띄우는 발차기 공격을 합니다. 대상을 공중에 띄웁니다.

step14_title  = 유미라 - 탄지신공(A →D)
step14_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대각선으로 탄지신공을 발사합니다. 공격키(D)를 입력하여 최대 4번 발사할 수 있습니다.

step15_title  = 유미라 - 공중대시(A →->->)
step15_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 내려오면서 대상에게 발차기 공격을 합니다.

step16_title  = 유미라 - 구르기(차력 상태에서 다운 중 ->->)
step16_help   = 차력 상태에서 다운 중 방향키를 사용하면 그 방향으로 굴러서 일어납니다. 구르는 중에는 상대로 부터 공격을 받을 수 있으므로 조심해야 합니다.

step17_title  = 유미라 - 꼭두각시(SD)
step17_help   = 꼭두각시(SD)는 전진하면서 목검으로 대상을 타격하여 춤을 추게 만드는 스킬입니다. 방향키 입력으로 방향 전환이 가능하고, 스킬키 입력으로 멈출 수 있습니다.

step18_title = 유미라 - 수도꼭지(ASD)
step18_help  = 수도꼭지(ASD)은 자기 주변에 가장 가까운 대상의 뒤로 순간이동 한 후 타격하는 스킬입니다. 맞은 대상은 경직상태가 되어 추가공격을 하기에 용이합니다.

step19_title = 유미라 - 통배권(AD)
step19_help  = 통배권(AD)은 전방으로 빠르게 전진한 후 손바닥으로 대상을 타격해 멀리 날려버리는 스킬입니다. 대상을 멀리 날려 버리기 때문에 드랍을 시키기에 용이합니다.

step20_title = 유미라 - 부메랑(AS)
step20_help  = 부메랑(AS)은 목검을 날려서 대상을 타격하는 스킬입니다. 날아간 목검은 대상을 관통공격하며, 장애물에 부딪치지 않을 경우 다시 시전자에게 돌아옵니다.

step21_title = 유미라 - 국민콤보 ①
step21_help  = ★수도꼭지(ASD)→통배권(AD) 수도꼭지(ASD)로 공격한 후 통배권(AD)으로 마무리 합니다.

step22_title = 유미라 - 국민콤보 ②
step22_help  = ★무쌍난무(D누름떼기)→방천화극(D오래누름) 차력 상태로 변신 후 무쌍난무(D누름떼기)로 공격 후 방천 화극(D오래누름)으로 마무리합니다.

step23_title = 유미라 - 국민콤보 ③
step23_help  = ★부메랑(AS)→꼭두각시(SD)→수도꼭지(ASD)→차력(D오래누름)→차력상태에서 방천화극(D오래누름)→무쌍난무(D누름떼기)로 마무리합니다.


[Set81]

max_step = 18

step0_title  = 루시퍼 - 기본소개
step0_help   = 루시퍼는 날아다니면서 구속의 사슬을 발사해 상대를 끌어와 타격하거나 자신이 직접 빠르게 이동하여 루시퍼의 창으로 찔러 상대를 제압하는 근거리 계열 용병입니다.

step1_title  = 루시퍼 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 루시퍼 - 비행 (D 오래노름)
step2_help   = 공격키(D)를 누르고 있으면 비행 상태로 전환이 됩니다. 비행은 무기아이콘 상단의 비행 게이지가 노란색일 때만 비행이 가능하며, 서서히 게이지가 소모됩니다.

step3_title  = 루시퍼 - 비행 사용방법 1
step3_help   = 비행 게이지는 걷기나 대기상태에서 충전되며, 비행 중 방향키를 유지하면 바라보는 방향으로 이동합니다. 또한, A키는 상승, S키는 하강을 합니다.

step4_title  = 루시퍼 - 비행 사용방법 2
step4_help   = 비행 중 공격키(D)를 누르면 조준점이 있는 곳으로 사슬을 발사하고, 피격시 자신의 쪽으로 끌어와 공격합니다. 조준은 대상이 일정범위 안에 접근 시 자동조준이 됩니다.

step5_title  = 루시퍼 - 비행 사용방법 3
step5_help   = 비행 중 대시키(->->)를 누르면 조준점이 있는 곳으로 빠르게 접근하여 찌르기 공격을 합니다. 찌르기 공격 후에는 점프 상태가 되어 추가 공격이 가능합니다.

step6_title  = 루시퍼 - 비행 사용방법 4
step6_help   = 대기, 걷기, 대시, 점프 중 공격키(D)를 오래 누르고 있으면 비행 상태가 됩니다. 점프 중이나, 고도가 상승된 상태에서 비행 종료 시 점프상태로 전환됩니다.

step7_title  = 루시퍼 - 대시공격 (->-> → D + D + D + D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 창으로 공격합니다. 최대 4회 타격이 가능합니다.

step8_title  = 루시퍼 - 어둠의 구속 - (A →D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 잡아 위로 올라갔다 내려오며 바닥에 충돌시키는 공격을 합니다.

step9_title  = 루시퍼 - 어둠 찌르기 - (A → ->->)
step9_help   = 점프중에 방향키를 빠르게 2번 입력하면 입력된 방향으로 빠르게 이동하면서 어둠의 창으로 찌르는 공격을 합니다. 맞은 대상은 약한 경직 상태가 됩니다.

step10_title  = 루시퍼 - 반격 (방어 성공시 바로 공격)
step10_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step11_title  = 루시퍼 - 나락의 기운 / 무기스킬(SD)
step11_help   = 나락의 기운(SD)은 전방의 일정 범위 안의 대상에게 나락의 기운을 발사하여 대상을 끌어와 타격하는 스킬입니다. 최대 4명까지 대상을 타격 할 수 있습니다.

step12_title  = 루시퍼 - 죽은자의 원한 / 갑옷스킬(ASD)
step12_help   = 죽은자의 원한(ASD)은 자신의 중심으로 일정 범위안의 대상에게 죽은자의 원혼을 발사해 일정 시간동안 경직 시키는 스킬입니다. 점프 중 사용도 가능합니다.

step13_title  = 루시퍼 - 파괴의 힘 / 투구스킬(AD)
step13_help   = 파괴의 힘(AD)은 공격을 할 때마다 방어 및 무적상태의 적에게 일정량의 피해를 주는 스킬입니다. 패시브 스킬이며, 모든 공격에 적용이 됩니다.

step14_title  = 루시퍼 - 죽음의 날개 / 망토스킬(AS)
step14_help   = 죽음의 날개(AS)는 빠르게 비행을 하며 부딪히는 대상을 공격하여 저주를 거는 스킬입니다. A키를 누르면 고도가 상승하며 서서히 하강이 됩니다.

step15_title = 루시퍼 - 국민콤보 ①
step15_help  = ★기본공격 → 어둠의 구속(A →D) → 기본공격 기본공격 (D →D →D)으로 대상을 공격하고 어둠의 구속으로 대상을 잡아 공격한 후 기본공격으로 마무리합니다.

step16_title = 루시퍼 - 국민콤보 ②
step16_help  = ★비행사슬(D오래→ D) → 대시공격 (->-> → DDDD) 비행을(D오래누름)사용해 D키를 눌러 상대를 잡아 바운딩시킨 후 대시 공격으로 마무리 합니다.

step17_title = 루시퍼 - 국민콤보 ③
step17_help  = ★죽은자의 원한(ASD) → 나락의 기운(SD) → 어둠찌르기 죽은자의 원한(ASD)으로 대상을 경직시킨 후 나락의 기운(SD)으로 대상을 공격 한 후 어둠찌르기로 마무리합니다.

