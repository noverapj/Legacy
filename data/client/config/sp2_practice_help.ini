step0_help   = 대마도사 스트레인져는 룬 오브를 생성한 뒤 그 힘을 이용해 상대를 제압하는 원거리 유니크 용병입니다.

step1_title  = 스트레인져 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 스트레인져 - 룬 오브 소환 (D 누름유지)
step2_help   = 공격키(D)를 오래 누르고 있으면 룬 오브를 소환합니다. 누르고 있는 동안 1개씩 생성되며, 최대 5개까지 생성할 수 있으며 점프 중에도 사용 가능합니다.

step3_title  = 스트레인져 - 룬 오브 리미트 (공격 중 ->->)
step3_help   = 룬 오브를 소환한 뒤 공격 중에 대시 키를 입력하면 전방으로 소환된 룬 오브의 갯수만큼 룬 오브가 발사 됩니다.

step4_title  = 스트레인져 - 룬 오브 리미트 (공격 중 ->->)
step4_help   = 룬 오브 리미트에 피격 시 고대의 힘으로 스킬이 잠시 봉인되며, 봉인되는 시간은 소환된 룬 오브의 갯수만큼 늘어납니다.

step5_title  = 스트레인져 - 룬 오브 플라즈마 (D 누름유지)
step5_help   = 룬 오브를 소환한 뒤 다시 공격키(D)를 누르고 있으면, 전방으로 강력한 플라즈마를 발산합니다. 소환된 룬 오브의 수에 따라 범위 및 데미지가 변경 됩니다.

step6_title  = 스트레인져 - 룬 오브 플라즈마 (D 누름유지)
step6_help   = 룬 오브 플라즈마는 공격키(D)를 누르고 있는 동안 유지되며, 게이지가 유지동안 차감됩니다. A키는 상승, S키는 하강시키며, 점프 중 사용이 가능합니다.

step7_title  = 스트레인져 - 점프공격 (A → D → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 구체를 생성시켜 공격합니다. 최대 2회 공격이 가능합니다.

step8_title  = 스트레인져 - 룬 오브 마그네틱 (A → S)
step8_help   = 점프 중 방어키(S)를 누르고 있으면, 룬의 힘으로 몸을 감싸며 천천히 내려오게 됩니다. 이때 룬에 피격된 대상은 달라 붙어서 같이 내려오게 됩니다.

step9_title  = 스트레인져 - 대시 공격 (->-> → D → D → D)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상에게 최대 3연타를 하는 대시 공격이 가능합니다.

step10_title = 스트레인져 - 텔레포트 (->-> → D 오래누름)
step10_help  = 대시중 공격키(D)를 오래 누르면 전방으로 순간이동 합니다. 공격키(D) 추가 입력 시 한번 더 순간이동 할 수 있습니다.

step11_title = 스트레인져 - 마력 게이지
step11_help  = 게이지는 공격 성공, 방어 성공, 피격 시 일정량 회복되며, 룬 오브를 이용한 공격과 텔레포트 시 소모됩니다.

step12_title = 스트레인져 - 튕겨내기 (공격 받는 순간 방어)
step12_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step13_title = 스트레인져 - 에이션트 룬 오브 / 무기스킬(SD)
step13_help  = 에이션트 룬 오브(SD)는 고대의 룬 오브를 소환한 뒤 자신을 따라다니면서 상대를 자동으로 공격하게 만드는 스킬입니다.

step14_title = 스트레인져 - 플로트벌룬 / 갑옷스킬(ASD)
step14_help  = 플로트벌룬(ASD)은 범위 안에 있는 상대를 띄워서 자신쪽으로 끌고 온 뒤 피격자의 몸에서 구체를 다수 발사해 주변 상대를 공격하는 스킬입니다.

step15_title = 스트레인져 - 메스탄 / 투구스킬(AD)
step15_help  = 메스탄(AD)은 강력한 메스탄을 생성하여 자동으로 상대를 공격하게 하는 스킬입니다. 단, 정해진 횟수만큼 공격을 시도하면 이후에는 공격하지 않습니다.

step16_title = 스트레인져 - 메스붐 / 망토스킬(AS)
step16_help  = 메스붐(AS)은 원하는 위치로 순간이동한 뒤 거대한 발사체를 발사하여 상대를 공격하는 스킬입니다.

step17_title = 스트레인져 - 국민콤보 ①
step17_help  = ★메스탄(AD) → 메스붐(AS) 메스탄으로 상대를 연속공격한 뒤 바로 메스붐으로 공격하여 마무리 합니다.

step18_title = 스트레인져 - 국민콤보 ②
step18_help  = ★플로트벌룬(ASD) → 메스탄(AD) → 메스붐(AS) 플로트벌룬으로 상대를 스턴시킨 뒤 메스탄으로 연속 공격 후 메스붐으로 마무리 합니다.

step19_title = 스트레인져 - 국민콤보 ③
step19_help  = ★플로트벌룬(ASD) → 대시공격(->-> → D → D → D) → 룬 오브 마그네틱(A → S) → 기본공격(D → D → D)으로 마무리 합니다.



[Set185]
max_step = 19

step0_title  = 가고일 - 기본소개
step0_help   = 가고일은 하늘을 날며 상대를 석화시키는 독액을 발사하여 상대를 제압하는 원거리 일반 용병입니다.

step1_title  = 가고일 - 기본공격 (D → D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 가고일 - 게이지
step2_help   = 게이지는 대기, 걷기, 달리기 상태에서 회복되며, 가고일 변신, 신경 독액, 석화 독액 공격 시 소모하며, 가고일 변신 상태에서 지속적으로 차감됩니다.

step3_title  = 가고일 - 가고일 변신 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 가고일로 변신하고 비행 상태로 전환이 됩니다. 전환 후 천천히 지상으로 내려오게 되며, 지면에 가까워지면 자동으로 변신이 풀립니다.

step4_title  = 가고일 - 신경 독액 (D 오래누름 →D) 
step4_help   = 가고일 변신 중 공격키(D)를 누르면 대각선 하단으로 독액을 발사하게 됩니다. 독액에 맞은 상대는 밀려나면서 쓰러지게 됩니다.

step5_title  = 가고일 - 석화 독액 ① (D 오래누름 →D 누름유지)
step5_help   = 가고일 변신 중 공격키(D)를 오래 누르면 조준할 수 있는 상태가 되며, 사정거리 내 상대를 자동으로 조준합니다.

step6_title  = 가고일 - 석화 독액 ② (D 오래누름 → D 떼기)
step6_help   = 이때 공격키(D)를 떼게 되면 조준된 상대에게 독액을 발사합니다. 독액에 맞은 상대는 석화 상태가 됩니다.

step7_title  = 가고일 - 상승 (D 오래누름 → A)
step7_help   = 가고일 변신 중 점프키(A)를 누르면 공중으로 상승합니다.

step8_title  = 가고일 - 변신 해제 (D 오래누름 →S) 
step8_help   = 가고일 변신 중 방어키(S)를 누르면 가고일 변신 상태가 해제되며, 점프 상태로 전환 됩니다.

step9_title  = 가고일 - 점프공격 (A →D →D →D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 발톱을 휘둘러서 상대를 공격합니다. 최대 3회 공격이 가능합니다.

step10_title = 가고일 - 대시 공격 (->-> → D →D)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 이때 공격키(D)를 누르면 대상에게 최대 2연타를 하는 대시 공격이 가능합니다. 

step11_title = 가고일 - 더블 스크래치 (->-> → D 오래누름)
step11_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 이때 공격키(D)를 오래 누르면 전방으로 빠르게 전진하며 상대를 2회 공격합니다.

step12_title = 가고일 - 가고일 소환 / 무기스킬(SD)
step12_help  = 가고일 소환(SD)은 범위내의 상대를 자동으로 공격하는 가고일 2마리를 소환하는 스킬입니다. 가고일에게 피격되면 석화 상태가 됩니다.

step13_title = 가고일 - 급속 석화 / 갑옷스킬(ASD)
step13_help  = 급속 석화(ASD)는 자신의 몸을 석화시켜 일정 시간 동안 무적 상태가 되는 스킬입니다. 피격 중 사용 가능하며, 자신을 공격한 상대는 석화 상태가 됩니다.

step14_title = 가고일 - 독액 폭발 / 투구스킬(AD)
step14_help  = 독액 폭발(AD)은 전방으로 독액을 발사하는 스킬 입니다. 최대 4회 발사 할 수 있으며, 피격된 상대는 일정 시간 후 석화 상태가 됩니다.

step15_title = 가고일 - 가고일의 분노 / 망토스킬(AS)
step15_help  = 가고일의 분노(AS)는 공중으로 상승한 뒤 바닥을 내리쳐 주변의 상대를 석화시키는 스킬입니다.

step16_title = 가고일 - 국민 콤보 ①
step16_help  = ★더블 스크래치(->-> → D 오래누름) → 기본공격 (D →D →D) 더블 스크래치로 상대를 띄운 후 기본공격으로 마무리 합니다.

step17_title = 가고일 - 국민 콤보 ②
step17_help  = ★가고일의 분노(AS) → 기본공격 (D →D →D) → 가고일의 분노로 상대를 스턴시킨 뒤 기본공격으로 마무리 합니다.

step18_title = 가고일 - 국민 콤보 ③
step18_help  = ★가고일의 분노(AS) → 더블 스크래치 (->-> → D 오래누름) → 기본공격 (D → D →D) 가고일의 분노로 스턴시킨 뒤 더블 스크래치로 띄운 후 기본공격으로 마무리 합니다.



[Set186]

max_step = 19

step0_title  = 해커 - 기본소개
step0_help   = 해커는 슈퍼 컴퓨터를 이용해 상대를 움직이지 못하는 셧다운에 걸리게 만들어 제압하는 일반용병입니다.

step1_title  = 해커 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 해커 - 슈퍼 컴퓨터 (D 누름유지)
step2_help   = 공격키(D)를 오래 누르고 있으면 컴퓨터를 방향키로 조작할 수 있으며, 단계별로 게이지가 차오르게 됩니다. 단계에 따라 컴퓨터의 공격 효과가 달라집니다.

step3_title  = 해커 - 슈퍼 컴퓨터 (D 누름떼기)
step3_help   = 게이지가 0일 때 공격키(D)를 떼면 상대를 약경직 시키는 코드를 내보내어 상대를 공격합니다.

step4_title  = 해커 - 슈퍼 컴퓨터 (D 누름떼기)
step4_help   = 게이지가 1일 때 공격키(D)를 떼면 셧다운 코드를 내보내어 일정시간동안 상대를 움직이지 못하게 만듭니다.

step5_title  = 해커 - 슈퍼 컴퓨터 (D 누름떼기)
step5_help   = 게이지가 2일 때 공격키(D)를 떼면 셧다운 코드를 내보내어 상대를 움직이지 못하게 만든 다음 바운딩 상태가 되도록 합니다.

step6_title  = 해커 - 슈퍼 컴퓨터 (D 누름떼기)
step6_help   = 게이지가 3일 때 공격키(D)를 떼면 셧다운 코드를 내보내어 상대를 움직이지 못하게 만들고 다운로드를 실행시켜 피격된 시점에 공격자가 있던 위치로 이동시킵니다.

step7_title  = 해커 - 슈퍼 컴퓨터 (D 누름유지 → A)
step7_help   = 공격키(D)를 누름유지한 상태에서 점프키(A)를 누르면 게이지를 저장한 상태에서 점프하게 되고, 방어키(S)를 누르면 무기스킬이 발동 됩니다.

step8_title  = 해커 - 점프공격 (A → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대각선 아래로 레이져를 발사합니다. 피격에 성공하거나 상대가 방어하면 최대 2회 다시 점프합니다.

step9_title  = 해커 - 점프 특별공격 (A → D 오래누름)
step9_help   = 점프 중 공격키(D)를 오래 누르면 바라보는 방향의 지면에서 컴퓨터가 약경직을 시키는 코드를 내보내어 상대를 공격합니다. 피격성공/상대 방어시 다시 점프합니다.

step10_title = 해커 - 대시 공격 (->-> → D)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대시 공격이 발동됩니다.

step11_title = 해커 - 방어코드 생성 (->-> → D 오래누름)
step11_help  = 대시중 공격키(D)를 오래 누르면 전방으로 상대의 일정 공격을 방어할 수 있는 방어코드를 생성합니다. 최대 2개까지 생성 시킬 수 있습니다.

step12_title = 해커 - 구르기 (->-> → D 오래누름 → ->->)
step12_help  = 방어코드를 생성한 후 방향키를 빠르게 두 번 누르고 유지하면 입력한 방향으로 구르기를 사용할 수 있습니다. 이후 공격키(D)를 눌러서 발차기를 사용할 수 있습니다.

step13_title = 해커 - 시스템 브레이크 / 무기스킬(SD)
step13_help  = 시스템 브레이크(SD)는 슈퍼 컴퓨터에서 강력한 에러 코드를 내보내어 상대의 시야를 가리고, 느려지게 만드는 스킬입니다.

step14_title = 해커 - 맥스 다운로드 / 갑옷스킬(ASD)
step14_help  = 맥스 다운로드(ASD)는 상대를 강제로 멈추게 만든 다음 원하는 위치로 다운로드시켜 이동시키는 스킬입니다.

step15_title = 해커 - 백도어 인스톨 / 투구스킬(AD)
step15_help  = 백도어 인스톨(AD)은 다수의 레이져를 전방으로 발사하여 피격된 상대를 느려지게 만드는 스킬입니다.

step16_title = 해커 - 시그널 재밍 / 망토스킬(AS)
step16_help  = 시그널 재밍(AS)은 가방에서 신호를 왜곡하는 도구를 꺼낸 뒤 바닥에 설치하여 주변 대상들을 얼게 만드는 스킬입니다.

step17_title = 해커 - 국민콤보 ①
step17_help  = ★시그널 재밍(AS) → 백도어 인스톨(AD) 시그널 재밍으로 상대를 얼게 만든 다음, 백도어 인스톨로 공격하여 마무리 합니다.

step18_title = 해커 - 국민콤보 ②
step18_help  = ★맥스 다운로드(ASD) → 슈퍼 컴퓨터 1게이지(D 누름떼기) → 기본공격(D → D → D) 맥스 다운로드로 데려와서 슈퍼 컴퓨터로 셧다운 시키고 기본공격으로 연결합니다.



[Set187]

max_step = 18

step0_title  = 캐논 - 기본소개
step0_help   = 캐논은 전차로 변신하여 원거리에 있는 적을 제압하는 \n일반 용병입니다.

step1_title  = 캐논 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 캐논 - 전차 변신 (D 누름유지)
step2_help   = 공격키(D)를 오래 누르고 있으면 전차로 변신할 수 있습니다. 전차로 변신한 상태에서 이동 가능한 마법진이 \n생성되며 마법진 위치를 조종할 수 있습니다.

step3_title  = 캐논 - 전차 변신 상태 (D 누름)
step3_help   = 전차 변신 상태일때 게이지가 0이 되며 이때 공격키(D)를 누르면 게이지가 상승됩니다. 최대 100까지 상승 \n시킬 수 있습니다.

step4_title  = 캐논 - 전차 변신 상태 (D 누름떼기)
step4_help   = 게이지가 40 이상일 때 누름 떼기를 하면 일반 레이저 \n포탄이 발사 됩니다. 게이지 40이하 시 \n 포탄은 발사 되지 않습니다.

step5_title  = 캐논 - 전차 변신 상태 (D 누름떼기2)
step5_help   = 게이지가 100일 때 공격키(D)를 떼면 방어 불가 레이저 포가 발사 됩니다. 피격 시 감전효과가 적용 됩니다.

step6_title  = 캐논 - 전차 변신 상태 (S)
step6_help   = 전차 변신 상태일 때 S키 입력 시 일반 용병 상태로 변신하게 됩니다.

step7_title  = 캐논 - 전차 변신 상태 (A)
step7_help   = 전차 변신 상태일 때 A키 입력 시 전차에서 긴급탈출 하게 됩니다. 긴급 탈출한 용병은 점프 상태가 되며 \n점프 기본 공격이 가능 합니다.

step8_title  = 캐논 - 점프공격 (A → D D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 무기를 이용하여 공격하게 됩니다. 이후 추가 입력 시 대각선 아래로 레이저 포를 발사합니다.

step9_title = 캐논 - 대시 공격 (->-> → D D)
step9_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 \n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대시 \n공격이 발동되며 추가타 입력 시 상대방을 띄웁니다.

step10_title = 캐논 - 대시 공격 (->-> → D 오래 누름)
step10_help  = 대시중 공격키(D)를 오래 누르면 전방으로 레이저 포를 \n발사하게 됩니다. 피격 시 감전 효과가 적용 됩니다.

step11_title = 캐논 - 튕겨내기 (순간 방어 성공 시)
step11_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step12_title = 캐논 - 타우러스 포격 / 무기스킬(SD)
step12_help  = 타우러스 포격(SD)은 타우러스 포탄이 탑재된 전차로 \n변신 합니다. 타우러스 포탄은 드랍존을 생성하는 레이저 포탄으로, 최대 3발 사용 가능 합니다.

step13_title = 캐논 - 리펄서빔 / 갑옷스킬(ASD)
step13_help  = 리펄서빔(ASD)은 가슴에 부착된 아이오 원자에서 강력한 리펄서빔을 발사하는 스킬입니다. 

step14_title = 캐논 - 지원 요청 / 투구스킬(AD)
step14_help  = 지원 요청(AD)은 자신이 바라보는 전방에 전투기 폭격을 지원 요청하는 스킬입니다.

step15_title = 캐논 - 대전차 지뢰 / 망토스킬(AS)
step15_help  = 대전차 지뢰(AS)는 자신이 위치한 곳에 대전차 지뢰를\n설치하는 스킬입니다. 다른 지뢰와 달리 보이는 거리가\n매우 짧으며, 피격 시 감전 및 이동속도가 감소 됩니다.

step16_title = 캐논 - 국민콤보 ①
step16_help  = ★지원요청(AD) → 타우러스 포격(SD) \n전방에 지원 요청을 한 다음 타우러스 포격으로 마무리 합니다.

step17_title = 캐논 - 국민콤보 ②
step17_help  = ★대시 공격(->-> → D 오래누름) → 전차 변신(D 오래 누름) → 전차 변신 상태 (D 누름 떼기) 대시 D꾹 이후 전차로 변신하여 레이저 포로 마무리 합니다.



[Set188]

max_step = 18

step0_title  = 마공학자 - 기본소개
step0_help   = 마공학자는 감전을 일으키는 기계장치와 부스터를 이용해 상대를 제압하는 레어용병입니다.

step1_title  = 마공학자 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 마공학자 - 기계장치 (D 누름떼기)
step2_help   = 공격키(D)를 눌렀다 떼면 기계장치를 꺼내서 위쪽으로 날립니다. 기계장치는 레이져 포를 발사해 상대를 감전시킨 후 띄워지게 만듭니다. 대시 중에도 동일합니다.

step3_title  = 마공학자 - 기계장치 (D 오래누름)
step3_help   = 공격키(D)를 눌렀다 떼면 기계장치를 꺼내서 전방으로 날립니다. 기계장치는 레이져 포를 발사해 상대를 감전시킨 후 띄워지게 만듭니다. 대시 중에도 동일합니다.

step4_title  = 마공학자 - 부스터 상승 (공격 중 A)
step4_help   = 모든 공격 중에 점프키(A)를 누르면 대각선 위로 고속이동하는 부스터를 발동시킵니다. 최대 거리까지 이동하면 자동으로 점프상태로 전환됩니다.

step5_title  = 마공학자 - 부스터 하강 (점프공격 중 S)
step5_help   = 점프 공격 중에 방어키(S)를 누르면 대각선 아래로 고속이동하는 부스터를 발동시킵니다.

step6_title  = 마공학자 - 

step6_help   = 게이지는 딜레이, 걷기, 달리기 시에 회복되며, 부스터를 사용할 때 1씩 소모 됩니다.

step7_title  = 마공학자 - 점프공격 (A → D → D → D → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 무기로 상대를 공격합니다. 최대 4회 공격이 가능하며 마지막 공격은 공중의 상대를 바운딩 시킵니다.

step8_title  = 마공학자 - 공중 기계장치 (A → D 누름떼기)
step8_help   = 점프 중 공격키(D)를 눌렀다 떼면 기계장치를 꺼내서 전방으로 날립니다. 기계장치는 레이져 포를 발사해 상대를 감전시킨 후 띄워지게 만듭니다.

step9_title  = 마공학자 - 공중 기계장치 (A → D 오래누름)
step9_help   = 점프 중 공격키(D)를 오래 누르면 기계장치를 꺼내서 아래로 날립니다. 기계장치는 레이져 포를 발사해 상대를 감전시킨 후 띄워지게 만듭니다.

step10_title = 마공학자 - 점프대시 (A → ->-> )
step10_help  = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게\n직선 이동을 하는 공중 대시가 발동됩니다.

step11_title = 마공학자 - 대시공격 (->-> → D → D)
step11_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 2연타 하는 대시 공격이 가능합니다.

step12_title = 마공학자 - 크고 아름다운 발명품 / 무기스킬(SD)
step12_help  = 크고 아름다운 발명품(SD)은 마법공학이 집대성된 비행선을 소환하는 스킬입니다. 비행선은 전방의 상대에게 화염, 얼음, 전기 속성 공격을 합니다.

step13_title = 마공학자 - 원소 증폭기 / 갑옷스킬(ASD)
step13_help  = 원소 증폭기(ASD)는 마법진으로 지정한 지점으로 이동하며 공격하는 원소 증폭기를 소환하는 스킬입니다. 이동 중에 범위 내 상대에게 속성 공격을 합니다.

step14_title = 마공학자 - 오버로드 / 투구스킬(AD)
step14_help  = 오버로드(AD)는 스킬 사용 후 공격한 횟수에 따라 스킬 종료 또는 취소 시 강력한 폭발을 일으키는 스킬입니다.

step15_title = 마공학자 - 일렉트릭 밤 / 망토스킬(AS)
step15_help  = 일렉트릭 밤(AS)은 전기벽을 생성하는 폭탄을 전방으로 던지는 스킬입니다. 전기벽에 충돌 시 뒤로 밀려나게 되며, 기본 점프로는 넘어갈 수 없습니다.

step16_title = 마공학자 - 국민콤보 ①
step16_help  = ★대시공격(->-> → D → D) → 부스터 상승(공격 중 A) → 점프공격(A → D → D → D → D) 대시 공격으로 띄운 후 부스터로 상승한 다음 점프공격으로 연결합니다.

step17_title = 마공학자 - 국민콤보 ②
step17_help  = ★기계장치(D 누름떼기 ) → 부스터 상승(공격 중 A) → 점프공격(A → D → D → D → D) → 부스터 하강(점프공격 중 S) → 기본공격 (D → D → D → D)



[Set189]

max_step = 18

step0_title  = 배가본드 - 기본소개
step0_help   = 배가본드는 관통공격과 잔상으로 상대를 타격하여 제압하는 일반용병입니다.

step1_title  = 배가본드 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 배가본드 - 연속 베기 (D 누름떼기)
step2_help   = 공격키(D)를 눌렀다 떼면 연속베기 공격을 합니다. 연속베기 공격을 하면 전방을 연속으로 5회 공격을 하게 됩니다.

step3_title  = 배가본드 - 지상 검기 발사 (D 오래누름)
step3_help   = 공격키(D)를 눌렀다 떼면 전방으로 검기를 날립니다. 검기에 맞은 상대는 띄움 상태가 됩니다. 다운된 상태의 상대도 타격할 수 있습니다.

step4_title  = 배가본드 - 관통 공격 (공격 중 →→)
step4_help   = 모든 공격 중에 대시(->->)를 누르면 전방으로 상대를 관통하는 공격을 하게 됩니다. 관통 공격 중 대시(->->)를 누르면 추가로 관통 공격을 할 수 있습니다..

step5_title  = 배가본드 - 잔상 공격 (관통 공격중 S)
step5_help   = 관통 공격중에 방어키(S)를 누르면 관통 공격 시작 위치부터 종료 위치까지 이동하는 잔상을 발생시킵니다. 잔상에 맞은 상대는 띄움 상태가 됩니다.

step6_title  = 배가본드 - 게이지
step6_help   = 게이지는 딜레이, 걷기, 달리기 시에 회복되며, 공격을 할 때마다 1.5만큼 회복하게 됩니다.

step7_title  = 배가본드 - 점프공격 (A → D → D → D )
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 무기로 상대를 공격합니다. 최대 4회 공격이 가능합니다.

step8_title  = 배가본드 - 공중 연속 베기 (A → D 누름떼기)
step8_help   = 점프 중 공격키(D)를 눌렀다 떼면 공중에서 연속 베기를 합니다. 공중 연속 베기를 하면 공중에서 연속으로 5회 공격을 하게 됩니다.

step9_title  = 배가본드 - 공중 검기 발사 (A → D 오래누름)
step9_help   = 점프 중 공격키(D)를 눌렀다 떼면 대각선 아래로 검기를 날립니다. 검기에 맞은 상대는 띄움 상태가 됩니다.

step10_title = 배가본드 - 점프대시 (A → ->-> )
step10_help  = 점프공격(A → D)후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게\n직선 이동을 하는 공중 대시가 발동됩니다.

step11_title = 배가본드 - 대시공격 (->-> → D → D → D)
step11_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 3연타 하는 대시 공격이 가능합니다.

step12_title = 배가본드 - 날아 찍기(->-> → D 오래 누름)
step12_help  = 대시 상태에서 공격키(D)를 오래 누르고 있으면 무기를 이용해 상대를 내려찍는 공격을 합니다. 피격 당한 상대는 바운딩 상태가 됩니다.

step13_title = 배가본드 - 다크슬래쉬 / 무기스킬(SD)
step13_help  = 다크슬래쉬(SD)는 전방에 상대를 빨아 들여 공격하는 블랙홀을 생성하는 스킬입니다.

step14_title = 배가본드 - 블랙아우라 / 갑옷스킬(ASD)
step14_help  = 블랙아우라(ASD)는 바닥에 검을 꽂아 검기를 분출시켜 주변의 상대를 공격하는 스킬입니다.

step15_title = 배가본드 - 슈퍼노바 / 투구 스킬(AD)
step15_help  = 슈퍼노바(AD)은 자신의 주변으로 강력한 폭발을 일으키고 자신은 이동속도가 증가하게 됩니다. 슈퍼노바(AD)는 피격 중, 다운 중 사용이 가능합니다.

step16_title = 배가본드 - 블랙홀 / 망토 스킬(AS)
step16_help  = 블랙홀(AS)은 마법진을 조종하여 원하는 위치에 상대방을 끌어당기는 블랙홀을 던지는 스킬입니다.

step17_title = 배가본드 - 국민콤보 ①
step17_help  = ★관통공격(공격 중 ->-> ) →날아 찍기(->-> → D 오래 누름 ) → 점프공격(A → D → D → D ) 관통 공격 후 날아 찍기로 공중으로 띄운 후 점프 공격으로 연결합니다.

step18_title = 배가본드 - 국민콤보 ②
step18_help  = ★관통공격(공격 중 ->-> ) →잔상 공격 (관통 공격중 S) → 점프공격(A → D → D → D ) 관통 공격 후 잔상 공격으로 띄운 후 점프 공격으로 연결합니다.


[Set190]

max_step = 23

step0_title  = 쿵푸술사 - 기본소개
step0_help   = 쿵푸술사는 각종 동물의 자세로 공격하거나 누워서 상대의 공격을 회피하며 제압하는 레어용병입니다.

step1_title  = 쿵푸술사 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 쿵푸술사 - 뱀의 자세 (D 누름떼기)
step2_help   = 공격키(D)를 누르고 있으면 자세를 변환하는 준비동작을 하게 됩니다. 이때 공격키(D)를 떼면 뱀의 자세로 변환 됩니다.

step3_title  = 쿵푸술사 - 뱀의 돌격 (뱀의 자세 → D)
step3_help   = 뱀의 자세에서 공격키(D)를 누르면 전방으로 빠르게 전진하여 상대를 경직상태로 만들고, 잠시동안 스킬을 사용할 수 없도록 만듭니다.

step4_title  = 쿵푸술사 - 표범의 자세 (D 누름유지 → S)
step4_help   = 공격키(D)를 누르고 있는 상태에서 방어키(S)를 누르면, 표범의 자세로 변환 됩니다.

step5_title  = 쿵푸술사 - 표범의 발톱 (표범의 자세 → D → D)
step5_help   = 표범의 자세에서 공격키(D)를 누르면 전방의 상대를 잡아서 뒤로 보냅니다. 이때 공격키(D)를 다시 누르면 등으로 상대를 강하게 쳐서 밀어냅니다. 

step6_title  = 쿵푸술사 - 학의 자세 (D 누름유지 → A)
step6_help   = 공격키(D)를 누르고 있는 상태에서 점프키(A)를 누르면, 학의 자세로 변환 됩니다.

step7_title  = 쿵푸술사 - 학의 행진 (학의 자세 → D → D → D → D)
step7_help   = 학의 자세에서 공격키(D)를 누르면 상대를 띄우는 공격을 합니다. 이후 추가 공격키(D)를 통해 연속 공격 할 수 있습니다.

step8_title  = 쿵푸술사 - 자세 변형과 취소
step8_help   = 각 자세 중이거나 각 자세의 공격 중에 다른 자세로 변형 할 수 있으며, 대시나 점프 시 자세가 해제 됩니다.

step9_title  = 쿵푸술사 - 눕기 (공격 중 → S)
step9_help   = 점프 공격을 제외한 모든 공격 중에 방어키(S)를 누르면 제자리에 눕게 됩니다. 이 동안에는 다운된 상대에게 적중이 가능한 공격만 맞게 됩니다.

step10_title = 쿵푸술사 - 기상 (누운 상태에서 D)
step10_help  = 누워 있는 상태에서 공격키(D)를 누르면 빠르게 일어나면서 상대를 띄워 올리는 공격을 합니다.

step11_title = 쿵푸술사 - 구르기 (누운 상태에서 ->->)
step11_help  = 누워 있는 상태에서 방향키를 빠르게 두번 누르면 입력한 방향으로 구르면서 일어나게 됩니다.

step12_title = 쿵푸술사 - 점프공격 (A → D)
step12_help  = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 발을 내려쳐서 공격합니다. 공격 성공 시 다시 점프상태로 전환 됩니다.

step13_title = 쿵푸술사 - 점프대시 (A → ->->)
step13_help  = 점프키(A)를 누르면 점프가 발동되며 이때 방향키를 빠르게 두번 누르면 지면을 발로 내려치는 공격을 합니다.

step14_title = 쿵푸술사 - 대시공격 (->-> → D → D)
step14_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 2연타 하는 대시 공격이 가능합니다.

step15_title = 쿵푸술사 - 대시공격 (->-> → D오래누름)
step15_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면 발차기로 상대를 밀어냅니다.

step16_title = 쿵푸술사 - 반격 (방어 성공시 바로 공격)
step16_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step17_title = 쿵푸술사 - 용의 자세 / 무기스킬(SD)
step17_help  = 용의 자세(SD)는 궁극의 자세를 잡은 뒤 상대를 빠르게 연타하는 스킬입니다. 공격 중에 방어키(S)를 누르면 발로 돌려치는 공격을 합니다.

step18_title = 쿵푸술사 - 쳐내기 / 갑옷스킬(ASD)
step18_help  = 쳐내기(ASD)는 손날로 강하게 내려쳐서 상대를 멀리 날려 보내는 스킬입니다.

step19_title = 쿵푸술사 - 밀쳐내기 / 투구스킬(AD)
step19_help  = 밀쳐내기(AD)는 상대를 발로 강하게 차서 멀리 날려 보내는 스킬입니다. 피격 된 상대는 스턴 상태가 되며 밀려나는\n중에 벽에 충돌 시 다시 튕겨져 나옵니다.

step20_title = 쿵푸술사 - 날아치기 / 망토스킬(AS)
step20_help  = 날아치기(AS)는 빠르게 전방으로 날아쳐서 상대를 약경직 상태로 만드는 스킬입니다. 공중에서도 사용이 가능합니다.

step21_title = 쿵푸술사 - 국민콤보 ①
step21_help  = ★용의 자세(SD) → 대시공격 (->-> → D → D) 용의 자세로 연타한 뒤 넘어진 대상을 대시공격으로 마무리 합니다.

step22_title = 쿵푸술사 - 국민콤보 ②
step22_help  = ★뱀의 돌격(뱀의 자세 → D)로 경직 시킨 후 학의 행진(학의 자세 → Dx4)와 기본공격(Dx4)으로 연타한 뒤 대시공격(->-> D → D)으로 마무리 합니다.



