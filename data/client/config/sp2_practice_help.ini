max_step = 18

step0_title  = 악마 - 기본소개
step0_help   = 악마는 지옥에서 올라와 공중을 날아다니며 상대를 혼란스럽게 만드는 빔을 쏘거나 화염구를 던져 상대를 제압하는 근거리 계열의 레어 용병입니다.

step1_title  = 악마 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 악마 - 비행(D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 비행 상태로 전환이 됩니다. 비행은 무기아이콘 상단의 비행 게이지가 노란색일 때만 비행이 가능하며, 서서히 게이지가 소모됩니다.

step3_title  = 악마 - 비행 중 상승 또는 하강 (비행 중 A키 또는 S키)
step3_help   = 비행상태에서 점프키(A)를 누르면 위로 상승하며, 방어키(S)를 누르면, 아래로 하강합니다. 공격키(D)를 오래 누르면 점프상태로 전환되면서 비행을 종료합니다.

step4_title  = 악마 - 비행공격 (비행 중 D키)
step4_help   = 비행 중 일정간격으로 상대를 랜덤하게 움직이게 하는 빔을 자동으로 발사합니다. 공격키(D)를 누르면 여러개로 분열되는 화염구를 발사하며 대상을 넉백시킵니다.

step5_title  = 악마 - 대시공격(->-> D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 잠시 경직시키는 공격을 합니다.

step6_title  = 악마 - 대시확장공격(->-> D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지해서 달리기가 발동되고 대시공격 성공 후 추가로 D키를 누르면 대상을 천천히 쓰러트립니다.

step7_title  = 악마 - 대시비행(->-> →D오래누름)
step7_help   = 달리기 도중 D키를 오래 입력시 방향키쪽으로 빠르게 날아가며 게이지를 소모합니다. 경로의 상대를 잡고 이동하며 추가로 D를 누르면 대상을 띄웁니다.

step8_title  = 악마 - 점프공격(A → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 잠시 경직시키고 추가로 D키를 입력하면 연속공격을 할 수 있으며 최대 3연속 공격이 가능합니다.

step9_title  = 악마 - 점프비행(A →D 오래누름)
step9_help   = 점프상태에서 D키를 살짝 눌렀다 떼면 공중에서 비행상태로 전환됩니다. 무기아이콘 상단의 비행 게이지가 노란색 일 때만 비행이 가능하며, 게이지가 소모됩니다.

step10_title = 악마 - 반격 (방어 성공시 바로 공격)
step10_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 반격 성공시 상대를 공중으로 띄우고 점프상태가 됩니다. 점프상태가 되어 점프공격으로 연계할 수 있습니다.

step11_title = 악마 - 불지옥 (SD)
step11_help  = 불지옥(SD)은 장판을 생성하는 불구슬을 발사하는 스킬입니다.방향키로 조종가능하며 많이 움직일 수록 장판 갯수가 늘어나며 D키를 누르거나 일정시간 뒤 폭파됩니다.

step12_title = 악마 - 메타몰포시스 (ASD)
step12_help  = 메타몰포시스(ASD)는 악마로 변신하는 스킬입니다. D키를 누르면 불덩이를 발사하고 점프 중 A키를 누르면 일정 시간동안 비행하며 불덩이를 자동으로 발사합니다.

step13_title = 악마 - 영혼 봉인(AD)
step13_help  = 영혼 봉인(AD)은 영혼을 봉인해 상대를 스턴시키는 스킬입니다. 일정시간내에 D키를 연타하면 연속이 가능하며 뒤에서 봉인되면 회피할 수 없습니다.

step14_title = 악마 - 박쥐 소환(AS)
step14_help  = 박쥐 소환(AS)은 전방으로 일정시간동안 날며 전진이동하는 박쥐떼를 소환하는 스킬입니다. 박쥐에 피격된 대상을 천천히 쓰러지게해 추가공격에 용이합니다.

step15_title = 악마 - 국민콤보 ①
step15_help  = ★박쥐 소환(AS)로 대상을 경직 후 →영혼 봉인(AD)으로 대상을 봉인시킨 후 →D키를 연타해 대상을 끌어 →불지옥(SD)으로 마무리합니다.

step16_title = 악마 - 국민콤보 ②
step16_help  = ★기본공격 (D → D → D)을 성공시켜 대상을 경직 후 대시비행(->-> →D오래누름) 후→ 추가D키 공격으로 대상을 띄운 후 → 불지옥(SD)으로 마무리 합니다.

step17_title = 악마 - 국민콤보 ③
step17_help  = ★대시공격(->-> D + D)으로 천천히 쓰러트리고 →대시비행(->-> →D오래누름)으로 대상을 잡은 후 →추가 D키 공격으로 대상을 띄워 →점프공격으로 마무리 합니다.


[Set106]

max_step = 15

step0_title  = 메이드 - 기본소개
step0_help   = 메이드는 사고뭉치 용병으로 빗자루질하며 상대를 날려버리거나 빗자루를 휘둘러 상대를 제압하는 근거리 계열의 레어 용병 입니다.

step1_title  = 메이드 - 기본공격 (D → D → D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 메이드 - 청소(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 청소 상태로 전환됩니다. 청소상태 시 자동 전진이며 방향키를 이용해 방향전환이 가능하며 공격키(D)를 떼면 해제 됩니다.

step3_title  = 메이드 - 청소2 (충돌)
step3_help   = 청소 상태에서 상대에게 충돌시 같이 쓸며 전진하며 최대 3명까지 쓸고 갈수 있습니다. 특별 게이지가 다 소모되거나 공격키(D)를 떼면 마무리로 날리는 공격을 합니다.

step4_title  = 메이드 - 대시공격(->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 잠시 띄우는 공격을 합니다.

step5_title  = 메이드 - 점프공격(A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 잠시 경직시키고 추가로 D키를 입력하면 연속공격을 할 수 있으며 최대 2연속 공격이 가능합니다.

step6_title  = 메이드 - 빗자루 스매쉬(A →D 오래누름)
step6_help   = 점프상태에서 공격키(D)를 오래 누르면 공중에서 회전을 하며 최대 2연타를 하며 아직 불안정한 기술로 메이드가 바닥과 충돌하며 한번 더 공격이 가능합니다.

step7_title = 메이드 - 반격 (방어 성공시 바로 공격)
step7_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 메이드가 뒤로 돌아 엉덩이 치기를하여 상대를 경직시키는 공격을 합니다.

step8_title = 메이드 - 대청소 (SD)
step8_help  = 대청소(SD)는 바닥을 쓸고 이동하면서 지나가는 곳 마다 먼지를 발생시켜 공격합니다. 방향키로 방향을 조절 할 수 있고 A키는 점프, D,S키는 스킬을 취소합니다.

step9_title = 메이드 - 진공청소기 (ASD)
step9_help  = 진공청소기(ASD)는 메이드가 숨겨둔 청소기를 꺼내어 전방에 상대방을 자신의 앞으로 끌어옵니다. 끌려온 적은 일정시간 정신을 못차려 추가공격에 용이합니다.

step10_title = 메이드 - 쇼핑카트 라이더(AD)
step10_help  = 쇼핑카트 라이더(AD)는 쇼핑카트를 소환하여 전방에 대상을 태우고 질주하는 스킬 입니다. 대상을 태운 카트에 맞은 다른 대상은 날아가게 됩니다.

step11_title = 메이드 - 티타임 (AS)
step11_help  = 티타임(AS)은 전방에 탁자를 소환하여 탁자의 범위 안에 있는 적들에게 차를 대접 하는 스킬입니다. 티타임을 즐기는 대상은 몇몇 공격에 보호됩니다.

step12_title = 메이드 - 국민콤보 ①
step12_help  = ★대시공격(->-> D)으로 대상을 띄운 후→티타임(AS) 으로 대상에게 차를 대접하고→대청소(SD)로 먼지를 뿌려놓고→쇼핑카트 라이더(AD)로 마무리 합니다.

step13_title = 메이드 - 국민콤보 ②
step13_help  = ★대시공격(->-> D)으로 대상을 띄운 후→공중에서 기본공격 (D→D→D→D) 4타 성공 후→점프공격(A→D) →빗자루스매쉬(A →D 오래누름)로 마무리 합니다.

step14_title = 메이드 - 국민콤보 ③
step14_help  = ★기본공격 (D → D → D) 3타 치자 마자→점프공격(A → D)으로 경직 후→대시공격(->-> D)으로 대상을 띄워 →빗자루 스매쉬(A →D 오래누름)로 마무리 합니다.


[Set107]

max_step = 16

step0_title  = 플래시 - 기본소개
step0_help   = 플래시는 빠른 스피드로 움직이는 용병으로 빠른 속도로 접근해 감전시킨 후 순간이동하며 연속을 공격하거나 전기를 발생시켜 상대를 제압하는 레어 용병 입니다.

step1_title  = 플래시 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 플래시 - 조준 (D누름유지)
step2_help   = 공격키(D)를 누르고 있으면 사정거리 내 대상을 자동으로 조준해 줍니다. 방향키로 방향을 바꿀 수 있고 공격키를 떼면 게이지 소모 후 대상을 향해 빠르게 이동합니다

step3_title  = 플래시 - 섬광번개 (D 누름떼기 D연타)
step3_help   = 공격키(D)를 누름떼기하여 대상과 충돌해 전기로 상대를 경직시킨 후 공격키(D)를 누르면 순간이동하며 감전시키고 일정횟수 이상 감전시키면 공중에 띄울 수 있습니다.

step4_title  = 플래시 - 대시공격1 (->-> → D + D + D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 잠시 경직시키고 연타 공격을 성공시키면 대상을 띄웁니다.

step5_title  = 플래시 - 대시공격2 (->-> → D오래누름)
step5_help   = 방향키를 빠르게 두 번 누르고 달리는 중에 공격키(D)를 오래 누르면 게이지를 소모해 전방으로 빠르게 이동할 수 있고 대상과 충돌하면 섬광번개를 사용 할 수 있습니다.

step6_title  = 플래시 - 점프공격(A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 잠시 경직시키고 추가로 D키를 입력하면 연속공격을 할 수 있으며 최대 2연속 공격이 가능합니다.

step7_title = 플래시 - 공중대시(점프 중 ->->)
step7_help  = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 전기를 방출하는 공격을 합니다. 공격당한 대상은 잠시 동안 경직상태가 됩니다.

step8_title  = 플래시 - 튕겨내기 (공격 받는 순간 방어)
step8_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step9_title  = 플래시 - 섬광토네이도 (SD)
step9_help   = 섬광토네이도(SD)는 빠르게 이동하여 충돌한 대상의 주변을 돌아 전기회오리를 생성하는 스킬입니다.공격키(D)를 연타하면 회오리가 커지고 대상을 띄울 수 있습니다.

step10_title  = 플래시 - 섬광 이동 (ASD)
step10_help   = 섬광 이동(ASD)은 전방 일정거리를 순간이동하는 스킬입니다. 범위내에 대상이 있으면 대상에게 순간이동 하고 나타나면서 대상을 경직킬 수 있습니다.

step11_title = 플래시 - 섬광 지공탄(AD)
step11_help  = 섬광 지공탄(AD)은 섬광으로 변신하여 섬광 지공탄을 발사하는 스킬 입니다. 방향키로 이동 가능하며 A,S,D키를 누르면 지공탄을 발사해 대상을 띄을 수 있습니다.

step12_title = 플래시 - 섬광 분신 (AS)
step12_help  = 섬광 분신(AS)은 여러 개의 분신을 퍼트려 상대를 경직시키는 스킬입니다. 방향키로 조준점을 지정할 수 있고 공격키(D)를 누르면 분신을 모을 수 있습니다.

step13_title = 플래시 - 국민콤보 ①
step13_help  = ★섬광 이동 (ASD)으로 대상을 경직시키고 →조준(D누름유지) 후 전진 이동하여 대상과 충돌해 경직시키고 → 섬광번개(D누름떼기 D연타)로 높이 띄워 마무리합니다.

step14_title = 플래시 - 국민콤보 ②
step14_help  = ★기본공격으로 대상을 경직시키고 →조준(D누름유지) 후 전진이동하여 경직 →섬광번개(D누름떼기 D연타) 로 띄운 후 →섬광토네이도(SD)로 마무리 합니다.

step15_title = 플래시 - 국민콤보 ③
step15_help  = ★조준(D누름유지) 후 전진 경직시키고 →섬광번개(D누름떼기 D연타)로 연타하여높이 띄운 후 →기본공격으로 다운 후 →섬광 분신(AS)으로 마무리합니다.

[Set108]

max_step = 17

step0_title  = 마영전 이비 - 기본소개
step0_help   = 마영전 이비는 마비노기 영웅전에 등장하는 캐릭터로 블링크와 낫을 이용한 날카로운 공격으로 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 마영전 이비 - 기본공격 (D→D→D→D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 마영전 이비 - 데몬 스플릿터 (D 누름떼기)
step2_help   = 공격키(D)를 살짝 눌렀다 떼면 낫을 이용한 스매시 공격을 합니다. 기본상태와 1타, 2타, 3타 후에 나오는 스매시 공격이 각각 다른 효과를 가지고 있습니다.

step3_title  = 마영전 이비 - 스페셜 대시 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 이비가 방향키 방향으로 스페셜 대시를 하게 됩니다. 이후 블링크로 연계됩니다.

step4_title  = 마영전 이비 - 블링크 (D 오래누름 → D)
step4_help   = 공격키(D)를 오래 누르면 이비가 방향키 방향으로 스페셜 대시를 하게 됩니다. 이후 공격키(D)키 입력시 방향키 방향으로 블링크가 발동됩니다.

step5_title  = 마영전 이비 - 대시 스페셜 대시 (->-> D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 입력시 방향키 방향으로 스페셜 대시가 발동됩니다.

step6_title  = 마영전 이비 - 대시 블링크 (->-> D → D)
step6_help   = 빠른 달리기 중 공격키(D)를 입력으로 스셜 대시 발동 후 추가 공격키(D) 입력시 방향키 방향으로 블링크가 발동됩니다.

step7_title  = 마영전 이비 - 점프 블링크 (A → D 오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 방향키 방향으로 이동하는 블링크가 가능합니다.

step8_title  = 마영전 이비 - 점프공격1 (A →D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 2연속 타격을 할 수 있고 대상을 바닥에 내려찍습니다.

step9_title  = 마영전 이비 - 점프공격2 (설명)
step9_help   = 이비가 공중에서 2연속 타격을 하면 2번째 내려찍는 힘을 이용해 충격파를 지면으로 날려 지면에 있는 대상을 경직시키는 공격도 동시에 나오게 됩니다.

step10_title  = 마영전 이비 - 블러디 스레드 (SD)
step10_help   = 블러디 스레드(SD)는 낫으로 크게 내려찍어 충격파를 발생시켜 타격과 동시에 마나로 이루어진 실로 연결해(D 오래누름)으로 대상을 경직시킬 수 있습니다.

step11_title  = 마영전 이비 - 중력 역전 (ASD)
step11_help   = 중력 역전(ASD)은 이비는 자신을 중심으로 주변의 중력을 역전시켜 대상을 들어올려 바닥으로 내려찍는 광역 마법공격입니다. 공중사용이 가능합니다.

step12_title  = 마영전 이비 - 마나실드 (AD)
step12_help   = 마나실드(AD)는 일정 게이지가 될때 마다 마나로 자신을 보호하는 투명한 마법 보호막을 생성하는 스킬로 최대 3개까지 저장이 가능합니다.

step13_title = 마영전 이비 - 터틀레그 (AS)
step13_help  = 터틀레그(AS)는 이비를 중심으로 주변 대상을 무겁게 만들어 일정시간동안 대상의 이동속도를 낮추는 광역 마법공격입니다. 누워있는 대상공격이 가능합니다.

step14_title = 마영전 이비 - 국민콤보 ①
step14_help  = ★터틀레그(AS) → 중력 역전(ASD) 터틀레그(AS)로 대상을 경직시키고 중력 역전(ASD)으로 마무리합니다.

step15_title = 마영전 이비 - 국민콤보 ②
step15_help  = ★기본 데몬스플릿터 (D누름떼기)로 대상을 띄워 → 점프공격(A →D →D) 2타 성공 후 → 내려오면서 중력 역전(ASD)으로 마무리합니다.

step16_title = 마영전 이비 - 국민콤보 ③
step16_help  = ★중력 역전(ASD)으로 대상을 띄워→블러디스레드(SD) →(D 오래누름)으로 대상을 경직→기본 데몬스플릿터(D누름떼기)로 띄워 기본공격으로 마무리합니다.

[Set109]

max_step = 17

step0_title  = 초능력자 - 기본소개
step0_help   = 초능력자는 초능력탄을 발사해 상대를 공중에 띄운 후 에너지구를 연사하거나 순간이동해 상대를 공격하여 제압하는 레어 용병 입니다.

step1_title  = 초능력자 - 기본공격 (D→D→D→D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 초능력자 - 초능력탄 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 게이지를 소모하여 초능력탄을 발사하고 상대가 초능력탄에 맞으면 순간이동이나 에너지구를 발사할 수 있는 초능력 상태가 됩니다.

step4_title  = 초능력자 - 순간이동 (D 오래누름 → A)
step4_help   = 초능력탄으로 상대를 피격 후 A키를 누르면 상대에게 순간이동 후 자동으로 상대를 바운딩 시키는 공격을 할 수 있고 에너지구 발사 도중 순간이동 공격이 가능합니다.

step3_title  = 초능력자 - 에너지구 (D 오래누름 →D)
step3_help   = 초능력탄으로 상대를 피격 후 D키를 누르면 에너지구를 발사할 수 있고 에너지구를 전부 쏘면 상대를 넉백시킬 수 있지만 순간이동 공격은 할 수 없습니다.

step5_title  = 초능력자 - 대시공격1 (->-> → D + D )
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 내려치는 공격을 합니다. 추가 공격키로 추가 공격이 가능합니다.

step6_title  = 초능력자 - 대시공격2 (->-> → D오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 달리는 중에 공격키(D)를 오래 누르면 대상을 잠시 띄우는 염력을 발생시키며 대상이 공중,다운상태면 염력으로 대상을 띄울 수 없습니다.

step7_title  = 초능력자 - 점프공격1(A → D + D + D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 올려치는 공격을 합니다. 최대 3연속 타격을 할 수 있으며 3번째 타격은 적을 바운딩시킵니다.

step8_title  = 초능력자 - 점프공격2(A → D 오래누름)
step8_help   = 점프한 상태에서 공격키(D)를 오래 누르면 하강하면서 바닥에 대상을 잠시 띄우는 염력을 발생시키며 대상이 공중이나 다운상태면 염력으로 대상을 띄울 수 없습니다.

step9_title  = 초능력자 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step10_title = 초능력자 - 초능력마구 (SD)
step10_help  = 초능력마구(SD)는 에너지구를 상대에게 발사하거나 상대의 공격을 에너지구를 소모해 방어 할 수 있고 D오래누름으로 초능력마구를 만든 후 D누름떼기로 발사합니다.

step11_title = 초능력자 - 체인지 (ASD)
step11_help  = 체인지(ASD)는 상대와 자신의 위치를 바꾼 후 상대를 천천히 쓰러트리는 순간이동 공격입니다. 다운, 공중 피격당하는 도중 사용이 가능합니다.

step12_title = 초능력자 - 염력 (AD)
step12_help  = 염력(AD)은 자신을 중심으로 주변의 중력을 역전시켜 공중의 대상을 잡아 맵으로 바운딩시키는 공격입니다. 공중의 대상에게만 공격이 가능합니다.

step13_title = 초능력자 - 스트레스를 한 방에~ (AS)
step13_help  = 스트레스를 한 방에~(AS)는 초능력 큐브로 대상을 포박해 공중에 가두고 방향키를 누른 방향으로 대상을 던지고 D키를 누르면 즉시 던지며 다운 대상도 타격이 가능합니다.

step14_title = 초능력자 - 국민콤보 ①
step14_help  = ★체인지(ASD)로 대상을 스턴상태로 만든 후→초능력마구(SD →D누름떼기)로 대상을 다운 시킨 후 →스트레스를 한 방에~(AS)로 마무리 합니다.

step15_title = 초능력자 - 국민콤보 ②
step15_help  = ★초능력탄(D 오래누름)으로 대상을 띄운 후 →순간이동(D 오래누름 → A)으로 대상을 바운딩 시킨 후 → 점프공격1(A → D + D + D)으로 마무리 합니다.

step16_title = 초능력자 - 국민콤보 ③
step16_help  = ★대시공격1(->-> →D + D )로 경직 →초능력탄(D오래누름)으로 띄우고 →에너지구(D)로 공중을 유지 후 → 순간이동으로 바운딩 후 → 점프공격1으로 마무리합니다.

[Set110]

max_step = 27

step0_title  = 서든어택 - 기본소개
step0_help   = 서든어택은 라이플 모드와 스나이퍼 모드를 이용해 근접에서 연사하거나 멀리서 저격하여 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 서든어택 - 기본공격 (D→D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 서든어택 - 대시공격 (->-> → D)
step2_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 밀어내는 공격을 합니다.

step3_title  = 서든어택 - 대시공격 중 구르기(대시공격 중 ->->)
step3_help   = 대쉬공격 이후 방향키를 빠르게 두번 입력하면 해당방향으로 구르면서 이동합니다. 대시공격 이후 상대의 공격을 피할 때 유용합니다.

step4_title  = 서든어택 - 기본 점프공격(A → D + D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 올려치는 공격을 합니다. 최대 2연속 타격을 할 수 있으며 2번째 타격은 적을 넉백시킵니다.

step5_title  = 서든어택 - 공중대시 (A → ->->)
step5_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 두 번 누르면 공중에서 해당 방향의 지상으로 빠르게 구르는 이동을 하는 공중 대시가 발동됩니다.

step6_title  = 서든어택 - 라이플 모드 (D 누름 떼기)
step6_help   = 공격키(D)를 1초가량 눌렀다 떼면 라이플 모드가 되어 전방으로 자동조준이 되며 공격키(D) 입력마다 대상을 연사하는 공격합니다.

step7_title  = 서든어택 - 라이플 모드 (헤드샷)
step7_help   = 라이플 모드에서 일정시간 내에 대상을 4발 맞추게 되면 헤드샷이 발동해 대상이 경직에 걸리게 됩니다. 경직을 걸어 전투에서 우위를 차지할 수 있습니다.

step8_title  = 서든어택 - 라이플 모드 점프사격(A → D + D + D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 점프사격 공격을 합니다. 최대 3연속 사격을 할 수 있습니다.

step9_title  = 서든어택 - 라이플 모드 공중대시 (A → ->->)
step9_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 두 번 누르면 공중에서 해당 방향의 지상으로 빠르게 구르는 이동을 하는 공중 대시가 발동됩니다.

step10_title  = 서든어택 - 라이플 모드 스왑1 (->->)
step10_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동하며 기본상태로 자동 전환됩니다.

step11_title  = 서든어택 - 라이플 모드 스왑2 (->-> + D)
step11_help   = 방향키를 빠르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동하며 추가 공격키(D) 입력시 자동으로 스나이퍼 모드로 전환됩니다.

step12_title  = 서든어택 - 장전 (S 오래)
step12_help   = 방어키(S)를 오래 누르고 있거나 총알이 한발도 없을 경우 공격키를 누르면 장전이 발동됩니다. 총알이 없으면 사격이 불가능하므로 틈틈이 장전을 해주어야 합니다.

step13_title  = 서든어택 - 스나이퍼 모드 (D 누름 유지)
step13_help   = 공격키(D)를 누르고 있으면 스나이퍼 모드가 되며 이후 추가 공격키(D)를 누름 유지하면 조준 하고, 입력을 떼면 조준된 대상에게 총알을 발사합니다.

step14_title  = 서든어택 - 스나이퍼 모드 (3단 조준)
step14_help   = 스나이퍼 상태에서 공격키(D)를 유지하면 총 3단 조준이 가능하며 조준 약경직의 효과,정조준 무릎꿇기 효과 정밀조준 넉백 효과가 발동됩니다.

step15_title  = 서든어택 - 스나이퍼 모드 조준이동(D누름유지+방향키)
step15_help   = 공격키(D)를 누르고 있으면서 방향키를 추가로 누르면 대상을 조준 및 정조준한 상태로 상, 하, 좌, 우로 이동 할 수 있으며 이 때 공격키를 떼면 총알이 발사됩니다.

step16_title  = 서든어택 - 스나이퍼 모드 점프저격 (A→D)
step16_help   = 점프를 한 후 공격키를 누르면 점프 저격이 됩니다. 점프 저격 역시 공격키를 오래 누르면 사정거리 내 대상을 조준하여 저격할 수 있으나 정조준은 되지 않습니다.

step17_title  = 서든어택 - 스나이퍼 모드 스왑1 (->->)
step17_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동하며 기본상태로 자동 전환됩니다.

step18_title  = 서든어택 - 스나이퍼 모드 스왑2 (->-> + D)
step18_help   = 방향키를 빠르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동하며 추가 공격키(D) 입력시 자동으로 라이플 모드로 전환됩니다.

step19_title = 서든어택 - 반격 (방어 성공시 바로 공격)
step19_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 서든어택이 몸통 박치기를하여 상대를 넉백시키는 공격을 합니다.

step20_title = 서든어택 - 멀티킬 (SD)
step20_help  = 멀티킬(SD)은 사용후 공격키(D) 연타시 자신을 중심으로 범위안에 대상을 무차별 난사하는 스킬입니다. 거리에 따라 라이플 혹은 스나이퍼로 공격합니다.

step21_title = 서든어택 - 지원요청 (ASD)
step21_help  = 지원요청(ASD)은 본부에게 지원을 요청해 대원을 2명 호출하는 스킬입니다. 호출된 대원들은 자신을 일정시간 따라다니며 사용자를 엄호하는 공격을 합니다.

step22_title = 서든어택 - 해제 (AD)
step22_help  = 해제(AD)은 자신을 중심으로 범위에 있는 지뢰와 각종 자신을 위협 할 수 있는 것들을 해제하여 폭파하는 기술입니다.시전 후 공격키(D)를 누름 유지시 성공합니다.

step23_title = 서든어택 - S402 (AS)
step23_help  = S402(AS)는 발동 후 공격키(D)를 입력하면 전방으로 연막탄을 투척하여 연기를 만들어 상대의 시야를 잠시가리며 아군이 연기속으로 들어가면 보이지 않습니다.

step24_title = 서든어택 - 국민콤보 ①
step24_help  = ★S402 (AS) → 서든어택 - 멀티킬 (SD) S402(AS)을 투척하여 상대를 경직시킨 후 → 멀티킬(SD)를 사용후 공격키(D)를 연타해 마무리합니다.

step25_title = 서든어택 - 국민콤보 ②
step25_help  = ★기본공격(D+D)→라이플모드 (D누름떼기)→D키 연타 기본공격 2타로 대상을 경직 후→D키 누름떼기로 라이플 모드로 변한 후 공격키(D) 연타하여 마무리합니다.

step26_title = 서든어택 - 국민콤보 ③
step26_help  = ★스나이퍼 모드에서 정조준으로 상대 맞추어 무릅꿇기를 만든 후 → 상대쪽으로 대시 구르기 후 공격키(D)를 입력하면 라이플 모드가 되어 연사로 마무리합니다.

[Set111]

max_step = 17

step0_title  = 슬래셔 - 기본소개
step0_help   = 슬래셔는 상대에게 빠른 속도로 접근하여 회전베기를 연타해 상대를 제압 후 재전진이동으로 상대가 정신차리기 전에 상대를 회피 할 수 있는 레어 용병 입니다.

step1_title  = 슬래셔 - 기본공격 (D→D→D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 슬래셔 - 광속이동(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 게이지를 소모해 일정거리 전진이동을 할 수 있고 전진이동 후 회전베기,관통이동을 사용할 수 있습니다. 방향키로 방향회전이 가능합니다.

step3_title  = 슬래셔 - 회전베기 (D 오래누름 →D)
step3_help   = 광속이동 사용 후 공격키 (D)를 누르면 상대를 경직시키킬 수 있습니다. 최대 4연속 타격을 할 수 있으며 4번째 타격은 적을 스턴시킬 수 있습니다.

step4_title  = 슬래셔 - 관통이동 (D 오래누름 →D 오래누름)
step4_help   = 광속이동 후 공격키(D)를 오래 누르면 게이지를 소모하지 않고 전진이동하며 상대와 충돌하면 상대를 띄웁니다. 회전베기 도중 관통이동을 사용할 수 있습니다

step5_title  = 슬래셔 - 대시공격1 (->-> → D + D + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 띄우는 공격을 합니다.

step6_title  = 슬래셔 - 대시공격2 (->-> → D오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 달리는 중에 공격키(D)를 오래 누르면 게이지를 소모해 광속이동이 가능하고 회전베기,관통이동을 추가로 사용할 수 있습니다.

step7_title  = 슬래셔 - 점프공격1(A → D + D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 내려치는 공격을 합니다. 최대 2연속 타격을 할 수 있으며 2번째 타격은 적을 다운시킵니다.

step8_title  = 슬래셔 - 점프공격2(A → D 오래누름)
step8_help   = 점프한 상태에서 공격키(D)를 오래 누르면 게이지를 소모해 대각선 아래로 광속이동이 가능하고, 회전베기,관통이동을 추가로 사용할 수 있습니다.

step9_title = 슬래셔 - 반격 (방어 성공시 바로 공격)
step9_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 최대 4연속 타격을 할 수 있으며 2번째 타격은 적을 바운딩 시킬 수 있고 4번째 타격은 적을 넉백시킵니다.

step10_title = 슬래셔 - 광륜난격 (SD)
step10_help  = 광륜난격(SD)은 전진이동 후 회전베기가 자동으로 발동되고 회전베기 도중 D키를 누르면 추가 타격이 가능하며 S키를 누르면 재이동하며 점프상태일때도 사용가능합니다.

step11_title = 슬래셔 - 전륜 난격 (ASD)
step11_help  = 전륜난격(ASD)은 표창을 소환해 이동하며 일정범위내의 상대를 표창으로 공격하는 스킬입니다. 일정시간 동안 D키를 누르면 표창으로 상대를 경직시킬 수 있습니다.

step12_title = 슬래셔 - 풍화륜격 (AD)
step12_help  = 풍화륜격(AD)은 적들을 끌고 다니는 거대 칼날을 발사하는 스킬입니다. D키를 누르면 칼날을 발사하며 점프상태일때도 사용이 가능하며 A,S키로 높이를 조정합니다.

step13_title = 슬래셔 - 회전참격 (AS)
step13_help  = 회전참격(AS)은 주변의 적들을 흡수하여 공격하는 거대한 회전칼날 발사는 스킬입니다. D키를 누르면 칼날을 발사하며 점프상태일 때도 사용이 가능합니다.

step14_title = 슬래셔 - 국민콤보 ①
step14_help  = ★풍화륜격 (AD) → 기본공격  →광륜난격 (A + SD) 풍화륜격 (AD)으로 띄운 후 → 기본공격으로 다운 → 광륜난격 (A + SD)으로 마무리합니다.

step15_title = 슬래셔 - 국민콤보 ②
step15_help  = ★기본공격 →광속이동→관통이동 기본공격 3타로 대상을 스턴시킨 후 →D오래 누름으로 광속이동 →D오래 누름으로 관통이동으로 마무리합니다.

step16_title = 슬래셔 - 국민콤보 ③
step16_help  = ★D오래 누름으로 광속이동 →회전베기로 스턴시킨 후 →D오래 누름으로 광속이동으로 경직 후 →점프 광륜난격으로 후 →추가 S키 공격으로 마무리합니다.


[Set112]

max_step = 14

step0_title  = 탑플레이트 손태양 - 기본소개
step0_help   = 탑플레이트 손태양은 전투를 도울 탑플레이트를 보내어 탑플레이트와 함께 합동 콤보 및 다양한 공격으로 대상을 제압하는 특수계열 프리미엄 용병입니다.

step1_title  = 탑플레이트 손태양 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 탑플레이트 손태양 - 준비 상태 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 어택 디쉬 위에 탑플레이트를 올리게 되고, 이후의 모든 공격에 탑플레이트가 명령에 반응해 각각 다른 루트로 공격을 하게 됩니다.

step3_title  = 탑플레이트 손태양 - 특별 게이지
step3_help   = 무기 아이콘 우측에 게이지가 노란색 이상일 경우에만 준비 상태로 전환이 가능하며, 특별 게이지는 준비 상태 전환 후에 지속적으로 감소됩니다.

step4_title  = 탑플레이트 손태양 - 대시공격 (->-> → D + D )
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 찌르는 공격을 합니다. 추가 공격키로 추가 공격이 가능합니다.

step5_title  = 탑플레이트 손태양 - 점프공격(A →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발차기 공격을 합니다. 최대 3연속 타격을 할 수 있으며 3번째 타격은 공중의 적을 당겨옵니다.

step6_title = 탑플레이트 손태양 - 반격 (방어 성공시 바로 공격)
step6_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 탑플레이트 손태양이 박치기를하여 상대를 약 경직시키는 공격을 합니다.

step7_title  = 탑플레이트 손태양 - 파이어플루마 / 무기스킬(SD)
step7_help   = 파이어플루마(SD)는 자신이 있던 자리에 탑플레이트를 생성하여 탑플레이트에 마그나소울 블레이즈 라이거를 소환하여 적들을 타격하는 기술입니다.

step8_title  = 탑플레이트 손태양 - 볼캐닉 봄 / 갑옷스킬(ASD)
step8_help   = 볼캐닉 봄(ASD)은 전방에 탑플레이트를 소환해 주변의 대상을 빨아들여 올라간뒤 내려오며 모은 대상을 타격하는 기술입니다. 적을 모이게 할 때 매우 유용합니다.

step9_title  = 탑플레이트 손태양 - 파이어바이트 / 투구스킬(AD)
step9_help   = 파이어바이트(AD)는 전방에 탑플레이트를 발사하여 지나가는 대상에게 폭팔을 일으키며 지나온 자리에 불을 만드는 기술입니다. 점프상태일때도 사용가능합니다.

step10_title  = 탑플레이트 손태양 - 스파이럴파이어/ 망토스킬(AS)
step10_help   = 스파이럴파이어(AS)는 전방으로 탑플레이트를 날려 대상을 경직시킨 후 탑플레이트가 자신에게 돌아오면 다시 한번 폭팔을 일으키는 기술입니다.

step11_title = 탑플레이트 손태양 - 국민콤보 ①
step11_help  = ★볼캐닉 봄(ASD) → 파이어바이트(AD) 볼캐닉 봄(ASD)으로 대상을 경직 후 → 파이어바이트(AD)로 대상을 날려 마무리합니다.

step12_title = 탑플레이트 손태양 - 국민콤보 ②
step12_help  = ★대시공격 (->-> → D + D ) 대상 띄움 → 점프공격(A →DDD)으로 대상을 넘김→점프 파이어바이트(AD)로 대상을 띄워 점프공격(A →DDD)으로 마무리 합니다.

step13_title = 탑플레이트 손태양 - 국민콤보 ③
step13_help  = ★대시공격 (->-> → D + D ) 대상 띄움 → 점프공격(A →DDD)으로 대상을 넘김→파이어플루마(SD)로 대상을 경직 → 파이어바이트(AD)로 마무리 합니다.


[Set113]

max_step = 16

step0_title  = 어스 메이지 - 기본소개
step0_help   = 어스 메이지는 대지 속성의 마법 공격을 통해 대상의 방어력을 약화시키고 거대한 골렘을 소환하여 강력한 지진을 일으켜 상대를 제압하는 레어 용병입니다.

step1_title  = 어스 메이지 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 어스 메이지 - 마법차징 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 무기 스킬의 게이지 회복 속도가 1.5배 증가하며, 마법차징 시작 후 일정시간동안 방어력,이동속도가 증가되며 방향키로 이동이 가능합니다.

step3_title  = 어스 메이지 - 모래바람 (D 누름떼기)
step3_help   = 공격키(D)를 눌렀다 떼면 마법진에 모래바람을 생성해 대상을 띄우는 공격을 합니다. 모래바람에 피격된 대상의 방어력을 일정시간동안 약화시킵니다.

step4_title  = 어스 메이지 - 마법방어 (S 누름)
step4_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든 방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step5_title  = 어스 메이지 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대각선 아래로 암석구를 발사하는 공격을 합니다 일정시간동안 대상의 방어력을 약화시킵니다.

step6_title  = 어스 메이지 - 이중점프 (A 두번 누름)
step6_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step7_title  = 어스 메이지 - 지팡이 강타 (->->)
step7_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 지팡이를 내려쳐 대상을 경직시킬 수 있습니다.

step8_title  = 어스 메이지 - 대지가르기 (->-> → D)
step8_help   = 방향키를 빠르게 두 번 누른 후 공격키(D)를 누르면 그 방향으로 대지가르기 마법을 발사하고 피격된 대상의 방어력을 일정시간 동안 약화됩니다.

step9_title  = 어스 메이지 - 대지의 분노 / 무기스킬(SD)
step9_help   = 대지의 분노(SD)는 마법진 위치에 골렘을 소환해 지진을 일으키는 스킬입니다. 골렘에게 피격시 대상을 넉백시키며 일정시간동안 방어력을 크게 약화 시킵니다.

step10_title  = 어스 메이지 - 개미지옥 / 갑옷스킬(ASD)
step10_help   = 개미지옥(ASD)은 조준점 위치에 상대를 끌어당기는 개미지옥을 생성하는 스킬입니다. 방향키로 조준점을 움직인 후 공격키(D)누르면 개미지옥이 발동됩니다.

step11_title  = 어스 메이지 - 이럽션 / 투구스킬(AD)
step11_help   = 이럽션(AD)은  지면을 폭발시켜 전방을 공격하는 스킬 입니다. 이럽션에 피격된 상대는 넉백됩니다.

step12_title = 어스 메이지 - 모래감옥 / 망토스킬(AS)
step12_help  = 모래감옥(AS)은 방향키로 마법진을 조종 후 공격키(D)를 눌러 대상을 모래로 가두고 대상을 공중으로 띄운 후 폭파시켜 지면으로 바운딩시킬 수 있습니다.

step13_title = 어스 메이지 - 국민콤보 ①
step13_help  = ★기본공격 → 모래감옥(AS) → 이럽션(AD) 기본공격으로 대상을 다운 시킨 후 모래감옥으로 바운딩 시킨 후 이럽션으로 마무리합니다.

step14_title = 어스 메이지 - 국민콤보 ②
step14_help  = ★모래감옥 →기본공격  → 대지의 분노(SD) 모래감옥으로 바운딩시킨 후 기본공격으로 공중대상을 추가 타격 후 대지의 분노로 마무리합니다.

step15_title = 어스 메이지 - 국민콤보 ③
step15_help  = ★모래바람으로 다운 →대지가르기로 추가 공격 후 → 개미지옥(ASD)으로 당긴 후 → 대지의 분노(SD)로 마무리합니다.


[Set114]

max_step = 16

step0_title  = 타이탄 - 기본 소개
step0_help   = 타이탄은 양손의 거대한 건틀릿을 이용한 공격으로 단단한 방어를 범위로 파괴하는 능력을 보유한 근접 계열 용병입니다.

step1_title  = 타이탄 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 타이탄 - 대지 구르기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 상대의 방어를 파괴하고 띄워 버리는 대지 구르기 공격이 발동됩니다. 기본 공격과 섞어 사용하면 전투에서 쉽게 우위를 차지할 수 있습니다.

step3_title  = 타이탄 - 점프공격1 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 수직으로 내려찍는 공격을 합니다. 점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 타이탄 - 공중 주먹발사 (A →D 오래누름)
step4_help   = 점프 상태에서 공격키(D)를 누르면, 타이탄 주먹을 지상으로 발사 하며, 발사후 점프키(A)를 누르면 지상으로 내려찍으며 바닥공격이 가능합니다.

step5_title  = 타이탄 - 대시공격1 (->-> → D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키는 공격을 합니다.

step6_title  = 타이탄 - 대시 주먹발사 (->-> → D 오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 오래 누르면 달리는 방향으로 주먹 발사 공격이 가능합니다.

step7_title  = 타이탄 - 대시 돌격(->-> → D 오래누름 →A)
step7_help   = 주먹발사 이후 점프키(A)를 누르면 발사 방향으로 이동하며 전진 공격이 가능합니다. 무기 아이콘에 표시된 숫자만큼 연속이동이 가능합니다.

step8_title  = 타이탄 - 튕겨내기 (공격 받는 순간 방어)
step8_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step9_title  = 타이탄 - 타이탄의 격노 / 무기스킬(SD)
step9_help   = 타이탄의격노(SD)는 건틀릿으로 대상을 잡아 상대를 내동댕이쳐 충격파를 발생시키는 스킬입니다. 3번째 충격파에 맞은 대상은 같이 공중으로 날아갑니다.

step10_title  = 타이탄 - 고대의 분노 / 갑옷스킬(ASD)
step10_help   = 고대의 분노(ASD)는 고대의 기둥을 소환하여 주변의 대상을 밀어내는 기술입니다. 점프중 사용이 가능하며 높이 뜬 대상은 추가 연계가 용의 합니다.

step11_title  = 타이탄 - 타이탄의 분노 / 투구스킬(AD)
step11_help   = 타이탄의 분노(AD)는 공중으로 상승하여 주변에 닿은 대상을 날려버리며 공격키(D) 입력시 지면을 강하게 내리쳐 상대를 멀리 날려 버리기가 가능합니다.

step12_title  = 타이탄 - 풍차 돌리기 / 망토스킬(AS)
step12_help   = 풍차 돌리기(AS)는 고대의 기둥을 소환하여 든채로 휘둘러 대상을 잡아 공격키(D) 입력시 바닥에 강하게 내리치는 공격을 합니다.

step13_title = 타이탄 - 국민 콤보 ①
step13_help  = ★고대의 분노(ASD) → 타이탄의격노(SD) 고대의 분노(ASD)를 사용해 대상을 날려 눕게 만든뒤 타이탄의격노(SD)를 사용하여 마무리 합니다.

step14_title = 타이탄 - 국민 콤보 ②
step14_help  = ★대시공격1 → 대지 구르기(D오래누름) 대시공격을 사용하여 대상을 경직시킨 후 대지 구르기 3연타로 대상을 연속으로 띄워 마무리 합니다.

step15_title = 타이탄 - 국민 콤보 ③
step15_help  = ★풍차 돌리기(AS)로 대상을 잡은뒤 → 대지 구르기(D오래누름)로 대상의 뛰워 → 타이탄의격노(SD)로 대상을 내려찍어 마무리 합니다.


[Set115]

max_step = 18

step0_title  = 초시공전사 - 기본 소개
step0_help   = 초시공전사는 시공을 지배하는 힘으로 주변을 일시정지 시키고 공중에 뛰어올라 상대를 잡아 던지거나 공간을 폭파시켜 상대를 제압하는 레어용병입니다.

step1_title  = 초시공전사 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 초시공전사 - 하이퍼웨폰
step2_help   = 캐릭터의 생명력이 일정수치 이하로 줄어들면 초시공전사의 무기의 크기가 점차 커집니다. 무기는 총 3번 커질 수 있으며 생명력이 회복되어도 크기가 줄어들지않습니다.

step3_title  = 초시공전사 - 타임스톱 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 상대를 일시정지 시키는 빔을 발사합니다. 빔을 공중에서 맞으면 공중에서 멈춰있으며 게이지를 소모합니다. 공중에서 사용할 수 있습니다.

step4_title  = 초시공전사 - 점프공격1 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 올려치는 공격을 합니다. 최대 3연속 타격을 할 수 있으며 3번째 타격은 공중의 적을 다운시킵니다.

step5_title  = 초시공전사 - 캐칭(점프 중 ->->)
step5_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 창으로 찌르는 공격을 합니다. 공격한 대상을 잡은 후 제자리에서 회전하는 상태가 됩니다.

step6_title  = 초시공전사 - 캐칭쓰루(점프 중 ->-> + D)
step6_help   = 캐칭으로 대상을 잡은 상태에서 일정시간이 지나거나 공격키(D)를 누르면 회전도중 바라보는 방향으로 대상을 던지는 공격을 하며 다운상태가 됩니다.

step7_title  = 초시공전사 - 대시공격1 (->-> → D →D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키며 추가공격 성공시 대상을 띄울 수 있습니다.

step8_title  = 초시공전사 - 슬라이딩 (->-> → D 오래누름)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 오래 누르면 달리는 방향으로 전진이동 후 대상을 경직시킵니다.

step9_title  = 초시공전사 - 슬라이딩어택(->-> → D 오래누름 + D)
step9_help   = 슬라이딩(->-> → D 오래누름) 후 공격키(D)키를 누르면 상대를 띄우는 공격이 가능합니다.

step10_title  = 초시공전사 - 반격 (방어 성공시 바로 공격)
step10_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step11_title = 초시공전사 - 메가익스플로젼 / 무기스킬(SD)
step11_help  = 메가익스플로젼(SD)은 주변을 일시정지 시키고 공격키(D)를 연타하면 공간을 랜덤하게 소환합니다. 일정시간이 지나거나 최대생성갯수를 초과하면 공간을 폭파합니다.

step12_title  = 초시공전사 - 초전공타 / 갑옷스킬(ASD)
step12_help   = 초전공타(ASD)는 공중에 뜬 주변의 대상에게 순간이동해 대상을 잡아 던지는 스킬입니다. 공중의 대상에게만 사용이 가능하며 공중에서도 사용 할 수 있습니다.

step13_title  = 초시공전사 - 메가스트라이크 / 투구스킬(AD)
step13_help   = 메가스트라이크(AD)는 일정거리 전진이동 후 대상을 잡아 뛰어오른 후 바닥에 내리꽂는 스킬입니다. 공격 당한 대상은 바운딩 상태가 됩니다.

step14_title  = 초시공전사 - 광속회전 / 망토스킬(AS)
step14_help   = 광속회전(AS)은 부매랑은 발사하여 대상을 경직시키는 스킬입니다. 부메랑은 발사 후 시전자에게 되돌아오며 시전자를 따라 움직입니다.

step15_title = 초시공전사 - 국민 콤보 ①
step15_help  = ★메가스트라이크(AD) →메가익스플로젼(SD) 메가스트라이크(AD를 사용해 대상을 잡아 바운딩 시킨 후 메가익스플로젼(SD)으로 대상을 넉백시켜 마무리합니다.

step16_title = 초시공전사 - 국민 콤보 ②
step16_help  = ★기본공격 → 타임스톱 (D 오래누름 )→ 캐칭쓰루 기본공격으로 대상을 띄우고 타입스톱으로 대상을 일시 정지 시킨 후 캐칭쓰루(점프 중 ->-> → D)로 마무리 합니다.

step17_title = 초시공전사 - 국민 콤보 ③
step17_help  = ★타임스톱 (D 오래누름 )로 대상을 정지시킨 후 →슬라이딩어택(->-> → D 오래누름 + D)으로 띄운 후 →타입스톱 후 →캐칭쓰루(점프 중 ->-> → D)로 마무리 합니다.


[Set116]

max_step = 19

step0_title  = 트레이스 김윤성 - 기본소개
step0_help   = 트레이스 김윤성은 다리의 부스터를 이용하여 공중을 활보하며 연속4단 점프와 점프 대시를 활용하여 대상을 제압하는 근접계열 프리미엄 용병입니다.

step1_title  = 트레이스 김윤성 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 트레이스 김윤성 - 섬머솔트킥 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 내려찍기를 한 후 자동으로 섬머솔트킥이 발동됩니다. 내려찍기 공격에만 방어 파괴 공격이 가능 합니다.

step3_title  = 트레이스 김윤성 - 부스터 게이지1
step3_help   = 무기 아이콘 우측에 게이지는 공중이동 및 공격에서 사용되며 소닉 붐 킥, 2단, 3단, 4단 점프, 점프 대시 사용시 게이지가 감소됩니다.

step4_title  = 트레이스 김윤성 - 부스터 게이지2
step4_help   = 부스터 게이지는 트레이스 김윤성이 점프하여 공중에서 소모한 게이지 양에 비례하여 착지 전의 김윤성의 공중 공격들의 효과를 증가 시킵니다.

step5_title  = 트레이스 김윤성 - 대시공격 (->-> → D + D )
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 내려찍는 공격을 합니다. 추가 공격키로 추가 공격이 가능합니다.

step6_title  = 트레이스 김윤성 - 점프공격(A →D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발차기 공격을 합니다. 점프 공격의 타격은 공중과 지상의 상대를 바운딩 시키는 공격을 합니다.

step7_title  = 트레이스 김윤성 - 소닉 붐 킥 (A →D오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래누르면 발차기 공격을 합니다. 소닉 붐 킥 타격은 상대를 빠르게 날려 튕겨져 띄우는 공격이 가능합니다.

step8_title  = 트레이스 김윤성 - 긴급공격 (A →S)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 방어키(S)를 누르면 긴급공격 기술을 사용합니다. 현재 가진 부스터 게이지를 모두 사용합니다.

step9_title  = 트레이스 - 공중대시 (A → ->->)
step9_help   = 점프키(A)를 눌러 점프한 후 방향키를 빠르게 두 번 누르면 해당 방향으로 직선 이동을 하게 됩니다. 공중대시 사용 시 이전 공격과 점프의 제한이 풀리게 됩니다.

step10_title = 트레이스 김윤성 - 반격 (방어 성공시 바로 공격)
step10_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 트레이스 김윤성이 발을 들어 상대를 관통하는 충격파를 전방으로 쏘는 공격을 합니다.

step11_title  = 트레이스 김윤성 - 충격파 / 무기스킬(SD)
step11_help   = 충격파는(SD)는 전방으로 충격파를 날려 일정 횟수 타격이 된 상대를 공중에 띄우는 기술입니다. 공중사용이 가능하며 공중 사용시 다운 대상 공격이 가능합니다.

step12_title = 트레이스 김윤성 - 칼솔럼의 구슬(Special SD)
step12_help  = 칼솔럼의 구슬(SD)은 충격파(SD)의 강화형 스킬입니다. 김윤성의 체력이 30％ 이하로 떨어지면 충격파 스킬이 칼솔럼의 구슬 스킬로 변경됩니다.

step13_title  = 트레이스 김윤성 - 새끼 상어 / 갑옷스킬(ASD)
step13_help   = 새끼 상어(ASD)는 공중으로 뛰어 올라 다리에서 16개의 미사일을 발사하는 스킬입니다. 방어 가능 스킬로 다운상태 대상도 공격이 가능합니다.

step14_title  = 트레이스 김윤성 - 탈출한다!! / 투구스킬(AD)
step14_help   = 탈출한다!!(AD)는 자신이 있던자리에 충격파를 발생시키며 공중으로 뛰어 오릅니다. 탈출한다!! 는 지상/공중/다운상태에서 사용가능하며 피격중 사용 가능합니다.

step15_title  = 트레이스 김윤성 - 진입한다!!/ 망토스킬(AS)
step15_help   = 진입한다!!(AS)는 조준점을 잡고 상대에게 돌진해 대상을 띄우는 기술입니다. 공중 사용이 가능하며 정조준시 주변에 대상도 같은 타격이 가능합니다.

step16_title = 트레이스 김윤성 - 국민콤보 ①
step16_help  = ★충격파(SD) → 기본공격 지상에서 충격파(SD)으로 대상을 띄운 후 → 기본공격 연타로 대상을 날려 마무리합니다.

step17_title = 트레이스 김윤성 - 국민콤보 ②
step17_help  = ★충격파(SD) → 점프공격 → 새끼 상어(ASD) 지상에서 충격파(SD)으로 대상을 띄운 후 → 점프공격 → 새끼 상어(ASD)로 마무리 합니다.

step18_title = 트레이스 김윤성 - 국민콤보 ③
step18_help  = ★점프공격으로 대상을 띄운 후 → 소닉붐 킥(A→D오래누름)으로 한번 더 뛰운 후 → 진입한다!!(AS) 스킬사용 → 점프공격 → 충격파(SD)로 마무리 합니다.


[Set117]

max_step = 16

step0_title  = 신비술사 - 기본소개
step0_help   = 신비술사는 마법의 보옥을 자유자재로 조종하여 원거리에서 상대를 공격하고 상대의 자리를 임의로 바꿔 당황한 상대를 제압하는 레어 용병입니다.

step1_title  = 신비술사 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 신비술사 - 미스틱아이 (D누름떼기)
step2_help   = 공격키(D)를 살짝 눌렀다가 떼면 캐릭터를 따라 움직이는 보옥을 발사합니다. 보옥은 캐릭터를 따라 움직이고 피격한 상대에게 미스틱아이를 표시하고 게이지를 소모합니다.

step3_title  = 신비술사 - 미스틱파워 (D 누름유지)
step3_help   = 공격키(D)를 누르고 있으면 주변 일정 범위 내에 미스틱 아이가 표시된 상대에게 구슬을 사용해 공격할 수 있습니다. 일정횟수이상 타격시 넉백시킬 수 있습니다.

step4_title  = 신비술사 - 미스틱파워 사용방법 ①
step4_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 미스틱 파워는 대기, 걷기, 점프, 대시 중에도 공격키(D) 누름떼기로 사용이 가능합니다.

step5_title  = 신비술사 - 미스틱파워 사용방법 ②
step5_help   = 미스틱 파워를 사용하면 일정시간마다 일정량의 게이지가 소모되고 게이지가 전부 소모되거나 미스틱 아이가 사라지면 미스틱파워 공격을 할 수 없습니다.

step6_title  = 신비술사 - 점프공격 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대각선 아래로 보옥을 발사하는 공격을 합니다 공격성공시 재점핑하여 추가 공격을 할 수 있습니다.

step7_title  = 신비술사 - 이중점프 (A 두번 누름)
step7_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step8_title  = 신비술사 - 대시공격 (->-> → D + D )
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 보옥을 발사해 공격을 합니다. 추가 공격키로 추가 발사가 가능합니다.

step9_title  = 신비술사 - 미스틱볼 / 무기스킬(SD)
step9_help   = 미스틱볼(SD)은 보옥을 발사해 피격한 상대들의 위치를 랜덤하게 맞바꾸는 스킬입니다. D키를 누르고 있으면 보옥의 발사 범위와 갯수가 증가합니다.

step10_title = 신비술사 - 리플레이스 / 갑옷스킬(ASD)
step10_help  = 리플레이스(ASD)는 즉시 용병을 교체할 수 있도록 하는 스킬입니다. 다운,피격,점프,경직 상태일 때 사용 할 수 있습니다.

step11_title = 신비술사 - 포지셔닝 / 투구스킬(AD)
step11_help  = 포지셔닝(AD)은 일정시간이 지나거나 AD키를 누르면 포지셔닝(AD)키를 최초로 사용한 장소로 순간이동을 사용해 복귀하는 스킬입니다.

step12_title = 신비술사 - 봉인 / 망토스킬(AS)
step12_help  = 봉인(AS)은 타격 성공시 상대의 패시브 및 액티브 스킬을 일정시간 동안 사용할 수 없게 만드는 스킬입니다.

step13_title = 신비술사 - 국민콤보 ①
step13_help  = ★기본공격 → 미스틱아이 → 미스틱파워 기본공격으로 대상을 경직 시킨 후 미스틱아이로 다운 시킨 후 미스틱파워로 일정횟수 이상 타격해 넉백시킵니다.

step14_title = 신비술사 - 국민콤보 ②
step14_help  = ★대시공격 (->-> → D + D ) →점프공격 (A → D) 대시공격으로 넉백시킨 후 점프 공격으로 재점핑해 추가공격으로 마무리합니다.

step15_title = 신비술사 - 국민콤보 ③
step15_help  = ★대시공격 1타 →미스틱아이로 마킹 →미스틱 파워(D 누름유지)로 넉백시킨 후 → 점프공격(A → D)으로 마무리합니다.


[Set118]

max_step = 16

step0_title  = 갤럭시 - 기본소개
step0_help   = 갤럭시는 우주에서 소환한 운석 마법과 마법서에 적힌 각종 다양한 마법을 사용하여 상대방을 제압하는 레어 용병입니다.

step1_title  = 갤럭시 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 갤럭시 - 운석 차징 (D누름 유지)
step2_help   = 공격키(D)를 누르고 있으면 게이지가 차오르며 차오른 양에 비례하는 크기의 운석을 사용할수 있게 충전을 할 수 있습니다. 충전중 피해를 입으면 캔슬이 됩니다.

step3_title  = 갤럭시 - 운석 차징 후 소환 (D키)
step3_help   = 운석을 충전한 후 지상이나 공중에서 공격키(D)를 누르면 전방으로 움직이는 운석을 소환합니다. 운석소환 후 진입하면 전투에서 우위를 차지할 수 있습니다.

step4_title  = 갤럭시 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대각선 아래로 소형운석을 발사합니다. 일정시간 내에 운석을 2대 맞을시 충격으로 폭팔이 일어납니다.

step5_title  = 갤럭시 - 공중대시 (A → ->->)
step5_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 상승 이동을 하는 공중 대시가 발동됩니다.

step6_title  = 갤럭시 - 대시공격 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 마법으로 몸을 감싸 회전 연속 공격을 합니다.

step7_title  = 갤럭시 - 대시공격 확장 (->-> → D + D + D + D)
step7_help   = 대시공격 이 후 추가 공격키(D) 입력 시 매직 미사일을 발사하며 최대 3연속 매직 미사일을 발사 할 수 있습니다. 매직 미사일은 범위안에 적을 추격합니다.

step8_title  = 갤럭시 - 마법방어 (S 누름)
step8_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든 방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step9_title  = 갤럭시 - 메테오 샤워 / 무기스킬(SD)
step9_help   = 메테오 샤워(SD)는 전방에 마법진을 만들어 우주에서 지상으로 내리꽂는 운석을 소환하는 스킬입니다. 스킬 사용중 일정시간 후 SD키로 스킬 취소가 가능합니다.

step10_title = 갤럭시 - 폴링스타 / 갑옷스킬(ASD)
step10_help  = 폴링스타(ASD)는 원하는 위치로 이동이 가능하게 만들어주는 스킬입니다. 각각 3단계로 발동하며 1단계 다운, 2단계 피격, 3단계 공중피격 중 사용이 가능합니다.

step11_title = 갤럭시 - 스타 버스터 / 투구스킬(AD)
step11_help  = 스타 버스터(AD)는 상대의 몸주변에 공전하는 운석을 생성하여 돌고있던 운석이 상대의 같은팀 혹은 맵과 충돌시 튕겨 나가게 만드는 스킬입니다.

step12_title = 갤럭시 - 슈팅 스타 / 망토스킬(AS)
step12_help  = 슈팅 스타(AS)는 마법진의 위치를 지정하여 거대한 운석을 추락시켜 해당 지역을 공격 하는 스킬입니다. 최대 3회까지 사용이 가능하며 피격 시 스킬이 종료됩니다.

step13_title = 갤럭시 - 국민콤보 ①
step13_help  = ★슈팅 스타(AS) → 메테오 샤워(SD) 슈팅 스타(AS)로 상대를 납짝 상태로 만든 후 메테오 샤워(SD)를 사용하여 마무리 합니다.

step14_title = 갤럭시 - 국민콤보 ②
step14_help  = ★기본공격 → 대시 공격 확장 기본공격을 적중시켜 상대가 미끄러져 넘어질때 대시공격 확장을 사용하여 다운 대상을 공격합니다.

step15_title = 갤럭시 - 국민콤보 ③
step15_help  = ★대시 공격 확장(->-> → D + D + D + D)을 하여 대상을 다운 시킨 뒤 슈팅스타(AS) 공격 후 → 메테오 샤워(SD)로 대상을 마무리 합니다.


[Set119]

max_step = 18

step0_title  = 드래곤 슬레이어 - 기본소개
step0_help   = 드래곤 슬레이어는 드래곤을 사냥한 후 심장을 먹고 드래곤의 영혼을 흡수하여 드래곤의 기술을 사용할 수 있게 된 용병입니다.

step1_title  = 드래곤 슬레이어 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 드래곤 슬레이어 - 드래곤 포효 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 주변 일정범위의 대상을 공포에 질려 도망가게 하는 포효를 사용할 수 있습니다. 드래곤 포효시 게이지를 소모합니다.

step3_title  = 드래곤 슬레이어 - 드래곤 숨결(D 오래누름 → S)
step3_help   = 드래곤의 포효 사용 후 일정시간 내에 S키를 누르면 전방 일정거리를 이동하며 충돌한 상대를 넉백시키는 드래곤 숨결을 사용할 수 있습니다.

step4_title  = 드래곤 슬레이어 - 전진이동(D 오래누름 → ->->)
step4_help   = 드래곤의 포효 사용 후 일정시간 내에 대시키(->->)를 누르면 전방 일정거리를 전진이동 할 수 있고 전진이동 후 드래곤 숨결을 사용하거나 드래곤베기를 할수있습니다.

step5_title  = 드래곤 슬레이어 - 드래곤 베기(D 오래누름 → D)
step5_help   = 드래곤의 포효 사용 후 일정시간 내에 D키를 연타하면 최대 4연속 공격을 할 수 있습니다.  드래곤베기 중 드래곤의 숨결이나 전진이동을 사용할 수 있습니다.

step6_title  = 드래곤 슬레이어 - 점프공격 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 올려치는 공격을 합니다. 최대 2연속 타격을 할 수 있으며 2번째 타격은 적을 다운시킵니다.

step7_title  = 드래곤 슬레이어 - 공중 브레스 (A →D 오래누름)
step7_help   = 점프키(A)를 눌러 점프한 후 D키를 오래누르면 공중에서드래곤 숨결을 사용할 수 있습니다. 특별 게이지를 소모합니다.

step8_title  = 드래곤 슬레이어 - 대시공격 (->-> → D →D →D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키며 3번째 타격시 대상을 바운딩시킬 수 있습니다.

step9_title  = 드래곤 슬레이어 - 대시공격 확장 (->-> → D 오래누름)
step9_help   = 대시공격 이 후 D 오래누름시 대상을 강하게 찔러 경직시킬 수 있습니다. D오래 누름 후 추가 공격을 할 수 있고 추가 공격시 대상을 높이 띄울 수 있습니다.

step10_title  = 드래곤 슬레이어 - 튕겨내기 (공격 받는 순간 방어)
step10_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step11_title  = 드래곤 슬레이어 - 드래곤 브레스 / 무기스킬(SD)
step11_help   = 드래곤 브레스(SD)는 조준점으로 드래곤 브레스를 발사해 상대를 넉백시키는 스킬입니다. 조준점을 방향키로 움직일 수 있습니다.

step12_title = 드래곤 슬레이어 - 드래곤윙 / 갑옷스킬(ASD)
step12_help  = 드래곤윙(ASD)은 드래곤 날개로 전방에 돌풍을 일으켜 상대를 날려버리는 스킬입니다. 일정시간 내에 D키를 누르면 추가로 돌풍을 날릴 수 있습니다.

step13_title = 드래곤 슬레이어 - 드래곤 피어 / 투구스킬(AD)
step13_help  = 드래곤 피어(AD)는 주변 일정범위의 대상을 꼼짝못하게 경직시키는 스킬입니다. D키를 누르고 있으면 피어를 지속적으로 발산 할 수 있습니다.

step14_title = 드래곤 슬레이어 - 드래곤 테일 / 망토스킬(AS)
step14_help  = 드래곤 테일(AS)은 전방 일정범위에 드래곤 꼬리를 내려쳐 대상을 다운시키는 스킬입니다.

step15_title = 드래곤 슬레이어 - 국민콤보 ①
step15_help  = ★드래곤 피어(AD) → 드래곤 테일(AS) 드래곤 피어(AD)로 상대를 스턴시킨 후 → 드래곤 테일(AS)을 사용하여 마무리 합니다.

step16_title = 드래곤 슬레이어 - 국민콤보 ②
step16_help  = ★기본공격 → 점프공격 (A → D) → 드래곤 브레스(SD) 기본공격을 적중시켜 상대를 띄운 후 → 점프공격으로 다운시킨 후 → 드래곤 브레스(SD)로 마무리 합니다.

step17_title = 드래곤 슬레이어 - 국민콤보 ③
step17_help  = ★드래곤 포효 (D 오래누름)로 대상을 도망가게 한 뒤 → 드래곤 베기(D 오래누름 → D)로 대상을 다운시킨 후 → 드래곤 숨결(D 오래누름 → S)로 대상을 마무리 합니다.


[Set120]

max_step = 16

step0_title  = 낭인 - 기본소개
step0_help   = 낭인은 쾌검과 발도를 쓰는 장님 무사로 눈에 보이지 않는 속도의 쾌검술로 상대를 베거나 공간을 장악하는 근거리 계열 용병입니다.

step1_title  = 낭인 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 낭인 - 검 회수 (공격중 →→)
step2_help   = 기본공격과 대시공격에서 -> -> 대시키를 입력하면 공격을 회수하는 회피 기술을 사용하게 됩니다. 상대가 공격을 회피하거나 방어시 사용 할 수 있습니다.

step3_title  = 낭인 - 공의영역 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 낭인을 중심으로 영역이 펼쳐 질때 눌렀던 공격키(D)를 떼면 타게팅된 상대에게 광속으로 접근해서 베는 공격을 합니다.

step4_title  = 낭인 - 대시공격1 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상에게 빠르게 접근하여 베는 대시 공격이 가능합니다.

step5_title  = 낭인 - 대시공격2 (->-> D + D)
step5_help   = 대시공격1 중에 공격키(D)를 입력하면 대상을 하단을 베어 공격하여 공중에 띄우는 공격을 합니다. 대상이 공중에 띄워지기 때문에 다음 공격을 할 때 유용합니다.

step6_title  = 낭인 - 대시공격 특별 (->-> D 오래누름)
step6_help   = 대시달리기 중에 공격키(D)를 오래누름 입력하면 회전하며 대상을 베어 밀어버리는 공격을 합니다. 밀린 대상은 다음 공격을 할 때 유용합니다.

step7_title  = 낭인 - 점프공격(A →D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 회전시켜 땅으로 떨어트리는 점프공격이 가능합니다.

step8_title  = 낭인 - 이중점프 (A 두번 누름)
step8_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step9_title  = 낭인 - 닫쳐버린 눈(SD)
step9_help   = 닫쳐버린 눈(SD)은 낭인을 중심으로 영역안에 적을 빠른 속도의 연속 베기를 하며 마지막에 무릎꿇기 공격을 발동시켜 다음 공격을 하기에 유용합니다.

step10_title  = 낭인 - 꿰뚫는 맥(ASD)
step10_help   = 꿰뚫는 맥(ASD)은 낭인이 예민한 상태가 되어 살기를 발동시켜 주변에 공중의 적들을 바닥으로 내려찍는 공격과 지상의 적들에게 살기로 피해를 줍니다.

step11_title  = 낭인 - 감싸는 검막(AD)
step11_help   = 감싸는 검막(AD)은 낭인이 검막을 둘러 원거리 공격을 방어합니다. 단! 관통형 원거리 공격을 방어하지 못하고 유지시간이 길지만 넘어지면 스킬이 취소됩니다.

step12_title  = 낭인 - 지르밟는 대지(AS)
step12_help   = 지르밟는 대지(AS)는 낭인이 땅을 진각으로 밟아 기를 넣어 진동시켜 주변에 대상을 경직시키며 높이 띄우는 기술입니다. 누워있는 대상에게 사용 가능합니다.

step13_title  = 낭인 - 국민콤보 ①
step13_help   = ★공의영역 (D 오래누름)으로 대상을 띄운 후 → 기본 공격을 사용합니다. 연계 중 대상을 놓쳤을 경우 3타에서 다시 띄워 마무리 합니다.

step14_title  = 낭인 - 국민콤보 ②
step14_help   = ★닫쳐버린 눈(SD) 사용 후 상대가 경직이 되면 → 기본 공격을 사용합니다. 경직 대상은 1타 이 후 2타는 맞지 않지만 3타에서 다시 띄워 마무리 합니다.

step15_title  = 낭인 - 국민콤보 ③
step15_help   = ★지르밟는 대지(AS) 사용으로 상대를 경직시킨 뒤 → 공의영역(D 오래누름)으로 상대를 공격 후 기본공격을 사용해서 마무리 합니다.


[Set121]

max_step = 16

step0_title  = 스트라이커 - 기본소개
step0_help   = 스트라이커은 바람과 같은 빠른 움직임으로 상대에게 접근하고 공중에서 상대를 연타하여 바닥으로 내려찍어 제압하는 레어 용병입니다.

step1_title  = 스트라이커 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 스트라이커 - 질풍 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 일정거리를 전진이동합니다. 전진이동 중 상대와 충돌하면 상대를 띄우는 추가 공격이 자동으로 발동되며, A키로 즉시 점프가 가능합니다.

step3_title  = 스트라이커 - 대시공격1 (->-> D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 띄우는 공격을 하며 공격 성공시 자동으로 점프합니다.

step4_title  = 스트라이커 - 점프공격(A →D + D + D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D) 를 누르면 돌려차기 공격을 합니다. 최대 3연속 타격을 할 수 있으며 3번째 타격시 재점핑합니다.

step5_title  = 스트라이커 - 진공나선각(A →D + D + D + D)
step5_help   = 점프공격 3타 이후 재점핑했을 때 공격키(D)를 누르면 추가 공격을 할 수 있습니다. 최대 4연속 타격을 할 수 있으며 4번째 타격시 대상을 넉백시킵니다.

step6_title  = 스트라이커 - 허공질풍각(A →D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 회전하며 전진이동합니다. 대상과 충돌하면 자동으로 연타후 내려찍는 공격을 할 수 있습니다.

step7_title  = 스트라이커 - 이중점프 (A 두번 누름)
step7_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step8_title  = 스트라이커 - 반격 (방어 성공시 바로 공격)
step8_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step9_title  = 스트라이커 - 나선질풍각(SD)
step9_help   = 나선질풍각(SD)은 회전하며 일정거리를 전진이동합니다. 전진이동 중 충돌시 상대를 띄우고 점프하여 공중에서 D키를 연타해 상대를 바운딩시키는 공격을 할수있습니다.

step10_title = 스트라이커 - 진공선풍각(ASD)
step10_help  = 진공선풍각(ASD)은 고속회전하며 주변의 대상을 끌어 당겨 공중에 띄워 연타하는 스킬입니다. 방향키로 이동 방향을 조종 할 수 있습니다.

step11_title = 스트라이커 - 섬광!(AD)
step11_help  = 섬광!(AD)은 기습 공격하는 스킬입니다. 방향키로 조준점을 움직이며 D키를 누르면 나타납니다. 4회 사용 할 수 있으며 HP가 일정량 이하일때 8회 사용 할 수 있습니다.

step12_title = 스트라이커 - 질풍각(AS)
step12_help  = 질풍각(AS)은 대상에게 고속이동하여 난타하는 스킬입니다. 조준점 모양에 맞춰 D키를 누르면 정조준시 최대 10회 타격할 수 있고 공중에서도 사용이 가능합니다.

step13_title = 스트라이커 - 국민콤보 ①
step13_help  = ★질풍(D 오래누름)으로 충돌  →  추가 공격으로 띄움 → 추가공격 후 A키로 즉시 점프  → 허공질풍각(A →D 오래누름)으로 마무리 합니다.

step14_title = 스트라이커 - 국민콤보 ②
step14_help  = ★대시공격1(->-> D)으로 대상을 띄운 후  → 점프공격(A →D + D + D)으로 재점핑 후  → 진공나선각(A →D + D + D + D)으로 마무리합니다.

step15_title = 스트라이커 - 국민콤보 ③
step15_help  = ★기본공격(D → D → D → D)으로 상대를 띄움 → A키로 점프→점공격3타로 재점핑 → 진공나선각 3타 후 → 허공질풍각(A →D 오래누름)으로 마무리합니다.


[Set122]

max_step = 18

step0_title  = 돈키호테 - 기본소개
step0_help   = 돈키호테는 사고뭉치 기사로 상대에게 돌진하여 벽에 단체로 밀어넣어 대상을 제압하는 근거리 계열의 일반 용병 입니다.

step1_title  = 돈키호테 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 돈키호테 - 돌진(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 돌진 준비 상태가 됩니다. 게이지 30 이상 사용 가능하며 자동 전진이며 방향키로 방향전환이 가능하며 공격키(D)를 누르면 해제 됩니다.

step3_title  = 돈키호테 - 돌진종료 (벽 충돌)
step3_help   = 돌진 상태에서 상대에게 충돌시 같이 잡고 전진하며 맵의 벽 충돌시 모두 경직상태가 됩니다. 점프가 가능하며 점프시 밟힌 대상은 납짝 상태가 됩니다.

step4_title  = 돈키호테 - 대시공격1 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상에게 빠르게 접근하여 타격하는 대시 공격이 가능합니다.

step5_title  = 돈키호테 - 대시공격2 (->-> D + D)
step5_help   = 대시공격1 중에 공격키(D)를 입력하면 대상을 박치기로 공격하여 공중에 띄우는 공격을 합니다. 대상이 공중에 띄워지기 때문에 다음 공격을 이어갈 때 유용합니다.

step6_title  = 돈키호테 - 점프공격(A →D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 베는 공격을 합니다. 점프 공격의 타격은 공중과 지상의 상대를 바운딩 시키는 공격을 합니다.

step7_title  = 돈키호테 - 점프 특별공격(A →D 오래누름)
step7_help   = 점프 중 공격키(D)를 누르면 전방으로 추락하면서 대상을 머리로 내려찍는 공격을 합니다. 넘어진 대상도 공격이 가능합니다.

step8_title  = 돈키호테 - 공중대시(점프 중 ->->)
step8_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 기병창으로 찌르는 공격을 합니다. 공격당한 대상은 잠시동안 경직상태가 됩니다.

step9_title  = 돈키호테 - 이중점프 (A 두번 누름)
step9_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step10_title  = 돈키호테 - 튕겨내기 (공격 받는 순간 방어)
step10_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step11_title = 돈키호테 - 달려! 로시난테 (SD)
step11_help  = 달려! 로시난테(SD)는 로시난테를 타고 전진 이동하면서 주변에 대상을 같이 말에 태워 이동시키며 점프 상태에서 충돌시 재점프 됩니다.

step12_title  = 돈키호테- 공주를 위해! (ASD)
step12_help   = 공주를 위해!(ASD)은 넘어진 대상도 공격하며, 대상을 창으로 공격 후 말머리를 씌워 상대가 방향을 조절 하기 힘들게 이동시키는 스킬입니다.

step13_title = 돈키호테 - 도와줘! 산초(AD)
step13_help   = 도와줘! 산초(AD)는 산초의 응원을 받아 일정시간 동안 이동속도,공격력,방어력을 상승시켜주며 시전자를 일정 시간동안 드랍존에서 보호해주는 스킬입니다.

step14_title = 돈키호테 - 풍차 쓰러트리기 (AS)
step14_help  = 풍차 쓰러트리기(AS)은 전방을 향해 숨겨둔 칼을 꺼내어 대상을 경직 시키는 기술입니다. 최대 2번까지 사용가능하며 콤보 도중 사용하기 용이합니다.

step15_title = 돈키호테 - 국민콤보 ①
step15_help  = ★점프공격(A →D) → 공중대시(점프 중 ->->) 점프공격으로 대상을 바운딩 후 → 공중대시 찔러서 마무리 합니다.

step16_title = 돈키호테 - 국민콤보 ②
step16_help  = ★풍차 쓰러트리기(AS)으로 상대를 경직 시킨 후 대시공격(->-> D+D)으로 대상을 띄운 후→공중 대상에게 다시 한번 풍차 쓰러트리기(AS)로 마무리합니다.

step17_title = 돈키호테 - 국민콤보 ③
step17_help  = ★기본공격 (D → D → D) 3타 후→ 공주를 위해!(ASD)으로 경직 후→풍차 쓰러트리기(AS)으로 상대를 경직 시킨 후 달려! 로시난테 (SD)로 마무리합니다.


[Set123]

max_step = 18

step0_title  = 드래곤네스트어쌔신 - 기본소개
step0_help   = 드래곤네스트어쌔신은 고대로 부터 전승된 암기와 사슬낫을 이용해 원거리의 대상을 제압할 수 있는 근거리 계열의 프리미엄 용병 입니다.

step1_title  = 드래곤네스트어쌔신 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 드래곤네스트어쌔신 - 버닝콜(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 주변을 폭파시켜 상대를 경직시키고 뒤로 물러납니다. 버닝콜 이후 D키를 연타하면 사슬낫을 사용해 상대를 공격할 수 있습니다.

step3_title  = 드래곤네스트어쌔신 - 어플러즈 (D 오래누름 → D + D)
step3_help   = 버닝콜 사용 후 D키를 누르면 사슬낫이 나오고 사슬낫으로 전방의 상대를 가까이로 당겨 모으고 추가로 D키를 누르면 사슬낫으로 위에서 아래로 내려찍어 스턴시킵니다.

step4_title  = 드래곤네스트어쌔신 - 퍼니쉬먼트 (어플러즈 → D연타)
step4_help   = 어플러즈를 사용한 상태에서 D키를 연타하면 연타한 횟수만큼 사슬낫으로 회전공격을 합니다. 회전수에 따라 상대를 다운,무릎꿇기,스턴,넉백 시킬 수 있습니다.

step5_title  = 드래곤네스트어쌔신 - 대시공격1 (->-> → D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상에게 빠르게 접근하여 타격하는 대시 공격이 가능합니다.

step6_title  = 드래곤네스트어쌔신 - 대시공격2 (->-> → D + D + D)
step6_help   = 대시공격1 중에 공격키(D)를 입력하면 대상을 경직시킬 수 있고, 경직시킨 대상을 추가로 공격하면 공중으로 띄울 수 있어 다음 공격을 이어갈 때 유용합니다.

step7_title  = 드래곤네스트어쌔신 - 블레이드러너 (->-> →D 오래누름)
step7_help   = 대시달리기 중에 공격키(D)를 오래누름 입력하면 일정거리를 전진이동하고 대상과 충돌시 공중으로 순간이동 후 바닥을 폭파시켜 대상을 공중으로 띄웁니다.

step8_title  = 드래곤네스트어쌔신 - 점프공격(A →D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발로내려찍는 공격을 합니다. 점프 공격 타격시 상대를 경직 시키게 됩니다.

step9_title  = 드래곤네스트어쌔신 - 모탈블로우(A →D 오래누름)
step9_help   = 점프 중 공격키(D)를 누르면 회전하면서 전방의 상대를 사슬낫으로 연타하고 내려찍는 공격을 합니다. 넘어진 대상도 공격이 가능합니다.

step10_title  = 드래곤네스트어쌔신 - 반격 (방어 성공시 바로 공격)
step10_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step11_title = 드래곤네스트어쌔신 - 디엔드 (SD)
step11_help  = 디엔드(SD)는 공중으로 점프하여 조준점을 향해 수리검을 무차별적으로 난사하는 스킬입니다. D키입력시 수리검을 발사하고 방향키로 조준점 조종이 가능합니다.

step12_title  = 드래곤네스트어쌔신- 다크컨빅션 (ASD)
step12_help   = 다크컨빅션(ASD)은 바닥에 크룩을 꼽아 마법진을 만들어 공중으로 올라갔다 내려오는 다수의 암흑불덩이를 소환하는 스킬입니다.

step13_title = 드래곤네스트어쌔신 - 레이크(AD)
step13_help   = 레이크(AD)는 부채꼴 모양으로 여러개의 회전하는 표창을 던지는 스킬입니다. 표창은 시전자에게 되돌아오고 공중에서 사용가능합니다.

step14_title = 드래곤네스트어쌔신 - 레인드롭 (AS)
step14_help  = 레인드롭(AS)은 까마귀가 하늘로 치솟아 공중으로 날아가며 바닥을 향해 수리검을 발사하는 스킬입니다.  수리검에 피격된 상대를 독에 중독시킵니다.

step15_title = 드래곤네스트어쌔신 - 국민콤보 ①
step15_help  = ★블레이드러너 (->-> →D 오래누름) → 모탈블로우(A →D 오래누름), 블레이드러너로 대상을 띄운 후 → 모탈블로우로 마무리 합니다.

step16_title = 드래곤네스트어쌔신 - 국민콤보 ②
step16_help  = ★대시공격2 (->-> → D + D + D)으로 대상을 띄운 후 → 기본공격으로 대상을 다운시킨 후 →레인드롭 (AS)으로 마무리합니다.

step17_title = 드래곤네스트어쌔신 - 국민콤보 ③
step17_help  = ★기본공격 (D → D → D → D) 4타 후→ 버닝콜(D 오래누름)로 다운 후 →어플러즈(D 오래누름 → D + D) →퍼니쉬먼트(어플러즈 → D연타)로 마무리합니다.


[Set124]

max_step = 17

step0_title  = 썬더버드 - 기본소개
step0_help   = 썬더버드는 미라클 물총을 사용해 상대를 물방울에 가두거나 물방울에 갇힌 상대를 감전시켜 제압하는 레어 용병입니다.

step1_title  = 썬더버드 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 썬더버드 - 물총 장전 (D누름 유지)
step2_help   = 공격키(D)를 누르고 있으면 게이지가 차오르며 차오른 양 만큼 미라클 물총을 사용 할 수 있습니다. 충전중 넘어지는 피해를 입으면 캔슬이 됩니다.

step3_title  = 썬더버드 - 장전캔슬 (장전상태 S키)
step3_help   = 썬더버드가 물총 장전 상태 일때 S키를 누르면 기본 상태로 돌아갑니다. 장전캔슬은 피격중에도 사용 할 수 있습니다.

step4_title  = 썬더버드 - 물총 장전 상태 - 단발 발사 (D키)
step4_help   = 물총을 충전한 후 지상이나 공중에서 공격키(D)를 누르면 전방으로 날아가는 물총을 발사합니다. 발사에 맞은 대상은 일정시간 물방울 속에 갇혀 있습니다.

step5_title  = 썬더버드 - 물총 장전 상태 - 연사 (D누름 유지)
step5_help   = 물총을 충전한 후 지상이나 공중에서 공격키(D)를 누름유지 하면 전방으로 연이어 날아가는 물을 발사합니다. 일정횟수 이상 맞은 대상은 물방울 속에 갇히게 됩니다.

step6_title  = 썬더버드 - 점프공격(A →D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 연타하면 총 6연타를 하는 점프 공격을 사용할 수 있습니다.

step7_title  = 썬더버드 - 대시공격1 (->-> → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 대상을 걷어차는 발차기 공격을 합니다.

step8_title  = 썬더버드 - 대시공격2 (->-> → D 오래누름)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 오래 누르면 바닥을 미끄러지며 띄움 공격을 합니다.

step9_title  = 썬더버드 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step10_title  = 썬더버드 - 물대포!?! / 무기스킬(SD)
step10_help   = 물대포!?!(SD)은 적의 머리 위에 물폭탄을 발사하여 분산시킨 후 바닥에서 터트려 공격 후 스킬에 맞아 물에 젖은 대상은 D오래누름으로 추가 공격이 가능합니다.

step11_title = 썬더버드 - 썬더썬더해 / 갑옷스킬(ASD)
step11_help  = 썬더썬더해(ASD)는 몸을 전기로 감싸 주변에 적에게 전기를 날리는 기술입니다. D키 입력시 작은 전기, D오래누름 시 큰 전기 공격이 가능합니다.

step12_title = 썬더버드 - 썬더 태클! / 투구스킬(AD)
step12_help  = 썬더 태클!(AD)는 몸을 전기로 감싸 달리며 주변에 전기로 감전시키는 기술입니다. 스킬 사용 후 추가 D키 연타 시 더욱 이동속도가 빨라집니다.

step13_title = 썬더버드 - 빠직!우르릉~쾅! / 망토스킬(AS)
step13_help  = 빠직!우르릉~쾅!(AS)는 썬더버드의 꼬리에서 움직이는 먹구름을 생성해 주변에 적들에게 자동으로 감전 공격을 날리는 기술입니다.

step14_title = 썬더버드 - 국민콤보 ①
step14_help  = ★대시공격1 (->-> → D) → 기본공격 (D → D) 대시공격1(->-> → D)로 대상을 약경직을 만든 후 기본공격 (D → D)2타로 마무리합니다.

step15_title = 썬더버드 - 국민콤보 ②
step15_help  = ★대시공격2 (->-> → D 오래누름) → 점프공격(A →D) 대시공격2 (->-> → D 오래누름)로 대상을 띄운 후 점프공격 (D → D) 6타로 마무리합니다.

step16_title = 썬더버드 - 국민콤보 ③
step16_help  = ★대시공격2으로 대상을 띄운 후→물대포!?!(SD) → D오래누름으로 기립 후 → 대시공격2으로 대상을 띄운 후 → 점프공격 (D → D)6타로 마무리합니다.


[Set125]

max_step = 20

step0_title  = 앨리스 - 기본소개
step0_help   = 앨리스는 평소엔 인형을 사랑하는 얌전한 아이지만 심술이 나거나 누가 괴롭히면 기관총을 꺼내 사방으로 발사하며 미친듯이 날뛰는 용병입니다.

step1_title  = 앨리스 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 앨리스 - 대시공격1 (->-> →D)
step2_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시킬 수 있고 최대 2연속 타격을 할 수 있습니다.

step3_title  = 앨리스 - 점프공격(A →D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 인형을 휘두르는 공격을 합니다. 3연타시 상대를 높이 띄우고,공중상대 타격시 재점핑 할 수 있습니다.

step4_title  = 앨리스 - 점프대시(A →->->)
step4_help   = 점프중에 방향키를 빠르게 2번 입력하면 입력된 방향으로 빠르게 이동하면서 인형을 휘두릅니다. 맞은 상대는 띄움 상태가 되고 상대 타격시 재점핑 할 수 있습니다.

step5_title  = 앨리스 - 반격 (공격 받는 순간 방어)
step5_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step6_title  = 앨리스 - 기관총꺼내기(D오래누름)
step6_help   = 대기, 걷기, 점프, 대시 중 공격키(D)를 오래 누르고 있으면 게이지를 소모하여 기관총을 꺼냅니다. 피격되거나 상대 공격시 기관총 게이지가 감소됩니다.

step7_title  = 앨리스 - 기관총캔슬 (기관총상태 S키)
step7_help   = 앨리스가 기관총 상태 일때 S키를 누르거나 게이지가 0이 되면 기본 상태로 돌아갑니다. 기관총 캔슬은 피격중에도 사용 할 수 있습니다.

step8_title  = 앨리스 - 기관총 기본공격 (D → D → D → D)
step8_help   = 기관총을 든 상태에서 공격키(D)를 누르면 총알을 발사합니다. 4연타시 상대를 높이 띄울 수 있습니다. 게이지가 일정량 소모됩니다.

step9_title  = 앨리스 - 기관총 대시공격1 (->-> → D)
step9_help   = 기관총든 상태에서 공격키(D)를 누르면 일정거리 전진 이동 후 360도 방향으로 회전하며 총알을 여러개 발사 하며 추가공격 성공시 상대를 띄울 수 있습니다.

step10_title  = 앨리스 - 기관총 점프공격(A →D)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 총알을 발사하고 총 4연타를 할 수 있습니다. 4연타시 상대를 무릎꿇기상태로 만듭니다.

step11_title  = 앨리스 - 기관총 점프대시(A →->->)
step11_help   = 점프중에 방향키를 빠르게 2번 입력하면 입력된 방향으로 빠르게 이동하면서 총알을 발사 합니다. 맞은 대상은 띄움 상태가 됩니다.

step12_title  = 앨리스 - 기관총 이중점프 (A 두번 누름)
step12_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step13_title = 앨리스 - 광기폭발 / 무기스킬(SD)
step13_help  = 광기폭발(SD)은 360도 회전하며 일정거리를 전진이동하며 총알을 발사하는 스킬입니다. 전진이동 중 방향키로 방향전환이 가능합니다.

step14_title = 앨리스 - 날뛰기 / 갑옷스킬(ASD)
step14_help  = 날뛰기(ASD)는 근접한 대상의 머리위로 순간이동 후 지상을 향해 기관총을 마구 난사하는 스킬입니다. 다운중 사용이 가능합니다.

step15_title = 앨리스 - 6시 티파티 / 투구스킬(AD)
step15_help  = 6시 티파티(AD)는 지그재그방향으로 움직이는 찻잔을 던지는 스킬입니다. 충돌한 최초의 대상을 잡아 일정거리 이동하고 그 후 충돌한 대상은 멀리 날릴 수 있습니다.

step16_title = 앨리스 - 증발 / 망토스킬(AS)
step16_help  = 증발(AS)은 체셔캣을 발사하는 스킬입니다. 체셔캣에게 피격된 상대는 체셔캣으로 변신하고 공격, 방어, 대시, 스킬을 사용 할 수 없습니다.

step17_title = 앨리스 - 국민콤보 ①
step17_help  = ★대시공격1(->-> → D + D) →기본공격 (D → D → D) 대시공격1(->-> → D + D)로 대상을 띄운 후 → 기본공격 (D → D → D)3타로 마무리합니다.

step18_title = 앨리스 - 국민콤보 ②
step18_help  = ★점프대시(A  → ->->)로 대상을 띄운 후 → 점프공격 6연타로 대상을 다운 시킨 후 → 날뛰기(ASD))으로 마무리합니다.

step19_title = 앨리스 - 국민콤보 ③
step19_help  = ★기관총 점프공격(A →D + D + D + D)로 대상을 경직시킨 후→기관총 점프대시(A  → ->->)로 띄우고 →기관총 기본공격 (D → D → D → D)으로 마무리합니다.


[Set126]

max_step = 20

step0_title  = 리 - 기본소개
step0_help   = 리는 무술의 달인으로 절권도와 드래곤 플라잉킥을 사용하여 빠르게 접근하여 상대를 난타해 제압하는 레어 용병입니다.

step1_title  = 리 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 리 - 준비자세(D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 제자리에서 몸을 풀어 준비자세를 취하게 됩니다. 게이지를 소모하며 이 후에 추가 공격이 가능합니다.

step3_title  = 리 - 준비자세→드래곤 플라잉킥 (준비자세→D)
step3_help   = 준비 자세에서 추가로 공격키(D)를 입력시 게이지 소모 없이 바로 전방으로 드래곤 플라잉킥을 사용합니다. 이 후 기본공격으로 연계가 가능합니다.

step4_title  = 리 - 준비자세→대지 밟기 (준비자세→A)
step4_help   = 준비 자세에서 추가로 점프키(A)를 입력시 게이지 를 소모하여 전방으로 대지 밟기를 사용합니다. 방어파괴 공격으로 상대를 띄워 추가 공격이 가능합니다.

step5_title  = 리 - 대시공격 (->-> → D + D + D + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 발로 공격합니다. 최대 4회 타격이 가능합니다.

step6_title  = 리 - 달리기 중 드래곤 플라잉킥 (달리기 중→D오래누름)
step6_help   = 빠른 달리기가 발동된 후 D오래누름 시 바로 전방으로 드래곤 플라잉킥을 사용합니다.이 후 대시공격으로 연계가 가능합니다.

step7_title  = 리 - 점프공격 - (A →D + D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발로 공격합니다. 이때 추가로 D키를 눌러 추가공격할 수 있습니다. 최대 2연타가 가능합니다.

step8_title  = 리 - 공중 드래곤 플라잉킥 (공중→D오래누름)
step8_help   = 리는 공중 상태에서 공격키(D)를 오래누르면 바로 전방으로 드래곤 플라잉킥을 사용합니다. 공격이 끝나면 점프 상태로 전환되어 추가 공격이 가능합니다.

step9_title  = 리 - 공중대시(점프 중 ->->)
step9_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 발로 내려찍는 공격을 합니다. 이 후 공격키(D)키 입력시 추가 공격이 가능합니다.

step10_title  = 리 - 튕겨내기 (공격 받는 순간 방어)
step10_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step11_title  = 리 - 튕겨내기→촌경 (튕겨내기 → D)
step11_help   = 리는 튕겨내기 이 후 상태에서 빠르게 접근하여 촌경공격을 합니다. 공격에 당한 대상은 강경직 상태가 되어 추가 공격이 가능합니다.

step12_title  = 리 - 캔슬 사용방법
step12_help   = 리의 드래곤 플라잉킥은 날아가는 도중 지상, 공중 어디서든 공격키(D)로 캔슬이 가능합니다. 캔슬시 자신의 상태에 맞는 공격이 나오며 캔슬됩니다.
               
step13_title  = 리 - 전설의 발차기 / 무기스킬(SD)
step13_help   = 전설의 발차기(SD)는 전방의 대상을 기합으로 끌어모아 정신없게 만든 뒤 공격키(D)를 입력시 멀리 밀어내는 옆차기 공격을 하게 됩니다.

step14_title = 리 - 무술 / 갑옷스킬(ASD)
step14_help  = 무술(ASD)은 어떤 상황이든 공격을 할수 있는 스킬입니다. 지상, 점프, 다운 별로 각각 다른 공격이 나가서 상대를 혼란시키는데 용이합니다.

step15_title = 리 - 무술의 달인 / 투구스킬(AD)
step15_help  = 무술의달인(AD)은 상황에 맞는 효과가 발동되는 스킬입니다. 게이지가 차있을 때 상대 공격시 방어파괴 공격, 넘어졌을 때 점프, 공중 3단점프가 가능합니다.

step16_title = 리 - 전설의 반격 / 망토스킬(AS)
step16_help  = 전설의 반격(AS)은 어떤 상황에서든 반격공격을 할수 있는 스킬입니다. 방어자세 중 상대의 공격을 받으면 자동으로 상대를 높이 날려버리는 공격을 합니다.

step17_title = 리 - 국민콤보 ①
step17_help  = ★무술(ASD) → 전설의 발차기 (SD) 무술(ASD)로 대상을 공격 후 전설의 발차기(SD)로 상대를 끌어당겨와 발차기로 마무리합니다.

step18_title = 리 - 국민콤보 ②
step18_help  = ★전설의 발차기(SD) → 대시공격(->-> → D+D+D+D) 전설의 발차기(SD)로 상대를 경직 시킨뒤 대시공격 4타로 마무리 합니다.

step19_title = 리 - 국민콤보 ③
step19_help  = ★전설의 발차기(SD)으로 상대를 경직시킨뒤 → 대시 공격을 3타까지 띄워 점프 후 점프공격(A →D + D) 후 드래곤 플라잉킥(D오래누름)으로 마무리 합니다.


[Set127]

max_step = 18

step0_title  = 발키리 - 기본소개
step0_help   = 발키리는 공중을 날아다닐 수 있고 지상이나 공중을 날아다니다 포착한 상대를 향해 강습하여 상대를 제압하는 일반 용병 입니다.

step1_title  = 발키리 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 발키리 - 강습(D 오래누름)
step2_help   = 공격키(D)를 누르면 공중으로 점프 후 일정거리 하강 후 공중으로 재상승이 가능하며 재상승 중 D키를 누르면 추가 공격이 가능하고 게이지를 소모합니다.

step3_title  = 발키리 - 대시공격 (->-> → D + D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키고 최대 2회 타격시 대상을 무릎꿇게 합니다.

step4_title  = 발키리 - 방패돌진 (->-> →D오래누름)
step4_help   = 빠른 달리기가 발동된 후 D오래누름 시 전방으로 일정거리 전진하며 방패로 타격한 대상을 높이 띄울 수 있습니다.

step5_title  = 발키리 - 점프공격 - (A →D + D + D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 칼로 공격합니다. 이때 추가로 D키를 눌러 추가공격할 수 있습니다. 최대 3연타가 가능합니다.

step6_title  = 발키리 - 공중강습 (A →D오래누름)
step6_help   = 발키리는 공중 상태에서 공격키(D)를 오래누르면 강습을 사용할 수 있습니다.  게이지를 소모하며 강습 후 공중상태로 전환됩니다.

step7_title  = 발키리 - 공중대시(점프 중 ->->)
step7_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동합니다. 이동 후 점프상태로 전환되어 연계공격을 할 수 있습니다.

step8_title  = 발키리 - 이중점프 (A 두번 누름)
step8_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step9_title  = 발키리 - 활강(이중점프 →A오래누름)
step9_help   = 이중점프한 상태에서 점프키(A)를 오래 누르면 날개를 사용해 일정시간 활강할 수 있습니다. 활강 사용 중 강습을 사용 할 수 있습니다.

step10_title = 발키리 - 튕겨내기 (공격 받는 순간 방어)
step10_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.
              
step11_title = 발키리 - 에인헤야르 / 무기스킬(SD)
step11_help  = 에인헤야르(SD)는 공중을 날아다니며 대상을 향해 빠르게 하강해 공격후 다시 공중으로 올라가는 스킬입니다.일정 횟수이상 타격시 상대를 띄울 수 있습니다.

step12_title = 발키리 - 빛의구 / 갑옷스킬(ASD)
step12_help  = 빛의구(ASD)는 마법진을 조종하여 폭파하는 빛의 구를 생성하는 스킬입니다. 최대 3번 사용이 가능합니다.

step13_title = 발키리 - 발키리의축복 / 투구스킬(AD)
step13_help  = 발키리의축복(AD)은 자신과 팀원의 HP,이동속도, 공격력을 일정시간 증가시켜 주는 스킬입니다.

step14_title = 발키리 - 발키리의날개짓 / 망토스킬(AS)
step14_help  = 발키리의날개짓(AS)은 공중으로 솟아올라 지상을 향해 깃털을 발사합니다. 깃털은 대상과 충돌하거나 D키를 누르면 즉시 폭파되며 다운중 사용이 가능합니다.

step15_title = 발키리 - 국민콤보 ①
step15_help  = ★방패돌진 (->-> →D오래누름) → 빛의구(ASD) 방패돌진으로 대상을 띄운 후 빛의구로 마무리 합니다.

step16_title = 발키리 - 국민콤보 ②
step16_help  = ★대시공격(->-> → D + D)으로 무릎꿇게한 후 →기본공격 (D →D →D →D)으로 띄우고 → 점프공격 - (A →D + D + D)으로 마무리합니다.

step17_title = 발키리 - 국민콤보 ③
step17_help  = ★에인헤야르(SD)를 3회연속 피격하여 상대를 띄운뒤 →뒤로 회전하여 점프공격(A →D + D + D) → 빛의구(ASD)로 마무리합니다.


[Set128]

max_step = 24

step0_title  = 박일표 - 기본소개
step0_help   = 박일표는 갓 오브 하이스쿨의 캐릭터로 쌈수 택견을 사용하며 호조사로 각성하여 불을 이용한 공격으로 대상을 제압하는 프리미엄 용병입니다.

step1_title  = 박일표 - 기본공격 (D → D → D  →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 박일표 - 대시공격 (->-> → D)
step2_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 내차기로 대상을 경직시킵니다.

step3_title  = 박일표 - 대시확장공격 (->-> →D + D + D)
step3_help   = 대시공격 성공 후 공격키(D)를 연속해서 누르면 확장공격을 할 수 있습니다. 내차기 이 후 하단차기로 상대를 띄워 두름치기로 대상을 땅으로 내려찍을수 있습니다.

step4_title  = 박일표 - 대시특별공격 (->-> → D 누름떼기)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 천지 내지르기를 하고 이 후 추가타가 가능합니다.

step5_title  = 박일표 - 점프공격(A →D + D + D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 낙영을 시작하며 상대를 공격합니다. 최대 3연타 공격까지 가능하며 마지막 공격에 맞은 대상은 날아갑니다.

step6_title  = 박일표 - 점프특별공격(A →D 누름떼기)
step6_help   = 점프상태에서 D키를 살짝 눌렀다 떼면 지상을 향해 내려찍는 열반 공격을 합니다. 다운 대상도 공격이 가능하며 서있는 대상이 맞을 경우 기절상대가 됩니다.

step7_title  = 박일표 - 반격 (방어 성공시 바로 공격 + D)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 딴죽 공격으로 상대를 당겨와 넘어트린 후 공격키(D)를 추가로 입력시 열반공격으로 연계가 가능합니다.

step8_title  = 박일표 - 천지내지르기 (D 누름떼기)
step8_help   = 공격키(D)를 살짝 눌렀다 떼면 천지 내지르기로로 상대를 경직시키는 공격을 하며 이 후 공격키(D)연타시 상대를 연타하는 공격이 가능합니다.

step9_title = 박일표 - 각성 (D 오래누름)
step9_help  = 공격키(D)를 오래 누르면 호조사로 각성해 불꼬리가 생깁니다. 무기 스킬 게이지 상단의 각성 게이지가 노란색일때만 호조사로 변신이 가능합니다.

step10_title = 박일표 - 각성상태
step10_help  = 각성 상태에서는 쌍염섬 과 삼염멸도각만 사용할 수 있으며 각성상태에서 타격을 당하면 게이지는 소모됩니다. 각성상태에서는 공격방식이 변경됩니다.

step11_title = 박일표 - 화축(각성 상태에서  D 오래누름)
step11_help  = 각성 상태에서 공격키(D)를 오래 누르면 올려차기를 하며 마찰열을 이용한 불공격을 합니다. 다운대상도 공격이 가능하며 사용 시 각성 게이지를 소모합니다.

step12_title = 박일표 - 각성 상태 중 기본공격 (D → D → D → D)
step12_help  = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step13_title = 박일표 - 각성 상태 중 대시공격1 (->-> → D)
step13_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키를 누르면 불여우로 대상을 잠시 띄우는 공격을 합니다.

step14_title = 박일표 - 각성 상태 중 대시공격2 (->-> → D + D)
step14_help  = 각성 중 대시공격1 사용 중 공격키를 한번 더 입력하면 하늘에서 불로 된 여우비를 소환해 공격 합니다. 피격당한 대상은 화염상태가 됩니다.

step15_title = 박일표 - 각성 상태 중 점프공격1(A → D+D+D)
step15_help  = 점프상태에서 공격키(D)를 누르면 대상을 경직시키는 공격을 하고 바로 D키를 눌러 추가 2회 공격이 가능하며 이 후 화축으로 연계가 가능합니다.

step16_title = 박일표 - 쌍염섬(SD)
step16_help  = 쌍염섬(SD)은 불로 된 벽을 만들어 상대를 띄운 뒤 더 큰 불벽을 만들어 대상을 멀리 날려 버리는 스킬입니다. 맞은 대상은 화염상태가 됩니다.		    

step17_title = 박일표 - 삼염멸도각(SD)
step17_help  = 삼염멸도각(SD)는 쌍염섬 스킬이 활성화 된 후 스킬 게이지를 한 번 더 채워 3번의 불을 사용 하게 됩니다. 쌍염섬 보다 효과와 범위가 증가합니다.

step18_title = 박일표 - 백귀야행(ASD)
step18_help  = 백귀야행(ASD)은 자신을 중심으로 불여우들을 소환하여 주변 대상들을 공격하는 스킬입니다. 큰 불여우 2마리와 작은 불여우 4마리를 소환하여 공격합니다.

step19_title = 박일표 - 발경(AD)
step19_help  = 발경(AD)은 전방으로 순간적인 장법 공격을 하여 상대를 날려 기절시키는 스킬입니다. 발경의 범위안에 있다면 다수의 대상도 모두 날아가 기절 상태가 됩니다.

step20_title = 박일표 - 진 역축(AS)
step20_help  = 진 역축(AS)은 대상을 바람에 가둬 연속 타격하여 멀리 날려버리는 스킬입니다. 다운된 대상에게 공격이 가능하고 다운된 대상을 날릴 수 있습니다.

step21_title = 박일표 - 국민콤보 ①
step21_help  = ★발경(AD) → 대시확장공격 (->-> →D + D + D) 발경(AD)으로 대상을 기절 시킨 뒤 달려가 대시확장공격(->-> →D + D + D)으로 마무리 합니다.

step22_title = 박일표 - 국민콤보 ②
step22_help  = ★진 역축(AS) → 발경(AD) → 쌍염섬(SD) 진 역축(AS)으로 대상을 멀리 날려 낙하에 맞추어 발경(AD) 공격 후 기절시켜 쌍염섬(SD)으로 마무리 합니다.

step23_title = 박일표 - 국민콤보 ③
step23_help  = ★쌍염섬(SD)으로 상대를 날림 → 낙하에 맞추어 발경(AD)으로 기절 시킨 뒤 → 진 역축(AS)으로 상대를 띄워 떨어지는 대상을 기본공격으로 마무리합니다.


[Set129]

max_step = 20

step0_title  = 파괴자 - 기본소개
step0_help   = 파괴자는 할버드로 기를 모아 지형을 파괴하여 충격파를발사하거나 드랍존을 생성하여 상대를 드랍시켜 제압하는 레어 용병입니다.

step1_title  = 파괴자 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 파괴자 - 파워차징 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 파워차징 공격이 발동됩니다. 공격키를 누르고 있는 동안 파워가 지속적으로 증가하고 차징 단계별로 다른 공격이 발동됩니다.

step3_title  = 파괴자 - 충격파 (D 누름떼기)
step3_help   = 파워를 충분히 모아 게이지가 1이나 2가 되었을때 공격키(D)를 떼면 할버드로 땅을 내려쳐 게이지 횟수만큼 충격파를 발사 할 수 있고 1차징부터 무적버프가 발동됩니다.

step4_title  = 파괴자 - 차징구르기 (D 오래누름 + ->->)
step4_help   = 파워차징 상태 중 방향키를 빠르게 두번 누르면 구르기를 사용할 수 있습니다. 1차징 때부터 구르기 후 자동으로 충격파를 발생시킬 수 있습니다.

step5_title  = 파괴자 - 파괴 (D 누름떼기)
step5_help   = 파워를 충분히 모아 게이지가 3이 되었을때 공격키(D)를 떼면 할버드로 지형을 파괴하여 드랍존을 생성할 수 있고 차징동안 방향키로 이동이 가능합니다.

step6_title  = 파괴자 - 대시공격 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 대상을 높이 띄울 수 있습니다.

step7_title  = 파괴자 - 대시특별공격 (->-> → D 누름떼기)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 상대를 경직시키는 2연타 공격이 발동됩니다.

step8_title  = 파괴자 - 대시특별확장공격 (대시특별공격 + D + D + D)
step8_help   = 대시특별공격 후 공격키(D)를 연속해서 누르면 상대를 스턴시킬 수 있는 3연타 공격을 할 수 있습니다.

step9_title  = 파괴자 - 점프공격(A →D + D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 공중으로 띄우는 올려치기 공격을 하고 추가공격 성공시 상대를 다운시킬 수 있습니다.

step10_title  = 파괴자 - 내려찍기 - (A →D 오래누름)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 하강하면서 할버드로 대상을 내려치는 공격을 합니다. 다운대상도 타격이 가능합니다.

step11_title  = 파괴자 - 발구르기 - (내려찍기 + D)
step11_help   = 내려찍기 공격 후 공격키(D)를 누르면 다리로 맵을 내려 찍어 약한 충격파를 생성해 대상을 높이 띄우는 공격을 할 수 있습니다. 다운된 대상도 타격이 가능합니다.

step12_title  = 파괴자 - 반격 (방어 성공시 바로 공격 + D)
step12_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 상대를 높이 띄운 후 다운시키는 2연타 공격이 발동됩니다.

step13_title = 파괴자 - 브레이크어스(SD)
step13_help  = 브레이크어스(SD)는 주변대상을 끌어당긴 뒤 지형을 파괴하여 드랍존을 생성해 대상을 드랍시키는 스킬입니다.

step14_title = 파괴자 - 디포메이션(ASD)
step14_help  = 디포메이션(ASD)은 지형을 파괴하여 드랍존을 생성하는 스킬입니다. 공격키(D)를 누르면 드랍존을 2회 생성할 수 있고 점프 공격도 가능합니다.

step15_title = 파괴자 - 어스퀘이크(AD)
step15_help  = 어스퀘이크(AD)는 지형을 계속 파괴하여 드랍존을 점점 넓힐 수 있는 스킬입니다. 공격키(D)를 연타하면 드랍존이 점점 넓어지고 공중에서도 사용 가능합니다.

step16_title = 파괴자 - 블랙풀(AS)
step16_help  = 블랙풀(AS)은 자신을 드랍존으로 변형하는 스킬입니다. 드랍존으로 변한 상태에서 방향키로 이동이 가능합니다.

step17_title = 파괴자 - 국민콤보 ①
step17_help  = ★대시공격 (->-> → D) →브레이크어스(SD) 대시공격 (->-> → D)으로 대상을 띄운 후 → 브레이크어스(SD)로 마무리합니다.

step18_title = 파괴자 - 국민콤보 ②
step18_help  = ★충격파(D 누름떼기)1단계로 대상을 띄운 후 → 기본공격 (D → D → D)으로 바운딩 후 → 브레이크어스(SD)로 마무리합니다.

step19_title = 파괴자 - 국민콤보 ③
step19_help  = ★대시특별확장공격 (대시특별공격 + D + D + D)으로 상대를 스턴 후 →내려찍기- (A →D 오래누름)→발구르기(내려찍기 + D) 후 →브레이크어스(SD)로 마무리합니다.


[Set130]

max_step = 18

step0_title  = 잭 오 랜턴 - 기본소개
step0_help   = 잭 오 랜턴은 장난을 좋아하는 유령신사로 펌킨 고스트들과 에어 워크를 사용해 상대가 생각 못한곳에서 공격을 하여 당황한 상대를 제압하는 레어 용병입니다.

step1_title  = 잭 오 랜턴 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 잭 오 랜턴 - 점프공격1 (A →D)
step2_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 3연속 타격을 할 수 있고 대상을 넉백시킵니다.

step3_title  = 잭 오 랜턴 - 펌킨 고스트 (A →D오래)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 D키를 오래 누르면 전방으로 대상을 잡으러 가는 펌킨 고스트를 부릅니다. 상대 타격시 다시 점프상태가 됩니다.

step4_title  = 잭 오 랜턴 - 고속대시1 (->-> → D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 돌면서 순간적으로 고속 대시 이동을 합니다.

step5_title  = 잭 오 랜턴 - 고속대시2 (->-> → D → ->->)
step5_help   = 고속대시1 중 다시 방향키를 빠르게 두 번 누르게 되면 눌러진 방향키 방향으로 다시 돌면서 고속 대시 이동을 합니다. 이때 상대와의 충돌은 회피하게 됩니다.

step6_title  = 잭 오 랜턴 - 대시공격1 (->-> → D →D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 D키를 누르고 다시 D키를 누르면 대상을 띄우는 공격을 합니다.

step7_title  = 잭 오 랜턴 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격키(D)를 누르면 상대에게 호박폭탄을 쥐어 줍니다. 맞은 대상은 호박폭탄을 들고 안절부절 하다가 터지고 스턴 상태가 됩니다.

step8_title  = 잭 오 랜턴 - 펌킨 고스트(지상 D 오래누름)
step8_help   = 공격키(D)를 오래 누르면 게이지를 소모해 펌킨 고스트를 발사하고 상대는 펌킨 고스트에 맞으면 하늘로 둥둥 떠오릅니다. 이 후 추가 공격이 가능합니다.

step9_title  = 잭 오 랜턴 - 에어워크 (A → A)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 점프키(A)를 누르면 게이지를 소모하여 허공을 걷는 에어 워크상태가 되며 에어워크 끝에 점프 상태로 전환됩니다.

step10_title  = 잭 오 랜턴 - 발구르기 (A → A  → D)
step10_help   = 에어워크 상태에서 공격키(D)를 누르면 게이지를 소모하며 전방으로 발구르기를 합니다. 최대 3연타까지 가능하며 사용 후 캐릭터는 지상으로 내려옵니다.

step11_title = 잭 오 랜턴 - 할로윈 위크 / 무기스킬(SD)
step11_help  = 할로윈 위크(SD)는 전방을 향해 분열하는 호박 폭탄을 날리는 스킬입니다. 방향키로 조정 할 수 있으며, 호박이 분열하며 광범위의 공격이 가능합니다.

step12_title = 잭 오 랜턴 - 트릭 오어 트릿!! / 갑옷스킬(ASD)
step12_help  = 트릭 오어 트릿!!(ASD)는 전방에 불타는 왕호박을 소환하여 주변으로 불타는 호박을 뿌립니다. 이 호박에 닿은 대상은 화염상태가 됩니다.

step13_title = 잭 오 랜턴 - 호박던지기 / 투구스킬(AD)
step13_help  = 호박던지기(AD)는 스킬 사용시 시전자의 아래 호박을 생성합니다. 호박을 주어 전방으로 던져 호박을 뒤집어쓰는 지역을 만듭니다. 상대는 경직 상태가 됩니다.

step14_title = 잭 오 랜턴 - 호박 라이트 / 망토스킬(AS)
step14_help  = 호박 라이트(AS)는 전방에 랜턴을 생성해 자신과 연결선을 만들어 언제든 다시 (AS)키 입력시 랜턴이 있는 장소로 끌려 가는 스킬입니다.

step15_title = 잭 오 랜턴 - 국민콤보 ①
step15_help  = ★펌킨 고스트 → 트릭 오어 트릿!! → 할로윈 위크펌킨 고스트로 대상을 띄운 후 바닥에 트릭 오어 트릿!!(ASD)을 설치 후 할로윈 위크(SD)로 마무리 합니다.
                                                       
step16_title = 잭 오 랜턴 - 국민콤보 ②
step16_help  = ★대시공격 → 기본공격 → 에어워크 → 발구르기 대시공격으로 상대를 띄워 기본공격 4타 성공 후 에어워크로 접근하여 발구르기 하며 마무리 합니다.

step17_title = 잭 오 랜턴 - 국민콤보 ③
step17_help  = ★기본공격 후 → 점프 공격 2타 후 → 펌킨 고스트로 대상을 띄움 → 점프 공격 2타 후 → 펌킨 고스트로 띄워 → 에어워크로 접근해 → 발구르기로 마무리 합니다.


[Set131]

max_step = 16

step0_title  = 실랏 - 기본소개
step0_help   = 실랏은 인도네시아 공모전용병으로 빠른 근접 공격과 기를 이용한 발사 공격을 주로 사용하여 연계공격을 하는 근거리 계열 용병입니다.

step1_title  = 실랏 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 실랏 - 에너지파 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 파워차징 공격이 발동됩니다. 공격키를 누르고 있는 동안 파워가 지속적으로 증가하며 풀차징 시 상대의 방어를 무시하고 공격합니다.

step3_title  = 실랏 - 점프공격 (A →D →D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 베고 발로 차는 점프 공격을 합니다. 점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 실랏 - 점프공격 (A →D 오래누름)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 지상으로 착지하며 바닥을 내려찍는 공격을 합니다. 다운대상도 타격이 가능합니다.

step5_title  = 실랏 - 대시공격1 (->-> → D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 경직시키는 대시 공격이 가능합니다.

step6_title  = 실랏 - 대시공격2 (->-> → D + D + D)
step6_help   = 대시 공격 중 추가 D키를 입력하면 대상을 띄우는 공격이 발동 됩니다. 1타와 2타를 연속으로 맞추면 강한 경직이 발생되고 마지막 타격은 대상을 띄우는 공격입니다.

step7_title  = 실랏 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다. 실랏은 대상을 빠르게 지나가면서 공격한 후, 대상의 뒤에서 한번 더 공격하는 반격을 합니다.

step8_title  = 실랏 - 방어 중 회피구르기 / (S유지 ->->)
step8_help   = 방어 중 회피구르기는 방어키(S)를 누르고 있는 상태에서 대쉬(->->)키를 입력하면 해당 방향으로 회피구르기를 합니다. 구르기는 적의 공격을 피하는데 유용합니다.

step9_title  = 실랏 - 리바스 / 무기스킬(SD)
step9_help   = 리바스(SD)는 무기에너지를 모아 전방 회전 공격을 하여 대상을 경직시키고 뛰우는 공격을 하는 스킬입니다. 공중에서도 사용이 가능합니다.

step10_title  = 실랏 - 뜨나가 달람 / 갑옷스킬(ASD)
step10_help   = 뜨나가 달람(ASD)은 에너지를 모아 상대방에게 방출하는 스킬로 총 3단계의 기를 모을 수 있습니다. 단계별로 넉백거리가 증가되며 공중에서도 사용이 가능합니다.

step11_title  = 실랏 - 뜬당안 / 투구스킬(AD)
step11_help   = 뜬당안(AD)은 스핀 이후 상대방을 공중으로 차버리는 스킬입니다. 넘어진 대상을 맞출 수 있으며 다운 중 스킬 사용이 가능합니다.

step12_title = 실랏 - 꾸다-꾸다 / 망토스킬(AS)
step12_help  = 꾸다-꾸다(AS)는 반격자세를 취하고 반격자세 상태에서 일반 공격을 받을시 자동으로 대상을 잡아 던져버리는 스킬입니다. 피격 중에도 사용이 가능합니다.

step13_title = 실랏 - 국민콤보 ①
step13_help  = ★대시공격2 →점프공격 →리바스(SD) →점프공격 대시공격2로 대상을 띄운 후 점프공격을 연계하여 넘어트리고 리바스를 사용해 다시 띄워 마무리합니다.

step14_title = 실랏 - 국민콤보 ②
step14_help  = ★기본공격 →에너지파 →대시공격2 →점프공격 기본공격으로 대상을 경직 시키고 에너지파를 사용해 살짝 띄운 후 대시공격2와 점프 공격으로 마무리합니다.

step15_title = 실랏 - 국민콤보 ③
step15_help  = ★대시공격 → 뜬당안(AD) → 뜨나가 달람(ASD) 대시공격 2타로 대상을 경직시킨 후 뜬당안(AD)으로 높이 띄운 후 뜨나가 달람으로 마무리합니다.


[Set132]

max_step = 18

step0_title  = 쉐도우 레인저 - 기본소개
step0_help   = 쉐도우 레인저는 석궁으로 타겟에게 초승달마크를 표시해 초승달마크를 달고있는 상대의 그림자에서 튀어나와 상대를 제압하는 일반 용병입니다.

step1_title  = 쉐도우 레인저 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 쉐도우 레인저 - 쉐도우무빙 사용방법 ①
step2_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 쉐도우무빙은 대기, 걷기, 점프, 대시 중 공격키(D)오래누름으로 사용이 가능하고 게이지를 소모합니다.

step3_title  = 쉐도우 레인저 - 쉐도우무빙 사용방법 ②
step3_help   = 쉐도우 무빙은 일정거리를 순간이동 합니다. 주변에 초승달 마크를 달고 있는 대상이 있으면 대상의 뒤로 순간이동하며, 순간이동 후에 추가 공격을 할 수 있습니다.

step4_title  = 쉐도우 레인저 - 체크메이트 (D 오래누름)
step4_help   = 공격키(D)를 오래 누르면 석궁을 발사합니다. 타격한 상대에게 초승달 마크를 표시할 수 있고 범위내에 초승달마크를 단 상대가 있으면 쉐도우 무빙이 가능합니다.

step5_title  = 쉐도우 레인저 - 점프공격 (A →D →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 석궁을 발사할 수 있습니다. 석궁으로 연속 공격시 상대를 무릎꿇게 할 수 있습니다.

step6_title  = 쉐도우 레인저 - 대시공격1 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 경직시키는 대시 공격이 가능합니다.

step7_title  = 쉐도우 레인저 - 대시공격2 (->-> → D + D + D)
step7_help   = 대시 공격 중 추가 D키를 입력하면 대상을 스턴시키는 공격이 발동되고 마지막 타격은 대상을 띄우는 공격입니다.

step8_title  = 쉐도우 레인저 - 반격 (방어 성공시 바로 공격)
step8_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다. 반격 후 추가 공격키(D)를 누르면 상대를 무릎꿇게하는 공격을 할 수 있습니다.

step9_title  = 쉐도우 레인저 - 반격 중 쉐도우 무빙
step9_help   = 공격 방어 후 바로 공격키(D)를 오래 누르면 일정거리 앞으로 순간이동이 가능하며 순간이동 후 최대 4회 추가 타격이 가능합니다.

step10_title  = 쉐도우 레인저 - 대시 공격 중 회피구르기 / (>-> → D →->->)
step10_help   = 대시 공격 중 회피구르기는 대시 공격중 대쉬(->->) 키를 입력하면 해당 방향으로 회피구르기를 합니다. 구르기는 적의 공격을 피하는데 유용합니다.

step11_title  = 쉐도우 레인저 - 쉐도우하이딩 / 무기스킬(SD)
step11_help   = 쉐도우하이딩(SD)은 그림자를 조종해 순간이동하는 스킬입니다. 순간이동 후 공격키(D)를 연타하면 4회 추가 타격이 가능하고 다운중 사용이가능합니다.

step12_title  = 쉐도우 레인저 - 쉐도우스팅 / 갑옷스킬(ASD)
step12_help   = 쉐도우스팅(ASD)은 그림자를 조종하여 그림자 가시를 생성해 상대를 마구 찌르는 스킬입니다. 공격키를 연타하면 총 5회 타격할 수 있습니다.

step13_title  = 쉐도우 레인저 - 쉐도우그랩핑 / 투구스킬(AD)
step13_help   = 쉐도우그랩핑(AD)은 일정거리 전진이동 중 상대와 충돌하면 상대를 잡고 베는 스킬입니다. 다운된 상대도 잡기가 가능합니다.

step14_title = 쉐도우 레인저 - 쉐도우애로우 / 망토스킬(AS)
step14_help  = 쉐도우애로우(AS)는 일정거리를 구르며 전진이동 후 석궁 8발을 한번에 발사하는 스킬입니다. 피격, 다운 중 사용이 가능합니다.

step15_title = 쉐도우 레인저 - 국민콤보 ①
step15_help  = ★쉐도우그랩핑(AD) →쉐도우하이딩(SD) 쉐도우그래핑(AD)으로 대상을 잡고 무릎꿇게 시킨 후 쉐도우하이딩 후 추가타격(D키연타)으로 마무리 합니다.

step16_title = 쉐도우 레인저 - 국민콤보 ②
step16_help  = ★기본공격으로 대상을 무릎꿇게 한 후 →체크메이트(D 오래누름)로 대상을 띄우고 →쉐도우 무빙 후 추가타격(D오래누름 + D + D +D)로 마무리 합니다.

step17_title = 쉐도우 레인저 - 국민콤보 ③
step17_help  = ★쉐도우애로우(AS)로 구르고 방향키로 회전 후→ 체크메이트 (D 오래누름)로 마크 후 →쉐도우하이딩(SD) 후 →쉐도우 무빙 추가타격으로 마무리 합니다.


[Set133]

max_step = 18


step0_title  = 다크 나이트 - 기본소개
step0_help   = 다크 나이트는 마검의 주인으로 마족의 검술과 마검의 힘을 사용해 빠르게 접근하거나 후퇴하여 상대를 제압하는 일반 용병입니다.

step1_title  = 다크 나이트 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 다크 나이트 - 끌려오라..(D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 마검을 길게 뻗어 상대를 약간 경직시키며,바로 마검을 회수 하면서 자신쪽으로 당겨오는 공격을 합니다.

step3_title  = 다크 나이트 - 대시공격 (->-> → D + D + D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 마검으로 공격합니다. 최대3회 타격이 가능합니다.

step4_title  = 다크 나이트 - 달리기 중 끌려오라.. (달리기 중→D오래누름)
step4_help   = 빠른 달리기가 발동된 후 D오래누름 시 바로 전방으로 끌려오라..공격을 사용합니다. 이 후 공격권에 우위에 있어 선공이 가능합니다.

step5_title  = 다크 나이트 - 점프공격 - (A →D + D +D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 마검으로 공격합니다. 이때 추가로 D키를 눌러 최대 3연타 공격이 가능합니다.

step6_title  = 다크 나이트 - 꿇어라.. (공중→D오래누름)
step6_help   = 다크 나이트는 공중에서 공격키(D)를 오래누르면 지상으로 꿇어라..공격을 사용합니다. 지상으로 내려오며 공격으로 다운 대상도 공격이 가능합니다.

step7_title  = 다크 나이트 - 착검(공격 중 ->->)
step7_help   = 다크 나이트의 검술은 언제든 착검을 이용하여 원하는 방향으로 이동 할 수 있습니다. 또한 착검 3번 발동시 지상에서 공격키 입력시 낙화 공격이 가능합니다.

step8_title = 다크 나이트 - 반격 (방어 성공시 바로 공격)
step8_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step9_title = 다크 나이트 - 광폭화1 (폭주게이지 충전시 변신)
step9_help  = 다크 나이트는 폭주게이지를 가지고 있습니다.공격을 성공 시키거나 상대가 막을경우, 상대의 공격을 맞거나 막을경우 일정량 충전되어 자동 변신합니다.

step10_title = 다크 나이트 - 광폭화2 (폭주게이지 충전시 변신)
step10_help  = 다크 나이트는 광폭화가 된 후에는 일정 공격의 효과가 증가하며, 이동속도와 공격력이 상승합니다. 또한 착검 게이지3의 공격이 강화 됩니다.

step11_title = 다크 나이트 - 찢어주마.. / 무기스킬(SD)
step11_help  = 찢어주마..(SD)는 전방에 전진 이동을 하여 상대를 무차별로 베어버린뒤 공격키(D)입력시 마기를 쏘아 밀어내는 공격을 하게 됩니다.

step12_title = 다크 나이트 - 제압하라.. / 갑옷스킬(ASD)
step12_help  = 제압하라..(ASD)는 자신과 자신의 아군에게는 방어 파괴와 무적 상태가 되며, 주위에 상대에게는 일정시간 후 경직에 걸리는 상태를 만듭니다.

step13_title = 다크 나이트 - 일어나라.. / 투구스킬(AD)
step13_help  = 일어나라..(AD)는 전방에 잡힌 대상의 머리를 잡고, 에너지를 흡수한 뒤에 던져 버리는 스킬입니다. 이 후 약 경직 상태가 되어 추가타격이 가능합니다.

step14_title = 다크 나이트 - 돌격하라.. / 망토스킬(AS)
step14_help  = 돌격하라..(AS)는 전방으로 과거의 다크 나이트 망령을 불러들여 전방으로 돌진시키는 스킬입니다. 다운 대상도 공격이 가능합니다.

step15_title = 다크 나이트 - 국민콤보 ①
step15_help  = ★일어나라..(AD) → 찢어주마.. (SD) 일어나라..(AD)로 대상을 일으켜 세워 약 경직 후 바로 찢어주마..(SD)로 상대를 마무리 합니다.
               
step16_title = 다크 나이트 - 국민콤보 ②
step16_help  = ★찢어주마.. (SD) → 기본공격 (D →D →D) 찢어주마.. (SD)로 상대를 경직 시킨뒤 기본공격 3타로 마무리 합니다.

step17_title = 다크 나이트 - 국민콤보 ③
step17_help   = ★제압하라..(ASD)로 대상에게 사용 후 → 일어나라.. (AD)로 대상을 일으켜 세운뒤에 → 찢어주마..(SD)로 연타하여 마무리 공격을 합니다.


[Set134]

max_step = 15

step0_title  = 점퍼 - 기본소개
step0_help   = 점퍼는 포탈을 타고 자유자재로 이동할 수 있고, 상대를 잡아 포탈을 타고 이동해 공격하거나, 상대가 가는 길목에 포탈을 설치해 상대를 제압하는 레어 용병입니다.

step1_title  = 점퍼 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 점퍼 - 포탈오픈 사용방법 ①
step2_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 포탈오픈은 대기, 걷기, 점프, 대시 중 공격키(D)오래누름으로 사용이 가능하고 게이지를 소모합니다.

step3_title  = 점퍼 - 포탈오픈 사용방법 ②
step3_help   = 공격키(D)를 오래 누르면 균열을 발생시키고,균열에 피격 된 상대를 잡고 반대편 포탈로 이동합니다. 상대를 잡은 후 방향키를 누르면 방향키를 누른 방향에 포탈이 생성됩니다.

step4_title  = 점퍼 - 공간이동 (공격중 →→)
step4_help   = 기본,대시,점프 공격에서 -> -> 대시키를 입력하면 게이지를 소모하여 일정거리 공간이동이 가능합니다. 공간이동 후 바로 공격키를 누르면 콤보를 이어갈 수 있습니다.

step5_title  = 점퍼 - 점프공격 (A →D →D →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 공격을 합니다. 최대 3번 공격 가능하며, 3타에서 강하게 내려찍는 공격을 합니다.

step6_title  = 점퍼 - 대시공격 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시킬 수 있고 최대 3연속 타격을 할 수 있습니다.

step7_title  = 점퍼 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step8_title = 점퍼 - Portal / 무기스킬(SD)
step8_help  = Portal(SD)은 포탈을 열어 전방의 상대를 포탈로 끌어당겨 잡는 스킬입니다. 포탈이 처음 열렸을 때만 상대를 포탈로 잡을 수 있고, 공격키(D)를 누르면 상대를 날려보냅니다.

step9_title = 점퍼 - Warp / 갑옷스킬(ASD)
step9_help  = Warp(ASD)는 마법진을 조종하여 마법진 범위내의 상대를 자신의 위치로 바꿀 수 있는 스킬입니다. 지상 및 공중에서 사용이 가능합니다.

step10_title = 점퍼 - Space Movement / 투구스킬(AD)
step10_help  = Space Movement(AD)은 전방에 설치한 포탈에 걸린 상대를 원하는 위치로 이동시키는 포탈을 설치합니다 공격키(D)를 누르면 반대편 포탈로 순간이동 시킵니다.

step11_title = 점퍼 - Teleportation / 망토스킬(AS)
step11_help  = Teleportation(AS)는 순간이동 공격으로 상대를 랜덤한 위치로 이동시키는 스킬입니다. 공격키(D)를 누르면 추가 공격이 가능하며 방향키로 방향전환이 가능합니다.

step12_title = 점퍼 - 국민콤보 ①
step12_help  = ★기본공격 (D → D → D → D) → Portal(SD) 기본공격으로 대상을 다운 시킨 후  → Portal(SD)로 마무리 합니다.

step13_title = 점퍼 - 국민콤보 ②
step13_help  = ★포탈오픈(D 오래누름)으로 대상을 바운딩시킨 후 → 점프공격 (A →D →D →D)로 대상을 다운시키고 → Portal(SD)로 마무리 합니다.

step14_title = 점퍼 - 국민콤보 ③
step14_help  = ★대시공격 (->-> → D → D → D)로 무릎꿇기 상태로 만든 후 →포탈오픈(D 오래누름)으로 대상을 바운딩후 → Telep..(AS) 5연속 공격 후 →Portal(SD)로 마무리 합니다.


[Set135]
max_step = 17

step0_title  = 엔지니어 - 기본소개
step0_help   = 엔지니어는 지정된 위치를 지키는 터렛을 곳곳에 설치 하여 적팀의 행동 제약 및 지역 장악하는데 유용한 특수계열 용병입니다.
                          
step1_title  = 엔지니어 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 엔지니어 - 터렛설치 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 앞에 터렛을 설치합니다. 터렛은 최대 5개까지 동시에 설치할 수 있으며 5개를 넘어서 설치할 경우 최초 설치한 터렛이 자동 폭파됩니다.

step3_title  = 엔지니어 - 터렛설치 Lv.1 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 앞에 터렛을 설치합니다. 처음 터렛은 전방에 대상에게 개틀링을 2발씩 발사하는 공격을 하며 1번 타격시 폭파 됩니다.

step4_title  = 엔지니어 - 터렛설치 Lv.2 (D 오래누름)
step4_help   = Lv.1 터렛 앞에서 공격키(D)를 오래 누르면 전방에 터렛의 레벨을 한단계 업그레이드 합니다. 공중 대상에게 로켓을 발사하며 3번 타격시 폭파됩니다.

step5_title  = 엔지니어 - 터렛설치 Lv.3 (D 오래누름)
step5_help   = Lv.2 터렛 앞에서 공격키(D)를 오래 누르면 전방에 터렛의 레벨을 한단계 업그레이드 합니다. 주변 대상에게 전기펄스를 발사하며 4번 타격시 폭파됩니다.

step6_title  = 엔지니어 - 점프공격 (A → D → D → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 수직으로 타격하는 점프 공격을 합니다. 점프 공격중 자동으로 전기구체를 날리게 됩니다.

step7_title  = 엔지니어 - 짜릿한맛! (A → D 오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 D키를 오래 누르면 사방으로 전기 구체를 뿌리게 됩니다. 자신의 아래에는 전기 구체가 떨어지지 않습니다.

step8_title  = 엔지니어 - 대시공격 (->-> → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키는 2연속 타격을 합니다.

step9_title  = 엔지니어 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step10_title  = 엔지니어 - 울트라메가톤 슈퍼터렛 / 무기스킬(SD)
step10_help   = 울트라메가톤 슈퍼터렛(SD)은 초강력 터렛를 설치하여 탑승하여 상대를 공격하는 스킬입니다. (D키-개틀링, S키-전기펄스, A키-유도로켓, D오래누름-레이져 빔)

step11_title  = 엔지니어 - 뻥이요~ / 갑옷스킬(ASD)
step11_help   = 뻥이요~(ASD)는 스킬이 발동되면 자동으로 폭발하여, 범위 공격을 하고 점프상태가 됩니다. 다운 시에도 사용이 가능하며 갑옷장비가 벗겨질때도 발동합니다.

step12_title  = 엔지니어 - 시한폭탄 / 투구스킬(AD)
step12_help   = 시한폭탄(AD)은 스킬 발동 후 시한폭탄을 들고 전방으로 던지는 스킬입니다. 주변의 상대에게 붙은뒤 일정시간 뒤에 폭파합니다. 최대 2번 사용이 가능합니다.

step13_title  = 엔지니어 - 스트라이더 / 망토스킬(AS)
step13_help   = 스트라이더(AS)는 땅에 숨어 있다가 일정 거리 내에 상대방을 추적 하는 스킬입니다. 공중으로 접근하는 대상도 발동하며 최대 4개까지 설치가 가능합니다.

step14_title = 엔지니어 - 국민콤보 ①
step14_help  = ★스트라이더(AS) → 점프공격 상대 바로 앞에 스트라이더를 심어 바로 터트려 띄운 뒤에 점프공격으로 마무리 합니다.

step15_title = 엔지니어 - 국민콤보 ②
step15_help  = ★기본공격 → 시한폭탄(AD) 상대를 기본공격으로 강격직 상태로 만든 뒤 시한폭탄(AD) 스킬을 사용하여 멀리 날려 마무리 합니다.

step16_title = 엔지니어 - 국민콤보 ③
step16_help  = ★대시공격으로 상대를 강경직 시킨 뒤 →스트라이더(AS)로 상대를 뛰워 →기본공격으로 바운딩 후→ 시한폭탄(AD)으로 마무리 합니다.


[Set136]
max_step = 19

step0_title  = 검제 - 기본소개
step0_help   = 검제는 높은 내공으로 검을 자유롭게 조종하여 공격시 자동으로 어검을 발사해 상대를 타격하여 제압하는 일반 용병입니다.

step1_title  = 검제 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 검제 - 어검발사 (D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 어검을 전방으로 발사하고 피격된 상대를 어검이 자동으로 연타합니다. 어검상태가 아닐때에는 게이지를 소모하지 않습니다.

step3_title  = 검제 - 대시공격 (->-> → D + D )
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 경직시키고 추가 공격시 대상을 높이 띄웁니다.

step4_title  = 검제 - 회전난무 (->-> →D오래누름)
step4_help   = 빠른 달리기가 발동된 후 D오래누름 시 몸을 회전하며 전진이동 합니다. 최대 4연타 공격이 가능하고 마지막 타격 공격시 대상을 높이 띄웁니다.

step5_title  = 검제 - 점프공격 - (A →D + D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 띄우는 공격을 합니다. 추가 타격시 상대를 다운 시킵니다.

step6_title  = 검제 - 공중대시(점프 중 ->->)
step6_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 검으로 찌르는 공격을 합니다. 공격당한 대상은 잠시동안 경직상태가 됩니다.

step7_title  = 검제 - 어검다발 (A →D오래누름)
step7_help   = 검제는 공중에서 공격키(D)를 오래누르면 어검을 발사하고 상대를 넉백 시킬 수 있습니다. 이기어검 상태 시 어검 발사 갯수가 늘어나고 게이지를 소모합니다.

step8_title = 검제 - 반격 (방어 성공시 바로 공격)
step8_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step9_title = 검제 - 이기어검 (내공게이지 충전시 변신)
step9_help  = 검제는 내공게이지를 가지고 있고 걷기, 대시, 대기상태에서 충전됩니다. 이기어검 상태일때 어검발사(D 오래누름) 공격이 확장되고 게이지가 0이되면 해제됩니다.

step10_title = 검제 - 이기어검2 (내공게이지 충전시 변신)
step10_help  = 검제는 내공게이지가 가득차면 자동으로 이기어검 상태가 되고 기본,대시,점프,회전난무,어검다발 공격시 어검이 추가로 발사되며 게이지를 일정량 소모합니다.

step11_title  = 검제 - 어검발사 확장(D 오래누름 + D)
step11_help   = 이기어검 상태일때 어검발사(D 오래누름)시 피격된 상대에게 어검이 붙고 공격키(D)를 누르면 어검을 조종해 상대를 타격할 수 있고 최대 5연속 타격이 가능합니다.

step12_title = 검제 - 검우/ 무기스킬(SD)
step12_help  = 검우(SD)는 캐릭터 주변 일정범위 내에 검을 비처럼 공중에서 떨어지게 하는 스킬입니다. 공중에서 떨어진 검은 땅에 박힌 뒤 부서지며 터집니다.

step13_title = 검제 - 추풍낙엽 / 갑옷스킬(ASD)
step13_help  = 추풍낙엽(ASD)은 주변의 상대에게 빠르게 이동하여 전후좌우로 상대를 마구 베는 스킬입니다.

step14_title = 검제 - 어검연타 / 투구스킬(AD)
step14_help  = 어검연타(AD)는 주변에 가까이 다가온 대상을 어검으로 마구연타하는 스킬입니다. 상대를 무릎꿇기 상태로 만듭니다.

step15_title = 검제 - 비검/ 망토스킬(AS)
step15_help  = 비검(AS)은 캐릭터 주변을 일정시간동안 날아다니는 어검을 소환하는 스킬입니다. 상대가 가까이오면 상대에게 날아가 공격해 스턴시킵니다.

step16_title = 검제 - 국민콤보 ①
step16_help  = ★어검연타(AD) → 추풍낙엽(ASD) 어검연타(AD)로 대상을 무릎꿇게 시킨 후 추풍낙엽(ASD)으로 상대를 마무리 합니다.

step17_title = 검제 - 국민콤보 ②
step17_help  = ★대시공격 (->-> → D + D ) → 기본공격 (D →D →D) 대시공격 (->-> → D + D )으로 상대를 띄운 뒤 기본공격 (D →D →D)으로 상대를 마무리 합니다.

step18_title = 검제 - 국민콤보 ③
step18_help   = ★이기어검 상태의 회전난무 (->-> →D오래누름)로 대상을 띄운 후 →기본공격 (D →D →D) 후 →어검다발(A →D오래누름)로 마무리 공격을 합니다.


[Set137]
max_step = 15

step0_title  = 제우스 - 기본소개
step0_help   = 제우스는 천둥과 번개를 쓰는 그리스의 주신으로 번개창을 사용해 지상에 번개를 흐르게 하여 상대를 제압하는 레어 용병입니다.

step1_title  = 제우스 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 제우스 - 번개창 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 전방으로 영역이 커지면서 번개창을 내려칩니다. 내려친 번개창은 지상에 닿으면 지형을 타고 흐르는 번개를 발생시킵니다.

step3_title  = 제우스 - 대시공격1 (->-> → D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 공중으로 띄운 후 점프상태로 전환하는 공격을 합니다.

step4_title  = 제우스 - 대시공격2 (->-> → D오래누름)
step4_help   = 빠른 달리기가 발동된 후 D오래누름 시 전방으로 번개창을 내리치며, 상대를 경직 시킬 수 있습니다. 지상에 닿으면 지형을 타고 흐르는 번개를 발생시킵니다.

step5_title  = 제우스 - 점프공격1 (A →D + D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 2연속 타격을 할 수 있고 지상의 상대를 무릎꿇기 상태로 만듭니다.

step6_title  = 제우스 - 점프공격2 (A →D오래누름)
step6_help   = 제우스는 공중에서 공격키(D)를 오래 누르면 번개창을 지상으로 내리치며, 상대를 경직 시킬 수 있습니다. 지상에 닿으면 지형을 타고 흐르는 번개를 발생시킵니다.

step7_title = 제우스 - 반격 (방어 성공시 바로 공격)
step7_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step8_title = 제우스 - 천벌 / 무기스킬(SD)
step8_help  = 천벌(SD)은 캐릭터 전방에 번개를 내리치는 스킬입니다. 번개에 맞은 상대는 경직과 함께 뒤로 밀려나는 효과를 가집니다. 누워있는 대상 공격이 가능합니다.

step9_title = 제우스 - 천둥의 신 / 갑옷스킬(ASD)
step9_help  = 천둥의 신(ASD)은 자신이 뇌운으로 변형하여 지상으로 번개를 내리치는 스킬입니다. 공격키(D)를 누르면 뇌운 주위의 상대에게 번개를 내리쳐 경직시킵니다.

step10_title = 제우스 - 제우스의 분노 / 투구스킬(AD)
step10_help  = 제우스의 분노(AD)는 마법진을 조종한 후 공격키(D)를 연타시 마법진 위치에 번개를 내리칩니다. 이후 A키를 누르게 되면 해당 위치로 순간이동 하게 됩니다.

step11_title = 제우스 - 제우스의 유희 / 망토스킬(AS)
step11_help  = 제우스의 유희(AS)는 빠르게 비행을 하며 주위 상대에게 번개를 발사하는 스킬입니다. A키를 누르면 고도가 상승하며 서서히 하강이 됩니다.

step12_title = 제우스 - 국민콤보 ①
step12_help  = ★제우스의 분노(AD) → 제우스의 유희(AS) 제우스의 분노(AD)로 대상을 경직 시킨 후 순간이동하여 제우스의 유희(AS)로 마무리 공격을 합니다.

step13_title = 제우스 - 국민콤보 ②
step13_help  = ★대시공격1 (->-> → D)로 대상을 띄운 후 → 점프공격으로 대상을 바운딩 시킨 후 →천벌(SD)로 기립 후 → 기본공격으로 마무리 공격을 합니다.

step14_title = 제우스 - 국민콤보 ③
step14_help  = ★천둥의 신(ASD)으로 상대를 경직시킨 후 -> 천벌(SD)로 한번 더 경직 후 -> 기본공격 (D → D → D → D)으로 마무리 공격을 합니다.


[Set138]
max_step = 19

step0_title  = F-세이버 - 기본소개
step0_help   = F-세이버는 부스터로 상대에게 고속이동해 연타후 넉백시켜 상대를 제압하는 일반 용병입니다.

step1_title  = F-세이버 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = F-세이버 - 고속이동공격1 (D 오래누름 → ->->)
step2_help   = 공격키(D)를 오래 누르면 전방으로 빠르게 고속이동하여 상대를 밀어내는 공격을 합니다. 이후 대시키를 입력하면 해당 방향으로 고속이동 하며 게이지를 10 소모합니다.

step3_title  = F-세이버 - 고속이동공격2
step3_help   = 고속이동공격1(D 오래누름 → ->->)로 상대를 밀어내고, D키를 입력하면 추가 공격이 발생합니다. 3타 공격 이후 다시 고속이동공격1(D 오래누름 → ->->)이 가능합니다.

step4_title  = F-세이버 - 대시공격1 (->-> → D → D )
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 무릎꿇기 상태로 만드는 공격이 가능합니다.

step5_title  = F-세이버 - 대시공격2 (->-> → D오래누름)
step5_help   = 빠른 달리기가 발동된 후 D오래누름 시 전방으로 조준점이 나타나고 D키를 떼면 조준된 상대 혹은 전방으로 검기를 발사합니다. 검기에 피격된 캐릭터는 띄움 상태가 됩니다.

step6_title  = F-세이버 - 세이버 부스터 (A키 오래누름)
step6_help   = 점프키(A)를 오래 누르고 있으면 부스터 상태로 전환이 됩니다. 방향키를 입력시 바라보는 방향을 유지한 상태로 대시 이동을 합니다. 또한 A키는 상승, S키는 하강을 합니다.

step7_title  = F-세이버 - 세이버 부스터 사용방법 ①
step7_help   = 대기, 걷기, 대시, 점프, 공중 중 점프키(A)를 오래 누르고 있으면 부스터 상태가 됩니다. 점프 중이나, 고도가 상승된 상태에서 부스터 종료 시 점프상태로 전환됩니다.

step8_title  = F-세이버 - 세이버 부스터 사용방법 ②
step8_help   = 부스터 중 공격키(D)를 누르면 조준점이 있는 곳으로 빠르게 이동 후 대상을 공중에 띄우는 공격을 합니다. D키 입력시 추가 공격이 가능합니다.

step9_title  = F-세이버 - 세이버 부스터 사용방법 ③
step9_help   = 부스터 중 공격키(D)를 오래 누르면 전방으로 상대를 넉백시키고 대시이동 후 추가 공격을 하는 고속이동공격 사용이 가능하고 게이지를 소모합니다.

step10_title  = F-세이버 - 점프공격1 (A →D + D + D)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 3연속 타격을 할 수 있고 대상을 바닥에 내려찍습니다.

step11_title  = F-세이버 - 점프공격2 (A →D오래누름)
step11_help   = F-세이버는 공중에서 공격키(D)를 오래 누르면 전방으로 상대를 넉백시키는 고속이동공격을 할 수 있으며, 게이지를 10 소모합니다.

step12_title = F-세이버 - 라이트닝 스피드 / 무기스킬(SD)
step12_help  = 라이트닝 스피드(SD)는 상대를 포박하고, 순간이동 하여 공격하는 스킬입니다. D키를 입력하면 상대에게 검기를 날려 포박하고, D키를 입력하면 순간이동 공격합니다.

step13_title = F-세이버 - 하이퍼 부스터 / 갑옷스킬(ASD)
step13_help  = 하이퍼 부스터(ASD)는 세이버 부스터로 고속 이동하며 충돌된 상대를 띄우는 스킬입니다. A키를 누르면 고도가 상승하며 서서히 하강이 됩니다.

step14_title = F-세이버 - 레이저 헤드 / 투구스킬(AD)
step14_help  = 레이저 헤드(AD)는 투구에서 전방으로 레이저 빔을 발사하는 스킬입니다. 조준선을 방향키로 회전하며, 점프(A)/방어(S)키로 각도 조절이 가능합니다.

step15_title = F-세이버 - 버크샷 미사일 / 망토스킬(AS)
step15_help  = 버크샷 미사일(AS)은 전방으로 작은 탄환이 퍼져 터지는 미사일을 발사하는 스킬입니다. 공중 사용이 가능하고 누워있는 대상 공격이 가능합니다.

step16_title = F-세이버 - 국민콤보 ①
step16_help  = ★고속이동공격2 (D 오래누름 → ->->)으로 상대를 밀어내고, 고속이동하여 추가 공격으로 상대를 공격하고 레이저 헤드(AD)로 상대를 마무리 합니다.

step17_title = F-세이버 - 국민콤보 ②
step17_help  = ★세이버 부스터(A키 오래누름)후 D키 입력으로 상대를 연타 공격한 후 → 누워있는 상대에게 라이트닝 스피드(SD)로 누워있는 상대를 공격하여 마무리 합니다.

step18_title = F-세이버 - 국민콤보 ③
step18_help  = ★세이버 부스터(A키 오래누름)로 상대에게 접근하여 공격키를 입력하여 상대를 연타한 후, 바운딩 된 상대에게 D오래누름으로 고속이동하여 D키 연타로 마무리 합니다.


[Set139]
max_step = 19

step0_title  = 아웃복서 - 기본소개
step0_help  = 아웃복서는 복싱스탭을 이용하여 일정 거리를 유지하며 플리커 잽을 이용한 펀치로 상대를 제압하는 근거리 용병 입니다.

step1_title  = 아웃복서 - 기본공격 (D → D → D)
step1_help  = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 아웃복서 - 스텝 (D 누름 유지)
step2_help  = 공격키(D)를 누름 유지하면 제자리에서 가볍게 몸을 푸는 스텝상태가 됩니다. 스텝 상태에서 방향키를 입력하면 게이지를 소모하며 풋워크로 빠르게 움직입니다.

step3_title  = 아웃복서 - 스텝 → 플리커 잽 (D 누름 유지 후 떼기)
step3_help  = 공격키(D)를 누름 유지하는 스텝 상태에서 공격키(D)를 떼면 상대를 4연타 공격하는 플리커 잽을 날리고 플리커 스텝 상태로 전환 됩니다.

step4_title  = 아웃복서 - 플리커 스텝
step4_help  = 플리커 스텝 상태에서는 풋워크, 위빙, 플리커 잽, 원 투 펀치를 사용할 수 있으며, 점프키(A)키로 해제 가능합니다.

step5_title  = 아웃복서 - 풋워크 (플리커 스텝 → 방향키 입력)
step5_help  = 플리커 스텝 자세에서 방향키를 입력하면 게이지를 소모하며 해당 방향으로 빠르게 움직입니다. 아군 캐릭터는 통과하며, 전방의 상대 캐릭터는 통과하지 않습니다.

step6_title  = 아웃복서 - 위빙 (플리커 스텝 → S키 입력)
step6_help  = 플리커 스텝 자세에서 방어키(S)를 입력하면 게이지를 소모하며 좌우로 상체를 움직이는 위빙 상태가 됩니다. 위빙 상태에서는 상대의 방어 가능 공격을 무시합니다.

step7_title  = 아웃복서 - 플리커 잽 (플리커 스텝 → D키 오래누름)
step7_help  = 플리커 스텝 자세에서 공격키(D)키를 오래 누르면 게이지를 소모하며 전방으로 4연타 공격을 하는 플리커 잽을 날리고 대상을 넉백시킵니다.

step8_title  = 아웃복서 - 원 투 펀치 (플리커 스텝 → D키 입력)
step8_help  = 플리커 스텝 자세에서 공격키(D)키를 입력하면 게이지를 소모하며 전방으로 2연타 공격을 하는 원 투 펀치를 날리고 대상을 밀어냅니다.

step9_title  = 아웃복서 - 점프공격 (A → D)
step9_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 지상의 대상은 경직시키고 공중의 대상은 바닥에 내려찍습니다.

step10_title  = 아웃복서 - 대시공격 (->-> → D + D)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 D키를 누르고 다시 D키 를 누르면 대상을 경직시키는 공격을 합니다.

step11_title  = 아웃복서 - 반격 (방어 성공시 바로 공격)
step11_help = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step12_title  = 아웃복서 - 쉐도우 복서 / 무기스킬(SD)
step12_help  =  쉐도우 복서(SD)는 스킬을 제외한 자신과 같은 행동을 하는 그림자를 소환하는 스킬입니다. 스킬 사용시 3연타 공격을 하며 공중과 지상의 상대를 경직시킵니다.

step13_title  = 아웃복서 - 허리케인 훅 / 갑옷스킬(ASD)
step13_help  = 허리케인 훅(ASD)은 전방에 허리케인을 생성시켜 훅을 날리는 스킬입니다. 생성된 허리케인은 주위 상대를 모으며 누워있는 대상 공격이 가능합니다.

step14_title  = 아웃복서 - 리드미컬 펀치 / 투구스킬(AD)
step14_help  = 리드미컬 펀치(AD)는 헤드폰으로 음악을 들으며 상대에게 펀치 공격하는 스킬입니다. 첫타격에 성공시 펀치로 연타하며, 성공하지 못할 경우에는 스킬이 종료됩니다.

step15_title  = 아웃복서 - 헝그리 정신 / 망토스킬(AS)
step15_help  = 헝그리 정신(AS)은 일정시간 동안 피격시 상대를 밀어내고 아이템 드랍을 보호하는 스킬입니다.

step16_title  = 아웃복서 - 국민콤보 ①
step16_help  = ★쉐도우 복서(SD)로 그림자를 소환한 후 기본공격(D → D → D)으로 그림자와 함께 상대를 연타하고 리드미컬 펀치(AD)로 마무리 합니다.

step17_title  = 아웃복서 - 국민콤보 ②
step17_help  = ★플리커 잽(플리커 스텝 → D키 오래누름)으로 공격 후→ 풋워크(플리커 스텝 → 방향키 입력)로 이동 →플리커 잽(플리커 스텝 → D키 오래누름)으로 마무리 합니다.

step18_title  = 아웃복서 - 국민콤보 ③
step18_help  = ★대시 공격(->-> → D + D)으로 대상을 대상을 경직 시킨 후 → 리드미컬 펀치(AD)로 대상을 연타한 후 → 허리케인 훅(ASD)으로 마무리 합니다.


[Set140]
max_step = 17

step0_title  = 강림도령 - 기본소개
step0_help  = 강림도령은 적패지가 붙은 상대를 타격하여 저승으로 잠시 이동시켜 제압하는 레어 용병입니다.

step1_title  = 강림도령 - 기본공격 (D → D → D)
step1_help  = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 강림도령 - 적패지1 (D 오래 누름)
step2_help  = 공격키(D)를 오래 누르면 2연타 공격을 하고 전방에 적패지를 설치합니다. 2연타 공격에 피격된 상대는 무릎꿇기 상태로 만들고, 적패지를 대상에게 붙입니다.

step3_title  = 강림도령 - 적패지2 (D 오래 누름)
step3_help  =  적패지가 붙게되고 적패지가 붙어있는 상대를 지상에서 2번 타격, 공중 상태일때는 3번 타격시 공중으로 순간 이동시킨 후, 지상으로 바운딩 시킵니다.

step4_title  = 강림도령 - 점프공격1 (A → D + D + D)
step4_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 최대 3연속까지 공격을 합니다. 마지막 타격은 지상의 대상을 띄우는 공격을 합니다.

step5_title  = 강림도령 - 점프공격2 (점프공격1 + D 오래 누름)
step5_help  = 점프공격1 상태에서 공격키(D)를 오래 누르면 연타 공격이 발생합니다. D키 누른 횟수에 따라 타격횟수와 데미지가 다르고 3타후 연타공격 타격시 재점핑이 가능합니다.

step6_title  = 강림도령 - 대시공격1 (->-> → D + D + D)
step6_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 붓으로 공격합니다. 최대3회 타격이 가능합니다.

step7_title  = 강림도령 - 대시공격2 (대시공격1 + D 오래 누름)
step7_help  = 대시공격1 상태에서 공격키(D)를 오래 누르면 연타 공격이 발생합니다. 연타 공격은 대시(->->)상태에서D키 누른 횟수에 따라 타격횟수와 데미지가 다릅니다.

step8_title  = 강림도령 - 반격 (방어 성공시 바로 공격)
step8_help = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step9_title  = 강림도령 - 이중점프 (A 두번 누름)
step9_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step10_title  = 강림도령 - 천명강림 / 무기스킬(SD)
step10_help  =  천명강림(SD)는 자신이 원하는 위치에 상대를 끌어들여 먹는 장승을 설치하는 스킬입니다. 장승은 최대 2개가 설치되며, 누워있는 대상 공격이 가능합니다.

step11_title  = 강림도령 - 강림 / 갑옷스킬(ASD)
step11_help  = 강림(ASD)은 자신이 드랍이 될 경우 재생성 위치를 선택하는 스킬입니다. 드랍 데미지를 감소하는 효과가 있으며, 재생성 시에는 은신 상태로 나타납니다.

step12_title  = 강림도령 - 열명강림 / 투구스킬(AD)
step12_help  = 열명강림(AD)은 대상과 함께 하늘로 이동하는 스킬입니다. 공중 사용이 가능하며, 상대를 피격한 후, 마법진을 조종하고 공격키(D)를 입력하면 대상을 바운딩 시킵니다.

step13_title  = 강림도령 - 귀면 / 망토스킬(AS)
step13_help  = 귀면(AS)은 대상을 하늘로 이동시켜 떨어뜨리는 스킬입니다. 공중과 공중 피격, 공중 경직 중 사용이 가능하고, 누워있는 대상 공격이 가능합니다.

step14_title  = 강림도령 - 국민콤보 ①
step14_help  = ★기본공격 (D → D → D)으로 상대를 띄우고 → 귀면(AS)으로 상대를 지상으로 바운딩 시킨 뒤 → 누워있는 대상에게 천명강림(SD)으로 마무리 합니다.

step15_title  = 강림도령 - 국민콤보 ②
step15_help  = ★기본공격 (D → D → D)으로 상대를 띄우고 → 점프공격1 (A → D + D + D)으로 상대를 3연타한 뒤 → 점프공격2 (점프공격1 + D 오래 누름)로 마무리 합니다.

step16_title  = 강림도령 - 국민콤보 ③
step16_help  = ★대시공격1 (->-> → D + D + D)로 상대를 3연타 한 뒤→ 대시공격2 (대시공격1 + D 오래 누름)로 대상을 연타하고 → 적패지(D 오래 누름)로 마무리 합니다.


[Set141]
max_step = 24

step0_title  = 하데스 - 기본소개
step0_help  = 하데스는 죽음을 관장하는 지하 명부의 왕으로 사슬낫을 사용하여 상대를 끌어당기거나 케르베로스를 소환하여 상대를 제압하는 근거리 용병입니다.

step1_title  = 하데스 - 기본공격 (D → D → D → D)
step1_help  = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 하데스 - 특별공격1 (D 누름떼기)
step2_help   = 공격키(D)를 살짝 눌렀다 떼면 대각 위로 빠르게 사슬을 날려 상대를 속박합니다. 특별 게이지가 노란색일 때만 가능하며 사용할 때마다 게이지가 소모됩니다.

step3_title  = 하데스 - 특별공격2  (D 오래누름)
step3_help   = 공격키(D)를 오래 누르고 있으면 전방으로 빠르게 사슬을 날려 상대를 속박합니다. 특별 게이지가 노란색일 때만 가능하며 사용할 때마다 게이지가 소모됩니다.

step4_title  = 하데스 - 특별공격 사용방법 ①
step4_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 특별 공격은 대기, 걷기, 대시, 점프 중에도 공격키(D) 오래누름과 공격키(D) 누름떼기로 사용이 가능합니다.

step5_title  = 하데스 - 특별공격 사용방법 ②
step5_help   = 특별공격이 지상의 대상을 피격할 경우 대상은 속박되며, 공격키(D)를 누르면 대상을 자신 쪽으로 끌고 옵니다. 특별공격 이후 점프키(A) 입력 시 앞으로 이동합니다.

step6_title  = 하데스 - 특별공격 사용방법 ③
step6_help   = 특별공격이 공중의 대상을 피격할 경우 대상은 속박되며, 공격키(D)를 눌러 대상을 지상으로 바운딩 시킵니다. 특별공격 이후 점프키(A) 입력 시 앞으로 이동합니다.

step7_title  = 하데스 - 대시공격 (->-> → D + D + D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 사슬로 공격합니다. 최대3회 타격이 가능합니다.

step8_title  = 하데스 - 대시특별공격1 (->-> → D 누름떼기)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D) 누름떼기시 특별 공격1 사용이 가능합니다.

step9_title  = 하데스 - 대시특별공격2 (->-> → D 오래누름)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D) 오래누름시 특별 공격2 사용이 가능합니다.

step10_title  = 하데스 - 점프공격 (A → D)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 공중공격을 합니다. 지상의 대상은 약경직 시키고, 공중의 대상은 넉백시킵니다.

step11_title  = 하데스 - 공중대시 (A → ->->)
step11_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당 방향으로 이동하면서 공격을 합니다. 지상의 대상은 약경직 시키고, 공중의 대상은 넉백시킵니다.

step12_title  = 하데스 - 점프특별공격1 (A → D 누름떼기)
step12_help   = 점프 상태에서 공격키(D)키를 살짝 눌렀다 떼면 전방으로 사슬을 날리며 사슬에 닿은 대상을 속박하고, 자동으로 전진 이동합니다.

step13_title  = 하데스 - 점프특별공격2 (A → D 오래누름)
step13_help   = 점프상태에서 공격키(D)키를 오래 누르고 있으면 전방으로 사슬을 날리며 사슬에 닿은 대상을 속박하고, 자동으로 전진 이동합니다.

step14_title  = 하데스 - 이중점프 (A 두번 누름)
step14_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step15_title  = 하데스 - 케르베로스 사용방법①
step15_help   = 특정행동 중 방어키(S)를 누르면 케르베로스가 소환되며, 무기아이콘 상단의 표시된 개수만큼 연속해서 소환이 가능합니다. 

step16_title  = 하데스 - 케르베로스 사용방법(특정행동 중 S키)②
step16_help   = 특별공격, 대시, 대시공격, 점프, 이중점프, 점프공격 중 방어키(S)를 누르면 케르베로스를 소환합니다. 소환된 케르베로스는 주변의 대상을 자동공격합니다.

step17_title  = 하데스 - 죽음의 심판 / 무기스킬(SD)
step17_help  =  죽음의 심판(SD)은 어둠의 손이 사슬 낫으로 상대를 공격하여 육체에서 혼을 빼내는 스킬입니다. 혼이 육체 근처로 이동하면 자동으로 원래 상태로 돌아갑니다.

step18_title  = 하데스 - 파멸의 명상 / 갑옷스킬(ASD)
step18_help  = 파멸의 명상(ASD)은 파멸의 힘을 모아 전체 지역의 상대를 공격하는 스킬입니다. 누워있는 대상이 공격이 가능하며, 피격된 대상을 강경직 시킵니다.

step19_title  = 하데스 - 퀴네에 / 투구스킬(AD)
step19_help  = 퀴네에(AD)는 게이지가 충전되면 자동으로 자신을 은신 상태로 만들며, 이동시 캐릭터를 관통하여 이동합니다.

step20_title  = 하데스 - 케르베로스 / 망토스킬(AS)
step20_help  = 케르베로스(AS)는 불과 독, 어둠을 내뿜는 케르베로스를 소환하는 스킬입니다. 케르베로스는 최대 3마리가 소환되며, 피격된 대상을 넉백시킵니다.

step21_title  = 하데스 - 국민콤보 ①
step21_help  = ★대시공격3 (->-> → D + D + D)으로 대상을 바운딩 시킨 뒤 → 기본공격(D → D → D →D)으로 넉백 후 → 누워 있는 대상에게 죽음의 심판(SD)으로 마무리 합니다.

step22_title  = 하데스 - 국민콤보 ②
step22_help  = ★기본공격 (D → D → D → D)으로 대상을 띄우고 → 특별 공격2로 대상을 잡고 공격키(D)를 눌러 바운딩 시킨 뒤 → A키를 눌러 이동하여 점프공격으로 마무리합니다.

step23_title  = 하데스 - 국민콤보 ③
step23_help  = ★공중대시 (A → ->->) 후에 점프공격1로 대상을 강격직 시킨 후 → 특별공격2(D 오래누름)로 대상을 속박하고 → S키를 눌러 케르베로스를 소환하여 마무리 합니다.


[Set142]

max_step = 20

step0_title  = 마검사 - 기본소개
step0_help   = 마검사는 검과 3가지 속성의 마법을 사용하며 상황에 따라 필요한 효과를 내는 마법을 적절하게 사용해 상대에게 디버프를 걸어 제압하는 특수 용병입니다.

step1_title  = 마검사 - 암흑 속성
step1_help   = 마검사는 암흑속성을 공격키(D)로 활성화 시킵니다. 암흑 속성은 적들을 관통하며 잠시동안 이동속도가 느려지고 상대를 스턴시킵니다.

step2_title  = 마검사 - 빙결 속성
step2_help   = 마검사는 빙결속성을 방어키(S)로 활성화 시킵니다. 빙결속성은 잠시 동안 대상을 얼어붙게 만들어 대상의 모든 행동에 제약을 주어 무방비 상태를 만들어 냅니다.

step3_title  = 마검사 - 빛 속성
step3_help   = 마검사는 빛 속성을 점프키(A)로 활성화 시킵니다. 빛 속성은 적들을 관통하며 잠시 동안 상대의 중력을 약하게 만들어 공중에서 천천히 내려오게합니다.

step4_title  = 마검사 - 기본공격 (D →D →D)
step4_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step5_title  = 마검사 - 속성마법( 암흑:D 빙결:S 빛:A )
step5_help   = 기본공격,대시,점프,특별 공격 후 각 속성에 해당하는 키를 입력하여 상황에 따라 다양한 효과를 지닌 공격으로 보다 효과적인 전투를 벌일 수 있습니다.

step6_title  = 마검사 - 무빙스매쉬 사용방법 ①
step6_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 특별공격은 대기, 걷기, 대시 중 공격키(D)오래누름으로 사용이 가능합니다.

step7_title  = 마검사 - 무빙스매쉬 사용방법 ② (D오래누름)
step7_help   = 공격키(D)를 오래 누르면 일정거리 전진이동 후 내려치는 공격을 합니다. 상대와 충돌시에도 내려치기 공격을 할 수 있고 게이지를 소모합니다.

step8_title  = 마검사 - 매직슈팅(D오래누름 + 속성공격)
step8_help   = 무빙스매쉬 후 속성마법( 암흑:D 빙결:S 빛:A )키를 누르면 마법을 발사할 수 있고 최대 4회 연사가 가능합니다. 상대를 연속으로 맞추면 크게 넉백시킬 수 있습니다.

step9_title  = 마검사 - 점프공격 (A → D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 상대를 올려치는 공격을 합니다.피격당한 대상은 공중에 띄워지고 속성 마법을 발사 할 수 있습니다.

step10_title = 마검사 - 점프특별공격 ( A →D오래누름)
step10_help  = 점프상태에서 공격키(D)키를 오래 누르고 있으면 상대를 내려쳐 바운딩 시킬 수 있습니다. 게이지를 소모하며 속성 공격을 할 수 있고 다운된 대상도 타격할 수 있습니다.

step11_title  = 마검사 - 대시공격 (->-> → D + D)
step11_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 경직시키는 공격을 하고 속성 마법을 발사 할 수 있습니다.

step12_title  = 마검사 - 대시특별공격(->-> → D오래누름)
step12_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면 무빙스매쉬를 사용할 수 있고 게이지를 소모합니다.

step13_title = 마검사 - 다크볼 / 무기스킬(SD)
step13_help  = 다크볼(SD)은 다크볼을 생성하는 스킬입니다. 8개의 다크볼을 최초로 생성할 수 있고 공격키(D)를 추가로 누르면 랜덤하게 다크볼을 여러개 생성할 수 있습니다.

step14_title = 마검사 - 파이어토네이도 / 갑옷스킬(ASD)
step14_help  = 파이어토네이도(ASD)는 전방에 거대한 화염 회오리를 생성하는 스킬입니다. 상대를 연타하여 점점 공중으로 높이띄우며 피격된 대상을 오랫동안 누워있게 할 수 있습니다.

step15_title = 마검사 - 아이스트랩 / 투구스킬(AD)
step15_help  = 아이스트랩(AD)은 전방으로 얼음검을 여러개 생성하는 스킬입니다. 공격키(D)를 오래 누르면 얼음검의 범위가 점점 넓어지고, 얼리는 부위가 점차 넓어져 빙결상태로 만듭니다.

step16_title = 마검사 - 라이트소드 / 망토스킬(AS)
step16_help  = 라이트소드(AS)는 마법진을 조종하여 빛의 검을 떨어트리는 스킬입니다. 빛의 검에 일정 횟수 이상 피격되면 상대의 중력을 약하게 만들고 높이 띄워 날려버릴 수 있습니다.

step17_title = 마검사 - 국민콤보 ①
step17_help  = ★기본공격 후 암흑(D)으로 대상을 스턴 후 → 아이스트랩(AD →D오래누름)으로 대상을 빙결 후 → 파이어토네이도(ASD)로 마무리 합니다.

step18_title = 마검사 - 국민콤보 ②
step18_help  = ★매직슈팅의 빙결(D오래누름 + S)로 얼린 후 → 다크볼(SD)로 대상을 다운 시킨 후 → 라이트소드(AS)로 마무리 합니다.

step19_title = 마검사 - 국민콤보 ③
step19_help  = ★점프공격 후 빙결(S)으로 띄움 →매직슈팅의 빛(A)으로 대상을 띄운 후 →파이어토네이도(ASD)로 대상을 다운 시킨 후 → 다크볼(SD)로 마무리 합니다.


[Set143]

max_step = 20

step0_title  = 나타 - 기본소개
step0_help  = 나타는 불교의 호법신으로 풍화륜을 이용하여 상대 주위를 돌며, 건곤권과 화첨창을 이용하여 상대를 제압하는 근거리 용병입니다.

step1_title  = 나타 - 기본공격 (D → D → D → D)
step1_help  = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 나타 - 화첨창(D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 전방으로 빠르게 이동해 대상을 공격합니다. 특별 게이지가 노란색일 때만 사용이 가능하며, 사용할 때마다 게이지가 소모됩니다.

step3_title  = 나타 - 화첨창 사용방법 ①
step3_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 화첨창은 대기, 걷기, 점프, 대시 중에도 공격키(D) 오래누름으로 사용이 가능합니다.

step4_title  = 나타 - 화첨창 사용방법 ②
step4_help   = 화첨창 사용 후 공격키 (D)를 누르면 추가 공격이 가능합니다. 최대 2연속 타격을 할 수 있으며 2번째 타격은 대상을 스턴 시키고, 자신은 점프 상태로 전환됩니다.

step5_title  = 나타 - 풍화륜 (A키 오래누름)
step5_help = 점프키(A)를 오래 누르고 있으면 풍화륜 상태로 전환이 됩니다. 방향키를 입력시 바라보는 방향을 유지한 상태로 빠른 이동을 합니다.

step6_title  = 나타 - 풍화륜 사용방법 ①
step6_help = 대기, 걷기, 대시, 점프 중 점프키(A)를 오래 누르고 있으면 풍화륜 상태가 되며 점프키(A)키로 해제가 가능하며, 사용할 때마다 게이지가 소모됩니다.

step7_title  = 나타 - 풍화륜 사용방법 ②
step7_help   = 풍화륜 상태 중 상대가 범위 안에 있을 경우 공격을 한 후 상대 주위를 돕니다. 공중의 상대는 속박하고, 지상의 상대는 약경직 시킵니다. 방어키(S)로 타겟 변경이 가능합니다.

step8_title  = 나타 - 풍화륜 사용방법 ③
step8_help   = 상대 주위를 돌고 있는 중 공격키(D)를 누르면 상대에게 건곤권을 날리는 공격을 합니다. 공중과 누워있는 상대는 속박하고, 지상의 상대는 자신쪽으로 끌어당깁니다.

step9_title = 나타 - 풍화륜 사용방법 ④
step9_help   = 상대 주위를 돌고 있는 중 공격키(D)를 오래 누르면 상대에게 날아가 화첨창 공격을 합니다. 공격키(D)키로 추가 공격이 가능하며, 이후 점프 상태로 전환됩니다.

step10_title  = 나타 - 대시공격 (->-> → D + D )
step10_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 치는 공격을 합니다. 추가 공격키로 추가 공격이 가능합니다.

step11_title  = 나타 - 점프공격 (A → D + D)
step11_help = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중 공격을 합니다. 2연속 타격을 할 수 있고 마지막 타격은 대상을 바닥에 내려찍습니다.

step12_title  = 나타 - 반격 (방어 성공시 바로 공격)
step12_help = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step13_title = 나타 - 적룡신화 / 무기스킬(SD)
step13_help = 적룡신화(SD)는 화염의 불길로 영역을 지배한 후, 적룡을 소환하여 상대를 공격하는 스킬입니다. 대상을 적룡과 함께 하늘로 높이 띄웁니다.

step14_title = 나타 - 화염무쌍 / 갑옷스킬(ASD)
step14_help = 화염무쌍(ASD)는 풍화륜을 타고 다니면서 화첨창으로 상대를 공격하는 스킬입니다. A키를 누르면 고도가 상승하며 서서히 하강이 됩니다.

step15_title = 나타 - 호법신 / 투구스킬(AD)
step15_help = 호법신(AD)는 일정 시간 동안 공격력을 증가시키고 타격에 성공하면 대상을 화염 효과로 기립지연 시키는 스킬입니다.

step16_title = 나타 - 혼천릉 / 망토스킬(AS)
step16_help = 혼천릉(AS)은 전방으로 비단띠를 던져 대상을 묶어 끌어오는 스킬입니다. 비단띠에 묶인 대상은 일정시간 동안 속박되며 누워있는 대상 공격이 가능합니다.

step17_title = 나타 - 국민콤보 ①
step17_help  = ★화첨창(D 오래누름) 후 공격키(D) 2회 입력으로 대상을 스턴 시키고 → 점프공격(A → D + D)으로 대상을 바닥에 내려 찍은 후 → 적룡신화(SD)로 마무리 합니다.

step18_title = 나타 - 국민콤보 ②
step18_help  = ★풍화륜(A키 오래누름) 후 상대에게 접근하여 공격키 입력으로 상대를 끌어당긴 후 → 공격키(D) 오래 누름과 공격키 추가 입력으로 연타 후 → 점프공격으로 마무리 합니다.

step19_title = 나타 - 국민콤보 ③
step19_help  = ★화첨창(D 오래누름) 후 추가 공격키(D) 입력으로 대상을 스턴 시키고 → 풍화륜(A키 오래누름) 후 공격키(D) 오래누름과 추가 공격키(D) 입력으로 연타하여 마무리 합니다.



[Set144]

max_step = 19

step0_title  = 이순신 - 기본소개
step0_help   = 이순신은 기개로 피격도중에 상대를 공격하거나 상대의 방어를 파괴하여 상대를 제압하는 일반용병입니다.

step1_title  = 이순신 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 이순신 - 기개(D 누름떼기)
step2_help   = 공격키(D)를 누르고 있으면 기개를 모을 수 있고 공격키(D)를 떼면 게이지가 소모되고 기개가 발동됩니다. 게이지량에 따라 기개의 효과가 달라집니다.

step3_title  = 이순신 - 기개 사용방법 ①
step3_help   = 기개 게이지는 상대를 공격하거나, 상대에게 피격 당하거나, 방어했을때, 공격키를 오래 누르면 채울 수 있고 게이지량에 따라 기개의 효과가 달라집니다.

step4_title  = 이순신 - 기개 중 대시(D 누른 상태에서 ->->)
step4_help   = 공격키(D)를 누르고 있는 상태에서 방향키를 빠르게 두번 입력하면 현재 바라보는 방향을 유지한 상태에서 짧은 대시를 합니다.

step5_title  = 이순신 - 대시공격 (->-> → D + D + D )
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 공격합니다. 최대3회 타격이 가능합니다.

step6_title = 이순신 - 대시특별공격(->-> → D오래누름)
step6_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면 칼로 강하게 내려찍어 충격파를 발사할 수 있습니다.

step7_title = 이순신 - 점프공격 (A → D + D)
step7_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중 공격을 합니다. 2연속 타격을 할 수 있고 2연속 타격시 대상을 무릎꿇게 만들 수 있습니다.

step8_title = 이순신 - 점프특별공격 ( A →D오래누름)
step8_help  = 점프상태에서 공격키(D)키를 오래 누르고 있으면 강하게 바닥을 내려쳐 주변의 상대를 스턴시킬 수 있습니다. 다운된 대상도 타격할 수 있습니다.

step9_title  = 이순신 - 공중대시(점프 중 ->->)
step9_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 바닥을 내려쳐 충격파를 발생시킬 수 있습니다. 다운된 대상도 타격할 수 있습니다.

step10_title  = 이순신 - 반격 (방어 성공시 바로 공격)
step10_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step11_title = 이순신 - 반격중 기개 (방어 성공시 D 누름떼기)
step11_help  = 공격을 방어한 후 바로 공격키를 누름떼기하면 기개를 사용할 수 있습니다. 게이지량에 따라 기개의 효과가 달라지고 게이지를 소모합니다.

step12_title = 이순신 - 기백 / 무기스킬(SD)
step12_help  = 기백(SD)은 기백을 주변으로 발산하여 상대를 공격하는 스킬입니다. 공격키를 연타하여 충격파를 발사할 수 있습니다. 피격도중 사용이 가능합니다.

step13_title = 이순신 - 돌격거북선 / 갑옷스킬(ASD)
step13_help  = 돌격거북선(ASD)은 일정시간동안 자동으로 화포를 발사하는 거북선을 조종하는 스킬입니다. 방향키로 움직임을 조종할 수 있고, 상승 및 하강이 가능합니다.

step14_title = 이순신 - 돌격대 / 투구스킬(AD)
step14_help  = 돌격대(AD)는 일정 시간 동안 돌아다니며 상대를 공격하고 같은편의 이동속도와 공격력을 향상시켜주는 버프를 거는 수군을 소환하는 스킬입니다.

step15_title = 이순신 - 궁수진영 / 망토스킬(AS)
step15_help  = 궁수진영(AS)은 전방의 조준점으로 수군들과 함께 불화살을 발사하는 스킬입니다. 조준점은 방향키로 조종이 가능하며 자동으로 전진이동합니다.

step16_title = 이순신 - 국민콤보 ①
step16_help  = ★기개(D 누름떼기)  → 기백(SD) 기개(D 누름떼기)로 상대를 스턴시킨 후  → 기백(SD + D + D + D)으로 마무리 합니다.

step17_title = 이순신 - 국민콤보 ②
step17_help  = ★대시공격(->-> → D + D + D )으로 무릎꿇기 후 → 기본공격(D → D → D → D)으로 다운 후 → 대시특별공격(->-> → D오래누름)으로 마무리 합니다.

step18_title = 이순신 - 국민콤보 ③
step18_help  = ★대시특별공격(->-> → D오래누름)로 띄운 후 → 기본공격(D → D → D → D)으로 다운 후  → 돌격대(AD)로 공격 후 →기백(SD)으로 마무리 합니다.



[Set145]

max_step = 16

step0_title  = 에너지연구원 - 기본소개
step0_help   = 에너지연구원은 충전된 에너지를 이용하여 차징 에너지 포를 쏘거나, 에너지 포의 반동을 이용해 점프하며 상대를 제압하는 원거리 용병입니다.

step1_title  = 에너지연구원 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 에너지연구원 - 차징 에너지 포 (D 누름떼기)
step2_help   =공격키(D)를 오래 누르면 차징 에너지 포 공격이 발동 됩니다.공격키를 누르고 있는 동안 파워가 지속적으로 증가하여 대상을 공격시 매우 멀리 날려 버립니다.

step3_title  = 에너지연구원 - 차징 에너지 포 사용방법 ①
step3_help   = 차징 에너지 포는 단계별로 크기 및 공격력이 달라지며 게이지가 100일 경우에는 누워있는 대상 공격이 가능하며, 방어파괴 효과가 있습니다.

step4_title = 에너지연구원 - 전장이탈
step4_help  = 대시, 점프 중 공격키(D) 오래누르면 전장이탈이 발동됩니다. 전장이탈 사용시 특별 게이지가 충전되며 뒤로 쏘아지는 에너지 포는 누워있는 대상 공격이 가능합니다.

step5_title  = 에너지연구원 - 오버히트
step5_help   = 게이지가 100일 경우 자동으로 오버히트 상태가 됩니다. 오버히트 상태에서는 차징 에너지 포와 전장이탈 기능을 사용할 수 없으며, 타격시 기립지연의 효과가 있습니다.

step6_title  = 에너지연구원 - 대시공격 (->-> → D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 공격합니다. 최대2회 타격이 가능합니다.

step7_title = 에너지연구원 - 점프공격 (A → D + D)
step7_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중 공격을 합니다. 2연속 타격을 할 수 있고 마지막 타격은 대상을 바닥에 내려찍습니다.

step8_title  = 에너지연구원 - 튕겨내기 (공격 받는 순간 방어)
step8_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step9_title = 에너지연구원- 새틀라이트 차지 / 무기스킬(SD)
step9_help  = 새틀라이트 차지(SD)는 위성으로부터 차지 에너지를 받아 전방으로 에너지 포를 발사하는 스킬입니다. 방향키로 회전하며, 점프(A)/방어(S)키로 각도 조절이 가능합니다.

step10_title = 에너지연구원 - 열역학 제1법칙 / 갑옷스킬(ASD)
step10_help  = 열역학 제1법칙(ASD)은 자신 주위에 에너지 충격파를 생성하는 스킬입니다. D키-불, S키-전기, A키-얼음 D오래누름-물리 효과가 있습니다.

step11_title = 에너지연구원 - 분석 / 투구스킬(AD)
step11_help  = 분석(AD)은 1단계:전방위방어(S키입력), 2단계:속성 저항, 3단계:스킬 게이지 충전 버프를 걸어주는 스킬입니다. 단계는 게이지별로 33~65, 66~98, 99로 나누어 집니다.

step12_title = 에너지연구원 - 급속충전 / 망토스킬(AS)
step12_help  = 급속충전(AS)은 자신의 게이지를 일정량 충전하고 상대의 스킬 게이지를 일정량 소멸시키는 에너지 캡슐을 던지는 스킬입니다. 누워있는 대상 공격이 가능합니다.

step13_title = 에너지연구원 - 국민콤보 ①
step13_help  = ★전장이탈(대시 중 D오래누름)로 상대를 넉백 시킨 후 → 열역학 제1법칙(ASD) 사용 후 점프(A)키  입력으로 대상을 얼린 후 → 새틀라이트 차지(SD)로  마무리 합니다.

step14_title = 에너지연구원 - 국민콤보 ②
step14_help  = ★기본공격으로 상대를 넉백 시킨 뒤 → 급속충전(AS)으로 누워있는 대상을 기립 및 경직 시키고 → 열역학 제1법칙(ASD) 사용 후 공격(D)키  입력으로 마무리 합니다.

step15_title = 에너지연구원 - 국민콤보 ③
step15_help  = ★대시공격으로 상대를 강경직 시킨 뒤 → 차징 에너지 포(게이지 100)로 상대를 넉백 및 경직 시킨 뒤 → 새틀라이트 차지(SD)로  마무리 합니다.



[Set146]

max_step = 17

step0_title  = 블레이드 - 기본소개
step0_help   = 블레이드는 거대한 칼날을 타고 다니며 자유롭게 점프하거나 하강할 수 있으며 수리검을 여러개 발사하여 상대를 제압하는 레어 용병입니다.

step1_title  = 블레이드 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 블레이드 - 플라잉 블레이드 ①
step2_help   = 공격키(D)를 오래 누르면 일정시간동안 블레이드를 타고 날아다닐 수 있습니다. 게이지를 소모하며 A키로 점프 할 수 있고 S키로 하강하며 순간 속도가 빨라집니다.

step3_title  = 블레이드 - 플라잉 블레이드 ②
step3_help   = 플라잉 블레이드 상태에서 공격키를 누르면 작은 칼날을 발사 할 수 있고 일정 갯수 이상 발사하면 더 이상 칼날을 발사 할 수 없습니다.

step4_title  = 블레이드 - 대시공격 (->-> → D + D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 공격합니다. 최대2회 타격이 가능하며 대상을 띄웁니다.

step5_title  = 블레이드 - 대시특별공격(->-> → D오래누름)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면 대상을 올려치고 작은 칼날을 4연속 발사할 수 있습니다.

step6_title  = 블레이드 - 점프공격 (A → D + D + D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D) 를 누르면 공중 공격을 합니다. 3연속 타격을 할 수 있고 상대를 바운딩 시킵니다.

step7_title  = 블레이드 - 공중대시(점프 중 ->->)
step7_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 내려오면서 대상에게 발차기 공격을 합니다. 공중 대상 타격시 대상을 바운딩 시킬 수 있습니다.

step8_title  = 블레이드 - 점프특별공격 ( A →D오래누름)
step8_help   = 점프상태에서 공격키(D)키를 오래 누르고 있으면 플라잉 블레이드를 사용할 수 있고 게이지를 소모합니다. 점프하거나 하강시 상승,하강높이에 제한이 있습니다.

step9_title  = 블레이드 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step10_title  = 블레이드- 스플릿블레이드 / 무기스킬(SD)
step10_help   = 스플릿블레이드(SD)는 작은 칼날을 발사하는 거대 칼날을 조종하는 스킬입니다. 방향키로 방향을 조종할 수 있고 공격키(D)를 누르면 작은 칼날을 발사 할 수 있습니다.

step11_title = 블레이드 - 폭풍의 칼날 / 갑옷스킬(ASD)
step11_help  = 폭풍의 칼날(ASD)은 순간 이동을 하며 주위에 칼날 공격을 하는 스킬입니다. 공격키(D)를 누르면 칼날을 발사하고 방향키를 누른 방향으로 순간이동할 수 있습니다.

step12_title = 블레이드 - 표식 / 투구스킬(AD)
step12_help  = 표식(AD)은 상대에게 표식을 남긴 후 칼날 공격을 하는 스킬입니다. 공격키(D)를 누르면 상대에게 표식을 남기고 공격키를 오래누르면 표식된 상대에게 칼날을 발사합니다.

step13_title = 블레이드 - 레이크스톰 / 망토스킬(AS)
step13_help  = 레이크스톰(AS)은 자신에게 돌아오는 칼날을 순간이동하며 뿌리는 스킬입니다. 공격키(D)를 누르면 칼날을 뿌리고 방향키를 누른 방향으로 순간이동 합니다.

step14_title = 블레이드 - 국민콤보 ①
step14_help  = ★폭풍의 칼날(ASD) → 스플릿블레이드(SD)  폭풍의 칼날(ASD)로 대상을 무릎꿇게 시킨 후  → 스플릿블레이드(SD)로 마무리 합니다.

step15_title = 블레이드 - 국민콤보 ②
step15_help  = ★대시특별공격(->-> → D오래누름 ) 5연속타격으로 대상을 띄운 후 → 공중대시(점프 중 ->->)로 대상을 바운딩 후 → 스플릿블레이드(SD)로 마무리합니다.

step16_title = 블레이드 - 국민콤보 ③
step16_help  = ★대시공격 (->-> → D + D)으로 띄운 후 → 점프공격으로 대상을 바운딩 후 → 기본공격 (D → D → D)으로 띄운 후 →공중대시(점프 중 ->->)로 마무리합니다.



[Set147]

max_step = 17

step0_title  = 투우사 - 기본소개
step0_help   = 투우사는 물레타를 이용하여 상대를 흥분시켜 자신에게 달려들게 한 후에 검으로 찔러 상대를 제압하는 레어 용병입니다.

step1_title  = 투우사 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 투우사 - 물레타 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 물레타를 휘둘러 상대를 흥분 시킵니다. 자신 앞의 대상은 뒤로 보내고, 일정 범위 앞에 위치한 대상은 자신쪽으로 달려드게 만듭니다.

step3_title  = 투우사 - 물레타 사용방법 ①
step3_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 특별 공격은 대기, 걷기, 대시 중에 사용가능 하며, D오래누름 이후에는 일정시간 피격무시 상태가 됩니다.

step4_title  = 투우사 - 물레타 사용방법 ②
step4_help   = 특별 게이지는 물레타 사용시 1개가 소비되며, 용병 교체시에도 게이지는 유지됩니다. 황소의 중간에 위치한 대상에게는 효과가 발동되지 않습니다.

step5_title  = 투우사 - 물레타 사용방법 ③
step5_help   = D 오래누름 후에는 방향키로 이동이가능하며 일정시간 안에 공격키를 누를 경우 칼로 찌릅니다. 피격된 대상은 잠시동안 스턴에 걸리게 됩니다.

step6_title  = 투우사 - 대시공격 (->-> → D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 공격합니다. 최대2회 타격이 가능합니다.

step7_title  = 투우사 - 점프공격 (A → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 지상의 대상은 경직시키고 공중의 대상은 바닥에 내려찍습니다.

step8_title  = 투우사 - 공중 물레타 ( A →D오래누름)
step8_help   = 점프상태에서 공격키(D)키를 오래 누르고 있으면 물레타를 휘둘러 대상을 자신 뒤로 보내며 추가 공격키 입력으로 대상을 칼로 찌를 수 있습니다.

step9_title  = 투우사 - 반격 (방어 성공시 바로 공격)
step9_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step10_title  = 투우사 - 불파이트 / 무기스킬(SD)
step10_help   = 불파이트(SD)는 성난 투우들을 불러 상대를 공격하는 스킬입니다. 최후에 보내지는 투우들에 치인 대상은 흥분된 상태로 변하며, 누워있는 대상 공격이 가능합니다.

step11_title = 투우사 - 무르시엘라고!! / 갑옷스킬(ASD)
step11_help  = 무르시엘라고(ASD)는 전방으로 흥분한 황소를 보내 적들을 공격하는 스킬입니다. 황소에 치인 지상의 상대는 넉백되며, 누워있는 대상은 밟고 지나갑니다.

step12_title = 투우사 - 컴 온 베이비 / 투구스킬(AD)
step12_help  = 컴 온 베이비(AD)는 전방의 적들을 흥분시켜 자신에게 달려들도록 하는 스킬입니다. 흥분된 상대는 캐릭터를 관통하여 이동하며, 누워있는 대상 공격이 가능합니다.

step13_title = 투우사 - 마타도르 / 망토스킬(AS)
step13_help  = 마타도르(AS)는 전방으로 다수의 황소를 보내 적들을 공격하는 스킬입니다. 황소의 머리에 부딪친 상대는 황소와 함께 끌려가며, 누워있는 대상 공격이 가능합니다.

step14_title = 투우사 - 국민콤보 ①
step14_help  = ★기본공격 (D → D → D)으로 대상을 경직시킨 후 → 물레타(D 오래누름) 이후 공격키 입력으로 대상을 경직시킨 뒤 → 마타도르(AS)로 마무리 합니다.

step15_title = 투우사 - 국민콤보 ②
step15_help  = ★대시공격 (->-> → D + D)으로 지상의 대상을 무릎꿇기 시킨 후 → 기본공격으로 대상을 바운딩 시키고 → 불파이트(SD)로 마무리 합니다.

step16_title = 투우사 - 국민콤보 ③
step16_help  = ★대시공격 (->-> → D + D)으로 지상의 대상을 무릎꿇기 시킨 후 → 대시공격 (->-> → D + D)으로 대상을 바운딩 한 후 → 물레타(D 오래누름)로 마무리 합니다.



[Set148]

max_step = 18

step0_title  = 전우치 - 기본소개
step0_help   = 전우치는 상대에게 부적을 날려 추적술을 겁니다. 추적술에 걸린 상대의 뒤로 순간이동하면서 분신을 남기거나 추적부를 터트려 상대를 제압하는 일반 용병 입니다.

step1_title  = 전우치 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 전우치 - 추적술 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 추적부를 발사합니다. 추적부는 상대를 피격하지 않지만 상대가 방어해도 추적부에 닿으면 추적술에 걸릴 수 있고 게이지를 소모합니다.

step3_title  = 전우치 - 추적술 사용방법 ①
step3_help   = 특별 게이지는 걷기, 대기상태에서 충전됩니다. 추적술은 대기, 걷기, 기본공격 중에 사용가능 하며 주변에 추적술에 걸린 상대가 없어야 발동 됩니다.

step4_title  = 전우치 - 추적부폭파 (D 오래누름)
step4_help   = 주변에 추적술에 걸린 상대가 있을때 공격키(D)를 오래 누르면 추적부를 터트려 상대를 띄웁니다. 대기, 기본공격 중 가능하고 게이지를 소모하지 않습니다.

step5_title  = 전우치 - 추적회피술 (공격 중 S)
step5_help   = 주변에 추적술에 걸린 상대가 있을때 공격이나 점프,대시 도중 S를 누르면 분신을 남기고 상대의 뒤로 순간이동하고 총 3회 가능하며 게이지를 소모하지 않습니다.

step6_title  = 전우치 - 대시공격 (->-> → D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 공격합니다. 최대2회 타격이 가능합니다.

step7_title  = 전우치 - 대시특별공격(->-> → D오래누름)
step7_help   = 달리는 중에 공격키(D)를 오래 누르면 찌르기 공격으로 타격한 상대에게 추적부를 걸고 추가로 공격키(D)를 누르면 최대 3회 타격이 가능하고 게이지를 소모합니다.

step8_title  = 전우치 - 점프공격 (A → D + D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 2연속 타격을 할 수 있고 상대를 공중으로 띄울수 있습니다.

step9_title  = 전우치 - 공중특별공격 ( A →D오래누름)
step9_help   = 점프상태에서 공격키(D)키를 오래 누르면 대각선 아래로 봉을 길게 늘립니다. 타격한 상대에게 추적부를 걸며 최대 3회의 추가 타격이 가능하고 게이지를 소모합니다.

step10_title  = 전우치 - 반격 (방어 성공시 바로 공격)
step10_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step11_title  = 전우치 - 초전박살 / 무기스킬(SD)
step11_help   = 초전박살(SD)은 도술로 봉을 자유자재로 늘여 마구 휘두르는 스킬입니다. 공격키(D) 연타시 최대 5연속 추가 타격이 가능하고 추적술을 거는 부적을 발사할 수 있습니다.

step12_title = 전우치 - 선풍 / 갑옷스킬(ASD)
step12_help  = 선풍(ASD)은 바람을 다스려 회오리를 생성해 주변으로 발산하는 스킬입니다. 공격키(D)를 연타하면 최대 4연속 추가 타격이 가능하고 상대를 스턴시킬 수 있습니다.

step13_title = 전우치 - 물아일체 / 투구스킬(AD)
step13_help  = 물아일체(AD)는 암자 그림속으로 들어가 다른 곳으로 순간이동하는 스킬입니다.피격,공중,공중피격,다운중 사용이 가능하고 상태이상일때는 사용할 수 없습니다.

step14_title = 전우치 - 호접 / 망토스킬(AS)
step14_help  = 호접(AS)은 전방으로 봉을 거대하게 만들어 내려친 후 봉을 흰나비로 변하게 하는 스킬입니다. 흰나비에 피격시 일정시간 동안 중독상태가 됩니다.

step15_title = 전우치 - 국민콤보 ①
step15_help  = ★선풍(ASD) → 호접(AS) → 초전박살(SD) 선풍(ASD) 4연타로 상대를 스턴시킨 후 →호접(AS)으로 상대를 중독시키고  →초전박살(SD)로 마무리 합니다.

step16_title = 전우치 - 국민콤보 ②
step16_help  = ★대시특별공격(->-> → D오래누름 →  D + D)으로 무릎꿇기 시킨 후 → 기본공격으로 바운딩 후 바로 방어키(S)를 눌러 추적회피술 후 →초전박살(SD)로 마무리 합니다.

step17_title = 전우치 - 국민콤보 ③
step17_help  = ★대시공격 (->-> → D + D)으로 스턴 후 →기본공격으로 바운딩 후 -> 공중특별공격 ( A →D오래누름)으로 기립 후 추가타격으로 띄운 후 -> 초전박살(SD)로 마무리 합니다.



[Set149]

max_step = 14

step0_title  = 환마강시 - 기본소개
step0_help   = 죽음에 이른 이후 다시 태어난 환마강시는 강력한 손톱을 이용한 찌르기 공격과 빠른 이동을 통한 연타 공격으로 상대방을 제압하는 근거리 용병입니다.

step1_title  = 환마강시 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 환마강시 - 특별공격(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 환마강시를 중심으로 영역이 펼쳐지고 눌렀던 공격키(D)를 떼면 타게팅된 상대에게 광속으로 접근해서 연속찌르기 공격을 합니다.

step3_title  = 환마강시 - 특별공격 사용방법 ①
step3_help   = 특별 공격(D 오래누름)이후 연타(DDDD)를 누르면 연속으로 공격을 하며 연타 중 대시키(→→)입력으로 이동 후 추가 공격이 가능합니다.

step4_title  = 환마강시 - 특별공격 사용방법 ②
step4_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 특별공격은 대기, 걷기, 점프, 대시 중에도 공격키(D)오래누름으로 사용이 가능합니다.

step5_title  = 환마강시 - 대시공격 (->-> → D + D )
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 손톱으로 공격하고 땅으로 기를 발사합니다.

step6_title  = 환마강시 - 점프공격 - (A →D + D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 손톱으로 공격합니다. 이때 추가로 D키를 눌러 추가공격할 수 있습니다. 최대 3연타가 가능합니다.

step7_title  = 환마강시 - 사망마반 / 무기스킬(SD)
step7_help   = 사망마반(SD)는 근처의 적에게 순간이동하여 대상을 잡는 공격입니다. 대상을 잡은 후에는 자동으로 회전하며 전진하고 도중 D키를 입력하여 위로 높이 띄웁니다.

step8_title  = 환마강시 - 천강기운 / 갑옷스킬(ASD)
step8_help   = 천강기운(ASD)은 자신에게 강력한 버프를 걸어 신체를 강화하는 스킬입니다. 사용시 피격무시, 이동속도 증가, 방어시에도 데미지를 입히는 버프가 8초동안 적용됩니다.

step9_title  = 환마강시 - 흡수 / 투구스킬(AD)
step9_help   = 흡수(AD)는 대상을 잡아 깨물어 피를 흡수하는 스킬입니다. 다운 대상도 잡을 수 있으며, 피격 중에도 사용할 수 있는 유용한 스킬입니다.

step10_title = 환마강시 - 전기촉수 / 망토스킬(AS)
step10_help  = 전기촉수(AS)는 자신의 360도 방향으로 근접한 적에게 촉수를 날려 4연속 감전시키는 스킬입니다. 최대 6명까지 공격이 가능합니다.

step11_title = 환마강시 - 국민콤보 ①
step11_help  = ★기본공격 (D →D →D →D)→ 특별공격(D오래누름 +D) 기본 공격(D →D →D →D)으로 대상을 경직시킨 뒤 특별공격(D오래누름 + DDDD)으로 마무리 합니다.

step12_title = 환마강시 - 국민콤보 ②
step12_help  = ★대시공격 (->-> → D+D) → 점프특별공격 대시 공격 2회로 대상을 띄운 후 점프 특별공격(D오래)으로 마무리합니다.

step13_title = 환마강시 - 국민콤보 ③
step13_help  = ★특별공격(D오래+대시D) →점프공격 →사망마반(SD) 특별 공격이후 특별 대시 공격으로 대상을 띄우고 점프 3연타 공격을 한 후 사망마반(SD)로 마무리합니다.


[Set150]

max_step = 17

step0_title  = 화학병 - 기본소개
step0_help   = 화학병은 화학 가스를 뿌리며, 상대를 중독 시킨 후 서로 다른 두가지 독이 만나 화학효과를 일으켜 상대를 굳게 만드는 특징을 가진 용병 입니다.

step1_title  = 화학병 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 화학병 - 신경독(VX) (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 신경독을 전방에 뿌립니다. 신경독에 맞은 상대는 2번의 발작을 일으키지만 단, 방어가능 공격입니다.

step3_title  = 화학병 - 점프공격1 (A →D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 2연속 타격을 할 수 있고 독가스에 중독 시킵니다.

step4_title  = 화학병 - 점프공격2 (A → D오래)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 한바퀴 돌며 가스를 뿌리는 공격 후 독가스 살포 상태가 되어 착지 합니다.

step5_title  = 화학병 - 대시공격 (->-> → D + D+ D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 공격합니다. 최대3회 타격이 가능합니다.

step6_title  = 화학병 - 독가스(NM) 살포 (->-> D 오래누름)
step6_help   = 대시중 공격키를(D)를 오래 누르면 독가스를 살포하며 자동 전진 상태로 방향키를 이용해 방향전환과 점프가 가능하며 피격시 해제 됩니다.
               
step7_title  = 화학병 - 독가스(NM) 살포 (충돌)
step7_help   = 독가스 살포 시(->-> D 오래누름) 상대와 부딪치면 약경직 공격을 하고, 상대를 관통하여 지나가게 됩니다. 시간이 지나면 상태가 종료 됩니다.
      
step8_title  = 화학병 - 독가스(NM) 살포 상태 (A,S,D)
step8_help   = 독가스 살포 시(->-> D 오래누름) A키를 누르면 점프가 발동 되며 달리는 도중 공격키(D)키 입력시 자리에서 정지하게 됩니다.

step9_title  = 화학병 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step10_title  = 화학병 - 펄~펄~독이 내리네 / 무기스킬(SD)
step10_help   = 펄~펄~독이 내리네(SD)는 전방의 공중에 독구름을 생성하여 천천히 내려오면서 범위내에 있는 상대를 모두 굳게 만드는 기술 입니다.
                
step11_title  = 화학병 - 눈물 찍 콧물 찍 / 갑옷스킬(ASD)
step11_help   = 눈물 찍 콧물 찍(ASD)은 자신에 몸에 독가스를 분사하며 상대를 감염 시켜 당황시켜 버리는 기술입니다. 감염된 상대의 주변에 상대팀원도 전염 됩니다.

step12_title  = 화학병 - 끈적끈적 독구름 / 투구스킬(AD)
step12_help   = 끈적끈적 독구름(AD)은 전방에 조정이 가능한 독을 생성하여 닿은 모든 대상을 감염시켜 버리는 기술입니다. 감염 된 대상은 주기적으로 피격이 일어납니다.

step13_title  = 화학병 - 케미컬 / 망토스킬(AS)
step13_help   = 케미컬(AS)은 공격키(D)키 누르고 있으면 주변에 독액을 난사하여 이 독액에 닿은 대상은 서서히 굳게 만드는 기술입니다. 이동이 가능한 기술입니다.

step14_title = 화학병 - 국민콤보 ①
step14_help  = ★ 대시공격(3타)→기본공격(3타)→신경독(D오래누름) 대시공격(3타)로 상대를 경직 후 기본공격(3타)로 공격하여 신경독으로 마무리 합니다.
                 
step15_title = 화학병 - 국민콤보 ②
step15_help  = ★ 대시공격(3타) → 펄~펄~독이 내리네(SD) 사용 후  → 케미컬(AS)을 연속 사용하여 공격 후 → 대시공격(3타)로 마무리 합니다.
                  
step16_title = 화학병 - 국민콤보 ③
step16_help  = ★ 대시공격(3타)→신경독(D오래누름) 사용 후→눈물 찍 콧물 찍(ASD)을 연속 사용하여 공격 후→펄~펄~독이 내리네(SD)뿌리며 마무리 합니다.


[Set151]

max_step = 18

step0_title  = 체인매지션 - 기본소개
step0_help   = 체인매지션은 체인구를 조종하여 상대를 잡아 자신의 앞으로 데려오거나 높은 곳에서 떨어트리기, 드랍존에 드랍시켜 상대를 제압하는 레어 용병입니다.

step1_title  = 체인매지션 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 체인매지션 - 조준 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 마법진이 나타나 마법진을 조종할 수 있고 무기 스킬 게이지가 찹니다.  이때 S키를 누르면 마법진에서 무기스킬이 발동됩니다.

step3_title  = 체인매지션 - 체인구 ① (D 누름떼기) 
step3_help   = 조준상태에서 게이지가 존재할때 D키를 떼면 마법진에서 체인구가 나타납니다. 방향키로 방향 회전을 할 수 있고 A키를 누르면 상승, S키를 누르면 하강합니다.

step4_title  = 체인매지션 - 체인구 ②
step4_help   = 체인구를 조종하는 상태에서 D키를 누르면 체인을 발사해 상대를 체인구로 끌고가 가두고 D키를 오래 누르면 잡은 상대를 자신 앞으로 순간이동시킬 수 있습니다.

step5_title  = 체인매지션 - 점프공격1 (A →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 체인을 발사 합니다. 3연속 타격을 할 수 있고 체인에 맞은 상대는 띄움상태가 됩니다.

step6_title  = 체인매지션 - 점프공격2 (A → D오래)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 캐릭터 앞 지상에서 사슬이 튀어나와 상대를 띄우고 상대 타격시 재점핑 할 수 있습니다.

step7_title  = 체인매지션 - 이중점프 (A 두번 누름)
step7_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step8_title  = 체인매지션 - 대시공격1 (->->)
step8_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 체인을 발사하고 일정거리 전진이동 할 수 있습니다. 2연속 사용이 가능합니다.

step9_title  = 체인매지션 - 대시공격2 (->-> →D )
step9_help   = 방향키를 빠르게 두 번 눌러 체인을 발사하고 전진이동하는 대시공격 중 공격키(D)를 누르면 대상을 띄우는 공격을 할 수 있습니다.

step10_title  = 체인매지션 - 마법방어 (S 누름)
step10_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든 방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step11_title  = 체인매지션 - 체인바인드 / 무기스킬(SD)
step11_help   = 체인바인드(SD)는 마법진에서 체인이 마구 솟아올라 상대를 속박하는 스킬입니다. 스킬 발동 중 공격키(D)를 누르면 속박한 상대를 바운딩 시킬수 있습니다.

step12_title  = 체인매지션 - 속박의사슬 / 갑옷스킬(ASD)
step12_help   = 속박의사슬(ASD)은 주변 대상을 사슬로 묶어 데려온 후, 속박 공격을 하는 스킬 입니다. 스킬 발동 후 공격키(D)를 누르면 속박 공격이 발동됩니다.

step13_title  = 체인매지션 - 체인홀딩 / 투구스킬(AD)
step13_help   = 체인홀딩(AD)은 체인 구를 조종해 주변 대상을 사슬로 묶어 데려오는 스킬 입니다. 방향키로 방향을 조종하고 A키는 상승, S키는 하강,D키는 체인을 발사합니다.

step14_title  = 체인매지션 - 체인오브 / 망토스킬(AS)
step14_help   = 체인오브(AS)은 공격키(D)로 총 4개의 지점을 찍어 체인 오브의 경로를 정해 체인오브가 경로대로 움직이며 주변의 상대를 사슬로 묶어 데려오는 스킬입니다.

step15_title = 체인매지션 - 국민콤보 ①
step15_help  = ★ 기본공격(4타) → 체인바인드(SD + D ) 기본공격 (D → D → D → D)으로 상대를 다운 시킨 후 → 체인바인드(SD + D)로 바운딩시켜 마무리 합니다.

step16_title = 체인매지션 - 국민콤보 ②
step16_help  = ★대시공격2 (->-> →D ) → 체인바인드(SD) 대시 공격1을 2연속으로 맞춰 상대를 스턴시킨 후 →공격키(D)로 상대를 띄우고  →체인바인드(SD)로 마무리 합니다.

step17_title = 체인매지션 - 국민콤보 ③
step17_help  = ★ 체인구(D → D오래)로 대상을 자신 앞으로 순간 이동시킨 후 기본공격(4타)→로 띄운 후 →점프공격2(A →D오래)로 재점핑 후 →점프공격(3타)로 마무리 합니다.


[Set152]

max_step = 20

step0_title  = 빨간망토 - 기본소개
step0_help   = 빨간망토는 바구니,총,사과폭탄,칼 등의 다양한 무기를 사용하여 근거리 및 원거리에서 자유자재로 상대를 공격할 수 있는 특수 용병입니다.

step1_title  = 빨간망토 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 빨간망토 - 특별 사용방법
step2_help   = 공격키(D)를 오래 누르면 공격키를 누른 횟수에 따라 다양한 종류의 특별을 사용할 수 있습니다. 대시공격, 점프공격,기본 공격,딜레이 상태일때 사용할 수 있습니다.

step3_title  = 빨간망토 - 바구니 공격 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 바구니를 휘둘러 상대를 공격합니다. 대시 달리기, 딜레이 상태일때는 띄움 공격을 하고 공중에서 사용시 상대를 바운딩 시킬 수 있습니다.

step4_title  = 빨간망토 - 나이프 파이팅 (1D + D 오래누름) 
step4_help   = 기본,대시,점프 1타 후 D키를 오래 누르면 상대 뒤쪽으로 전진이동 한 후 상대 뒤쪽에서 칼로 공격합니다. 피격된 상대는 강경직 상태가 되어 쓰러집니다.

step5_title  = 빨간망토 - 사과폭탄 (2D + D 오래누름) 
step5_help   = 기본,대시,점프 2타 후 D키를 오래 누르면 뒤로 물러나며 사과폭탄을 전방으로 던져 상대를 공격합니다. 다운된 상대도 공격할 수 있고 상대를 띄웁니다.

step6_title  = 빨간망토 - 건 파이팅 (3D + D 오래누름)
step6_help   = 기본,대시,점프 3타 후 D키를 오래 누르면 뒤로 물러나며 전방으로 총을 여러발 발사합니다.  다운된 상대도 공격할 수 있고 상대를 넉백시키고 띄울수 있습니다.

step7_title  = 빨간망토 - 캔슬대시 (공격 중 + S)
step7_help   = 기본공격,점프공격,대시공격,특별사용 도중 방어키(S)를 누르면 공격을 끊고 방향키를 누른 방향으로 대각선 이동 후 점프상태가 됩니다.

step8_title  = 빨간망토 - 캔슬대시 게이지
step8_help   = 캔슬대시 게이지는 걷기,대시,대기상태에서 충전됩니다. 캔슬대시 사용시 게이지가 소모되고 게이지가 노란색일때 사용할 수 있습니다.

step9_title  = 빨간망토 - 점프공격1 (A →D + D + D+ D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 4연속 공격을 할 수 있고 마지막 타격시 상대를 바운딩 시킬 수 있습니다.

step10_title  = 빨간망토 - 이중점프 (A 두번 누름)
step10_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step11_title  = 빨간망토 - 공중대시(점프 중 ->->)
step11_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당 방향으로 이동하면서 바구니로 올려치는 공격을합니다. 공중대시 후 캔슬대시를 사용할 수 있습니다.

step12_title  = 빨간망토 - 대시공격1 (->-> →D + D + D+ D)
step12_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 공격합니다. 최대4회 타격이 가능합니다.

step13_title  = 빨간망토 - 다가오지마 / 무기스킬(SD)
step13_help   = 다가오지마(SD)는 주변 대상을 띄워 총으로 난사하는 스킬입니다.SD를 누르면 피격된 상대는 공중에 뜬 상태가 되고 공격키(D)를 연타하면 최대 10회 발사가 가능합니다.

step14_title  = 빨간망토 - 총 공격!! / 갑옷스킬(ASD)
step14_help   = 총 공격!!(ASD)은 회전하며 각종 무기로 주변을 공격하는 스킬입니다. 회전하면서 전진이동 하고 방향키로 방향을 조종할 수 있고 공격은 자동으로 발사됩니다.

step15_title  = 빨간망토 - 다시 한번 말해봐 / 투구스킬(AD)
step15_help   = 다시 한번 말해봐(AD)는 상대의 등 뒤로 돌아가 칼로 찌르는 스킬입니다. 상대가 공중에 있어도 스킬을 사용 할 수 있고 칼에 찔린 상대는 스턴상태로 만들 수 있습니다.

step16_title  = 빨간망토 - 늑대 인형 / 망토스킬(AS)
step16_help   = 늑대 인형(AS)은 주변에 늑대 인형을 뿌리는 스킬입니다 인형에 맞은 상대에게 표식이 나타 납니다. 이때 공격키(D)를 누르면 표식된 상대에게 총으로 공격합니다.

step17_title = 빨간망토 - 국민콤보 ①
step17_help  = ★바구니 공격 (D 오래누름) → 다가오지마(SD) 공중 바구니 공격 (A + D 오래누름)으로 바운딩 후 → 다가오지마(SD + 총 10연발)로 마무리합니다.

step18_title = 빨간망토 - 국민콤보 ②
step18_help  = ★바구니 공격 (D 오래누름)으로 상대를 띄운 후 → 캔슬 대시(S)로 공중이동으로 점프 후 → <- 방향키로 뒤로 회전 → 점프공격(A →D + D + D+ D)으로 마무리 합니다.

step19_title = 빨간망토 - 국민콤보 ③
step19_help  = ★기본공격(4타)로 바운딩 →점프공격(4타)→로 바운딩 →늑대 인형(AS)으로 기립시킨 후 →다시 한번말해봐(AD)로 스턴시킨 후  → 다가오지마(SD)로 마무리 합니다.


[Set153]

max_step = 18

step0_title  = 스트라이더 - 기본소개
step0_help   = 스트라이더는 S-빔소드에 반응하는 소형 기체를 자유 자재로 사용하고 공격도중 재빠르게 상대를 관통하며 전진이동해 상대를 제압하는 근거리 유니크 용병입니다.

step1_title  = 스트라이더 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 스트라이더 - 소형기체 사용방법 ①
step2_help   = 특별 게이지는 걷기, 대시, 대기상태에서 충전됩니다. 특별공격은 대기, 걷기, 점프 중 공격키(D)오래 누름으로 사용이 가능합니다.

step3_title  = 스트라이더 - 소형기체 사용방법 ②
step3_help   = 공격키(D)를 오래 누르면 전방을 내려치면서 소형 기체를 소환합니다. 주변에 상대가 없으면 기체 주변을 날아다니고 타겟팅한 상대를 자동으로 2연속 공격합니다.

step4_title  = 스트라이더 - 소형기체 사용방법 ③
step4_help   = 소형 기체는 특별 게이지를 일정량 소모하고 게이지가 0이 아닌 이상 계속 소형 기체를 소환할 수 있고 소형기체는 일정시간이 지나거나 상대를 공격하면 사라집니다.

step5_title  = 스트라이더 - 캔슬베기 (공격 중 + ->->)
step5_help   = 기본공격,점프공격,대시공격,특별사용 도중 대시키(->->)를 누르면 공격을 끊고 방향키를 누른 방향으로 관통 공격을 합니다. 지상은 그로기되고 공중대상은 바운딩 됩니다.

step6_title  = 스트라이더 - 점프공격 (A →D + D + D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 3연속 공격을 할 수 있고 마지막 타격시 상대를 무릎꿇게 시킬 수 있습니다.

step7_title  = 스트라이더 - 공중대시(점프 중 ->->)
step7_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 대각선 아래 방향으로 전진 이동하며 이때 공격키(D)를 누르면 게이지를 소모하고 대각선 방향으로 상승합니다.

step8_title  = 스트라이더 - 대시공격 (->-> →D + D + D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키를 누르면 대상을 공격합니다. 최대 3회 타격시 상대를 띄웁니다.

step9_title  = 스트라이더 - 하이퍼대시 (->-> →D 오래누름)
step9_help   = 달리거나 대시공격 중 공격키(D)를 오래 누르면 빠르게 이동 합니다. 공격키(D)를 누르면 타겟팅한 상대에게 소형 기체를 소환해 공격하고 사용하는동안 게이지를 소모합니다.

step10_title  = 스트라이더 - 반격 (방어 성공시 바로 공격)
step10_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step11_title  = 스트라이더 - 메가 아머리 / 무기스킬(SD)
step11_help   = 메가 아머리(SD)는 무기고를 뒤편 공중에 소환해 주변을 포격하는 스킬입니다. 무기고는 일정시간 동안 유지 되고 상대를 자동으로 타겟팅해 공격을 마구 퍼붓습니다.

step12_title  = 스트라이더 - 풀 버스트 캐논 / 갑옷스킬(ASD)
step12_help   = 풀 버스트 캐논(ASD)은 공중으로 올라가 레이저캐논을 발사하는 스킬입니다. 방향키로 레이저 방향을 조종할 수 있고 바닥에 드랍존을 생성해 상대를 드랍시킬 수 있습니다.

step13_title  = 스트라이더 - 호밍 이온 캐논 / 투구스킬(AD)
step13_help   = 호밍 이온 캐논(AD)는 적을 추격하여 위성으로 폭격하는 스킬입니다. 방향키로 조준점을 조종하고 공격키(D)를 누르면 공격합니다. 최대 3회 공격할 수 있습니다.

step14_title  = 스트라이더 - 에어 스트라이더 / 망토스킬(AS)
step14_help   = 에어 스트라이더(AS) 공중의 대상을 요격하는 소형기체를 소환하는 스킬입니다. 모든 맵을 일정시간 동안 돌아다니고 자동으로 공중의 상대를 공격합니다.

step15_title = 스트라이더 - 국민콤보 ①
step15_help  = ★호밍 이온 캐논(AD) → 에어 스트라이더(AS) 호밍이온캐논(AD)으로 대상을 연타해 띄운 후 → 에어 스트라이더(AS)로 마무리 합니다.

step16_title = 스트라이더 - 국민콤보 ②
step16_help  = ★에어 스트라이더(AS)로 소형 기체를 소환한 후 → 하이퍼대시 (->-> →D 오래누름)로 대상을 띄우는 공격 후 → 풀 버스트 캐논(ASD)으로 마무리 합니다.

step17_title = 스트라이더 - 국민콤보 ③
step17_help  = ★소형기체(D꾹)으로 대상을 바운딩 시킨 후 →기본타 3타 후 →캔슬베기 (공격 중 + ->->)로 대상을 바운딩 후 → 뒤돌아 기본타(3타) 후 →메가 아머리(SD)로 마무리 합니다.


[Set154]

max_step = 17

step0_title  = 네피림 - 기본소개
step0_help   = 네피림은 천상의 망치로 성역을 생성하여 상대를 나가지 못하도록 잡아 당기거나 성역을 폭발시켜 띄워올려서 상대를 제압하는 근거리 일반 용병입니다.

step1_title  = 네피림 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 네피림 - 성역 생성 (D 오래누름)
step2_help   = 생성된 성역이 없거나 성역 밖에서 공격키(D)를 오래 누르면 전방으로 망치를 발사합니다. 망치에 상대가 피격되거나 최대 거리까지 도달하면 성역이 생성됩니다.

step3_title  = 네피림 - 성역 이동 (A 오래누름)
step3_help   = 성역을 생성한 후 점프키(A)를 오래 누르면 생성된 성역으로 순간이동합니다. 이때, 성역 안에 있는 상대는 공중으로 띄워져 올라갑니다. 

step4_title  = 네피림 - 힘의 권능 (성역 안 D 오래누름)
step4_help   = 성역 안에서 공격키(D)를 오래 누르면 성역 안에 있는 모든 대상을 자신에게로 당겨옵니다. 누워있는 대상은 두번 당겨지게 되면 공중으로 띄워져 올라 옵니다.

step5_title  = 네피림 - 성역 폭발 (성역 안 A 오래누름)
step5_help   = 성역 안에서 점프키(A)를 오래 누르면 성역을 폭발시키면서 점프 상태로 전환됩니다. 폭발에 피격된 상대는 공중으로 높게 띄워집니다.

step6_title  = 네피림 - 점프공격 ① (A →D + D + D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 3연속 공격을 할 수 있고 마지막 타격시 상대를 바운딩 시킬 수 있습니다.

step7_title  = 네피림 - 점프공격 ② (A →D 오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 바닥을 내려치는 공격을 합니다. 서있는  대상은 공중으로 띄워져 올라 옵니다.

step8_title  = 네피림 - 대시공격 ① (->-> →D + D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키(D)를 누르면 대시공격을 합니다. 2연속 공격을 할 수 있습니다.

step9_title  = 네피림 - 대시공격 ② (->-> →D 오래누름)
step9_help   = 달리거나 대시공격 중 공격키(D)를 오래 누르면 빠르게 이동 합니다. 공격키(D)를 오래 누르면 상대를 뒤로 넘기는 공격을 할 수 있습니다.

step10_title  = 네피림 - 튕겨내기 (공격 받는 순간 방어)
step10_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step11_title  = 네피림 - 초신성 / 무기스킬(SD)
step11_help   = 초신성(SD)은 주변에 신성한 기운을 퍼트려서 상대를 공격하는 스킬입니다. 2회 확장이 가능하고 S키를 입력하면 범위 안의 상대를 자신에게 빨아들일 수 있습니다.

step12_title  = 네피림 - 거인의 망치 / 갑옷스킬(ASD)
step12_help   = 거인의 망치(ASD)는 5개의 망치를 소환하는 스킬입니다. 사용 후 공격키(D)를 누르면 망치가 발사되며, 피격시 폭발합니다. 늦게 사용 할수록 망치의 효과가 큽니다.

step13_title  = 네피림 - 축복 / 투구스킬(AD)
step13_help   = 축복(AD)은 대다수의 상태이상 효과를 해제하는 스킬입니다. 피격 중, 다운, 얼음상태에서도 사용이 가능합니다.

step14_title  = 네피림 - 반신의 권능 / 망토스킬(AS)
step14_help   = 반신의 권능(AS)은 상대를 주기적으로 빨아들이는 성역을 생성하는 스킬입니다. 범위 안에 들어온 상대를 시전자에게로 모이게 한 후 무릎을 꿇게 만듭니다.

step15_title = 네피림 - 국민콤보 ①
step15_help  = ★반신의 권능(AS)으로 대상을 빨아들인 후 → 초신성(SD)으로 연속 공격한 후 → 기본 공격으로 마무리 합니다.

step16_title = 네피림 - 국민콤보 ②
step16_help  = ★초신성(SD)으로 대상을 빨아들인 후 → 성역 생성(D 오래누름)을 한 다음 → 성역 폭발(성역 안 A 오래누름)로 마무리 합니다.

step17_title = 네피림 - 국민콤보 ③
step17_help  = ★기본공격(D + D + D)으로 대상을 경직 시킨 → 후 성역 생성(D꾹)을 한 다음 → 성역 이동(A꾹)으로 대상을 띄운 후 힘의 권능(성역 안 D꾹)으로 잡아당겨 기본공격으로 마무리 합니다.


[Set155]

max_step = 18


step0_title  = 파계승 - 기본소개
step0_help   = 파계승은 전설의 영약을 마셔서 공격력,방어력,이동 속도를 향상 시킬 수 있고 연속으로 영약을 마시면 수라 상태가 돼 마구 날뛰어 상대를 제압하는 레어 용병 입니다.

step1_title  = 파계승 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 파계승 - 전설의영약 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 영약을 마실 수 있습니다.영약을 마시는 동안 공격받으면 공격을 튕겨낼 수 있고 영약 게이지가 일정량 상승하고 공격력,방어력,이동속도가 증가합니다.

step3_title  = 파계승 - 수라상태
step3_help   = 영약 게이지를 최대치까지 채우면 수라상태가 됩니다. 공격력,방어력,이동속도가 상승하고 모든 공격과 상태이상에서 자신을 보호할 수 있습니다.

step4_title  = 파계승 - 휘돌기 (수라상태 D 오래누름)
step4_help   = 수라상태가 되었을때 공격키(D)를 오래 누르면 일정시간 동안 회전하면서 전진이동 합니다. 방향키로 조종 할수 있고 휘돌기 중 공격키(D)를 누르면 상대를 넉백시킵니다.

step5_title  = 파계승 - 후유증
step5_help   = 수라 상태가 끝나면 일정시간 동안 영약을 마시지 못하는 후유증 상태가 됩니다. 후유증 상태일때 공격키(D)를 오래 누르면 상대를 경직 시키는 공격을 할 수 있습니다.

step6_title  = 파계승 - 점프공격 (A →D + D )
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 2연속 공격을 할 수 있고 2회 연속 타격시 상대를 무릎꿇게 만들 수 있습니다.

step7_title  = 파계승 - 영약투척 (A →D 오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 약통을 던지고, 약통이 깨지면서 근처의 상대를 스턴시키는 공격을 할 수 있습니다.

step7_title  = 파계승 - 점프대시 (A →->->)
step7_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 대각선 아래 방향으로 착지하며 상대를 띄울 수 있습니다. 수라상태일때 착지하면서 공격키(D)를 오래 누르면 휘두르기 사용이 가능합니다.

step8_title  = 파계승 - 대시공격 (->-> →D + D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키(D)를 누르면 대시 공격을 합니다. 2연속 공격을 할 수 있습니다.

step9_title  = 파계승 - 관통찌르기 (->-> →D 오래누름)
step9_help   = 달리거나 대시공격 중 공격키(D)를 오래 누르면 상대를 관통하면서 공격해 경직 시킵니다. 수라상태일때 관통후 공격키(D)오래 누름시 최대 4연속 발동할 수 있습니다.

step10_title  = 파계승 - 반격 (공격 받는 순간 방어)
step10_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step11_title  = 파계승 - 과유불급 / 무기스킬(SD)
step11_help   = 과유불급(SD)은 영약을 마시고 약통을 깨트려 주변을 경직시키고 선장으로 연타 후 상대의 스킬게이지와 HP를 흡수 하고 방어키(S)를 누르면 주변의 상대를 넉백시킵니다.

step12_title  = 파계승 - 금강불괴 / 갑옷스킬(ASD)
step12_help   = 금강불괴(ASD)는 몸을 단단하게 만드는 스킬입니다. 금강불괴 상태일때 공격받으면 공격을 튕겨낼 수 있습니다. 피격중 사용이 가능합니다.

step13_title  = 파계승 - 반격 / 투구스킬(AD)
step13_help   = 반격(AD)은 상대에게 공격받으면 상대를 던져버리는 스킬입니다. 공격받으면 공격한 상대를 잡고 공격키(D)를 누르면 잡은 상대를 날립니다.피격중 사용이 가능합니다.

step14_title  = 파계승 - 고마해라..   / 망토스킬(AS)
step14_help   = 고마해라,마이 묵었다 아이가(AS)는 주변 상대를 도발 후 반격하는 스킬입니다. 점프키(A)는 넉백,방어키(S)는 띄움, 공격키(D)는 공격을 튕겨내고 피격중 사용이 가능합니다.

step15_title = 파계승 - 국민콤보 ①
step15_help  = ★고마해라.. (AS) → 과유불급(SD) →대시공격 ① 고마해라.. (AS)로 도발 →공격키(D)입력으로 튕겨내기 후 →과유불급(SD)으로 후 →대시공격으로 마무리 합니다.

step16_title = 파계승 - 국민콤보 ②
step16_help  = ★과유불급(SD) →점프공격 →기본공격 과유불급(SD)으로 대상을 흡수상태로 만든 후 →점프공격 2연속 타격으로무릎 꿇기 후 →기본공격으로 마무리합니다.

step17_title = 파계승 - 국민콤보 ③
step17_help  = ★수라상태 후 →휘돌기 (수라상태 D 오래누름)로 상대를 스턴 후 →대시공격으로 띄운 후 →점프 1타 후 →영약투척(A →D 오래누름)  →과유불급(SD)으로 마무리 합니다.


[Set156]

max_step = 15


step0_title  = 뮤턴트 - 기본소개
step0_help   = 뮤턴트는 거미줄을 이용하여 공중을 날아다니거나 거미줄을 상대에게 날려 고치를 만들어 제압하는 근거리 레어 용병입니다.

step1_title  = 뮤턴트 - 기본공격 (D → D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 뮤턴트 - 거미줄 ① (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 전방으로 거미줄을 발사합니다 거미줄에 상대가 피격되면 상대에게 거미줄이 연결되고 이때 거미줄을 한 번더 맞히면 상대가 고치로 변합니다.

step3_title  = 뮤턴트 - 거미줄 ②
step3_help   = 거미줄은 대기, 걷기, 점프, 대시 중에도 공격키(D)오래누름으로 사용이 가능합니다. 게이지를 소모하지 않습 니다.

step4_title  = 뮤턴트 - 거미줄 스윙 (A + S오래누름)
step4_help   = 공중 상태에서 방어키(S)를 오래 누르면 일정거리를 거미줄을 타고 이동합니다.게이지를 소모하고 이동중 상대와 충돌하면 띄우는 공격후 착지합니다.

step5_title  = 뮤턴트 - 점프공격 (A →D + D + D + D+ D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 5연타를 하는 점프 공격을 사용하고 마지막 타격은 거미줄을 발사해 상대와 거미줄로 연결시킵니다.

step6_title  = 뮤턴트 - 대시공격 (->-> →D + D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키(D)를 누르면 대시 공격을 합니다. 마지막 3번째 타격은 거미줄을 발사합니다.

step7_title  = 뮤턴트 - 반격 (공격 받는 순간 방어)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 5연타를 할 수 있고 첫 번째 타격시 상대를 고치로 만들며 마지막 타격은 상대를 띄울 수 있습니다.

step8_title  = 뮤턴트 - 스프레드웹 / 무기스킬(SD)
step8_help   = 스프레드웹(SD)은 전방에 거미줄을 날려 보내는 스킬입니다.피격된 상대를 자동으로 가까이 당겨지고 공격키(D)를 누르면 상대를 고치로 만들고 공중에서 사용 가능합니다.

step9_title  = 뮤턴트 - 멀티플렉스웹 / 갑옷스킬(ASD)
step9_help   = 멀티플렉스웹(ASD)은 전방에 거미줄을 여러개 날려보내는 스킬입니다. 상대 피격시 상대를 잡고 뒤로 넘길 수 있습니다. 공중에서 사용이 가능합니다.

step10_title  = 뮤턴트 - 스파이더웹 / 투구스킬(AD)
step10_help   = 스파이더웹(AD)은 거미줄 발사 후 거미줄을 타고 이동하는 스킬입니다. 거미줄을 따라 일정거리를 전진이동하며 상대 피격시 재점핑하고 상대를 띄우며 공중 사용이 가능합니다.

step11_title  = 뮤턴트 - 홀드웹   / 망토스킬(AS)
step11_help   = 홀드웹(AS)은 전방의 바닥에 거미줄을 만들어 범위내 상대를 고치로 만드는 스킬입니다. 다운된 상대를 기립시킬 수 있고 공중에서 사용이 가능합니다.

step12_title = 뮤턴트 - 국민콤보 ①
step12_help  = ★스파이더웹(AD) → 점프공격 스파이더웹(AD)으로 대상을 띄우고 점프상대가 된 후 → 점프 5연타로 마무리 합니다.

step13_title = 뮤턴트 - 국민콤보 ②
step13_help  = ★홀드웹(AS) →멀티플렉스웹(ASD) →스프레드웹(SD) 홀드웹(AS)으로 상대를 고치화한 후 → 멀티플렉스웹(ASD)으로 바운딩 후 →스프레드웹(SD + D)로 마무리 합니다.

step14_title = 뮤턴트 - 국민콤보 ③
step14_help  = ★스프레드웹(SD + D)로 고치화한 후 →기본공격3타로 띄움 후 →기본공격 4타로 다운 후 →거미줄(A+D오래누름) 후 →거미줄 스윙 (A + S오래누름)으로 마무리 합니다.


[Set157]

max_step = 20


step0_title  = 가네샤 - 기본소개
step0_help   = 가네샤는 코끼리를 소환하거나 코끼리 영혼의 다리로 공격할 수 있고, 커맨드를 사용하면 영혼의 팔로 상대를 공격해 제압하는 일반 용병입니다.

step1_title  = 가네샤 - 기본공격 (D → D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 가네샤 - 미니스텀프 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 전방을 코끼리 영혼의 발로 내려찍습니다. 두 번 이상 코끼리 발에 피격 되면 상대는 납짝해집니다.

step3_title  = 가네샤 - 커맨드 게이지
step3_help   = 게이지는 서있거나 걸어다닐때 회복되며 커맨드 사용시 소모됩니다. 게이지가 없으면 커맨드가 발동되지 않습니다.

step4_title  = 가네샤 - 커맨드 기능 ①
step4_help   = 기본공격, 대시공격, 특별공격, 점프공격착지, 커맨드 공격 중에 지정된 방향키를 연속으로 입력하면 커맨드 공격을 즉시 발동 시킬 수 있습니다.

step5_title  = 가네샤 - 커맨드 기능 ②
step5_help   = 커맨드에 사용되는 방향키는 상하좌우(↑↓←→) 4개이며 캐릭터 방향과 관계 없이 입력키 그대로 적용하여 커맨드 기능을 발동 시킵니다.

step6_title = 가네샤 - 영혼의 일격 (↓ ←)
step6_help  = 영혼의 팔이 나타나 상대를 경직시킵니다. 상대의 방어를 파괴합니다. 최대 2연속 발동이 가능하며 영혼의 날림과 번갈아 가며 사용할 수 있습니다.

step7_title = 가네샤 - 영혼의 날림 (↓→)
step7_help  = 영혼의 팔이 상대를 올려쳐 띄웁니다. 다운된 상대를 공격 할 수 있고 최대 2연속 발동이 가능하며 영혼의 일격과 번갈아 가며 사용할 수 있습니다.

step8_title  = 가네샤 - 점프공격 (A →D + D )
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 2연타를 하는 점프 공격을 사용하고 공중의 상대를 바운딩 시킬 수 있습니다.

step9_title  = 가네샤 - 점프 대시 공격 (A → ->->)
step9_help   = 점프중에 방향키를 빠르게 2번 입력하면 지상으로 내려가며 칼을 2회전 시킵니다. 2연속 타격시 상대를 무릎꿇기 시킬 수 있습니다.

step10_title  = 가네샤 - 점프스텀프 (A →D 오래누름)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 영혼의 발이 나타나 땅을 내려쳐 범위내 상대를 공중으로 띄울 수 있습니다.

step11_title  = 가네샤 - 대시공격 (->-> →D )
step11_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중 공격키(D)를 누르면 2번 연속 칼을 휘두르는 공격으로 상대를 띄웁니다.

step12_title  = 가네샤 - 회전타 (->-> →D 오래누름)
step12_help   = 빠른 달리기 도중이나 대시 공격 후 공격키(D)를 오래 누르면 3연속 회전하며 구르는 공격을 합니다. 상대 타격시 공중으로 자동점핑 할 수 있습니다.

step13_title  = 가네샤 - 풋스텀프 / 무기스킬(SD)
step13_help   = 풋스텀프(SD)는 상아검으로 상대를 마구 난타한 후 코끼리 영혼으로 땅을 강하게 내려쳐 충격파를 발생시키는 스킬입니다.

step14_title  = 가네샤 - 블래싱 / 갑옷스킬(ASD)
step14_help   = 블래싱(ASD)은 코끼리 영혼의 축복을 받아 일정시간 동안 공격력,이동속도,공격무시,낙하 및 드랍데미지,아이템 드랍 보호 버프가 걸립니다.

step15_title  = 가네샤 - 러싱엘리펀트 / 투구스킬(AD)
step15_help   = 러싱엘리펀트(AD)는 분노하여 돌진하는 코끼리를 소환하는 스킬입니다. 코끼리는 피격된 상대를 잡고 이동한 후 날려버립니다. 지형과 충돌시 상대를 스턴시킵니다.

step16_title  = 가네샤 - 엘리펀트로어   / 망토스킬(AS)
step16_help   = 엘리펀트로어(AS)는 코끼리가 공중에서 나타나 지형을 강타한 후 포효하는 스킬입니다. 포효는 일정시간 동안 지속되고 포효가 끝나고 포효에 걸렸던 상대는 스턴됩니다.

step17_title = 가네샤 - 국민콤보 ①
step17_help  = ★엘리펀트로어(AS) → 러싱엘리펀트(AD) 엘리펀트로어(AS)로 상대를 스턴시킨 후 → 러싱엘리펀트(AD)로 마무리 합니다.

step18_title = 가네샤 - 국민콤보 ②
step18_help  = ★대시공격 (->-> →D )으로 상대를 띄운 후 → 회전타 (D 오래누름)로 상대를 띄운 후 → 점프 대시 공격(->->)으로 마무리합니다.

step19_title = 가네샤 - 국민콤보 ③
step19_help  = ★점프스텀프 (A →D 오래누름)로 상대 띄운 후 → 점프 공격(A →D + D )으로 다운 후 →영혼의날림(↓→)으로 띄운 후 →기본공격 4연타로 마무리 합니다.


[Set158]

max_step = 17


step0_title  = 미르의전설2 전사 - 기본소개
step0_help   = 미르의전설2 전사는 대검을 이용한 무사로 파동을 날린 뒤에 전방으로 돌격하여 상대를 잡고 내려쳐 제압하는 근거리 프리미엄 용병입니다.

step1_title  = 미르의전설2 전사 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 미르의전설2 전사 - 검의파동 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 전방으로 검의 파동을 발사합니다. 파동에 피격된 대상은 기절 상태가 됩니다.

step3_title  = 미르의전설2 전사 - 돌진 (검의파동 후 → ->->)
step3_help   = 검의파동 후 가려는 방향으로 방향키를 빠르게 두 번 입력하면 전방으로 돌진하는 공격을 합니다. 공격에 잡힌 대상은 밀고나가 날려버립니다.

step4_title  = 미르의전설2 전사 - 특별 게이지
step4_help   = 게이지는 서있거나 걸어다닐때 회복되며 특별 사용시 소모됩니다. 게이지가 없으면 특별이 발동되지 않습니다.

step5_title  = 미르의전설2 전사 - 점프공격 (A →D + D )
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 2연타를 하는 점프 공격을 사용하고 공중의 상대를 바운딩 시킬 수 있습니다.

step6_title  = 미르의전설2 전사 - 점프 검의파동 (A →D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 대각선 아래로 검의파동 공격을 하며, 돌진 공격이 가능합니다.

step7_title  = 미르의전설2 전사 - 대시공격 (->-> →D + D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키며 추가공격 성공시 대상을 띄울 수 있습니다.

step8_title  = 미르의전설2 전사 - 대시 돌진 (->-> →D 오래누름)
step8_help   = 빠른 달리기 도중이나 대시 공격 후 공격키(D)를 오래 누르면 전방으로 돌진 공격을 합니다. 공격에 잡힌 대상을 밀고 나가 날려버립니다.

step9_title  = 미르의전설2 전사 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step10_title  = 미르의전설2 전사 - 공파섬 / 무기스킬(SD)
step10_help   = 공파섬(SD)는 전방으로 검의 파동을 날린 후 기를 모아서 기를 모은 만큼 많은 충격파를 발사하는 스킬입니다.

step11_title  = 미르의전설2 전사 - 비급 - 금강불괴 / 갑옷스킬(ASD)
step11_help   = 비급 - 금강불괴(ASD)는 자신의 주변으로 용의 기운을 퍼트린뒤에 자신을 피격무시 상태로 만들어 줍니다. 방어파괴 공격은 막을수 없습니다.

step12_title  = 미르의전설2 전사 - 비급 - 사자후 / 투구스킬(AD)
step12_help   = 비급 - 사자후(AD)는 몸속의 기운을 모아 공포에 떠는 고함을 질러 주변의 대상을 이동불가 상태로 만듭니다. 사자후는 다운 대상을 기립시키는 공격을 합니다.

step13_title  = 미르의전설2 전사 - 포승검   / 망토스킬(AS)
step13_help   = 포승검(AS)는 전방으로 검을 발사하며, 발사 된 검에 맞은 대상은 일정시간 잡혀 있으며, 추가 공격키(D) 입력시 자신의 앞으로 피격된 대상을 끌어 모읍니다.

step14_title = 미르의전설2 전사 - 국민콤보 ①
step14_help  = ★포승검(AS) → 공파섬(SD) 포승검(AS)으로 전방의 상대를 끌어온 뒤 → 공파섬(SD) 으로 마무리 합니다.

step15_title = 미르의전설2 전사 - 국민콤보 ②
step15_help  = ★검의파동(D 오래누름)으로 상대를 기절시킨 후 → 돌진 (검의파동 후 → ->->) 공격하여 상대를 밀어낸뒤 → 포승검(AS)으로 마무리 합니다.

step16_title = 미르의전설2 전사 - 국민콤보 ③
step16_help  = ★비급 - 사자후(AD)로 상태를 기절시킨 후 → 기본공격(D → D → D ) 후 → 포승검(AS)으로 끌어온 뒤 → 공파섬(SD)으로 마무리 합니다.


[Set159]

max_step = 18

step0_title  = 쿠훌린 - 기본소개
step0_help   = 쿠훌린은 맞으면 빛의 가시가 돋아나는 게볼그를 던지고 영혼의상처를 남깁니다. 영혼의상처를 여러번 남기고 상처를 터트려 상대를 제압하는 일반 용병입니다.

step1_title  = 쿠훌린 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 쿠훌린 - 영혼의상처 ① (D 누름떼기)
step2_help   = 기본,대시,점프 도중 사용이 가능합니다. 기본,대시 도중 공격키 누름떼기시 사용이 가능하며, 공중 사용시 방어키(S)를 누르면 게이지를 소모하고 사용합니다.

step3_title  = 쿠훌린 - 영혼의상처 ② (D 누름떼기)
step3_help   = 공격키(D)를 살짝 눌렀다 떼면 타겟팅된 상대에게 게볼그를 발사합니다. 상처는 최대 3번 누적시킬 수 있고 날아가는 도중 다른 상대가 감지되면 그 상대에게 날아갑니다.

step4_title  = 쿠훌린 - 상처터트리기 ① (D 오래누름)
step4_help   = 기본,대시,점프 도중 공격키를 오래누르면 주변 범위내에 존재하는 영혼의 상처 버프를 터트립니다. 버프가 누적된 횟수에 따라 경직, 띄움, 스턴 시키며 출혈에 걸리게 합니다.

step5_title  = 쿠훌린 - 회피 (공격중 S)
step5_help   = 기본, 대시 공격 도중 방어키(S)를 누르면 게이지를 소모하고 창을 바닥에 짚어 공중으로 점프하며 회피할 수 있습니다. 회피시 상대에게 피격되지 않습니다.

step6_title  = 쿠훌린 - 상처 게이지
step6_help   = 게이지는 서있거나 걸어다닐때 빠른 달리기 상태일때 회복됩니다. 회피, 공중 영혼의 상처 사용시 소모됩니다.

step7_title  = 쿠훌린 - 점프공격 (A →D + D + D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 3연타를 하는 점프 공격을 사용하고 마지막타 타격시 상대를 바운딩 시키고 공중으로 재점핑 합니다.

step8_title  = 쿠훌린 - 공중 영혼의상처 ② (A + S)
step8_help   = 점프 상태에서 방어키(S)를 누르면 공중에서 게볼그를 발사하여 타격한 상대에게 영혼의 상처를 걸 수 있습니다. 상대 타격시 공중으로 재점핑 할 수 있습니다.

step9_title  = 쿠훌린 - 대시공격 (->-> →D + D + D+ D)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직 시키며 추가공격 성공시 대상을 띄울 수 있습니다.

step10_title  = 쿠훌린 - 반격 (방어 성공시 바로 공격)
step10_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다. 뒤로 점프하여 게볼그를 발사하고 공중으로 재점핑 됩니다.

step11_title = 쿠훌린 - 쟈벨린 / 무기스킬(SD)
step11_help  = 쟈벨린(SD)은 게볼그를 휘두르고 상대를 찔러 잡고 던지는 스킬입니다. 공격키(D)를 누르면 전방으로 멀리 던지고 방어키(S)를 누르면 창을 위쪽으로 던져 떨어트립니다.

step12_title = 쿠훌린 - 스플릿스피어 / 갑옷스킬(ASD)
step12_help  = 스플릿스피어(ASD)는 여러개의 작은 창으로 분열하는 게볼그를 소환합니다. 공격키(D)를 누르면 즉시 폭파할 수 있고, 공중에서 사용이 가능합니다.

step13_title = 쿠훌린 - 스피어샤워 / 투구스킬(AD)
step13_help  = 스피어샤워(AD)는 여러개의 창을 발사하는 스킬입니다. 공격키(D)를 누르고 있으면 일정시간 마다 창이 하나씩 생성이 되고 공격키(D)를 떼면 생성된 창들이 발사됩니다.

step14_title = 쿠훌린 - 파이어링   / 망토스킬(AS)
step14_help  = 파이어링(AS)은 발걸기 공격으로 상대를 띄우고,공격키(D)를 누르면 창을 위로 발사하는 스킬입니다. 창에 피격되면 잡혀서 위로 높이 올라가고 다운,피격중 사용가능합니다.

step15_title = 쿠훌린 - 국민콤보 ①
step15_help  = ★쟈벨린(SD) → 파이어링(AS) →스피어샤워(AD) 쟈벨린(SD)으로 상대를 스턴시킨 후 →파이어링(AS + D)으로 낙하 후  →스피어샤워(AD)로 마무리 합니다.

step16_title = 쿠훌린 - 국민콤보 ②
step16_help  = ★쟈벨린(SD) →점프공격 →스플릿스피어(ASD) 쟈벨린(SD)으로 스턴 후 →점프공격 (A →D + D + D)으로 바운딩 후 →스플릿스피어(ASD)로 마무리 합니다.

step17_title = 쿠훌린 - 국민콤보 ③
step17_help  = ★공중 영혼의상처(A + S + S + S)로 상대를 3스택 상태로 만들고 →상처터트리기(D 오래누름)→기본공격으로 상대를다운 시킨 후 →쟈벨린(SD + S )으로 마무리 합니다.


[Set160]

max_step = 23

step0_title  = 갈포드 - 기본소개
step0_help   = 갈포드는 사무라이 쇼다운의 캐릭터로써 닌자 인술과 닌자견 퍼피를 이용하여 대상을 제압하는 프리미엄 용병입니다.

step1_title  = 갈포드 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 갈포드 - 전기발사 (D 오래누름)
step2_help   = 전방으로 전기를 발사합니다. 전기는 일정시간 동안 날아가고 상대를 감전시킵니다. 일정횟수 이상 전기에 맞으면 저항이 생기고 게이지를 소모하지 않습니다.

step3_title  = 갈포드 - 커맨드 게이지
step3_help   = 게이지는 서있거나 걸어다닐때, 빠른 달리기 상태일때 회복되고 커맨드 사용시 게이지를 소모합니다.

step4_title  = 갈포드 - 점프공격 (A →D )
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 경직 시키는 공격을 합니다.

step5_title  = 갈포드 - 점프공격 (A →D 오래누름)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 바닥을 내려찍는 공격을 합니다. 다운된 상대를 공격할 수 있습니다.

step6_title  = 갈포드 - 대시공격 (->-> →D + D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직 시키며 3연타 성공시 대상을 띄울 수 있습니다.

step7_title  = 갈포드 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다. 최대 15번 연속 타격을 할 수 있고 공격 방어 후 점프키(A)를 누르면 상대 위로 순간이동해 반격합니다.

step8_title = 갈포드 - 러쉬 독 (↓→)
step8_help  = 전방에 퍼피를 보내 달려가게 합니다. 퍼피는 상대에게 몸통 박치기로 경직시키고 되돌아 옵니다.

step9_title = 갈포드 - 머신건 독 (↓←)
step9_help  = 전방에 퍼피를 보내 달려가게 합니다. 퍼피는 상대를 물고 움직이지 못하게 일정시간 동안 잡고 있다가 되돌아 옵니다

step10_title = 갈포드 - 레프리카 독 (↓↓)
step10_help  = 주변에 있는 가까운 상대의 머리위에서 퍼피가 떨어져 상대를 경직시킵니다.

step11_title = 갈포드 - 오버 헤드 크러쉬 (↓←↑)
step11_help  = 대각선 뒤쪽으로 뛰어오른 후 퍼피가 회전하며 전방으로 날아가 몸통 박치기를해 상대를 바운딩 시킵니다.

step12_title = 갈포드 - 쉐도우 카피(앞) (→→)
step12_help  = 뒤에 분신을 만듭니다. 분신을 만들고 움직이거나 피격시 분신이 사라집니다. 움직이지 않으면 일정시간 동안 분신이 유지됩니다.

step13_title = 갈포드 - 쉐도우 카피(뒤) (←←)
step13_help  = 앞에 분신을 만듭니다. 분신을 만들고 움직이거나 피격시 분신이 사라집니다. 움직이지 않으면 일정시간 동안 분신이 유지됩니다.

step14_title = 갈포드 - 레프리카 어택 (↑↑)
step14_help  = 전방에 있는 상대의 머리위에 나타나 착지하면서 상대를 약경직 시킵니다.

step15_title = 갈포드 - 스트라이크 헤즈 (→↓←→)
step15_help  = 전방의 대상을 잡고 위로 올라갔다가 내려오면서 내려찍으며 전기 공격으로 상대를 바운딩 시킵니다.

step16_title = 갈포드 - 더블 메가 스크라이크 헤즈 / 무기스킬(SD)
step16_help  = 더블 메가 스트라이크 헤즈(SD)는 상대 앞,뒤에 분신을 만들어 연속 공격 후 전기를 내뿜어 경직시키고 상대를 잡고 올라갔다 내려오면서 상대를 바운딩 시킵니다.

step17_title = 갈포드 - 라이트닝 스트라이크 쓰리 / 갑옷스킬(ASD)
step17_help  = 라이트닝 스트라이크 쓰리(ASD)는 전방으로 돌진해 상대를 잡고 공중으로 올라간 후 전기로 연속 공격 후 상대를 바운딩 시킵니다.

step18_title = 갈포드 - 플라즈마 브레이크 / 투구스킬(AD)
step18_help  = 플라즈마 브레이크(AD)는 주변에 전기를 뿜어내 상대를 감전 시킵니다. 다운,공중 피격 중 사용 가능합니다

step19_title = 갈포드 - 플라즈마독   / 망토스킬(AS)
step19_help  = 플라즈마독(AS)은 퍼피를 보내 상대를 잡고 공중으로 올라갔다가 내려찍으며 전기 공격을 합니다.

step20_title = 갈포드 - 국민콤보 ①
step20_help  = ★라이트닝 스트라이크 쓰리(ASD)로 바운딩 시킨 후 → 더블 메가 스트라이크 헤즈(SD)로 바운딩 시킨 후 → 플라즈마독(AS)으로 마무리 합니다.

step21_title = 갈포드 - 국민콤보 ②
step21_help  = ★전기발사(D오래누름)으로 경직 후 →머신건 독(↓←)으로 붙잡고 → 더블 메가 스트라이크 헤즈(SD)로 마무리 합니다.

step22_title = 갈포드 - 국민콤보 ③
step22_help  = ★기본공격(1D)+머신건 독 (↓←)으로 붙잡고 기본공격(1D)+쉐도우 카피(뒤) (←←)으로 상대 앞에 나타난 후 라이트닝 스트...(ASD)로 마무리 합니다.


[Set161]

max_step = 20

step0_title  = 태도귀무사 - 기본소개
step0_help   = 귀무사는 대만 공모전 용병으로 오니로 변신하여 추가 타격을 하거나 혼령 상태로 달려들어 상대를 제압하는 용병입니다.

step1_title  = 태도귀무사 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 태도귀무사 - 혼령 (D 오래누름)
step2_help   = 게이지를 소모하고 일정시간 동안 자동으로 전진이동 합니다. 전진이동 중 상대를 관통할 수 있고 A키를 누르면 즉시 점프 하고 D키를 누르면 올려치기 공격을 합니다.

step3_title  = 태도귀무사 - 점프공격1 (A →D →D →D )
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 1,2번째 점프 공격 도중 점프 대시가 가능하며 3번째 공격 성공시 상대를 높이 띄을 수 있습니다.

step4_title  = 태도귀무사 - 점프공격2 (A →D 오래누름)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 x자 베기로 상대를 띄우는 공격을 하고 상대 타격시 재점핑 할 수 있습니다.

step5_title  = 태도귀무사 - 점프대시 (A →->->)
step5_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 직선 이동을 하면서 3연타 공격을 합니다.

step6_title  = 태도귀무사 - 대시공격1 (->-> →D + D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직 시키며 3연타시 대상을 스턴시킬수 있습니다.

step7_title  = 태도귀무사 - 대시공격2 (->-> →D 오래누름)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 오래 누르면 연속베기하고 전진이동하며 대상을 스턴 시킵니다.

step8_title = 태도귀무사 - 오니 (D 오래누름)
step8_help  = 게이지가 100이됐을때 공격키를 오래 누르면 오니로 변신 합니다.이동속도가 빨라지고 공격에 추가 타격이 생기고 특별 사용,타격성공시 게이지가 소모됩니다.

step9_title = 태도귀무사 - 오니상태
step9_help  = 오니 상태에서는 고스트ON 과 메가 고스트ON만 사용할 수 있으며 오니상태에서 기본공격,특별,점프 공격,대시공격 사용시 게이지는 소모됩니다.

step10_title  = 태도귀무사 - 오니상태 혼령 (D 오래누름)
step10_help   = 게이지를 소모하고 일정시간 동안 자동으로 전진이동 합니다.전진이동 중 드랍존을 이동할 수 있으며 올려베기로 타격시 점프 후 공격키를 누르면 바운딩 시킵니다.

step11_title = 태도귀무사 - 오니 상태 중 점프공격1(A → D+D+D)
step11_help  = 점프상태에서 공격키(D)를 누르면 대상을 경직시키는 공격을 하고 바로 1,2번째 점프 공격 도중 점프 대시가 가능 하고 3번째 타격시 상대를 바운딩 시킵니다.

step12_title = 태도귀무사 - 고스트ON / 무기스킬(SD)
step12_help  = 고스트ON(SD)는 검풍으로 주변을 타격 후 D키를 연타해 상대를 스턴시킬 수 있습니다. 방향을 조종할 수 있고 D키를 오래 누르면 귀신을 발사합니다.

step13_title = 태도귀무사 - 메가 고스트ON / 무기스킬(SD)
step13_help  = 고스트ON(SD)은 검풍으로 주변을 타격 후 D키로 최대 9연타할 수 있습니다. D키를 오래 눌러 귀신을 발사해 상대 피격시 속도를 느리게 하고 대시를 할 수 없게 만듭니다.

step14_title = 태도귀무사 - 귀로 / 갑옷스킬(ASD)
step14_help  = 귀로(ASD)는 금귀와 은귀를 소환하여 주변으로 다가오는 상대를 공격하게 합니다. 금귀와 은귀에게 공격당하면 캐릭터 주변으로 순간이동됩니다.

step15_title = 태도귀무사 - 귀반 / 투구스킬(AD)
step15_help  = 귀반(AD)은 은귀와 금귀의 힘으로 자신을 보호합니다. 일정시간동안 공격을 반사하며 상대에게 반사시 랜덤하게 디버프를 겁니다.

step16_title = 태도귀무사 - 귀도 / 망토스킬(AS)
step16_help  = 귀도(AS)는 아이템 드랍에서 보호하고 공격력,방어력이 증가되고 드랍 데미지, 낙하 데미지가 감소되며 피격시 스킬 게이지가 감소됩니다.

step17_title = 태도귀무사 - 국민콤보 ①
step17_help  = ★대시공격2 (->-> →D 오래누름) → 고스트ON(SD) 대시공격2 (->-> →D 오래누름)로 스턴 후 → 고스트ON(SD+4D)로 마무리 합니다.

step18_title = 태도귀무사 - 국민콤보 ②
step18_help  = ★점프공격2 (A →D 오래누름)로 상대를 띄운 후 → 점프공격1 (A →D →D)2타 후 →점프대시 (A →->->)로 마무리 합니다.

step19_title = 태도귀무사 - 국민콤보 ③
step19_help  = ★오니 상태 혼령 (D 오래누름 +D+D)로 상대를 바운딩 후  →기본공격(4D)로 띄운 후 →점프공격2(A →D 오래누름)으로 재점핑 후 → 점프공격1(3D)로 마무리 합니다.


[Set162]

max_step = 28

step0_title  = 드루이드 - 기본소개
step0_help   = 드루이드는 자연의 힘을 이용해 나무를 소환하거나 곰 독수리로 변신하여 상대를 제압하는 레어용병입니다.

step1_title  = 드루이드 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 드루이드 - 특별공격 (D 누름떼기)
step2_help   = 공격키(D)를 눌렀다가 떼면 땅을 타고 가는 나무줄기를 발사합니다. 상대가 피격되는 경우 나무줄기는 솟아 올라 상대를 띄워지게 합니다.

step3_title  = 드루이드 - 점프공격1 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키를 누르면 지상으로 솔방울을 던지는 공격이 가능합니다. 상대에 맞출경우 재점핑 할 수 있습니다.

step4_title  = 드루이드 - 점프공격2 (A →D 누름떼기)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 눌렀다 떼면, 지상에서 솟아나는 나무줄기를 발사합니다.

step5_title  = 드루이드 - 대시공격1 (->-> → D + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 약경직 시키며 2연타시 대상을 경직시킬수 있습니다.

step6_title  = 드루이드 - 대시공격2 (->-> → D 누름떼기)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 눌렀다떼면 전진하는 나무줄기를 소환하여 상대를 띄웁니다.

step7_title  = 드루이드 - 곰 변신 (D 오래누름)
step7_help   = 게이지가 노란색일때 공격키를 오래 누르면 곰으로 변신 하면서 상대를 잡는 곰의 특별공격이 발생합니다. 유지시간중에 공격키를 누르면 상대를 잡아서 던집니다.

step8_title  = 드루이드 - 곰 변신 (->-> → D 오래누름)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 오래누르면 곰으로 변신하여 상대를 띄우는 공격을 합니다.

step9_title  = 드루이드 - 독수리 변신 (A → D 오래누름)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키를 오래 누르면 독수리로 변신하여 상대를 바운딩시키는 공격을 합니다.

step10_title = 드루이드 - 곰 상태
step10_help  = 곰 상태에서는 기존의 모든 공격방식이 변경되며, 특별 공격 사용 시 게이지를 소모하게 됩니다. 상대에게 피격시 일정 게이지가 차감됩니다.

step11_title = 드루이드 - 곰 특별공격(D 오래누름)
step11_help  = 공격키(D)를 오래누르면 전방의 상대를 잡는 공격을 합니다. 유지시간동안 상대는 HP가 줄어들고 드루이드는 공격키를 누르면 상대를 던지는 공격을 합니다.

step12_title = 드루이드 - 곰 기본공격 (D → D → D)
step12_help  = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step13_title = 드루이드 - 곰 점프공격 (A → D)
step13_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키를 누르면 앞 발을 휘둘러 상대를 내려치는 공격을 합니다.

step14_title = 드루이드 - 곰 대시공격1 (->-> → D)
step14_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 크게 밀어내는 공격을 합니다.

step15_title = 드루이드 - 곰 대시공격2 (->-> → D오래누름)
step15_help  = 달리는 중에 공격키를 누른 상태를 유지하면 웅크리기 자세가 되며, 느린 이동속도로 이동할 수 있습니다. 공격키를 떼면 전진하면서 상대를 띄우는 공격을 합니다.

step16_title = 드루이드 - 인간 전환(->->)
step16_help  = 방향키를 빠르게 두 번 눌렀다 떼면 인간으로 전환되며 인간 상태의 대시 공격이 발동됩니다.

step17_title = 드루이드 - 곰에서 독수리 변신 (A → D 오래누름)
step17_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키를 오래 누르면 독수리로 변신하여 상대를 바운딩시키는 공격을 합니다.

step18_title = 드루이드 - 독수리 상태
step18_help  = 독수리 상태에서는 비행상태가 되며 자동으로 이동됩니다 공격키를 누르면 조준점이 있는 공격을 공격하며, A키는 상승, S키는 하강합니다. 시간당 게이지가 차감됩니다.

step19_title = 드루이드 - 독수리에서 인간 전환(->->)
step19_help  = 방향키를 빠르게 두 번 눌렀다 떼면 인간으로 전환되며  인간 상태의 점프 공격이 발동됩니다.

step20_title = 드루이드 - 독수리에서 곰 전환(D 오래누름)
step20_help  = 공격키를 오래누르면 곰 상태로 전환되며, 곰의 점프 공격이 발동됩니다.

step21_title = 드루이드 - 숲속의 친구들 / 무기스킬(SD)
step21_help  = 숲속의 친구들(SD)은 곰과 독수리를 소환하여 자동으로 상대를 찾아 공격하는 스킬입니다. 일정공격 횟수만큼 타격하거나 유지시간이 지나면 종료됩니다.

step22_title = 드루이드 - 수계타격 / 갑옷스킬(ASD)
step22_help  = 수계타격(ASD)은 거대한 나무를 솟아나게 하여 상대를 공격하는 스킬입니다. 최대 3회까지 사용 가능합니다.

step23_title = 드루이드 - 화분진 / 투구스킬(AD)
step23_help  = 화분진(AD)은 영역을 지정하여 아군을 보호할 수 있는 지역을 생성하는 스킬입니다. 지역안에 있는 동안 자신과 아군은 무적상태가 됩니다.

step24_title = 드루이드 - 자연의 속삭임 / 망토스킬(AS)
step24_help  = 자연의 속삭임(AS)은 지역을 생성하여 자신과 아군을 투명하게 만들고, 상대는 느려지게 만드는 디버프를 거는 스킬입니다. 피격중에도 사용 가능합니다.

step25_title = 드루이드 - 국민콤보 ①
step25_help  = ★곰 특별공격(D 오래누름) → 공격키로 띄움 → 곰 점프공격(A → D) → 곰 기본공격(D + D + D)로 마무리 합니다.

step26_title = 드루이드 - 국민콤보 ②
step26_help  = ★곰 대시공격1(->-> → D) → 곰 대시공격2(->-> → D오래누름) → 곰 점프공격(A → D) → 곰 기본공격(D + D + D)으로 마무리 합니다.

step27_title = 드루이드 - 국민콤보 ③
step27_help  = ★인간 점프공격 3회(A → D + D + D) → 독수리 변신 (A → D오래누름) → 독수리 기본공격(D) → 곰 변신(D 오래누름) → 곰 기본공격(D + D + D)


[Set163]

max_step = 26

step0_title  = 사신무 진 - 기본소개
step0_help   = 사신무 진은 사신무의 무공에 해당하는 청룡,백호, 주작,현무를 이용 하여 상대를 제압하는 근거리 유니크 용병 입니다.

step1_title  = 사신무 진 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 사신무 진 - 사신무 - 비(備) (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 준비동작이 발동됩니다. 사신무 - 비(備) 상태에서는 방향키를 입력하면, 이동이 가능합니다.

step3_title  = 사신무 진 - 사신무 - 출(出) (D 누름 중 → 떼기)
step3_help   = 사신무 - 비(備)상태 중 D 오래누름 키를 떼면, 앞방향으로 전진 하며, 일격을 가합니다.

step4_title  = 사신무 진 - 사신무 - 연격(聯擊) (출(出)이후 자동)
step4_help   = 사신무 - 출(出) 이후 전진방향 그대로 7번의 칠연격의 공격을 합니다. 또한 타격중 방향 전환이 가능하며,대시 이동이 가능합니다.

step5_title  = 사신무 진 - 사신무 - 호(虎) (연격 중 ASD)
step5_help   = 사신무 - 연격(聯擊) 중 ASD키 입력시 백호의 힘으로 전방의 대상을 할큅니다. 방어 파괴가 가능하며 이 후 연격을 처음부터 합니다.

step6_title  = 사신무 진 - 사신무 - 용(龍) (연격 중 D)
step6_help   = 사신무 - 연격(聯擊) 중 D키 입력시 청룡의 힘으로 전방의 대상을 내려칩니다. 기립공격이 가능하며 이 후 연격을 처음부터 합니다.

step7_title  = 사신무 진 - 사신무 - 무(武) (연격 중 S)
step7_help   = 사신무 - 연격(聯擊) 중 S키 입력시 현무의 힘으로 자신에게 일정시간 무적효과를 부여합니다. 이 후 연격을 처음부터 합니다.

step8_title  = 사신무 진 - 사신무 - 작(雀) (연격 중 A)
step8_help   = 사신무 - 연격(聯擊) 중 A키 입력시 주작의 힘으로 전방 대각선으로 비상합니다. 이 후 연격 상태가 종료 되며, 점프상태로 전환됩니다.

step9_title  = 사신무 진 - 점프공격 (A → D → D → D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상에게 발로 차는 점프 공격을 합니다. 점프상태에서 3번까지 공격이 가능합니다.

step10_title  = 사신무 진 - 사신무 출(出) (A → ->->)
step10_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 내려오면서 대상에게 할퀴기 공격을 합니다.

step11_title  = 사신무 진 - 사신무 - 용(龍)  (A →D 오래누름)
step11_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 하강하면서 청룡으로 대상을 내려치는 공격을 합니다. 다운대상도 타격이 가능합니다.
                                                                                            
step12_title  = 사신무 진 - 사신무 - 연격(聯擊) (사신무-용(龍) + D)
step12_help   = 사신무-용(龍)공격 이 후 공격키(D)를 누르면 사신무 - 연격(聯擊)으로 연결됩니다. 연결되는 사신무 다른 공격도 가능 합니다.

step13_title  = 사신무 진 - 대시공격 (->-> → D)
step13_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 띄워 올리는 공격을 합니다.

step14_title  = 사신무 진 - 대시 확장공격 (->-> D →D )
step14_help   = 방향키를 빠르게 두 번 누르고 유지해서 달리기가 발동되는 도중에 공격키(D)를 두번 누르면 대상을 공중에 띄우는 강력한 공격을 합니다.

step15_title  = 사신무 진 - 사신무 - 작(雀) (->-> →D 오래누름)
step15_help   = 대시 상태에서 공격키(D)를 오래 누르면 주작의 힘으로 전방 대각선으로 비상합니다. 이 후 연격상태가 종료되며, 점프상태로 전환됩니다.

step16_title  = 사신무 - 튕겨내기 (공격 받는 순간 방어)
step16_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step17_title  = 사신무 - 무(武) (튕겨내기 → D)
step17_help   = 사신무는 튕겨내기 이 후 상태에서 현무의 힘으로 피격된 대상은 방어가 불가능 합니다.

step18_title  = 사신무 - 극성(極成)
step18_help   = 무공 게이지를 최대치까지 채우면 극성상태가 됩니다. 상대의 일반 공격을 무시하게 되고 연격(聯擊)공격이 빨라지게 됩니다.

step19_title  = 사신무 - 주화입마(走火入魔)
step19_help   = 극성(極成)상태가 끝나면 일정시간 동안 연격(聯擊)을 사용하지 못하는 주화입마 상태가 됩니다.

step20_title  = 사신무 진 - 백호의포효 / 무기스킬(SD)
step20_help   = 백호의포효(SD)는 포효하여 주변에 대상을 끌어 모은 뒤 백호의 일격을 날리는 기술입니다. 다운 상태시 사용이 가능합니다.

step21_title  = 사신무 진 - 뇌룡출두 / 갑옷스킬(ASD)
step21_help   = 뇌룡출두(ASD)는 청룡을 타고 다니며, 다니는 경로에 뇌운을 뿌리고 다니는 기술입니다. 추가 공격키 입력시 종료 됩니다.
               
step22_title  = 사신무 진 - 주작의 각 / 투구스킬(AD)
step22_help   = 주작의 각(AD)은 해당 위치에 상대를 끌어 모아 주작의 힘으로 날려버리는 스킬입니다. 총 3회 공격후 스킬이 종료 됩니다.

step23_title  = 사신무 진 - 현무의 기운 / 망토스킬(AS)
step23_help   = 현무의 기운(AS)은 현무의 힘으로 자신에게 속성 저항과 방어력 증가를 걸어주는 스킬입니다. 또한 피격시 띄움 높이도 감소 합니다.

step24_title = 사신무 진 - 국민콤보 ①
step24_help  = ★백호의 포효(SD) → 주작의 각(AD) 백호의 포효(SD)로 상대를 끌어 모은뒤 → 주각의 각(AD)으로 상대를 날려버립니다.

step25_title = 사신무 진 - 국민콤보 ②
step25_help  = ★뇌룡출두(ASD)로 상대를 끌고 간뒤에 → 백호의 포효(SD)로 상대를 끌어 모은 후  → 주작의 각(AD)으로 상대를 날려 마무리 합니다.


[Set164]

max_step = 18

step0_title  = 다크시즈 - 기본소개
step0_help   = 다크시즈는 포스를 발사해 가까이 다가오는 상대를 공중에 띄워서 잡고있거나 다크라이트닝으로 상대를 감전시켜 제압하는 레어 용병입니다.

step1_title  = 다크시즈 - 기본공격 (D → D → D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 다크시즈 - 포스 홀딩 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 영역 내로 가까이 다가오는 상대에게 포스를 발사해 잡고 지속적으로 게이지가 소모됩니다. 방향키를 누른 방향으로 이동할 수 있습니다.

step3_title  = 다크시즈 - 포스 쓰루(D 누름떼기)
step3_help   = 공격키(D)를 떼면 잡고 있던 상대를 캐릭터가 바라보는 방향으로 날립니다. 공격키(D)를 유지한 시간에 따라 상대가 날아가는 거리가 달라지고 게이지를 소모합니다.

step4_title  = 다크시즈 - 포스 스매쉬(D누름 유지 + A)
step4_help   = 공격키(D)를 누르고 있을때 점프키(A)를 누르면 잡고있던 상대를 바닥으로 내려쳐 바운딩 시키고 공중으로 점핑 합니다. 게이지를 추가로 소모합니다.

step5_title  = 다크시즈 - 점프공격 (A → D → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 경직시키고 마지막 타격시 상대를 바운딩 시킵니다.

step6_title = 다크시즈 - 점프대시 (A → ->-> + D → D → D )
step6_help  = 점프한 상태에서 방향키를 두번 빠르게 누르면 다크라이트닝 포스 발사 뒤 해당 방향으로 착지 후 공격키(D)를 누르면 추가 타격이 가능하고 마지막 타격시 스턴시킵니다.

step7_title = 다크시즈 - 다크쇼크  (A →D 오래누름)
step7_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 지상에 착지하면서 주변 영역에 다크라이트닝 포스를 발산하여 상대를 경직 시킵니다.

step8_title = 다크시즈 - 대시공격1 (->-> → D →D →D )
step8_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 상대를 경직 시키고 마지막 타격시 바운딩 시킬 수 있습니다.

step9_title = 다크시즈 - 대시공격2 (->-> →D 오래누름)
step9_help  = 대시 상태에서 공격키(D)를 오래 누르면 전진이동하며 찌르기 공격을 하며 이때 공격키(D)를 누르면 최대2회 추가 공격을 할 수 있고 마지막 타격시 상대를 넉백시킵니다.

step10_title = 다크시즈 - 반격 (공격 받는 순간 방어)
step10_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 뒤로 물러나면서 포스를 발사합니다. 포스에 피격된 상대는 캐릭터 앞으로 끌려옵니다.

step11_title = 다크시즈 - 다크라이트닝 / 무기스킬(SD)
step11_help  = 다크라이트닝(SD)은 다크라이트닝 포스로 주변을 감전시키고 감전된 상대를 잡는 스킬입니다.이때 D키를 누르면 넉백, S키를 누르면 당기고, A키를 누르면 높이 띄웁니다.

step12_title = 다크시즈 - 언리미티드파워 / 갑옷스킬(ASD)
step12_help  = 언리미티드파워(ASD)는 공중으로 올라가 조준점으로 다크 라이트닝 포스를 발사합니다. 방향키로 조준을 조종하고 D키 누름시 경직,S키 누름시 폭파,A키 누름시 공중발사
               
step13_title = 다크시즈 - 포스의 힘으로... / 투구스킬(AD)
step13_help  = 포스의 힘으로(AD)는 조준 된 상대에게 어둠의 포스로 공격하는 스킬입니다. D키 입력시 상대를 공격하고 정 조준 공격시 추가 공격을 할 수 있습니다.

step14_title = 다크시즈 - 광선검 / 망토스킬(AS)
step14_help  = 광선검(AS)은 포스로 광선검을 조종하여 상대를 공격하는 스킬 입니다.방향키로 방향을 조종하고 A키 입력시 상승, s키 입력시 하강, D키 입력시 감속하며 공격할 수 있습니다.

step15_title = 다크시즈 - 국민콤보 ①
step15_help  = ★점프대시(A → ->-> + D → D → D ) →다크라이트닝(SD) 점프 대시로 감전 시킨 후 →추가 3타로 스턴 시킨 후 → 다크라이트닝(SD + D)으로 날려 마무리 합니다.

step16_title = 다크시즈 - 국민콤보 ②
step16_help  = ★포스 스매쉬(D누름 유지 + A)로 상대를 바운딩 후 → 점프공격으로 상대를 바운딩 후  →다크라이트닝(SD)으로 감전 →추가 D키 공격으로 날려 마무리 합니다.

step17_title = 다크시즈 - 국민콤보 ③
step17_help  = ★다크라이트닝(SD + A)로 상대를 띄운 후 →포스 스매쉬 (D누름유지 + A)로 바운딩 후 →점프공격2타 후 →기본 공격3타 후 →포스 쓰루(D 누름떼기)로 마무리 합니다.


[Set165]

max_step = 24

step0_title  = 프레데터 - 기본소개
step0_help   = 프레데터는 빔건을 통해 연사공격을 하거나 전함의 지원공격을 받아 상대를 제압하는 레어용병입니다.

step1_title  = 프레데터 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 프레데터 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며 사정거리 내 대상을 자동으로 조준해 줍니다. 가까운 대상을 우선적으로 조준하게 됩니다.

step3_title  = 프레데터 - 조준 (D 누름유지)
step3_help   = 조준 상태에서 방향키를 통해 이동할 수 있으며, 조준된 대상이 있으면 대상을 바라보는 상태로 고정되어 움직이게 됩니다. S, A키를 누르면 해제됩니다.

step4_title  = 프레데터 - 레이져 발사 (D 누름떼기)
step4_help   = 공격키(D)를 떼면 빔건에서 상대를 관통하는 레이져를 발사합니다. 피격된 상대는 잠시동안 스턴상태가 되며 이후 추가 특별 공격을 사용할 수 있습니다. 

step5_title  = 프레데터 - 연사 (D 누름떼기→D→D→D→D→D)
step5_help   = 레이져 발사 후 공격키(D)를 누르면 조준된 상대를 향해 레이져를 발사합니다. 조준된 상대의 움직임을 계속 추격합니다. 최대 5번까지 가능합니다.

step6_title  = 프레데터 - 콜 대시 (D 누름떼기 → ->->)
step6_help   = 레이져 발사 후 방향키를 두번 빠르게 누르면 입력한 방향으로 전진공격하는 콜 대시가 발동됩니다. 연사중에도 사용이 가능합니다.

step7_title  = 프레데터 - 플라즈마 캐논 (D 누름떼기 → D오래누름)
step7_help   = 레이져 발사 후 다시 공격키(D)를 오래 누르면 조준점이 있는 위치로 전함에서 상대의 방어를 무시하는 플라즈마 캐논이 떨어집니다. 연사중에도 사용이 가능합니다.

step8_title  = 프레데터 - 점프공격 (A → D → D → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상에게 발로 차는 점프 공격을 합니다. 점프상태에서 3번까지 공격이 가능합니다.

step9_title  = 프레데터 - 점프 조준 (A → D 누름유지)
step9_help   = 점프한 상태에서 공격키(D)를 오래 누르면 조준할 수 있는 상태가 됩니다. 방향 전환이 가능하며, 다운된 상대도 조준이 가능하며, 일정시간이 지나면 해제됩니다.

step10_title = 프레데터 - 점프 레이져 발사 (A → D 누름떼기)
step10_help  = 공격키(D)를 떼면 빔건에서 상대를 관통하는 레이져를 발사합니다. 피격된 상대는 공중으로 띄워지게 되며 이후 추가 특별 공격을 사용할 수 있습니다. 

step11_title = 프레데터 - 점프 연사 (A→D 누름떼기→D→D→D→D→D)
step11_help  = 레이져 발사 후 공격키(D)를 누르면 조준된 상대를 향해 레이져를 발사합니다. 조준된 상대의 움직임을 계속 추격합니다. 최대 5번까지 가능합니다.

step12_title = 프레데터 - 점프 콜 대시 (A → D 누름떼기 + ->->)
step12_help  = 레이져 발사 후 방향키를 두번 빠르게 누르면 입력한 방향으로 전진공격하는 콜 대시가 발동됩니다. 연사중에도 사용이 가능합니다.

step13_title = 프레데터 - 점프 플라즈마 캐논 (A→D 누름떼기→D오래누름)
step13_help  = 레이져 발사 후 다시 공격키(D)를 오래 누르면 조준점이 있는 위치로 전함에서 상대의 방어를 무시하는 플라즈마 캐논이 떨어집니다. 연사중에도 사용이 가능합니다.

step14_title = 프레데터 - 대시공격 (->-> → D → D → D → D)
step14_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대시공격이 발동됩니다. 최대 4연타를 할 수 있습니다.

step15_title = 프레데터 - 대시 조준 (->-> → D 오래누름)
step15_help  = 대시 상태에서 공격키(D)를 오래 누르면 조준할 수 있는 상태가 되며, 사정거리 내 대상을 자동으로 조준해 줍니다. 이후 다른 조준과 동일한 공격을 할 수 있습니다.

step16_title = 프레데터 - 반격 (방어 성공시 바로 공격)
step16_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 띄우는 공격을 합니다. 이후 공격키(D)를 누르면 빔건으로 띄워진 상대를 공격합니다.

step17_title = 프레데터 - 프레데터스 함대 / 무기스킬(SD)
step17_help  = 프레데터스 함대(SD)는 전함에 탑승하여 공격하는 스킬입니다. 공격키를 누르면 각 전함에서 레이져가 발사되며 공격키를 오래 누르면 플라즈마 캐논을 발사합니다.

step18_title = 프레데터 - 나에게 4척의 전함이 있다 / 갑옷스킬(ASD)
step18_help  = 나에게 4척의 전함이 있다(ASD)는 사용 후 3회 피격될 때마다 전함이 자동으로 소환하여 상대를 공격하는 스킬 입니다.
               
step19_title = 프레데터 - Good Day,Commander / 투구스킬(AD)
step19_help  = Good Day,Commander(AD)는 전함을 소환한 후 조종하여 공격하는 스킬입니다. 소환 후 시전자가 피격되게 되면 스킬은 바로 종료됩니다.

step20_title = 프레데터 - 뉴클리어 스트라이크 / 망토스킬(AS)
step20_help  = 뉴클리어 스트라이크(AS)는 은신한 후 지정한 위치에 전함이 플라즈마 캐논을 발사하도록 명령하는 스킬입니다. 최대 3회까지 가능합니다.

step21_title = 프레데터 - 국민콤보 ①
step21_help  = ★레이져 발사(D 누름떼기) → 연사(D 누름떼기 + D→D →D→D) → 콜 대시(D 누름떼기 + ->->) 연사로 공격한 후 대시로 밀어내어 마무리 합니다.

step22_title = 프레데터 - 국민콤보 ②
step22_help  = ★플라즈마 캐논(D누름떼기 + D오래누름) → 뉴클리어 스트라이크(AS) 플라즈마 캐논으로 상대를 띄워 올린 후 뉴클리어 스트라이크로 다시 띄워올려 마무리 합니다.

step23_title = 프레데터 - 국민콤보 ③
step23_help  = ★레이져 발사(D누름떼기) → 연사(D누름떼기 + Dx4) → 콜 대시(D누름떼기 + ->->)로 띄운 후 점프공격 → 점프 레이져 발사 후 점프 플라즈마 캐논으로 마무리 합니다.



[Set166]

max_step = 17

step0_title  = 크로우 - 기본소개
step0_help   = 크로우는 그림자를 자유자재로 다룰 수 있습니다. 그림자 속에 들어가 까마귀로 변신하거나, 그림자를 타고 순간이동해 상대를 제압하는 일반 용병입니다.

step1_title  = 크로우 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 크로우 - 그림자 까마귀(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 그림자 까마귀로 변신해 위로 날아갑니다. 까마귀 상태에서 상대와 충돌하면 상대를 잡고 올라가고 게이지를 소모 합니다.

step3_title  = 크로우 - 이중점프 (A 두번 누름)
step3_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step4_title  = 크로우 - 점프공격 (A → D → D → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상에게 그림자로 타격하고 경직시킵니다.최대 3번 공격이 가능하고 3번째 타격시 상대를 스턴시킵니다.

step5_title  = 크로우 - 까마귀 해제 (A → D 누름유지)
step5_help   = 점프한 상태에서 공격키(D)를 오래 누르면 그림자에서 까마귀를 날아오르게 합니다. 다운된 상대를 타격할 수 있고 게이지를 소모 합니다.

step6_title = 크로우 - 대시공격 (->-> → D → D )
step6_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대시공격이 발동됩니다. 최대 2연타를 할 수 있습니다.

step7_title = 크로우 - 그림자 생성 (->-> → D 오래누름)
step7_help  = 대시 상태에서 공격키(D)를 오래 누르면 그림자를 생성해 연결시킵니다. 그림자에 피격된 상대는 그림자 손에 공격당하고 게이지를 소모합니다.

step8_title = 크로우 - 그림자 이동 (->-> → D 누름떼기)
step8_help  = 대시 상태에서 공격키(D)를 눌렀다 떼거나 일정시간이 지나면 그림자 손에 피격된 상대의 앞으로 순간이동 합니다. 피격된 상대가 없으면 순간이동을 하지 않습니다.

step9_title = 크로우 - 반격 (방어 성공시 바로 공격)
step9_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 띄우는 공격을 합니다.이후 공격키(D)를 누르면 상대를 바운딩 시킬 수 있습니다.

step10_title = 크로우 - 쉐도우 월드 / 무기스킬(SD)
step10_help  = 쉐도우 월드(SD)는 그림자 영역을 크게 넓히고 영역 내에 있는 상대를 그림자에 가두고 연타하는 스킬 입니다.

step11_title = 크로우 - 크로우 파이어 / 갑옷스킬(ASD)
step11_help  = 크로우 파이어(ASD)는 그림자를 조종해 그림자 까마귀를 발사하고 상대를 연타하는 그림자 손 영역을 생성하는 스킬입니다. 최대 4번 발사가 가능합니다.
 
step12_title = 크로우 - 쉐도우 어택 / 투구스킬(AD)
step12_help  = 쉐도우 어택(AD)은 주변에 있는 상대의 뒤쪽에 그림자 분신을 생성하는 스킬입니다. 그림자 분신은 최대 3번 공격하고 상대를 바운딩 시킬 수 있습니다.

step13_title = 크로우 - 크로우 플록 / 망토스킬(AS)
step13_help  = 크로우 플록(AS)은 주변에 그림자 까마귀 떼를 불러 영역내에 있는 상대를 까마귀 떼가 연타하는 스킬입니다. 피격중 사용이 가능합니다.

step14_title = 크로우 - 국민콤보 ①
step14_help  = ★그림자 이동 (->-> → D 누름떼기)으로 스턴된 상대 앞으로 순간이동 후 →그림자 까마귀(D 오래누름)로 상대를 띄운 후  →점프공격으로 마무리 합니다.

step15_title = 크로우 - 국민콤보 ②
step15_help  = ★크로우 플록(AS) →쉐도우 어택(AD)→쉐도우 월드(SD) 크로우 플록(AS)으로 스턴 후  →쉐도우 어택(AD)으로 바운딩 후 →쉐도우 월드(SD)로 마무리 합니다.

step16_title = 크로우 - 국민콤보 ③
step16_help  = ★크로우 파이어(ASD)로 상대를 무릎꿇게 한 후 → 그림자 까마귀(D 오래누름)로 상대를 띄운 후 →점프공격으로 바운딩 후 →쉐도우 월드(SD)로 마무리 합니다.


[Set167]

max_step = 18

step0_title  = 음양사 - 기본소개
step0_help   = 음양사는 사역마인 시키가미와 음양술을 사용하며 종이인형, 거울, 대나무를 사용하여 대상을 제압하는 레어 용병입니다.

step1_title  = 음양사 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 음양사 - 특별 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 차징상태가 되며 거울의 레이저 충전상태가 되며, 최대로 충전 후 발사시 레이저 이동 거리와 꺽기는 횟수가 증가합니다.

step3_title  = 음양사 - 이중점프 (A 두번 누름)
step3_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step4_title  = 음양사 - 활강 (이중점프 →A오래누름)
step4_help   = 이중점프한 상태에서 점프키(A)를 오래 누르면 종이 인형을 사용해 일정시간 활강할 수 있습니다. 활강 중 점프 특별을 사용 할 수 있습니다.

step5_title  = 음양사 - 점프공격 (A → D → D → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상에게 종이인형으로 타격하며, 마지막 공격시 레이저를 발사해 조종 할 수 있습니다.

step6_title  = 음양사 - 점프 대시공격 (점프 중 ->-> )
step6_help   = 점프중에 방향키를 빠르게 2번 입력하면 입력된 방향으로 빠르게 하강이동 하면서 상대를 공격을 합니다. 맞은 대상은 잠시동안 고개를 숙이게 되어 추가공격에 용이합니다.

step7_title  = 음양사 - 점프 특별공격 (A → D 오래누름 )
step7_help   = 점프 중 공격키(D)를 오래누르면 종이인형으로 내려찍는 공격을 합니다. 공격 당한 대상은 바운딩 상태가 되어 추가공격을 하기에 용이합니다.

step8_title = 음양사 - 대시공격 (->-> → D → D )
step8_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대시공격이 발동됩니다. 최대 2연타를 할 수 있습니다.

step9_title = 음양사 - 대시 특별공격 (->-> → D 오래누름)
step9_help  = 대시 상태에서 공격키(D)를 오래 누르면 그림자로 된 대나무를 바닥에서 생성시켜 상대를 밀어 냅니다. 다운공격이 가능합니다.

step10_title  = 음양사 - 튕겨내기 (공격 받는 순간 방어)
step10_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step11_title = 음양사 - 인형술 / 무기스킬(SD)
step11_help  = 인형술(SD)은 시키가미인 종이 인형이 되어, 작은 종이 인형을 뿌리고 다니는 기술입니다. 추가 공격키 입력시 종료 됩니다.

step12_title = 음양사 - 사혼술/ 갑옷스킬(ASD)
step12_help  = 사혼술(ASD)은 적의 몸에서 기운 악한 기운들을 뽑아내 대상을 회전하며 연타하는 공격을 하는 스킬입니다. 주변의 여러 대상이 공격이 가능합니다.

step13_title = 음양사 - 유체이탈 / 투구스킬(AD)
step13_help  = 유체이탈(AD)은 자신에 육체에서 영혼을 뽑아 내어, 전투를 진행하는 스킬입니다. 사용자 고유의 기술을 사용이 가능합니다.

step14_title = 음양사 - 연쇄술 / 망토스킬(AS)
step14_help  = 연쇄술(AS)은 주변에 상대에게 순간이동하여 연타 공격을 합니다. 방향조정이 가능하고, 방어키(S)키 입력시 뒤로 순간이동 합니다.

step15_title = 음양사 - 국민콤보 ①
step15_help  = ★사혼술(ASD) → 연쇄술(AS) 상대에게 사혼술(ASD)을 성공 시킨 뒤 → 떨어지는 대상에게 연쇄술(AS)을 사용하여 마무리 합니다.

step16_title = 음양사 - 국민콤보 ②
step16_help  = ★대쉬공격 1타(->-> → D) 를 사용해 상대를 띄운 뒤 기본공격(D → D → D) 타격 후 → 방향키를 왼쪽(←)키 → 오른쪽(→)키를 번갈아 눌러 마무리 합니다.

step17_title = 음양사 - 국민콤보 ③
step17_help  = ★대쉬공격 1타(->-> → D) 를 사용해 상대를 띄운 뒤 기본공격(D → D → D) 타격 후 → 인형술(SD)를 사용하여 대상을 마무리 합니다.


[Set168]
max_step = 17

step0_title  = 블랙 스피어 - 기본소개
step0_help   = 블랙 스피어는 저주받은 창을 이용하여 상대방에게 낙인을 걸어 발동시켜 제압하는 레어용병 입니다.

step1_title  = 블랙 스피어 - 기본공격 (D → D → D )
