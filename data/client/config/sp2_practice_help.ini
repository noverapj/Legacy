
; Set : 용병 순서대로 사용할것!!!!!!!!!!


[Set1]

max_step = 15

step0_title  = 아이언 나이트 - 기본소개
step0_help   = 아이언 나이트는 날카로운 검과 튼튼한 갑옷을 통하여\n공격과 수비 모두에서 균형 잡힌 능력을 발휘하는 근접\n계열 용병입니다.

step1_title  = 아이언 나이트 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 아이언 나이트 - 찌르기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 찌르기 공격이 발동됩니다.\n찌르기 공격이 성공하면 대상은 천천히 쓰러지게 되며\n완전히 넘어지기 전까지는 추가 공격이 가능합니다.

step3_title  = 아이언 나이트 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 사선으로 베는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 아이언 나이트 - 공중 찌르기(A → D 오래누름)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 찌르는 점프 공격을 하며 찌르기 공격이\n성공하면 대상은 천천히 쓰러지게 됩니다.

step5_title  = 아이언 나이트 - 대시공격 (->-> + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n경직시키며 추가공격 성공시 대상을 띄울 수 있습니다.

step6_title  = 아이언 나이트 - 연속휘두르기 (->-> + D 오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n경직시키며 추가공격 성공시 대상을 띄울 수 있습니다.

step7_title  = 아이언 나이트 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step8_title  = 아이언 나이트 - 3단베기 / 무기스킬(SD)
step8_help   = 3단베기(SD)는 검으로 빠르게 3연속 베는 스킬입니다.\n첫타 성공시 대상이 띄워져 안정적인 연속 공격이 되며\n날림거리가 길어서 드롭용으로도 유용합니다.

step9_title  = 아이언 나이트 - 보호의징표 / 갑옷스킬(ASD)
step9_help   = 보호의징표(ASD)는 상대를 밀어내는 패시브 스킬입니다.\n공격자를 밀어내기 때문에 공격자와의 간격이 벌어지게\n되어 연속 공격에 맞을 확률을 줄여 줍니다.

step10_title  = 아이언 나이트 - 박치기 / 투구스킬(AD)
step10_help   = 박치기(AD)는 상대를 들이받아 기절시키는 스킬입니다.\n박치기에 성공하면 상대는 잠시 행동불가 상태가 되어\n손쉽게 추가 공격을 성공시킬 수 있습니다.

step11_title  = 아이언 나이트 - 신속의오라 / 망토스킬(AS)
step11_help   = 신속의오라(AS)는 이동 속도를 올려 주는 스킬입니다.\n캡틴 후크 퀵스텝보다는 속도가 느리지만 지속 시간이\n길고 주변 팀원에게도 효과를 적용시켜 줍니다.

step12_title = 아이언 나이트 - 국민콤보 ①
step12_help  = ★박치기(AD) → 3단베기(SD)\n기습적인 박치기로 상대를 기절시킨 후 3단베기를 사용\n하여 빠르고 깔끔하게 마무리합니다.

step13_title = 아이언 나이트 - 국민콤보 ②
step13_help  = ★박치기(AD) → 찌르기(D오래) → 3단베기(SD)\n상대를 박치기로 기절시킨후 찌르기를 사용하여 천천히\n넘어지게 만들어 3단베기를 손쉽게 성공시켜 줍니다.

step14_title = 아이언 나이트 - 국민콤보 ③
step14_help  = ★찌르기(D오래) → 박치기(AD) → 찌르기(D오래)\n찌르기에 쓰러지는 상대를 박치기로 다시 일으킨 후, \n다시 찌르고 3단베기 등의 추가 공격을 가해줍니다.


[Set2]
max_step = 14

step0_title  = 캡틴 후크 - 기본소개
step0_help   = 캡틴 후크는 폭탄의 생성과 투척을 통하여 다양한 전투\n상황에서 고른 활약을 보여줄 뿐만 아니라 빠른 속도로\n전장 곳곳을 휘젓는 특수 계열 용병입니다.

step1_title  = 캡틴 후크 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 캡틴 후크 - 소형폭탄 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 소형 폭탄을 꺼내 듭니다.\n소형폭탄을 꺼내든 상태에서 공격키(D)를 다시 누르면\n전방으로 투척하며 점프 중에도 사용 가능합니다.

step3_title  = 캡틴 후크 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 사선으로 타격하는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 캡틴 후크 - 하이점프 (A 오래)
step4_help   = 점프키(A)를 오래 누르면 하이 점프가 발동합니다.\n하이 점프는 일반 점프보다 높이 뛸 수 있어 높은 지형의\n이동 및 소형 폭탄을 보다 멀리 던지기에 유용합니다.

step5_title  = 캡틴 후크 - 슈퍼대시 어택 (->-> → D)
step5_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를\n빠르게 두 번 누르면 그 방향으로 빠른 이동을 하는 슈퍼\n대시를 하며, 공격키(D)를 누르면 공격을 합니다.

step6_title  = 캡틴 후크 - 반격 (방어 성공시 바로 공격)
step6_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step7_title  = 캡틴 후크 - 폭탄난무 / 무기스킬(SD)
step7_help   = 폭탄난무(SD)는 5개 폭탄을 한번에 던지는 스킬입니다.\n피격중 사용가능하며, 소형 폭탄과는 다르게 폭탄에 부딪\n치기만 해도 폭발합니다.

step8_title  = 캡틴 후크 - 해적폭탄 / 갑옷스킬(ASD)
step8_help   = 해적폭탄(ASD)은 대형 폭탄 1개를 생성하는 스킬입니다.\n해적 폭탄은 소형보다 멀리 투척할 수 있을 뿐만 아니라\n넓은 유효범위와 강력한 폭발력까지 갖추고 있습니다.

step9_title  = 캡틴 후크 - 공포의외침 / 투구스킬(AD)
step9_help   = 공포의외침(AD)은 상대의 아이템을 벗기는 스킬입니다.\n아이템은 투구→망토→갑옷→무기 순으로 벗겨지며 대상\n의 벗겨진 아이템을 집어서 사용할 수도 있습니다.

step10_title  = 캡틴 후크 - 퀵스텝 / 망토스킬(AS)
step10_help   = 퀵스텝(AS)은 이동 속도를 대폭 증가시키는 스킬입니다.\n다운 중 스킬 사용이 가능하며, 스킬효과 지속시간 중\n다운상태가 되면 방향키를 입력해 일어날 수 있습니다.

step11_title = 캡틴 후크 - 국민콤보 ①
step11_help  = ★공포의 외침(AD) → 폭탄난무(SD) → 점프공격\n공포의 외침으로 상대를 경직 시킨후 폭탄난무의 폭발로\n공중에 띄워지면 점프 공격으로 마무리를 합니다.

step12_title = 캡틴 후크 - 국민콤보 ②
step12_help  = ★넘어진 대상 → 소형 폭탄 투척 → 점프공격\n소형 폭탄의 폭발로 공중에 뜬 대상을 점프 공격으로 연\n결합니다. 상대를 마무리 드롭시키기에 유용합니다.

step13_title = 캡틴 후크 - 국민콤보 ③
step13_help  = ★넘어진 대상 → 소형 폭탄 투척 → 기본타\n소형 폭탄의 폭발로 공중에 뜬 대상을 기본타 공격으로\n연결합니다. 점프 공격보다 멀리 보내기에 유용합니다.

[Set3]
max_step = 16

step0_title  = 웨스턴 건맨 - 기본소개
step0_help   = 웨스턴 건맨은 리볼버의 빠른 조준을 통한 사격 능력으\n로 단독은 물론 팀지원에서도 탁월한 역할을 하는 원거\n리 계열 용병입니다.

step1_title  = 웨스턴 건맨 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 웨스턴 건맨 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며\n사정거리 내 대상을 자동으로 조준해 줍니다. 조준된 상\n태에서 공격키를 떼면 대상에게 총알을 발사합니다.

step3_title  = 웨스턴 건맨 - 정조준 (조준 유지)
step3_help   = 대상을 조준 후 일정시간 유지하면 정조준이 됩니다.\n정조준으로 총알을 발사하면 총알 속도 및 공격력이\n증가되며 총알에 맞은 대상은 날아가 넘어지게 됩니다.

step4_title  = 웨스턴 건맨 - 넘어진 대상 조준(D 누름 유지)
step4_help   = 넘어진 대상을 조준하여 공격할 수 있습니다.\n정조준으로 총알을 발사하면 총알 속도 및 공격력이\n증가되며 총알에 맞은 대상은 날아가 넘어지게 됩니다.

step5_title  = 웨스턴 건맨 - 점프사격 (A→D)
step5_help   = 점프를 한 후 공격키를 누르면 점프 사격이 됩니다.\n점프사격 역시 공격키를 오래 누르면 사정거리 내 대상\n을 조준하여 사격할 수 있으나 정조준은 되지 않습니다.

step6_title  = 웨스턴 건맨 - 하이점프 (A 오래)
step6_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어\n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step7_title  = 웨스턴 건맨 - 장전 (S 오래)
step7_help   = 방어키(S)를 오래 누르고 있거나 총알이 한발도 없을 경\n우 공격키를 누르면 장전이 발동됩니다. 장전 중 방향키를\n빠르게 두번 누르면 구르기를 사용할 수 있습니다.

step8_title  = 웨스턴 건맨 - 구르기 (->->)
step8_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동\n및 공격을 회피하는 구르기를 사용할 수 있습니다.

step9_title  = 웨스턴 건맨 - 반격 (방어 성공시 바로 공격)
step9_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step10_title = 웨스턴 건맨 - 3연사 / 무기스킬(SD)
step10_help  = 3연사(SD)는 총알 3발을 연속으로 발사하는 스킬입니다.\n조준된 상태에서 공격키(D)를 유지하고 방어키(S)를 누\n르면 조준된 대상에게 3발을 연속 발사합니다.

step11_title = 웨스턴 건맨 - 속사 / 갑옷스킬(ASD)
step11_help  = 속사(ASD)는 총알 1발을 빠르게 발사하는 스킬입니다.\n속사에 맞은 대상은 천천히 쓰러지게 되어 추가적인 공격\n을 연결 할 수 있고 공중에서 사용기 가능합니다.

step12_title = 웨스턴 건맨 - 백스텝 / 투구스킬(AD)
step12_help  = 백스텝(AD)은 뒤로 빠르게 이동하는 스킬입니다.\n상대가 스킬로 공격할 때 사용하면 피해 없이 공격\n을 회피할 수 있고 공중,피격 중에도 사용 가능합니다.

step13_title = 웨스턴 건맨 - 포박 / 망토스킬(AS)
step13_help  = 포박(AS)은 로프를 던져 상대를 묶는 스킬입니다.\n넘어진 대상도 가능합니다. 포박 상태가 되면, 공격이\n불가능하고 느린 이동 및 점프만 가능하게 됩니다.

step14_title = 웨스턴 건맨 - 국민콤보 ①
step14_help  = ★속사(ASD) → 3연사(SD)\n상대가 속사에 맞아서 천천히 쓰러질 때 3연사를 사용\n하여 마무리 공격으로 연결하면 유용합니다.

step15_title = 웨스턴 건맨 - 국민콤보 ②
step15_help  = ★속사(ASD) → 포박(AS)\n상대가 속사에 맞아서 천천히 쓰러질 때 포박으로 묶은\n후 기본 공격 및 조준 발사 등의 추가 공격을 합니다.



[Set4]

max_step = 14

step0_title  = 파이어 메이지 - 기본소개
step0_help   = 파이어 메이지는 강력한 화염 속성의 마법 공격을 통하\n여 대상을 단번에 불태워 버릴 수 있는 마법 계열의\n데미지 딜러형 용병입니다.

step1_title  = 파이어 메이지 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 파이어 메이지 - 마법차징 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 무기 스킬의 게이지 회복 속\n도가 1.5배 증가하며, 소환된 마법진을 방향키로 조종하\n여 원하는 위치에 무기 스킬을 사용할 수 있습니다.

step3_title  = 파이어 메이지 - 마법방어 (S 누름)
step3_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든\n방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방\n어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step4_title  = 파이어 메이지 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대각선 아래로 화염구를 발사하는 공격을 합니다\n점프 공격은 지상의 대상을 공격할 때 유용합니다.

step5_title  = 파이어 메이지 - 이중점프 (A 두번 누름)
step5_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는\n멀리 이동할 수 있게 됩니다.

step6_title  = 파이어 메이지 - 지팡이 강타 (->->)
step6_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 지팡이를 내질러 대상을\n넘어뜨리는 지팡이 강타를 사용할 수 있습니다.

step7_title  = 파이어 메이지 - 메테오 / 무기스킬(SD)
step7_help   = 메테오(SD)는 마법진 위치에 화염을 떨어뜨리는 스킬입\n니다. 공격키(D)를 누른 상태로 마법진을 원하는 위치로\n이동시킨 후 방어키(S)를 누르면 메테오가 소환됩니다.

step8_title  = 파이어 메이지 - 플레임웨이브 / 갑옷스킬(ASD)
step8_help   = 플레임웨이브(ASD)는 6방향으로 뻗어가는 화염을 소환하\n는 스킬입니다. 점프 중 사용 가능하며,넘어진 대상에게 사용하면 2~3개의 화염을 명중시킬 수 있습니다.

step9_title  = 파이어 메이지 - 텔레포트 / 투구스킬(AD)
step9_help   = 텔레포트(AD)는 마법진 위치로 순간이동 하는 스킬입니\n다. 점프중 사용가능하며, 소환된 마법진을 원하는 위치로\n이동 시킨후 A,S,D 중에 하나를 누르면 순간 이동됩니다.

step10_title  = 파이어 메이지 - 화염저항 / 망토스킬(AS)
step10_help   = 화염저항(AS)은 화염 피해를 막아 주는 스킬입니다. 다운\n중 사용가능 하며, 자신과 주변의 팀원들에게도 일정시간\n동안 화염 저항과 공격력 증가가 적용 됩니다.

step11_title = 파이어 메이지 - 국민콤보 ①
step11_help  = ★메테오(SD) → 텔레포트(AD) → 플레임웨이브(ASD)\n메테오를 맞은 대상이 일어나기 전에 텔레포트로 이동하\n여 플레임웨이브의 연결 공격으로 큰 피해를 줍니다.

step12_title = 파이어 메이지 - 국민콤보 ②
step12_help  = ★지팡이 강타 → 메테오(SD) → 기본 공격\n대상을 빠른 지팡이 강타로 넘어뜨리고 메테오를 사용하\n여 공중에 띄운 후 기본 공격으로 마무리합니다.

step13_title = 파이어 메이지 - 국민콤보 ③
step13_help  = ★텔레포트(AD) →상대의 뒤쪽 → 지팡이 강타\n텔레포트를 이용하여 상대의 뒤쪽으로 순간 이동한 후\n빠른 지팡이 강타로 넘어뜨려 추가 공격을 연결합니다.



[Set5]
max_step = 15

step0_title  = 사이버 메딕 - 기본소개
step0_help   = 사이버 메딕은 커다란 주사기를 들고 전장을 누비면서\n상처입은 팀원을 치료하는 고유 능력으로 팀원을 든든\n하게 지켜주는 마법 계열 용병입니다.

step1_title  = 사이버 메딕 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 사이버 메딕 - 마법차징 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 무기 스킬의 게이지 회복 속\n도가 1.5배 증가하며, 주변 팀원에게 치료 마크가 자동으\n로 타겟팅되어 무기 스킬을 사용할 수 있습니다.

step3_title  = 사이버 메딕 - 마취주사 (->->)
step3_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 주사기를 찔러 대상을\n잠시 경직시키는 마취 주사를 사용할 수 있습니다.

step4_title  = 사이버 메딕 - 마법방어 (S 누름)
step4_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든\n방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방\n어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step5_title  = 사이버 메딕 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를\n누르면 지상으로 짧게 대쉬하며 상대를 공격하게 됩니다\n공중에서 지상의 적을 기습할 때 유용합니다.

step6_title  = 사이버 메딕 - 이중점프 (A 두번 누름)
step6_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는\n멀리 이동할 수 있게 됩니다.

step7_title  = 사이버 메딕 - 공중대시 (A → ->->)
step7_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게\n직선 이동을 하는 공중 대시가 발동됩니다.

step8_title  = 사이버 메딕 - 힐링 / 무기스킬(SD)
step8_help   = 힐링(SD)은 체력을 회복시켜주는 스킬입니다. 스킬을 바로 사용하면 자신을 치료하고, 공격키(D)를 누른 상태로 팀원을 타겟팅한 후 방어키(S)를 누르면 팀원을 치료합니다.

step9_title  = 사이버 메딕 - 무중력 / 갑옷스킬(ASD)
step9_help   = 무중력(ASD)은 상대를 일정시간 공중에 띄우는 스킬입니\n다. 무중력 스킬은 넘어진 대상도 띄울 수 있으므로 다\n양한 추가 공격을 연결하기에 매우 유용합니다.

step10_title  = 사이버 메딕 - 기소멸 / 투구스킬(AD)
step10_help   = 기소멸(AD)은 상대의 스킬 게이지를 모두 초기화시키는\n스킬입니다. 상대팀의 스킬 게이지를 모두 초기화하여\n전투에서 팀원이 유리하도록 만들어 줍니다.

step11_title  = 사이버 메딕 - 저속비행 / 망토스킬(AS)
step11_help   = 저속비행(AS)은 부스터를 사용해서 비행하는 스킬입니다\n피격 중 사용 가능하며, 방향키로 전후좌우 이동과 점프\n키(A)를 누르면 고도를 상승시킬 수 있습니다.

step12_title = 사이버 메딕 - 국민 콤보 ①
step12_help  = ★무중력(ASD) → 마취 주사 1회\n넘어진 대상을 무중력으로 공중에 띄운 후에 마취 주사를\n사용하여 드롭존으로 날려서 마무리합니다.

step13_title = 사이버 메딕 - 국민 콤보 ②
step13_help  = ★마취주사 2회 → 기소멸(AD) → 마취주사 3회\n마취 주사를 2회 연속으로 맞으면 천천히 넘어지게 되며\n이 때, 기소멸로 다시 세운 후 마취주사 3회를 가합니다.

step14_title = 사이버 메딕 - 국민 콤보 ③
step14_help  = ★마취주사 3회 → 무중력(ASD) → 기본 공격\n마취주사 3회로 대상을 넘어뜨린 후 무중력으로 공중에\n띄워서 기본 3연타 공격으로 마무리합니다.



[Set6]

max_step = 17

step0_title  = 세비지 버서커 - 기본 소개
step0_help   = 세비지 버서커는 양손 대검의 강력한 공격으로 상대의\n단단한 방어도 가볍게 파괴하는 능력을 보유한 근접 계\n열 용병입니다.

step1_title  = 세비지 버서커 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 세비지 버서커 - 슬래쉬 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 상대의 방어를 파괴하고 날려\n버리는 슬래쉬 공격이 발동됩니다. 기본 공격과 섞어서\n사용하면 전투에서 쉽게 우위를 차지할 수 있습니다.

step3_title  = 세비지 버서커 - 분노 상태1
step3_help   = 피격상태가 될 때 마다 무기 아이콘 상단의 버서커 게이\n지가 상승하고 게이지가 100이 되면 분노상태가 자동\n으로 발동됩니다.

step4_title  = 세비지 버서커 - 분노 상태2
step4_help   = 분노 상태가 발동되면 공격력, 밀림, 띄움이 증가합니다.\n 하지만 방어력은 감소됩니다. 게이지가\n모두 소모되면 자동으로 분노 상태가 해지됩니다.

step5_title  = 세비지 버서커 - 점프공격1 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 수직으로 베는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step6_title  = 세비지 버서커 - 점프공격2 (A → D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n 오래누르면 대상을 내려 찍어 바운딩 시키는 공격을 합\n니다.

step7_title  = 세비지 버서커 - 대시공격1 (->-> → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n강하게 밀쳐내는 대시 공격이 가능합니다.

step8_title  = 세비지 버서커 - 대시공격2 (->-> → D 오래누름)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 오래 누르면 대\n상의 방어를 파괴하고 공중에 띄우는 공격을 합니다.

step9_title  = 세비지 버서커 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step10_title  = 세비지 버서커 - 대지가르기 / 무기스킬(SD)
step10_help   = 대지가르기(SD)는 대검으로 지면을 내리쳐 검기를 발생\n시키는 스킬입니다. 상대가 검기를 맞으면 공중으로 뜨\n기 때문에 다양한 추가 공격을 연결할 수 있게 됩니다.

step11_title  = 세비지 버서커 - 거대화 / 갑옷스킬(ASD)
step11_help   = 거대화(ASD)는 피격 중 사용 가능하며, 자신을 잠시동안\n거대화하는 스킬입니다. 변신하면 공격력이 증가하고\n데미지는 받지만, 방어파괴 외의 피격효과를 무시합니다.

step12_title  = 세비지 버서커 - 돌진 / 투구스킬(AD)
step12_help   = 돌진(AD)은 상대를 들이받아서 날려버리는 스킬입니다.\n점프 및 피격 중에도 스킬 사용이 가능합니다. 대상을\n멀리 날려버립니다.

step13_title  = 세비지 버서커 - 뿔나팔 / 망토스킬(AS)
step13_help   = 뿔나팔(AS)은 뿔나팔을 불어 기절시키는 스킬입니다.\n뿔나팔을 불면 주변의 대상이 일정 시간 행동을 하지 못\n하게 하며, 피격 중 사용이 가능합니다.

step14_title = 세비지 버서커 - 국민 콤보 ①
step14_help  = ★뿔나팔(AS) → 돌진(AD)\n뿔나팔을 사용하여 대상을 경직시킨 후 돌진으로 그대로\n들이 받아서 날려버리는 것으로 마무리합니다.

step15_title = 세비지 버서커 - 국민 콤보 ②
step15_help  = ★뿔나팔(AS) → 대지가르기(SD) → 점프공격\n뿔나팔을 사용하여 대상을 경직시킨 후 대지가르기로 공\n중에 띄워서 점프 공격으로 깔끔하게 마무리합니다.

step16_title = 세비지 버서커 - 국민 콤보 ③
step16_help  = ★돌진(AD) → 뿔나팔(AS) → 대지가르기(SD)\n돌진으로 대상을 기습하여 넘어뜨린 후 뿔나팔을 사용하\n여 기립을 지연시켜서 대지가르기로 연결합니다.



[Set7]
max_step = 15

step0_title  = 로빈 후드 - 기본소개
step0_help   = 로빈 후드는 장전이 필요 없는 활에서 끊임없이 발사되\n는 화살로 전장 곳곳을 누비고 다니는 게릴라 전문의 원\n거리 계열 용병입니다.

step1_title  = 로빈 후드 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 로빈 후드 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며\n사정거리 내 대상을 자동으로 조준해줍니다. 조준된 상\n태에서 공격키를 떼면 대상에게 화살을 발사합니다.

step3_title  = 로빈 후드 - 정조준 (조준 유지)
step3_help   = 대상을 조준 후 일정시간 유지하면 정조준이 됩니다.\n정조준시 화살을 2발 연사하며 화살 속도 및 공격력이\n증가되어 화살에 맞은 대상은 날아가 넘어지게 됩니다.

step4_title  = 로빈 후드 - 조준이동 (D 누름유지하고 방향키)
step4_help   = 공격키(D)를 누르고 있으면서 방향키를 추가로 누르면\n대상을 조준 및 정조준한 상태로 상, 하, 좌, 우로 이동\n할 수 있으며 이 때 공격키를 떼면 화살이 발사됩니다.

step5_title  = 로빈 후드 - 점프사격 (A → D)
step5_help   = 점프를 한 후 공격키(D)를 누르면 점프 사격이 됩니다.\n점프 사격 역시 공격키를 오래 누르면 사정거리 내 대상\n을 조준하여 사격할 수 있으나 정조준은 되지 않습니다.

step6_title  = 로빈 후드 - 하이점프 (A 오래)
step6_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어 \n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step7_title  = 로빈 후드 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다.\n로빈 후드는 대상을 빠르게 지나가 대상의 뒤로 이동\n한 후 대상에게 화살를 발사하는 공격을 합니다.

step8_title  = 로빈 후드 - 구르기 (->->)
step8_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동\n및 공격을 회피하는 구르기를 사용할 수 있습니다.

step9_title  = 로빈 후드 - 멀티샷 / 무기스킬(SD)
step9_help   = 멀티샷(SD)은 7방향으로 화살을 발사하는 스킬입니다.\n조준된 상태에서 공격키(D)를 유지하고 방어키(S)를 누\n르면 조준된 대상에게 화살을 발사합니다.

step10_title  = 로빈 후드 - 공중제비 / 갑옷스킬(ASD)
step10_help   = 공중제비(ASD)는 이중 점프를 할 수 있게 하는 패시브 \n스킬입니다. 공중제비 이후 점프사격이 가능하며 전장\n을 넓게 이동하면서 플레이를 이끌어 나갈 수 있습니다.

step11_title = 로빈 후드 - 반달차기 / 투구스킬(AD)
step11_help  = 반달차기(AD)는 상대를 높이 차올리는 스킬입니다.\n상대를 공중으로 높이 띄워 올리기 때문에 다양한 추가\n공격을 손쉽게 연결할 수 있습니다.

step12_title = 로빈 후드 - 화살투척 / 망토스킬(AS)
step12_help  = 화살투척(AS)은 9개의 화살을 꺼내 던지는 스킬입니다.\n투척된 9개의 화살은 날아가면서 넓게 퍼지기 때문에 넓\n은 지역을 동시 타격하기에 용이합니다.

step13_title = 로빈 후드 - 국민콤보 ①
step13_help  = ★반달차기(AD) → 점프사격\n반달차기로 대상을 높이 띄운 후 점프하여 떨어지는 타\n이밍에 맞춰서 화살을 발사하여 명중시킵니다.

step14_title = 로빈 후드 - 국민콤보 ②
step14_help  = ★반달차기(AD) → 화살투척(AS) → 화살발사\n반달차기로 대상을 높이 띄운 후 살짝 쉬었다가 화살 투\n척을 사용하여 연타하고 마무리 화살로 명중시킵니다.



[Set8]
max_step = 14

step0_title  = 크레이지 마이너 - 기본소개
step0_help   = 크레이지 마이너는 폭발을 일으키는 지뢰를 곳곳에 매설\n하여 적팀의 행동 제약 및 지역을 장악하는데 유용한 특\n수 계열 용병입니다.

step1_title  = 크레이지 마이너 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 크레이지 마이너 - 지뢰매설 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 발 밑에 지뢰를 매설합니다.\n지뢰는 최대 6개까지 동시 매설할 수 있으며 6개를 넘어\n서 매설할 경우 최초 매설한 지뢰가 자동 폭파됩니다.

step3_title  = 크레이지 마이너 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 수직으로 타격하는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 크레이지 마이너 - 하이점프 (A 오래)
step4_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어\n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step5_title  = 크레이지 마이너 - 슈퍼대시 어택 (->-> → D)
step5_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 빠른 이동을 하는 슈퍼\n대시를 하며, 공격키(D)를 누르면 공격을 합니다.

step6_title  = 크레이지 마이너 - 튕겨내기 (공격 받는 순간 방어)
step6_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step7_title  = 크레이지 마이너 - 스페셜지뢰 / 무기스킬(SD)
step7_help   = 스페셜지뢰(SD)는 초강력 지뢰를 매설하는 스킬입니다.\n스페셜지뢰도 매설된 지뢰 개수에 포함되므로 항상 무기\n아이콘 위에 있는 남은 지뢰 개수를 확인하세요.

step8_title  = 크레이지 마이너 - 지뢰저항 / 갑옷스킬(ASD)
step8_help   = 지뢰저항(ASD)은 지뢰 피해를 무효화시켜주는 패시브 스\n킬입니다. 지뢰 피해를 무효화할 뿐만아니라 상대 지뢰\n가 자신을 인식하지 못하는 효과도 가지고 있습니다.

step9_title  = 크레이지 마이너 - 보호막 / 투구스킬(AD)
step9_help   = 보호막(AD)은 보호막을 펼쳐 모든 공격을 방어하는 스킬\n입니다. 피격 및 다운 중 사용가능하며, 스킬 사용 중\nA, S, D키 중 하나를 입력하면 스킬을 중지합니다.

step10_title  = 크레이지 마이너 - 핵폭탄 / 망토스킬(AS)
step10_help   = 핵폭탄(AS)은 핵폭탄 투하를 요청하는 스킬입니다.\n핵폭탄은 넓은 범위에 매우 강력한 피해를 다수의 대상\n에게 줄 수 있는 초강력 폭탄입니다.

step11_title = 크레이지 마이너 - 국민콤보 ①
step11_help  = ★핵폭탄(AS) → 보호막(AD)\n핵폭탄 투하를 요청한 후 떨어질 때 보호막을 사용하여\n자신을 안전하게 보호합니다.

step12_title = 크레이지 마이너 - 국민콤보 ②
step12_help  = ★지뢰매설 → 지뢰매설 → 기본 공격\n지뢰 2개를 인접해서 매설하면 서로 폭파되는 것을 이용\n하여 대상을 공중에 띄운 후 기본 공격으로 연결합니다.

step13_title = 크레이지 마이너 - 국민콤보 ③
step13_help  = ★핵폭탄(AS) → 보호막(AD) → 스페셜지뢰(SD)\n핵폭탄 투하하고 보호막으로 몸을 보호한 후 핵폭탄으로\n떠오른 대상의 낙하지점에 스페셜지뢰를 매설합니다.



[Set9]
max_step = 14

step0_title  = 아이스 메이지 - 기본소개
step0_help   = 아이스 메이지는 빙결을 일으키는 얼음 속성의 넓은\n마법 공격으로 전장 전체를 쥐고 흔드는 광역 전문의\n마법 계열 용병입니다.

step1_title  = 아이스 메이지 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 아이스 메이지 - 마법차징 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 무기 스킬의 게이지 회복 속\n도가 1.5배 증가하며, 소환된 마법진을 방향키로 조종하\n여 원하는 위치에 무기 스킬을 사용할 수 있습니다.

step3_title  = 아이스 메이지 - 마법방어 (S 누름)
step3_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든\n방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방\n어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step4_title  = 아이스 메이지 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대각선 아래로 얼음조각을 발사하는 공격을 합니\n다. 점프 공격은 지상의 대상을 공격할 때 유용합니다.

step5_title  = 아이스 메이지 - 이중점프 (A 두번 누름)
step5_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는\n멀리 이동할 수 있게 됩니다.

step6_title  = 아이스 메이지 - 회전타 (->->)
step6_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 지팡이를 내질러 대상을\n높이 띄울 수 있는 회전타를 사용할 수 있습니다.

step7_title  = 아이스 메이지 - 블리자드 / 무기스킬(SD)
step7_help   = 블리자드(SD)는 마법진 위치에 얼음을 떨어뜨리는 스킬\n입니다. 공격키(D)를 누른 상태로 마법진을 원하는 위치\n로 이동 후 방어키(S)를 누르면 블리자드가 소환됩니다.

step8_title  = 아이스 메이지 - 냉기폭발 / 갑옷스킬(ASD)
step8_help   = 냉기폭발(ASD)은 냉기를 밖으로 폭발시키는 스킬입니다.\n냉기 폭발을 사용하면 자기 주변의 다수에 대상을 한번\n에 멀리 날려 보내며 다운된 대상에게 사용할 수 있습니다.

step9_title  = 아이스 메이지 - 아이스쉴드 / 투구스킬(AD)
step9_help   = 아이스실드(AD)는 피해 데미지를 감소시키는 스킬입니다. 아이스쉴드 사용 시 일정량의 데미지 피해를 스킬 게이지로 소모하며, 피격 시 공격자는 빙결상태가 됩니다.

step10_title  = 아이스 메이지 - 얼음저항 / 망토스킬(AS)
step10_help   = 얼음저항(AS)은 얼음 공격의 피해를 막아 주는 스킬입니\n다. 스킬을 사용하면 자신은 물론 주변의 팀원들에게도 \n일정 시간 얼음 저항이 적용됩니다.

step11_title = 아이스 메이지 - 국민콤보 ①
step11_help  = ★블리자드(SD) → 냉기폭발(ASD)\n블리자드를 사용하여 대상을 빙결시켜서 행동 불가로\n만든 후 냉기폭발로 깔끔하게 마무리합니다.

step12_title = 아이스 메이지 - 국민콤보 ②
step12_help  = ★회전타 → 기본 공격\n기습적인 지팡이 회전타로 대상을 공중에 띄운 후 기본\n공격으로 연타하여 마무리합니다.

step13_title = 아이스 메이지 - 국민콤보 ③
step13_help  = ★회전타 → 블리자드(SD) → 냉기폭발(ASD)\n지팡이 회전타로 띄워서 넘어뜨린 후 대상이 일어나기\n전에 블리자드로 빙결시키고 냉기폭발로 마무리합니다.



[Set10]
max_step = 15

step0_title  = 육군 보병 - 기본소개
step0_help   = 육군 보병은 한 번 조준에 탕!탕!탕! 3발을 발사하여\n상대에게 상당한 피해를 입히는 3점사를 자랑하는 원거\n리 계열 용병입니다.

step1_title  = 육군 보병 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 육군 보병 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며\n사정거리 내 대상을 자동으로 조준해 줍니다. 조준된 상\n태에서 공격키를 떼면 대상에게 총알을 발사합니다.

step3_title  = 육군 보병 - 정조준 (조준 유지)
step3_help   = 대상을 조준 후 일정시간 유지하면 정조준이 됩니다.\n정조준시 발사하면 총알 속도 및 데미지가 증가되어\n총알에 맞은 대상은 날아가 넘어지게 됩니다.

step4_title  = 육군 보병 - 점프사격 (A → D)
step4_help   = 점프를 한 후 공격키(D)를 누르면 점프 사격이 됩니다.\n점프 사격 역시 공격키를 오래 누르면 사정거리 내 대상\n을 조준하여 사격할 수 있으나 정조준은 되지 않습니다.

step5_title  = 육군 보병 - 하이점프 (A 오래)
step5_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어\n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step6_title  = 육군 보병 - 장전 (S 오래)
step6_help   = 방어키(S)를 오래 누르고 있거나 총알이 한발도 없을 경\n우 공격키를 누르면 장전이 발동됩니다. 총알이 없으면\n사격이 불가능하므로 틈틈이 장전을 해주어야 합니다.

step7_title  = 육군 보병 - 장전 중 구르기 (->->)
step7_help   = 장전 중 방향키를 빠르게 두번 누르면 그 방향으로 일정\n거리를 굴러서 이동을 할 수 있습니다. 장전 중 구르기는\n장전 중에 적의 공격을 회피할 때 유용합니다.

step8_title  = 육군 보병 - 구르기 (->->)
step8_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동\n및 공격을 회피하는 구르기를 사용할 수 있습니다.

step9_title  = 육군 보병 - 난사 / 무기스킬(SD)
step9_help   = 난사(SD)는 전방으로 소총을 난사하는 스킬입니다.\n조준된 상태에서 공격키(D)를 유지하고 방어키(S)를 누\n르면 조준된 대상에게 소총을 난사합니다.

step10_title  = 육군 보병 - 수류탄 / 갑옷스킬(ASD)
step10_help   = 수류탄(ASD)은 전방으로 수류탄을 던져 일정 지역에\n폭발 공격을 하는 스킬입니다. 점프 중에서도 사용할\n수 있으며, D키 입력시 최대 3발까지 투척 가능합니다.

step11_title = 육군 보병 - 제식 / 투구스킬(AD)
step11_help  = 제식(AD)은 상대를 강제로 제식 훈련시키는 스킬입니다.\n제식에 걸리면 랜덤한 방향으로 일정시간 이동하게 되며\n넘어져 있는 대상에게도 사용할 수 있습니다.

step12_title = 육군 보병 - 진지구축 / 망토스킬(AS)
step12_help  = 진지구축(AS)은 포대를 쌓아서 진지를 만드는 스킬입니\n다. 구축된 진지는 근접 공격을 튕겨내는 특성을 가지며\n데미지 피해를 많이 입으면 소멸됩니다.

step13_title = 육군 보병 - 국민콤보 ①
step13_help  = ★난사(SD) → 수류탄(ASD) → 점프사격\n대상에게 난사하여 멀리 날려서 넘어뜨린 후 수류탄을\n던져 공중에 띄워서 점프 사격으로 명중시킵니다.

step14_title = 육군 보병 - 국민콤보 ②
step14_help  = ★제식(AD) → 조준 및 정조준 사격\n제식으로 대상을 강제 이동하게 만들고 이 때 대상을 조\n준 또는 정조준 사격으로 명중시킵니다.

step15_title = 육군 보병 - 국민콤보 ③
step15_help  = ★난사(SD) → 수류탄(ASD) → 구르기 → 제식(AD)\n대상을 난사로 넘어뜨린 후 수류탄을 던져 공중에 뜨게\n만들고 빠르게 구르기로 접근해서 제식을 사용합니다.



[Set11]
max_step = 16

step0_title  = 스페이스 솔져 - 기본소개
step0_help   = 스페이스 솔져는 높은 전류가 흐르는 레이저빔을 발사하\n여 높은 데미지 및 경직 피해를 동시에 발생시키는 원거\n리 계열 용병입니다.

step1_title  = 스페이스 솔져 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 스페이스 솔져 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며\n사정거리 내 대상을 자동으로 조준해 줍니다. 조준된 상\n태에서 공격키를 떼면 대상에게 총알을 발사합니다.

step3_title  = 스페이스 솔져 - 정조준 (조준 유지)
step3_help   = 대상을 조준 후 일정시간 유지하면 정조준이 됩니다.\n이때 발사하면 총알 속도 및 데미지가 증가되며 총알에\n맞은 대상은 천천히 무릎을 꿇고 쓰러지게 됩니다.

step4_title  = 스페이스 솔져 - 점프사격 (A → D)
step4_help   = 점프를 한 후 공격키(D)를 누르면 점프 사격이 됩니다.\n점프사격 역시 공격키를 오래 누르면 사정거리 내 대상\n을 조준하여 사격할 수 있으나 정조준은 되지 않습니다.

step5_title  = 스페이스 솔져 - 하이점프 (A 오래)
step5_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어\n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step6_title  = 스페이스 솔져 - 공중대시 (A → ->->)
step6_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게\n직선 이동을 하는 공중 대시가 발동됩니다.

step7_title  = 스페이스 솔져 - 충전 (자동)
step7_help   = 스페이스 솔져의 총은 총탄이 아니라 전기 에너지를 사\n용하기 때문에 탄수의 제약이 없는 대신에 다음 발사를\n위해 1초 가량의 자동 재충전이 필요합니다.

step8_title  = 스페이스 솔져 - 전진이동 (->->)
step8_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 일정 거리를 전진하여 이\n동 및 공격을 회피하는 전진이동을 사용할 수 있습니다.

step9_title  = 스페이스 솔져 - 빔캐논 / 무기스킬(SD)
step9_help   = 빔캐논(SD)은 강력한 빔을 발사하는 스킬입니다.\n조준된 상태에서 공격키(D)를 유지하고 방어키(S)를 누\n르면 조준된 대상에게 강력한 빔을 발사합니다.

step10_title  = 스페이스 솔져 - 전기충격 / 갑옷스킬(ASD)
step10_help   = 전기충격(ASD)은 슈트에 전류를 흘려서 주변을 감전시키\n는 스킬입니다. 전류를 흘려 보내는 시간이 길어서 다른\n스킬의 무적 시간을 무시하고 피해를 줄 수도 있습니다.

step11_title = 스페이스 솔져 - 리턴 / 투구스킬(AD)
step11_help  = 리턴(AD)은 상대를 시전자 주변의 랜덤한 위치로 이동시\n키는 스킬입니다.  상대를 공중으로 이동시켜서 떨어트리\n기 때문에 지면에 닿으면 데미지를 입습니다.

step12_title = 스페이스 솔져 - 저속비행 / 망토스킬(AS)
step12_help  = 저속비행(AS)은 부스터를 사용해서 비행하는 스킬입니다\n스킬(AS)을 사용한 후 방향키로 전후좌우 이동할 수 있\n으며 점프키(A)를 누르면 고도를 상승시킬 수 있습니다.

step13_title = 스페이스 솔져 - 국민콤보 ①
step13_help  = ★전기충격(ASD) → 빔캐논(SD)\n전기 충격으로 대상을 감전시켜서 움직일 수 없게 하고\n재빠르게 빔캐논으로 명중시킵니다.

step14_title = 스페이스 솔져 - 국민콤보 ②
step14_help  = ★전기충격(ASD) → 리턴(AD)\n전기 충격으로 대상을 감전시켜서 움직일 수 없게 하고\n리턴을 사용하여 상대를 공격합니다.

step15_title = 스페이스 솔져 - 국민콤보 ③
step15_help  = ★전기충격(ASD) → 정조준 사격 → 빔캐논(SD)\n대상을 전기 충격으로 감전시키고 정조준 사격으로 맞춰\n 천천히 넘어지게 될 때 빔캐논으로 마무리합니다.



[Set12]
max_step = 17

step0_title  = 쉐도우 어쌔신 - 기본소개
step0_help   = 쉐도우 어쌔신은 은신으로 조용히 이동하여 상대의 뒤\n를 불시에 기습해서 저 세상으로 보내는 암살 전문 근\n거리 계열 용병입니다.

step1_title  = 쉐도우 어쌔신 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 5연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 쉐도우 어쌔신 - 띄우기 (D 눌렀다 때기)
step2_help   = 공격키(D)를 눌렀다 떼면 띄우기 공격이 발동됩니다.\n띄우기 공격이 성공하면 대상이 위로 띄워져서 점프 공\n격 등의 다양한 추가 공격으로 연결할 수 있습니다.

step3_title  = 쉐도우 어쌔신 - 독뿌리기 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 상대의 방어를 무시하고 중독\n시키는 독뿌리기 공격을 합니다. 중독된 대상은 서서히\n피가 달며 이동속도가 느려집니다.

step4_title  = 쉐도우 어쌔신 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 사선으로 할퀴는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step5_title  = 쉐도우 어쌔신 - 점프 대시 공격 (A → ->->)
step5_help   = 점프중에 방향키를 빠르게 2번 입력하면 지상으로 내려\n가며 3연속 찌르는 공격을 합니다. 점프 대시 공격에\n2연속 맞은 대상은 다운되어 넘어집니다.

step6_title  = 쉐도우 어쌔신 - 대시공격 (->-> + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n빠르게 3연타하는 대시 공격이 가능합니다.

step7_title  = 쉐도우 어쌔신 - 이중 대시공격 (->-> + D,D)
step7_help   = 대시공격 중에 공격키(D)를 한번 더 입력하면 대시공격\n이 한번 더 가능합니다. 이때 방향키를 같이 입력하면\n입력한 방향으로 전환하여 대시 공격을 합니다.

step8_title  = 쉐도우 어쌔신 - 대시 독뿌리기 (->-> → D 오래누름)
step8_help   = 대시 달리기 중 공격키를 오래누르면 상대방의 방어를\n무시하고 중독시키는 독뿌리기 공격을 합니다. 중독된\n대상은 서서히 피가 달며 이동속도가 느려집니다.

step9_title  = 쉐도우 어쌔신 - 반격 (방어 성공시 바로 공격)
step9_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step10_title  = 쉐도우 어쌔신 - 암살술 / 무기스킬(SD)
step10_help   = 암살술(SD)은 빠른 접근으로 상대를 기절시키는 스킬입\n니다. 일정 거리를 빠르게 접근하기 때문에 성공률이 높\n으며 기절을 이용한 다양한 추가 공격이 가능합니다.

step11_title  = 쉐도우 어쌔신 - 은신술 / 갑옷스킬(ASD)
step11_help   = 은신술(ASD)은 모습을 감추고 이동할 수 있는 스킬입니\n다. 은신술(ASD)은 다운/공중/피격중 에서도 사용할 수\n있기 때문에 회피 및 기습 공격에 유용합니다.

step12_title = 쉐도우 어쌔신 - 삿갓날리기 / 투구스킬(AD)
step12_help  = 삿갓날리기(AD)는 삿갓을 날려 대상을 공격하는 스킬입\n니다. 삿갓은 날아갈 때와 돌아올 때 모두 공격이 가능\n하여 2연속 타격시 강경직 상태가 됩니다.

step13_title = 쉐도우 어쌔신 - 독살술 / 망토스킬(AS)
step13_help  = 독살술(AS)은 독주를 뿜어서 중독시키는 스킬입니다.\n중독되면 천천히 체력이 감소하면서 이동 속도가 급격히\n느려지고 점프 높이가 낮아져 움직임이 둔해집니다.

step14_title = 쉐도우 어쌔신 - 국민콤보 ①
step14_help  = ★암살술(SD) → 독살술(AS)\n암살술로 상대를 기습하여 기절시킨 후 천천히 넘어지는\n상대 위에 독살술로 독을 뿌려서 마무리합니다.

step15_title = 쉐도우 어쌔신 - 국민콤보 ②
step15_help  = ★암살술(SD) → 띄우기 → 점프공격\n암살술로 기절시킨 후 띄우기를 이용하여 대상을 위로\n띄우고 점프 공격으로 깔끔하게 마무리합니다.

step16_title = 쉐도우 어쌔신 - 국민콤보 ③
step16_help  = ★암살술(SD) → 띄우기 → 띄우기 → 기본공격\n암살술로 기절시킨 후 띄우기를 연속 사용하여 대상을\n두 번 띄우고 떨어질 때 기본 공격으로 연타합니다.



[Set13]
max_step = 16

step0_title  = 빅토리 디펜더 - 기본소개
step0_help   = 빅토리 디펜더는 방패 하나로 상대 공격을 방어하면서\n아군의 공격 루트를 확보해 주는 든든한 방어 전문의\n근거리 계열 용병입니다.

step1_title  = 빅토리 디펜더 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 빅토리 디펜더 - 올려치기 (D 누름떼기)
step2_help   = 공격키(D)를 살짝 눌렀다 떼면 올려치기 공격을 합니다.\n올려치기 2연타에 맞은 대상은 위로 띄워져서 점프 공격\n등의 다양한 추가 공격으로 연결할 수 있습니다.

step3_title  = 빅토리 디펜더 - 방패던지기 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 방패던지기 공격을 합니다.\n방패는 앞으로 나가며 치고, 자신에게 돌아오며 한번 더\n공격이 가능합니다. 점프 사용으로 견제에 유용합니다.

step4_title  = 빅토리 디펜더 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 발로 내려차는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step5_title  = 빅토리 디펜더 - 대시공격 (->-> + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n강하게 밀쳐내는 대시 공격이 가능합니다.

step6_title  = 빅토리 디펜더 - 대시공격2 (->-> + D 오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 오래 누르면\n상대를 연속으로 공격하는 회전공격을 합니다.

step7_title  = 빅토리 디펜더 - 방어이동 (S + 방향키)
step7_help   = 방어키(S)를 누르고 있으면 방어 상태가 유지되며 이 상\n태에서 방향키를 누르면 그 방향으로 방어를 유지하면서\n상,하,좌,우로 이동할 수 있습니다.

step8_title  = 빅토리 디펜더 - 점프방어 (A + S)
step8_help   = 점프키(A)를 눌러 공중에서 뜬 상태에서 방어키(S)를 누\n르면 점프상태에서도 방어를 할 수 있도록 방어자세를\n취할 수 있습니다.

step9_title  = 빅토리 디펜더 - 토네이도 / 무기스킬(SD)
step9_help   = 토네이도(SD)는 회전하면서 방패의 날로 3연속 공격하는\n스킬입니다. 토네이도의 빠른 3연타 공격이 끝날 때 쯤\n에 점프 또는 기본 공격으로 연결할 수 있습니다.

step10_title  = 빅토리 디펜더 - 프로텍션 / 갑옷스킬(ASD)
step10_help   = 프로텍션(ASD)은 몸을 보호막으로 감싸는 스킬입니다.\n일정 시간 동안 데미지 피해를 무효로 만들어 주지만 낙\n하, 드롭피해 등의 시스템 데미지는 막아주지 못합니다.

step11_title  = 빅토리 디펜더 - 안광 / 투구스킬(AD)
step11_help   = 안광(AD)은 두 눈에서 빔을 발사하는 스킬입니다.\n두 눈에서 발사된 빔을 모두 맞으면 상대는 천천히 쓰러\n지게 되고 이 때 다양한 공격을 연결하기 용이합니다.

step12_title  = 빅토리 디펜더 - 고속비행 / 망토스킬(AS)
step12_help   = 고속비행(AS)은 부스터를 사용해서 비행하는 스킬입니다\n스킬(AS)을 사용한 후 방향키로 전후좌우 이동할 수 있\n으며 점프키(A)를 누르면 고도를 상승시킬 수 있습니다.

step13_title = 빅토리 디펜더 - 국민콤보 ①
step13_help  = ★안광(AD) → 토네이도(SD)\n안광으로 상대를 기절시킨 후 빠른 회전의 토네이도를\n사용하여 3연타로 마무리합니다.

step14_title = 빅토리 디펜더 - 국민콤보 ②
step14_help  = ★안광(AD) → 토네이도(SD) → 점프공격\n안광으로 상대를 기절시킨 후 빠른 회전의 토네이도를\n연결하고 끝날 때 쯤에 점프 공격으로 마무리합니다.

step15_title = 빅토리 디펜더 - 국민콤보 ③
step15_help  = ★안광(AD) → 올려치기 → 기본공격\n안광으로 상대를 기절시킨 후 올려치기를 이용하여 공중\n에 띄우고 떨어질 때 쯤에 기본 공격으로 연타합니다.



[Set14]

max_step = 15

step0_title  = 청룡 관우 - 기본소개
step0_help   = 청룡 관우는 넓은 범위 공격이 가능한 언월도를 자유자\n재로 사용하기 때문에 난전에서 다수를 상대할 때 최고의\n활약을 보여주는 근거리 계열의 용병입니다.

step1_title  = 청룡 관우 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 청룡 관우 - 휘두르기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 휘두르기 공격이 발동됩니다.\n휘두르기는 언월도를 크게 휘둘러 주변의 적들을 한번에\n날려버리는 강력한 범위 공격을 합니다.

step3_title  = 청룡 관우 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)\n를 누르면 대상을 사선으로 베는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 청룡 관우 - 반달베기 (A → D 오래누름)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)\n를 오래 누르면 일직선으로 내려치는 공격을 합니다.\n반달베기에 피격된 대상은 경직상태가 되어 쓰러집니다.

step5_title  = 청룡 관우 - 대시공격 (->-> → D + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 공격키(D)를 누르면 상대를 베는 공격\n을 하며, 이후 D키를 눌러 추가공격이 가능합니다.

step6_title  = 청룡 관우 - 올려치기 (->-> → D 오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 오래 누르면\n대상을 띄워 올리는 대시 공격이 가능합니다.

step7_title  = 청룡 관우 - 튕겨내기 (공격 받는 순간 방어)
step7_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step8_title  = 청룡 관우 - 무쌍난무 / 무기스킬(SD)
step8_help   = 무쌍난무(SD)는 언월도를 연속으로 두 번 크게 휘두르는\n스킬입니다. 스킬 사용 중 스킬키(SD)를 이용해 캔슬을\n할 수 있으며 공중과 다운상태에서도 사용이 가능합니다.

step9_title  = 청룡 관우 - 천지역전 / 갑옷스킬(ASD)
step9_help   = 천지역전(ASD)은 땅을 내리쳐 주변의 상대팀원을 띄우는\n스킬입니다. 범위형 공격으로 다수의 대상을 높게 띄워\n낙하데미지를 주는 강력한 스킬입니다.

step10_title  = 청룡 관우 - 장풍 / 투구스킬(AD)
step10_help   = 장풍(AD)은 내공의 힘을 모아 상대를 기절시키는 스킬입\n니다. 다운 대상도 타격이 가능하며 대상을 기절 시킨 후\n멀리 밀쳐내기 때문에 추가 공격에도 매우 유용합니다.

step11_title  = 청룡 관우 - 비급연마 / 망토스킬(AS)
step11_help   = 비급연마(AS)는 비급을 사용하여 무기, 갑옷, 투구 스킬\n의 게이지를 모두 채워주는 스킬입니다. 3개 스킬을 한\n번더 사용하여 전투에 우세를 유지할 수 있습니다.

step12_title = 청룡 관우 - 국민콤보 ①
step12_help  = ★장풍(AD) → 올려치기(->-> → D 오래) → 기본공격\n장풍을 사용하여 상대를 기절 상태로 멀리 밀쳐내고 올려\n치기로 대상을 띄워 기본 공격으로 마무리 합니다.

step13_title = 청룡 관우 - 국민콤보 ②
step13_help  = ★천지역전(ASD) → 장풍(AD)\n넘어진 상대를 천지역전으로 공중에 띄운 후 떨어지는\n타이밍에 장풍으로 맞추어 멀리 날려 버립니다.

step14_title = 청룡 관우 - 국민콤보 ③
step14_help  = ★천지역전(ASD) → 휘두르기\n넘어진 상대를 천지역전으로 공중에 띄운 후 떨어지는\n타이밍에 휘두르기로 맞추어 마무리합니다.



[Set15]

max_step = 13

step0_title  = 와일드 복서 - 기본소개
step0_help   = 와일드 복서는 바람을 가르는 펀치와 화려한 발놀림으\n로 상대를 정신없이 몰아치는 인파이터 스타일의 근거\n리 계열 용병입니다.

step1_title  = 와일드 복서 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 와일드 복서 - 스트레이트 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 스트레이트가 발동됩니다.\n스트레이트는 빠른 속도로 상대를 타격하여 밀쳐내며\n5연속 타격시 대상을 띄워 추가 공격이 가능합니다.

step3_title  = 와일드 복서 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 펀치로 타격하는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 와일드 복서 - 대시공격 (->-> + D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n빠르게 3연타 하는 대시 공격이 가능합니다.

step5_title  = 와일드 복서 - 반격 (방어 성공시 바로 공격)
step5_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step6_title  = 와일드 복서 - 핵펀치 / 무기스킬(SD)
step6_help   = 핵펀치(SD)는 강력한 펀치로 상대를 높이 띄우는 스킬입니다. 공중 상태에서도 사용이 가능하고 대상이 떨어질때, 낙하피해를 입으며 다운된 대상에게 사용가능합니다.

step7_title  = 와일드 복서 - 인파이팅 / 갑옷스킬(ASD)
step7_help   = 인파이팅(ASD)은 공중 및 지상에서 빠르게 상대에게 접근하여 대상을 띄우는 스킬입니다. 접근 및 가격하는 속도가 빨라 회피하기 어렵고 다운된 대상에게 사용가능합니다.

step8_title  = 와일드 복서 - 전진스텝 / 투구스킬(AD)
step8_help   = 전진스텝(AD)은 상대에게 빠르게 접근하는 스킬입니다.\n스킬 사용시 대상을 관통할 수 있으며 피격중에도 사용이\n가능하여 기습적인 공격 및 회피에 유용한 스킬입니다.

step9_title  = 와일드 복서 - 챔피언 / 망토스킬(AS)
step9_help   = 챔피언(AS)은 챔피언의 위엄으로 상대를 뒤로 물러나게\n만드는 스킬입니다. 주눅 든 상대는 착용 아이템 1개를\n떨어뜨리면서 뒤쪽으로 일정 거리를 물러나게 됩니다.

step10_title = 와일드 복서 - 국민콤보 ①
step10_help  = ★대시공격(->-> + D) → 스트레이트(D오래) → 기본공격\n대시공격(->-> + D)으로 대상을 가격하고 스트레이트로\n공중에 띄운 후 기본공격으로 마무리 합니다.

step11_title = 와일드 복서 - 국민콤보 ②
step11_help  = ★스트레이트(D오래) → 스트레이트(D오래) → 기본공격\n스트레이트(D오래)로 대상을 밀치고 다시 스트레이트로\n대상을 가격하여 띄운 후 기본공격으로 마무리합니다.

step12_title = 와일드 복서 - 국민콤보 ③
step12_help  = ★인파이팅(ASD) → 핵펀치(SD) → 기본공격\n인파이팅으로 띄운 후 바닥에 닿기 전에 핵펀치로 더 높\n이 띄워서 낙하 피해 발생시 기본 공격으로 연타합니다.



[Set16]

max_step = 14

step0_title  = 바이킹 스벤 - 기본소개
step0_help   = 바이킹 스벤은 양손 도끼를 느릿느릿 휘둘러 공격하지만\n대상이 맞을 경우 그 파괴력은 상상을 초월할 정도로 강\n력한 근거리 계열 용병입니다.

step1_title  = 바이킹 스벤 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 바이킹 스벤 - 배쉬 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 상대의 방어를 무시하고 경직\n시키는 배쉬 공격이 발동됩니다. 기본 공격과 섞어서 사\n용하면 전투에서 쉽게 우위를 차지할 수 있습니다.

step3_title  = 바이킹 스벤 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 도끼로 내려찍는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 바이킹 스벤 - 대시공격 (->-> → D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n높이 띄우는 대시 공격이 가능합니다.

step5_title  = 바이킹 스벤 - 대시배쉬 (->-> → D 오래누름)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 오래 누르면\n대상을 내려찍어 다운시키는 공격이 가능합니다.

step6_title  = 바이킹 스벤 - 튕겨내기 (공격 받는 순간 방어)
step6_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step7_title  = 바이킹 스벤 - 댄싱엑스 / 무기스킬(SD)
step7_help   = 댄싱엑스(SD)는 도끼를 춤추듯 휘두르며 공격하는 스킬\n입니다. 점프 중 사용 가능하며, 방향키를  같이 입력하\n면 입력된 방향으로 상대를 내려찍는 공격을 합니다.

step8_title  = 바이킹 스벤 - 보디체크 / 갑옷스킬(ASD)
step8_help   = 보디체크(ASD)는 어깨로 들이받아 기절시키는 스킬입니\n다. 점프 중 사용 가능하며,  방향키를 같이 입력하면 입\n력된 방향으로 방향을 틀어서 공격을 합니다.

step9_title  = 바이킹 스벤 - 카우포크 / 투구스킬(AD)
step9_help   = 카우포크(AD)는 뾰족한 뿔로 상대를 찍어 뒤로 날려보내\n는 스킬입니다. 뿔로 찍어서 상대를 뒤로 날려버리는 공격\n을 하며, 피격 중 사용 가능합니다.

step10_title  = 바이킹 스벤 - 백가드 / 망토스킬(AS)
step10_help   = 백가드(AS)는 등에 장착된 방패로 후방 공격을 막아주는\n스킬입니다. 뒤에서 들어오는 공격을 캔슬시켜 줄 뿐만\n아니라 피해 데미지도 ½로 줄여줍니다.

step11_title = 바이킹 스벤 - 국민콤보 ①
step11_help  = ★보디체크(ASD) → 카우포크(AD)\n보디체크로 상대를 기습하여 기절시킨 후 카우포크로\n찍어서 뒤쪽으로 날려 보냅니다.

step12_title = 바이킹 스벤 - 국민콤보 ②
step12_help  = ★보디체크(ASD) → 대시공격 → 점프공격\n보디체크로 상대를 기절시킨 후 대시 공격으로 공중에\n띄우고 점프 공격을 사용하여 마무리합니다.

step13_title = 바이킹 스벤 - 국민콤보 ③
step13_help  = ★카우포크(AD) → 뒤돌아서 → 점프공격\n카우포크로 상대를 뒤쪽으로 날린 후 잽싸게 뒤로 돌아\n서 점프 공격으로 깔끔하게 마무리합니다.


[Set17]

max_step = 15

step0_title  = 카게 닌자 - 기본소개
step0_help   = 카게 닌자는 빠른 움직임과 다양한 공격 방식을 통하여\n상대의 정신을 쏙 빼놓는 게릴라 플레이에 특화된 근거\n리 계열 용병입니다.

step1_title  = 카게 닌자 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 카게 닌자 - 발차기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 발차기 공격이 발동됩니다.\n상대를 날려버리는 공격이 부족한 닌자에게 다른 공격과\n섞어서 마무리 공격으로 사용하기에 매우 유용합니다.

step3_title  = 카게 닌자 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 수직으로 베는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 카게 닌자 - 이중점프 (A 두번 누름)
step4_help   = 점프한 상태에서 다시 점프키(A)를 누르면 공중에서 한\n번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수\n있으며 이때 공격키를 누르면 점프 공격도 가능합니다.

step5_title  = 카게 닌자 - 대시공격 (->-> + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상에\n게 빠르게 접근하여 타격하는 대시 공격이 가능합니다.

step6_title  = 카게 닌자 - 이중 대시공격 (->-> + D,D)
step6_help   = 대시공격 중에 공격키(D)를 한번 더 입력하면 대시공격\n이 한번 더 가능합니다. 이때 방향키를 같이 입력하면\n입력한 방향으로 전환하여 대시 공격을 합니다.

step7_title  = 카게 닌자 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다.\n카케 닌자는 대상을 빠르게 지나가면서 공격한 후, 대상의\n뒤에서 한번 더 공격하는 반격을 합니다.

step8_title  = 카게 닌자 - 선풍참 / 무기스킬(SD)
step8_help   = 선풍참(SD)은 몸을 빠르게 회전시켜서 3연속 베는 스킬\n입니다. 상대가 마지막 공격을 맞으면 살짝 위로 띄워지\n기 때문에 추가 공격을 쉽게 연결할 수 있습니다.

step9_title  = 카게 닌자 - 수리검 / 갑옷스킬(ASD)
step9_help   = 수리검(ASD)은 수리검을 꺼내 던지는 스킬입니다. 점프\n중 사용할 수 있으며 맞으면 짧은 경직 상태가 되며, 점\n프 공격 시 좀 더 긴 경직을 만들 수 있습니다.

step10_title  = 카게 닌자 - 인법술 / 투구스킬(AD)
step10_help   = 인법술(AD)은 짧은 거리를 빠르게 순간 이동하는 스킬입\n니다. 가까운 상대의 뒤쪽으로 순간이동 하며, 피격\n중에도 사용 가능합니다.

step11_title  = 카게 닌자 - 포획술 / 망토스킬(AS)
step11_help   = 포획술(AS)은 목도리를 날려 상대를 빠르게 당겨오는 스\n킬입니다. 드롭존을 등지고 사용하면 멀리 있는 상대도\n끌어 당겨서 드롭존으로 떨어뜨릴 수 있습니다.

step12_title = 카게 닌자 - 국민콤보 ①
step12_help  = ★포획술(AS) → 선풍참(SD)\n포획술로 대상을 공격 가능 범위로 당겨온 후 3연속 베\n는 선풍참으로 마무리합니다.

step13_title = 카게 닌자 - 국민콤보 ②
step13_help  = ★포획술(AS) → 수리검(ASD) → 발차기\n포획술로 대상을 당겨온 후 수리검을 사용하여 움직이지\n못하게 경직시키고 발차기로 마무리합니다.

step14_title = 카게 닌자 - 국민콤보 ③
step14_help  = ★수리검(ASD) → 점프공격 → 선풍참(SD) → 발차기\n수리검과 점프공격의 연속 공격으로 강한 경직을 만들어\n깔끔하게 선풍참으로 연타한 후 발차기로 마무리합니다.




[Set18]

max_step = 14

step0_title  = 머스킷티어 - 기본소개
step0_help   = 머스킷티어는 매우 긴 총알 사거리를 기반으로 방심한\n적군 하나하나를 빠르게 제거하는 저격 전문의 원거리\n계열 용병입니다.

step1_title  = 머스킷티어 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 머스킷티어 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며\n사정거리 내 대상을 자동으로 조준해줍니다. 조준된 상\n태에서 공격키를 떼면 대상에게 총알을 발사합니다.

step3_title  = 머스킷티어 - 정조준 (조준 유지)
step3_help   = 대상을 조준 후 일정시간 유지하면 정조준이 됩니다.\n정조준시 총알을 발사하면 총알 속도 및 공격력이 증\n가되며 총알에 맞은 대상은 강한 경직에 걸리게 됩니다.

step4_title  = 머스킷티어 - 점프사격 (A→D)
step4_help   = 점프를 한 후 공격키를 누르면 점프 사격이 됩니다.\n점프 사격 역시 공격키를 오래 누르면 사정거리 내 대상\n을 조준하여 사격할 수 있으나 정조준은 되지 않습니다.

step5_title  = 머스킷티어 - 하이점프 (A 오래)
step5_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어\n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step6_title  = 머스킷티어 - 장전 (S 오래)
step6_help   = 방어키(S)를 오래 누르고 있거나 총알이 한발도 없을 경\n우 공격키를 누르면 장전이 발동됩니다. 장전 중 방향키를\n빠르게 두번 누르면 구르기를 사용할 수 있습니다.

step7_title  = 머스킷티어 - 구르기 (->->)
step7_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동\n및 공격을 회피하는 구르기를 사용할 수 있습니다.

step8_title  = 머스킷티어 - 헤드샷 / 무기스킬(SD)
step8_help   = 헤드샷(SD)은 총탄으로 상대를 저격하는 스킬입니다.\n조준된 상태에서 공격키(D)를 유지하고 방어키(S)를 누\n르면 조준된 대상에게 강력한 총탄을 발사합니다.

step9_title  = 머스킷티어 - 대포 / 갑옷스킬(ASD)
step9_help   = 대포(ASD)는 현재 위치에 대포를 설치하는 스킬입니다.\n설치된 대포는 전방을 향하여 3회의 강력한 포탄을 발사\n하여 적진의 넓은 범위를 타격할 수 있습니다.

step10_title = 머스킷티어 - 이글아이 / 투구스킬(AD)
step10_help  = 이글아이(AD)는 넓은 시야를 밝혀주면서 데미지 및 밀림\n거리를 증가시켜주는 패시브 스킬입니다. 이글아이의 넓\n은시야를 통해 전장 상황을 파악하고 대처할 수 있습니다.

step11_title = 머스킷티어 - 백병전 / 망토스킬(AS)
step11_help  = 백병전(AS)은 검으로 대상을 찌르고 발로 강하게 걷어\n차는 공격을 합니다. 발로 찰 때 방향 전환이 가능하며\n연속으로 2타를 맞을 경우 강한 경직 상태가 됩니다.

step12_title = 머스킷티어 - 국민콤보 ①
step12_help  = ★백병전(AS) → 헤드샷(SD)\n백병전을 이용하여 상대를 기절시킨 후 헤드샷으로 빠르\n게 마무리 사격을 합니다.

step13_title = 머스킷티어 - 국민콤보 ②
step13_help  = ★백병전(AS) → 정조준 사격\n백병전을 이용하여 상대를 기절시킨 후 헤드샷을 사용할\n수 없을 때 정조준으로 마무리 사격을 합니다.



[Set19]

max_step = 14

step0_title  = 태권 무도가 - 기본소개
step0_help   = 태권 무도가는 태권도의 강력하고 화려한 발차기를 시\n작으로 폭풍처럼 휘몰아치는 연속 공격이 특기인 근거\n리 계열 용병입니다.

step1_title  = 태권 무도가 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 태권 무도가 - 내려차기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 내려차기 공격이 발동됩니다.\n내려차기 공격은 상대를 빠른 속도로 타격하여 띄울 수\n있기 때문에 다양한 공격으로 연결할 수 있습니다.

step3_title  = 태권 무도가 - 점프공격 (A → D → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 발로 2연타하는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 태권 무도가 - 대시공격 (->-> + D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n2연속 발차기로 타격하는 대시 공격이 가능합니다.

step5_title  = 태권 무도가 - 이중 대시공격 (->-> + D,D)
step5_help   = 대시공격 중에 공격키(D)를 한번 더 입력하면 대시공격\n이 한번 더 가능합니다. 이때 방향키를 같이 입력하면\n입력한 방향으로 전환하여 대시 공격을 합니다.

step6_title  = 태권 무도가 - 반격 (방어 성공시 바로 공격)
step6_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step7_title  = 태권 무도가 - 정권지르기 / 무기스킬(SD)
step7_help   = 정권지르기(SD)는 정권을 내질러서 기절시키는 스킬입니\n다. 공중에서도 사용할수 있으며, 공중에서 사용 시 뒤\n돌려차기로 대상을 공격합니다.

step8_title  = 태권 무도가 - 이단돌려차기 / 갑옷스킬(ASD)
step8_help   = 이단돌려차기(ASD)는 상대를 2회 연속 차서 공중에 띄우\n는 스킬입니다. 공중에서도 사용할 수 있으며, 공중에서\n사용 시 3연타 대상을 공격합니다.

step9_title  = 태권 무도가 - 낙법 / 투구스킬(AD)
step9_help   = 낙법(AD)은 다운 공격을 받았을 때 방어키(S) 또는 점프키(A)를 사용하여 착지하게 해주는 패시브 스킬입니다. 넘어지지 않고 착지할 수 있어 공격을 이어갈 수 있습니다.

step10_title  = 태권 무도가 - 기합 / 망토스킬(AS)
step10_help   = 기합(AS)은 순간적인 집중을 통하여 게이지 회복이 가장\n낮은 스킬 게이지를 즉시 채워주는 스킬입니다. 기합을\n이용하면 방금 사용한 스킬도 다시 사용할 수 있습니다.

step11_title = 태권 무도가 - 국민콤보 ①
step11_help  = ★정권지르기(SD) → 이단 돌려차기(ASD)\n정권지르기로 상대를 기절시킨 후 이단 돌려차기를 사용\n하여 연타 공격으로 마무리합니다.

step12_title = 태권 무도가 - 국민콤보 ②
step12_help  = ★이단 돌려차기(ASD) → 점프공격\n넘어진 대상을 이단 돌려차기를 사용하여 공중에 띄운\n후 점프 공격으로 2연속 발차기로 마무리합니다.

step13_title = 태권 무도가 - 국민콤보 ③
step13_help  = ★정권지르기(SD) → 내려차기 → 기본공격\n정권지르기로 상대를 기절시킨 후 내려차기를 사용하여\n공중에 띄우고 떨어질 때 기본 공격으로 연타합니다.




[Set20]

max_step = 15

step0_title  = 암흑 주술사 - 기본소개
step0_help   = 암흑 주술사는 강력하고 사악한 암흑 주술을 사용하여\n상대의 정신을 자유자재로 쥐고 흔드는 마인드 컨트롤\n전문인 마법 계열 용병입니다.

step1_title  = 암흑 주술사 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 암흑 주술사 - 마법차징 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 무기 스킬의 게이지 회복 속\n도가 1.5배 증가하며, 소환된 마법진을 방향키로 조종하\n여 원하는 위치에 무기 스킬을 사용할 수 있습니다.

step3_title  = 암흑 주술사 - 마법방어 (S 누름)
step3_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든\n방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방\n어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step4_title  = 암흑 주술사 - 튕겨내기 (공격 받는 순간 방어)
step4_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step5_title  = 암흑 주술사 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 해골손을 길게 뻗어서 상대를 끌어 당기는 공격을\n사용 할 수 있습니다

step6_title  = 암흑 주술사 - 이중점프 (A 두번 누름)
step6_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동되며, 공격키(D)를 누\n르면 지면을 내려 찍는 점프 공격을 합니다.

step7_title  = 암흑 주술사 - 해골손 (->->)
step7_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두번 누르면 그 방향으로 해골손을 길게 뻗어서 상\n대를 끌어 당기는 해골손을 사용할 수 있습니다.

step8_title  = 암흑 주술사 - 현혹의주술 / 무기스킬(SD)
step8_help   = 현혹의주술(SD)은 상대가 자신을 따라 다니게 하는 스킬\n입니다. 현혹의 주술에 걸린 대상은 스킬이 끝날 때까지\n지속적으로 데미지를 입게 됩니다.

step9_title  = 암흑 주술사 - 응징의손길 / 갑옷스킬(ASD)
step9_help   = 응징의손길(ASD)은 해골손으로 상대를 멀리 날려보내는\n스킬입니다. 해골손을 전방으로 길게 뻗어서 상대를 멀\n리 날려 보낼 수 있어 마무리 공격으로 유용합니다.

step10_title  = 암흑 주술사 - 피의계약 / 투구스킬(AD)
step10_help   = 피의계약(AD)은 체력을 깎아서 스킬 게이지를 채우는 스\n킬입니다. 체력을 스킬 게이지로 바꾸어 사용할 수 있으\n나 심하게 사용할 경우 죽음으로 연결될 수도 있습니다.

step11_title  = 암흑 주술사 - 혼돈의인형 / 망토스킬(AS)
step11_help   = 혼돈의인형(AS)은 방향키를 섞어서 혼란에 빠뜨리는 스\n킬입니다. 상대가 방향을 컨트롤하기 어렵게 만들고, 효과\n가 끝나면 상대를 잠시동안 경직 시킵니다.

step12_title = 암흑 주술사 - 국민콤보 ①
step12_help  = ★현혹의 주술(SD) → 응징의 손길(ASD)\n현혹의 주술에 끌려오는 상대를 응징의 손길로 강하게\n타격하여 멀리 날려보내는 것으로 마무리합니다.

step13_title = 암흑 주술사 - 국민콤보 ②
step13_help  = ★현혹의 주술(SD) → 대시공격\n현혹의주술에 상대가 자신의 앞까지 끌려 왔을 때 대시\n공격으로 타격하여 뒤쪽으로 넘겨서 마무리합니다.

step14_title = 암흑 주술사 - 국민콤보 ③
step14_help  = ★대시공격 → 뒤돌아서 → 기본공격\n대시 공격으로 상대를 뒤쪽으로 넘긴 후 빠르게 뒤로 돌\n아서 기본 공격으로 연타합니다.



[Set21]

max_step = 14

step0_title  = 스마일 조커 - 기본소개
step0_help   = 스마일 조커는 코믹한 복장에 뿅망치를 들고 전장을 헤\n집고 다니면서 상대를 웃겼다 울렸다 하는 장난스런 플\n레이가 전문인 근거리 계열 용병입니다.

step1_title  = 스마일 조커 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 스마일 조커 - 팡팡찍기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 팡팡찍기 공격이 발동됩니다.\n팡팡찍기는 넘어진 상대도 공격할 수 있습니다.\n2번 연속으로 사용가능하며 3번째는 연타 공격을 합니다.

step3_title  = 스마일 조커 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를\n누르면 대상을 수직으로 내려치는 점프 공격을 합니다.\n공격 시 방향키를 입력하면 방향전환하여 공격 합니다.

step4_title  = 스마일 조커 - 이중점프 (A 두번 누름)
step4_help   = 점프한 상태에서 다시 점프키(A)를 누르면 공중에서 한\n번 더 점프가 발동되어 좀더 높이 또는 멀리 이동할 수\n있으며 이 때 공격키를 누르면 점프 공격도 가능합니다.

step5_title  = 스마일 조커 - 대시공격1 (->-> + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n일정 시간 경직시키는 대시 공격이 가능합니다.

step6_title  = 스마일 조커 - 대시공격2 (->-> + D 오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 오래 누르면 대\n상을 공중에 띄우는 대시 공격이 가능합니다.

step7_title  = 스마일 조커 - 100t해머 / 무기스킬(SD)
step7_help   = 100t해머(SD)는 거대한 해머로 3번 내려치는 스킬입니\n다. 때릴때 마다 방향전환이 가능하고 맞게되면 땅에 눌러\n붙게되어 팡팡찍기 등 추가 공격이 가능합니다.

step8_title  = 스마일 조커 - 꼬꼬마조커 / 갑옷스킬(ASD)
step8_help   = 꼬꼬마조커(ASD)는 작은 몸집의 조커로 변신하는 스킬입\n니다. 몸집이 작아지고 이동이 빨라지며, 4단 점프를 스킬\n지속 시간동안 사용할 수 있습니다.

step9_title  = 스마일 조커 - 웃음상자 / 투구스킬(AD)
step9_help   = 웃음상자(AD)를 터뜨려 상대를 웃게 만드는 스킬입니다.\n상대가 정신없이 웃는 틈을 이용하여 추가 공격을 손쉽\n게 연결할 수 있습니다.

step10_title  = 스마일 조커 - 풍선띄우기 / 망토스킬(AS)
step10_help   = 풍선띄우기(AS)는 상대를 풍선에 매달아 띄워보내는 스\n킬입니다. 풍선에 매달린 대상을 점프 공격 등으로 추가\n타격하여 원하는 방향으로 보낼 수 있습니다.

step11_title = 스마일 조커 - 국민콤보 ①
step11_help  = ★100t 해머(SD) → 풍선 띄우기(AS)\n100t 해머로 대상을 납작하게 누른 후 풍선에 매달아\n공중에 띄워 보내는 것으로 마무리합니다.

step12_title = 스마일 조커 - 국민콤보 ②
step12_help  = ★100t 해머(SD) → 팡팡찍기 2회\n100t 해머로 대상을 납작하게 누른 후 팡팡찍기를 이용한\n2회 연속 공격으로 마무리합니다.

step13_title = 스마일 조커 - 국민콤보 ③
step13_help  = ★풍선 띄우기(AS) → 점프공격\n상대를 풍선에 매달아 공중에 띄운 후 점프 공격을 사용\n하여 드롭존 방향으로 밀어서 마무리합니다.



[Set22]

max_step = 17

step0_title  = 트레져 헌터 - 기본소개
step0_help   = 트레져 헌터는 확산과 관통 효과를 보유한 산탄총을 능\n숙하게 사용하여 다수를 상대할 때 그 진가가 발휘되는\n원거리 계열 용병입니다.

step1_title  = 트레져 헌터 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 트레져 헌터 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며\n사정거리 내 대상을 자동으로 조준해줍니다. 조준된 상\n태에서 공격키를 떼면 대상에게 총알을 발사합니다.

step3_title  = 트레져 헌터 - 정조준 (조준 유지)
step3_help   = 대상을 조준 후 일정시간 유지하면 정조준이 됩니다.\n정조준에서 총알을 발사하면 총알 속도 및 공격력이 증\n가하며 총알에 맞은 대상은 기절 상태가 됩니다.

step4_title  = 트레져 헌터 - 점프사격 (A →D)
step4_help   = 점프를 한 후 공격키를 누르면 점프 사격이 됩니다.\n점프사격 역시 공격키를 오래 누르면 사정거리 내 대상\n을 조준하여 사격할 수 있으나 정조준은 되지 않습니다.

step5_title  = 트레져 헌터 - 하이점프 (A 오래)
step5_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어\n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step6_title  = 트레져 헌터 - 장전 (S 오래)
step6_help   = 방어키(S)를 오래 누르고 있거나 총알이 한발도 없을 경\n우 공격키를 누르면 장전이 발동됩니다. 총알이 없으면\n사격이 불가능하므로 틈틈이 장전을 해주어야 합니다.

step7_title  = 트레져 헌터 - 점프 장전 (A →S )
step7_help   = 점프를 한 후 방어키(S)를 누르면 총알 한발씩 장전을\n합니다. 점프장전은 점프를 하면서 장전을 하기 때문에 상\n대의 공격을 피하며 장전할 수 있습니다.

step8_title  = 트레져 헌터 - 구르기 (->->)
step8_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동\n및 공격을 회피하는 구르기를 사용할 수 있습니다.

step9_title  = 트레져 헌터 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step10_title  = 트레져 헌터 - 버스터샷 / 무기스킬(SD)
step10_help   = 버스터샷(SD)은 강력한 관통샷으로 상대를 날려버리는\n스킬입니다. 조준된 상태에서 공격키(D)를 유지하고 방\n어키(S)를 누르면 조준된 대상에게 총알을 발사합니다.

step11_title  = 트레져 헌터 - 횃불 / 갑옷스킬(ASD)
step11_help   = 횃불(ASD)은 투척이 가능한 횃불을 손에 꺼내 드는 스킬\n입니다. 횃불에 맞으면 불에 타게 되고 횃불이 땅에 떨\n어지게 되면 불이 번져서 2차 피해를 줄 수 있습니다.

step12_title = 트레져 헌터 - 포복 / 투구스킬(AD)
step12_help  = 포복(AD)은 제자리에 폴짝~ 엎드리는 스킬입니다.\n엎드린 상태에서 방향키를 누르면 그 방향으로 굴러서 공격을 하고 스킬키(AD)를 누르면 그대로 일어납니다.

step13_title = 트레져 헌터 - 순간포착 / 망토스킬(AS)
step13_help  = 순간포착(AS)은 사진 촬영 포즈를 취하게 하는 스킬입니\n다. 넓은 범위를 빠르게 촬영하기 때문에 상대가 피하기\n쉽지 않으며 포즈를 취한 동안 공격이 가능합니다.

step14_title = 트레져헌터 - 국민콤보 ①
step14_help  = ★순간 포착(AS) → 버스터샷(SD)\n순간 포착으로 상대를 경직시킨 후 강력한 버스터 샷을\n사용하여 날려 보내는 것으로 마무리합니다.

step15_title = 트레져헌터 - 국민콤보 ②
step15_help  = ★넘어진 대상 → 횃불(ASD) → 버스터샷(SD)\n넘어진 대상 위에 횃불을 던져서 화염 공격으로 공중에\n뜨게 만든 후 버스터샷으로 깔끔하게 마무리합니다.

step16_title = 트레져헌터 - 국민콤보 ③
step16_help  = ★순간포착(AS) → 2회 연속 사격 → 횃불(ASD)\n순간포착으로 상대를 경직시킨 후 빠른 연속 사격을 통\n해 천천히 넘어질 때 횃불 투척으로 마무리합니다.



[Set23]

max_step = 13

step0_title  = 사신 - 기본소개
step0_help   = 사신은 거대한 낫으로 공중에 띄운 후 연속 베기로 사\n정없이 공격하여 황천길로 보내주는 근거리 계열 용병\n입니다.

step1_title  = 사신 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 사신 - 악귀참 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 상대의 방어를 무시하고 공중\n에 띄우는 악귀참 공격이 발동됩니다. 악귀참이 성공할\n경우 공중 연속 베기로 연결하여 연타할 수 있습니다.

step3_title  = 사신 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 낫으로 올려 베는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 사신 - 연속베기(A → D → D → D → D)
step4_help   = 점프중 공격키를 연타하면 4연속 공격이 가능합니다.\n연속 베기는 공중에 뜬 대상을 연타할 때 유용하며 마지\n막 베기가 성공하면 대상을 멀리 날려 보냅니다.

step5_title  = 사신 - 대시공격 (->-> → D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n경직시키며 추가공격 성공시 대상을 띄울 수 있습니다.

step6_title  = 사신 - 멸살귀참 / 무기스킬(SD)
step6_help   = 멸살귀참(SD)은 빠르게 접근하여 베어올리는 스킬입니다\n빠른 접근으로 상대를 베어올림과 동시에 점프하여 공중\n연속베기가 가능하며 다운된 대상도 타격가능합니다.

step7_title  = 사신 - 영혼구속 / 갑옷스킬(ASD)
step7_help   = 영혼구속(ASD)은 사슬을 던져 공중에 묶어두는 스킬입니\n다. 전방으로 빠르게 사슬을 던져서 상대를 공중에 잠시\n묶어두기 때문에 악귀참 등으로 연결하기 유용합니다.

step8_title  = 사신 - 암습 / 투구스킬(AD)
step8_help   = 암습(AD)은 가까운 대상의 뒤로 순간 이동하는 스킬입니\n다. 피격도중 사용이 가능하며 상대의 등 뒤로 이동하\n므로 상대를 쉽게 제압할 수 있는 강력한 스킬입니다.

step9_title  = 사신 - 악령소환 / 망토스킬(AS)
step9_help   = 악령소환(AS)은 주변을 도는 악령 2개를 소환하는 스킬\n입니다. 악령에 부딪치면 혼란 상태가 되어 일정 시간\n행동할 수 없기 때문에 다양한 연계 공격이 가능합니다.

step10_title = 사신 - 국민콤보 ①
step10_help  = ★멸살귀참(SD) → 연속베기\n멸살귀참으로 빠르게 접근하여 상대를 공중에 띄워 올린\n후 연속 베기로 4연타하여 마무리합니다.

step11_title = 사신 - 국민콤보 ②
step11_help  = ★영혼구속(ASD) → 악귀참 → 연속베기\n영혼구속으로 상대를 공중에 잡아둔 후 악귀참을 사용하\n여 높이 띄운 후 연속 베기로 4연타하여 마무리합니다.

step12_title = 사신 - 국민콤보 ③
step12_help  = ★악령소환(AS) → 암습(AD) → 악귀참 → 연속베기\n악령을 소환한 후 암습으로 상대를 급습하여 경직시키고\n악귀참으로 높이 띄워서 연속 베기로 마무리합니다.



[Set24]

max_step = 14

step0_title  = 라이트닝 메이지 - 기본소개
step0_help   = 라이트닝 메이지는 푸른 빛의 고압 전기를 능숙하게 사\n용하여 상대를 방전이 될 때까지 쉬지 않고 공격하는 \n연타 전문의 마법 계열 용병입니다.

step1_title  = 라이트닝 메이지 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 라이트닝 메이지 - 마법차징 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 마법차징이 발동되어 무기\n스킬의 게이지 회복 속도가 1.5배 증가되어 보다 빠르\n게 무기 스킬을 사용할 수 있습니다.

step3_title  = 라이트닝 메이지 - 마법방어 (S 누름)
step3_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든\n방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방\n어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step4_title  = 라이트닝 메이지 - 이중점프 (A 두번 누름)
step4_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는\n멀리 이동할 수 있게 됩니다.

step5_title  = 라이트닝 메이지 - 점프공격 (A →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대각선 아래로 적들을 관통하는 전기를 방출\n합니다. 방출된 전기는 바닥에 튕겨 공중으로 사라집니다.

step6_title  = 라이트닝 메이지 - 대시공격 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n천천히 넘어뜨리는 감전타를 사용할 수 있습니다.

step7_title  = 라이트닝 메이지 - 썬더스톰 / 무기스킬(SD)
step7_help   = 썬더스톰(SD)을 소환하여 조종할 수 있는 스킬입니다.\n방향키를 이용하여 썬더스톰을 조종할 수 있으며 다시 스킬(SD)키를 사용하여 썬더스톰을 멈출 수 있습니다.

step8_title  = 라이트닝 메이지 - 라이트닝 / 갑옷스킬(ASD)
step8_help   = 라이트닝(ASD)은 지속적인 전기를 방출하는 스킬입니다.\n대상은 넘어지지 않으며, 감전피해를 받게되며 최대\n 4번까지 대상을 감전시킬 수 있습니다.

step9_title  = 라이트닝 메이지 - 라이트닝실드 / 투구스킬(AD)
step9_help   = 라이트닝실드(AD)는 전기로 자신을 공격한 대상을 감전\n시키며, 아이템 드랍을 방지해 줍니다. 피격중 사용\n가능하며, 스킬(AD)키를 이용하여 끄고 켤 수 있습니다.

step10_title  = 라이트닝 메이지 - 체인라이트닝 / 망토스킬(AS)
step10_help   = 체인라이트닝(AS)은 다수의 대상을 연쇄적으로 감전\n시키는 스킬입니다. 쓰러진 적들도 잠시동안 강제로\n기립시키며, 점프중 사용 가능 합니다.

step11_title  = 라이트닝 메이지 - 국민콤보 ①
step11_help   = ★썬더스톰(SD) → 감전타 2회\n썬더스톰을 조종하여 상대를 3회 연속 감전시킨 후 빠르\n게 감전타를 2회 연속 공격해서 마무리합니다.

step12_title = 라이트닝 메이지 - 국민콤보 ②
step12_help  = ★썬더스톰(SD) → 감전타 2회 → 체인라이트닝(AS)\n썬더스톰으로 상대를 3회 연속 감전시킨 후 감전타를 연\n타하여 넘어지면 체인 라이트닝으로 마무리합니다.

step13_title = 라이트닝 메이지 - 국민콤보 ③
step13_help  = ★썬더스톰(SD) → 감전타 → 라이트닝(ASD) → 감전타\n썬더스톰에 감전된 대상을 감전타로 경직시킨 후 라이트\n닝으로 다시 일으켜서 감전타를 연타하여 마무리합니다.



[Set25]

max_step = 14

step0_title  = 마이티 팔라딘 - 기본소개
step0_help   = 마이티 팔라딘은 육중한 해머에 온 힘을 집중하여 휘두\n르면 마치 홈런처럼 대상을 멀리 날려 버리는 능력을 보\n유한 근거리 계열 용병입니다.

step1_title  = 마이티 팔라딘 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 마이티 팔라딘 - 파워차징 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 파워차징 공격이 발동됩니다.\n공격키를 누르고 있는 동안 파워가 지속적으로 증가하여\n대상을 공격시 매우 멀리 날려 버릴 수 있습니다.

step3_title  = 마이티 팔라딘 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 바닥을 강하게 내려찍는 점프 공격을 합니다.\n점프 공격은 넘어진 대상을 공격할 때 유용합니다.

step4_title  = 마이티 팔라딘 - 대시공격1 (->-> → D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n강하게 경직시키는 대시 공격이 가능합니다.

step5_title  = 마이티 팔라딘 - 대시공격2 (->-> → D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 오래 누르면 대\n상을 공중에 띄우는 대시 공격이 가능합니다.

step6_title  = 마이티 팔라딘 - 튕겨내기 (공격 받는 순간 방어)
step6_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step7_title  = 마이티 팔라딘 - 윈드밀 / 무기스킬(SD)
step7_help   = 윈드밀(SD)은 육중한 망치를 회전 이동하면서 휘두르는\n스킬입니다. 거대한 망치를 크게 휘두르면서 회전하기\n때문에 넓은 범위를 단숨에 제압할 수 있습니다.

step8_title  = 마이티 팔라딘 - 립어택 / 갑옷스킬(ASD)
step8_help   = 립어택(ASD)은 지정한 위치로 도약 및 착지하여 주변을\n기절시키는 스킬입니다. 먼 거리를 단숨에 접근하여 기\n절시키기 때문에 기습 및 추가 공격에 매우 유용합니다.

step9_title  = 마이티 팔라딘 - 집중의의지 / 투구스킬(AD)
step9_help   = 집중의의지(AD)는 집중을 통해 공격시 밀림을 증가시키\n는 스킬입니다. 일정 시간 증가한 밀림 효과를 통해 간\n단한 공격으로도 대상을 손쉽게 드롭시킬 수 있습니다.

step10_title  = 마이티 팔라딘 - 보호의축복 / 망토스킬(AS)
step10_help   = 보호의축복(AS)은 자신과 팀원을 데미지 피해에서 보호하는 스킬입니다. 다운 또는 피격 중 사용 가능하며, 잠시 동안 자신과 팀원, 모두가 피격 데미지를 받지 않습니다.

step11_title = 마이티 팔라딘 - 국민콤보 ①
step11_help  = ★립어택(ASD) → 윈드밀(SD)\n립어택으로 단숨에 접근하여 상대를 기절시킨 후 윈드밀\n을 사용하여 주변을 모두 날려 버립니다.

step12_title = 마이티 팔라딘 - 국민콤보 ②
step12_help  = ★립어택(ASD) → 파워차징\n립어택으로 단숨에 접근하여 상대를 기절시킨 후 긴 파\n워차징으로 힘을 모아서 대상을 멀리 날려 버립니다.

step13_title = 마이티 팔라딘 - 국민콤보 ③
step13_help  = ★대시공격 → 파워차징 → 점프공격\n대시공격으로 상대를 기절시킨 후 짧은 파워차징으로\n살짝 날리고 점프 공격의 내려찍기로 마무리합니다.



[Set26]

max_step = 13

step0_title  = 마피아 - 기본소개
step0_help   = 마피아는 두 자루의 권총에서 끊임없이 쏟아져 나오는\n총알로 상대를 순식간에 벌집으로 만들 수 있는 연속\n사격 전문인 원거리 계열 용병입니다.

step1_title  = 마피아 - 자동사격 (D 누름유지)
step1_help   = 공격키(D)를 누르고 있으면 사정거리 내에 대상을 자동\n으로 조준 및 사격합니다. 총알이 모두 떨어질 때까지\n사격하고 사격이 끝나면 장전으로 자동 전환됩니다.

step2_title  = 마피아 - 이동사격 (D 누름유지하고 방향키)
step2_help   = 공격키(D)를 누르고 있으면서 방향키를 추가로 누르면\n자동 사격을 하면서 상,하,좌,우로 이동할 수 있습니다.\n이 때 방향키를 연속해서 누르면 전진이동도 가능합니다.

step3_title  = 마피아 - 점프사격 (A → D)
step3_help   = 점프를 한 후 공격키(A)를 누르면 자동 사격이 발동되며\n이 때 공격키를 떼거나, 총알이 떨어지거나, 지면에 착지\n를 하면 자동 사격이 멈추게 됩니다.

step4_title  = 마피아 - 하이점프 (A 오래)
step4_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어\n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step5_title  = 마피아 - 장전 (S 오래)
step5_help   = 방어키(S)를 오래 누르고 있거나 총알이 한발도 없을 경\n우 공격키를 누르면 장전이 발동됩니다. 총알이 없으면\n사격이 불가능하므로 틈틈이 장전을 해주어야 합니다.

step6_title  = 마피아 - 전진이동 (->->)
step6_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 빠른 전진이동을 하며 총\n알 1발을 자동으로 장전합니다.

step7_title  = 마피아 - 빠른장전 / 무기스킬(SD)
step7_help   = 빠른장전(SD)은 쌍권총을 즉시 풀장전 시켜주는 스킬입니다. 스킬 사용 후 D키를 유지하면 바로 사격을 하며, 다운 중 사용 시 방향키 입력으로 해당방향 이동 후 기립합니다

step8_title  = 마피아 - 백스텝봄버 / 갑옷스킬(ASD)
step8_help   = 백스텝봄버(ASD)는 백스텝을 하면서 소형 수류탄을 던지\n는 스킬입니다. 점프,피격 중 사용이 가능하고, 상대를\n띄우기 때문에 자동 사격으로 연결이 가능합니다.

step9_title  = 마피아 - 어퍼킥 / 투구스킬(AD)
step9_help   = 어퍼킥(AD)은 앞으로 나가면서 대상을 걷어차는 스킬입\n니다. 백스텝 봄버와 마찬가지로 상대를 공중에 띄우며\n다운된 상대도 타격할 수 있습니다.

step10_title = 마피아 - 비수 / 망토스킬(AS)
step10_help  = 비수(AS)는 숨겨둔 비수를 꺼내 상대를 찌르는 스킬입니\n다. 피격 중 사용할 수 있으며 공격 성공 시 상대는 천천\n히 쓰러집니다. 공중에 뜬 상대에게도 같은 효과를 냅니다.

step11_title = 마피아 - 국민콤보 ①
step11_help  = ★비수(AS) → 어퍼킥(AD) → 자동사격\n비수로 빠르게 경직시키고 어퍼킥으로 대상을 띄운 후\n전진하면서 자동 사격으로 마무리 공격합니다.

step12_title = 마피아 - 국민콤보 ②
step12_help  = ★비수(AS) → 백스텝 봄버(ASD) →자동사격\n비수로 상대를 경직시킨 후 백스텝 봄버를 사용하여 공중\n에 띄워서 자동 사격으로 마무리 공격합니다.



[Set27]

max_step = 13

step0_title  = 타이거 - 기본소개
step0_help   = 타이거는 날카로운 발톱과 빠른 움직임으로 공중과 지상\n에서 숨 쉴 틈 없이 상대에게 맹공을 퍼붓는 돌격 전문\n의 근거리 계열 용병입니다.

step1_title  = 타이거 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 타이거 - 할퀴기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 할퀴기 공격이 발동됩니다.\n할퀴기는 일정 거리를 빠르게 접근하여 넘어진 대상까지\n발톱으로 할퀴어 날려보내는 공격입니다.

step3_title  = 타이거 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 할퀴는 점프 공격이 가능하며 공격 성공\n시 다시 점프가 되어 점프 공격을 다시 할 수 있습니다.

step4_title  = 타이거 - 이중점프 (A 두번 누름)
step4_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동됩니다. 점프공격 이후\n에도 점프키(A)를 입력하여 사용할 수 있습니다.

step5_title  = 타이거 - 대시공격 (->-> + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n할퀴고 뛰어 오르는 대시 공격이 가능합니다.

step6_title  = 타이거 - 발톱난타 / 무기스킬(SD)
step6_help   = 발톱난타(SD)는 날카로운 발톱으로 난타하면서 전진하는\n스킬입니다. 넘어진 상대까지 5연속 할퀴면서 전진하는\n공격으로 점프 중 사용이 가능합니다.

step7_title  = 타이거 - 회전난타 / 갑옷스킬(ASD)
step7_help   = 회전난타(ASD)는 빠른 회전으로 이동하면서 넘어진 대상\n도 공격하는 스킬입니다. 점프 중에도 사용 가능한 스\n킬로 지상을 이동하면서 상대를 띄워 올립니다.

step8_title  = 타이거 - 포효하기 / 투구스킬(AD)
step8_help   = 포효하기(AD)는 상대를 위협하여 도망가게 만드는 스킬\n입니다. 피격 중이나 점프 중에 사용가능하며, 상대를 뒤\n쪽으로 일정거리 도망가게 한 후 경직상태로 만듭니다.

step9_title  = 타이거 - 뛰어오르기 / 망토스킬(AS)
step9_help   = 뛰어오르기(AS)는 넘어졌을 때 점프할 수 있는 패시브스\n킬입니다. 넘어졌을 때 점프키(A)를 누르면 공중으로 뛰\n어 올라 공격을 피하거나 점프 공격으로 연결합니다.

step10_title  = 타이거 - 국민콤보 ①
step10_help   = ★발톱난타(SD) → 할퀴기\n발톱난타에 맞아서 대상이 뒤로 밀려날 때 할퀴기로 순\n간 접근하여 멀리 날려 버립니다.

step11_title = 타이거 - 국민콤보 ②
step11_help  = ★회전난타(ASD) → 발톱난타(SD)\n회전난타로 대상을 빠르게 넘어뜨린 후 발톱난타를 사용\n하여 시원하게 5연타로 마무리합니다.

step12_title = 타이거 - 국민콤보 ③
step12_help  = ★포효하기(AD) → 할퀴기 → 발톱난타(SD)\n포효로 대상을 경직시킨 후 할퀴기로 빠르게 접근하여\n넘어뜨리고 발톱난타로 5연타하여 마무리합니다.



[Set28]

max_step = 13

step0_title  = 살라딘 - 기본소개
step0_help   = 살라딘은 양손에 장검과 단검을 쥐고 빠른 속도로 상대\n를 관통베기 공격하면서 전장을 휘젓고 다니는 교란 전\n문의 근거리 계열 용병입니다.

step1_title  = 살라딘 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫 타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 살라딘 - 관통베기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 관통베기 공격이 발동됩니다.\n관통베기는 빠른 접근으로 상대를 관통하면서 공격하며\n사용 후 대시 달리기와 점프로 바로 전환할 수 있습니다.

step3_title  = 살라딘 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 사선으로 찌르는 점프 공격을 합니다.\n총 2번 연타공격을 할 수 있습니다.

step4_title  = 살라딘 - 대시공격 (->-> + D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n2연타하여 띄우는 대시 공격이 가능합니다.

step5_title  = 살라딘 - 반격 (방어 성공시 바로 공격)
step5_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step6_title  = 살라딘 - 달빛베기 / 무기스킬(SD)
step6_help   = 달빛베기(SD)는 빠르게 앞뒤로 3회 연속베는 스킬입니다\n빠르게 공격하기 때문에 상대 역습에 안정적이며\n마지막 베기에 성공하면 상대를 기절 시킵니다.

step7_title  = 살라딘 - 스핀킥 / 갑옷스킬(ASD)
step7_help   = 스핀킥(ASD)은 자신의 뒤쪽을 발로 차는 스킬입니다.\n상대에게 뒤를 잡혔거나 관통베기를 하였을 때 유용하게\n사용되며 공격 성공시 대상을 멀리 날려 보냅니다.

step8_title  = 살라딘 - 윈드가드 / 투구스킬(AD)
step8_help   = 윈드가드(AD)는 주변의 대상을 일정 거리 밀어내는 스킬\n입니다. 점프 및 피격 중에도 사용이 가능하며 적팀에\n포위되었을 때 탈출 용도로 매우 유용합니다.

step9_title  = 살라딘 - 캄신 / 망토스킬(AS)
step9_help   = 캄신(AS)은 램프에서 모래폭풍을 소환하는 스킬입니다.\n소환된 모래 폭풍은 전방으로 천천히 이동하며 주변\n대상을 높이 띄워 올려 떨어질 때 강한 피해를 줍니다.

step10_title = 살라딘 - 국민콤보 ①
step10_help  = ★달빛베기(SD) → 캄신(AS) → 기본공격\n달빛베기 후 경직된 대상에게 캄신을 소환하여 하늘로\n띄운 후 떨어진 대상을 기본 4연타로 마무리합니다.

step11_title = 살라딘 - 국민콤보 ②
step11_help  = ★윈드가드(AD) → 달빛베기(SD) → 스핀킥(ASD)\n윈드가드로 대상의 타이밍을 뺏은 후 달빛베기로 경직시\n키고 스핀킥으로 강하게 차서 멀리 날려 보냅니다.

step12_title = 살라딘 - 국민콤보 ③
step12_help  = ★달빛베기(SD) → 대시공격 → 관통베기\n달빛베기후 경직된 상대를 대시공격으로 띄운 후 관통\n베기로 공격하여 날려 보내는 것으로 마무리합니다.



[Set29]

max_step = 14

step0_title  = 데스 나이트 - 기본소개
step0_help   = 데스 나이트는 칠흑같은 대검에 온 힘을 집중하여 사용\n하면 멀리 있는 대상도 빠르게 접근하여 높이 띄우는 특\n기를 보유한 근거리 계열 용병입니다.

step1_title  = 데스 나이트 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 데스 나이트 - 파워차징 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 파워차징 공격이 발동됩니다.\n공격키를 누르고 있는 동안 파워가 지속적으로 증가하며\n풀차징 시 상대의 방어를 무시하고 공격합니다.

step3_title  = 데스 나이트 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 수직으로 베는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 데스 나이트 - 대시공격1 (->-> → D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대\n상을 경직시키는 대시 공격이 가능합니다.

step5_title  = 데스 나이트 - 대시공격2 (->-> → D 오래누름)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면\n대상을 바운딩 시키는 대시 공격이 가능합니다.

step6_title  = 데스 나이트 - 튕겨내기 (공격 받는 순간 방어)
step6_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step7_title  = 데스 나이트 - 데스슬래쉬 / 무기스킬(SD)
step7_help   = 데스슬래쉬(SD)는 대검으로 전방의 넓은 범위를 강하게\n베어 대상을 천천히 넘어지게 만드는 스킬입니다.\n천천히 넘어질 때 다양한 공격으로 연결 가능합니다.

step8_title  = 데스 나이트 - 서먼스컬 / 갑옷스킬(ASD)
step8_help   = 서먼스컬(ASD)은 대상에게 해골을 날려서 타격되면 일정\n거리를 공중으로 끌어오는 스킬입니다.\n끌어오는 동안에 다양한 공격을 연결할 수 있습니다.

step9_title  = 데스 나이트 - 데스로드 / 투구스킬(AD)
step9_help   = 데스로드(AD)는 자신이 움직이는 방향과 동일한 방향으\n로 이동하는 해골을 소환하여 다수의 대상을 연속 공격\n할 수 있는 스킬입니다.

step10_title = 데스 나이트 - 데스오라 / 망토스킬(AS)
step10_help  = 데스오라(AS)는 주변 대상의 이동 속도를 떨어뜨리고\n대시 이동을 할 수 없게 만드는 스킬입니다. 다운상태\n일때 사용이 가능합니다.

step11_title = 데스 나이트 - 국민콤보 ①
step11_help  = ★데스슬래쉬(SD) → 서먼스컬(ASD) → 파워차징\n데스슬래쉬로 경직시키고 서먼스컬을 사용하여 대상을\n끌어올때 파워차징으로 마무리합니다.

step12_title = 데스 나이트 - 국민콤보 ②
step12_help  = ★데스로드(AD) → 파워차징 → 기본공격\n데스로드를 소환하여 대상을 난타하는 중에 파워차징을\n사용하여 공중에 띄운 후 기본 공격으로 마무리합니다.

step13_title = 데스 나이트 - 국민콤보 ③
step13_help  = ★파워차징 → 파워차징 → 기본공격\n오래모은 파워차징으로 대상을 높게 띄운 후 떨어질 때 파\n워차징으로 다시 띄우고 기본 공격으로 마무리합니다.



[Set30]

max_step = 14

step0_title  = 솔 배드가이 - 기본소개
step0_help   = 솔 배드가이는 봉염검을 사용한 5연속 베기와 공중대시\n를 비롯한 각종 공중 스킬을 활용한 연속 공격이 특기인\n근거리 계열의 프리미엄 용병입니다.

step1_title  = 솔 배드가이 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 솔 배드가이 - 개틀링 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 5연속 베기가 발동됩니다.\n5연속 베기 공격중 점프키(A)를 누르면 베기 공격을 중\n단하고 점프가 발동되어 다른 동작을 할 수 있습니다.

step3_title  = 솔 배드가이 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 2연속 베는 점프 공격을 합니다.\n추가공격 성공시 대상은 천천히 쓰러지게 됩니다.

step4_title  = 솔 배드가이 - 공중대시 (A → ->->)
step4_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게\n직선 이동을 하는 공중 대시가 발동됩니다.

step5_title  = 솔 배드가이 - 대시공격 (->-> → D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 발\n로 대상을 내려차서 띄우는 공격을 합니다.

step6_title  = 솔 배드가이 - 반격 (방어 성공시 바로 공격)
step6_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step7_title  = 솔 배드가이 - 그랜드바이퍼 / 무기스킬(SD)
step7_help   = 그랜드바이퍼(SD)는 빠르게 접근하여 3연속 공격을 하\n면서 공중으로 뛰어 오르는 스킬입니다. 그랜드바이퍼가\n끝나면 점프 상태로 전환되어 다른 동작이 가능합니다.

step8_title  = 솔 배드가이 - 라이어트스텀프 / 갑옷스킬(ASD)
step8_help   = 라이어트스텀프(ASD)는 긴거리를 점프 상태로 이동하면\n서 대상을 발로차서 기절시키는 스킬입니다. 라이어트\n스텀프는 공중에서 공격하면 대상을 날려보냅니다.

step9_title  = 솔 배드가이 - 드래곤인스톨 / 투구스킬(AD)
step9_help   = 드래곤인스톨(AD)은 일정 시간 동안 자신의 근접 공격에\n화염 속성을 부여하여 대상의 방어를 무시하고 공격할\n수 있도록 하는 스킬입니다.

step10_title = 솔 배드가이 - 잡아던지기 / 망토스킬(AS)
step10_help  = 잡아던지기(AS)는 대상을 잡아서 자신의 뒤쪽 바닥으로\n던져 튕겨오르게 만드는 스킬입니다.다운된 대상도 잡을\n수 있으며 공중에서 사용시 대상을 전방으로 던집니다.

step11_title = 솔 배드가이 - 국민콤보 ①
step11_help  = ★그랜드바이퍼(SD) → 라이어트스텀프(ASD)\n그랜드바이퍼(SD)를 이용하여 대상을 공중에 띄운후 라\n이어트스텀프의 발차기로 마무리합니다.

step12_title = 솔 배드가이 - 국민콤보 ②
step12_help  = ★잡아던지기(AS) → 라이어트스텀프(ASD)\n잡아던지기(AS)를 사용하여 대상을 뒤쪽으로 던져 튕긴\n후 라이어트스텀프의 발차기로 마무리합니다.

step13_title = 솔 배드가이 - 국민콤보 ③
step13_help  = ★공중대시→그랜드바이퍼(SD)→공중대시→점프공격\n공중대시로 대상에게 접근한 후 그랜드바이퍼를 이용해\n대상을 띄운후 공중대시와 점프공격으로 마무리합니다.



[Set31]
max_step = 14

step0_title  = 헤비 크래셔 - 기본소개
step0_help   = 헤비 크래셔는 단단한 철갑과 육중한 헤비 런쳐의 무장\n을 통하여 전장에 무자비한 폭탄 공격을 끊임없이 퍼붓\n는 특수 계열의 용병입니다.

step1_title  = 헤비 크래셔 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연사 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 헤비 크래셔 - 헤비런쳐 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 전방을 향하여 폭탄을 연속으\n로 발사합니다. 폭탄은 공격키를 떼기기전까지 계속해서\n발사되며 넘어진 대상을 연속 공격할 때 유용합니다.

step3_title  = 헤비 크래셔 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 지면을 내려치는 점프 공격을 합니다.\n점프 공격은 넘어진 대상을 공격할 때 유용합니다.

step4_title  = 헤비 크래셔 - 하이점프 (A 오래)
step4_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프는 일반 점프보다 높이 뛸 수 있어 높은 지형의\n이동 및 보다 강력한 점프 공격을 할 수 있습니다.

step5_title  = 헤비 크래셔 - 슈퍼대시 (->->)
step5_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두번 누르면 그 방향으로 빠르게 이동하는 슈퍼대\n시를 사용할 수 있습니다.

step6_title  = 헤비 크래셔 - 슈퍼대시 공격 (->-> → D)
step6_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를\n빠르게 두 번 누르면 그 방향으로 빠른 이동을 하는 슈퍼\n대시를 하며, 공격키(D)를 누르면 공격을 합니다.

step7_title  = 헤비 크래셔 - 블릿츠 / 무기스킬(SD)
step7_help   = 블릿츠(SD)는 8개 폭탄을 이동하면서 연속 발사하는 스\n킬입니다. 블릿츠는 공격키(D)를 눌러서 헤비런쳐 공격\n을 하는중에 방어키(S)를 눌러서도 사용할 수 있습니다.

step8_title  = 헤비 크래셔 - 크래쉬 / 갑옷스킬(ASD)
step8_help   = 크래쉬(ASD)는 전방으로 몸을 날려서 대상을 날려보내\n는 스킬입니다. 점프중 사용 가능하며, 크래쉬에 맞은\n대상은 강한 충격으로 한동안 일어날 수 없습니다.

step9_title  = 헤비 크래셔 - 전자보호막 / 투구스킬(AD)
step9_help   = 전자보호막(AD)은 일반 공격을 보호해주는 피격 중 사용\n가능한 스킬입니다. AD키로 스킬을 멈출 수 있고, 방\n어파괴 공격이나 넘어지게 되면 보호막이 사라집니다.

step10_title  = 헤비 크래셔 - 탄도미사일 / 망토스킬(AS)
step10_help   = 탄도미사일(AS)은 자신 주변의 가까운 대상을 자동으로\n탐색하여 최대 6발의 미사일을 발사하는 스킬입니다.\n대상에게 근접 사용시 자신도 피해를 받을 수 있습니다

step11_title = 헤비 크래셔 - 국민콤보 ①
step11_help  = ★크래쉬(ASD) → 블릿츠(SD)\n크래쉬로 대상을 넘어뜨린 후 일어나지 못할 때 블릿츠\n를 사용하여 연속 폭탄 공격을 합니다.

step12_title = 헤비 크래셔 - 국민콤보 ②
step12_help  = ★크래쉬(ASD) → 탄도미사일(AS)\n크래쉬로 대상을 넘어뜨린 후 일어나지 못할 때 탄도미\n사일을 사용하여 연속 미사일 공격을 합니다.

step13_title = 헤비 크래셔 - 국민콤보 ③
step13_help  = ★넘어진 대상 → 헤비런쳐\n기본공격 등의 다양한 공격을 활용하여 대상을 넘어뜨린\n후 헤비런쳐를 사용하여 대상을 연속 공격합니다.



[Set32]
max_step = 14

step0_title  = 스페셜 포스 - 기본소개
step0_help   = 스페셜 포스는 단검과 권총을 사용하여 원거리와 근거리\n를 자유롭게 넘나들며 전투를 펼치는 원거리 계열의 프\n리미엄 용병입니다.

step1_title  = 스페셜 포스 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 스페셜 포스 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며\n사정거리 내 대상을 자동으로 조준해 줍니다. 조준된 상\n태에서 공격키를 떼면 대상에게 총알을 발사합니다.

step3_title  = 스페셜 포스 - 정조준 (조준 유지)
step3_help   = 대상을 조준 후 일정시간 유지하면 정조준이 됩니다.\n정조준으로 총알을 발사하면 총알 속도 및 공격력이\n증가되며 총알에 맞은 대상은 날아가 넘어지게 됩니다.

step4_title  = 스페셜 포스 - 조준이동 (D 누름유지하고 방향키)
step4_help   = 공격키(D)를 누르고 있으면서 방향키를 추가로 누르면\n방향키 방향으로 빠르게 이동할 수 있으며 대상이 조준\n가능한 범위에 들어오면 자동으로 조준해 줍니다.

step5_title  = 스페셜 포스 - 점프사격 (A→D)
step5_help   = 점프를 한 후 공격키를 누르면 점프 사격이 됩니다.\n점프사격 역시 공격키를 오래 누르면 사정거리 내 대상\n을 조준하여 사격할 수 있으나 정조준은 되지 않습니다.

step6_title  = 스페셜 포스 - 하이점프 (A 오래)
step6_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어\n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step7_title  = 스페셜 포스 - 장전 (S 오래)
step7_help   = 방어키(S)를 오래 누르고 있거나 총알이 한발도 없을 경\n우 공격키를 누르면 장전이 발동됩니다. 총알이 없으면\n사격이 불가능하므로 틈틈이 장전을 해주어야 합니다.

step8_title  = 스페셜 포스 - 구르기 (->->)
step8_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동\n및 공격을 하는 구르기가 발동됩니다.

step9_title  = 스페셜 포스 - M9 / 무기스킬(SD)
step9_help   = M9(SD)은 지상 조준 상태에서 방어키(S)를 추가로 누르\n면 대상을 향하여 나이프를 투척하고 점프 중에 스킬키\n(SD)를 누르면 나이프로 내려찍는 스킬입니다.

step10_title = 스페셜 포스 - C4 / 갑옷스킬(ASD)
step10_help  = C4(ASD)는 자기 발 밑에 2초후 폭발하는 시한폭탄을 설\n치하는 스킬입니다. 설치후 폭발 범위 밖으로 벗어나지\n않으면 자신도 피해를 입을 수 있습니다.

step11_title = 스페셜 포스 - 닷지 / 투구스킬(AD)
step11_help  = 닷지(AD)는 넘어졌을 때 방향키를 사용하면 그 방향으로\n굴러서 일어나는 패시브 스킬입니다. 구르는 중에는 상\n대로 부터 공격을 받을 수 있으므로 조심해야 합니다.

step12_title = 스페셜 포스 - 플래쉬뱅 / 망토스킬(AS)
step12_help  = 플래쉬뱅(AS)은 방향키로 원하는 위치를 조정한 후 공격\n키(D)를 입력하면 해당 위치에 섬광탄을 투척하여 넓은\n범위에 대상들의 시야를 잠시 가리는 스킬입니다.

step13_title = 스페셜 포스 - 국민콤보 ①
step13_help  = ★M9(SD) → C4(ASD)\nM9을 지상 또는 공중에서 사용하여 대상을 경직 시킨후\nC4를 설치하여 추가 공격으로 연결합니다.

step14_title = 스페셜 포스 - 국민콤보 ②
step14_help  = ★플래쉬뱅(AS) → C4(AS)\n플래쉬뱅을 투척하여 대상의 시야를 가리고 그 틈에 잽\n싸게 C4를 설치하여 추가 공격을 연결합니다.



[Set33]

max_step = 12

step0_title  = 사무라이 - 기본소개
step0_help   = 사무라이는 날카로운 검과 튼튼한 갑옷을 통하여\n공격과 수비 모두에서 균형 잡힌 능력을 발휘하는 근접\n계열 용병입니다.

step1_title  = 사무라이 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 사무라이 - 연속베기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 연속베기 공격이 발동됩니다.\n연속베기 중 방향키를 입력하면 베기를 멈추고 순간적으로 빠르게 이동합니다.

step3_title  = 사무라이 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 사선으로 베는 점프 공격을 합니다.\n점프상태에서 2번까지 공격이 가능합니다.

step4_title  = 사무라이 - 대시공격 (->-> + D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n띄워 올리는 공격을 합니다.

step5_title  = 사무라이 - 반격 (방어 성공시 바로 공격)
step5_help   = 공격을 방어한 후 바로 공격키(D)를 누르면 반격이 발동\n됩니다. 반격시 상대를 공중으로 띄우는 강력한 공격을\n합니다.

step6_title  = 사무라이 - 난도술 / 무기스킬(SD)
step6_help   = 난도술(SD)은 정면으로 빠르게 10번을 베는 스킬입니다.\n마지막 공격으로 상대를 공중으로 띄우며, SD키를 이용\n하여 스킬을 멈출 수 있습니다.

step7_title  = 사무라이 - 족기술 / 갑옷스킬(ASD)
step7_help   = 족기술(ASD)은 상대를 발로 차는 스킬입니다.\n족기술에 맞으면 상대는 몸을 꺽으며 쓰러지게 되며\n점프 및 다운중 사용 가능합니다.

step8_title  = 사무라이 - 수기술 / 투구스킬(AD)
step8_help   = 수기술(AD)은 넘어진 상대를 띄워 올리는 스킬입니다.\n상대를 띄운 후 다양한 연계공격이 가능하지만,\n넘어진 상대에게만 적용된다는 것을 명심해야 합니다.

step9_title  = 사무라이 - 투혼 / 망토스킬(AS)
step9_help   = 투혼(AS)은 피격시 데미지와 경직시간을 줄여주는\n스킬입니다. 상대를 튕겨내며, AS키를 이용하여 스킬을\n끄고 켤 수있습니다. 피격중 사용 가능합니다.


step10_title = 사무라이 - 국민콤보 ①
step10_help  = ★대쉬공격(->-> + D) → 점프공격\n대쉬공격 후 공중으로 띄워진 상대를 공격합니다.\n최대 2연타까지 추가공격이 가능합니다.

step11_title = 사무라이 - 국민콤보 ②
step11_help  = ★난도술(SD) → 수기술(AD) → 점프공격\n난도술 성공 후 다운된 유저를 수기술로 다시\n띄워 올려 점프공격으로 마무리 합니다.



[Set34]

max_step = 14

step0_title  = 러닝백 - 기본소개
step0_help   = 러닝백은 빠르고 저돌적인 돌격 능력에서 발휘되는 연\n속 돌격과 강력한 밀림을 통하여 상대를 쉬임 없이 압\n박하는 특징을 가진 근접 계열 용병입니다.

step1_title  = 러닝백 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 러닝백 - 러쉬 (D 오래누름)
step2_help   = 공격키(D)를 오래 눌렀다 때면 러쉬 공격이 발동됩니다.\n러쉬는 방향키를 통하여 이동 방향을 변경할 수 있으며\nA,S,D키 중 하나를 누르면 이동이 멈추게 됩니다.

step3_title  = 러닝백 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 바닥을 강하게 내려찍는 점프 공격을 합니다.\n점프 공격은 넘어진 대상을 공격할 때 유용합니다.

step4_title  = 러닝백 - 대시공격 (->-> + D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n잠시 경직시키는 공격을 합니다.

step5_title  = 러닝백 - 대시공격2 (->-> + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지해서 달리기가 발동\n되는 도중에 공격키(D)를 오래 누르면 대상을 공중에\n띄우는 강력한 공격을 합니다.

step6_title  = 러닝백 - 튕겨내기 (공격 받는 순간 방어)
step6_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step7_title  = 러닝백 - 슈퍼러쉬 / 무기스킬(SD)
step7_help   = 슈퍼러쉬(SD)는 빠르게 이동하면서 부딪히는 대상을 멀\n리 날려 보내는 스킬입니다. 슈퍼러쉬 역시 이동 중에\nA,S,D를 누르면 이동이 멈추게됩니다. (점프발동가능)

step8_title  = 러닝백 - 킥오프 / 갑옷스킬(ASD)
step8_help   = 킥오프(ASD)는 상대를 발로차서 랜덤한 거리 및 높이로\n날려 보내는 스킬입니다. 쓰러진 적도 멀리 날려 보내며\n경직이 긴 스킬과 함께 사용하면 좋습니다.

step9_title  = 러닝백 - 충격흡수 / 투구스킬(AD)
step9_help   = 충격흡수(AD)는 드랍 및 낙하 피해를 줄여줄 뿐만 아니\n라 공격을 받았을 때 밀려나는 거리도 감소 시켜주는\n패시브 스킬입니다.

step10_title  = 러닝백 - 수분흡수 / 망토스킬(AS)
step10_help   = 수분흡수(AS)는 망토 이외 무기, 갑옷, 투구 망토의 스\n킬중 1~3개를 랜덤하게 선택하여 스킬 게이지의 갈증을\n일시에 해소 시켜주는 스킬입니다.

step11_title = 러닝백 - 국민콤보 ①
step11_help  = ★러쉬(D 오래) → 킥오프(ASD)\n공격키를 오래 눌러서 러쉬의 풀차징으로 대상을 공격한\n후 킥오프으로 멀리 날려서 마무리 합니다.

step12_title = 러닝백 - 국민콤보 ②
step12_help  = ★슈퍼러쉬(SD) →킥오프(ASD)\n슈퍼러쉬(SD)로 대상을 날려보낸 직후 멈춰서서 쓰러진\n대상을 킥오프(ASD)로 멀리 날려서 마무리 합니다.

step13_title = 러닝백 - 국민콤보 ③
step13_help  = ★점프공격 → 러쉬 → 대시공격 → 대시공격\n점프공격으로 대상을 경직 시킨후 러쉬로 재차 경직시키\n고 대시공격을 빠르게 연속 공격하여 날려보냅니다.



[Set35]
max_step = 13

step0_title  = 카오스 다래 - 기본소개
step0_help   = 포물선 공격을 통하여 전장의 지형 지물을 가볍게 무시\n하고 강력한 화살을 날려 대상을 손쉽게 제압하는 원거\n리 계열의 프리미엄 용병입니다.

step1_title  = 카오스 다래 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 카오스 다래 - 특별공격 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 화살의 낙하 지점을 조정할\n수 있는 가이드가 발동되며 원하는 위치에서 공격키를\n떼면 해당 위치로 화살을 발사합니다.

step3_title  = 카오스 다래 - 점프사격 (A → D,D)
step3_help   = 점프를 한 후 공격키(D)를 누르면 점프 사격이 됩니다.\n점프 상태에서 공격키를 연속해서 누르면 화살을 2연속\n발사되며 넘어진 대상도 공격할 수 있습니다.

step4_title  = 카오스 다래 - 하이점프 (A 오래)
step4_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다.\n하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어\n높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step5_title  = 카오스 다래 - 구르기 (->->)
step5_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동\n및 공격을 회피하는 구르기를 사용할 수 있습니다.

step6_title  = 카오스 다래 - 폭풍의 사격 / 무기스킬(SD)
step6_help   = 폭풍의 사격(SD)은 지정한 위치에 5발의 화살을 연속으\n로 빠르게 발사하는 스킬 입니다. 공격키로 낙하 지점을\n조종하는 중에 방어키를 눌러서도 사용할 수 있습니다.

step7_title  = 카오스 다래 - 바람의 일격 / 갑옷스킬(ASD)
step7_help   = 바람의 일격(ASD)은 360도 돌려차기로 주변 대상을 공격하는 스킬입니다. 바람의 일격은 점프, 피격당하는 중에 사용 할 수 있어 난전에서 용합니다.

step8_title  = 카오스 다래 - 바람의 발걸음 / 투구스킬(AD)
step8_help   = 바람의 발걸음은(AD)는 자신의 모습을 완벽히 숨길 수\n있는 스킬입니다. 바람의 발걸음은 지상 및 공중에서\n상대의 공격을 맞는중에 사용할 수 있어 유용합니다.

step9_title  = 카오스 다래 - 바람의 기습 / 망토스킬(AS)
step9_help   = 바람의 기습(AS)은 전방으로 빠르게 미끄러지면서 대상\n을 공격하여 공중으로 띄우는 스킬입니다. 넘어진 상대\n를 공중에 띄워서 다양한 공격을 연결할 수 있습니다.

step10_title = 카오스 다래 - 국민콤보 ①
step10_help  = ★바람의일격(ASD)→화살 발사(D오래)→폭풍의사격(SD) 대상을 바람의 일격으로 경직 시킨후 빠른 화살 발사로\n넘어 뜨리고 폭풍의 사격으로 마무리 연타합니다.

step11_title = 카오스 다래 - 국민콤보 ②
step11_help  = ★화살발사(D오래) → 화살발사 → 화살발사\n공격키를 오래 눌러 강력한 화살로 대상을 경직 시킨후\n빠른 화살발사로 넘어뜨리고 추가 화살 공격을 합니다.

step12_title = 카오스 다래 - 국민콤보 ③
step12_help  = ★바람의 기습(AS) → 기본공격 → 화살발사(D오래)\n바람의 기습으로 대상을 띄운후 빠르게 뒤돌아 기본 공\n격으로 연타하고 화살 발사로 마무리 합니다.



[Set36]

max_step = 16

step0_title  = 조로 - 기본소개
step0_help   = 조로는 레이피어를 이용한 빠른 검술과 공중의 유연한\n움직으로 화련한 기습 플레이로 대상을 빠르게 제압하\n는 근거리 계열의 용병입니다.

step1_title  = 조로 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 조로 - 니킥 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 니킥 공격이 발동됩니다. 니킥\n공격이 성공하면 대상과 함께 공중으로 뛰어 오르게 되\n어 점프 및 스킬 공격으로 연결할 수 있습니다.

step3_title  = 조로 - 점프공격 (A → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를\n누르면 발로 차는 점프 공격을 합니다. 지상의 대상을\n공격하면 점프가 다시 발동되어 추가 공격이 가능합니다

step4_title  = 조로 - 기습 점프공격 (재점프 또는 이중점프 → D)
step4_help   = 점프 공격으로 재점프가 발생되거나 이중 점프를 한후\n에 공격키(D)를 누르면 사선으로 빠르게 떨어지면서 강\n력한 공격을 하는 기습 점프 공격이 발동됩니다.

step5_title  = 조로 - 이중점프 (A 두번 누름)
step5_help   = 점프한 상태에서 다시 점프키(A)를 누르면 공중에서 한\n번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수\n있으며 이때 공격키를 누르면 기습 점프 공격이 됩니다.

step6_title  = 조로 - 대시공격 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대\n상을 일정 시간 경직시키는 대시 공격이 가능합니다.

step7_title  = 조로 - 대시공격 중 구르기(대시공격 중 ->->)
step7_help   = 대쉬공격 이후 방향키를 빠르게 두번 입력하면 해당방향\n으로 구르면서 이동합니다. 대시공격 이후 상대의 공격\n을 피할 때 유용합니다.

step8_title  = 조로 - 반격 (방어 성공시 바로 공격)
step8_help   = 공격을 방어한 후 바로 공격키(D)를 누르면 반격이 발동\n됩니다. 조로는 상대를 빠르게 2연속 찌르고 마지막에\n대상을 일정 시간 경직시키는 찌르기 반격을 합니다.

step9_title  = 조로 - 제트싸인 / 무기스킬(SD)
step9_help   = 제트싸인(SD)는 Z자를 그리듯이 빠르게 3연속 베기 공격\n을 하는 스킬입니다. 3연속 베기를 모두 맞으면 대상을\n천천히 쓰러지게 되어 니킥 등으로 연결할 수 있습니다.

step10_title  = 조로 - 로즈밤 / 갑옷스킬(ASD)
step10_help   = 로즈밤(ASD)은 공중으로 점프해 장미꽃 모양의 폭탄 다수 던지는 스킬입니다. 지상/공중/다운 중 사용가능하고 점프 중 사용 시 방향키로 방향전환이 가능합니다.

step11_title = 조로 - 랜딩롤 / 투구스킬(AD)
step11_help  = 랜딩롤(AD)은 착지 중에 방향키를 빠르게 두 번 누르면\n해당 방향으로 구르기 이동을 할수 있는 스킬입니다.\n착지를 노리는 대상의 공격을 회피하기에 용이합니다.

step12_title = 조로 - 배니쉬 / 망토스킬(AS)
step12_help  = 망토스킬(AS)는 검은 연기와 함께 공중으로 뛰어 오르는\n스킬입니다. 배니쉬는 지상/공중/다운상태에서 사용\n가능하며  지상 및 공중 피격중에도 사용 가능합니다.

step13_title = 조로 - 국민콤보 ①
step13_help  = ★니킥(D오래) → 점프공격 → 기습 점프공격\n니킥으로 대상과 함께 공중에 뜨면 점프 공격으로 지상\n에 바운딩 시키고 기습 점프 공격으로 마무리합니다.

step14_title = 조로 - 국민콤보 ②
step14_help  = ★니킥(D오래) → 점프공격 → 제트싸인(SD)\n니킥으로 대상과 함께 뜨면 점프 공격으로 바운딩시키고\n제트싸인으로 접근해서 3연속 베기로 마무리 합니다.

step15_title = 조로 - 국민콤보 ③
step15_help  = ★니킥(D오래) → 점프공격 → 로즈밤(ASD)\n니킥으로 대상과 함께 뜨면 점프 공격으로 바운딩시키고\n로즈밤으로 장미 폭탄을 뿌려서 추가 공격합니다.



[Set37]

max_step = 14

step0_title  = 진 키사라기 - 기본소개
step0_help   = 진 키사라기는 유키아네사의 결빙 특성을 이용한 빙상격\n빙상검을 비롯하여 각종 결빙을 활용한 연속 공격으로 대\n상을 제압하는 근거리 계열의 프리미엄 용병입니다.

step1_title  = 진 키사라기 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 진 키사라기 - 빙상검 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 뒤로 물러나며 전방을 향해 빙\n상검을 발사합니다. 빙상검을 발사하는 중에 점프키(A)\n를 누르면 발사후 좀더 빠르게 점프할 수 있습니다.

step3_title  = 진 키사라기 - 빙상격 (->-> → D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 빠\n르게 이동하여 결빙 공격하고 자동으로 점프를 합니다.

step4_title  = 진 키사라기 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 사선으로 베는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step5_title  = 진 키사라기 - 이중점프 (A 두번 누름)
step5_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동됩니다. 이중 점프 중\n에 방향키를 빠르게 두 번 누르면 빙상격이 발동됩니다.

step6_title  = 진 키사라기 - 공중 빙상격 (A → ->->)
step6_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 이\n동하며 공격하는 공중 빙상격이 발동됩니다.

step7_title  = 진 키사라기 - 영도 / 무기스킬(SD)
step7_help   = 영도(SD)는 얼음 기운을 전방으로 보내서 끝나는 지점에\n거대한 얼음검이 솟구쳐 올라 대상을 빙결 공격하는 스\n킬입니다. 영도는 넘어진 대상도 공격할 수 있습니다.

step8_title  = 진 키사라기 - 상랑 / 갑옷스킬(ASD)
step8_help   = 상랑(ASD)은 지상에서 늑대 모양의 서리 기운을 전방으\n로 발산하여 대상을 오래 결빙시키거나, 공중에서 자신\n주변으로 서리 기운을 발산하여 결빙시키는 스킬입니다.

step9_title  = 진 키사라기 - 빙연쌍 / 투구스킬(AD)
step9_help   = 빙연쌍(AD)은 지상에 얼음 기둥들을 솟구치게 하여 대상\n을 결빙 상태로 공중에 띄우는 스킬입니다. 빙연쌍은 공\n중에서 사용해도 지상에 얼음 기둥이 나타납니다.

step10_title = 진 키사라기 - 빙익월명 / 망토스킬(AS)
step10_help  = 빙익월명(AS)은 45도 위쪽으로 매우 빠른 속도로 얼음\n화살을 발사하는 스킬입니다. 빙익월명은 발동이 매우\n빠르기 때문에 점프한 대상을 역습할 때 유용합니다.

step11_title = 진 키사라기 - 국민콤보 ①
step11_help  = ★영도(SD) 또는 빙연쌍(AD) → 빙익월명(AS)\n영도(SD) 또는 빙연쌍(AD)을 이용하여 대상을 공중에 띄\n우고 발동이 빠른 빙익월명(AS) 마무리 합니다.

step12_title = 진 키사라기 - 국민콤보 ②
step12_help  = ★빙상격 → 공중 빙상격 → 점프공격\n빙상격을 이용하여 기습 공격을 한후 공중 빙상격으로\n빠르게 연속 공격하고 점프 공격으로 마무리 합니다.

step13_title = 진 키사라기 - 국민콤보 ③
step13_help  = ★영도(SD) → 빙상격 → 공중빙상격 → 상랑(ASD) →\n 공중빙상격 → 빙연쌍(AD) → 공중빙상격 → 점프공격\n영도(SD)를 시작으로 휘몰아치는 공격을 할 수 있습니다.



[Set38]

max_step = 15

step0_title  = 네크로맨서 - 기본소개
step0_help   = 네크로맨서는 자유자재로 조종할 수 있는 퍼밀리어와 강\n력한 공격을 하는 소환체를 소환하여 상대방에게 피해를\n입히는 강력한 소환 전문의 마법 계열 용병입니다.

step1_title  = 네크로맨서 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 네크로맨서 - 퍼밀리어 소환 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 자유자재로 조종할 수 있는\n퍼밀리어를 최대 3마리까지 소환합니다. 퍼밀리어로 2연\n속 공격을 하게 되면 강경직 상태를 만들 수 있습니다.

step3_title  = 네크로맨서 - 차징 회피 (D 누름유지 → ->->)
step3_help   = 공격키(D)를 누르고 있을때 ->->를 빠르게 입력하면 차\n징 상태에서도 빠르게 이동이 가능합니다. 차징 회피를\n하게 되면 모으던 차징 게이지는 소멸됩니다.

step4_title  = 네크로맨서 - 튕겨내기 (공격 받는 순간 방어)
step4_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step5_title  = 네크로맨서 - 이중점프 (A 두번 누름)
step5_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는\n멀리 이동할 수 있게 됩니다.

step6_title  = 네크로맨서 - 점프공격 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 퍼밀리어 2마리를 즉시 소환하여 공격합니다.\n점프공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step7_title  = 네크로맨서 - 스컬 공격 (->->)
step7_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두번 누르면 그 방향으로 커다란 스컬을 소환해 상\n대방을 공격합니다. 점프 중 사용 가능합니다.

step8_title  = 네크로맨서 -  / 퍼밀리어(SD)
step8_help   = 퍼밀리어(SD)는 조종 가능한 6마리의 퍼밀리어를 소환\n하여 적을 공격하고, 약간의 체력을 흡수하는 스킬입니다.\n퍼밀리어는 일정 시간이 흐르면 자동으로 사라집니다.

step9_title  = 네크로맨서 -  / 데스사이드(ASD)
step9_help   = 데스사이드(ASD)는 거대한 해골사신을 소환하여 상대방\n을 공격하는 스킬입니다. 다운된 대상도 공격하고 대상은\n낙하 할 때 큰 데미지를 받으며, 추가공격이 가능합니다.

step10_title  = 네크로맨서 -  / 버서커러쉬(AD)
step10_help   = 버서커러쉬(AD)는 전방에 커다란 해골버서커를 소환하여 공격하는 스킬입니다. 소환된 해골버서커는 전방으로 빠르게 돌진하여 상대방을 멀리 날려버리는 공격을 합니다.

step11_title  = 네크로맨서 -  / 아라크네(AS)
step11_help   = 아라크네(AS)는 독속성의 폭발 공격을 하는 거미를 소환\n하는 스킬입니다. 소환된 거미는 대상의 근처에 다다르\n면 폭발하며 다운 상태의 적에게도 피해를 입힙니다.

step12_title = 네크로맨서 - 국민콤보 ①
step12_help  = ★데스사이드(ASD) → 아라크네(AS)\n데스사이드(ASD)로 상대방을 높이 띄운 후 낙하지점에\n아라크네(AS)를 사용하여 폭발공격으로 마무리 합니다.

step13_title = 네크로맨서 - 국민콤보 ②
step13_help  = ★퍼밀리어(D오래) → 대시공격(->->)\n퍼밀리어(D오래)로 2연속 공격을 하여 강한 경직 상태를\n만들고 대쉬 공격으로 마무리 공격을 합니다.

step14_title = 네크로맨서 - 국민콤보 ③
step14_help  = ★퍼밀리어(D오래) → 아라크네(AS)\n퍼밀리어(D오래)로 2연속 공격 하여 강한 경직 상태를 만\n든 후 아라크네(AS)로 마무리 공격을 합니다.



[Set39]

max_step = 12

step0_title  = 거상왕소룡 - 기본소개
step0_help   = 거상왕소룡는 쌍절곤을 이용한 변화무쌍한 공격과 빠른\n연타 공격으로 상대방을 제압하는 근거리 계열의 프리\n미엄 용병입니다.

step1_title  = 거상왕소룡 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 거상왕소룡 - 상하돌리기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 쌍절곤을 빠르게 돌리며 공격\n합니다. 쌍절곤을 돌리면서 이동을 할 수도 있으며 공격\n키(D)를 떼면 위로 띄우는 공격을 합니다.

step3_title  = 거상왕소룡 - 대쉬 공격 (->-> → D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 전\n방의 대상을 띄워 올리는 공격을 합니다.

step4_title  = 거상왕소룡 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)\n를 누르면 대상을 발로 차는 점프 공격을 합니다. 점프\n공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step5_title  = 거상왕소룡 - 천라지망 / 무기스킬(SD)
step5_help   = 천라지망(SD)은 쌍절곤을 빠르고 강하게 돌려 360도 방\n향을 전부 공격하는 스킬입니다. 스킬 시전 중 방향키\n를 이용하여 공격 방향을 조정할 수 있습니다.

step6_title  = 거상왕소룡 - 선풍각 / 갑옷스킬(ASD)
step6_help   = 선풍각(ASD)은 전방으로 빠르게 회전하면서 이동하여\n상대방을 공격하는 스킬입니다. 점프 상태에서도 공격\n할 수 있어서 공중 상대를 공격 할 때에도 유용합니다.

step7_title  = 거상왕소룡 - 호승각 / 투구스킬(AD)
step7_help   = 호승각(AD)은 재빨리 바닥에 누운 다음 일어나면서 상\n대방을 가격해 바운딩 시키는 스킬입니다. 피격중에도\n사용할 수 있으며 연계공격을 하기에도 유용합니다.

step8_title = 거상왕소룡 -  금화/ 망토스킬(AS)
step8_help  = 금화(AS)는 상대방에게 금화를 던져 잠시동안 조종 불가\n상태로 만들고 금화를 따라가게 하는 스킬입니다. 다운\n상태의 적에게 사용하여 일으켜 세울 수도 있습니다.

step9_title = 거상왕소룡 - 국민콤보 ①
step9_help  = ★호승각(AD) → 상하돌리기(D오래)\n호승각(AD)를 이용하여 대상을 공격하여 바운딩 시킨 후\n상하돌리기(D오래)로 마무리합니다.

step10_title = 거상왕소룡 - 국민콤보 ②
step10_help  = ★금화(AS) → 선풍각(ASD)\n금화(AS)를 이용하여 상대방을 잠시동안 조종 불가 상\n태로 만들고 선풍각(ASD)으로 마무리합니다.

step11_title = 거상왕소룡 - 국민콤보 ③
step11_help  = ★공중 선풍각(A →ASD) → 공격(D)\n점프(A)를 하고 선풍각(ASD)를 사용해서 대상을 공격한\n후 공격(D)키를 눌러 점프 공격으로 마무리 합니다.



[Set40]

max_step = 16

step0_title  = 스파르타쿠스 - 기본소개
step0_help   = 스파르타쿠스는 그라디우스와 방패를 이용하여 상대방에게 강력한 공격을 하고 방어 중 회피구르기를 이용하여 적의 공격을 회피하기도 하는 다재다능한 용병입니다.

step1_title  = 스파르타쿠스 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 스파르타쿠스 - 점프 찌르기(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 잽싸게 뛰어올라 전방의 적을 향하여 대각선으로 찌르는 공격을 합니다. 점프 찌르기에 공격을 당하면 강력한 경직 상태가 됩니다.

step3_title  = 스파르타쿠스 - 대쉬 공격 (->-> → D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상의 방어를 무시하고 미는 공격을 합니다.

step4_title  = 스파르타쿠스 - 대쉬 확장공격 (대쉬 공격 중 ->->)
step4_help   = 대시 공격 중 방향키를 빠르게 두 번 누르면 해당 방향으로 빠르게 굴러서 이동한 후 대상을 띄우는 공격을 합니다.

step5_title  = 스파르타쿠스 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 방패로 치는 점프 공격을 합니다. 점프공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step6_title  = 스파르타쿠스 - 점프방어 (A + S)
step6_help   = 점프키(A)를 눌러 공중에서 뜬 상태에서 방어키(S)를 누르면 점프상태에서도 방어를 할 수 있도록 방어자세를 취할 수 있습니다.

step7_title  = 스파르타쿠스 - 방어 중 회피구르기 / (S유지 ->->)
step7_help   = 방어 중 회피구르기는 방어키(S)를 누르고 있는 상태에서 대쉬(->->)키를 입력하면 해당 방향으로 회피구르기를 합니다. 구르기는 적의 공격을 피하는데 유용합니다.

step8_title  = 스파르타쿠스 - 튕겨내기 (공격 받는 순간 방어)
step8_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step9_title  = 스파르타쿠스 - 카운터 / 무기스킬(SD)
step9_help   = 카운터(SD)는 방패로 몸을 감싸 일정 시간 동안 무적 상태가 되며, 일정 시간안에 D키를 입력하면 전방의 대상에게 강한 경직 효과를 일으키는 찌르기 공격을 합니다.

step10_title  = 스파르타쿠스 - 어썰트 / 갑옷스킬(ASD)
step10_help   = 어썰트(ASD)는 원하는 위치로 점프 후 착지하여 주변의 적들을 모두 밀쳐내는 점프공격을 합니다. 일정 시간이 지나면 해당 지점으로 자동으로 점프공격을 합니다.

step11_title  = 스파르타쿠스 - 니킥 / 투구스킬(AD)
step11_help   = 니킥(AD)은 전방의 대상을 향해 강력한 무릎 올려치기 공격을 합니다. 일정 시간이 되면 스킬이 취소 되지만 시간에 비례하여 데미지와 띄움 높이가 높아집니다.

step12_title = 스파르타쿠스 -  메이스/ 망토스킬(AS)
step12_help  = 메이스(AS)는 철퇴를 회전 이동하면서 휘두르는 스킬입니다. 철퇴를 크게 휘두르며 이동하기 때문에 넓은 범위를 단숨에 제압할 수 있습니다.

step13_title = 스파르타쿠스 - 국민콤보 ①
step13_help  = ★점프찌르기(D오래) → 메이스(AS) 점프찌르기(D오래)를 이용하여 대상을 경직시킨 후 메이스(AS)로 마무리 합니다.

step14_title = 스파르타쿠스 - 국민콤보 ②
step14_help  = ★니킥(AD) → 어썰트(ASD) 니킥(AD)을 이용하여 상대방을 위로 띄운 후 낙하 지점에 어썰트(ASD)를 사용하여 마무리합니다.

step15_title = 스파르타쿠스 - 국민콤보 ③
step15_help  = ★카운터(SD) → 니킥(AD) 카운터(SD)를 이용해 상대방을 경직 상태로 만들고 니킥(AD)으로 공격하여 마무리합니다.



[Set41]

max_step = 15

step0_title  = 퇴마록현암 - 기본소개
step0_help   = 퇴마록현암은 귀검 월향을 자유자재로 조종하며 공격에 기를 실어 특별한 효과를 내는 태극기공을 사용하여 상대방을 완벽히 제압하는 근거리 프리미엄 용병입니다.

step1_title  = 퇴마록현암 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 퇴마록현암 - 태극기공 (D 누름 떼기)
step2_help   = 공격키(D)를 1초가량 눌렀다 떼면 기본공격에 기를 실어 대상을 공격합니다. 기를 실은 공격은 각각 다른 효과를 지녔으며 이를 활용하면 다양한 콤보연계가 가능합니다.

step3_title  = 퇴마록현암 - 월향(D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 짧은 시간동안 주변을 맴돌며 대상을 공격하는 월향을 발사합니다. 월향은 완벽하진 않지만 조종이 가능하며 시간이 지나면 되돌아옵니다.

step4_title  = 퇴마록현암 - 대쉬 공격 (->-> → D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 향해 발차기 공격을 합니다.

step5_title  = 퇴마록현암 - 대쉬 태극기공 (->-> → D오래)
step5_help   = 기존의 대쉬 공격을 하려고 할 때 공격키(D)를 오래 누르면 기를 모아 대상을 공격합니다. 피격 당한 대상은 바운딩 상태가 되며 추가 공격이 가능합니다.

step6_title  = 퇴마록현암 - 점프공격 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 발로 차는 점프 공격을 합니다. 점프공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step7_title  = 퇴마록현암 - 천근추 (A → D오래)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D오래)를 누르면 빠르게 낙하하며 바닥을 찍는 공격을 합니다. 넘어진 대상도 공격 할 수 있어 매우 유용한 공격입니다.

step8_title  = 퇴마록현암 - 월향비검 / 무기스킬(SD)
step8_help   = 월향비검(SD)은 오랜 시간동안 조종 가능한 귀검 월향을 발사합니다. 월향은 빠른 속도로 이동을 하며 주변 대상을 공격하여 전장을 제압합니다.

step9_title  = 퇴마록현암 - 사자후 / 갑옷스킬(ASD)
step9_help   = 사자후(ASD)는 소리에 기를 실어 대상을 경직시키는 기술 입니다. 기를 응축시켜 사용하며 오래 응축하면 할 수록 경직시간이 길어지는 기술입니다.

step10_title  = 퇴마록현암 - 탄자결 / 투구스킬(AD)
step10_help   = 탄자결(AD)은 손에 기공을 응축시켜 연속으로 발사하는 기술입니다. 탄자결은 소수의 적뿐만 아니라 다수의 적을 공격 할 때도 매우 유용합니다.

step11_title = 퇴마록현암 -  파사신검/ 망토스킬(AS)
step11_help  = 파사신검(AS)은 지정한 위치로 도약 및 착지하여 전방의 대상을 향해 청홍검으로 베는 공격을 하여 대상을 쓰러트리는 기술입니다.

step12_title = 퇴마록현암 - 국민콤보 ①
step12_help  = ★대쉬 태극기공(->-> → D오래) → 기본공격(D→4연타) 대쉬 태극기공(->-> → D오래)으로 대상을 바운딩 시킨 후 기본공격(D→4연타)로 마무리 합니다.

step13_title = 퇴마록현암 - 국민콤보 ②
step13_help  = ★기본공격2연타(D→D) → 태극기공(D누름떼기 X 2) 기본공격 2연타(D→D) 후 태극기공(D누름떼기 X 2)으로 대상을 띄우고 다시 한번 공격하여 마무리합니다.

step14_title = 퇴마록현암 - 국민콤보 ③
step14_help  = ★사자후(ASD) → 파사신검(AS) 사자후(ASD)를 이용해 대상을 경직시킨 후 파사신검(AS)로 대상을 가격해 멀리 날려보냅니다.



[Set42]

max_step = 16

step0_title  = 프로 레슬러 - 기본소개
step0_help   = 프로 레슬러는 헤드락, 로프반동, 엘보, 드랍킥 등의 화려한 프로 레슬링 기술을 사용하여 상대를 제압하는 근거리 용병입니다.

step1_title  = 프로 레슬러 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 프로 레슬러 - 헤드락 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 대상을 헤드락으로 잡아서 끌고 다닐 수 있으며 헤드락중 공격키를 때면 잡고 있는 대상을 전방으로 달려 보냅니다.

step3_title  = 프로 레슬러 - 빅풋 (->-> → D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 짧게 눌렀다 때면 대상을 발로차는 경직 공격을 합니다.

step4_title  = 프로 레슬러 - 드롭킥 (->-> → D오래)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 오래 눌렀다 때면 대상을 멀리 날려버리는 드롭킥 공격을 합니다.

step5_title  = 프로 레슬러 - 빅풋 & 드롭킥
step5_help   = 방향키를 빠르게 두 번 누른 이후, 공격키(D)를 짧게 눌러 빅풋을 사용한 다음, 곧 이어 공격키(D)를 누르면 빅풋에 이어 드롭킥을 사용하여 대상을 날려버립니다.

step6_title  = 프로 레슬러 - 엘보 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 바닥을 팔꿈치로 내려찍는 엘보 공격을 합니다. 엘보는 넘어진 대상을 빠르게 타격할때 유용합니다.

step7_title  = 프로 레슬러 - 플라잉바디프레스 (A오래 → D)
step7_help   = 점프키(A)를 오래 누르면 하이 점프가 발동되며 이때 공격키(D)를 누르면 온 몸을 날려서 상대를 압박하는 공격이 발동됩니다. 실패시 충격이 커서 회복이 느립니다.

step8_title  = 프로 레슬러 - 스피닝힐킥 (방어 성공시 바로 공격)
step8_help   = 공격을 방어한 후 바로 공격키(D)를 누르면 반격이 발동 됩니다. 전방으로 한바퀴 회전하면서 힐킥으로 강하게 차는 공격으로 대상을 뒤쪽으로 튕겨 버립니다.

step9_title  = 프로 레슬러 - 자이언트스윙 / 무기스킬(SD)
step9_help   = 자이언트스윙(SD)은 대상을 잡아 회전하며 던지는 기술 입니다. 이동중 대상을 던질 수 있으며, 대상이 날아가는 루트에 다른 대상이 있을 경우 같이 데미지를 입습니다.

step10_title  = 프로 레슬러 - 파일드라이브 / 갑옷스킬(ASD)
step10_help   = 파일드라이브(ASD)는 대상을 잡아 높이 점프하여 내려찍는 기술입니다. 내려찍는 대상과 더불어 주변에도 함께 데미지을 입히게 됩니다. 피격중 사용 가능합니다.

step11_title = 프로 레슬러 - 슈플렉스 / 투구스킬(AD)
step11_help  = 슈플렉스(AD)는 대상을 잡아 바닥에 찍어 크게 바운딩 시키는 기술입니다. 다운된 대상에게도 사용할 수 있으며 추가타격을 할 수도 있어 매우 유용한 기술입니다.

step12_title = 프로 레슬러 -  크로스라인/ 망토스킬(AS)
step12_help  = 크로스라인(AS)은 빠르게 전방으로 이동하며 상대방을 넘어트리는 기술입니다. 피격 당한 대상은 바운딩 상태가 되며 이때, 추가 타격이 가능합니다.

step13_title = 프로 레슬러 - 국민콤보 ①
step13_help  = ★크로스라인(AS) → 자이언트스윙(SD) 크로스라인(AS)으로 대상을 넘어트린 후 자이언트 스윙(SD)으로 마무리 합니다.

step14_title = 프로 레슬러 - 국민콤보 ②
step14_help  = ★파일드라이브(ASD) → 슈플렉스(AD) 파일드라이브(ASD)로 대상을 가격하여 넘어트린 후 슈플렉스(AD)로 마무리 합니다.

step15_title = 프로 레슬러 - 국민콤보 ③
step15_help  = ★드롭킥(->-> → D오래) → 하이 점프공격(A오래→ D) 드롭킥(->-> → D오래)을 이용하여 대상을 멀리 날려보낸 후 하이 점프공격(A오래→ D)으로 마무리 합니다.



[Set43]

max_step = 15

step0_title  = 마법 창병 - 기본소개
step0_help   = 마법 창병은 창을 이용한 화염, 빙결, 뇌전 속성의 공격과 분신, 더미등의 다양한 스킬을 사용하여 상대방을 제압하는 근거리 프리미엄 용병입니다.

step1_title  = 마법 창병 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 마법 창병 - 속성 공격 : 빙결 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 얼음 속성이 담긴 찌르기 공격을 합니다. 피격 당한 대상은 잠시 동안 빙결 상태가 되며 풀릴때에 약한 튕김 상태가 됩니다.

step3_title  = 마법 창병 - 속성 공격 : 뇌전 (2타째 D 오래누름)
step3_help   = 2번째 타격 때 공격키(D)를 오래 누르면 뇌전 속성이 담긴 찌르기 공격을 합니다. 피격시에 주변 대상에게 연쇄적으로 감전을 시키며 기립상태를 만듭니다.

step4_title  = 마법 창병 - 속성 공격 : 화염 (3타째 D 오래누름)
step4_help   = 3번째 타격 때 공격키(D)를 오래 누르면 화염 속성이 담긴 창으로 공격하여 대상을 띄우는 공격을 합니다. 다운상태의 적도 공격이 가능하여 매우 유용한 공격입니다.

step5_title  = 마법 창병 - 회전 공격 (->-> → D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 회전을 하며 2연타 공격을 합니다.

step6_title  = 마법 창병 - 내려치기 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 빠르게 낙하하여 내려치는 공격을 합니다. 넘어진 대상도 공격 할 수 있어 매우 유용한 공격입니다.

step7_title  = 마법 창병 - 튕겨내기 (공격 받는 순간 방어)
step7_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step8_title  = 마법 창병 - 돌려찌르기 / 무기스킬(SD)
step8_help   = 돌려찌르기(SD)는 빠르게 전진하며 회전 공격을 하는 스킬입니다. 스킬 시전중에 공격키(D)키를 누르면 즉시 공격하여 대상을 경직시키는 공격을 합니다.

step9_title  = 마법 창병 - 오우섬 포트리스 / 갑옷스킬(ASD)
step9_help   = 오우섬 포트리스(ASD)는 지정 위치에 자신과 똑같이 생긴 분신을 소환하여 대상을 공격하는 스킬입니다. 소환된 분신은 근처의 적을 향해 공격을 합니다.

step10_title  = 마법 창병 - 더미스텝 / 투구스킬(AD)
step10_help   = 더미스텝(AD)은 뒤로 재빨리 이동하며 더미를 생성하는 기술입니다. 피격 중에도 사용할 수 있으며, 생성된 더미는 주변 대상을 끌어당겨 경직 상태를 만듭니다.

step11_title = 마법 창병 -  글라이딩파이어/ 망토스킬(AS)
step11_help  = 글라이딩파이어(AS)는 잠시동안 마법궁수로 변신하여 지정한 위치에 다수의 불화살을 발사하는 기술입니다. 피격시 다운 상태 및 기립지연 상태가 됩니다.

step12_title = 마법 창병 - 국민콤보 ①
step12_help  = ★돌려찌르기(SD→D) → 속성공격(D오래) 돌려찌르기(SD)로 상대방을 가격하여 바운딩 시킨 후 속성 공격(D오래)으로 연속 공격합니다.

step13_title = 마법 창병 - 국민콤보 ②
step13_help  = ★글라이딩파이어(AS)→더미스텝(AD)→속성공격(D오래) 글라이딩파이어(AS)로 다운을 시킨 후 더미스텝(AD)으로 끌어당긴 다음 속성공격(D오래)으로 마무리합니다.

step14_title = 마법 창병 - 국민콤보 ③
step14_help  = ★오우섬포트리스(ASD)→내려치기(A→D)→기본 공격 오우섬포트리스(ASD)로 대상을 띄우고 내려치기(A→D)로 바운딩 시킨 후 기본 공격(D→D→D)으로 마무리합니다.



[Set44]

max_step = 14

step0_title  = 인형사 - 기본소개
step0_help   = 인형사는 전투를 도울 여러가지 인형을 소환하여 소환된 인형과 함께 합동 콤보 및 다양한 공격으로 대상을 제압하는 특수계열 근거리 용병입니다.

step1_title  = 인형사 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 인형사 - 인형 소환 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 자신의 행동에 따라 이동 및 공격을 하는 인형을 소환합니다. 소환된 인형은 인형사가 공격하는 방향으로 공격을 하며 콤보에 유용합니다.

step3_title  = 인형사 - 슈퍼대시 (->->)
step3_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두번 누르면 그 방향으로 짧지만 매우 빠르게 이동하는 슈퍼대시를 사용할 수 있습니다.

step4_title  = 인형사 - 슈퍼대시 공격 (->-> D)
step4_help   = 슈퍼대쉬(->->)를 하는 도중에 공격키(D)를 누르면 대상을 띄우는 공격을 합니다. 슈퍼대쉬 공격은 콤보 및 기술을 연계하는데 매우 유용한 기술입니다.

step5_title  = 인형사 - 내려치기 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 사선으로 내려 치는 공격을 합니다. 내려치기는 공중에 뜬 대상을 공격할 때 유용합니다.

step6_title  = 인형사 - 내려찍기 (A → D오래)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D오래)를 누르면 두발로 바닥을 찍는 공격을 합니다. 내려찍기는 다운대상도 공격 할 수 있어 매우 유용한 공격입니다.

step7_title  = 인형사 - 총잡이인형 / 무기스킬(SD)
step7_help   = 총잡이인형(SD)은 일정시간 동안 원거리 공격을 하는 인형을 소환하는 스킬입니다. 인형사가 공격할때 공격을 하며 발사 방향은 인형사가 공격하는 곳을 향해 발사합니다.

step8_title  = 인형사 - 쉘위댄스 / 갑옷스킬(ASD)
step8_help   = 쉘위댄스(ASD)는 대상과 회전하는 춤을 추면서 이동을 하다가 밀어버리는 기술입니다. 쉘위댄스(ASD)는 적을 드랍존으로 떨어뜨릴때 매우 유용합니다.

step9_title  = 인형사 - 돌격인형 / 투구스킬(AD)
step9_help   = 돌격인형(AD)는 전방의 적을 향해 5연속 공격을 하는 인형을 소환하는 기술입니다. 피격 중 사용가능하며 스킬 중 시전자도 공격이 가능합니다.

step10_title  = 인형사 - 거인인형/ 망토스킬(AS)
step10_help   = 거인인형(AS)은 거대한 인형을 소환하여 전방의 대상에게 빠르게 날아가 공격하는 기술입니다. 피격당한 대상은 띄움 상태가 되며 이때 추가타격이 가능합니다.

step11_title = 인형사 - 국민콤보 ①
step11_help  = ★인형소환 공격(D오래→DDD) →내려찍기(A → D오래) 인형소환(D오래)으로 인형을 소환해 합동 공격을 펼쳐 대상을 넘어트리고 내려찍기(A→D오래)로 마무리합니다.

step12_title = 인형사 - 국민콤보 ②
step12_help  = ★돌격인형(AD) → 거인인형(AS) → 점프 공격(A→D오래) 돌격인형(AD)로 대상을 공격하고 이때 거인인형(AS)을 사용하여 대상을 띄운 후 내려찍기(A→D오래)마무리 합니다.

step13_title = 인형사 - 국민콤보 ③
step13_help  = ★기본공격(D→D→D) → 돌격인형(AD) 기본공격(D→D→D)으로 대상을 경직시고 돌격인형(AD)과 기본 공격으로 대상을 연속 공격하여 마무리합니다.



[Set45]

max_step = 16

step0_title  = 호크아이 - 기본소개
step0_help   = 호크아이는 자신에게 되돌아오는 블레이드와 날렵한 움직임을 통한 공격으로 상대방을 제압하는 스피드형 근거리 용병입니다.

step1_title  = 호크아이 - 기본공격 (D → D → D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 호크아이 - 리턴 블레이드 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 블레이드를 던지는 공격을 합니다. 날아간 블레이드는 자신에게 되돌아오며 자신의 앞에 있는 대상의 뒤를 공격할 수 있어 매우 유용합니다.

step3_title  = 호크아이 - 대시 공격 (->-> D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 발로 차서 살짝 띄우는 공격을 합니다.

step4_title  = 호크아이 - 비상 (->-> D, D)
step4_help   = 대시공격(->-> D) 후 바로 공격키(D)를 누르면 대상을 발로 가격하며 점프하는 공격을 합니다. 방향키를 지정하면 해당 방향으로 이동을 할 수 있습니다.

step5_title  = 호크아이 - 회전차기 (->-> D, S)
step5_help   = 대시공격(->-> D) 후 바로 방어키(S)를 누르면 대상을 발로 가격하며 띄우는 공격을 합니다. 방향키를 지정하면 해당 방향으로 이동을 할 수 있습니다.

step6_title  = 호크아이 - 점프공격 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 블레이드를 날려 공격합니다. 블레이드는 2개까지 날릴 수으며 공중에 뜬 대상을 공격하기에 유용합니다.

step7_title  = 호크아이 - 스핀 (A → ->->)
step7_help   = 점프공격 중이나 점프중에 방향키를 빠르게 2번 입력하면 입력된 방향으로 회전하면서 상대를 연타하는 공격을 합니다. 3연속 피격시 높이 띄우는 효과가 발동됩니다.

step8_title  = 호크아이 - 반격 (방어 성공시 바로 공격)
step8_help   = 공격을 방어한 후 바로 공격키(D)를 누르면 뒤로 이동하며 전방으로 두개의 블레이드를 날리는 공격합니다. 2연속 피격 당한 대상은 띄움 상태가 됩니다.

step9_title  = 호크아이 -  블레이드(SD)
step9_help   = 블레이드(SD)는 여러방향으로 5개의 블레이드를 던지는 스킬 입니다. 던진 블레이드는 다시 되돌아오며 공격하고 피격 당한 대상은 강한 경직 상태가 됩니다.

step10_title  = 호크아이 - 백레이드(ASD)
step10_help   = 백레이드(ASD)는 사선으로 점프하여 대상의 뒤편 공중으 로이동한 후 대상을 공격하는 스킬입니다. 백레이드(ASD)는 피격 중에도 사용할 수 있어 매우 유용합니다.

step11_title  = 호크아이 - 스네이크(AD)
step11_help   = 스네이크(AD)는 3번 연속으로 빠르게 대쉬로 이동하는 스킬 입니다. 스네이크는 피격 중, 다운 중, 공중에서 사용이 가능하여 공격을 회피하기에 유용합니다.

step12_title = 호크아이 - 스핀커터(AS)
step12_help  = 스핀커터(AS)는 점프를 하면서 회전하여 주변의 대상들과 함께 위로 올라가며 공격하는 기술입니다. 공격 중 방향키를 입력하여 움직일 수 있습니다..

step13_title = 호크아이 - 국민콤보 ①
step13_help  = ★리턴블레이드(D오래) →기본공격(D→D→D→D) 리턴블레이드(D오래)로 대상을 공격하여 공중 상태를 만든 후 기본공격(D→D→D→D)으로 마무리합니다.

step14_title = 호크아이 - 국민콤보 ②
step14_help  = ★리턴(D오래) → 비상(->-> D, D) → 스핀(A → ->->) 리턴블레이드(D오래)로 대상을 띄우고 비상(->-> D, D)공격을 하여 재차 띄운 후 스핀으로 마무리합니다.

step15_title = 호크아이 - 국민콤보 ③
step15_help  = ★백레이드(ASD) → 블레이드(SD) → 스핀커터(AS) 백레이드(ASD)로 대상을 공격하고 바로 블레이드(SD)를 사용하여 경직 시킨 후 스핀커터(AS)로 마무리합니다.



[Set46]

max_step = 14

step0_title  = 데빌 레인저 - 기본소개
step0_help   = 데빌 레인저는 대상을 따라가 공격하는 다크소울을 발사하는 강력한 석궁을 이용하여 상대를 제압하는 능력을 가진 멀티타겟형 원거리 용병입니다.

step1_title  = 데빌 레인저 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 데빌 레인저 - 다크소울(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 바라보고 있는 곳의 대상을 타겟으로 잡습니다. 최대 4명까지 타겟을 잡아 대상을 따라가 공격하는 다크소울을 발사 할 수 있습니다.

step3_title  = 데빌 레인저 - 슈퍼대쉬 (->->)
step3_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 짧지만 매우 빠른 이동을 하는 슈퍼대시를 사용할 수 있습니다.

step4_title  = 데빌 레인저 - 포지션체인지(->-> D)
step4_help   = 슈퍼대시(->->)후 바로 공격키(D)를 누르면 대상을 공격하면서 자신의 뒤로 이동시킨 후 대상의 뒤를 노릴 수 있습니다. 상대에게 우위를 점할 때 유용합니다.

step5_title  = 데빌 레인저 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 다크소울을 발사합니다. 공격키(D)를 꾹 누르면 공중에서도 타겟을 잡아 공격할 수 있습니다.

step6_title  = 데빌 레인저 - 하이점프 (A 오래)
step6_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다. 하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어 높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step7_title  = 데빌 레인저 - 헬파이어(SD)
step7_help   = 헬파이어는(SD)는 전방의 일정 범위 안의 대상의 수 만큼 헬파이어를 발사하는 기술 입니다. 공중상태에서도 스킬을 사용할 수 있습니다.

step8_title  = 데빌 레인저 - 하트브레이크(ASD)
step8_help   = 하트브레이크(ASD)는 전방으로 빠르게 움직여 상대를 잡아서 땅으로 내려 꽂는 기술 입니다. 대상을 공중으로 띄어오르게 만들기 때문에 추가타격을 줄 수 있습니다.

step9_title  = 데빌 레인저 - 데빌사인(AD)
step9_help   = 데빌사인(AD)은 마법진 위치의 대상을 공중으로 띄워 잡아두는 스킬 입니다. 최대 3번 사용 할 수 있으며, 시전이 끝나면 대상은 무릎을 꿇게 됩니다.

step10_title = 데빌 레인저 - 본스피어(AS)
step10_help  = 본스피어(AS)는 전방의 세방향으로 3개의 뼈를 발사해 적을 공격하는 스킬 입니다. 본스피어의 창은 하나 당 3명까지 연쇄적으로 타격을 줄 수 있습니다.

step11_title = 데빌 레인저 - 국민콤보 ①
step11_help  = ★하트브레이크(ASD) → 기본공격 (D → D → D) 하트브레이크(ASD)로 대상을 공격하여 공중을 튀어 오르게 한 후 기본공격으로 마무리 합니다.

step12_title = 데빌 레인저 - 국민콤보 ②
step12_help  = ★점프 상태에서 헬파이어(SD) →하트브레이크(ASD) 점프 상태에서 헬파이어(SD)로 공격 한 후 빠르게 하트브레이크(ASD)로 공격하여 마무리 합니다.

step13_title = 데빌 레인저 - 국민콤보 ③
step13_help  = ★헬파이어(SD) →데빌사인(AD) →하트브레이크(ASD) 헬파이어(SD)로 대상을 공격한 후 데빌사인(AD)로 공중상태로 만든 후 하트브레이크(ASD)로 마무리 합니다.



[Set47]

max_step = 15

step0_title  = 랜서 - 기본소개
step0_help   = 랜서는 자신보다 더 긴 랜스를 이용하여 멀리서 상대를 타격하거나 돌진공격을 통해 상대를 괴롭히는 능력을 지닌 돌진형 근거리 용병입니다.

step1_title  = 랜서 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 랜서 - 랜스러쉬(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 차징상태가 되고, 공격키(D)를 떼면 방향전환이 가능한 연타 돌진공격을 합니다. 풀차징 시 마지막 타격에서 방어파괴 공격을 합니다.

step3_title  = 랜서 - 대시 공격 (->-> D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 방패로 방어를 한 후 대상을 자신의 쪽으로 끌고오는 공격을 합니다.

step4_title  = 랜서 - 디펜스러쉬 어택 (->-> D 오래누름)
step4_help   = 대시 중 공격키(D) 누르고 있으면 방어자세 취하며 차징을 합니다. 이 때 상대의 공격을 방어할 수 있으며, 공격키(D)를 떼면 대상을 공격합니다.

step5_title  = 랜서 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 지상으로 짧게 대쉬하며 상대를 공격하게 됩니다 공중에서 지상의 적을 기습할 때 유용합니다.

step6_title  = 랜서 - 점프 대시공격 (A →->->)
step6_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 랜스를 전방으로 찌르는 공격을 합니다.

step7_title  = 랜서 - 튕겨내기 (공격 받는 순간 방어)
step7_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step8_title  = 랜서 - 스크류(SD)
step8_help   = 스크류(SD)는 전방으로 대쉬를 하며 대상들을 연타공격을 하는 스킬입니다. 점프 중 사용가능하고 밀면서 공격하기 때문에 대상을 드랍 시킬 때 유용 합니다.

step9_title  = 랜서 - 머스탕(ASD)
step9_help   = 머스탕(ASD)은 지정한 위치로 도약 및 착지하여 주변을 공격하는 스킬입니다. 점프 중 사용가능하고, 4번 연달아 도약하여 공격하여 대상을 띄워버립니다.

step10_title  = 랜서 - 다크호스(AD)
step10_help   = 다크호스(AD)는 앞으로 이동하면서 박치기를 3번하여 공격하는 피격 중 사용가능 스킬입니다. 방향키로 방향전환과 S키 입력으로 대상을 날림 공격을 할수 있습니다.

step11_title  = 랜서 - 글로리(AS)
step11_help   = 글로리(AS)는 망토의 힘을 이용하여 자신과 자신 주변 팀원의 뒤쪽 공격을 완벽히 보호하는 무적 스킬 입니다. 모든 공격을 일시적으로 방어합니다.

step12_title = 랜서 - 국민콤보 ①
step12_help  = ★스크류(SD) → 머스탕(ASD) 스크류(SD)로 대상을 쓰러트린 후 머스탕(ASD)으로 공격하여 마무리합니다.

step13_title = 랜서 - 국민콤보 ②
step13_help  = ★다크호스(AD) → 머스탕(ASD) 다크호스로(AD)로 대상을 공격 한 후 잠시 기다렸다가 머스탕(ASD)으로 공격하여 마무리합니다.

step14_title = 랜서 - 국민콤보 ③
step14_help  = ★다크호스(AD) → 스크류(SD) 다크호스(AD)로 대상을 공중에 띄운 후 스크류(SD)로 공격하여 마무리 합니다.



[Set48]

max_step = 15

step0_title  = 프리스트 - 기본소개
step0_help   = 프리스트 만화의 주인공으로 나이프와 총을 이용하여 근거리 및 원거리 공격을 다채롭게 구사하는 스타일의 프리미엄 용병입니다.

step1_title  = 프리스트 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 프리스트 - 특별공격(D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 총알을 발사합니다. 공격키(D)를 누르고 있는 동안 방향키 입력으로 빠른 이동을 최대 2회 연속할 수 있습니다.

step3_title  = 프리스트 - 대시공격1 (->-> D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 대상을 3번 연타하고 총으로 마무리하는 공격을 합니다.

step4_title  = 프리스트 - 대시공격2 (->-> D + D)
step4_help   = 대시공격1 중에 공격키(D)를 입력하면 대상을 나이프로 공격하여 공중에 띄우는 공격을 합니다. 대상이 공중에 띄워지기 때문에 다음 공격을 이어갈 때 유용합니다.

step5_title  = 프리스트 - 점프공격(A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 나이프로 상대를 베는 공격을 합니다. 공중에서 최대 2번 공격 할 수 있습니다.

step6_title  = 프리스트 - 내려찍기 (A → D + ->->)
step6_help   = 점프공격 중이나 점프중에 방향키를 빠르게 2번 입력하면 입력된 방향으로 빠르게 이동하면서 상대를 내려찍는 공격을 합니다. 맞은 대상은 공중에 살짝 띄워집니다.

step7_title  = 프리스트 -  반격(방어 성공 후 공격)
step7_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다.대상을 나이프로 쳐서 공중에 띄운 후 총을 이용해 공격합니다. 다음 공격을 이어갈 때 유용합니다.

step8_title  = 프리스트 - 헌팅데스(SD)
step8_help   = 헌팅데스(SD)는 전방의 대상을 나이프로 공중에 띄운 후 총을 5번 연사하는 스킬입니다. 나이프 공격 후 공격키(D)를 연타하면 총으로 대상을 공격합니다.

step9_title  = 프리스트 - 퍼니셔(ASD)
step9_help   = 퍼니셔(ASD)은 기관총을 꺼내서 전방으로 총을 난사 후 다이나마이트를 던지는 스킬입니다. 총 난사 중에 공격키(D)를 누르면 다이나마이트를 던져 대상을 공격합니다.

step10_title  = 프리스트 - 이반스텝(AD)
step10_help   = 이반스텝(AD)는 빠른 이동을 하는 스킬입니다. 지상에서는 대각선 공중으로, 공중에서는 대각선 지상으로, 쓰러진 상태에서는 수직으로 뛰어 오르는 이동을 합니다.

step11_title  = 프리스트 - 레드크로스(AS)
step11_help   = 레드크로스(AS)는 십자가를 발사하여 상대를 구속하는 스킬입니다. 스킬유지 시간에 따라 발사갯수가 바뀌며, 스킬 유지시간안에 사용해야 합니다.

step12_title = 프리스트 - 국민콤보 ①
step12_help  = ★특별공격(D 오래누름) → 내려찍기(A→ D + ->->) 특별공격(D 오래누름) 공격 후 내려찍기(A→ D + ->->)로 공격하여 마무리합니다.

step13_title = 프리스트 - 국민콤보 ②
step13_help  = ★퍼니셔(ASD) → 헌팅데스(SD) 퍼니셔(ASD)로 대상을 공격 한 후 대상에게 다가가 헌팅데스(SD)로 공격하여 마무리합니다.

step14_title = 프리스트 - 국민콤보 ③
step14_help  = ★레드크로스(AS) → 퍼니셔(ASD) → 헌팅데스(SD) 레드크로스(AS)로 대상을 못움직이게 한 다음 퍼니셔(ASD)로 공격 후 헌팅데스(SD)로 마무리합니다.



[Set49]

max_step = 15

step0_title  = 카포에라 - 기본소개
step0_help   = 브라질 전통무술인 카포에라만의 독특한 움직임과 다양하게 파생되는 콤보공격을 이용하여 상대를 제압하는 능력을 지닌 근거리계열 용병입니다.

step1_title  = 카포에라 - 기본공격 (D → D → D → D→ D→ D)
step1_help   = 공격키(D)를 연속해서 누르면 6연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 카포에라 - 특별공격1(D 누름떼기)
step2_help   = 공격키(D)를 짧게 꾹 눌렀다 떼면 기본공격과 다른 효과를 내는 공격합니다. 이를 이용하여 다양한 방식의 콤보를 구사하여 공격할 수 있습니다.

step3_title  = 카포에라 - 특별공격2(D 오래누름)
step3_help   = 공격키(D)를 오래누르고 있으면, 물구나무를 서면서 대상을 내려찍는 공격을 합니다. 공격 당한 대상은 경직상태가 되며, 이 때 연계공격을 하기에 유용합니다.

step4_title  = 카포에라 - 대시공격 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 살짝 점프하여 두발로 상대를 차버리는 공격을 합니다.

step5_title  = 카포에라 -  아우자세(->-> D 오래누름)
step5_help   = 달리기로 이동 중에 공격키(D)를 오래 누르면 대쉬공격을 하는 척 하다 아우자세를 취합니다. 이 때 공격키(D)를 누르거나 윈드스핀(AD)스킬로 공격할 수 있습니다.

step6_title  = 카포에라 - 점프공격(A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 회전 후 발차기를 하는 점프 공격을 합니다. 점프공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step7_title  = 카포에라 - 공중잡기 공격 (A → D 오래누름)
step7_help   = 점프키(A)를 누른 상태에서 빠르게 공격키(D)를 오래누르면 대상을 발로 잡아 내려찍는 공격을 합니다. 공격에 실패 시 넘어지며, 충격이 커서 회복이 느립니다.

step8_title  = 카포에라 - 토마스(SD)
step8_help   = 토마스(SD)는 춤을 추는 동작으로 대상을 6번 연타하는 스킬입니다. 누워있는 대상도 타격하며 방향으로 이동을 하면서 사용할 수 있습니다. 다운 중 사용가능합니다.

step9_title  = 카포에라 - 허리케인러너(ASD)
step9_help   = 허리케인러너(ASD)는 대상을 두 발로 잡아 회전과 함께 정면으로 이동 후 대상을 지면에 내리 꽂는 스킬입니다. 이동 중 공격키(D)를 누르면 대상을 땅에 내리 꽂습니다.

step10_title  = 카포에라 - 윈드스핀(AD)
step10_help   = 윈드스핀(AD)은 넘어졌거나 아우자세에서만 사용 할수 있으며, 빠르게 회전하면서 발차기로 대상을 공격하는 스킬입니다. 대상은 공중에 띄우고 자신은 일어납니다.

step11_title  = 카포에라 - 젬베연주(AS)
step11_help   = 젬베연주(AS)는 젬베를 연주하여 음표를 발사해 대상을 시전자에게 오게하는 스킬입니다. 스킬 발동 후 공격키(D)를 연타하면 음표를 여러방향으로 발사합니다.

step12_title = 카포에라 - 국민콤보 ①
step12_help  = ★기본공격(D → D → D → D→ D→ D)→ 토마스(SD) 기본공격 6연타 이후 토마스(SD)로 공격하여 마무리합니다.

step13_title = 카포에라 - 국민콤보 ②
step13_help  = ★젬베연주(AS) →허리케인러너(ASD)  젬베연주(AS)로 대상을 자신에게 오게 만든 후 허리케인러너(ASD)로 마무리합니다.


step14_title = 카포에라 - 국민콤보 ③
step14_help  = ★아우자세(->->D오래누름)→윈드스핀(AD)→토마스(SD) 아우자세를 한 후 윈드스핀으로(AD)로 공격하고 토마스(SD)로 마무리합니다.



[Set50]

max_step = 18

step0_title  = 라그나 - 기본소개
step0_help   = 라그나 더 블러드엣지는 블레이블루의 주인공으로 다양한 선택에 따라 연속적인 몰아치기 공격으로 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 라그나 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 5연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 라그나 - 카네지시저(D 눌렀다 때기)
step2_help   = 공격키(D)를 일정 시간 눌렀다가 때면 전방으로 빠르게 이동하면서 2연타 공격을 합니다. 카네지시저는 대상을 띄우는 효과가 있어 다른 공격 연결에 유용합니다.

step3_title  = 라그나 - 데드스파이크(D 오래누름)
step3_help   = 공격키(D)를 오래누르고 있으면 상대의 방어를 무시하고 공격하는 데드스파이크가 발동됩니다. 데드스파이크 성공시 일정량의 체력이 회복되는 효과가 있습니다.

step4_title  = 라그나 - 대시공격 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 경직시키는 공격이 발동됩니다.

step5_title  = 라그나 - 대시공격 확장(->-> D + D 또는 S)
step5_help   = 대쉬공격 이후 D키 또는 S키를 입력하면 추가 공격이 발동됩니다. D키 입력시 상대를 공중으로 띄우는 효과, S키 입력시 상대를 바운딩 시키는 효과가 발동됩니다.

step6_title  = 라그나 - 점프공격(A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 검으로 대상을 공격을 합니다. 최대 2번 공격 가능하며, 점프공격 중 이중점프/공중 스킬 사용이 가능합니다.

step7_title  = 라그나 - 베리얼엣지 (A 두번 누름)
step7_help   = 점프한 상태에서 다시 점프키(A)를 누르면 공중에서 한번 더 점프가 발동됩니다. 이중 점프후 공격키(D)를 누르면 사선으로 내려찍는 공격이 발동됩니다.

step8_title  = 라그나 - 공중대시 (A → ->->)
step8_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 캐릭터가 보는 방향을 유지하면서 빠르게 방향키 방향으로 이동합니다.

step9_title  = 라그나 - 인페르노D(SD)
step9_help   = 인페르노D(SD)는 상대를 2연타하면서 공중으로 뜨는 스킬입니다. 인페르노D 사용후 점프로 전환되어 점프 공격 등의 공중 공격으로 연결하기 유용합니다.

step10_title = 라그나 - 인페르노D 확장(SD → D → D 또는 S)
step10_help  = 인페르노D(SD) 사용후 D키를 누르면 상대를 띄우는 공격이 발동되고, S키를 누를 경우 바운딩 공격을 합니다. D키를 누를 경우 D키나 S키로 한번 더 공격 할 수 있습니다.

step11_title = 라그나 - 블랙온슬롯(Special SD)
step11_help  = 블랙온슬롯(SD)은 상대에게 7연타 공격을 가하는 스킬입니다. 라그나의 체력이 20％ 이하로 떨어지면 인페르노D 스킬이 블랙온슬롯 스킬로 변경됩니다.

step12_title = 라그나 - 어둠의탐식(ASD)
step12_help  = 어둠의탐식(ASD)은 상대를 빠르게 8연타하는 스킬입니다. 어둠의탐식 스킬 발동후 빠르게 공격키(D)를 연속해서 누르면 상대를 연타합니다.

step13_title = 라그나 - 헬즈팡(AD)
step13_help  = 헬즈팡(AD)은 긴거리를 빠르게 이동하여 2연타하는 스킬입니다. 헬즈팡 스킬을 발동후 공격키(D)를 누르면 주먹 올려치기 공격이 발동되며 공중 사용이 가능합니다.

step14_title = 라그나 - NotOverYet(AS)
step14_help  = NotOverYet(AS)은 넘어진 상대를 일으켜 세운후 주먹으로 타격하는 스킬입니다. NotOverYet은 넘어진 대상에게만 적용되며 주먹 공격시 경직 효과가 발동됩니다.

step15_title = 라그나 - 국민콤보 ①
step15_help  = ★헬즈팡(AD) → 인페르노D(SD) 지상 및 공중에서 헬즈팡(AD)으로 대상을 띄운후 인페르노D(SD)를 사용한 연타 공격으로 마무리합니다.

step16_title = 라그나 - 국민콤보 ②
step16_help  = ★헬즈팡(AD) →어둠의탐식(ASD) → 인페르노D(SD) 지상 헬즈팡(AD)으로 상대를 띄운후 어둠의 탐식(ASD)으로 연타하고 인페르노D(SD)로 이어 받아 마무리합니다.

step17_title = 라그나 - 국민콤보 ③
step17_help  = ★기본공격 → 점프공격 → 베리얼엣지 기본 공격의 마지막 타격 성공시 빠르게 점프키(A)를 눌러 점프한후 점프공격에서 베리얼엣지로 마무리합니다.



[Set51]

max_step = 17

step0_title  = 손오공 - 기본소개
step0_help   = 손오공은 서유기의 주인공으로 자유자재로 늘어나는 여의봉을 무기로 사용하고, 근두운, 분신술, 파초선을 이용해 상대를 제압하는 근거리 계열 용병 입니다.

step1_title  = 손오공 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 손오공 - 특별공격1(D 눌렀다 때기)
step2_help   = 공격키(D)를 일정 시간 눌렀다가 때면 전방으로 점프하며, 회전 공격을 합니다. 이 때, 점프키(A)를 눌러 점프한 후 공격키(D)를 눌러 공격을 할 수 있습니다.

step3_title  = 손오공 - 특별공격2(D 오래누름)
step3_help   = 공격키(D)를 오래누르고 있다가 봉이 커질 때 공격키(D)를 때면 일시적으로 커진 여의봉으로 상대의 방어를 날려 버리는 공격을 합니다. 누운 대상도 공격 가능합니다.

step4_title  = 손오공 - 대시공격1 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 여의봉으로 공격을 합니다.

step5_title  = 손오공 - 대시공격1 확장(->-> D + D + D)
step5_help   = 대쉬공격 이후 공격키(D)키 입력하면 추가 공격이 발동됩니다. 상대를 공격 후 공중으로 점프를 하며, 이 때 한번 더 공격키(D)를 누르면 발차기 공격을 합니다.

step6_title  = 손오공 - 대시공격2 (->-> D 오래누름)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래누르면 여의봉을 길게 늘려 대상을 공격해 뒤로 넘겨버리 는 공격을 합니다.

step7_title  = 손오공 - 점프공격(A → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 지상의 대상을 발로 차는 공격을 합니다. 공격 시 방향키를 입력하면 방향전환하여 공격 합니다.

step8_title  = 손오공 - 이중점프(A 두번 누름)
step8_help   =점프한 상태에서 다시 점프키(A)를 누르면 공중에서 한번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있으며, 이 때 공격키를 누르면 점프 공격도 가능합니다.

step9_title  = 손오공 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step10_title  = 손오공 - 근두운(SD)
step10_help   = 근두운(SD)는 근두운을 타고 상대를 연속으로 타격하는 스킬입니다. 스킬 사용 중에 점프키(A)를 눌러 공중으로 상승하면서 상대를 공격 할 수 있습니다.

step11_title = 손오공 - 격산고(ASD)
step11_help  = 격산고(ASD)는 상대를 잡은 후 원하는 방향으로 날려버리는 스킬입니다. 넘어진 대상도 잡을 수 있으며, D키 오른쪽, S키 정면, A키는 왼쪽으로 대상을 날려버립니다.

step12_title = 손오공 - 분신술(AD)
step12_help  = 분신술(AD)은 자신의 분신을 소환해 공격하는 스킬입니다. 총 3명을 소환하며 D키는 연속공격, S키는 회전공격 A키는 내려찍는 공격을 하는 분신을 소환합니다.

step13_title = 손오공 - 파초선(AS)
step13_help  = 파초선(AS)은 상대를 날려버리는 바람을 발사하는 스킬 입니다. 총 8번을 발사하며, 방향키를 눌러 방향을 전환하면서, 바람을 발사 할 수 있습니다.

step14_title = 손오공 - 국민콤보 ①
step14_help  = ★대시공격2(->-> D 오래누름)→특별공격2(D 오래누름) 대시공격2로 대상을 띄워 뒤로 보낸 후 특별공격2로 마무리합니다.

step15_title = 손오공 - 국민콤보 ②
step15_help  = ★기본공격→격산고(ASD)→특별공격1 기본공격 마지막 타 성공 시 격산고(ASD)로 상대를 잡아 S키로 정면으로 날린 후 특별공격1로 마무리합니다.

step16_title = 손오공 - 국민콤보 ③
step16_help  = ★격산고(ASD) → 분신술(AD) 격산고로 상대를 정면으로 날린 후 분신술을 사용해 마무리합니다.



[Set52]

max_step = 16

step0_title  = 야뇌 백동수 - 기본소개
step0_help   = 만화 야뇌 백동수의 주인공으로 환도를 사용하여 빠른 전진베기와 구르기를 이용한 현란한 플레이로 상대를 제압하는 프리미엄 용병 입니다.

step1_title  = 야뇌 백동수 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 야뇌 백동수 - 전진베기(D 눌렀다 떼기)
step2_help   = 공격키(D)를 일정 시간 눌렀다가 떼면 전진하면서 상대를 공중에 띄우는 공격을 합니다. 공격 후 방향키를 빠르게 두번 입력하면 해당방향으로 구르기를 합니다.

step3_title  = 야뇌 백동수 - 전진베기 중 구르기(D 누른 상태에서 ->->)
step3_help   = 공격키(D)를 누르고 있는 상태에서 방향키를 빠르게 두번 입력하면 해당방향으로 구르기를 합니다. 구르고 난 후에도 공격키를 누르고 있으면 전진베기가 가능합니다.

step4_title  = 야뇌 백동수 - 대시공격 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 베는 공격을 하며, 이후 D키를 눌러 추가공격이 가능합니다.

step5_title  = 야뇌 백동수 - 대시공격 후 구르기(대시공격 후 ->->)
step5_help   = 대쉬공격 이후 방향키를 빠르게 두번 입력하면 해당방향으로 구르면서 이동합니다. 대시공격 이후 상대의 공격을 피할 때 유용합니다.

step6_title  = 야뇌 백동수 - 점프공격(A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 검으로 위에서 아래로 베는 공격을 합니다. 공격시 방향키를 입력하면 방향전환하여 공격 합니다.

step7_title  = 야뇌 백동수 - 공중대시(점프 중 ->->)
step7_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 검으로 찌르는 공격을 합니다. 공격당한 대상은 천천히 쓰러지게 됩니다.

step8_title  = 야뇌 백동수 - 반격 (방어 성공시 바로 공격키(D)입력)
step8_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step9_title  = 야뇌 백동수 - 일도양단 (SD)
step9_help   = 일도양단(SD)는 상대의 무적을 무시하고 빠르게 전진하여 공격하는 스킬입니다. 상대가 경직이 되기 때문에 다양한 추가 공격을 할수 있습니다.

step10_title = 야뇌 백동수 - 당파(ASD)
step10_help  = 당파(ASD)는 대상에게 당파를 사용해 9연속 공격을 하는 스킬입니다. 공격 중 방향을 전환할 수 있으며, 스킬 사용 중 스킬키(ASD)를 누르면 스킬을 멈출 수 있습니다.

step11_title = 야뇌 백동수 - 역습(AD)
step11_help  = 역습(AD)은 상대에게 공격으로 공중에 띄워졌을 때 넘어지지 않고 공격을 하는 스킬입니다. 지상에 닿기 전에 공격키(D)를누르면 상대를 공격합니다.

step12_title = 야뇌 백동수 - 무촉전(AS)
step12_help  = 무촉전(AS)은 상대를 공중에 띄운 후 화살을 연사하는 스킬입니다. 넘어진 대상에게도 가능하며, 공격키(D)를 눌러 화살을 발사할 수 있습니다.

step13_title = 야뇌 백동수 - 국민콤보 ①
step13_help  = ★일도양단(SD)→당파(ASD) 일도양단(SD)으로 상대를 공격한 후 대상을 바라보고 당파(ASD)로 마무리합니다.

step14_title = 야뇌 백동수 - 국민콤보 ②
step14_help  = ★전진베기(D 누름떼기)→기본공격(D→D→D→D) 전진베기(D누름떼기)로 공중에 띄운 후 기본공격으로 마무리합니다.

step15_title = 야뇌 백동수 - 국민콤보 ③
step15_help  = ★일도양단(SD)→당파(ASD)→무촉전(AS) 일도양단(SD)로 공격한 후 대상을 바라본 후 당파(ASD)로 공격하고 무촉전(AS)으로 마무리합니다.


[Set53]

max_step = 14

step0_title  = 인디언 - 기본소개
step0_help   = 인디언은 토마호크와 투창을 무기로 사용하며, 상대를 멀리 밀고 가는 투창 던지기 공격과 강력한 경직공격으로 상대를 제압하는 근거리계열 용병 입니다.

step1_title  = 인디언 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 인디언 - 투창 던지기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 파워차징 공격이 발동됩니다. 공격키를 오래누를 수록 파워가 증가하며 방향키로 창을 던지는 방향을 조종해 상대를 밀고 가는 공격을 합니다.

step3_title  = 인디언 - 투창 던지기 중 대시(D 누른 상태에서 ->->)
step3_help   = 공격키(D)를 누르고 있는 상태에서 방향키를 빠르게 두번 입력하면 현재 바라보는 방향을 유지한 상태에서 짧은 대시를 합니다.

step4_title  = 인디언 - 대시공격 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 점프를 하여 상대에게 접근 후 바운딩 공격을 합니다.

step5_title  = 인디언 - 대시공격 차징(대시 이후 D오래)
step5_help   = 대시 이동 중 D키를 오래 누르면 대시 차징이 발동됩니다. 대시 차징은 차징길이에 따라 전진 속도, 거리, 데미지가 길어져서 기습 공격에 유리합니다.

step6_title  = 인디언 - 점프공격(A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 토마호크를 아래로 던지는 공격을 합니다. 이 때 공격키(D)를 한번 더 입력하면 투창을 던져 공격합니다.

step7_title  = 인디언 - 투창(SD)
step7_help   = 투창(SD)은 투창을 던져 상대를 밀고 가는 공격을 하는 스킬입니다. 점프 중 사용 시 대각선 아래로 창을 던지며 상대를 무릎 꿇게 만듭니다.

step8_title = 인디언 - 습격(ASD)
step8_help  = 습격(ASD)은 은신을 한 후 지정방향으로 점프하여 상대를 공격하는 스킬입니다. 공격당한 대상은 천천히 쓰러지게 되며, 다음 공격을 연결할 때 유용합니다.

step9_title = 인디언 - 고함(AD)
step9_help  = 고함(AD)은 인디언고함을 질러서 상대를 강제로 고함을 치게 만드는 스킬입니다. 시전 후 바로 공격키(D)를 연타하면 공격거리와 범위가 증가합니다.

step10_title = 인디언 - 독침(AS)
step10_help  = 독침(AS)은 독침을 상대에게 발사해 공격하는 스킬입니다. 공격키(D)를 눌러 독침을 발사하며, 피격당한 대상은 천천히 느려지다가 잠시동안 행동불능이 됩니다.

step11_title = 인디언 - 국민콤보 ①
step11_help  = ★습격(ASD)→투창(SD) 습격(ASD)으로 상대를 공격한 후 투창(SD)로 마무리합니다.

step12_title = 인디언 - 국민콤보 ②
step12_help  = ★대시공격(->-> D)→투창 던지기(D오래누름) 대시공격(->-> D)으로 공격해 상대를 바운딩 시킨 후 투창 던지기(D 오래누름)로 마무리 합니다.

step13_title = 인디언 - 국민콤보 ③
step13_help  = ★독침(AS)→습격(ASD)→투창(SD) 독침(AS)으로 공격한 후 습격(ASD)으로 공격하여 경직상태로 만들고 투창(SD)으로 마무리 합니다.


[Set54]

max_step = 16

step0_title  = 하자마 - 기본소개
step0_help   = 하자마는 블레이블루에서 활약하는 캐릭터로 우로보로스를 사용해 지상과 공중을 빠르게 이동하며, 점프연타로 상대를 제압하는 프리미엄 용병 입니다.

step1_title  = 하자마 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 하자마 - 우로보로스 발사 (D 누름떼기)
step2_help   = 공격키(D)를 일정시간 누르고 있다 떼면, 우로보로스를 안내선 방향으로 발사합니다. 공격키(D)를 누르고 있는 동안 방향전환이 가능합니다.

step3_title  = 하자마 - 우로보로스 이동(D 누름떼기 →A)
step3_help   = 우로보로스 발사 이후 점프키(A)를 누르면 발사 방향으로 이동이 가능합니다. 무기 아이콘에 표시된 숫자만큼 연속이동이 가능하며, 지상 착지 시 자동충전 됩니다.

step4_title  = 하자마 - 대시공격 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 밀어내는 공격을 하는 사인아가 발동됩니다.

step5_title  = 하자마 - 점프공격(A →D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 연타하면 총 6연타를 하는 점프 공격을 사용할 수 있습니다.

step6_title  = 하자마 - 이중점프 (A 두번 누름)
step6_help   = 점프한 상태에서 다시 점프키(A)를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있으며 이때 공격키를 누르면 점프 공격도 가능합니다.

step7_title  = 하자마 - 공중대시 (A → ->->)
step7_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 직선 이동을 하는 공중 대시가 발동됩니다.

step8_title  = 하자마 - 공중 우로보로스 (A →D 누름떼기)
step8_help   = 점프 상태에서 공격키(D)를 누르고 있으면, 우로보로스 발사할 수 있는 상태가 되며, 이때 공격키(D)를 떼면 우로보로스가 발사 됩니다. 점프키(A)를 눌러 이동 가능합니다.

step9_title  = 하자마 - 교룡열화참(SD)
step9_help   = 교룡열화참(SD)은 대상을 끌고와 연타공격을 하는 스킬입니다. 우로보로스는 방어가 가능하며, 넘어진 대상도 끌어와 공격키(D)를 연타해 추가공격이 가능합니다.

step10_title = 하자마 - 사익붕천인(ASD)
step10_help  = 사익붕천인(ASD)은 일정시간 동안 방어상태가 되고, 이때 공격을 받으면 자동으로 공격하는 스킬입니다. 단 방어 파괴 공격에서는 자동으로 공격하지 않습니다.

step11_title = 하자마 - 사찰(AD)
step11_help  = 사찰(AD)은 점프/지상/다운에 따라 각기 다른 공격을 하는 스킬입니다. 점프상태에서는 바운딩 공격, 지상에서는 띄움 공격, 다운 시에는 기립 후 띄움 공격을 합니다.

step12_title = 하자마 - 사교(AS)
step12_help  = 사교(AS)는 방어 가능한 우로보로스를 발사해 대상을 지정된 위치로 당겨오는 스킬입니다. 지정된 위치로 당겨진 대상은 추가타격을 할 수 있습니다.

step13_title = 하자마 - 국민콤보 ①
step13_help  = ★사찰(AD)→기본공격(D→D→D→D)→교룡열화참(SD) 사찰(AD)로 상대를 공격한 후 기본공격으로연결하고 교룡열화참(SD)으로 공격키(D)를 난타해 공격합니다.

step14_title = 하자마 - 국민콤보 ②
step14_help  = ★우로보로스 이동(D누름 떼기→A)→점프공격 우로보로스 이동(D누름떼기→A)사용 후 점프 상태가 되면 공격키(D)를 난타해 난타공격을 합니다.

step15_title = 하자마 - 국민콤보 ③
step15_help  = ★사찰(AD)→기본공격(D→D→D→D)→교룡열화참(SD) 사교(AS)→뒤돌아서 우로보로스 이동(D누름 떼기→A) →점프공격(D→D→D→D→D→D)


[Set55]

max_step = 14

step0_title  = 록스타 - 기본소개
step0_help   = 록스타는 전자기타로 다양한 연주로 강력한 범위 공격과 상대를 당겨오는 능력으로 상대를 끊임없이 괴롭히는 특수 계열 용병입니다.

step1_title  = 록스타 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 록스타 - 기타 속주 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 보는 방향으로 이동하면서 기타 연주로 범위공격을 합니다. 방향키를 눌러 뱡향전환이 가능하고 마지막 공격은 상대를 경직 상태로 만듭니다.

step3_title  = 록스타 - 스트로크(기타속주 중 D키 입력)
step3_help   = 기타 속주 중에 공격키(D)를 누르면, 대상을 자신에게 당겨 오는 범위공격을 합니다. 연타로 사용이 가능하며 상대의 방어를 파괴 합니다.

step4_title  = 록스타 - 슈퍼대시 (->->)
step4_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두번 누르면 그 방향으로 짧지만 빠르게 이동하면서 대상을 관통하는 슈퍼대시를 할 수 있습니다.

step5_title  = 록스타 - 하이점프 (A 오래)
step5_help   = 점프키(A)를 오래 누르면 하이 점프가 발동합니다. 하이 점프는 일반 점프보다 높이 뛸 수 있어 높은 지형의 이동을 하기에 유용합니다.

step6_title  = 록스타 - 점프 공격1 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 범위공격을 하는 기타연주를 합니다.

step7_title  = 록스타 - 점프 공격2 (A → D 오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 기타를 이용해 상대를 내려찍는 점프 공격을 합니다. 넘어진 대상도 공격가능 합니다.

step8_title  = 록스타 - 로큰롤(SD)
step8_help   = 로큰롤(SD)은 빠르게 이동하면서 기타를 연주해 자기 주변을 공격하는 스킬입니다. A, S, D키를 누르면 스킬 사용을 중지하고 키 입력에 맞는 행동을 하게 됩니다.

step9_title = 록스타 - 클라이막스(ASD)
step9_help  = 클라이막스(ASD)는 점프 중 사용가능하고 전방대시 후 연주로 주변의 대상을 당겨와 공격하는 스킬입니다. 연주로 대상을 당겨오고 마지막에 상대를 날리는 공격을 합니다.

step10_title = 록스타 - 헹가레(AD)
step10_help  = 헹가레(AD)는 전방으로 점프하여 대상을 헹가레를 하게 만드는 스킬입니다. 최대 4번 헹가레를 하며, 마지막 공격은 상대를 지면에 눌러 붙게 만듭니다.

step11_title = 록스타 - 샤우팅(AS)
step11_help  = 샤우팅(AS)은 확성기들 들고 이동하면서 상대에게 소리를 질러 공격하는 스킬입니다. 공격키(D)는 짧은 경직 공격을, 방어키(S)는 강한 밀림 공격을 합니다.

step12_title = 록스타 - 국민콤보 ①
step12_help  = ★기타속주→클라이막스(ASD) 기타속주(D오래누름)로 공격하고 클라이막스(ASD)로 넘어진 대상을 일으켜 세운 후 공격해 마무리 합니다.

step13_title = 록스타 - 국민콤보 ②
step13_help  = ★헹가레(AD)→클라이막스(ASD)→샤우팅(AS) 헹가레(AD)로 상대를 공격 후 클라이막스(ASD)로 공격하고 샤우팅(AS)의 S키 입력으로 공격해 마무리 합니다.


[Set56]

max_step = 16

step0_title  = 창천협객 - 기본소개
step0_help   = 창천협객는 게임 창천에서 활약하고 있는 캐릭터로 이도를 무기로 사용하여 빠른 대시와 긴 전진거리를 이용한 연타공격으로 상대를 제압하는 프리미엄 용병 입니다.

step1_title  = 창천협객 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 창천협객 - 연1 (D 누름떼기)
step2_help   = 공격키(D)를 일정시간 누르고 있다 떼면, 앞으로 총 4번 대시하면서 대상을 공격 합니다. 공격 중 방향전환이 가능하며, 사용 중 점프키(A)를 눌러 점프할 수 있습니다.

step3_title  = 창천협객 - 연2 (연 사용 중 공격키D 누름)
step3_help   = 연1 사용중 2연타 이 후에 공격키(D)를 누르면 상대를 공중에 띄우는 연타공격을 합니다. 공격이 끝나면 점프 상태가 되며, 공격키(D)로 점프공격을 할 수 있습니다.

step4_title  = 창천협객 - 대시공격1 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대에게 빠르게 접근 후 발차기 공격을 합니다.

step5_title  = 창천협객 - 대시공격2 (->-> D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 상대에게 빠르게 접근 후 상대를 공중에 띄우는 공격을 합니다.

step6_title  = 창천협객 - 점프공격(A →D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 검으로 위에서 아래로 상대를 베는 공격을 합니다. 점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step7_title  = 창천협객 - 이중점프 (A 두번 누름)
step7_help   = 점프한 상태에서 다시 점프키(A)를 누르면 공중에서 한번 더 점프가 발동됩니다. 이때 공격키를 누르면 바닥을 강하게 내려 찍는 점프 공격을 합니다.

step8_title  = 창천협객 - 공중대시 (A → ->->)
step8_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 직선 이동을 하면서 3연타 공격을 합니다.

step9_title  = 창천협객 - 연격(SD)
step9_help   = 연격(SD)은 정면으로 총 9번 대시를 하면서 상대를 공격하는 스킬입니다. 스킬 사용 중 방향전환이 가능하며, A, S, D키를 누를 경우 스킬 사용을 중지합니다.

step10_title = 창천협객 - 수호영웅(ASD)
step10_help  = 수호영웅(ASD)은 삼국지의 영웅을 소환하여 총 3번을 공격하는 스킬입니다. 마지막 공격은 상대를 바운딩 상태로 만들어 다음 공격을 연결하기에 좋습니다.

step11_title = 창천협객 - 홍련(AD)
step11_help  = 홍련(AD)은 자신 주변의 대상들을 밀어 내면서 잠시동안 경직 상태로 만드는 스킬입니다. 넘어진 대상도 공격할 수 있으며, 넘어진 대상은 띄움 상태가 됩니다.

step12_title = 창천협객 - 순보(AS)
step12_help  = 순보(AS)는 기를 발사해 충돌된 곳의 공중으로 이동시켜 주는 스킬입니다. 점프 중에도 사용할 수 있으며, 점프 상태에서 공격키를 누르면 점프공격으로 전환이 됩니다.

step13_title = 창천협객 - 국민콤보 ①
step13_help  = ★홍련(AD)→기본공격(D→D→D→D) 홍련(AD)으로 상대를 공격한 후 기본공격으로 마무리 합니다.

step14_title = 창천협객 - 국민콤보 ②
step14_help  = ★순보(AS)→공중대시(A → ->->) 순보(AS)로 공격한 후 점프상태에서 지상에 닿기 전에 공중대시(A → ->->) 공격해 마무리합니다.

step15_title = 창천협객 - 국민콤보 ③
step15_help  = ★홍련(AD)→기본공격(D→D→D→D)→연1(D 오래누름) →연2(연 사용 중 공격키(D))→공중대시(A → ->->)


