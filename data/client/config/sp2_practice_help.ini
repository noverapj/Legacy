step6_title  = 웨어울프 - 물기(변신상태에서  D 누름떼기)
step6_help   = 웨어울프 상태에서 공격키(D)를 살짝 눌렀다 떼면 울프 게이지를 회복시키는 공격을 합니다. 방어 무시 및 누운 대상도 공격이 가능하고, 상대는 잠시 경직이 됩니다.

step7_title  = 웨어울프 - 웨어울프 해제(변신상태에서  D 오래누름)
