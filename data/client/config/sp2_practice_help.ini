step0_title  = 아자젤 - 기본소개
step0_help   = 타락의 아자젤은 상대에게 소악마를 생성한 뒤 원하는 위치로 이동시키거나 서로 자리를 바꿔서 제압하는 유니크 용병입니다. 

step1_title  = 아자젤 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 아자젤 - 제물 탐색 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 구 형태의 영역이 생성됩니다. 영역 안에 가장 가까운 대상에게 마크가 생기며, 공격키(D)를 떼면 대상에게 발사체를 발사합니다.

step3_title  = 아자젤 - 소악마 (특별기능)
step3_help   = 발사체에 피격되면 소악마가 소환되어 상대의 등에 달라붙어 있게 됩니다. 상대가 발사체를 방어 시 상대 앞에 소악마가 생성되어 달라붙기를 시도합니다.

step4_title  = 아자젤 - 악마 이동 (D 오래누름)
step4_help   = 범위 내에 소악마가 달라붙어 있는 대상이 있을 때 공격키(D)를 오래 누르면서 방향키를 누르면 입력한 방향으로 상대를 이동 시킵니다.

step5_title  = 아자젤 - 악마 교환 (A 오래누름)
step5_help   = 범위 내에 소악마가 달라붙어 있는 대상이 있을 때 점프키(A)를 오래 누르면 대상과 자신의 위치를 변경합니다.

step6_title  = 아자젤 - 게이지
step6_help   = 게이지는 딜레이, 걷기, 달리기 시 회복되며, 제물 탐색 및 점프/대시 타락의 화살 사용 시 차감됩니다.

step7_title  = 아자젤 - 점프공격 (A → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 연타하면 총 6연타를 하는 점프 공격을 사용할 수 있습니다.

step8_title  = 아자젤 - 점프대시 (A → ->->)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 방향키를 빠르게 두번 누르면 아래로 빠르게 하강하면서 공격합니다.

step9_title  = 아자젤 - 점프 타락의 화살 (A → D 오래누름)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 전방으로 발사체를 발사 합니다. 발사체는 제물 탐색의 발사체와 동일한 효과를 가집니다.

step10_title = 아자젤 - 대시공격 (->-> → D → D)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 2연타 하는 대시 공격이 가능합니다.

step11_title = 아자젤 - 대시 타락의 화살 (->-> → D오래누름)
step11_help  = 대시 상태에서 공격키(D)를 오래 누르면 전방으로 발사체를 발사 합니다. 발사체는 제물 탐색의 발사체와 동일한 효과를 가집니다.

step12_title = 아자젤 - 반격 (방어 성공시 바로 공격)
step12_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step13_title = 아자젤 - 타락천사의 강림 / 무기스킬(SD)
step13_help  = 타락천사의 강림(SD)은 주기적으로 불덩이를 던지는 대 악마를 소환하는 스킬 입니다. 불덩이에 피격되면 소악마가 달라붙게 됩니다.

step14_title = 아자젤 - 번뇌의 추락 / 갑옷스킬(ASD)
step14_help  = 번뇌의 추락(ASD)은 원형으로 퍼져나가는 불덩이를 연속으로 소환하여 상대를 밀쳐내는 스킬입니다.

step15_title = 아자젤 - 재앙의 추락 / 투구스킬(AD)
step15_help  = 재앙의 추락(AD)은 원하는 지점으로 순간이동한 뒤 주변 대상에게 불꽃을 떨어트려 스턴상태에 빠지게 만드는 스킬입니다.

step16_title = 아자젤 - 공포의 추락 / 망토스킬(AS)
step16_help  = 공포의 추락(AS)은 하늘 위로 올라가 연속으로 불꽃을 바닥에 던지는 스킬입니다. 바닥에서 생성된 불꽃은 자동으로 상대에게 서서히 다가갑니다.

step17_title = 아자젤 - 국민콤보 ①
step17_help  = ★재앙의 추락(AD) → 번뇌의 추락(ASD) 재앙의 추락으로 상대를 스턴시킨 뒤 번뇌의 추락을 통해 밀어내며 마무리 합니다.

step18_title = 아자젤 - 국민콤보 ②
step18_help  = ★재앙의 추락(AD) → 제물 탐색(D 누름유지 후 떼기) → 악마 이동 (D 오래누름) → 점프대시 (A → ->->) 로 마무리 합니다.



[Set193]

max_step = 19

step0_title  = 메가에이전트 - 기본소개
step0_help   = 메가에이전트는 공중에서 활강하며 권총과 샷건을 사용해 적을 제압시키는 레어 용병입니다.

step1_title  = 메가에이전트 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 메가에이전트 - 샷건 발사 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 자신의 전방으로 샷건을 발사합니다. 피격 당한 적은 스턴에 걸리며 서서히 넘어지게 됩니다. 샷건 사용 시 게이지 2을 사용 합니다.

step3_title  = 메가에이전트 - 캔슬 구르기 (D 오래누름 →대시)
step3_help   = 샷건을 발사한 뒤 방향키 ->->키 입력 시 입력한 방향으로 구르기 기능을 사용하며, 캐릭터를 관통할 수 있습니다. 

step4_title  = 메가에이전트 - 장전 (S 오래누름)
step4_help   = 방어키(S)를 오래 누르고 있거나, 총알이 한발도 없을 시 D오래누름 누르면 장전이 발동됩니다. 총알이 없으면 사격이 불가능하며 총 30발의 총알을 장전할 수 있습니다.

step5_title  = 메가에이전트 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 연타하면 총 3연타를 하는 점프 공격을 사용할 수 있습니다.

step6_title  = 메가에이전트 - 점프 그래비티 (A →D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 활강 상태로 변하게 됩니다. 상하좌우 방향 전환이 가능하며 공중에서 천천히 지상으로 착지 합니다.

step7_title  = 메가에이전트 - 그래비티 핸드샷 (D오래누름 → D입력)
step7_help   = 공중에서 활강 중 D키 입력 시 전방으로 권총을 발사하게 됩니다. 1발당 1게이지가 차감되며. 지상, 공중, 다운 어택이 가능합니다.

step8_title  = 메가에이전트 - 그래비티 샷건 (D오래누름 → D오래누름)
step8_help   = 공중에서 활강 중 D오래누름 시 전방으로 샷건을 발사하게 됩니다. 1발당 2게이지가 차감되며, 지상, 공중, 다운 어택이 가능하며, 지상의 적 타격 시 스턴 효과가 부여됩니다.

step9_title  = 메가에이전트 - 그래비티 어택 (D오래누름 → ->-> 대시 입력)
step9_help   = 공중에서 활강 중 ->-> 대시키 입력 시 입력한 방향의 대각선 아래로 돌진하게 됩니다. 일정 거리 이상 도달 시 자동 점핑 상태로 변환되며 착지하거나 점프 공격을할 수 있습니다.

step10_title = 메가에이전트 - 대시공격 (->-> →D)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 하늘로 띄우는 발차기 공격이 발동됩니다.

step11_title = 메가에이전트 - 하우스 턴 (->-> → D오래누름)
step11_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D오래누름)를 누르면 하우스턴이 발동되며 타격 성공 시 상대방을 반대편으로 날려보냅니다.

step12_title = 메가에이전트 - 튕겨내기 (순간 방어 성공시)
step12_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step13_title = 메가에이전트 - 컨프런트 샷 / 무기스킬(SD)
step13_help  = 컨프런트 샷(SD)은 전방의 적에게 권총과 샷건으로 무차별 공격을 하는 스킬 입니다. 방어 파괴 효과를 가지고 있으며 공중, 지상의 적에게 스턴 효과를 부여합니다.

step14_title = 메가에이전트 - 러쉬 붐 / 갑옷스킬(ASD)
step14_help  = 러쉬 붐(ASD)은 전방으로 돌진하여 상대방을 스턴 시키는 스킬입니다. 다운, 피격 중 사용이 가능 합니다.

step15_title = 메가에이전트 - 체인지 러쉬 / 투구스킬(AD)
step15_help  = 체인지 러쉬(AD)은 공중에서 대시 키(A →->->) 입력 시 입력한 방향으로 빠르게 회전하며 공격하는 스킬입니다. 피격 된 상대는 바운딩 되고 하늘로 띄우게 됩니다.

step16_title = 메가에이전트 - 리트리트 / 망토스킬(AS)
step16_help  = 리트리트(AS)은 피격중, 다운 피격중, 공중 피격중, 모든 상태 이상 버프 중 사용이 가능하며, 입력된 방향으로 앞구르기를 하며 회피하는 스킬입니다. 

step17_title = 메가에이전트 - 국민콤보 ①
step17_help  = ★러쉬 붐(ASD) → 컨프런트 샷(SD) 러쉬 붐으로 상대방을 스턴 시킨 후 컨프런트 샷으로 마무리 합니다.

step18_title = 메가에이전트 - 국민콤보 ②
step18_help  = ★대시공격(->-> →D) →공중 기본 3타(D →D →D) →그래비티 핸드샷(D~ →DDDD) →그래비티 어택(D~ →->->) 대시공격으로 상대방을 띄운 뒤 공중 3타 타격 후 그래비티 핸드샷과 어택으로 마무리 합니다.



[Set194]

max_step = 17

step0_title  = 네오 - 기본소개
step0_help   = 네오는 비행할 수 있는 슈퍼보드와 추적해서 공격하는 O-Bot을 이용해 상대를 제압하는 컨테스트 용병입니다. 

step1_title  = 네오 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 네오 - 슈퍼보드 탑승 (A 오래누름)
step2_help   = 점프키(A)를 누르고 있으면 슈퍼보드에 탑승합니다. 점프키(A)를 누르면 탑승이 해제 되며, 대시, 점프 중에도 사용할 수 있습니다.

step3_title  = 네오 - 슈퍼보드 돌진 (A 오래누름 → D)
step3_help   = 슈퍼보드 탑승 상태에서 공격키(D)를 누르면 에임이 있는 방향으로 전진하며 공격하며, 공격 완료 시 점프하게 됩니다.

step4_title  = 네오 - 과출력 (A 오래누름 → S)
step4_help   = 슈퍼보드 탑승 상태에서 방어키(S)를 누르면 바라보는 방향의 대각선 아래로 보드의 부스터 에너지를 과출력하여 레이져 포를 발사 합니다.

step5_title  = 네오 - O-Bot 생성 (D 누름떼기)
step5_help   = 공격키(D)를 눌렀다 떼면 시전자를 따라다니는 O-Bot을 생성합니다. 대시, 점프, 슈퍼보드 탑승 중에도 생성이 가능합니다.

step6_title  = 네오 - O-Bot 발사 (D 누름유지)
step6_help   = 공격키(D)를 누른 상태를 유지하면 상대를 추적하는 O-Bot을 생성한 수 만큼 발사합니다. 슈퍼보드 탑승 상태에서 발사 시 발사 개수가 증가하며, 효과가 변경됩니다.

step7_title  = 네오 - 게이지
step7_help   = 게이지는 딜레이, 걷기, 달리기 시 회복되며, 슈퍼보드 탑승 시와 탑승 유지 시 차감 됩니다.

step8_title  = 네오 - 점프공격 (A → D → D → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 연타하면 총 3연타를 하는 점프 공격을 사용할 수 있습니다.

step9_title  = 네오 - 슈퍼보드 저공 낙하 (A → S 누름유지)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이때 방어키(S)를 누른 상태로 유지하면 기본 낙하속도 보다 느리게 하강할 수 있습니다.

step10_title = 네오 - 대시공격 (->-> → D)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 띄우는 대시 공격이 가능합니다.

step11_title = 네오 - O-Monster / 무기스킬(SD)
step11_help  = O-Monster(SD)는 대형 O-Bot을 소환해 폭발시키는 스킬 입니다. 점프 중에도 사용이 가능합니다.

step12_title = 네오 - 스페셜 커버 / 갑옷스킬(ASD)
step12_help  = 스페셜 커버(ASD)는 잠시동안 드랍 존 이동이 가능하도록 만들어 주는 스킬입니다. 피격/공중 피격 중 사용이 가능합니다.

step13_title = 네오 - 타임머신 / 투구스킬(AD)
step13_help  = 타임머신(AD)은 원하는 지점으로 이동할 수 있는 타임머신을 소환하는 스킬입니다. 타임머신 위에서 점프키(A)를 누르면 활성화 됩니다.

step14_title = 네오 - 스마트 어택 / 망토스킬(AS)
step14_help  = 스마트 어택(AS)은 반 패시브 형 스킬로 게이지가 최대치일 때 상대를 공격하게 되면 모든 스킬 게이지를 일정량 감소 시킵니다.

step15_title = 네오 - 국민콤보 ①
step15_help  = ★O-Monster(SD) → 점프공격(A → D → D → D) O-Monster로 상대를 띄운 뒤 점프공격으로 마무리 합니다.

step16_title = 네오 - 국민콤보 ②
step16_help  = ★O-Monster(SD) → 슈퍼보드 돌진(A 오래누름 → D) → 점프공격(A → D → D → D)으로 마무리 합니다.



[Set195]

max_step = 18

step0_title  = 산타 - 기본소개
step0_help   = 산타는 썰매를 타고 다니면서 선물을 뿌려 상대를 따라오도록 만들어 제압하는 레어 용병입니다.

step1_title  = 산타 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 산타 - 썰매타기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 썰매에 탑승하여 자동으로 이동합니다. 점프키(A)를 누르면 상승하고, 방어키(S)를 누르면 하강하게 되며 점프 중에도 사용이 가능합니다.

step3_title  = 산타 - 포획 (D 오래누름 → D)
step3_help   = 썰매 탑승 상태에서 공격키(D)를 누르면 조준점이 있는 방향으로 밧줄을 던져 대상을 잡아당깁니다. 당겨진 대상은 썰매를 끌어 썰매의 이동속도를 증가시킵니다.

step4_title  = 산타 - 선물투하 (포획된 상태에서 D)
step4_help   = 썰매를 끌고 있는 대상이 있을 때 공격키(D)를 누르면 선물상자를 바닥에 뿌리게 됩니다. 선물상자에 피격된 대상은 산타를 따라오게 됩니다.

step5_title  = 산타 - 대시이동 (포획된 상태에서 ->->)
step5_help   = 썰매를 끌고 있는 대상이 있을 때 방향키를 빠르게 두번 누르면 입력 방향으로 빠르게 전진이동하는 대시이동이 가능합니다.

step6_title  = 산타 - 방출 (포획된 상태에서 D 오래누름)
step6_help   = 썰매를 끌고 있는 대상이 있을 때 공격키(D)를 오래 누르면 포획된 대상을 발로차서 날려보내게 되며 썰매 탑승 상태도 종료 됩니다.

step7_title  = 산타 - 게이지
step7_help   = 게이지는 썰매 탑승 시 일정량이 소모되며, 유지동안에 지속적으로 차감됩니다. 포획된 대상이 있을 때와 없을 때 차감속도는 각기 다릅니다.

step8_title  = 산타 - 점프공격 (A → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 종을 내려쳐서 공격하는 점프공격이 발동 됩니다.

step9_title  = 산타 - 대시공격 (->-> → D → D)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대시 공격이 가능합니다.

step10_title = 산타 - 대시 특별공격 (->-> → D 오래누름)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면 대상을 바운딩 시키는 대시 특별공격이 가능합니다.

step11_title = 산타 - 튕겨내기 (공격 받는 순간 방어)
step11_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step12_title = 산타 - 크리스마스에는 축복을 / 무기스킬(SD)
step12_help  = 크리스마스에는 축복을(SD)은 공격키(D)를 누른 상태를 유지해서 마법진을 통해 원하는 방향으로 선물상자를 날리는 스킬입니다. 

step13_title = 산타 - 메리 크리스마스~ / 갑옷스킬(ASD)
step13_help  = 메리 크리스마스~(ASD)는 주변의 대상을 잠시동안 몬스터로 만들어서 눈을 굴리게 한 뒤 폭발시켜 날리는 스킬 입니다.

step14_title = 산타 - 빨리달리자~ / 투구스킬(AD)
step14_help  = 빨리달리자~(AD)는 썰매를 타고 다니면서 피격된 대상을 잠시동안 루돌프로 만드는 스킬 입니다.

step15_title = 산타 - 징글벨징글벨 / 망토스킬(AS)
step15_help  = 징글벨징글벨(AS)은 뛰어다니면서 상자를 던져 상대를 잠시동안 스턴상태로 만드는 스킬입니다.

step16_title = 산타 - 국민콤보 ①
step16_help  = ★점프공격(A → D) → 기본공격(D → D → D) 점프공격으로 바운딩 시킨 후 기본공격으로 마무리 합니다.

step17_title = 산타 - 국민콤보 ②
step17_help  = ★크리스마스에는 축복을(SD)을 통해 상대를 끌고 온뒤 대시 특별공격(->-> D 오래누름)으로 바운딩 시킨 후 기본공격(D → D → D)으로 마무리 합니다.



[Set196]

max_step = 18

step0_title  = 잭프로스트 - 기본소개
step0_help   = 잭프로스트는 눈덩이를 만들어 친구들에게 나누어 주거나 눈덩이를 집어 던져서 상대방을 제압하는 레어 용병입니다.

step1_title  = 잭프로스트 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 잭프로스트 - 눈덩이 제작 (D 오래 누름)
step2_help   = 공격키(D)를 오래 누르면 전방에 눈덩이를 3개 만듭니다. 눈덩이는 같은 팀일 경우 습득할 수 있으며 상대 팀은 눈덩이를 소멸 시킬 수 있습니다.

step3_title  = 잭프로스트 - 눈덩이 습득 (눈덩이 위에서 A)
step3_help   = 생성된 눈덩이 위에서 A키 입력 시 눈덩이를 습득할 수 있습니다. 눈덩이를 습득한 나 자신의 상태는 특별 상태로 변경되며 게이지가 생성 됩니다.

step4_title  = 잭프로스트 - 눈덩이 발사 준비 (D 오래 누름)
step4_help   = 눈덩이를 들고 있는 상태에서 공격키(D) 오래 누르면 매직 서클이 생성되며 전방으로 전진하게 됩니다. 방향 전환 및 이동이 가능합니다.

step5_title  = 잭프로스트 - 눈덩이 발사 (D 오래 누름 떼기)
step5_help   = D 오래 누름 상태에서 D키를 떼면 눈덩이가 매직 서클 방향으로 발사되며 D오래 누름 시간에 따라 타격 효과가 달라 집니다.

step6_title  = 잭프로스트 - 눈덩이 피격 
step6_help   = 눈덩이 피격 시 넉백 상태가 되며 풀차징 된 눈덩이에 피격 시 눈사람으로 변신하게 됩니다. 일정 시간 동안 움직일 수 없습니다.

step7_title  = 잭프로스트 - 게이지 (눈덩이 습득 시)
step7_help   = 눈덩이 습득 시 게이지가 생성 됩니다. 이후 5번까지 눈덩이를 던질 수 있습니다.

step8_title  = 잭프로스트 - 점프공격 (A → D D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 전방으로 눈덩이를 던지게 됩니다. 최대 2회 던질 수 있습니다.

step9_title  = 잭프로스트 - 대시공격 (->-> → D )
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대시 공격이 가능합니다.

step10_title = 잭프로스트 - 대시 특별공격 (->-> → D 오래 누름)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면 전방으로 눈덩이를 굴려 보냅니다.

step11_title = 잭프로스트 - 반격 (방어 성공시 바로 공격)
step11_help  = 공격 방어 후 바로 공격을 하면 재빨리 뒤로 이동한 뒤 전방으로 눈덩이를 던져 상대방을 넉백 시킵니다.

step12_title = 잭프로스트 - 메이크 스노우 / 무기스킬(SD)
step12_help  = 메이크 스노우 (SD)은 전방에 눈덩이를 만든 뒤 눈덩이를 굴리며 달립니다. 눈덩이에 피격 된 적은 눈덩이 안에 갇히게 되며 D키 입력 시 앞으로 굴려 보냅니다. 

step13_title = 잭프로스트 - 눈사람이 되거랏! / 갑옷스킬(ASD)
step13_help  = 눈사람이 되거랏!(ASD)은 눈덩이로 변신한 뒤 런닝하며 상대방을 눈사람으로 변신 시키는 스킬입니다.

step14_title = 잭프로스트 - 롤링 스노우볼 / 투구스킬(AD)
step14_help  = 롤링 스노우볼(AD)은 전방으로 눈덩이를 던지는 스킬입니다. 피격 된 적은 눈사람으로 변신하게 되며, 눈사람을 한번 더 타격 시 앞으로 굴려 보내고 얼음 상태로 만드는 스킬입니다.

step15_title = 잭프로스트 - 스노우 스톤 / 망토스킬(AS)
step15_help  = 스노우 스톤(AS)은 블리자드를 소환하여 조종한 뒤 눈 폭풍을 발산 시켜 주변의 적을 모두 눈사람으로 만들어 버립니다. (A 상승/S 하강/D 눈 폭풍 소환)

step16_title = 잭프로스트 - 국민콤보 ①
step16_help  = ★눈사람이 되거랏!(ASD)로 상대방을 눈사람으로 만든 뒤 (->-> → D오래 누름)으로 마무리 합니다.

step17_title = 잭프로스트 - 국민콤보 ②
step17_help  = ★스노우 스톤(AS)을 통해 상대를 눈사람으로 만든 뒤 메이크 스노우로(SD)로 눈덩이에 가둔 뒤 드랍존으로 굴려보내 마무리 합니다.



[Set197]

max_step = 18

step0_title  = 오토마톤 - 기본소개
step0_help   = 오토마톤은 건틀릿을 발사하여 상대를 잡아온 뒤 돌리면서 주변의 대상까지 같이 제압하는 유니크 용병입니다.

step1_title  = 오토마톤 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 오토마톤 - 건틀릿 발사 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 건틀릿을 발사하여 전방의 대상을 잡아옵니다. 잡아온 대상을 돌리면서 주변 대상을 같이 공격하게 되며, 이동이 가능합니다.

step3_title  = 오토마톤 - 내려치기 (D 오래누름 → D)
step3_help   = 건틀릿으로 대상을 잡은 상태에서 공격키(D)를 누르면 바라보는 방향으로 대상을 내려칩니다. 최대 3번이 가능하며, 한번 내려친 이후에는 이동할 수 없습니다.

step4_title  = 오토마톤 - 올라가기 (D 오래누름 → D → A)
step4_help   = 내려치기 이후에 점프키(A)를 누르면 대상을 내려치면서 점프상태로 전환됩니다. 내려치기 2회 이후에도 사용이 가능합니다.

step5_title  = 오토마톤 - 점프공격 (A → D → D → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 3연타하는 점프 공격이 발동됩니다. 점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step6_title  = 오토마톤 - 점프 건틀릿 발사 (A → D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 전방의 가까운 대상에게 건틀릿을 발사합니다. 타격 성공 시 일정시간동안 상태가 유지됩니다.

step7_title  = 오토마톤 - 점프 내려치기 (A → D 오래누름 → D)
step7_help   = 점프 건틀릿 발사로 대상을 잡은 후 공격키(D)를 누르면 대상을 내려쳐서 바운딩 상태로 만들며 아래로 하강합니다. 

step8_title  = 오토마톤 - 가속잡기 (A → D 오래누름 → D → A)
step8_help   = 점프 내려치기 상태에서 점프키(A)를 누르면 내려쳐진 대상에게 빠르게 접근하여 내려찍는 가속잡기 공격이 발동 됩니다.

step9_title  = 오토마톤 - 대시공격 (->-> → D → D → D)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을\n3연속 타격하는 대시 공격이 가능합니다.

step10_title = 오토마톤 - 대시 건틀릿 발사 (->-> → D 오래누름)
step10_help  = 달리는 중에 공격키(D)를 오래 누르면 건틀릿을 발사합니다. 효과는 기본 건틀릿 발사(D 오래누름)와 동일합니다.

step11_title = 오토마톤 - 증기분리 (피격 중 ->->)
step11_help  = 지상 피격 중 대시키를 입력하면 기계와 증기가 분리된 상태가 됩니다. 이 동안에는 모든 공격이 무효화 되며, 기계의 위치로 다시 돌아가면 상태가 종료됩니다.

step12_title = 오토마톤 - 성능강화 / 무기스킬(SD)
step12_help  = 성능강화(SD)는 대형 슈트를 장착하여 공격하는 스킬입니다. 기본, 대시, 점프, 특별 공격을 사용할 수 있습니다. 

step13_title = 오토마톤 - 증기배출 / 갑옷스킬(ASD)
step13_help  = 증기배출(ASD)은 기계와 증기가 분리되어 각자 공격할 수 있는 스킬입니다. 기계는 자동으로 상대를 찾아 공격하며, 증기는 공격키를 누르면 공격이 가능합니다.

step14_title = 오토마톤 - 부품회수 / 투구스킬(AD)
step14_help  = 부품회수(AD)는 배출 되었다가 다시 돌아오는 부품을 뿌려서 공격하는 스킬입니다. 공격키(D)를 누르면 부품이 배출 됩니다.

step15_title = 오토마톤 - 엔진과열 / 망토스킬(AS)
step15_help  = 엔진과열(AS)은 엔진장치를 가속시켜서 빠르게 전진하며 공격하는 스킬입니다. 이동 중 공격키(D)를 누르면 멈추게 됩니다.

step16_title = 오토마톤 - 국민콤보 ①
step16_help  = ★엔진과열(AS) → 기본공격(D → D → D → D) → 점프공격 (A → D → D → D) 엔진과열로 상대를 강경직 상태로 만든 후 기본공격, 점프 공격으로 마무리 합니다.

step17_title = 오토마톤 - 국민콤보 ②
step17_help  = ★엔진과열(AS) → 건틀릿 발사 (D 오래누름) → 내려치기 2회(D 오래누름 → D) → 올라가기(D 오래누름 → D → A) → 점프공격(A → D → D → D)로 마무리 합니다.



[Set198]

max_step = 19

step0_title  = 가드너 - 기본소개
step0_help   = 가드너는 각종 식물은 생성하고 관리하여 아군에게 이로운 효과를 주며 플레이하는 컨테스트 용병입니다.

step1_title  = 가드너 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 가드너 - 담장덩쿨 생성 (D 누름떼기)
step2_help   = 공격키(D)를 오래 눌렀다 떼면 전방에 덩쿨담장을 생성합니다. 덩쿨담장은 작은 벽의 역할을 하며 통과해서 지나갈 수 없습니다.

step3_title  = 가드너 - 나무 생성 (A 오래누름)
step3_help   = 점프키(A)를 오래 누르면 큰 나무를 생성하고 위로 올라탑니다. 나무에 올라탄 상태에서 점프키(A)를 누르면 점프하며, 방어키(S)를 누르면 내려옵니다.

step4_title  = 가드너 - 나무 생성 (A 오래누름)
step4_help   = 나무에 올라탄 상태에서 공격키(D) 입력 시 마법진이 생성되며 해당 위치로 착지하며 공격합니다. 내려온 후 나무 근처에서 점프키(A) 입력 시 다시 탈 수 있습니다.

step5_title  = 가드너 - 정원 생성 (D 누름유지)
step5_help   = 공격키(D)를 누르고 있으면 물을 뿌려 정원을 생성합니다. 정원에 계속 물을 뿌리면 최대 3단계까지 크기가 커지며 유지시간도 같이 증가 됩니다.

step6_title  = 가드너 - 정원 생성 (D 오래누름)
step6_help   = 정원 안에 들어가게 되면 아군에게는 공격력과 방어력 증가효과를 주며 적에게는 이동속도 감소 효과를 걸게 됩니다.

step7_title  = 가드너 - 정원 생성 (D 오래누름)
step7_help   = 정원 안에 덩쿨담장이 들어가게 되면 담장이 강화되어 상대를 잡아둘 수 있게 됩니다. 정원 안에 나무가 들어가면 일정시간마다 주변 대상의 HP를 회복시켜 줍니다.

step8_title  = 가드너 - 부엽토 뿌리기 (D 오래누름 → S)
step8_help   = 공격키(D)를 오래 누르면서 방어키(S)를 누르면 전방으로 부엽토를 뿌려서 범위 내에 있는 덩쿨담장과 나무의 HP를 회복 시킵니다.

step9_title  = 가드너 - 게이지
step9_help   = 게이지는 딜레이, 걷기, 달리기 시 회복되며, 담장덩쿨과 나무, 정원을 생성할 때와 부엽토를 뿌릴 때 차감 됩니다.

step10_title = 가드너 - 점프공격 (A → D)
step10_help  = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 사선으로 베는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step11_title = 가드너 - 대시공격 (->-> + D)
step11_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 밀어서 넘어트립니다.

step12_title = 가드너 - 방어 (S)
step12_help  = 방어키(S)를 누르면 방어상태가 되며 방향키를 이용해 움직일 수 있습니다. 또한 전방 방향을 제외한 나머지 방향으로 대시키 입력 시 빠르게 이동이 가능합니다.

step13_title = 가드너 - 움직이는공중정원 / 무기스킬(SD)
step13_help  = 움직이는공중정원(SD)은 대형 정원을 생성하는 스킬입니다. 기본 정원보다 더 강화된 효과를 얻게되며, 정원 아래에 드랍존이 있어서 떨어지지 않습니다.

step14_title = 가드너 - 미궁정원 / 갑옷스킬(ASD)
step14_help  = 미궁정원(ASD)은 벽으로 상대를 가둬두는 스킬입니다. 벽에 닿게되면 밀려나게 되며, 점프 높이가 감소합니다. 일정시간 안에 나오지 못하면 강경직상태가 됩니다.

step15_title = 가드너 - 가드너의 소양 / 투구스킬(AD)
step15_help  = 가드너의 소양(AD)은 아군을 선택해서 무적 효과를 주는 스킬입니다. 만약 범위 내에 아군 대상이 없다면 자신에게 무적효과를 걸게 됩니다.

step16_title = 가드너 - 가드라인 / 망토스킬(AS)
step16_help  = 가드라인(AS)은 범위 안에 들어온 상대를 잡아두는 지역을 생성하는 스킬입니다.

step17_title = 가드너 - 국민콤보 ①
step17_help  = ★가드라인(AS) → 기본공격(D → D) 가드라인으로 상대를 잡아둔 후 기본 공격으로 마무리 합니다.

step18_title = 가드너 - 국민콤보 ②
step18_help  = ★가드라인(AS) → 미궁정원(ASD) → 기본공격(D → D) 가드라인으로 상대를 잡아둔 후 미궁정원을 설치한 다음 기본 공격으로 마무리 합니다.



[Set199]

max_step = 19

step0_title  = 초인야구단 - 기본소개
step0_help   = 초인야구단은 되돌아오는 마구를 던지거나 배트를 이용해 상대방을 공격하여 제압하는 레어 용병 입니다.

step1_title  = 초인야구단 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 초인야구단 - 타석대기(D 오래누름 떼기)
step2_help   = 공격키(D)를 오래 눌렀다 떼면 타격 준비 자세를 진행하게 됩니다. 이후 키조작으로 공격 형태를 설정 할 수 있습니다.

step3_title  = 초인야구단 - 타석대기 → 빅 스윙 (D 오래누름 떼기 D)
step3_help   = 타석 대기 중 D 입력 시 전방으로 크게 스윙을 하게 됩니다. 피격 된 적은 크게 넉백 됩니다.

step4_title  = 초인야구단 - 타석대기 → 준비해제 (D 오래누름 떼기 S)
step4_help   = 타석 대기 중 S 입력 시 특별 상태가 해제됩니다.

step5_title  = 초인야구단 - 타석대기 → 다운 스윙 (D 오래누름 떼기 A)
step5_help   = 타석 대기 중 A 입력 시 위에서 아래로 크게 스윙을 하게 됩니다. 피격 된 적은 바운딩 됩니다.

step6_title  = 초인야구단 - 마구 소환(D 살짝 누름떼기)
step6_help   = 공격키(D)를 살짝 눌렀다 떼면 전방으로 되돌아오는 마구를 던집니다. 또한 마구에 피격된 적은 마구의 소용돌이에 휩슬려 같이 되돌아 옵니다.

step7_title  = 초인야구단 - 마구 소환(D 살짝 누름떼기2)
step7_help   = 되돌아오는 마구를 특정 타이밍에 타격 시 (대시D~, D~떼기 D) 실제 야구공을 타격한 것 처럼 야구공이 발사 됩니다. 새로 발사 된 야구공에 피격된 적은 스턴 상태가 됩니다.

step8_title  = 초인야구단 - 게이지
step8_help   = 게이지는 딜레이, 걷기, 달리기 시 회복되며, 마구소환,타격대기 시 게이지가 사용 됩니다.

step9_title = 초인야구단 - 점프공격 (A → D → D → D)
step9_help  = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 야구공을 대각선 아래로 야구공을 던지는 공격을 합니다.\n최대 3개의 야구공을 발사할 수 있습니다.

step10_title = 초인야구단 - 점프공격 (A → D 오래누름)
step10_help  = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D 오래누름)를\n누르면 대각선 아래로 강습하며 야구 배트로 공격하게 됩니다.

step11_title = 초인야구단 - 대시공격 (->-> → D)
step11_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 전방으로 야구공을 발사하게 됩니다. 피격 된 적은 약경직에 걸리게 됩니다.

step12_title = 초인야구단 - 대시공격 (->-> → D 오래누름)
step12_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 배트로 크게 스윙하게 됩니다. 피격 된 적은 넉백 됩니다.

step13_title = 초인야구단 - 싸이클링 홈런 / 무기스킬(SD)
step13_help  = 싸이클링 홈런(SD)은 전방으로 360도 회전하면서 스윙하는 스킬입니다. 다운 된 상태에서 사용 가능 합니다.

step14_title = 초인야구단 - 스크류 슬라이딩 / 갑옷스킬(ASD)
step14_help  = 스크류 슬라이딩(ASD)은 전방으로 슬라이딩 하면서 적을 공격하는 스킬입니다. 방향키 조종 중 D, D꾹, 점프 D로 공격하며, 피격중 사용 가능합니다.

step15_title = 초인야구단 - 마구마구! / 투구스킬(AD)
step15_help  = 마구마구!(AD)은 여러가지의 마구를 던지는 스킬입니다. 스킬 활성화 중 A, S, D 입력 시 다른 마구가 소환됩니다.

step16_title = 초인야구단 - 슈퍼 스윙 / 망토스킬(AS)
step16_help  = 슈퍼 스윙(AS)은 전방의 적을 높게 띄어올린 뒤 야구 배트를 이용해 멀리 날려보내는 스킬입니다.

step17_title = 초인야구단 - 국민콤보 ①
step17_help  = ★마구마구!(AD) → 슈퍼 스윙(AS) 마구마구로 상대방을 스턴 시킨 뒤 슈퍼 스윙으로 마무리 합니다.

step18_title = 초인야구단 - 국민콤보 ②
step18_help  = ★마구소환(D 살짝 누름떼기) → 타석대기(D오래누름) → 빅스윙(D~떼기 → D) 마구를 발사하여 상대방을 휩쓸리게 한 뒤 되돌아오는 적과 마구를 타격하여 마무리 합니다.



[Set200]

max_step = 26

step0_title  = 격투가 - 기본소개
step0_help   = 격투가는 주먹과 발을 이용한 다양한 공격과 벽을 이용해 상대를 제압하는 레어 용병입니다.

step1_title  = 격투가 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 격투가 - 내려차기 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 발을 올렸다가 내려찍는 공격을 합니다. 서 있는 상대는 경직상태가 되며, 공중에 있는 상대는 바운딩 상태가 됩니다.

step3_title  = 격투가 - 내려찍기 (공격 중 S)
step3_help   = 기본공격과 내려차기 중 방어키(S)를 누르면 주먹으로 내려 찍는 공격을 합니다. 내려차기 중 공격은 상대의 위치와 상관없이 바운딩 상태로 만듭니다.

step4_title  = 격투가 - 올려차기 (공격 중 A)
step4_help   = 기본공격과 내려차기 중 점프키(A)를 누르면 발로 올려차는 공격을 합니다. 내려차기 중 공격은 상대의 위치와 상관없이 띄움 상태로 만듭니다.

step5_title  = 격투가 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 올려차는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step6_title  = 격투가 - 점프대시 (A ->->)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 대시키를 누르면 대상을 내려찍는 점프 대시공격을 합니다. 지상에 있는 상대를 공격할 때 유용합니다.

step7_title  = 격투가 - 대시공격 (->-> D → D → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 올려치는 공격을 합니다.

step8_title  = 격투가 - 올려치기 (->-> D 오래누름)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 오래누르면 대상을 띄우는 공격을 합니다.

step9_title  = 격투가 - 돌려차기 (공격 중 S)
step9_help   = 대시공격과 올려치기 중 방어키(S)를 누르면 발로 돌려차는 공격을 합니다. 공중에 있는 대상을 공격 시 회전 후 바운딩 상태가 됩니다.

step10_title = 격투가 - 짧게 올려치기 (공격 중 A)
step10_help  = 대시공격과 올려치기 중 점프키(A)를 누르면 주먹으로 올려치는 공격을 합니다. 상대의 위치와 상관없이 띄움 상태로 만듭니다.

step11_title = 격투가 - 기합 (A 오래누름)
step11_help  = 점프키(A)를 오래 누르고 있으면 ASD, AD, AS 스킬을 사용 할 수 없는 대신 해당 스킬키를 통해 다른 공격을 할 수 있게 되며 점프키(A)를 다시 누르면 해제 됩니다.

step12_title = 격투가 - 하단 돌려차기 (ASD)
step12_help  = 기합 상태에서 ASD를 누르면 빠르게 회전하며 상대를 띄우는 공격을 합니다.

step13_title = 격투가 - 상단 올려치기 (AD)
step13_help  = 기합 상태에서 AD를 누르면 상승하면서 상대를 올려치는 공격을 합니다.

step14_title = 격투가 - 잡아 넘기기 (AS)
step14_help  = 기합 상태에서 AS를 누르면 상대를 잡아서 뒤로 넘기는 공격을 합니다. 피격된 대상이 벽과 충돌할 경우 강경직 상태가 됩니다.

step15_title = 격투가 - 게이지
step15_help  = 게이지는 공격에 성공하거나 피격 시 회복되며, 게이지가 최대치가 되면 기합 상태의 공격들이 강화 됩니다.

step16_title = 격투가 - 게이지
step16_help  = ASD는 선/후딜레이가 감소 되며, AD는 선/후딜레이 감소 및 데미지가 증가되고, AS는 선/후딜레이 감소 및 공중의 대상도 벽과 충돌 시 강경직으로 만듭니다.

step17_title = 격투가 - 이동스텝 (공격중 ->->)
step17_help  = 기합 상태의 공격과 점프 중 공격들을 제외한 모든 공격 중 대시키를 입력하면 해당 방향으로 빠르게 이동이 가능합니다.

step18_title = 격투가 - 이동스텝 올려치기 (공격중 ->-> D)
step18_help  = 이동스텝 중 공격키(D)를 누르면 상대를 띄우는 올려치기 공격이 발동 됩니다.

step19_title = 격투가 - 맹호권 / 무기스킬(SD)
step19_help  = 맹호권(SD)은 주먹을 내질러서 상대를 크게 밀쳐내는 스킬입니다. 밀려나가는 중 벽과 충돌하면 상대의 위치와 상관없이 강경직 상태로 만듭니다.

step20_title = 격투가 - 파운딩 / 갑옷스킬(ASD)
step20_help  = 파운딩(ASD)은 상대를 잡은 후 공격키(D)를 연타하여 상대를 공격하는 스킬입니다. 상대의 뒤에서 공격 시 잡혀있는 상태를 해제할 수 없습니다. 

step21_title = 격투가 - 팔극권무 / 투구스킬(AD)
step21_help  = 팔극권무(AD)는 상대를 잡아 빠르게 연속공격 한 후 뒤로 보내는 스킬입니다.

step22_title = 격투가 - 천방지축 하이킥!! / 망토스킬(AS)
step22_help  = 천방지축 하이킥!!(AS)은 상대를 발로 올려차서 스턴상태로 만드는 스킬입니다.

step23_title = 격투가 - 국민콤보 ①
step23_help  = 팔극권무(AD) → 천방지축 하이킥!!(AS) → 맹호권(SD) 팔극권무로 강경직 상태를 만든 후 천방지축 하이킥!!으로 스턴시킨 다음 맹호권으로 마무리 합니다.

step24_title = 격투가 - 국민콤보 ②
step24_help  = 천방지축 하이킥!!(AS) → 올려치기(->-> D 오래누름) → 기본공격(D → D → D) 천방지축 하이킥!!으로 스턴시킨 후 올려치기와 기본공격으로 마무리 합니다.

step25_title = 격투가 - 국민콤보 ③
step25_help  = 천방지축 하이킥!!(AS) → 올려치기(->-> D 오래누름) → 내려차기(D 오래누름) → 내려찍기(공격 중 S) 기본공격(D → D → D)으로 마무리 합니다.



[Set201]

max_step = 19

step0_title  = 축구선수 - 기본소개
step0_help   = 축구선수는 다양한 축구 기술을 활용하여 상대를 제압하는 레어 용병입니다.

step1_title  = 축구선수 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 축구선수 - 드리블 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 달리는 상태가 되며, 상하좌우 방향 전환이 가능합니다. 드리블은 게이지를 소모합니다.

step3_title  = 축구선수 - 리프팅 (드리블 중 D)
step3_help   = 드리블 중 (D)를 누르면 리프팅 기술로 상대방을 공격하게 됩니다. 피격된 적은 띄움 상태로 전환됩니다.

step4_title  = 축구선수 - 슈팅 (드리블 중 D 오래누름)
step4_help   = 드리블 중 (D오래누름)를 누르면 오른발로 강력한 슈팅을 진행합니다. 피격된 적은 넉백 되며, 다운, 공중 상태에 따라 넉백 거리가 달라집니다.

step5_title  = 축구선수 - 드리블 해제(드리블 중 S)
step5_help   = 드리블 중 (S)를 누르면 드리블 상태가 해제되며, 기본 딜레이 상태로 전환됩니다.

step6_title  = 축구선수 - 힐킥 (드리블 중 A)
step6_help   = 드리블 중 (A)를 누르면 힐킥을 사용하여 적을 높이 띄웁니다. 

step7_title  = 축구선수 - 스탠드 태클 (드리블 중 -> -> )
step7_help   = 드리블 중 (-> ->)를 누르면 전방으로 나아가는 스탠드 태클을 사용합니다. 피격 된 적은 강경직 상태로 전환 됩니다.

step8_title  = 축구선수 - 오버 헤드킥 (->-> D D )
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 상대방을 띄우는 공격을 합니다. 이후 (D)입력 시 오버헤드킥을 사용합니다.

step9_title  = 축구선수 - 슬라이딩 태클 (->-> D 오래누름 )
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면 전방으로 슬라이딩 태클을 시전합니다.

step10_title = 축구선수 - 점프공격 (A → D)
step10_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 점프 헤딩 공격을 시전합니다. 피격 된 적은 넉백 바운딩 됩니다.

step11_title = 축구선수 - 게이지
step11_help  = 게이지는 대기, 걷기, 달리기 상태 시 회복되며, 드리블 사용 시 소모됩니다.

step12_title  = 축구선수 - 튕겨내기 (공격 받는 순간 방어)
step12_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step13_title = 축구선수 - 마하킥 / 무기스킬(SD)
step13_help  = 마하킥(SD)은 전방에 축구공으로 적을 유인한 뒤 공과 함께 상대방을 멀리 차버리는 스킬입니다. 축구공은 벽에 충돌 시 튕겨져 나오는 효과를 가지고 있습니다.

step14_title = 축구선수 - 캐논슛 / 갑옷스킬(ASD)
step14_help  = 캐논슛(ASD)은 전방으로 강력한 슈팅을 하는 스킬입니다. 피격된 적은 넉백 됩니다.

step15_title = 축구선수 - 뻥~축구 / 투구스킬(AD)
step15_help  = 뻥~축구(AD)는 전방으로 강력한 슬라이딩 태클을 시전한 뒤 축구공을 차듯 상대방을 뻥 차버리는 스킬입니다. 슬라이딩 태클에는 디버프 효과가 적용되어 있습니다.

step16_title = 축구선수 - 강철 드리블 / 망토스킬(AS)
step16_help  = 강철 드리블!(AS)은 달리는 상태로 변경되며 자신의 몸과 상대방의 몸이 접촉 시 상대방을 공처럼 굴려 버리는 스킬입니다.

step17_title = 축구선수 - 국민콤보 ①
step17_help  = 캐논슛(ASD) → 강철 드리블(AS) → 마하킥(SD) 캐논슛으로 상대방을 넉백 시킨 뒤 강철 드리블로 상대방을 원하는 곳으로 이동시킨 뒤 마하킥으로 마무리 합니다.

step18_title = 축구선수 - 국민콤보 ②
step18_help  = 드리블(D 오래누름) → 리프팅(드리블 중 D) → 힐킥(드리블 중 A)→ 슈팅(드리블 중 D 오래누름) 드리블 상태에서 리프팅(D)으로 띄운 뒤 힐킥(A)높이 띄워서 슈팅(D 오래누름)으로 마무리 합니다.



[Set202]

max_step = 15

step0_title  = 발칸 - 기본소개
step0_help   = 발칸은 발사를 유지할수록 연사속도가 빨라지는 머신건을 이용해 상대를 제압하는 일반 용병입니다.

step1_title  = 발칸 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 발칸 - 머신건 발사 (D 누름유지)
step2_help   = 공격키(D)를 누른 상태로 유지하면 전방으로 총알을 발사 합니다. 발사 할 수록 총알의 연사속도가 빨라지며, 대시 중에도 사용할 수 있습니다.

step3_title  = 발칸 - 머신건 발사 (D 누름유지)
step3_help   = 머신건을 발사하는 동안에 방향키를 통해 방향전환을 할 수 있으며, 점프키(A) 입력 시 위쪽으로 방어키(S) 입력 시 아래쪽으로 높이 조절이 가능합니다.

step4_title  = 발칸 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 대상을 올려차는 점프 공격을 합니다.\n점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step5_title  = 발칸 - 내려찍기 (A → D 오래누름)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n 오래 누르면 아래로 하강하며 내려찍는 공격을 합니다. 다운된 대상도 공격이 가능합니다.

step6_title  = 발칸 - 대시공격 (->-> D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 밀어내는 공격을 합니다.

step7_title  = 발칸 - 튕겨내기 (공격 받는 순간 방어)
step7_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step8_title  = 발칸 - 장전 (S 오래)
step8_help   = 방어키(S)를 오래 누르고 있거나 총알이 한발도 없을 경\n우 공격키를 누르면 장전이 발동됩니다. 총알이 없으면\n사격이 불가능하므로 틈틈이 장전을 해주어야 합니다.

step9_title  = 발칸 - 스테로이드도핑 / 무기스킬(SD)
step9_help   = 스테로이드도핑(SD)은 즉시 모든 총알을 장전하며, 머신건 발사를 하면서 이동이 가능해지도록 하는 스킬입니다.

step10_title = 발칸 - 오버히트스핀 / 갑옷스킬(ASD)
step10_help  = 오버히트스핀(ASD)은 제자리에서 회전하면서 빠르게 총알을 발사하는 스킬입니다. 총 5바퀴를 회전하며 공격하게 됩니다.

step11_title = 발칸 - 프론트 쉴트 / 투구스킬(AD)
step11_help  = 프론트 쉴드(AD)는 전방의 모든 공격을 막아내는 보호막을 생성하는 스킬입니다. 피격 중에도 사용할 수 있습니다.

step12_title = 발칸 - 스모크 봄버 / 망토스킬(AS)
step12_help  = 스모크 봄버(AS)는 자신의 위치를 감추고 상대의 시야와 조작을 방해하는 연막탄을 터트리는 스킬 입니다.

step13_title = 발칸 - 국민콤보 ①
step13_help  = 내려찍기 (A → D 오래누름) → 머신건 발사 (D 오래누름) 내려찍기로 상대를 스턴시킨 다음 머신건 발사로 연속공격하여 마무리 합니다.

step14_title = 발칸 - 국민콤보 ②
step14_help  = 내려찍기 (A → D 오래누름) → 스테로이드도핑 (SD) → 머신건 발사 (D 오래누름) 내려찍기로 스턴시킨 다음 스테로이드도핑 사용 후 전진하면서 공격하여 마무리 합니다.



[Set203]

max_step = 20

step0_title  = 버블 - 기본소개
step0_help   = 버블은 물방울 안에서 상대방을 공격해 제압하는 레어 용병 입니다.

step1_title  = 버블 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 버블 - 물방울 생성 (D 오래누름)
step2_help   = 공격키(D)를 누른 상태로 유지하면 게이지를 사용하고 거대한 물방울을 생성합니다. 이동이 가능하며 방향 전환 또한 가능합니다.

step3_title  = 버블 - 물폭탄 발사 (D 입력)
step3_help   = 물방울 상태 중 D입력 시 전방으로 포물선을 그리며 날아가는 물방울 폭탄을 발사합니다.

step4_title  = 버블 - 물방울 발사 (D 오래누름)
step4_help   = 물방울 상태 중 D 오래누름 시 전방으로 빠르게 날아가는 물방울을 발사 합니다.

step5_title  = 버블 - 물방울 부스터 (S 입력)
step5_help   = 물방울 상태 중 S 입력 시 이동 속도가 빨라집니다. 이동, 점프 중 사용 가능하며 게이지를 추가 차감합니다. 

step6_title  = 버블 - 물방울 공격 (A 입력)
step6_help   = 물방울 상태 중 A 입력 시 공중으로 높게 점프한 뒤 착지 시 범위 타격을 가하는 공격을 진행합니다.

step7_title  = 버블 - 물방울 폭발 (A 오래누름)
step7_help   = 물방울 상태 중 A 오래누름 시 게이지를 추가 사용하고, 물방울을 폭발시킨 뒤 높이 날아올라 강습 공격을 진행합니다. 떨어지는 위치는 지정할 수 있습니다.

step8_title  = 버블 - 게이지
step8_help   = 게이지는 대기, 걷기, 달리기 시 회복되며 물방울 생성, 물방울 폭발 시 사용됩니다.

step9_title  = 버블 - 점프공격 (A → D → D )
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 점프 공격을 진행합니다. 최대 2회 타격할 수 있습니다.

step10_title = 버블 - 점프공격2 (A → D 오래누름)
step10_help  = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D 오래누름)를 누르면 지면으로 강습하며 범위 타격 공격을 진행합니다.

step11_title = 버블 - 점프 대시 공격 (A → ->->)
step11_help  = 점프키(A)를 누르면 점프가 발동되며 이때 대시 키(->->)를 누르면 전방으로 날아가는 공격을 진행합니다. 타격 성공, 미성공 시 자동 점프 상태가 됩니다.

step12_title = 버블 - 대시공격 (->-> → D)
step12_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 적을 띄우는 공격을 진행합니다.

step13_title = 버블 - 대시공격2 (->-> → D 오래누름)
step13_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 전방으로 서서히 날아가는 물방울을 발사하게 됩니다.

step14_title  = 버블 - 버블 샤워 / 무기스킬(SD)
step14_help   = 버블 샤워(SD)은 조종이 가능한 마법진을 생성하고 D 입력 시 마법진으로 물폭탄을 떨어트리는 스킬입니다. 피격 된 적은 기립 지연 됩니다.

step15_title = 버블 - 버블샷 / 갑옷스킬(ASD)
step15_help  = 버블샷(ASD)은 전방에 버블샷을 발사하여 상대방을 가두어 버리는 스킬입니다. 점프중에도 사용이 가능합니다.

step16_title = 버블 - 매직버블 / 투구스킬(AD)
step16_help  = 매직버블(AD)은 조종이 가능한 버블을 생성한 뒤 버블에 상대방을 가두는 스킬입니다. 피격 된 적은 스킬 사용이 불가능합니다. (방향키 조종, D입력 시 버블 폭파)

step17_title = 버블 - 버블 버스터 / 망토스킬(AS)
step17_help  = 해마를 타고 적을 가두는 방울을 발사하는 스킬입니다. 3회 공격 성공 시 상대방을 높게 띄우는 공격을 진행합니다. (방향키 조종, A: 상승, S: 하강, D: 물방울 발사)

step18_title = 버블 - 국민콤보 ①
step18_help  =  버블 버스터(AS) → 버블 샤워 (SD) 버블 버스터로 상대방을 3회 공격하여 높게 띄운 뒤 버블 샤워로 마무리 합니다.

step19_title = 버블 - 국민콤보 ②
step19_help  = 물방울 생성(D 오래누름) → 물방울 공격(A) → 물방울 폭발(A 오래누름) 물방울을 생성한 뒤 점프하여 상대방을 공격하고, 물방울 폭발로 상대방을 넉백 시켜 마무리 합니다.



[Set204]

max_step = 25

step0_title  = 체인지온 - 기본소개
step0_help   = 체인지온은 늑대, 그리폰 등 다양한 형태로 변신하여 상대를 제압하는 유니크 용병입니다.

step1_title  = 체인지온 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 체인지온 - 체인지울프 (D 오래누름)
step2_help   = 공격키(D)를 오래누르면 늑대 폼으로 변신한 뒤 전방으로 구르면서 전진하는 공격을 합니다. 공격 중 점프키(A)를 통해 점프할 수 있습니다.

step3_title  = 체인지온 - 늑대 폼
step3_help   = 늑대 폼 상태에서는 기존의 모든 공격방식이 변경되며, 유지하는 동안 게이지가 소모 됩니다. 피격당하거나 방어키(S)를 누를 경우 상태가 해제 됩니다.

step4_title  = 체인지온 - 늑대 기본공격 (D → D → D)
step4_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step5_title  = 체인지온 - 늑대 특별공격 (D 오래누름)
step5_help   = 공격키(D)를 오래누르면 전방으로 구르면서 전진하는 공격을 합니다. 공격 중 점프키(A)를 통해 점프할 수 있습니다.

step6_title  = 체인지온 - 늑대 점프공격 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 공격합니다. 타격 성공 시 재 점핑이 가능합니다.

step7_title  = 체인지온 - 늑대 점프대시 (A → ->->)
step7_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 공중에서 회전 하강하여 상대를 3연타하는 공격을 합니다.

step8_title  = 체인지온 - 늑대 체인지그리폰 (A → D 오래누름)
step8_help   = 점프키(A)를 눌러 점프한 후 공격키(D)를 오래 누르면 그리폰으로 변신한 뒤 상대를 낚아채는 공격을 합니다. 공격 성공 시 일정시간동안 비행이 가능합니다.

step9_title  = 체인지온 - 늑대 대시공격 (->-> → D → D → D)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 3연타 공격할 수 있습니다.

step10_title = 체인지온 - 점프공격 (A → D → D → D)
step10_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 무기를 휘둘러 상대를 3연타 공격할 수 있습니다.

step11_title = 체인지온 - 점프대시 (A → ->->)
step11_help  = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 공중에서 상대를 내려치는 점프대시 공격이 발동됩니다.

step12_title = 체인지온 - 체인지그리폰 (A → D 오래누름)
step12_help  = 점프 상태에서 공격키(D)를 오래 누르면 그리폰으로 변신 한 뒤 전방의 상대를 낚아채는 공격을 합니다. 공격 성공 시 일정 시간동안 비행이 가능합니다.

step13_title = 체인지온 - 체인지그리폰 (A → D 오래누름)
step13_help  = 그리폰 상태에서 점프키(A)를 누르면 상승하며, 방어키(S)를 누르면 하강하게 됩니다. 공격키(D) 입력 시 잡고 있는 상대를 풀며 기본 상태로 돌아갑니다.

step14_title = 체인지온 - 체인지그리폰 (A → D 오래누름)
step14_help  = 그리폰 상태에서 공격키(D)를 오래 누르면 늑대 폼으로 변신하며 점프하게 됩니다.

step15_title = 체인지온 - 대시공격 (->-> → D → D → D)
step15_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 3연타 공격할 수 있습니다.

step16_title = 체인지온 - 대시 체인지울프 (->-> → D 오래누름)
step16_help  = 대시 중 공격키(D)를 오래 누르면 늑대 폼으로 변신한 뒤 상대를 관통하는 늑대 폼의 기본공격을 합니다.

step17_title = 체인지온 - 반격 (방어 성공시 바로 공격)
step17_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step18_title = 체인지온 - 게이지
step18_help  = 게이지는 대기, 걷기, 달리기 시 회복되며 각 변신 시 마다 1개씩 소모 됩니다. 늑대 상태의 모든 공격은 게이지를 소폭 회복 시킵니다.

step19_title = 체인지온 - 체인지드래곤 / 무기스킬(SD)
step19_help  = 체인지드래곤(SD)은 용으로 변신 한 뒤 공중에서 불을 뿜으며 상대를 공격하는 스킬입니다. 공격키(D)를 누른 상태로 유지하면 계속 브레스를 뿜을 수 있습니다.

step20_title = 체인지온 - 체인지불스 / 갑옷스킬(ASD)
step20_help  = 체인지불스(ASD)는 황소로 변신하여 상대를 공격하는 스킬입니다. 점프가 가능하며 방어키(S)를 누를 경우 빠르게 전진하여 공격합니다.

step21_title = 체인지온 - 체인지탱크 / 투구스킬(AD)
step21_help  = 체인지탱크(AD)는 탱크로 변신하여 상대를 공격하는 스킬입니다. 체인지불스와 동일하게 점프와 가속이 가능하며 공격키(D) 입력 시 조준점으로 발사체를 발사합니다. 

step22_title = 체인지온 - 체인지에어 / 망토스킬(AS)
step22_help  = 체인지에어(AS)는 비행기로 변신하여 상대를 공격하는 스킬입니다. A, S키를 통해 상승과 하강이 가능하며 공격키(D) 입력 시 지상으로 발사체를 발사합니다.

step23_title = 체인지온 - 국민콤보 ①
step23_help  = ★체인지그리핀(A → D 오래누름) → 점프공격(D → D → D) → 체인지그리핀으로 상대를 잡은 후 공격키를 눌러 상태를 해제한 다음 점프공격으로 마무리 합니다.

step24_title = 체인지온 - 국민콤보 ②
step24_help  = ★체인지울프(D 오래누름) → 늑대 특별공격(D 오래누름) → 늑대 점프대시(A → ->->) 회전공격으로 2연속 공격한 후 점프캔슬하여 늑대 점프대시로 마무리 합니다.



[Set205]

max_step = 20

step0_title  = 무림고수 - 기본소개
step0_help   = 무림고수는 공중에서 경공을 활용해 다양한 공격 패턴으로 상대방을 제압하는 레어 용병입니다.

step1_title  = 무림고수 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 무림고수 - 운기조식 (D 오래누름 유지)
step2_help   = 공격키(D)를 오래누르면 운기조식 상태가 되며 게이지가 회복됩니다. 운기조식 중에는 이동이 불가능하며 D 오래누름 떼기 시 운기조식은 해제 됩니다.

step3_title  = 무림고수 - 게이지
step3_help   = 무림고수는 다른 용병과 달리 운기조식으로만 게이지를 회복할 수 있으며 게이지는 저장 됩니다. 게이지는 공중 커맨드 공격, 경공 사용 시 소모 됩니다. 

step4_title  = 무림고수 - 점프공격 (A → D → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 무기를 휘둘러 상대를 2연타 공격할 수 있습니다.

step5_title  = 무림고수 - 점프대시 (A → ->->)
step5_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 공중에서 활강하며 상대방을 공격하게 됩니다.

step6_title  = 무림고수 - 점프대시 D~ (A → ->-> → D 오래누름)
step6_help   = 점프 대시 중 D오래누름 시 전방 대각선 아래로 강습 공격을 진행합니다. 피격 된 적은 강경직 상태로 전환됩니다.

step7_title  = 무림고수 - 커맨드 기능 ①
step7_help   = 점프 공격중, 커맨드 공격 중에 지정된 방향키를 연속으로 입력하면 커맨드 및 스킬 공격을 즉시 발동 시킬 수 있습니다.

step8_title  = 무림고수 - 커맨드 기능 ②
step8_help   = 커맨드에 사용되는 방향키는 상하좌우(↑↓←→) 4개이며 캐릭터 방향과 관계 없이 입력키 그대로 적용하여 커맨드 기능을 발동 시킵니다.

step9_title  = 무림고수 - 무명 1식 전광석화 ( → → & ↓ ↓ )
step9_help   = 점프 공격 중 커맨드 입력 시 전방으로 나아가는 강습 관통 공격을 진행하며, 일정거리 이동 후 자동 점프 상태로 변환됩니다.

step10_title = 무림고수 - 무명 2식 비상 ( ↑ ↑ & ← ←  )
step10_help  = 점프 공격 중 커맨드 입력 시 전방 대각선 위로 나아가며 공격을 진행합니다, 타격 성공 및 일정거리 이동 후 자동 점프 상태로 변환됩니다.

step11_title = 무림고수 - 무명 3식 허공답보 (D 오래누름)
step11_help  = 점프 중 D 오래누름 시 전방으로 전진하는 허공답보 경공을 시전합니다. D 오래누름 떼기 및 일정거리 이동 후 자동 점프 상태로 전환됩니다.

step12_title = 무림고수 - 무명 3식 허공답보 (A 오래누름)
step12_help  = 점프 중 A 오래누름 시 전방 대각선 위로 올라가는 허공답보 경공을 시전합니다. A 오래누름 떼기 및 일정거리 이동 후 자동 점프 상태로 전환됩니다.

step13_title = 무림고수 - 무명 3식 허공답보 (S 오래누름)
step13_help  = 점프 중 S 오래누름 시 전방 대각선 아래로 하강하는 허공답보 경공을 시전합니다. S 오래누름 떼기 및 일정거리 이동 후 자동 점프 상태로 전환됩니다.

step14_title = 무림고수 - 대시공격 (->-> → D → D)
step14_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 2연타 공격할 수 있습니다.

step15_title = 무림고수 - 진공참 / 무기스킬(SD)
step15_help  = 진공참(SD)은 칼끝에 검기를 끌어모아 전방으로 발사하는 스킬입니다. SD중 D 오래누름 유지 시 더욱 강력한 검기를 발사합니다.

step16_title = 무림고수 - 흡격 / 갑옷스킬(ASD)
step16_help  = 흡격(ASD)은 근거리 적을 끌어와 던지기 스킬입니다. 던지는 방향을 정할 수 있으며 공중 사용이 가능합니다.

step17_title = 무림고수 - 천상기공파 / 투구스킬(AD)
step17_help  = 천상기공파(AD)는 공중으로 뛰어올라 검기를 발사하는 스킬입니다. 매직 서클을 조종할 수 있으며, D입력 시 매직 서클로 기공파를 발사합니다.

step18_title = 무림고수 - 전세역전 / 망토스킬(AS)
step18_help  = 전세역전(AD)은 상대방의 공격을 반격하는 스킬입니다. 피격 중 사용이 가능합니다.

step19_title = 무림고수 - 국민콤보 ①
step19_help  = ★ 흡격 (ASD) → 천상기공파 (AD)\n 흡격으로 상대방을 잡아 원하는 방향으로 바운딩 시킨 뒤 천상기공파로 마무리 합니다.

step20_title = 무림고수 - 국민콤보 ②
step20_help  = ★대시공격(→,→,D,D) → 캔슬점프공격(A,D,D) → 허공답보(S오래누름) → 점프공격(D→D) 허공답보(S오래누름) → 점프공격(D→D) → 비상(↑↑ & ←←)으로 마무리 합니다.



[Set206]

max_step = 19

step0_title  = 유령 - 기본소개
step0_help   = 유령은 상대의 몸속으로 들어간 뒤 원하는 방향에서 등장해 상대를 교란시키며 제압하는 레어용병입니다.

step1_title  = 유령 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 유령 - 부유 (D 오래누름)
step2_help   = 공격키(D)를 오래누르면 날아다닐 수 있는 부유 상태가 됩니다.점프키(A) 입력 시 상승하게 되며, 방어키(S) 입력 시 하강하게 됩니다.

step3_title  = 유령 - 빙의 (D 오래누름 → D)
step3_help   = 부유 상태에서 공격키(D) 입력 시 전방으로 전진 공격하며 공격 성공 시 상대의 몸속으로 들어가 빙의 상태가 됩니다. 상대는 기본공격과 방어만 할 수 있습니다.

step4_title  = 유령 - 빙의 ① (빙의상태 → D)
step4_help   = 빙의 상태에서 공격키(D) 입력 시 상대가 바라보는 방향 반대로 밀어냅니다. 방향키와 같이 입력 시 입력한 방향으로 밀어냅니다.

step5_title  = 유령 - 빙의 ② (빙의상태 → ->->)
step5_help   = 빙의 상태에서 방향키를 빠르게 두번 입력하면 일정거리가 벌어진 상태에서 입력한 방향에서 나타나게 됩니다. 상대의 공중 상태 일 경우 띄워집니다.

step6_title  = 유령 - 빙의 ③ (빙의상태 → A)
step6_help   = 빙의 상태에서 점프키(A)를 누르면 상대의 머리 위에서 나타납니다. 상대가 공중 상태 일 경우 높게 띄워집니다.

step7_title  = 유령 - 점프공격 (A → D → D → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 공격합니다. 3회 공격이 가능합니다.

step8_title  = 유령 - 대시공격 (->-> → D → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 2연타 공격할 수 있습니다.

step9_title = 유령 - 대시 특별공격 (->-> → D오래누름)
step9_help  = 대시 상태에서 공격키(D)를 오래 누르면 상대를 올려치며 상승하게 됩니다. 추가로 2회 공격이 가능하며, 공격 중 D오래누름을 통해 부유상태로 전활할 수 있습니다.

step10_title = 유령 - 튕겨내기 (공격 받는 순간 방어)
step10_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step11_title = 유령 - 무형 (방어 중 ->->)
step11_help  = 방어 상태에서 방향키를 빠르게 두 번 누르면 잠시동안 모든 공격을 통과하는 무형 상태가 됩니다.

step12_title = 유령 - 게이지
step12_help  = 게이지는 대기, 걷기, 달리기 시 회복되며, 부유상태로 전환과 상태 유지 중일 때, 무형 상태로 전환할 때 소모하게 됩니다.

step13_title = 유령 - 폴터가이스트 / 무기스킬(SD)
step13_help  = 폴터가이스트(SD)는 상대를 띄운 다음 원하는 방향으로 던져버리는 스킬입니다. 타겟을 A, S키로 변경할 수 있으며, 던져진 지점에 다른 상대까지 같이 피격시킬 수 있습니다.

step14_title = 유령 - 고스트 / 갑옷스킬(ASD)
step14_help  = 고스트(ASD)는 스킬 게이지를 소비하여 드랍존에서 이동 및 드랍을 방지 할 수 있는 반 패시브 스킬입니다. 드랍존 위에 올라가면 자동으로 발동됩니다.

step15_title = 유령 - GHOST / 투구스킬(AD)
step15_help  = GHOST(AD)는 스킬 게이지가 일정량 이상 있는 상태에서 피격 시 상대의 공격에 피격되지 않는 반 패시브 스킬입니다.

step16_title = 유령 - 유령 자폭 공격 / 망토스킬(AS)
step16_help  = 유령 자폭 공격(AS)은 작은 유령들을 소환하여 상대에게 달라붙게 한 뒤 폭파시키는 스킬입니다. 공격키(D)로 소환할 수 있으며 방어키(S) 입력 시 즉시 폭하됩니다.

step17_title = 유령 - 국민콤보 ①
step17_help  = ★대시 특별공격(->-> → D 오래누름) → 점프공격(A → D → D → D) 대시 특별공격으로 상대를 띄운 후 점프공격으로 3연타하여 마무리 합니다.

step18_title = 유령 - 국민콤보 ②
step18_help  = ★대시 특별공격(->-> → D 오래누름) → 빙의 (D 오래누름 → D) → 빙의 ① (빙의상태 → D)로 던져서 마무리 합니다.



[Set207]

max_step = 18

step0_title  = 슬로프 - 기본소개
step0_help   = 슬로프는 스키를 이용해 눈을 뿌리고 다니며 상대를 제압하는 한정판 용병입니다.

step1_title  = 슬로프 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 슬로프 - 방향지정 (D 누름유지)
step2_help   = 공격키(D)를 누른 상태로 유지하면 조준점이 생성되어 위 아래로 움직이게 됩니다. 방향키를 통해 방향전환을 할 수 있습니다. 점프 중에도 사용이 가능합니다.

step3_title  = 슬로프 - 리프트 (D 누름떼기)
step3_help   = 공격키(D)를 유지한 상태에서 떼면 조준점의 각도로 리프트를 타고 이동하게 됩니다. 이동하는 시간에 비례하여 게이지가 회복됩니다.

step4_title  = 슬로프 - 업/다운힐 (D 누름떼기 → D)
step4_help   = 리프트 상태에서 공격키(D)를 누르면 리프트를 타고 이동한 각도의 반대 각도로 상승 또는 하강하게 됩니다. 이때 지나간 자리에 일정시간동안 유지되는 눈꽃을 남깁니다.

step5_title  = 슬로프 - 각도변환 (D 누름떼기 → D → D/S/A)
step5_help   = 업/다운힐 상태에서 공격키(D)를 누르면 직진각도로 방어키(S)를 누르면 하강각도로 점프키(A)를 누르면 상승각도로 변경이 가능합니다.

step6_title  = 슬로프 - 업/다운힐 종료 (D 누름떼기 → D → D 오래누름)
step6_help   = 업/다운힐 중에 공격키(D)를 오래 누르거나 리프트 중에 회복된 게이지가 모두 소모되면 상태가 종료 됩니다.

step7_title  = 슬로프 - 점프공격 (A → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 공격합니다. 1회 공격이 가능합니다.

step8_title  = 슬로프 - 공중대시 (A → ->->)
step8_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 직선 이동을 하는 공중 대시가 발동됩니다.

step9_title  = 슬로프 - 대시공격 (->-> → D → D)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 2연타 공격할 수 있습니다.

step10_title = 슬로프 - 대시 특별공격 (->-> → D 오래누름)
step10_help  = 대시 상태에서 공격키(D)를 오래 누르면 전방으로 회전하며 상대를 3연타 공격을 합니다.

step11_title = 슬로프 - 튕겨내기 (공격 받는 순간 방어)
step11_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step12_title = 슬로프 - 스키 점프 / 무기스킬(SD)
step12_help  = 스키 점프(SD)는 스키 점프대를 이용해 공중으로 빠르게 상승 한 뒤 착지 지점을 지정하여 주변에게 피해를 주고 빠르게 스키를 타며 상대를 공격하는 스킬 입니다.

step13_title = 슬로프 - 바이애슬론 / 갑옷스킬(ASD)
step13_help  = 바이애슬론(ASD)은 자동으로 이동하며 전방에 눈덩이를 던져 상대를 눈사람으로 만드는 스킬입니다. 방향키를 이용하여 방향전환과 점프키(A)를 통해 점프가 가능합니다.

step14_title = 슬로프 - 스노우메이커 / 투구스킬(AD)
step14_help  = 스노우메이커(AD)는 일정시간동안 자신을 공격한 대상을 눈사람으로 만드는 스킬입니다. 피격 중에도 사용이 가능합니다.

step15_title = 슬로프 - 스키패트롤 / 망토스킬(AS)
step15_help  = 스키패트롤(AS)은 패시브 스킬로 얼음상태가 되지 않게 보호해주는 스킬입니다.

step16_title = 슬로프 - 국민콤보 ①
step16_help  = ★바이애슬론(ASD) → 대시 특별공격(->-> → D 오래누름) 바이애슬론을 이용해 상대를 연속타격하며 눈사람으로 만든 다음 대시 특별공격으로 마무리 합니다.

step17_title = 슬로프 - 국민콤보 ②
step17_help  = ★업/다운힐 (D 누름떼기 → D) → 기본공격(D → D → D) 업/다운힐을 이용해 상대를 연속공격한 후 기본공격으로 마무리 합니다.



[Set208]

max_step = 14

step0_title  = 오딘 - 기본소개
step0_help   = 오딘은 룬마법진으로 아군을 광폭화 시키고 폭풍을 소환해 상대방을 제압하는 레어용병입니다.

step1_title  = 오딘 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 발사체를 활용해 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 오딘 - 주문 (D 누름유지)
step2_help   = 공격키(D)를 누른 상태로 유지하면 게이지가 상승되며, 게이지가 1일 경우 룬마법을 사용할 수 있습니다.

step3_title  = 오딘 - 스톰 (D 누름떼기 → +D입력)
step3_help   = 공격키(D)를 유지한 상태에서 D를 떼면 매직 서클이 생성 되고, +D 입력 시 매직 서클에 번개가 떨어지고, 폭풍이 소환됩니다. 폭풍에 타격된 적은 스타트 포인트로 워프 됩니다.

step4_title  = 오딘 - 쉴드 (D누름 중 → S 떼기 → +D입력)
step4_help   = 공격키(D)를 유지한 상태에서 S를 누르고 떼면 매직 서클이 생성 되고, +D입력 시 아군과 나를 보호하는 버프가 적용됩니다. 피격 시 까마귀를 소환해 반격합니다.

step5_title  = 오딘 - 광폭화 (D누름 중 → A 떼기 → +D입력)
step5_help   = 공격키(D)를 유지한 상태에서 A를 누르고 떼면 매직 서클이 생성 되고, +D입력 시 아군과 나를 광혹시키는 버프가 적용됩니다. 공격력, 이동속도가 증가되며, 주변적의 HP를 감소시킵니다.

step6_title  = 오딘 - 점프공격 (A → D D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 공격합니다. 대각선 아래로 발사체를 2회 연속 발사 가능합니다.

step7_title  = 오딘 - 대시공격 (->-> → D → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 2연타 공격할 수 있습니다.

step8_title  = 오딘 - 대시 특별공격 (->-> → D 오래누름)
step8_help   = 대시 상태에서 공격키(D)를 오래 누르면 전방의 지면을 타고 나아가는 작은 폭풍을 소환합니다. 타격 된 적은 띄움 상태로 변환됩니다.

step9_title = 오딘 - 비에토 / 무기스킬(SD)
step9_help  = 비에토(SD)는 주변에 룬마법진을 펼쳐 스킬을 사용하지 못하게 막아버립니다. 룬 마법진은 시전자를 따라다니고, 범위 내에서 스킬 사용 시 강경직 상태로 변환됩니다.

step10_title = 오딘 - 대격변 / 갑옷스킬(ASD)
step10_help  = 대격변은(ASD)은 매직 서클을 조종하여 원하는 곳에 큰 지진을 일으키거나, 해당 위치로 순간이동 하는 스킬입니다. (+D 연타, +A이동)

step11_title = 오딘 - 데스트로이 / 투구스킬(AD)
step11_help  = 데스트로이(AD)는 궁그닐을 던진 후 조종하여 적을 공격하는 스킬입니다. 땅에 박힌 궁그닐는 일정 시간 뒤 폭발하며 랜덤 데미지를 부여합니다.

step12_title = 오딘 - 궁그닐 / 망토스킬(AS)
step12_help  = 궁그닐은 전방으로 던지는 스킬입니다. 던지는 타이밍에 따라 상단, 하단 등 공격을 진행할 수 있습니다.

step13_title = 오딘 - 국민콤보 ①
step13_help  = 대격변(ASD) → 궁그닐(AS) ★ 대격변으로 상대방을 스턴 상태로 만든 뒤 해당 위치로 이동하여 적을 바라본 후 궁그닐로 상대방을 멀리 날려 보냅니다.

step14_title = 오딘 - 국민콤보 ②
step14_help  = 특별공격(광폭화) → 특별공격(스톰) ★ 특별공격(광폭화)으로 아군과 자신을 광폭화 시킨 뒤 특별공격(스톰)으로 상대방을 공격한 뒤 상대방 스타트 포인트로 워프 시킵니다.



[Set209]

max_step = 23

step0_title  = 한조 - 기본소개
step0_help   = 한조는 각종 인술을 이용해 상대의 뒤에서 공격하며 제압하는 유니크 용병입니다.

step1_title  = 한조 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 한조 - 인술 (D 누름떼기)
step2_help   = 공격키(D)를 누른 상태로 유지하면 인술 준비 자세로 변환됩니다. 이동안에 이동을 할 수 있으며, 공격키(D)를 떼면 전방으로 회전하는 공격을 합니다.

step3_title  = 한조 - 인술 (D 누름떼기)
step3_help   = 회전 공격은 총 5회 공격을 할 수 있으며, 회전 도중 공격키(D) 입력 시 즉시 공격을 멈추고 대기 상태로 돌아갑니다.

step4_title  = 한조 - 인법자세 (D 누름유지 → S)
step4_help   = 인술 상태에서 방어키(S)를 누르면 인법자세로 변환됩니다. D 누름떼기 공격 중과 점프 중, 대시 특별공격 중에도 변환이 가능합니다.

step5_title  = 한조 - 관통베기 (인법자세 → D)
step5_help   = 인법 자세에서 공격키(D) 입력 시 전방으로 빠르게 이동하며 상대를 관통공격하는 관통베기 공격이 발동 됩니다.

step6_title  = 한조 - 그림자 이동 (인법자세 → S)
step6_help   = 인법 자세에서 방어키(S) 입력 시 가장 가까운 대상의 뒤로 순간이동 합니다.

step7_title  = 한조 - 부양자세 (D 누름유지 → A)
step7_help   = 인술 상태에서 점프키(A) 입력 시 부양자세로 변환됩니다. D 누름떼기 공격 중과 점프 중, 대시 특별공격 중에도 변환이 가능합니다.

step8_title  = 한조 - 부양공격 (부양자세 → D)
step8_help   = 부양 자세에서 공격키(D) 입력 시 전방의 상태를 칼로 베는 공격을 합니다. 총 5회 사용이 가능하며, 점프키(A) 입력 시 상태를 종료하고 점프할 수 있습니다.

step9_title  = 한조 - 내려찍기 (부양자세 → S)
step9_help   = 부양 자세에서 방어키(S) 입력 시 공중으로 뛰어 오른 후 빠르게 하강하며 바닥을 내려찍는 공격을 합니다.

step10_title = 한조 - 반격자세 (방어중 → ->->)
step10_help  = 방어 상태에서 방향키를 빠르게 두번 누르면 반격자세로 변환됩니다. 이때 일정 거리 안에 있는 상대가 공격할 경우 상대는 즉시 강경직 상태가 됩니다.

step11_title = 한조 - 암습 (기본기능)
step11_help  = 한조의 공격은 상대의 뒤에서 공격 할 때 더 높은 데미지를 줄 수 있습니다.

step12_title = 한조 - 게이지
step12_help  = 한조의 게이지는 대기, 걷기, 달리기 중에 회복이 되며, 각 자세 변환 시 소모됩니다.

step13_title = 한조 - 점프공격 (A → D → D → D → D → D)
step13_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 공격합니다. 5회 공격이 가능합니다.

step14_title = 한조 - 공중대시 (A → ->->)
step14_help  = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 하강 이동을 하는 공중 대시가 발동됩니다.

step15_title = 한조 - 대시공격 (->-> → D → D → D → D)
step15_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 4연타 공격할 수 있습니다.

step16_title = 한조 - 대시 특별공격 (->-> → D 오래누름)
step16_help  = 대시 상태에서 공격키(D)를 오래 누르면 상대를 띄워 올리는 대시 특별 공격이 발동됩니다.

step17_title = 한조 - 반격 (방어 성공시 바로 공격)
step17_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step18_title = 한조 - 이가 닌쥬츠 / 무기스킬(SD)
step18_help  = 이가 닌쥬츠(SD)는 다수의 분신을 소환하여 상대를 공격하게 하며, 은신하는 스킬입니다. 피격 중에도 사용이 가능합니다.

step19_title = 한조 - 미즈구모 / 갑옷스킬(ASD)
step19_help  = 미즈구모(ASD)는 드랍존을 걸어다닐 수 있는 미즈구모를 장착하는 스킬입니다. 피격 중에도 사용이 가능하며 공중 피격중 사용 시 점프합니다.

step20_title = 한조 - 마키비시 / 투구스킬(AD)
step20_help  = 마키비시(AD)는 바닥에 작은 마키비시들을 넓게 뿌려서 상대가 밟으면 피해를 주는 스킬입니다.

step21_title = 한조 - 슈리켄 / 망토스킬(AS)
step21_help  = 슈리켄(AS)은 빠르게 이동하며 표창을 던지는 스킬입니다. 방향키를 통해 방향을 전환할 수 있으며, 일정시간 안에 공격키(D)를 누르지 않으면 스킬이 종료됩니다.

step22_title = 한조 - 국민콤보 ①
step22_help  = ★마키비시(AD) → 슈리켄(AS) 마키비시로 상대를 지속공격하면서 슈리켄으로 연속공격하여 마무리 합니다.

step23_title = 한조 - 국민콤보 ②
step23_help  = ★대시 특별공격 (->-> → D 오래누름) → 부양공격 4회 (부양자세 → D) → 내려찍기 (부양자세 → S) 로 마무리 합니다.



[Set210]

max_step = 21

step0_title  = 피닉스 - 기본소개
step0_help   = 피닉스는 불꽃 화살을 난사하여 상대방을 제압하는 레어용병입니다.

step1_title  = 피닉스 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 화살을 발사 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 피닉스 - 조준 (D~ 누름)
step2_help   = 공격키(D오래누름)시 전방에 매직 서클이 생성되고, 게이지바가 충전됩니다. 게이지바의 회복 양에 따라 다른 효과의 두가지 공격이 발생됩니다.

step3_title  = 피닉스 - 화살 발사 (D~ 누름떼기 Min)
step3_help   = 게이지바가 50% 이상이거나, 99%이하 일때 D~ 떼기 시 연속으로 화살을 3발 발사합니다. 발사중에도 매직 서클은 이동이 가능합니다.

step4_title  = 피닉스 - 불꽃 화살 발사 (D~ 누름떼기 Max)
step4_help   = 게이지바가 100% 이상일 때 D~ 떼기 시 연속으로 화살을 5발 발사합니다. 발사 중에도 매직 서클은 이동이 가능하며, 화살이 떨어진 자리에는 불꽃이 발생됩니다.

step5_title  = 피닉스 - 연속 발사 (D 살짝누름 떼기)
step5_help   = 공격키 D 살짝누름 떼기 시 전방으로 2개의 피닉스 화살을 발사합니다. 일정 거리 동안 상대방을 쫓아가며, 일정시간 뒤 폭발합니다.

step6_title  = 피닉스 - 게이지 카운터
step6_help   = 피닉스는 서로 다운 게이지를 2개 사용합니다. 게이지 카운터는 딜레이, 걷기 시 자동 회복 됩니다. 점프 특별 공격 시 사용 가능 합니다.

step7_title = 피닉스 - 게이지 바
step7_help  = 피닉스는 서로 다운 게이지를 2개 사용합니다. 게이지 바는 D~오래누름 시 회복되며, 지상 특별 공격 시 사용 됩니다.

step8_title  = 피닉스 - 점프공격 (A → D → D → D )
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 공격합니다. 3회 공격이 가능합니다.

step9_title  = 피닉스 - 공중 조준 (A → D~ 누름)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 전방으로 전진하며 상대방을 조준합니다. 게이지가 소모 됩니다.

step10_title  = 피닉스 - 공중 조준 화살 발사 (A → D~ → D 떼기 DDDD)
step10_help   = 공중 조준상태에서 D떼기 시 조준점으로 화살을 발사합니다. 이후 D입력 시 최대 4연속 화살을 공중에서 발사합니다.

step11_title = 피닉스 - 공중 회피 (A → ->->)
step11_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 방향키 (->->)를 두번 누르면 누른 방향으로 대시하게 되며 캐릭터를 관통할 수 있습니다.

step12_title = 피닉스 - 공중 연속 발사 (A → D 살짝누름 떼기))
step12_help  = 점프중(A)를 공격키 D 살짝누름 떼기 시 전방으로 2개의 피닉스 화살을 발사합니다. 일정 거리 동안 상대방을 쫓아가며, 일정시간 뒤 폭발합니다.

step13_title = 피닉스 - 공중대시 (A → ->->)
step13_help  = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 하강 이동을 하는 공중 대시가 발동됩니다.

step14_title = 피닉스 - 튕겨내기 (공격 받는 순간 방어)
step14_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step15_title = 피닉스 - 대시 (->->)
step15_help  = 방향키를 빠르게 두 번 누르면 입력 방향으로 회피하거나 이동합니다. 캐릭터 관통 효과가 적용됩니다.

step16_title = 피닉스 - 정화의 불꽃 / 무기스킬(SD)
step16_help  = 정화의 불꽃(SD)는 전방에 거대한 피닉스를 발사하여, 주변 지역을 불바다로 만드는 스킬입니다. 이동이 가능하고, D~시 거리가 늘어납니다.

step17_title = 피닉스 - 극락조화 / 갑옷스킬(ASD)
step17_help  = 극락조화(ASD)는 자신의 주변에 불새를 발사하여 상대방을 공격하는 스킬입니다. 스킬 사용 상태에서 캐릭터가 사망 시 피닉스로 변신하여 공격할 수 있습니다.

step18_title = 피닉스 - 불사조 / 투구스킬(AD)
step18_help  = 불사조(AD)는 빠른 속도로 활강 하며 상대방을 공격하는 스킬입니다. 이동 및 방향전환이 가능하며 A키로 고도를 변경할 수 있습니다.

step19_title = 피닉스 - 선회비행 / 망토스킬(AS)
step19_help  = 선회비행(AS)는 점프 후 A키 입력 시 공중을 날아다닐 수 있습니다. 점프 중 A-A-A 3회 점프 및 방향전환이 가능하며, 천천히 하강하게 됩니다.

step20_title = 피닉스 - 국민콤보 ①
step20_help  = ★ 공중 조준 → 공중 조준 화살 발사(5발) → 점프 공격3타 → 공중대시 → 공중 조준 → 공중 조준 화살 발사 → 점프 공격3타로 마무리 합니다.

step21_title = 피닉스 - 국민콤보 ②
step21_help  = ★ 정화의 불꽃(SD) → 조준 → 불꽃 화살 발사 : 정화의 불꽃으로 상대방을 공격한 뒤 넘어진 적에게 불꽃 화살로 마무리 합니다.




[Set211]

max_step = 24

step0_title  = 티메가테 - 기본소개
step0_help   = 티메가테는 타임게이트를 만들어 상대방을 공간 이동 시키는 콘테스트 일반 용병입니다.

step1_title  = 티메가테 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 티메가테 - TGate 생성 (D~ 오래누름 후 떼기)
step2_help   = 공격키(D오래누름)시 전방에 매직 서클이 생성되고, 일정 게이지가 감소 됩니다. 매직 서클은 일정 거리까지 이동이 가능합니다.

step3_title  = 티메가테 - TGate 생성 1 (D~ 오래누름 떼기 +D입력)
step3_help   = 전방에 매직 서클이 생성 된 상태에서 D입력 시 첫번째 게이트 위치를 저장합니다. 해당 위치는 상대방에게 보이지 않습니다.

step4_title  = 티메가테 - TGate 생성 2 (D~ → +D입력 → 매직서클 생성)
step4_help   = 첫 번째 게이트 위치를 저장한 뒤 두 번째 매직 서클이 생성됩니다. 두 번째 매직서클은 첫 번째 게이트와 중첩 되지 않고 일정 거리를 이동할 수 있습니다.

step5_title  = 티메가테 - TGate 생성 3 (D~ → +D입력 → +D입력)
step5_help   = 두 번째 매직서클이 생성된 상태에서 +D 입력 시 첫번째 매직 서클 위치와, 두번째 매직 서클 위치에 두 개의 순간이동 게이트가 활성화됩니다. 

step6_title  = 티메가테 - TGate 생성 4 (시전자, 아군 게이트 이동)
step6_help   = 두개의 게이트는 서로 연결 되어 있으며, 게이트 안에서 +A 입력 시 공간 이동을 할 수 있습니다. 공간 이동 시 점프 상태로 변환됩니다. 

step7_title = 티메가테 - TGate 생성 5 (적군 게이트 이동)
step7_help  = 적군은 게이트에 닿기만 해도 게이트로 빨려 들어가게 되며, 다른 게이트로 이동 후 바운딩 상태로 빠져나오게 되며 타격을 입습니다.

step8_title  = 티메가테 - 점프공격 (A → D → D → D → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 공격합니다. 4회 공격이 가능하며, 막타 타격 시 상대방은 바운딩 됩니다.

step9_title  = 티메가테 - 공중 회피 (A → ->->)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 방향키 (->->)를 두 번 누르면 누른 방향으로 대시하게 되며 캐릭터를 관통할 수 있습니다.

step10_title  = 티메가테 - 점프 TGate 생성 (A → D~ 오래누름)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 전방에 매직 서클이 생성되고, 시전자는 공중에서 일정 시간 동안 채공합니다.

step11_title = 티메가테 - 점프 TGate 1 (A → D~ → +D)
step11_help  = 공중에 채공된 상태에서 +D 입력 시 시전자 앞과, 매직 서클 위치에 게이트가 동시에 생성 됩니다. 

step12_title = 티메가테 - 점프 TGate 2 (시전자, 아군 게이트 이동)
step12_help  = 두개의 게이트는 서로 연결 되어 있으며, 게이트 안에서 +A 입력 시 공간 이동을 할 수 있습니다. 공간 이동 시 점프 상태로 변환됩니다. 

step13_title = 티메가테 - 점프 TGate 3 (적군 게이트 이동)
step13_help  = 적군은 게이트에 닿기만 해도 게이트로 빨려 들어가게 되며, 다른 게이트로 이동 후 바운딩 상태로 빠져나오게 되며 타격을 입습니다.

step14_title = 티메가테 - 이중점프 (A 두번 누름)
step14_help  = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동됩니다.

step15_title = 티메가테 - 하이점프 (A 오래누름)
step15_help  = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다. 하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어 높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step16_title = 티메가테 - 대시공격 (->-> → D → D)
step16_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 2연타 공격할 수 있습니다.

step17_title = 티메가테 - 대시 특별공격 (->-> → D 오래누름 → +D)
step17_help  = 대시 상태에서 공격키(D)를 오래 누르면 캐릭터를 관통하며 전진하게 되며 이후 +D 입력 시 방향키 방향으로 전진 공격을 진행합니다.

step18_title = 티메가테 - 튕겨내기 (공격 받는 순간 방어)
step18_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step19_title = 티메가테 - 뒤틀린 타임게이트 / 무기스킬(SD)
step19_help  = 뒤틀린 타임게이트(SD)는 자신 바로 앞에 티메가테 소드를 꽂은 뒤 뒤틀린 타임게이트를 소환하여 상대방을 드랍 시키는 스킬입니다.

step20_title = 티메가테 - 장비 소환 / 갑옷스킬(ASD)
step20_help  = 장비 소환(ASD)은 유니크 갑옷, 투구, 망토를 각각 1개씩 랜덤으로 드랍시키는 스킬입니다. 

step21_title = 티메가테 - 시공간 비틀기 / 투구(AD)
step21_help  = 시공간 뒤틀기(AD)는 일시적으로 시전자 주변의 시공간을 무너트려 아무런 피격을 당하지 않는 스킬입니다. 피격, 다운, 공중, 공중 피격 중 사용 가능 합니다.

step22_title = 티메가테 - 공간 초월 / 망토(AS)
step22_help  = 공간 초월 (AD)은 원거리 적과 시전자 사이에 연결 공간을 만들어 칼로 찌르는 스킬입니다. 피격 당한 적은 드랍, 낙하 데미지를 크게 입습니다.

step23_title = 티메가테 - 국민콤보 ①
step23_help  = ★ 대시 특별 공격 → 대시 공격(띄움) → 점프공격 4타 → 점프 회피 → 점프공격 4타로 마무리 합니다.

step24_title = 티메가테 - 국민콤보 ②
step24_help  = ★ 대시 공격(띄움) → 점프공격 4타 → 점프 회피 → 점프공격 4타 → 점프 TGate생성 → 게이트 이동(적/시전자) →  점프 회피 → 점프공격 4타 →  무기스킬(SD)로 마무리합니다.





[Set212]

max_step = 18

step0_title  = 오멘 - 기본소개
step0_help   = 오멘는 순간적으로 자신의 육체를 강화시켜 상대방을 제압하는 유니크 용병입니다.

step1_title  = 오멘 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 오멘 - 육체 각성 (D 오래누름)
step2_help   = 공격키(D오래누름)시 게이지를 사용하여 이동속도를 빠르게 만들어 주고, 시전자 주변에 마법진이 생성됩니다. 

step3_title  = 오멘 - 육체 각성2 (D 오래누름 후 +S입력)
step3_help   = 육체를 각성한 상태에서 +S 입력 시 마법진 주변의 적에게 순간이동하며 공격하게 됩니다. 타격 된 적은 띄움 상태가 됩니다.

step4_title  = 오멘 - 점프공격 (A → D → D → D → D)
step4_help   =점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 상대를 공격합니다. 5회 공격이 가능합니다.

step5_title  = 오멘 - 러쉬 (A → ->->)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 방향키 (->->)를 두 번 누르면 누른 방향으로 대시하게 되며 최대 2회 가능합니다, 타격 시 캐릭터를 관통할 수 있습니다.

step6_title  = 오멘 - 러쉬2 (A → ->-> → D)
step6_help   = 방향키 (->->)를 두 번 누르면 누른 방향으로 대시하게 되며 이후 +D 추가 입력 시 대각선 위로 공격 대시를 진행합니다.

step7_title = 오멘 - 러쉬 블로우(A → D 오래누름)
step7_help  = 점프(A) 중 D~오래누름 입력 시 전방으로 전진하며 기를 모은 뒤 5개의 발사체를 발사합니다. 게이지를 사용하며, 피격된 적은 강경직 됩니다.

step8_title  = 오멘 - 점프공격 (A → D → D → D → D)
step8_help   = 점프키(A)로 5회 공격이 가능하며, 막타 타격 시 상대방은 바운딩 됩니다.

step9_title  = 오멘 - 이중점프 (A 두번 누름)
step9_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르\n면 공중에서 한 번 더 점프가 발동됩니다.

step10_title  = 오멘 - 대시공격 (->-> → D → D → D)
step10_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 3연타 공격할 수 있습니다.

step11_title = 오멘 - 대시 특별공격 (->-> → D 오래누름)
step11_help  = 대시 상태에서 공격키(D)를 오래 누르면 발사체를 만들어 전방으로 발사합니다. 3개의 발사체가 발사되며, 적을 쫓아 공격합니다.

step12_title = 오멘 - 반격 (방어 성공 시 공격)
step12_help  = 상대의 공격을 방어한 후 바로 공격을 하면 뒤로 점프한 뒤 전방으로 대쉬하며 반격 합니다.

step13_title = 오멘 - 흡수 / 무기스킬(SD)
step13_help  = 흡수(SD)는 자신의 육체를 강화 시켜 상대방의 공격을 HP로 흡수하고, 일정 시간 동안 무적이 지속되는 스킬입니다, 최대 회복 HP이상 흡수 되지 않습니다.

step14_title = 오멘 - 블로우 / 갑옷스킬(ASD)
step14_help  = 블로우(ASD)은 시전자 주변에 큰 충격파를 발생 시켜, 상대방을 스턴시키는 스킬입니다. 점프 중 사용 가능 합니다.

step15_title = 오멘 - 포탈 이동 / 투구(AD)
step15_help  = 포탈 이동은 시전자 기준으로 제일 가까운 적의 뒤로 순간이동하여, 발사체를 발사하는 스킬입니다.

step16_title = 오멘 - 공중 부양 / 망토(AS)
step16_help  = 공중부양 (AD)은 점프 중 A~오래 누름 시 전방으로 빠르게 이동하며 공중 부양 합니다. 공중 부양 중 S 입력 시 전방의 적을 향해 발사체를 발사합니다.

step17_title = 오멘 - 국민콤보 ①
step17_help  = ★ 대시 공격3타 → 캔슬 점프 → 점프공격 5타 → 러쉬1 → 러쉬2 → 러쉬1 → 러쉬2 → 로 연속 러쉬 타격한 뒤 마무리 합니다.

step18_title = 오멘 - 국민콤보 ②
step18_help  = ★ 육체 각성 → 대시 공격(띄움) → 점프공격 5타 → 러쉬1 → 러쉬2 → 점프공격 5타 → 러쉬1 → 러쉬2 → 육체 각성2 → 점프공격 5타로 마무리 합니다.



[Set213]

max_step = 17

step0_title  = 매드블라스터 - 기본소개
step0_help   = 매드블라스터는 사방에 폭탄을 던지며 적을 교란시켜 상대방을 제압하는 레어 용병입니다.

step1_title  = 매드블라스터 - 기본공격 (D)
step1_help   = 공격키(D)를 연속해서 누르면 전방에 작은 폭탄을 굴립니다. 연속 공격이 안되며, 구른 폭탄은 일정시간 이후 폭발합니다.

step2_title  = 매드블라스터 - 폭탄 남발 (D 오래누름)
step2_help   = 공격키(D오래누름) 전방에 매직 서클이 생성되며, 전방을 기준으로 일정 범위내에 매직서클을 이동 시킬 수 있습니다.

step3_title  = 매드블라스터 - 폭탄 남발 1 (D 오래누름 → +D )
step3_help   = 공격키(D오래누름) 전방에 매직 서클이 생성되며, +D 입력 시 매직 서클 위치가 저장되며 새로운 매직서클이 생성 됩니다.

step4_title  = 매드블라스터 - 폭탄 남발 2 (D 오래누름 → +D → +D )
step4_help   = 첫 번째 매직 서클이 저장된 후 두 번째 매직 서클이 생성되며, 일정 범위 내에 이동이 가능하며 +D 입력 시 두 번째 매직 서클 위치가 저장 됩니다.

step5_title  = 매드블라스터 - 폭탄 남발 3 (D 오래누름 → +D → +D → +D )
step5_help   = 두 번째 매직 서클이 저장된 상태에서 세 번째 +D 입력 시 1, 2, 3 서클 위치로 폭탄을 순차적으로 던집니다. 위치에 떨어진 폭탄은 일정 시간 이후 폭발합니다.

step6_title  = 매드블라스터 - 폭탄 남발 4 (D 오래누름 → +D → +D → +D~ )
step6_help   = 세 번째 매직 서클에서 +D 오래누름 입력 시 1, 2, 3, 서클 위치에 폭탄을 한꺼번에 던집니다. 위치에 떨어진 폭탄을 일정 시간 이후 폭발합니다.

step7_title  = 매드블라스터 - 점프공격 (A → D → D → D )
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 최대 3회 폭탄을 발사 합니다.

step8_title  = 매드블라스터 - 하이점프 (A오래누름 → D → D → D)
step8_help   = 점프키(A)를 오래누름 시 높이 점프 합니다. 하이 점프한 상태에서 점프 공격 시 일반 점프 공격보다 더 멀리 날아가는 폭탄을 발사합니다.

step9_title  = 매드블라스터 - 대시공격 1 (->->)
step9_help   = 방향키를 빠르게 두 번 누르면 자신의 자리에 폭탄을 하나 떨어트리고 입력 방향으로 이동하게 됩니다.

step10_title = 매드블라스터 - 대시공격 2 (->-> → +D)
step10_help  = 방향키를 빠르게 두 번 누른 상태에서 +D 입력 시 방향키 입력 방향쪽으로 큰 폭탄을 던지게 됩니다. 

step11_title = 매드블라스터 - 시한폭탄 / 무기스킬(SD / R)
step11_help  = 시한폭탄(SD)은 거대한 폭탄을 들고 다니며 적에게 시한폭탄을 건네주는 스킬입니다. 폭탄과 적이 닿았을때 시한폭탄이 건네져지며, 3단계의 시간이 랜덤 부여되어 터지는 시간이 다릅니다.

step12_title = 매드블라스터 - 미치광이 / 갑옷스킬(ASD / E)
step12_help  = 미치광이(ASD)는 달리면서 뒤에 폭탄을 마구 뿌리며 달리는 스킬입니다. 달리는 도중 A 입력 시 점프가 가능합니다.

step13_title = 매드블라스터 - 폭파광 / 투구(AD / W)
step13_help  = 폭파광(AD)은 점프하며 폭탄을 던지는 스킬입니다. +D 입력 시 추가적으로 폭탄을 던지며 방향키 입력 시 방향 전환도 가능합니다.

step14_title = 매드블라스터 - 가이드붐 / 망토(AS / Q)
step14_help  = 가이드붐(AS)은 범위내 타겟에 폭탄을 보내 공격하는 스킬입니다. 공중에서도 사용이 가능합니다.

step15_title = 매드블라스터 - 국민콤보 ①
step15_help  = ★ 대시 공격 1 → 대시 공격 2 → 가이드붐(AS) → 미치광이(ASD) : 대시공격 1,2로 상대방을 띄운 후 떨어지는 적에게 망토스킬을 사용해 속성 공격을 입힌 뒤 갑옷스킬로 마무리합니다.

step16_title = 매드블라스터 - 국민콤보 ②
step16_help  = ★ 폭탄 남발3 → 폭파광(AD) : 폭탄 남발로 상대방을 눕힌 뒤 폭파광(AD)로 마무리 합니다.



[Set214]

max_step = 18

step0_title  = Dr.스파이더 - 기본소개
step0_help   = Dr.스파이더는 거미 로봇을 타고 날아다니며 적을 공격하는 일반 용병입니다.

step1_title  = Dr.스파이더 - 기본공격 (D → D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 5연속 발사를 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = Dr.스파이더 - 스파이더 제작 (D 오래누름)
step2_help   = 공격키(D오래누름)를 오래 누르면 게이지가 충전됩니다. 게이지는 0부터 시작되며 100까지 회복 됩니다. 

step3_title  = Dr.스파이더 - 스파이더 소환 (게이지 100 → D 오래누름)
step3_help   = 게이지가 100인 상태에서 공격키(D오래누름)를 오래 누르면 시전자는 스파이더 로봇에 탑승하게 됩니다. 탑승 후 이동 및 방향 전환이 가능 합니다.

step4_title  = Dr.스파이더 - 스파이더 지상 공격 (+D 누름)
step4_help   = 스파이더 로봇에 탑승한 상태에서 공격키 (+D)를 입력 하면 전방으로 에너지 탄을 발사하게 됩니다. 포물선 형태로 날아가며 피격 된 적은 넉백 됩니다.

step5_title  = Dr.스파이더 - 스파이더 탈출 (+S 누름)
step5_help   = 스파이더 로봇에 탑승한 상태에서 공격키 (+S)를 누르면 시전자는 로봇에서 탈출하고, 로봇은 전방으로 날아가 폭파 됩니다. 피격 된 적은 넉백 됩니다.

step6_title  = Dr.스파이더 - 스파이더 점프 (+A 누름)
step6_help   = 스파이더 로봇에 탑승한 상태에서 공격키 (+A)를 누르면 시전자는 공중으로 점프 하게 됩니다.

step7_title  = Dr.스파이더 - 스파이더 점프 부스터 (점프 중 +A 누름)
step7_help   = 스파이더 로봇으로 점프한 뒤 점프키(+A) 추가 입력 시 로봇은 부스터 상태가 되어 공중에 서서히 지상으로 착지 합니다.

step8_title  = Dr.스파이더 - 스파이더 점프 부스터 2 (점프 중 +A 누름)
step8_help   = 스파이더 점프 부스터 상태 시 거미 로봇의 다리가 회전하며 상대방을 타격할 수 있습니다.

step9_title  = Dr.스파이더 - 스파이더 점프 공격 (점프 중 +D 누름)
step9_help   = 스파이더 점프 상태 or 부스터 상태에서 공격키(+D) 입력 시 에너지탄을 발사하게 됩니다. 포물선 형태로 바닥으로 떨어지며 타격 된 적은 일정 피해를 받습니다.

step10_title = Dr.스파이더 - 대시공격 1 (->-> → +D)
step10_help  = 방향키를 빠르게 두 번 누른 상태에서 +D 입력 시 방향키 입력 방향쪽으로 슬라이딩 하며 상대방을 타격 합니다. 피격 된 적은 넉백 됩니다.

step11_title = Dr.스파이더 - 대시공격 2 (->-> → +D 오래누름)
step11_help  = 방향키를 빠르게 두 번 누른 상태에서 공격키(D오래누름)입력 시 방향키 입력 방향쪽으로 에너지블렛을 발사합니다. 피격 된 적은 강경직 상태가 됩니다.

step12_title = Dr.스파이더 - 점프공격 (A → D → D → D)
step12_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 최대 3회 에너지탄을 발사합니다.

step13_title = Dr.스파이더 - 점프대시 (A → ->->)
step13_help  = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 입력 방향 대각선 아래로 슬라이딩하며 적을 타격 합니다.

step14_title = Dr.스파이더 - 스파이더 / 무기스킬(SD / R)
step14_help  = 스파이더(SD)는 거대 스파이더 로봇을 탑승한 뒤 공격키(+D)를 입력하면 에너지 탄이 발사되고, 탄이 떨어진 자리에는 작은 스파이더를 소환해 적을 공격합니다.

step15_title = Dr.스파이더 - 스파이더 군단 / 갑옷스킬(ASD / E)
step15_help  = 스파이더군단(ASD)는 지정된 위치에 거미부대를 방출시키는 스킬입니다. 수 많은 거미들이 하늘에서 떨어지며, 적을 찾아 공격 합니다.

step16_title = Dr.스파이더 - 스파이더AI / 투구(AD / W)
step16_help  = 스파이더AI(AD)는 원거리 공격을 하는 스파이더AI를 생성해 적을 공격하는 스킬입니다. 시전자를 따라다니며 가까운적을 찾아 공격합니다.

step17_title = Dr.스파이더 - 스파이더캐논 / 망토(AS / Q)
step17_help  = 스파이더캐논(AS)는 4개의 스파이더 다리에서 에너지탄이 발사되는 스킬입니다. 적이 가까이 있을 시 4개의 다리에서 자동 조준 후 발사하게 됩니다.

step18_title = Dr.스파이더 - 국민 콤보 ①
step18_help  = ★ 스파이더군단 → 스파이더AI → 스파이더 : 스파이더 군단을 적의 위치에 방출시킨 뒤 스파이더AI를 소환한 뒤 스파이더를 탑승하고 적을 공격합니다.



[Set215]

max_step = 18

step0_title  = 괴도 - 기본소개
step0_help   = 괴도는 은신과 위장으로 상대를 속이고 장난감 폭탄으로 적을 제압하는 레어 용병입니다.

step1_title  = 괴도 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 괴도 - 은신 (D 오래누름)
step2_help   = 게이지가 있을 때 공격키(D)를 오래 누르면, 뒤로 대시를 하면서 자신의 모습을 감춥니다. 은신 상태에서 타격, 피격되면 은신이 해제됩니다.

step3_title  = 괴도 - 위장
step3_help   = 은신 상태를 일정 시간 유지하면 위장 상태가 됩니다. 위장 상태에서는 팀컬러가 변경됩니다.

step4_title  = 괴도 - 쇼타임 (위장 상태 D 오래누름)
step4_help   = 위장 상태일 때 공격키(D)를 오래 누르면, 공중으로 도약하며 장난감 폭탄을 사방으로 던집니다.

step5_title  = 괴도 - 쇼타임 - 체공 (쇼타임 상태 A 누름)
step5_help   = 쇼타임 상태일 때 점프키(A)를 누르면, 그 위치에 잠깐 머무릅니다. 체공 상태에선 방향키로 움직일 수 있는 마법진이 생성됩니다.

step6_title  = 괴도 - 쇼타임 - 투척 (체공 상태 D 누름)
step6_help   = 공격키(D)를 입력하면 게이지 1을 소모하여 마법진 위치로 장난감 폭탄을 투척합니다. 지상에 내려가기 전까지 체공과 투척을 반복 사용할 수 있습니다.

step7_title  = 괴도 - 대시 (->->)
step7_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 일정 거리를 도약하여 이동 및 공격을 회피하는 대시를 사용할 수 있습니다.

step8_title  = 괴도 - 토끼 연계 공격 (D, DD → ->->)
step8_help   = 기본공격으로 소환한 토끼는 괴도의 대시에 반응하여 해당 방향으로 이동하며 공격합니다.

step9_title  = 괴도 - 점프공격 (A → D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 앞으로 비둘기를 날려보내 공격합니다.

step10_title = 괴도 - 공중대시 (A → ->->)
step10_help  = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 하강 이동을 하는 공중 대시가 발동됩니다.

step11_title = 괴도 - 비둘기 연계 공격 (A → D → ->->)
step11_help  = 점프공격으로 소환한 비둘기는 괴도의 공중대시에 반응하여 해당 방향으로 이동하며 공격합니다.

step12_title = 괴도 - 도플갱어 / 무기스킬(SD / R)
step12_help  = 도플갱어(SD)는 앞으로 전진하며 마술 지팡이로 상대를 내리치는 스킬입니다. 상대를 타격하면 대상의 장비를 복사하여 자신이 장착합니다.

step13_title = 괴도 - 황혼의 사자가 새벽의 처녀에게... / 갑옷스킬(ASD / E)
step13_help  = 황혼의 사자가 새벽의 처녀에게...(ASD)는 상대팀으로 위장하여 공격을 회피하는 스킬입니다. 방향키로 조준점을 움직이며 D키를 누르면 나타납니다.

step14_title = 괴도 - 혼란의 서막 / 투구스킬(AD / W)
step14_help  = 혼란의 서막(AD)는 적군을 아군으로 위장시켜 혼란을 주는 스킬입니다. 방향키로 조준점을 움직이며 D키를 누르면 선물상자로 공격합니다. 맞은 적은 팀컬러가 바뀝니다.

step15_title = 괴도 - 장난감 폭탄 / 망토스킬(AS / Q)
step15_help  = 장난감 폭탄(AS)는 장난감 폭탄을 던지는 스킬입니다. 방향키로 조준점을 움직이며 D키를 누르면 공격합니다. A키를 입력하면 다시 던질 수 있는 상태가 됩니다.

step16_title = 괴도 - 국민 콤보 ①
step16_help  = ★기본공격 (D → D)으로 경직을 주고 → 대시 (->->)를 상대 반대 방향으로 사용하여 대상을 넘어뜨립니다.

step17_title = 괴도 - 국민 콤보 ②
step17_help  = ★쇼타임 (위장 상태 D 오래누름)으로 적을 띄우고 →  체공 (쇼타임 상태 A 누름)과 →  투척 (체공 상태 D 누름)을 번갈아 사용하여 대상을 연속 공격합니다.



[Set216]

max_step = 30

step0_title  = 미드나잇 - 기본소개
step0_help   = 미드나잇은 전투에 특화된 다양한 무기를 사용하며 상황에 따라 무기를 교체해 상대를 제압하는 유니크 용병입니다.

step1_title  = 미드나잇 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 미드나잇 - 대시공격 (->-> → D → D)
step2_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 달리는 중에 공격키(D)를 누르면 대상을 2연타 공격할 수 있습니다.

step3_title  = 미드나잇 - 대시 캔슬 공격1 (공격 중 → ->->)
step3_help   = 기본공격, 점프 특별공격, 대시공격 중 대시 키(->->)를 누르면 공격을 끊고 방향키를 누른 방향으로 관통 공격을 합니다.

step4_title  = 미드나잇 - 대시 캔슬 공격2 (공격 중 → ->-> → +D)
step4_help   = 대시 캔슬 공격 이후 공격키 (+D)를 누르면 바라보고 있는 방향으로 띄움 공격을 합니다.

step5_title  = 미드나잇 - 대시 특별공격1 (->-> → D 오래누름)
step5_help   = 대시 상태에서 공격키(D)를 오래 누르면 전방으로 체인을 발사합니다. 체인에 피격 된 적은 일정 시간 동안 체인을 결박 당하게 됩니다.

step6_title  = 미드나잇 - 대시 특별공격2 (->-> → D 오래누름 → +D)
step6_help   = 결박 당한 적이 있는 상태에서 공격키 (+D) 입력 시 체인에 이끌려 시전자 앞으로 끌려오게 됩니다. 

step7_title  = 미드나잇 - 점프공격 (A → D → D → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(+D)를 누르면 최대 3연속 공격을 합니다.

step8_title  = 미드나잇 - 점프 특별 공격(A → D 오래누름)
step8_help   = 점프 상태에서 공격키(D)를 오래 누르면 대각선 아래로 강습하며 적을 공격합니다. 이후 캔슬 대시 기능을 사용할 수 있습니다.

step9_title  = 미드나잇 - 게이지 회복
step9_help   = 특별 게이지는 걷기, 대시, 대기 상태, 피격, 다운 중 충전됩니다. 게이지는 무기교체, 특별 공격 시 사용됩니다.

step10_title = 미드나잇 - 에너지방출 (D오래누름)
step10_help  = D 오래누름 시 시전자 주변에 에너지볼이 발생 되며, 띄움 공격을 진행 합니다. 30 게이지를 소모합니다.

step11_title = 미드나잇 - 낫 무기 교체1 (지상 : ↓→ / 공중 : →→or↓↓ )
step11_help  = 낫 무기교체는 공격 중 커맨드 입력 시 무기를 교체하며 적을 공격할 수 있습니다. 지상에는 띄움 공격을 진행하고, 공중에서는 바운딩 공격을 진행합니다.

step12_title = 미드나잇 - 낫 무기 교체2 (기본 공격)
step12_help  = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 

step13_title = 미드나잇 - 낫 무기 교체3 (대시 공격)
step13_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 달리는 중에 공격키(D)를 누르면 전방에 공격을 진행합니다. 피격된 적은 바운딩 됩니다.

step14_title = 미드나잇 - 낫 무기 교체4 (점프 공격)
step14_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(+D)를 누르면 최대 5연속 공격을 합니다.

step15_title = 미드나잇 - 낫 무기 교체5 (↓→)
step15_help  = 낫 무기교체 후 기본 공격 중 커맨드(↓→) 입력 시 왼쪽 낫으로 전방의 적을 공격 합니다. 공격 타이밍에 맞춰서 반복 사용도 가능합니다.

step16_title = 미드나잇 - 낫 무기 교체6 (↓←)
step16_help  = 낫 무기교체 후 기본 공격 중 커맨드(↓←) 입력 시 오른쪽 낫으로 전방의 적을 공격 합니다. 공격 타이밍에 맞춰서 반복 사용도 가능합니다.

step17_title = 미드나잇 - 낫 무기 교체7 (점프 공격)
step17_help  = 낫 무기교체 후 기본 공격 중 커맨드(←↓→) 입력 시 전방에 두 개의 낫을 던저버립니다. 날아간 낫은 되돌아오며, 타격 된 적은 낫에 휩쓸려 시전자에게 되돌아 옵니다.

step18_title = 미드나잇 - 낫 무기 해제 (D오래누름)
step18_help  = 지상, 공중에서 공격 키(D오래누름)를 오래 누르면 기본 무기로 교체되며, 전방으로 체인을 발사 합니다. 피격된 적은 결박 당하며, 공격키 (+D) 입력 시 시전자에게 끌려옵니다.

step19_title = 미드나잇 - 권총 무기 교체1 (지상 : ↓← / 공중 : ←←or↑↑ ) 
step19_help  = 권총 무기교체는 공격 중 커맨드 입력 시 무기를 교체하며 적을 공격할 수 있습니다. 지상에는 2발을 권총을 발사하고, 공중에서는 360도 회전하며 난사합니다.

step20_title = 미드나잇 - 권총 무기 교체2 (기본 공격)
step20_help  = 공격키(D)를 누르면 전방으로 2발의 권총을 연달아 발사합니다. 

step21_title = 미드나잇 - 권총 무기 교체3 (대시 공격)
step21_help  = 방향키를 빠르게 두 번 누르면 전방으로 슬라이딩하며 적을 공격과 동시에 관통합니다. 슬라이딩에 일정 시간동안 3회 이상 피격된 적은 바운딩 됩니다.

step22_title = 미드나잇 - 권총 무기 교체4 (점프 공격)
step22_help  = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(+D)를 누르면 최대 4연속 권총을 발사합니다.

step23_title = 미드나잇 - 권총 무기 해제 (D오래누름)
step23_help  = 지상에서 공격 키(D오래누름)를 오래 누르면 전방에 권총을 난사하며 기본무기로 교체하며, 점프 중 공격 키(D오래누름)를 오래 누르면 360도 회전하며 난사합니다.

step24_title = 미드나잇 - 체인러쉬 / 무기스킬(SD)
step24_help  = 체인러쉬(SD)는 전방으로 돌진한 뒤 주변 적을 모두 끌어 모아 공격하는 스킬입니다. 피격, 다운, 공중 등 모든 상태에서 사용이 가능합니다. 

step25_title = 미드나잇 - 앱솔루트 체인 / 갑옷스킬(ASD)
step25_help  = 앱솔루트 체인(ASD)은 시전자 주변에 있는 모든 적에게 체인을 발사하여, 시전자 앞으로 끌어오는 스킬입니다. +D 입력 시 주변 적을 띄우는 공격이 발동됩니다.

step26_title = 미드나잇 - 고어 체이스 / 투구스킬(AD)
step26_help  = 고어 체이스(AD)는 대각선 하늘 위로 미사일을 발사하는 스킬입니다. 미사일은 일정 거리를 이동한 뒤 수십개의 미사일로 분산되어 유도 공격을 진행합니다.

step27_title = 미드나잇 - 얼티밋 사이드 / 망토스킬(AS)
step27_help  = 얼티밋 사이드(AS)는 전방에 조종이 가능한 낫을 발사한 뒤 적을 끌고 오는 스킬입니다. 시전자 주변의 적은 시야가 가려지게 됩니다.

step28_title = 미드나잇 - 국민콤보 ①
step28_help  = ★ 권총 교체 공격 → 기본공격 1타 → 캔슬 대시 공격 → 기본공격 1타 → 캔슬 대시 공격 → 기본공격 1타  → 캔슬 대시 공격 → 점프 3타 공격 → D 오래누름으로 마무리 합니다.

step29_title = 미드나잇 - 국민콤보 ②
step29_help  = ★ 대시 특별 공격 → +D → 기본공격 3타 → 낫 무기교체 → 대시 공격 1타  → 점프 공격 4타 → 점프 D 오래누름(무기 교체) → +D → 점프 공격 3타 → 점프 권총 무기 교체 공격으로 마무리합니다.



[Set217]

max_step = 14

step0_title  = 로켓런처 - 기본소개
step0_help   = 로켓런처는 수많은 유도탄을 발사하여 적을 제압하는 레어 용병입니다.

step1_title  = 로켓런처 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 로켓런처 - 조준 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 조준점이 생성됩니다. 조준점은 방향키 조작으로 조종하며 점프키(A), 방어키(S)로 고도 조절을 할 수 있습니다.

step3_title  = 로켓런처 - 발사 (조준 상태 D 누름)
step3_help   = 적을 조준한 후 공격키(D)를 입력하면 해당 대상에 미사일을 발사합니다. 오래 조준할수록 많은 미사일을 발사할 수 있습니다.

step4_title  = 로켓런처 - 조준 취소 (조준 상태 D 오래누름)
step4_help   = 조준(D 오래누름) 상태에서 공격키(D)를 오래 입력하면 조준 상태를 취소합니다.

step5_title  = 로켓런처 - 장전 (S 오래)
step5_help   = 방어키(S)를 오래 누르고 있거나 미사일이 한발도 없을 때 공격키를 오래 누르면 장전이 발동됩니다. 미사일이 없으면 사격이 불가능하므로 틈틈이 장전을 해주어야 합니다.

step6_title  = 로켓런처 - 대시공격 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 달리는 중에 공격키(D)를 누르면 반대로 미사일을 발사합니다.

step7_title  = 로켓런처 - 점프공격 (A → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(+D)를 누르면 대상을 로켓런처로 내려치는 공격을 합니다. 

step8_title = 로켓런처 - 원격조종 미사일 / 무기스킬(SD)
step8_help  = 원격조종 미사일(SD)은 미사일을 발사, 조종하여 공격하는 스킬입니다. 방향키 조작으로 조종하며 점프키(A), 방어키(S)로 고도 조절을 할 수 있습니다. 공격키(D) 누름 유지 시 가장 가까운 적을 추적합니다.

step9_title = 로켓런처 - 전방폭격 / 갑옷스킬(ASD)
step9_help  = 전방폭격(ASD)은 전방으로 이동하며, 미사일 공격을 가하는 스킬입니다. 방향키를 통해 방향을 전환할 수 있으며, 일정시간 안에 공격키(D)를 누르지 않으면 스킬이 종료됩니다.

step10_title = 로켓런처 - 상승폭격 / 투구스킬(AD)
step10_help  = 상승폭격(AD)는 주변 넉백 후 공중에서 지상으로 미사일을 난사하는 스킬입니다. 사용 시 폭발과 함께 도약합니다. 이후 공격키(D) 입력 시 아래로 미사일을 발사합니다.

step11_title = 로켓런처 - 비행폭격 / 망토스킬(AS)
step11_help  = 비행폭격(AS)은 공중에서 전방과 지상으로 미사일 폭격을 가하는 스킬입니다. 사용 시 공중으로 상승하며 유도 미사일을 발사하는 상태가 됩니다. 방향키 조작으로 조종하며 점프키(A), 방어키(S)로 고도 조절을 할 수 있습니다.

step12_title = 로켓런처 - 국민콤보 ①
step12_help  = ★ 기본공격 2타 → 기본공격 2타로 마무리 합니다.

step13_title = 로켓런처 - 국민콤보 ②
step13_help  = ★ 점프공격 (A → D) → 기본공격 (D → D) → 조준 (D 오래누름) → 발사 (조준 상태 D 누름)로 마무리합니다.



[Set218]

max_step = 13

step0_title  = 차원술사 - 기본소개
step0_help   = 차원술사는 공간을 조작하여 상대를 제압하는 레어 용병입니다

step1_title  = 차원술사 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 차원술사 - 차원 조종 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 이동이 가능한 매직서클이 생성됩니다. 

step3_title  = 차원술사 - 블랙홀 소환 (차원 조종 상태에서 D입력)
step3_help   = 차원 조종(D오래누름 후) 중 D를 입력 하면 블랙홀이 발생됩니다. 블랙홀은 게이지 잔여량에 따라 최대 3개까지 소환할 수 있습니다.

step4_title  = 차원술사 - 블랙홀 소환2 (차원 조종 상태에서 D오래누름)
step4_help   = 차원 조종(D오래누름 후) 중 D오래누름 시 1개의 블랙홀만 발생시킨 뒤 대기 상태로 변환됩니다.

step5_title  = 차원술사 - 블랙홀
step5_help   = 블랙홀은 적을 따라다니며, 적 피격 시 시전자 앞으로 순간이동 시킵니다.

step6_title  = 차원술사 - 게이지 회복
step6_help   = 게이지는 걷기, 대시, 대기 상태에서 회복되며, 캐릭터 교체 시 초기화 됩니다.

step7_title  = 차원술사 - 대시 (->->)
step7_help   = 방향키를 2회 연속 입력 시 입력 방향으로 순간이동하게 됩니다. 게이지를 사용하게 되며, 기본 공격 시 캔슬 대시가 가능합니다.

step8_title  = 차원술사 - 점프 공격 (A → D → D → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대각선 아래로 발사체를 발사합니다.

step9_title = 차원술사 - 일그러진 차원 / 무기스킬(SD)
step9_help  = 일그러진 차원(SD)은 전방 모든 적을 붙잡아 하늘로 순간이동 시킨 뒤 낙하 데미지를 주는 스킬입니다.

step10_title = 차원술사 - 공간 비틀기 / 갑옷스킬(ASD)
step10_help  = 공간 비틀기(ASD)는 시전자 중심으로 매직서클이 발생되고, 스킬이 끝나기 전에 D를 입력 하면 피격 된 적은 반대방향으로 순간이동하게 됩니다.

step11_title = 차원술사 - 공간 압축 / 투구스킬(AD)
step11_help  = 공간 압축(AD)은 원하는 지역의 공간을 압축 시킨 뒤 시전자 뒤로 순간이동 시키는 스킬입니다.

step12_title = 차원술사 - 다~ 빨아들이겠다 / 망토스킬(AS)
step12_help  = 다~ 빨아들이겠다(AS)는 매직서클로 원하는 이동 경로를 설정한 뒤 블랙홀을 발생 시키는 스킬입니다.

step13_title = 차원술사 - 국민콤보 ①
step13_help  = ★ 차원 조종 → 블랙홀 생성 → 순간이동 된 적에게 기본타 공격 3타 후 일그러진 차원(SD)를 사용해 마무리합니다. 



[Set219]

max_step = 13

step0_title  = 파파라치 - 기본소개
step0_help   = 파파라치는 카메라를 들고 다니며, 상대방을 집요하게 촬영하여 제압하는 콘테스트 용병입니다.

step1_title  = 파파라치 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 파파라치 - 연속 촬영 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 전방에 4연속 촬영으로 공격합니다. D오래누름 중 떼기 시 딜레이로 돌아오게 됩니다.

step3_title  = 파파라치 - 고속 촬영(D 살짝누름 떼기)
step3_help   = 공격키 D 살짝누름 떼기 시 게이지를 소모하며, 망원 렌즈 장착하여 방어파괴 효과로 공격합니다. 피격 된 적은 특정 모션을 일정시간 동안 표현합니다.

step4_title  = 파파라치 - 게이지 회복
step4_help   = 게이지는 걷기, 달리기, 대기, 피격 중, 공격 상태에서 회복되며, 캐릭터 교체 시 저장 됩니다.

step5_title  = 파파라치 - 대시 (->->)
step5_help   = 방향키를 2회 연속 입력 시 입력 방향으로 구르기 이동합니다. 최대 연속 2회 구르기 이동이 가능합니다.

step6_title  = 파파라치 - 대시공격 (->-> → +D)
step6_help   = 방향키를 2회 연속 입력하여 구른 뒤 공격키 (+D) 입력 시 전방으로 2연속 카메라 플래시 공격을 합니다.

step7_title  = 파파라치 - 점프 공격 (A → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 전방으로 카메라 플래시 공격을 한 뒤 빠른 속도로 하강합니다.

step8_title  = 파파라치 - 대포카메라 / 무기스킬(SD)
step8_help   = 대포카메라 (SD)는 은밀하게 숨어 적을 관찰하고 카메라로 촬영하여 공격하는 스킬입니다. 피격 된 적은 오랜 시간 동안 특정 모션을 취하며, 촬영을 기다립니다.

step9_title = 파파라치 - 조작된 사진 / 갑옷스킬(ASD)
step9_help  = 조작된 사진 (ASD)은 가까운 상대방에게 카메라로 표시한 뒤 +D 입력 시 매직 서클이 생성 되고, 추가로 +D 입력 시 상대방 위치에서 매직 서클을 향하는 카메라를 생성해 공격합니다.

step10_title = 파파라치 - 잠입 / 투구스킬(AD)
step10_help  = 잠입(AD)은 은신한 뒤 기어 다니면서 적을 염탐하고, 기습적으로 사진 촬영하여 공격하는 스킬입니다.

step11_title = 파파라치 - 특종 / 망토스킬(AS)
step11_help  = 특종 (AS)은 3개의 신문을 펼쳐 놓은 뒤 해당 아이템에 상호작용하여 랜덤으로 이로운 버프, 스턴에 걸리는 스킬입니다.

step12_title = 파파라치 - 국민콤보 ①
step12_help  = ★ 기본타3타 → 고속 촬영 → 연속 촬영 → 대시 공격을 이용해 마무리합니다. 

step13_title = 파파라치 - 국민콤보 ②
step13_help  = ★ 기본타3타 → 고속 촬영 → 연속 촬영 → 조작된 사진 → 대포 카메라 → 고속 촬영 → 연속촬영 → 대시 공격을 이용해 마무리합니다. 


[Set220]

max_step = 16

step0_title  = 티르 - 기본소개
step0_help   = 티르는 아군과 자신을 지켜주는 보호막을 형성해 적을 가둔 뒤 제압하는 유니크 용병입니다.

step1_title  = 티르 - 기본공격 (D → D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 5연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 티르 - 베리어 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 시전자 주변에 큰 구체 형태에 방어막이 형성됩니다. D~ 유지 시 이동 가능하며, 일정 시간 동안 유지 됩니다.

step3_title  = 티르 - 베리어 2 (D 오래 누름)
step3_help   = 공격키(D)를 누른 뒤 떼면 방어막이 시전자 위치에 설치됩니다. 캐릭터 변경 및 피격당하여도 방어막은 유지되며, 일정 타격 피해를 당하면 방어막이 사라집니다.

step4_title  = 티르 - 게이지 회복
step4_help   = 게이지는 걷기, 달리기, 대기, 피격 중, 베리어 생성 중 회복되며, 각 캐릭터 상태마다 회복 속도가 다릅니다.

step5_title  = 티르 - 대시 공격 (->-> → D → D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 달리는 중에 공격키(D)를 누르면 대상을 2연타 공격할 수 있습니다. 공중, 지상 타격 효과가 다릅니다.

step6_title  = 티르 - 대시 공격 (->-> → +D → ->->)
step6_help   = 대시 공격 중 방향키 2번 입력 시 입력 방향으로 전진하며 관통 공격을 진행합니다. 대시 1타 공격 후 캔슬 대시 후 +D 입력 시 대시 공격 2타가 공격이 이루어집니다.

step7_title  = 티르 - 점프 공격 (A → D → D → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 3연속 공격을 진행합니다.

step8_title  = 티르 - 점프 대시 (A → ->->)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 방향키(->)를 연속 누르면, 입력 방향으로 강습 공격을 진행합니다. 공중, 지상 타격 효과가 다릅니다.

step9_title  = 티르 - 점프 특별 공격 (A → D 오래누름)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이때 방향키(+D)를 오래 누르면, 매직서클이 생성되고, D~를 떼면 매직서클을 향해 강습 공격을 합니다. 공중, 지상 타격 효과가 다릅니다.

step10_title  = 티르 - 도발 / 무기스킬(SD)
step10_help   = 도발(SD)은 시전자 주변에 큰 함성을 외쳐 상대방을 도발하는 것 입니다. 시전자를 바라보는 적은 무력하게 시전자에게 걸어오며, 반대 방향인 적은 울먹이며 도망갑니다.

step11_title = 티르 - 포효 / 갑옷스킬(ASD)
step11_help  = 포효 (ASD)는 시전자 주변에 약경직을 주며 위험 상황을 빠져나가는 스킬입니다. 피격, 모든 속성 상태일 때 스킬 사용이 가능하며, 패시브 스킬은 장비파괴 스킬 무시입니다.

step12_title = 티르 - 해머 / 투구스킬(AD)
step12_help  = 해머(AD)는 전방의 헬멧의 기운을 발산하며, 상대방을 스턴에 이르게 하는 스킬입니다. 패시브 스킬은 스킬 봉인 저항입니다.

step13_title = 티르 - 돌격 / 망토스킬(AS)
step13_help  = 돌격(AS)은 전방으로 빠르게 돌격하며, 상대방을 높게 띄우는 스킬입니다. 패시브 스킬은 특정 속성 버프를 저항합니다.

step14_title = 티르 - 국민콤보 ①
step14_help  = ★ 점프 대시 → 대시 공격 2타 → 캔슬 점프 및 점프 공격3 타 → 점프 대시 → 점프D~ 떼기 → 베리어 생성 띄움 공격으로 마무리합니다. 

step15_title = 티르 - 국민콤보 ②
step15_help  = ★ 해머 → 돌격 → 기본타 5타 → 도발 → 점프 대시 → 대시공격 2타 → 대시 공격 1 → 대시 캔슬 → 대시 공격 2타 이용해 마무리합니다. 



[Set221]
max_step = 15

step0_title  = 뉴클리어솔저 - 기본소개
step0_help   = 뉴클리어솔저는 적에게 레이저를 쏘거나, 핵미사일을 발사해 상대를 제압하는 원거리 레어 용병입니다.

step1_title  = 뉴클리어솔저 - 기본공격 (D)
step1_help   = 공격키(D)를 누르면 레이저를 발사합니다. 공격 후 방향키를 빠르게 두 번 입력하면 해당 방향으로 전진 이동을 합니다.

step2_title  = 뉴클리어솔저 - 에너지 충전 (D 누름유지)
step2_help   = 공격키(D) 누름 유지 시, 조준 가이드가 생성되고 게이지가 회복됩니다. D누름 떼기 시 게이지 단계별로 다른 공격이 발생됩니다.

step3_title  = 뉴클리어솔저 - 발사 취소 (D누름 떼기1)
step3_help   = 에너지 충전(D 누름유지) 중 게이지가 0~9일 때 D누름 떼기 시 발사를 취소됩니다. 

step4_title  = 뉴클리어솔저 - 레이저 발사1(D누름 떼기2)
step4_help   = 에너지 충전(D 누름유지) 중 게이지가 10~24일 때 D누름 떼기 시 조준 가이드를 향해 레이저를 발사합니다.

step5_title  = 뉴클리어솔저 - 레이저 발사2(D누름 떼기3)
step5_help   = 에너지 충전(D 누름유지) 중 게이지가 25~99일 때 D누름 떼기 시 조준 가이드를 향해 강력한 레이저를 발사합니다.

step6_title  = 뉴클리어솔저 - 핵미사일 발사(D누름 떼기4)
step6_help   = 에너지 충전(D 누름유지) 중 게이지가 100일 때 D누름 떼기 시 조준 가이드에 핵미사일이 떨어집니다. 떨어진 위치엔 짙은 먼지가 발생하여 시야를 방해합니다.

step7_title  = 뉴클리어솔저 - 전진 이동 (->->)
step7_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠\n르게 두 번 누르면 그 방향으로 일정 거리를 전진하여 이\n동 및 공격을 회피하는 전진 이동을 사용할 수 있습니다.

step8_title  = 뉴클리어솔저 - 점프 공격 (A → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 전방에 레이저를 발사합니다. 공격키를 오래 누르면 사정거리 내의 적을 조준하여 발사할 수 있습니다.

step9_title  = 뉴클리어솔저 - 점프 대시 (A → ->->)
step9_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면, 입력 방향으로 이동하며 반대 방향으로 레이저를 발사합니다.

step10_title = 뉴클리어솔저 - Red Zone / 무기스킬(SD)
step10_help  = Red Zone(SD)스킬은 지정한 위치에 은밀히 핵폭탄을 투하하는 스킬입니다. 핵미사일이 떨어진 위치는 방사능으로 오염되어, 지속적인 피해를 주고 시야를 방해합니다.

step11_title = 뉴클리어솔저 - 미니붐 / 갑옷스킬(ASD)
step11_help  = 미니붐(ASD)은 지정한 위치에 미니 핵폭탄을 발사하는 스킬입니다. 피격된 적은 일정 확률로 장비를 드랍합니다.

step12_title = 뉴클리어솔저 - Tactical Bombing / 투구스킬(AD)
step12_help  = Tactical Bombing(AD)은 은밀히 적군을 조준하여 미사일을 발사하는 스킬입니다. S입력 시 적을 조준하고, D입력 시 미사일을 발사합니다.

step13_title = 뉴클리어솔저 - Nuclear Strike / 망토스킬(AS)
step13_help  = Nuclear Strike(AS)은 지정된 위치에 핵폭탄을 투하하는 스킬입니다. 피격된 적은 장비를 드랍합니다.

step14_title = 뉴클리어솔저 - 국민콤보 ①
step14_help  = ★ 레이저 발사2 → Red Zone(SD) → 미니붐(ASD) → Nuclear Strike(AS) → Tactical Bombing(AD)로 마무리 합니다.



[Set222]
max_step = 16

step0_title  = 얼음신 - 기본소개
step0_help   = 얼음신은 얼음 결정체를 변경시켜 상대방을 공격하거나 자신을 보호하는 레어 용병입니다.

step1_title  = 얼음신 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 얼음신 - 얼음조각 생성 (D 오래 누름)
step2_help   = 게이지가 있는 상태에서 공격키(D)를 오래 누르면, 조준 가이드가 생성됩니다. 이후 D 누름 공격과 D 오래 누름 공격을 사용할 수 있습니다.

step3_title  = 얼음신 - 얼음조각 발사 (얼음조각 생성 → D 누름)
step3_help   = 얼음조각 생성(D 누름떼기)중 공격키(D)를 누르면 조준 가이드를 향해 얼음 조각을 발사 합니다. 얼음 조각은 하늘 위로 높이 날아간 뒤 지상으로 떨어집니다.

step4_title  = 얼음신 - 얼음조각 난사(얼음조각 생성 → D 오래누름 떼기)
step4_help   = 얼음조각 생성(D 누름떼기)중 공격키(D)를 오래 누르면 추가 게이지를 소모하여 얼음 조각을 생성하며, 공격키를 떼면 조준 가이드를 향해 랜덤 발사합니다.

step5_title  = 얼음신 - 얼음방패 (D 살짝 누름)
step5_help   = 공격키(D)를 살짝 눌렀다 떼면 게이지를 소모하여 얼음 방패를 전방에 생성합니다. 얼음 방패는 상대방의 공격을 효과적으로 방어할 수 있습니다.

step6_title  = 얼음신 - 게이지 회복
step6_help   = 게이지는 대기, 걷기, 달리기, 피격 상태에서 회복되며, 용병 교체 시 게이지는 유지됩니다.

step7_title  = 얼음신 - 대시 공격 (->-> → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 달리는 중에 공격키(D)를 누르면 전방에 얼음 기둥이 솟아나 적을 공격합니다.

step8_title  = 얼음신 - 대시 특별 공격 (->-> → D 오래 누름)
step8_help   = 달리는 중 공격키(D)를 오래 누르면 게이지를 소모하여 얼음 기둥을 생성합니다. D 누름 유지 시 얼음 기둥을 추가 생성합니다. 대시 공격 후에도 사용 가능합니다.

step9_title  = 얼음신 - 점프 공격 (A → D → D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대각선 아래로 얼음 화살을 발사합니다. 최대 2회 발사 가능하며 피격된 적은 순간적으로 얼어버립니다.

step10_title  = 얼음신 - 점프 특별 공격 (A → D 오래누름)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면, 지상으로 강습하여 얼음 기둥을 소환해 적을 공격합니다.

step11_title = 얼음신 - 얼음신의 방패 / 무기스킬(SD)
step11_help  = 얼음신의 방패(SD)는 시전자를 보호하는 얼음 기둥을 소환하는 스킬입니다. 얼음 기둥을 공격한 적은 일정 시간 얼게 됩니다.

step12_title = 얼음신 - 얼음신의 응징 / 갑옷스킬(ASD)
step12_help  = 얼음신의 응징(ASD)은 전방의 대상을 점점 얼려버리는 스킬입니다. 얼음 마크가 겹칠 때 D를 입력하여 추가 공격을 할 수 있습니다.

step13_title = 얼음신 - 얼음신의 분노 / 투구스킬(AD)
step13_help  = 얼음신의 분노(AD)는 빠르게 이동하며 전방의 대상을 공격한 뒤 얼려버리는 스킬입니다. 발사된 얼음 구체는 적을 쫓아 공격합니다.

step14_title = 얼음신 - 얼음신의 눈물 / 망토스킬(AS)
step14_help  = 얼음신의 눈물(AS)은 지정된 위치에 상대방을 얼리는 얼음벽을 설치하는 스킬입니다. 일정 시간 유지한 뒤 사라집니다.

step15_title = 얼음신 - 국민콤보 ①
step15_help  = ★ 점프 기본공격(A → D → D) → 점프 특별 공격(A → D 오래누름) → 대시 공격(->-> → D) → 대시 특별 공격(->-> → D 오래 누름)으로 마무리합니다.



[Set223]
max_step = 17

step0_title  = 포세이돈 - 기본소개
step0_help   = 포세이돈은 바다를 수호하는 소환수를 소환해 적을 공격하는 유니크 용병입니다.

step1_title  = 포세이돈 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 포세이돈 - 거대 파도 생성 (D 오래 누름)
step2_help   = 게이지가 있는 상태에서 공격키(D)를 오래 누르면, 거대한 파도를 소환합니다. 파도는 조종 가능하며 적 타격 시 파도에 휩쓸려 이동됩니다.

step3_title  = 포세이돈 - 거대 파도 발사 (D 오래 누름 떼기)
step3_help   = 거대 파도 생성 후 공격키(D~)를 떼면 전방으로 파도가 발사됩니다.

step4_title  = 포세이돈 - 소환수 소환 해마 (A오래누름 → 떼기 or 방향키"↑")
step4_help   = 점프키(A)를 오래 누르면 소환수 소환 아이콘이 출력 됩니다. 이때 A키 "떼기" or 방향키"↑" 입력하면 바다를 수호하는 '해마' 소환

step5_title  = 포세이돈 - 소환수 소환 물골렘 (A오래누름 → 방향키 "←")
step5_help   = 해마 3마리 소환 후 점프키(A)를 오래 누르면 소환수 소환 아이콘이 출력 됩니다. 이때 방향키"←" 입력하면바다를 수호하는 '물골렘' 소환

step6_title  = 포세이돈 - 소환수 소환 Queen (A오래누름 → 방향키 "→")
step6_help   = 해마 3마리, 물골렘 2마리 소환 후 점프키(A)를 오래 누르면 소환수 소환 아이콘이 출력 됩니다. 이때 방향키"→" 입력하면 바다를 수호하는 'Queen' 소환

step7_title  = 포세이돈 - 게이지 회복
step7_help   = 게이지는 대기, 걷기, 달리기, 피격 상태에서 회복되며, 캐릭터 변경 시 게이지는 초기화 됩니다.

step8_title  = 포세이돈 - 대시 공격 (->-> → D → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 달리는 중에 공격키(D)를 누르면 전방에 삼지창을 휘둘러 최대 2회 공격 가능합니다.

step9_title  = 포세이돈 - 점프 공격 (A → D → D → D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중에서 3연타 공격을 합니다. 마지막 타격 입은 적은 바운딩 됩니다.

step10_title  = 포세이돈 - 점프 특별 공격 (A → D 오래누름)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 거대한 파도가 생성되고 앞으로 파도가 밀려나갑니다. 소환수를 텔레포트 시키는 기능이 있습니다.

step11_title  = 포세이돈 - 점프대시 (A → ->->)
step11_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를\n빠르게 두 번 누르면 대각선 아래로 강습하며 공격합니다.

step12_title = 포세이돈 - 바다신의 부름 / 무기스킬(SD)
step12_help  = 바다신의 부름(SD)은 바다를 수호하는 소환 물을 한번에 소환하는 스킬입니다.

step13_title = 포세이돈 - 넵투누스의 말/ 갑옷스킬(ASD)
step13_help  = 넵투누스의 말(ASD)은 거대한 넵투누르 파도를 일으켜 타고 다니며 적을 공격하는 스킬입니다.

step14_title = 포세이돈 - 바다신의 오름 / 투구스킬(AD)
step14_help  = 바다신의 오름(AD)은 마법진에 솟아 오르는 물기둥을 생성하여 적을 공격하는 스킬입니다. 최대 3회 공격 가능합니다.

step15_title = 포세이돈 - 카리브디스 / 망토스킬(AS)
step15_help  = 카리브디스(AS)은 지정된 위치에 모든 것을 빨아들이는 카리브디스를 소환하여 적을 공격하는 스킬입니다.

step16_title = 포세이돈 - 국민콤보 ①
step16_help  = ★ 바다신의 부름(SD) → 거대 파도 생성(D오래누름) 소환수 위치에서 → 거대 파도 발사(D~누름떼기) 적을 소환수에게 가두면서 공격합니다.


[Set224]
max_step = 27

step0_title  = 스카이워커 - 기본소개
step0_help   = 스카이워커는 공중에서 자유자재로 대시하며 상대방을 공격하는 레어 용병입니다.

step1_title  = 스카이워커 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 스카이워커 -대시 공격 (->-> → D)
step2_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 달리는 중에 공격키(D)를 누르면 전방으로 전진하며 1회 공격 가능합니다.

step3_title  = 스카이워커 - 대시 공격2 (->-> → D오래누름)
step3_help   = 방향키를 빠르게 두 번 누르고 유지한 상태에서 공격키(D)를 오래 누르면 전방으로 전진하며 적을 공격 합니다. 캐릭터 관통이 가능합니다.

step4_title  = 스카이워커 - 대시 공격3 (->-> → D오래누름 → +D)
step4_help   = 대시 공격2 공격 동작이 끝나기 전에 추가키 (D)를 누르면 수직 상승하며 공격합니다. 피격 된 적은 다단히트 타격 피해를 입습니다.
 
step5_title  = 스카이워커 - 대시 공격 캔슬
step5_help   = 기본 대시 공격 동작이 끝나기 전에 공격키(D) 오래누름 시 대시 공격2 → 대시 공격3 캔슬 공격이 가능합니다.

step6_title  = 스카이워커 -점프 공격 (A → D → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중에서 2연타 공격을 합니다.

step7_title  = 스카이워커 - 점프 D 오래누름 (A → D오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 대각선 아래로 강습한 뒤 재점프 하는 공격을 진행 합니다.

step8_title  = 스카이워커 - 점프 대시 (캐릭터 시점 ←→↖↗)
step8_help   = 캐릭터 시점이 ←→↖↗ 상태에서 점프 후 방향 키(→→) 입력 시 90도 방향 직진 대시 공격 합니다.

step9_title  = 스카이워커 - 점프 대시 (캐릭터 시점 ←→↖↗)
step9_help   = 캐릭터 시점이 ←→↖↗ 상태에서 점프 후 방향 키(↗↗) 입력 시 90도 방향 대각선 위로 대시 공격 합니다.

step10_title  = 스카이워커 - 점프 대시 (캐릭터 시점 ←→↖↗)
step10_help   = 캐릭터 시점이 ←→↖↗ 상태에서 점프 후 방향 키(↘↘) 입력 시 90도 방향 대각선 아래로 대시 공격 합니다.

step11_title  = 스카이워커 - 점프 대시 (캐릭터 시점 ←→↖↗)
step11_help   = 캐릭터 시점이 ←→↖↗ 상태에서 점프 후 방향 키(←←) 입력 시 270도 방향 직진 대시 공격 합니다.

step12_title  = 스카이워커 - 점프 대시 (캐릭터 시점 ←→↖↗)
step12_help   = 캐릭터 시점이 ←→↖↗ 상태에서 점프 후 방향 키(↖↖) 입력 시 270도 방향 대각선 위로 대시 공격 합니다.

step13_title  = 스카이워커 - 점프 대시 (캐릭터 시점 ←→↖↗)
step13_help   = 캐릭터 시점이 ←→↖↗ 상태에서 점프 후 방향 키(↙↙) 입력 시 270도 방향 대각선 아래로 대시 공격 합니다.

step14_title  = 스카이워커 - 점프 대시 (시점 상관 없이)
step14_help   = 캐릭터 모든 시점에서 점프 후 방향 키(↑↑) 입력 시 수직 위로 대시 공격 합니다. 

step15_title  = 스카이워커 - 점프 대시 (캐릭터 시점 ←→↖↗↑↓↙↘)
step15_help   = 캐릭터 모든 시점에서 점프 후 방향 키(↓↓) 입력 시 수직 아래로 대시 공격 합니다.

step16_title  = 스카이워커 - 점프 대시 (캐릭터 시점  ↑↓↙↘)
step16_help   = 캐릭터 시점이 ↑↓↙↘ 상태에서 점프 후 방향 키(→→) 입력 시 180도 방향 직진 대시 공격 합니다.

step17_title  = 스카이워커 - 점프 대시 (캐릭터 시점  ↑↓↙↘)
step17_help   = 캐릭터 시점이 ↑↓↙↘ 상태에서 점프 후 방향 키(↗↗) 입력 시 180도 방향 대각선 위로 대시 공격 합니다.

step18_title  = 스카이워커 - 점프 대시 (캐릭터 시점  ↑↓↙↘)
step18_help   = 캐릭터 시점이 ↑↓↙↘ 상태에서 점프 후 방향 키(↘↘) 입력 시 180도 방향 대각선 아래로 대시 공격 합니다.

step19_title  = 스카이워커 - 점프 대시 (캐릭터 시점  ↑↓↙↘)
step19_help   = 캐릭터 시점이 ↑↓↙↘ 상태에서 점프 후 방향 키(←←) 입력 시 0도 방향 직진 대시 공격 합니다.

step20_title  = 스카이워커 - 점프 대시 (캐릭터 시점  ↑↓↙↘)
step20_help   = 캐릭터 시점이 ↑↓↙↘ 상태에서 점프 후 방향 키(↖↖) 입력 시 0도 방향 대각선 위로 대시 공격 합니다.

step21_title  = 스카이워커 - 점프 대시 (캐릭터 시점  ↑↓↙↘)
step21_help   = 캐릭터 시점이 ↑↓↙↘ 상태에서 점프 후 방향 키(↙↙) 입력 시 0도 방향 대각선 아래로 대시 공격 합니다.

step22_title = 스카이워커 - 스카이 워크 / 무기스킬(SD)
step22_help  = 스카이 워크(SD)는 공중으로 높이 뛴 뒤 바닥에 착지하며 범위 타격하는 스킬입니다. 총 3번 뛰어 올라 공격합니다.

step23_title = 스카이워커 - 스코치 슛/ 갑옷스킬(ASD)
step23_help  = 스코치 슛(ASD)은 전방의 적을 띄운 후 해당 적이 위로 순간이동 시켜 공격키(D)를 연타하는 스킬입니다.

step24_title = 스카이워커 - 악마의 다리 / 투구스킬(AD)
step24_help  = 악마의 다리(AD)는 공중을 뛰어 다니며 불타는 다리로 적을 공격하는 스킬입니다. 지상 및 공중 사용이 가능합니다.

step25_title = 스카이워커 - 화염분광 / 망토스킬(AS)
step25_help  = 화염분광(AS)은 주변의 적을 띄운 뒤 공중으로 순간이동하여 공격키(D)를 연타하는 스킬입니다.

step26_title = 스카이워커 - 국민콤보 ①
step26_help  = ★ (적 오른쪽에 있단 기준) 점프 D오래누름 → 점프 기본공격 2타 → 점프 대시(→→) → 점프 대시(↗↗) → 점프 대시(←←) → 점프 대시(↖↖)로 마무리 합니다.



[Set225]
max_step = 20

step0_title  = 권왕 - 기본소개
step0_help   = 권왕은 자신의 한계를 증폭시켜 적을 빠른 속도로 난타하는 레어 용병입니다.

step1_title  = 권왕 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 권왕 - 기본공격 캔슬 대시 (D → ->->)
step2_help   = 공격키(D)를 누른 뒤 방향키를 빠르게 두번 입력 시 입력된 방향으로 캔슬 대시 합니다.

step3_title  = 권왕 - 파산신공 1 (D 오래 누름)
step3_help   = 게이지가 있는 상태에서 공격키(D)를 오래 누르면 자신의 한계를 증폭 시키며 큰 파장을 만들어냅니다. 파장에 피격 된 적은 넉백 됩니다.

step4_title  = 권왕 - 파산신공 2 (D 오래 누름)
step4_help   = 파산신공은 시전자의 모든 능력치를 상승 시키며 특정 공격에 추가 피해 효과가 적용됩니다. 적군에게 피격 시 피해 대미지 또한 증가합니다.

step5_title  = 권왕 - 파산신공 3 (D 오래 누름)
step5_help   = 파산신공 중 D오래누름 시 상태가 해지되며, 기본 상태로 돌아가며 전방의 적을 공격합니다. 피격 된 적은 넉백 됩니다.

step6_title  = 권왕 -대시 공격 (->-> → D → D → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며, 달리는 중에 공격키(D)를 누르면 전방으로 전진하며 3회 공격 가능합니다.

step7_title  = 권왕 - 대시 공격2 (->-> → D오래누름)
step7_help   = 방향키를 빠르게 두 번 누르고 유지한 상태에서 공격키(D)를 오래 누르면 전방으로 전진하며 적을 공격합니다. 피격 된 적은 바운딩 되며 다운 타격이 가능합니다.

step8_title  = 권왕 - 대시 공격 캔슬
step8_help   = 대시 기본 공격 중 방향키를 빠르게 두번 입력 시 입력된 방향으로 캔슬 대시 합니다.

step9_title  = 권왕 -점프 공격 (A → D → D → D → D → D → D → D )
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중에서 7연타 점프 기본 공격합니다.

step10_title  = 권왕 - 점프 D 오래누름 (A → D오래누름)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 전방의 적을 잡아 땅으로 떨어집니다. 떨어진 적은 큰 충격파로 인해 바운딩 됩니다.

step11_title  = 권왕 - 점프 대시 공격 (A → ->->)
step11_help   = 점프중에 방향키를 빠르게 두번 입력 시 입력된 방향으로 전진하며 적을 공격합니다. 점프 중 1회 사용 가능합니다.

step12_title  = 권왕 - 점프 공격 캔슬 대시(A → D → ->->) 
step12_help   = 점프 기본 공격 중 방향키를 빠르게 두번 입력하면 입력된 방향으로 전진하며 적을 공격합니다. 점프 중 1회 사용 가능합니다.

step13_title  = 권왕 - 점프 공격 중 캔슬 대시(A → D → ->->) 
step13_help   = 점프 기본 공격 중 방향키를 빠르게 두번 입력하면 입력된 방향으로 전진하며 적을 공격합니다. 점프 중 1회 사용 가능합니다.

step14_title  = 권왕 - 게이지
step14_help   = 게이지는 특정 상황에서 회복됩니다. 또한 피격 시 추가 게이지 회복 효과가 있습니다.

step15_title = 권왕 - 회련각 / 무기스킬(SD)
step15_help  = 회련각(SD)은 전방의 적을 잡은 뒤 일정 시간 동안 받는 키 입력으로 상대방을 공격하는 스킬입니다. 최소 1대 최대 10대 타격 가능합니다.

step16_title = 권왕 - 질풍노도/ 갑옷스킬(ASD)
step16_help  = 질풍노도(ASD)는 질풍과 같은 빠른 연속 공격으로 전방에 있는 상대방을 공격하는 스킬입니다.

step17_title = 권왕 - 선풍쇄도 / 투구스킬(AD)
step17_help  = 선풍쇄도(AD)는 대상을 향해 연속 공격하는 스킬입니다. 스킬 쿨타임에 따라 다르게 공격합니다.

step18_title = 권왕 - 백절불굴 / 망토스킬(AS)
step18_help  = 백절불굴(AS)은 상대방의 공격을 버틴 뒤 연속 공격하는 스킬입니다. 스킬 사용 후 D오래누름으로 추가 공격을 할 수 있습니다.

step19_title = 권왕 - 국민콤보 ①
step19_help  = ★ 대시 공격3타 → 캔슬 대시 D오래누름 →  점프 → 점프 기본공격 → 점프 대시(→→) 점프 기본 공격 → 점프 D오래누름으로 마무리 합니다.



[Set226]
max_step = 14

step0_title  = 제네시스 - 기본소개
step0_help   = 제네시스는 미사일 부대를 진두지휘하며, 후방에서 아군을 지원하는 레어 용병입니다.

step1_title  = 제네시스 - 기본공격 (D)
step1_help   = 공격키(D)를 누르면 소드오프샷건을 발사합니다. 총알은 나아가며 확산됩니다. 일정 횟수 피격 시 넉백됩니다.

step2_title  = 제네시스 - 기본공격 캔슬 대시 (D → ->->)
step2_help   = 공격키(D)를 누른 뒤 방향키를 빠르게 두 번 입력하면 입력 방향으로 캔슬 대시 합니다.

step3_title  = 제네시스 - 무빙샷 (D 누름유지)
step3_help   = 공격키(D)를 누르고 있으면 조준점으로 소드오프샷건을 발사합니다. 공격 중 상하좌우로 움직일 수 있습니다. 일정 횟수 피격 시 넉백됩니다.

step4_title  = 제네시스 - 미사일 지원 (A 오래누름)
step4_help   = 점프키(A)를 오래 누르면 하늘에서 미사일 포탑이 떨어져 설치됩니다. 미사일 포탑은 주변의 적을 자동 공격합니다.

step5_title  = 제네시스 - 대시 (->->)
step5_help   = 방향키를 빠르게 두 번 입력하면 입력 방향으로 대시합니다. 캐릭터를 관통할 수 있습니다.

step6_title  = 제네시스 - 대시 공격 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 입력한 뒤 공격키(D)를 누르면 입력한 방향으로 소드오프샷건을 발사합니다. 피격 시 넉백됩니다.

step7_title  = 제네시스 - 점프 공격 (A → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 전방으로 소드오프 샷건을 발사 합니다.

step8_title  = 제네시스 - 점프 조준공격 (A → D 오래누름)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 근처의 적을 조준하여 소드오프샷건을 발사합니다.

step9_title  = 제네시스 - 부대지원 / 무기스킬(SD)
step9_help   = 부대지원(SD)은 수송기에서 투하된 미사일 포탑이 자동 설치되어 적을 공격하는 스킬입니다.

step10_title = 제네시스 - 모던어택/ 갑옷스킬(ASD)
step10_help  = 모던어택(ASD)은 공중으로 이동 후 공격하는 스킬입니다. 방어키(S)는 소폭탄, 공격키(D)는 대폭탄을 떨어뜨립니다. 점프키(A), 공격키(D) 입력 시 높이 뛰어올라 착지하며 공격합니다.

step11_title = 제네시스 - 미사일붐 / 투구스킬(AD)
step11_help  = 미사일붐(AD)은 폭발하며 적에게 미사일을 발사하는 폭탄을 손에 드는 스킬입니다. 공격키(D)를 누르면 전방으로 미사일붐을 던집니다.

step12_title = 제네시스 - 전자탄 / 망토스킬(AS)
step12_help  = 전자탄(AS)은 타겟을 잡아두는 유도 미사일을 발사해 적을 속박하는 스킬입니다.

step13_title = 제네시스 - 국민콤보 ①
step13_help  = ★ A오래누름 → 부대지원 → 모던어택 → 전자탄 → D오래누름 3타로 적을 타격하여 마무리 합니다.



[Set227]
max_step = 16

step0_title  = 릴리 - 기본소개
step0_help   = 릴리는 공중에서 자유롭게 날아다니며 적을 공격하는 레어 용병 입니다.

step1_title  = 릴리 - 기본공격 (D → D)
step1_help   = 공격키(D)를 연속해서 누르면 2연타 공격을 합니다. 두 번째 공격 진행 시 뒤로 회피하며 화살을 발사하며, 캐릭터를 관통할 수 있습니다.

step2_title  = 릴리 - 기본공격 캔슬 대시 (D → ->->)
step2_help   = 공격키(D)를 누른 뒤 방향키를 빠르게 두 번 입력하면 입력 방향으로 캔슬 대시 합니다.

step3_title  = 릴리 - 무빙 조준 (D 누름유지)
step3_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며 사정거리 내 대상을 자동으로 조준해줍니다. 조준된 상태에서 공격키를 떼면 대상에게 화살을 발사합니다.

step4_title  = 릴리 - 무빙 조준샷 (D 누름유지 떼기)
step4_help   = 공격키(D)를 떼면 화살 1발을 발사하며, 이후 공격키 추가 입력 시 최대 4발을 더 발사 할 수 있습니다.

step5_title  = 릴리 - 무빙 정조준 (조준 유지)
step5_help   = 대상을 조준 후 일정시간 유지하면 정조준이 됩니다. 정조준 후 공격키(D)를 떼면 화살을 발사합니다. 방어파괴 효과가 적용되며 피격된 적은 천천히 쓰러집니다.

step6_title  = 릴리 - 에로우 샷 (D누름유지)
step6_help   = 적을 조준하지 않은 상태에서 공격키(D)를 일정 시간 동안 유지 시 에임이 변경됩니다. 이후 (D)를 떼면 전방을 향해 거대한 화살을 발사합니다.

step7_title  = 릴리 - 점프 공격 (A → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 지상으로 낙하하며 전방에 화살을 발사합니다.

step8_title  = 릴리 - 점프 무빙 조준 (D 누름유지)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 오래 누르면 거대한 원형 띠가 생성되며 그안을 자유롭게 일정시간 동안 날아다닐 수 있습니다. 

step9_title  = 릴리 - 점프 무빙 조준샷 (D 누름유지 떼기)
step9_help   = 점프 D오래누름 중 공격키(D)를 떼면 조준된 적에게 화살 1발을 발사합니다. 이후 공격키를 추가 입력하면 최대 4발의 화살을 더 발사합니다.

step10_title  = 릴리 - 점프 무빙 정조준샷 (D 누름유지 떼기)
step10_help   = 점프 무빙 조준을 일정시간 동안 하게되면, 정조준 상태가 되며 이후 공격키를 떼면 강력한 화살을 발사합니다. 방어파괴 효과가 부여됩니다.

step11_title  = 릴리 - 꿈의샷~ / 무기스킬(SD)
step11_help   = 꿈의샷~(SD)은 전방에 꿈가루가 묻은 화살을 발사하는 스킬입니다. 화살이 지나간 자리에는 꿈가루가 퍼지며, 피격 된 적은 일정 시간 이후 잠듭니다.

step12_title = 릴리 - 모두 잠이 들어 버렸네~/ 갑옷스킬(ASD)
step12_help  = 모두 잠이 들어 버렸네~(ASD)는 전방으로 거대한 꿈가루를 발사하는 스킬입니다. 피격 된 적은 일정 시간 이후 잠듭니다.

step13_title = 릴리 - 꿈의 오로라~ / 투구스킬(AD)
step13_help  = 꿈의 오로라~(AD)는 자신에게 꿈가루를 묻히는 스킬입니다. 꿈가루가 묻힌 상태에서 적에게 피격 당하면, 상대방은 일정 시간 이후 잠듭니다.

step14_title = 릴리 - 꿈가루~ / 망토스킬(AS)
step14_help  = 꿈가루~(AS)는 공중을 날아다니며 꿈가루를 지상으로 천천히 떨어트리는 스킬입니다. 피격 된 적은 일정 시간 이후 잠듭니다.

step15_title = 릴리 - 국민콤보 ①
step15_help  = ★ 무빙 조준 → 무빙 조준샷 → 꿈의샷~ → 점프 무빙 조준샷으로 타격하여 마무리 합니다.


[Set228]

max_step = 19

step0_title  = 헤라클레스 - 기본소개
step0_help   = 헤라클레스는 대상의 상태에 따라 각기 다른 공격으로 제압하는 유니크 용병입니다.

step1_title  = 헤라클레스 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 헤라클레스 - 내려치기 (D 누름떼기)
step2_help   = 스탠딩 상태의 상대를 앞에 두고 공격키(D)를 오래 눌렀다 떼면 내려치기 공격을 합니다. 상대의 방어 및 무적 상태를 무시하고 공격합니다.

step3_title  = 헤라클레스 - 내려치기 (D 누름떼기 → D)
step3_help   = 내려치기 공격 후 공격키(D)를 한번 더 누르면 상대를 납작하게 만드는 추가 공격을 합니다.

step4_title  = 헤라클레스 - 날리기 (D 오래누름)
step4_help   = 공중 상태의 상대를 앞에 두고 공격키(D)를 오래 눌렀다 떼면 상대를 멀리 날려보내는 날리기 공격을 합니다. 상대의 방어 및 무적 상태를 무시하고 공격합니다.

step5_title  = 헤라클레스 - 들어올리기 (D 오래누름)
step5_help   = 다운된 상태의 상대를 앞에 두고 공격키(D)를 오래 눌렀다 떼면 상대를 잡아서 들어올리는 공격을 합니다. 방향키로 이동이 가능하며, 공격키(D)를 한번 더 누르면 던집니다.

step6_title  = 헤라클레스 - 점프공격 (A → D → D → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 점프 공격을 합니다. 3연타 공격이 가능합니다.

step7_title  = 헤라클레스 - 공중 띄우기(A → D 오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 상대를 띄우는 공중 띄우기 공격이 가능합니다.

step8_title  = 헤라클레스 - 공중 대시(A → ->->)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 방향키를 빠르게 두 번 누르면 하강하면서 대상을 내려치는 점프 대시 공격을 합니다.

step9_title  = 헤라클레스 - 대시공격 (->-> → D → D → D)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대시 공격을 합니다. 3연타 공격이 가능합니다.

step10_title = 헤라클레스 - 회전 공격 (->-> → D 오래누름)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키(D)를 오래 누르면 회전 이동하면서 공격을 합니다.

step11_title = 헤라클레스 - 반격 (방어 성공시 바로 공격)
step11_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step12_title = 헤라클레스 - 점프 캔슬 (공격 중 A)
step12_help  = 특별 공격을 제외한 모든 공격 중 점프키(A)를 누르면 점프 캔슬이 가능합니다. 점프 공격 중 점프 캔슬을 하면 점프 공격의 횟수가 초기화 됩니다.

step13_title = 헤라클레스 - 영웅의 땅울림 / 무기스킬(SD)
step13_help  = 영웅의 땅울림(SD)은 고함을 쳐서 주변의 대상을 공격하고, 땅을 힘껏 밟아 8방향으로 충격파를 날리는 스킬 입니다.

step14_title  = 헤라클레스 - 영웅의 승부 / 갑옷스킬(ASD)
step14_help   = 영웅의 승부(ASD)는 대상을 지정하여 일정거리를 벗어나게 되면 피해를 주는 스킬 입니다. A, S키로 타겟을 변경 할 수 있습니다.

step15_title  = 헤라클레스 - 사자의 가호 / 투구스킬(AD)
step15_help   = 사자의 가호(AD)는 피격 중에 회피 할 수 있는 상태로 만들어 주는 스킬입니다. 다운 중에는 방향키 입력으로 피할 수 있고, 공중 피격 중에는 A, S키로 가능합니다.

step16_title  = 헤라클레스 - 히드라의 독니 / 망토스킬(AS)
step16_help   = 히드라의 독니(AS)는 독을 뿌리며 날아가는 화살을 발사합니다. 독에 피격된 대상은 이동속도 및 점프 높이 감소, 대시 불가 효과에 걸리게 됩니다.

step17_title = 헤라클레스 - 국민콤보 ①
step17_help  = ★영웅의 땅울림(SD) → 히드라의 독니(AS)\n영웅의 땅울림으로 상대를 밀쳐낸 후 히드라의 독니로 화살을 날려 마무리 합니다.

step18_title = 헤라클레스 - 국민콤보 ②
step18_help  = ★영웅의 땅울림(SD) → 회전 공격(->-> → D 오래누름)\n영웅의 땅울림으로 상대를 스턴 시킨 후 회전 공격으로 연속 공격하여 마무리 합니다.

step19_title = 헤라클레스 - 국민콤보 ③
step19_help  = ★회전 공격(->-> → D 오래누름) → 점프 캔슬(공격 중 A) → 점프공격(->-> → D → D → D) 회전 공격으로 상대가 띄워지면 점프 캔슬 후 점프 공격으로 마무리 합니다.


[Set229]

max_step = 24

step0_title  = 사이즈 - 기본소개
step0_help   = 사이즈는 크기를 자유자재로 바꿔가며 각기 다른 공격으로 상대를 제압하는 레어 용병입니다.

step1_title  = 사이즈 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 사이즈 - 축소 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 크기가 작아지며 상대를 밀쳐내는 공격을 합니다. 피격된 대상은 뒤로 밀려났다가 위로 띄워지게 됩니다.

step3_title  = 사이즈 - 점프공격 (A → D → D → D)
step3_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를\n누르면 점프 공격을 합니다. 점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step4_title  = 사이즈 - 공중 축소(A → D 오래누름)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 크기가 작아지며 상대의 위치로 이동하여 밀쳐내는 공격을 합니다.

step5_title  = 사이즈 - 공중 축소 대시 (공중 축소  → ->->)
step5_help   = 공중 축소 상태에서 방향키를 빠르게 두번 누르면 입력한 방향으로 전진하며 상대를 관통 공격 합니다. 이때 다시 공격키(D)를 오래 누르면 공중 축소가 발동됩니다.

step6_title  = 사이즈 - 공중 축소 띄우기 (공중 축소  → D)
step6_help   = 공중 축소 상태에서 공격키(D)를 누르면 상대를 띄우는 공격을 합니다. 이때 다시 공격키(D)를 오래 누르면 공중 확대가 발동 됩니다.

step7_title  = 사이즈 - 공중 확대 (공중 축소 → D 오래누름)
step7_help   = 공중 축소 상태 또는 공중 축소 띄우기 이후에 공격키(D)를 오래 누르면 크기가 커지면서 상대를 내려치는 공격을 합니다.

step8_title  = 사이즈 - 공중 확대 대시 (공중 확대  → ->->)
step8_help   = 공중 확대 상태에서 방향키를 빠르게 두번 누르면 입력한 방향으로 하강하며 상대를 내려치는 공격을 합니다. 이때 공격키(D)를 오래 누르면 공중 확대가 발동됩니다.

step9_title  = 사이즈 - 공중 축소 띄우기 (공중 확대  → D)
step9_help   = 공중 확대 상태에서 공격키(D)를 누르면 상대를 띄우는 공격을 합니다. 이때 다시 공격키(D)를 오래 누르면 공중 축소가 발동 됩니다.

step10_title = 사이즈 - 대시공격 (->-> → D → D → D)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른\n달리기가 발동되며 달리는 중에 공격키를 누르면 대상을\n경직시키며 추가공격 성공시 대상을 띄울 수 있습니다.

step11_title = 사이즈 - 대시 확대(->-> → D 오래누름)
step11_help  = 대시 중 공격키(D)를 오래 누르면 크기가 커지면서 상대를 내려치는 공격을 합니다.

step12_title = 사이즈 - 대시 확대 대시 (대시 확대  → ->->)
step12_help  = 대시 확대 상태에서 방향키를 빠르게 두번 누르면 입력한 방향으로 전진하며 상대를 관통 공격 합니다. 이때 다시 공격키(D)를 오래 누르면 대시 확대가 발동됩니다.

step13_title = 사이즈 - 대시 확대 띄우기 (대시 확대  → D)
step13_help  = 대시 확대 상태에서 공격키(D)를 누르면 상대를 띄우는 공격을 합니다. 이때 다시 공격키(D)를 오래 누르면 대시 축소가 발동 됩니다.

step14_title = 사이즈 - 대시 축소 (대시 확대 → D 오래누름)
step14_help  = 대시 확대 상태 또는 대시 확대 띄우기 대시 이후에 공격키(D)를 오래 누르면 크기가 작아지면서 상대의 위치로 이동하여 밀쳐내는 공격을 합니다.

step15_title = 사이즈 - 대시 축소 대시 (대시 축소  → ->->)
step15_help  = 대시 축소 상태에서 방향키를 빠르게 두번 누르면 입력한 방향으로 전진하여 상대를 관통하는 공격을 합니다.

step16_title = 사이즈 - 대시 축소 띄우기 (대시 축소  → D)
step16_help  = 대시 축소 상태에서 공격키(D)를 누르면 상대를 띄우는 공격을 합니다. 이때 다시 공격키(D)를 오래 누르면 대시 확대가 발동 됩니다.

step17_title = 사이즈 - 반격 (방어 성공시 바로 공격)
step17_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다.\n강공격을 반격하는 경우에는 반격의 성공률이 높지만,\n연타 약공격을 반격하면 실패할 확률이 높습니다.

step18_title = 사이즈 - 양자영역 / 무기스킬(SD)
step18_help  = 양자영역(SD)은 매우 작은 크기로 축소된 후 공격키(D)를 누르면 갑자기 나타나서 상대를 공격하는 스킬 입니다.

step19_title = 사이즈 - 원자증폭 / 갑옷스킬(ASD)
step19_help  = 원자증폭(ASD)은 매우 큰 크기로 커진 후 마법진 위치로 내려찍으며 상대를 공격하는 스킬 입니다. 방향키로 마법진을 이동시킬 수 있습니다.

step20_title = 사이즈 - 원자 축소 / 투구스킬(AD)
step20_help  = 원자 축소(AD)는 크기가 작아진 후 상대의 위치로 이동하며 연타하는 스킬입니다. 공격키(D)를 입력 할때마다 전진 공격이 발동 됩니다.

step21_title = 사이즈 - 사이즈 봄 / 망토스킬(AS)
step21_help  = 사이즈 봄(AS)은 아군과 상대의 크기를 조절하는 스킬입니다. 아군은 크기가 작아지고 이동속도가 증가되며, 상대는 크기가 커지고 이동속도가 감소 됩니다.

step22_title = 사이즈 - 국민콤보 ①
step22_help  = ★양자영역(SD) → 원자증폭(ASD)\n앙자영역으로 상대를 스턴 시킨 뒤 스킬을 취소한 후 원자증폭으로 마무리 합니다.

step23_title = 사이즈 - 국민콤보 ②
step23_help  = ★양자영역(AD) → 원자 축소(AD)\n양자영역으로 상대를 스턴 시킨 뒤 스킬을 취소한 후 원자 축소로 연타하여 마무리 합니다.

step24_title = 사이즈 - 국민콤보 ③
step24_help  = ★대시 확대(->-> D오래누름)로 바운딩 시킨 후 대시 확대 띄우기(대시 확대 → D)로 띄운 후 대시 축소와 대시축소 대시로 연타하여 마무리 합니다.


[Set230]

max_step = 16

step0_title  = 이브 - 기본소개
step0_help   = 이브는 텔레포트로 근거리와 원거리를 오가며 상대를 제압하는 레어 용병입니다.

step1_title  = 이브 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 이브 - 조준 (D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며 사정거리 내 대상을 자동으로 조준합니다. 조준된 상태에서 공격키를 떼면 대상에게 레이저를 발사합니다.

step3_title  = 이브 - 연속발사 (D누름떼기 D연타)
step3_help   = 공격키(D)를 누름떼기하여 레이저를 발사한 후 공격키(D)를 연속으로 누르면 최대 3발까지 연속 발사가 가능합니다.

step4_title  = 이브 - 점프공격 (A → D → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 발로 2연타하는 점프 공격을 합니다.

step5_title  = 이브 - 점프사격 (A → D누름떼기 D연타)
step5_help   = 점프 후 공격키(D)를 오래 누르면 조준 상태가 됩니다. 최대 3연속까지 레이저를 발사할 수 있습니다.

step6_title  = 이브 - 대시 (->->)
step6_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 일정 거리를 전진하여 이동 및 공격을 회피하는 대시를 사용할 수 있습니다.

step7_title  = 이브 - 서브웨폰 (특수능력)
step7_help   = 기본공격, 점프공격 타격 시 보조무기를 1개 생성합니다. 조준공격 시 보조무기에서 유도 레이저를 발사합니다. 발사한 보조무기는 사라집니다.

step8_title  = 이브 - 록온 필드 (특수능력)
step8_help   = 레이저에 맞은 적에게서는 록온 필드가 생성됩니다. 이브는 자신이 생성한 록온 필드 안에서 대시 시 텔레포트를 사용합니다.

step9_title  = 이브 - 록온 텔레포트 (A 오래누름)
step9_help   = 점프키(A)를 오래 누르면 자신이 생성한 가장 가까운 록온 필드로 텔레포트합니다. 자신의 록온필드 안에서는 발동되지 않습니다.

step10_title = 이브 - 풀 버스트 / 무기스킬(SD)
step10_help  = 풀 버스트(SD)는 D키 연타로 서브웨폰에서 레이저를 발사하는 스킬입니다. 서브웨폰이 5개일 때만 사용할 수 있습니다.

step11_title = 이브 - 이브 웨폰 / 갑옷스킬(ASD)
step11_help  = 이브 웨폰(ASD)은 원할 때 발사할 수 있는 보조무기를 생성하는 스킬입니다. 스킬 사용 후 갑옷스킬(ASD)을 누르면 보조무기에서 레이저를 발사합니다.

step12_title = 이브 - 포트 어택 / 투구스킬(AD)
step12_help  = 포트 어택(AD)는 순간이동 후 적에게 레이저를 발사하는 스킬입니다. 방향키로 위치를 지정하고 A,S,D 중 하나를 누르면 순간이동하여 공격합니다.

step13_title = 이브 - 모든 전력을 너에게 맡기마 / 망토스킬(AS)
step13_help  = 모든 전력을 너에게 맡기마(AS)는 이동하며 상대방을 저격하는 스킬입니다. 스킬 사용 후 D누름유지 시 보조무기를 생성하고 D누름떼기 시 모두 발사합니다.

step14_title = 이브 - 국민콤보 ①
step14_help  = ★연속발사 → 대시 → 기본공격\n연속발사로 록온 필드를 생성한 후 텔레포트로 접근하여 기본공격으로 마무리 합니다.

step15_title = 이브 - 국민콤보 ②
step15_help  = ★기본공격 → 풀 버스트(SD)\n기본공격으로 서브웨폰을 5개 모은 후 풀 버스트로 마무리 합니다.


[Set231]

max_step = 21

step0_title  = 마그네틱 - 기본소개
step0_help   = 마그네틱은 무기를 바꿔가며 적에게 N, S극을 부여해 제압하는 레어 용병입니다.

step1_title  = 마그네틱 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 마그네틱 - 기본공격 캔슬 대시 (D → ->->)
step2_help   = 기본공격 중에 방향키를 빠르게 두 번 누르면 해당 방향으로 일정 거리를 이동합니다. 이때 무기가 S극이면 N극, N극이면 S극으로 변경됩니다.

step3_title  = 마그네틱 - 자기력 부여 (특수능력)
step3_help   = 기본공격, 대시공격, 점프공격으로 타격 시 적에게 자기력을 부여합니다. 무기가 S극이면 S극, N극이면 N극을 부여합니다.

step4_title  = 마그네틱 - 자기력 부여 (특수능력)
step4_help   = 자기력이 부여된 적을 기본공격, 대시공격, 점프공격으로 타격했을 때 같은 극이면 밀어내고 다른 극이면 끌어당깁니다.

step5_title  = 마그네틱 - 마그네틱 필드 (D 오래누름)
step5_help   = 공격키(D)를 오래 누르면 내 무기와 동일한 속성의 마그네틱 필드를 생성합니다. 마그네틱 필드와 같은 극인 적은 밀려나고, 다른 극인 적은 끌어당깁니다.

step6_title  = 마그네틱 - 마그네틱 필드 변경 (마그네틱 필드 → S)
step6_help   = 마그네틱 필드가 생성된 상태에서 방어키(S)를 누르면 마그네틱 필드 속성을 S극에서 N극, N극에서 S극으로 변경합니다.

step7_title  = 마그네틱 - 마그네틱 필드 해제 (마그네틱 필드 → D 오래누름)
step7_help   = 마그네틱 필드가 생성된 상태에서 공격키(D)를 오래 누르면 마그네틱 필드를 해제합니다.

step8_title  = 마그네틱 - 점프공격 (A → D → D → D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 3연타하는 점프 공격을 합니다.

step9_title  = 마그네틱 - 점프 대시 (A → ->->)
step9_help   = 점프키(A)를 누른 뒤 방향키를 빠르게 두 번 누르면 해당 방향으로 일정 거리를 이동합니다. 이때 무기가 S극이면 N극, N극이면 S극으로 변경됩니다.

step10_title = 마그네틱 - 점프 특별공격 (A → D 오래누름)
step10_help  = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 하강하면서 대상을 내려찍는 공격을 합니다.

step11_title = 마그네틱 - 대시공격 (->-> → D → D → D)
step11_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 3연타 공격할 수 있습니다.

step12_title = 마그네틱 - 대시공격 캔슬 대시 (D → ->->)
step12_help  = 대시공격 중에 방향키를 빠르게 두 번 누르면 해당 방향으로 일정 거리를 이동합니다. 이때 무기가 S극이면 N극, N극이면 S극으로 변경됩니다.

step13_title = 마그네틱 - 대시 특별공격 (->-> → D 오래누름)
step13_help  = 대시 상태에서 공격키(D)를 오래 누르면 전방으로 도약하면서 대상을 내려찍는 공격을 합니다.

step14_title = 마그네틱 - 튕겨내기 (공격 받는 순간 방어)
step14_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step15_title = 마그네틱 - 마그네틱 포스 / 무기스킬(SD)
step15_help  = 마그네틱 포스(SD)는 전자기장을 생성하고 비행하는 스킬입니다. A키로 상승, S키로 속성 변경을 할 수 있습니다. 같은 극은 밀어내고 다른 극은 끌어당깁니다.

step16_title = 마그네틱 - 마그네틱 필드 / 갑옷스킬(ASD)
step16_help  = 마그네틱 필드(ASD)는 자신과 적들에게 전자기장을 생성시켜, 몸을 자석처럼 바꾸는 스킬입니다. 같은 극은 밀어내고 다른 극은 끌어당깁니다.

step17_title = 마그네틱 - 인버스 필드 / 투구스킬(AD)
step17_help  = 인버스 필드(AD)는 전자기장을 다루어 범위 내 적들의 중력을 변화시키는 스킬입니다.

step18_title = 마그네틱 - 리버스 필드 / 망토스킬(AS)
step18_help  = 리버스 필드(AS)는 멀리있는 적은 당기고, 가까이 있는 적은 날리는 스킬입니다.

step19_title = 마그네틱 - 국민콤보 ①
step19_help  = ★대시공격(->-> → D → D → D)으로 띄운 후 → 점프공격(A → D + D + D) → 점프 대시(A →->->) → 점프공격(A → D + D + D)으로 마무리합니다.

step20_title = 마그네틱 - 국민콤보 ②
step20_help  = ★대시 특별공격(->-> → D 오래누름)으로 경직시키고 → 캔슬 대시(->->) → 대시공격(->-> → D → D → D)으로 당기고 띄워서 마무리합니다.


[Set505]
max_step = 16

step0_title  = R-사이버 메딕 - 기본소개
step0_help   = R-사이버 메딕은 커다란 주사기를 들고 전장을 누비면서 상처입은 팀원을 치료하는 고유 능력으로 팀원을 든든하게 지켜주는 마법 계열 용병입니다.

step1_title  = R-사이버 메딕 - 특성소개
step1_help   = R-사이버 메딕의 특수한 효과로는 기본 공격력이 10프로 증가되는 용병입니다. 또한, R시리즈의 용병을 다수 보유하면 기본 육성치가 증가됩니다.

step2_title  = R-사이버 메딕 - 기본공격 (D → D → D)
step2_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step3_title  = R-사이버 메딕 - 마법차징 (D 누름유지)
step3_help   = 공격키(D)를 누르고 있으면 무기 스킬의 게이지 회복 속도가 1.5배 증가하며, 주변 팀원에게 치료 마크가 자동으로 타겟팅되어 무기 스킬을 사용할 수 있습니다.

step4_title  = R-사이버 메딕 - 마취주사 (->->)
step4_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 주사기를 찔러 대상을 잠시 경직시키는 마취 주사를 사용할 수 있습니다.

step5_title  = R-사이버 메딕 - 마법방어 (S 누름)
step5_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든 방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step6_title  = R-사이버 메딕 - 점프공격 (A → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 지상으로 짧게 대쉬하며 상대를 공격하게 됩니다. 공중에서 지상의 적을 기습할 때 유용합니다.

step7_title  = R-사이버 메딕 - 이중점프 (A 두번 누름)
step7_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step8_title  = R-사이버 메딕 - 공중대시 (A → ->->)
step8_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 직선 이동을 하는 공중 대시가 발동됩니다.

step9_title  = R-사이버 메딕 - 힐링 / 무기스킬(SD)
step9_help   = 힐링(SD)은 HP와 SP를 회복시켜주는 스킬입니다. 바로 사용하면 자신을 치료하고, 공격키(D)를 누른 상태로 팀원을 타겟팅한 후 방어키(S)를 누르면 팀원을 치료합니다.

step10_title  = R-사이버 메딕 - 무중력 / 갑옷스킬(ASD)
step10_help   = 무중력(ASD)은 상대를 일정시간 공중에 띄우는 스킬입니다. 무중력 스킬은 넘어진 대상도 띄울 수 있으므로 다양한 추가 공격을 연결하기에 매우 유용합니다.

step11_title  = R-사이버 메딕 - 기소멸 / 투구스킬(AD)
step11_help   = 기소멸(AD)은 상대의 스킬 게이지를 모두 초기화시키는 스킬입니다. 상대팀의 스킬 게이지를 모두 초기화하여 전투에서 팀원이 유리하도록 만들어 줍니다.

step12_title  = R-사이버 메딕 - 저속비행 / 망토스킬(AS)
step12_help   = 저속비행(AS)은 부스터를 사용해서 비행하는 스킬입니다. 피격 중 사용 가능하며, 방향키로 전후좌우 이동과 점프키(A)를 누르면 고도를 상승시킬 수 있습니다.

step13_title = R-사이버 메딕 - 국민 콤보 ①
step13_help  = ★무중력(ASD) → 마취 주사 1회 넘어진 대상을 무중력으로 공중에 띄운 후에 마취 주사를 사용하여 드롭존으로 날려서 마무리합니다.

step14_title = R-사이버 메딕 - 국민 콤보 ②
step14_help  = ★마취주사 2회 → 기소멸(AD) → 마취주사 3회 마취 주사를 2회 연속으로 맞으면 천천히 넘어지게 되며 이 때, 기소멸로 다시 세운 후 마취주사 3회를 가합니다.

step15_title = R-사이버 메딕 - 국민 콤보 ③
step15_help  = ★마취주사 3회 → 무중력(ASD) → 기본 공격 마취주사 3회로 대상을 넘어뜨린 후 무중력으로 공중에 띄워서 기본 3연타 공격으로 마무리합니다.


[Set509]
max_step = 15

step0_title  = R-아이스 메이지 - 기본소개
step0_help   = R-아이스 메이지는 빙결을 일으키는 얼음 속성의 넓은 마법 공격으로 전장 전체를 쥐고 흔드는 광역 전문의 마법 계열 용병입니다.

step1_title  = R-아이스 메이지 - 특성소개
step1_help   = R-아이스메이지의 특수한 효과로는 기본 공격력이 10프로 증가되는 용병입니다. 또한, R시리즈의 용병을 다수 보유하면 기본 육성치가 증가됩니다.

step2_title  = R-아이스 메이지 - 기본공격 (D → D → D)
step2_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step3_title  = R-아이스 메이지 - 마법차징 (D 누름유지)
step3_help   = 공격키(D)를 누르고 있으면 무기 스킬의 게이지 회복 속도가 1.5배 증가하며, 소환된 마법진을 방향키로 조종하여 원하는 위치에 무기 스킬을 사용할 수 있습니다.

step4_title  = R-아이스 메이지 - 마법방어 (S 누름)
step4_help   = 방어키(S)를 누르면 마법을 사용하여 정면은 물론 모든 방향의 공격을 방어할 수 있습니다. 단, 일정 시간후 방어는 자동 해제되므로 방어키를 다시 누르셔야 합니다.

step5_title  = R-아이스 메이지 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대각선 아래로 얼음조각을 발사하는 공격을 합니다. 점프 공격은 지상의 대상을 공격할 때 유용합니다.

step6_title  = R-아이스 메이지 - 이중점프 (A 두번 누름)
step6_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step7_title  = R-아이스 메이지 - 회전타 (->->)
step7_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 지팡이를 내질러 대상을 높이 띄울 수 있는 회전타를 사용할 수 있습니다.

step8_title  = R-아이스 메이지 - 블리자드 / 무기스킬(SD)
step8_help   = 블리자드(SD)는 마법진 위치에 얼음을 떨어뜨리는 스킬 입니다. 블리자드는 방향키를 조정하여 마법진을 이동시킬 수 가 있어서 효율적으로 사용 할 수 있습니다.

step9_title  = R-아이스 메이지 - 냉기폭발 / 갑옷스킬(ASD)
step9_help   = 냉기폭발(ASD)은 냉기를 밖으로 폭발시키는 스킬입니다. 냉기 폭발을 사용하면 자기 주변의 다수에 대상을 한번에 멀리 날려 보내며 다운된 대상에게 사용할 수 있습니다.

step10_title  = R-아이스 메이지 - 아이스쉴드 / 투구스킬(AD)
step10_help   = 아이스실드(AD)는 피해 데미지를 감소시키는 스킬입니다. 아이스쉴드 사용 시 일정량의 데미지 피해를 스킬 게이지로 소모하며, 피격 시 공격자는 빙결상태가 됩니다.

step11_title  = R-아이스 메이지 - 얼음저항 / 망토스킬(AS)
step11_help   = 얼음저항(AS)은 얼음 공격의 피해를 막아 주는 스킬입니다. 스킬을 사용하면 자신은 물론 주변의 팀원들에게도 일정 시간 얼음 저항이 적용됩니다.

step12_title = R-아이스 메이지 - 국민콤보 ①
step12_help  = ★블리자드(SD) → 냉기폭발(ASD) 블리자드를 사용하여 대상을 빙결시켜서 행동 불가로 만든 후 냉기폭발로 깔끔하게 마무리합니다.

step13_title = R-아이스 메이지 - 국민콤보 ②
step13_help  = ★회전타 → 기본 공격 기습적인 지팡이 회전타로 대상을 공중에 띄운 후 기본공격으로 연타하여 마무리합니다.

step14_title = R-아이스 메이지 - 국민콤보 ③
step14_help  = ★회전타 → 블리자드(SD) → 냉기폭발(ASD) 지팡이 회전타로 띄워서 넘어뜨린 후 대상이 일어나기 전에 블리자드로 빙결시키고 냉기폭발로 마무리합니다.


[Set514]

max_step = 16

step0_title  = R-청룡 관우 - 기본소개
step0_help   = R-청룡 관우는 넓은 범위 공격이 가능한 언월도를 자유재로 사용하기 때문에 난전에서 다수를 상대할 때 최고의 활약을 보여주는 근거리 계열의 용병입니다.

step1_title  = R-청룡 관우 - 특성소개
step1_help   = R-청룡 관우의 특수한 효과로는 다른 용병들에 비해 드랍 시 피해를 25프로 덜 받는 용병입니다. 또한, R시리즈의 용병을 다수 보유하면 기본 육성치가 증가됩니다.

step2_title  = R-청룡 관우 - 기본공격 (D → D → D)
step2_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step3_title  = R-청룡 관우 - 휘두르기 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 휘두르기 공격이 발동됩니다. 휘두르기는 언월도를 크게 휘둘러 주변의 적들을 한번에 날려버리는 강력한 범위 공격을 합니다.

step4_title  = R-청룡 관우 - 점프공격 (A → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 사선으로 베는 점프 공격을 합니다. 점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step5_title  = R-청룡 관우 - 반달베기 (A → D 오래누름)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 일직선으로 내려치는 공격을 합니다. 반달베기에 피격된 대상은 경직상태가 되어 쓰러집니다.

step6_title  = R-청룡 관우 - 대시공격 (->-> → D + D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 누르면 상대를 베는 공격을 하며, 이후 D키를 눌러 추가공격이 가능합니다.

step7_title  = R-청룡 관우 - 올려치기 (->-> → D 오래누름)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 오래 누르면 대상을 띄워 올리는 대시 공격이 가능합니다.

step8_title  = R-청룡 관우 - 튕겨내기 (공격 받는 순간 방어)
step8_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step9_title  = R-청룡 관우 - 무쌍난무 / 무기스킬(SD)
step9_help   = 무쌍난무(SD)는 언월도를 연속으로 두 번 크게 휘두르는 스킬입니다. 스킬 사용 중 스킬키(SD)를 이용해 캔슬을 할 수 있으며 공중과 다운상태에서도 사용이 가능합니다.

step10_title  = R-청룡 관우 - 천지역전 / 갑옷스킬(ASD)
step10_help   = 천지역전(ASD)은 땅을 내리쳐 주변의 상대팀원을 띄우는 스킬입니다. 범위형 공격으로 다수의 대상을 높게 띄워 낙하데미지를 주는 강력한 스킬입니다.

step11_title  = R-청룡 관우 - 장풍 / 투구스킬(AD)
step11_help   = 장풍(AD)은 내공의 힘을 모아 상대를 기절시키는 스킬입니다. 다운 대상도 타격이 가능하며 대상을 기절 시킨 후 멀리 밀쳐내기 때문에 추가 공격에도 매우 유용합니다.

step12_title  = R-청룡 관우 - 비급연마 / 망토스킬(AS)
step12_help   = 비급연마(AS)는 비급을 사용하여 무기, 갑옷, 투구 스킬의 게이지를 모두 채워주는 스킬입니다. 3개 스킬을 한번더 사용하여 전투에 우세를 유지할 수 있습니다.

step13_title = R-청룡 관우 - 국민콤보 ①
step13_help  = ★장풍(AD) → 올려치기(->-> → D 오래) → 기본공격 장풍을 사용하여 상대를 기절 상태로 멀리 밀쳐내고 올려치기로 대상을 띄워 기본 공격으로 마무리 합니다.

step14_title = R-청룡 관우 - 국민콤보 ②
step14_help  = ★천지역전(ASD) → 장풍(AD) 넘어진 상대를 천지역전으로 공중에 띄운 후 떨어지는 타이밍에 장풍으로 맞추어 멀리 날려 버립니다.

step15_title = R-청룡 관우 - 국민콤보 ③
step15_help  = ★천지역전(ASD) → 휘두르기 넘어진 상대를 천지역전으로 공중에 띄운 후 떨어지는 타이밍에 휘두르기로 맞추어 마무리합니다.


[Set807]
max_step = 15

step0_title  = 소원 - 기본소개
step0_help   = 소원는 장전이 필요 없는 활에서 끊임없이 발사되는 화살로 전장 곳곳을 누비고 다니는 게릴라 전문의 원거리 계열 프리미엄 용병입니다.

step1_title  = 소원 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 소원 - 조준 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면 조준할 수 있는 상태가 되며 사정거리 내 대상을 자동으로 조준해줍니다. 조준된 상태에서 공격키를 떼면 대상에게 화살을 발사합니다.

step3_title  = 소원 - 정조준 (조준 유지)
step3_help   = 대상을 조준 후 일정시간 유지하면 정조준이 됩니다. 정조준시 화살을 2발 연사하며 화살 속도 및 공격력이 증가되어 화살에 맞은 대상은 날아가 넘어지게 됩니다.

step4_title  = 소원 - 조준이동 (D 누름유지하고 방향키)
step4_help   = 공격키(D)를 누르고 있으면서 방향키를 추가로 누르면 대상을 조준 및 정조준한 상태로 상, 하, 좌, 우로 이동 할 수 있으며 이 때 공격키를 떼면 화살이 발사됩니다.

step5_title  = 소원 - 점프사격 (A → D)
step5_help   = 점프를 한 후 공격키(D)를 누르면 점프 사격이 됩니다. 점프 사격 역시 공격키를 오래 누르면 사정거리 내 대상을 조준하여 사격할 수 있으나 정조준은 되지 않습니다.

step6_title  = 소원 - 하이점프 (A 오래누름)
step6_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다. 하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어 높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step7_title  = 소원 - 반격 (방어 성공시 바로 공격)
step7_help   = 공격 방어 후 바로 공격을 하면 반격이 발동합니다. 소원는 대상을 빠르게 지나가 대상의 뒤로 이동한 후 대상에게 화살를 발사하는 공격을 합니다.

step8_title  = 소원 - 구르기 (->->)
step8_help   = 방향키를 사용한 달리기가 불가능한 대신에 방향키를 빠르게 두 번 누르면 그 방향으로 일정 거리를 굴러서 이동 및 공격을 회피하는 구르기를 사용할 수 있습니다.

step9_title  = 소원 - 멀티샷 / 무기스킬(SD)
step9_help   = 멀티샷(SD)은 7방향으로 화살을 발사하는 스킬입니다. 조준된 상태에서 공격키(D)를 유지하고 방어키(S)를 누르면 조준된 대상에게 화살을 발사합니다.

step10_title  = 소원 - 공중제비 / 갑옷스킬(ASD)
step10_help   = 공중제비(ASD)는 이중 점프를 할 수 있게 하는 패시브 스킬입니다. 공중제비 이후 점프사격이 가능하며 전장을 넓게 이동하면서 플레이를 이끌어 나갈 수 있습니다.

step11_title = 소원 - 반달차기 / 투구스킬(AD)
step11_help  = 반달차기(AD)는 상대를 높이 차올리는 스킬입니다. 상대를 공중으로 높이 띄워 올리기 때문에 다양한 추가 공격을 손쉽게 연결할 수 있습니다.

step12_title = 소원 - 화살투척 / 망토스킬(AS)
step12_help  = 화살투척(AS)은 9개의 화살을 꺼내 던지는 스킬입니다. 투척된 9개의 화살은 날아가면서 넓게 퍼지기 때문에 넓은 지역을 동시 타격하기에 용이합니다.

step13_title = 소원 - 국민콤보 ①
step13_help  = ★반달차기(AD) → 점프사격 반달차기로 대상을 높이 띄운 후 점프하여 떨어지는 타이밍에 맞춰서 화살을 발사하여 명중시킵니다.

step14_title = 소원 - 국민콤보 ②
step14_help  = ★반달차기(AD) → 화살투척(AS) → 화살발사 반달차기로 대상을 높이 띄운 후 살짝 쉬었다가 화살 투척을 사용하여 연타하고 마무리 화살로 명중시킵니다.


[Set885]

max_step = 17

step0_title  = 유주 - 기본소개
step0_help   = 유주는 빔라이플을 무기로 사용하며, 비행능력을 이동해 기동 사격으로 대상을 공략하는 원거리 계열 프리미엄 용병 입니다.

step1_title  = 유주 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 유주 - 비행 (D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 비행 상태로 전환이 됩니다. 비행은 무기아이콘 상단의 비행게이지가 노란색일 때만 비행이 사용되며, 게이지가 소모됩니다.

step3_title  = 유주 - 비행 사용방법 ①
step3_help   = 대기, 걷기, 점프 중 공격키(D)를 오래 누르고 있으면 비행 상태가 됩니다. 점프 중이나, 고도가 상승된 상태에서 비행 종료 시 점프상태로 전환됩니다.

step4_title  = 유주 - 비행 사용방법 ②
step4_help   = 비행 게이지는 걷기나 대기상태에서 충전되며, 비행 중 방향키를 입력시 바라보는 방향을 유지한 상태로 대시 이동을 합니다. A키 입력 시 점프상태로 전환합니다.

step5_title  = 유주 - 비행 사용방법 ③
step5_help   = 비행 중 이동 시 전방을 방어하면서 이동합니다. 대신 대상의 공격을 방어하면 일정량의 비행 게이지가 소모 됩니다.

step6_title  = 유주 - 비행 사용방법 ④
step6_help   = 비행 중 공격키(D)를 누르면 조준점이 있는 곳으로 레이져를 발사합니다. 조준은 대상이 일정범위 안에 접근 시 자동조준이 됩니다.

step7_title  = 유주 - 비행 사용방법 ⑤
step7_help   = 비행 중 공격키(D)를 누른 체 유지하면, 특별공격으로 전환됩니다. 방향키를 입력으로 이동이 가능하며, D키를 떼면 조준점이 있는 곳으로 강력한 레이져를 발사합니다.

step8_title  = 유주 - 대시공격 (->-> → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 올려치는 공격을 한 후 자신도 점프상태가 됩니다.

step9_title  = 유주 - 점프공격(A →D)
step9_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대각선 아래로 레이저를 발사해 공격합니다. 이후 한번 더 공격키(D)눌러 추가공격을 할 수 있습니다.

step10_title  = 유주 - 건 블레이징 / 무기스킬(SD)
step10_help   = 건 블레이징(SD)은 가장 가까이 있는 적을 타겟으로 잡은 후 D키 연타로 대상을 공격하는 스킬입니다. A키 또는 S키로 대상을 변경할 수 있습니다.

step11_title  = 유주 - 울티메이트 빔 / 갑옷스킬(ASD)
step11_help   = 울티메이트 빔(ASD)은 전방에 차원을 생성하여 빔을 연속으로 발사하는 스킬입니다. 맞은 대상은 경직상태가 되어 추가 공격을 하기에 용이합니다.

step12_title  = 유주 - 판넬 / 투구스킬(AD)
step12_help   = 판넬(AD)은 자신 주변에 판넬들을 소환하여 대상을 공격하는 스킬입니다. 판넬은 넘어진 대상도 공격을 할 수 있습니다.

step13_title  = 유주 - 일루젼 애로우 / 망토스킬(AS)
step13_help   = 일루젼 애로우(AS)는 공중 상승 후 방향키로 마법진을 움직여에 지정위치에 일루젼 애로우를 발사하는 스킬입니다 D키로 발사하고 점프 중 사용가능합니다.

step14_title = 유주 - 국민콤보 ①
step14_help  = ★울티메이트 빔(ASD) →건 블레이징(SD) 울티메이트 빔(ASD)으로 공격한 후 건 블레이징(SD)로 마무리합니다.

step15_title = 유주 - 국민콤보 ②
step15_help  = ★대시공격 (->-> → D) → 비행 중 사격(D 오래누름 후 D) 대시공격으로 대상을 띄운 후 비행상태로 전환 하여 D키를 연타하여 대상을 공격합니다.

step16_title = 유주 - 국민콤보 ③
step16_help  = ★울티메이트 빔(ASD)으로 대상을 경직 시킨 후 비행(D 오래누름)하여 D오래누름으로 대상을 날려 버린다음 바로 일루젼 애로우(AS)로 마무리합니다.


[Set902]

max_step = 17

step0_title  = 신비 - 기본소개
step0_help   = 신비는 트리실베니아의 귀족출신으로 박쥐로 변신해 유리한 위치로 이동하여 공중 콤보와 흡혈 능력으로 상대를 제압하는 프리미엄 용병 입니다.

step1_title  = 신비 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 신비 - 박쥐 변신 (D 오래누름)
step2_help   = 공격키(D)를 일정시간 누르면, 게이지를 소모하여 박쥐로 변신해 이동(방향키,상승A,하강S)하며 일정시간이 지나거나 공격키(D)를 누르면 변신상태가 해제 됩니다.

step3_title  = 신비 - 반격 (방어 성공시 바로 공격)
step3_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 반격 성공시 상대의 체력을 뺏어오는 물기 공격을 하며 연타 약공격을 반격하면 실패할 확률이 높습니다.

step4_title  = 신비 - 대시공격 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 잠시 경직시키는 공격을 합니다.

step5_title  = 신비 - 대시 확장공격 (->-> D →D )
step5_help   = 방향키를 빠르게 두 번 누르고 유지해서 달리기가 발동되는 도중에 공격키(D)를 두번 누르면 대상을 공중에 띄우는 강력한 공격을 합니다.

step6_title  = 신비 - 대시 중 박쥐 변신(->-> →D 오래누름)
step6_help   = 대시 상태에서 공격키(D)를 오래 누르면 박쥐로 변신하여 이동합니다. 박쥐 상태 해제 시 점프 상태가 되어, 게이지가 있을 시 재사용이 가능합니다.

step7_title  = 신비 - 점프공격(A →D 연타)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 검으로 대상을 공격을 합니다. 최대 4타 공격 가능하며, 4타에서 강하게 내려찍는 공격을 합니다.

step8_title  = 신비 - 점프 중 박쥐 변신(A →D 오래누름)
step8_help   = 점프 상태에서 공격키(D)를 오래 누르면 박쥐로 변신하여 이동합니다. 박쥐 상태 해제 시 점프 상태가 되어, 게이지가 있을 시 재사용이 가능합니다.

step9_title  = 신비 - 이중점프 (A 두번 누름)
step9_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step10_title  = 신비 - 노스페라투(SD)
step10_help   = 노스페라투(SD)는 전방에 붉은 회오리를 소환하여 상대를 띄우고, 매회 공격마다 상대의 체력을 뺏는 흡혈 공격을 합니다. 공중도 사용이 가능합니다.

step11_title  = 신비 - 안개화(ASD)
step11_help   = 안개화(ASD)는 신비가 타격에 맞지 않는 안개로 변신하여 이동하며 공격키(D)를 누르면 주변대상에게 순간 이동해 공격을 하며 변신상태가 해제 됩니다.

step12_title = 신비 - 흡혈(AD)
step12_help  = 흡혈(AD)은 사용시 잠시 무적이 되며 주변대상을 땡겨와 상대의 체력을 뺏는 흡혈 공격을 합니다. 주변에 성공한 상대가 많을수록 뺏는 체력도 증가합니다.

step13_title = 신비 - 라이징 로즈(AS)
step13_help  = 라이징(AS)는 장미 넝쿨을 소환하여 상대를 붙잡은 뒤 바닥으로 내려찍어 대상을 바운딩 시키는 공격을 합니다. 공중도 가능하며 넘어진 대상도 공격이 가능합니다.

step14_title = 신비 - 국민콤보 ①
step14_help  = ★ 대시 확장공격 (->-> D →D ) → 대상을 띄운 뒤에 점프공격 (A →D 연타) 으로 4타로 상대를 바닥 내려친 뒤 노스페라투(SD)로 공격을 마무리 합니다.

step15_title = 신비 - 국민콤보 ②
step15_help  = ★ 라이징 로즈(AS)→노스페라투(SD)→점프공격(A→D) 라이징 로즈(AS) 대상을 3번 바운딩 시킨 뒤 노스페라투 대상을 띄우고 점프공격으로 마무리 합니다.

step16_title = 신비 - 국민콤보 ③
step16_help  = ★ 대시 확장공격으로 대상을 띄운 뒤에 점프공격(A →D 연타)를 3타까지 때리고 박쥐 변신을 한 뒤 다시 점프공격을 때리고, 노스페라투(SD)로 마무리 합니다.


[Set920]

max_step = 16

step0_title  = 예린 - 기본소개
step0_help   = 예린은 쾌검과 발도를 쓰는 장님 무사로 눈에 보이지 않는 속도의 쾌검술로 상대를 베거나 공간을 장악하는 근거리 계열 프리미엄 용병입니다.

step1_title  = 예린 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 예린 - 검 회수 (공격중 →→)
step2_help   = 기본공격과 대시공격에서 -> -> 대시키를 입력하면 공격을 회수하는 회피 기술을 사용하게 됩니다. 상대가 공격을 회피하거나 방어시 사용 할 수 있습니다.

step3_title  = 예린 - 공의영역 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 예린을 중심으로 영역이 펼쳐질때 눌렀던 공격키(D)를 떼면 타게팅된 상대에게 광속으로 접근해서 베는 공격을 합니다.

step4_title  = 예린 - 대시공격1 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상에게 빠르게 접근하여 베는 대시 공격이 가능합니다.

step5_title  = 예린 - 대시공격2 (->-> D + D)
step5_help   = 대시공격1 중에 공격키(D)를 입력하면 대상을 하단을 베어 공격하여 공중에 띄우는 공격을 합니다. 대상이 공중에 띄워지기 때문에 다음 공격을 할 때 유용합니다.

step6_title  = 예린 - 대시공격 특별 (->-> D 오래누름)
step6_help   = 대시달리기 중에 공격키(D)를 오래누름 입력하면 회전하며 대상을 베어 밀어버리는 공격을 합니다. 밀린 대상은 다음 공격을 할 때 유용합니다.

step7_title  = 예린 - 점프공격(A →D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 회전시켜 땅으로 떨어트리는 점프공격이 가능합니다.

step8_title  = 예린 - 이중점프 (A 두번 누름)
step8_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step9_title  = 예린 - 닫쳐버린 눈(SD)
step9_help   = 닫쳐버린 눈(SD)은 예린을 중심으로 영역안에 적을 빠른 속도의 연속 베기를 하며 마지막에 무릎꿇기 공격을 발동시켜 다음 공격을 하기에 유용합니다.

step10_title  = 예린 - 꿰뚫는 맥(ASD)
step10_help   = 꿰뚫는 맥(ASD)은 예린이 예민한 상태가 되어 살기를 발동시켜 주변에 공중의 적들을 바닥으로 내려찍는 공격과 지상의 적들에게 살기로 피해를 줍니다.

step11_title  = 예린 - 감싸는 검막(AD)
step11_help   = 감싸는 검막(AD)은 예린이 검막을 둘러 원거리 공격을 방어합니다. 단! 관통형 원거리 공격을 방어하지 못하고 유지시간이 길지만 넘어지면 스킬이 취소됩니다.

step12_title  = 예린 - 지르밟는 대지(AS)
step12_help   = 지르밟는 대지(AS)는 예린이 땅을 진각으로 밟아 기를 넣어 진동시켜 주변에 대상을 경직시키며 높이 띄우는 기술입니다. 누워있는 대상에게 사용 가능합니다.

step13_title  = 예린 - 국민콤보 ①
step13_help   = ★공의영역 (D 오래누름)으로 대상을 띄운 후 → 기본공격을 사용합니다. 연계 중 대상을 놓쳤을 경우 3타에서 다시 띄워 마무리 합니다.

step14_title  = 예린 - 국민콤보 ②
step14_help   = ★닫쳐버린 눈(SD) 사용 후 상대가 경직이 되면 → 기본공격을 사용합니다. 경직 대상은 1타 이 후 2타는 맞지 않지만 3타에서 다시 띄워 마무리 합니다.

step15_title  = 예린 - 국민콤보 ③
step15_help   = ★지르밟는 대지(AS) 사용으로 상대를 경직시킨 뒤 → 공의영역(D 오래누름)으로 상대를 공격 후 기본공격을 사용해서 마무리 합니다.


[Set926]

max_step = 20

step0_title  = 엄지 - 기본소개
step0_help   = 엄지는 무술의 달인으로 절권도와 드래곤 플라잉킥을 사용하여 빠르게 접근하여 상대를 난타해 제압하는 프리미엄 용병입니다.

step1_title  = 엄지 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 엄지 - 준비자세(D 오래누름)
step2_help   = 공격키(D)를 누르고 있으면 제자리에서 몸을 풀어 준비자세를 취하게 됩니다. 게이지를 소모하며 이 후에 추가 공격이 가능합니다.

step3_title  = 엄지 - 준비자세→드래곤 플라잉킥 (준비자세→D)
step3_help   = 준비 자세에서 추가로 공격키(D)를 입력시 게이지 소모 없이 바로 전방으로 드래곤 플라잉킥을 사용합니다. 이 후 기본공격으로 연계가 가능합니다.

step4_title  = 엄지 - 준비자세→대지 밟기 (준비자세→A)
step4_help   = 준비 자세에서 추가로 점프키(A)를 입력시 게이지를 소모하여 전방으로 대지 밟기를 사용합니다. 방어파괴 공격으로 상대를 띄워 추가 공격이 가능합니다.

step5_title  = 엄지 - 대시공격 (->-> → D + D + D + D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 발로 공격합니다. 최대 4회 타격이 가능합니다.

step6_title  = 엄지 - 달리기 중 드래곤 플라잉킥 (달리기 중→D오래누름)
step6_help   = 빠른 달리기가 발동된 후 D오래누름 시 바로 전방으로 드래곤 플라잉킥을 사용합니다.이 후 대시공격으로 연계가 가능합니다.

step7_title  = 엄지 - 점프공격 - (A →D + D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발로 공격합니다. 이때 추가로 D키를 눌러 추가공격할 수 있습니다. 최대 2연타가 가능합니다.

step8_title  = 엄지 - 공중 드래곤 플라잉킥 (공중→D오래누름)
step8_help   = 엄지는 공중 상태에서 공격키(D)를 오래누르면 바로 전방으로 드래곤 플라잉킥을 사용합니다. 공격이 끝나면 점프 상태로 전환되어 추가 공격이 가능합니다.

step9_title  = 엄지 - 공중대시(점프 중 ->->)
step9_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 이동하면서 발로 내려찍는 공격을 합니다. 이 후 공격키(D)키 입력시 추가 공격이 가능합니다.

step10_title  = 엄지 - 튕겨내기 (공격 받는 순간 방어)
step10_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step11_title  = 엄지 - 튕겨내기→촌경 (튕겨내기 → D)
step11_help   = 엄지는 튕겨내기 이 후 상태에서 빠르게 접근하여 촌경공격을 합니다. 공격에 당한 대상은 강경직 상태가 되어 추가 공격이 가능합니다.

step12_title  = 엄지 - 캔슬 사용방법
step12_help   = 엄지의 드래곤 플라잉킥은 날아가는 도중 지상, 공중 어디서든 공격키(D)로 캔슬이 가능합니다. 캔슬시 자신의 상태에 맞는 공격이 나오며 캔슬됩니다.
               
step13_title  = 엄지 - 전설의 발차기 / 무기스킬(SD)
step13_help   = 전설의 발차기(SD)는 전방의 대상을 기합으로 끌어모아 정신없게 만든 뒤 공격키(D)를 입력시 멀리 밀어내는 옆차기 공격을 하게 됩니다.

step14_title = 엄지 - 무술 / 갑옷스킬(ASD)
step14_help  = 무술(ASD)은 어떤 상황이든 공격을 할수 있는 스킬입니다. 지상, 점프, 다운 별로 각각 다른 공격이 나가서 상대를 혼란시키는데 용이합니다.

step15_title = 엄지 - 무술의 달인 / 투구스킬(AD)
step15_help  = 무술의달인(AD)은 상황에 맞는 효과가 발동되는 스킬입니다. 게이지가 차있을 때 상대 공격시 방어파괴 공격, 넘어졌을 때 점프, 공중 3단점프가 가능합니다.

step16_title = 엄지 - 전설의 반격 / 망토스킬(AS)
step16_help  = 전설의 반격(AS)은 어떤 상황에서든 반격공격을 할수 있는 스킬입니다. 방어자세 중 상대의 공격을 받으면 자동으로 상대를 높이 날려버리는 공격을 합니다.

step17_title = 엄지 - 국민콤보 ①
step17_help  = ★무술(ASD) → 전설의 발차기 (SD)\n무술(ASD)로 대상을 공격 후 전설의 발차기(SD)로 상대를 끌어당겨와 발차기로 마무리합니다.

step18_title = 엄지 - 국민콤보 ②
step18_help  = ★전설의 발차기(SD) → 대시공격(->-> → D+D+D+D)\n전설의 발차기(SD)로 상대를 경직 시킨뒤 대시공격 4타로 마무리 합니다.

step19_title = 엄지 - 국민콤보 ③
step19_help  = ★전설의 발차기(SD)으로 상대를 경직시킨뒤 → 대시공격을 3타까지 띄워 점프 후 점프공격(A →D + D) 후 드래곤 플라잉킥(D오래누름)으로 마무리 합니다.



[Set938]
max_step = 19

step0_title  = 은하 - 기본소개
step0_help   = 은하는 부스터로 상대에게 고속이동해 연타후 넉백시켜 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 은하 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다.\n특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기\n를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 은하 - 고속이동공격1 (D 오래누름 → ->->)
step2_help   = 공격키(D)를 오래 누르면 전방으로 빠르게 고속이동하여 상대를 밀어내는 공격을 합니다. 이후 대시키를 입력하면 해당 방향으로 고속이동 하며 게이지를 10 소모합니다.

step3_title  = 은하 - 고속이동공격2
step3_help   = 고속이동공격1(D 오래누름 → ->->)로 상대를 밀어내고, D키를 입력하면 추가 공격이 발생합니다. 3타 공격 이후 다시 고속이동공격1(D 오래누름 → ->->)이 가능합니다.

step4_title  = 은하 - 대시공격1 (->-> → D → D )
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 무릎꿇기 상태로 만드는 공격이 가능합니다.

step5_title  = 은하 - 대시공격2 (->-> → D오래누름)
step5_help   = 빠른 달리기가 발동된 후 D오래누름 시 전방으로 조준점이 나타나고 D키를 떼면 조준된 상대 혹은 전방으로 검기를 발사합니다. 검기에 피격된 캐릭터는 띄움 상태가 됩니다.

step6_title  = 은하 - 세이버 부스터 (A키 오래누름)
step6_help   = 점프키(A)를 오래 누르고 있으면 부스터 상태로 전환이 됩니다. 방향키를 입력시 바라보는 방향을 유지한 상태로 대시 이동을 합니다. 또한 A키는 상승, S키는 하강을 합니다.

step7_title  = 은하 - 세이버 부스터 사용방법 ①
step7_help   = 대기, 걷기, 대시, 점프, 공중 중 점프키(A)를 오래 누르고 있으면 부스터 상태가 됩니다. 점프 중이나, 고도가 상승된 상태에서 부스터 종료 시 점프상태로 전환됩니다.

step8_title  = 은하 - 세이버 부스터 사용방법 ②
step8_help   = 부스터 중 공격키(D)를 누르면 조준점이 있는 곳으로 빠르게 이동 후 대상을 공중에 띄우는 공격을 합니다. D키 입력시 추가 공격이 가능합니다.

step9_title  = 은하 - 세이버 부스터 사용방법 ③
step9_help   = 부스터 중 공격키(D)를 오래 누르면 전방으로 상대를 넉백시키고 대시이동 후 추가 공격을 하는 고속이동공격 사용이 가능하고 게이지를 소모합니다.

step10_title  = 은하 - 점프공격1 (A →D + D + D)
step10_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 공중공격을 합니다. 3연속 타격을 할 수 있고 대상을 바닥에 내려찍습니다.

step11_title  = 은하 - 점프공격2 (A →D오래누름)
step11_help   = 은하는 공중에서 공격키(D)를 오래 누르면 전방으로 상대를 넉백시키는 고속이동공격을 할 수 있으며, 게이지를 10 소모합니다.

step12_title = 은하 - 라이트닝 스피드 / 무기스킬(SD)
step12_help  = 라이트닝 스피드(SD)는 상대를 포박하고, 순간이동 하여 공격하는 스킬입니다. D키를 입력하면 상대에게 검기를 날려 포박하고, D키를 입력하면 순간이동 공격합니다.

step13_title = 은하 - 하이퍼 부스터 / 갑옷스킬(ASD)
step13_help  = 하이퍼 부스터(ASD)는 세이버 부스터로 고속 이동하며 충돌된 상대를 띄우는 스킬입니다. A키를 누르면 고도가 상승하며 서서히 하강이 됩니다.

step14_title = 은하 - 레이저 헤드 / 투구스킬(AD)
step14_help  = 레이저 헤드(AD)는 투구에서 전방으로 레이저 빔을 발사하는 스킬입니다. 조준선을 방향키로 회전하며, 점프(A)/방어(S)키로 각도 조절이 가능합니다.

step15_title = 은하 - 버크샷 미사일 / 망토스킬(AS)
step15_help  = 버크샷 미사일(AS)은 전방으로 작은 탄환이 퍼져 터지는 미사일을 발사하는 스킬입니다. 공중 사용이 가능하고 누워있는 대상 공격이 가능합니다.

step16_title = 은하 - 국민콤보 ①
step16_help  = ★고속이동공격2 (D 오래누름 → ->->)으로 상대를 밀어내고, 고속이동하여 추가 공격으로 상대를 공격하고 레이저 헤드(AD)로 상대를 마무리 합니다.

step17_title = 은하 - 국민콤보 ②
step17_help  = ★세이버 부스터(A키 오래누름)후 D키 입력으로 상대를 연타 공격한 후 → 누워있는 상대에게 라이트닝 스피드(SD)로 누워있는 상대를 공격하여 마무리 합니다.

step18_title = 은하 - 국민콤보 ③
step18_help  = ★세이버 부스터(A키 오래누름)로 상대에게 접근하여 공격키를 입력하여 상대를 연타한 후, 바운딩 된 상대에게 D오래누름으로 고속이동하여 D키 연타로 마무리 합니다.

