step10_title  = 웨어울프 - 변신 중 대시공격2 (->-> D 오래누름)
step10_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 공격키(D)를 오래 누르면 대상을 공중에 띄우는 공격을 합니다.

step11_title  = 웨어울프 - 변신 중 점프공격(A →D)
step11_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 대상을 할퀴는 점프 공격이 가능하며 공격 성공시 다시 점프가 되어 점프 공격을 다시 할 수 있습니다.

step12_title  = 웨어울프 - 변신 중 공중대시 (A → ->->)
step12_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 해당 방향의 지상으로 빠르게 이동하면서 대상을 공격 합니다.

step13_title  = 웨어울프 - 기사의 검술(SD)
step13_help   = 기사의 검술(SD)은 검으로 상대를 베는 스킬입니다. 스킬 사용 중 공격키(D)를 누르면 검 손잡이로 상대를 내려찍고, 방어키(S)를 누르면 찌르기 공격을 합니다.

step14_title  = 웨어울프 - 브레이크 크루(변신 중 SD)
step14_help   = 브레이크 크루(SD)는 발톱으로 상대를 전진하며 공격하는 스킬입니다. 총 6번 전진공격을 하고, 스킬 사용 중 방어키(S)를 누르면 포효를 하는 범위 공격을 합니다.

step15_title = 웨어울프 - 울프의 기운(ASD)
step15_help  = 울프의 기운(ASD)은 울프의 기운을 분출하여 자기주변의 대상들을 도망가게 하는 스킬입니다. 스킬을 사용하면 울프 게이지를 모두 충전 시켜 줍니다.

step16_title = 웨어울프 - 전의 상실(AD)
step16_help  = 전의 상실(AD)은 앞으로 달려 가면서 상대를 연타하는 스킬입니다. 스킬 사용 중 방향키를 입력하여 방향을 변경 하면서 공격을 할 수 있습니다.

step17_title = 웨어울프 - 기사의 축복(AS)
step17_help  = 기사의 축복(AS)는 잠시동안 자신과 주변 팀원들에게 일반 공격의 피해를 받지않게 해주는 스킬입니다. 강한 공격과 스킬공격에는 효과가 없습니다.

step18_title = 웨어울프 - 국민콤보 ①
step18_help  = ★띄우기(D누름떼기)→기사의 검술(SD) 띄우기(D누름떼기)로 상대를 띄운 후 기사의검술(SD)을 사용하여 D키를 입력해 공격 후 마무리합니다.

step19_title = 웨어울프 - 국민콤보 ②
step19_help  = ★대시공격(->-> D)→전의 상실(AD) 대시공격으로 상대를 경직시킨 후 전의상실(AD)으로 마무리합니다.

step20_title = 웨어울프 - 국민콤보 ③
step20_help  = ★웨어울프 변신상태에서 대시공격2(->-> D 오래누름)→ 점프공격(A →D, D)→공중대시 (A → ->->)


