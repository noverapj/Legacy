max_step = 23

step0_title  = 레이첼 - 기본소개
step0_help   = 레이첼은 블레이 블루에 등장하는 캐릭터로 다양한 사역마와 로벨리아를 이용한 전기공격으로 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 레이첼 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 레이첼 - 로벨리아 (D 누름떼기)
step2_help   = 공격키(D)를 살짝 눌렀다 떼면 로벨리아를 발사해 대상을 맞추거나, 지면에 설치할 수 있습니다. 로벨리아는 최대 3개까지 동시 설치가 가능합니다.

step3_title  = 레이첼 - 로벨리아 발동 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 지면에 설치되어 있는 모든 로벨리아에서 전기가 발동되어 대상을 공격합니다. 공격당한 대상은 띄움상태가 됩니다.

step4_title  = 레이첼 - 대시공격 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 살짝 뜬 상태로 이동합니다. 공격키(D)를 누르면 회전 연타공격을 하여, 대상을 공격합니다.

step5_title  = 레이첼 - 대시공격 확장 (->-> D, D 또는 A)
step5_help   = 대시공격 후 바로 공격키(D)를 누르면 전기의자 공격을 하고, 점프키(A)를 누르면 점프로 전환하여 점프 공격을 할 수 있습니다.

step6_title  = 레이첼 - 점프공격(A →D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 연타하면 대상을 3번 연타하는 점프공격이 가능합니다.

step7_title  = 레이첼 - 점프 중 로벨리아 발사(A →D 누름떼기)
step7_help   = 점프상태에서 D키를 살짝 눌렀다 떼면 로벨리아를 발사해 대상을 맞추거나, 지면에 설치할 수 있습니다. 로벨리아는 최대 3개까지 동시 설치가 가능합니다.

step8_title  = 레이첼 - 점프 중 로벨리아 발동(A →D 오래누름)
step8_help   = 점프상태에서 D키를 오래누르면 지면에 설치되어 있는 모든 로벨리아에서 전기가 발동되어 대상을 공격합니다. 공격당한 대상은 띄움 상태가 됩니다.

step9_title  = 레이첼 - 이중점프 (A 두번 누름)
step9_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step10_title  = 레이첼 - 이중점프공격(A 두번 누름 →D)
step10_help   = 이중점프 중 공격키(D)를 누르면 수직으로 하강하면서 대상을 내려찍는 공격을 합니다. 넘어진 대상도 공격이 가능합니다.

step11_title  = 레이첼 - 공중대시 (A → ->->)
step11_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 캐릭터가 보는 방향을 유지하면서 입력된 방향으로 빠르게 이동합니다.

step12_title  = 레이첼 - 실피드(S)
step12_help   = 대시공격/점프/이중점프/점프대시 중 방어키(S)를 누르면 특정 기능의 능력을 변화시키는 실피드 효과가 발동됩니다 소모된 실피드는 대기나 걷기상태에서 자동충전됩니다.

step13_title  = 레이첼 - 대시공격 중 실피드 (->-> D 중에 S)
step13_help   = 대시공격 중 방어키(S)를 누르면 빠르게 이동하는 실피드 효과가 발동됩니다. 실피드 게이지 수만큼 연속으로 사용 할 수 있습니다.

step14_title  = 레이첼 - 점프/이중점프 중 실피드(A / A두번누름 중 S)
step14_help   = 점프/이중점프 시 점프상승 중에 S키를 누르면 점프력과 이동속도가 일시적으로 증가되고, 하강 중에 s키를 누르면, 이동속도과 증가되고 천천히 아래로 내려갑니다.

step15_title  = 레이첼 - 공중대시 중 실피드 (A → ->->  중에 S)
step15_help   = 공중대시 중 방어키(S)를 누르면 빠르게 이동하는 실피드 효과가 발동됩니다. 실피드 게이지 수만큼 연속으로 사용 할 수 있습니다.

step16_title  = 레이첼 - 임피시-집소필라(SD)
step16_help   = 임피시-집소필라(SD)는 소환된 호박을 조종해 공격하는 스킬입니다. S키를 눌러 실피드를 사용하면 호박의 이동 속도가 빨라집니다.

step17_title  = 레이첼 - 바덴-바덴 릴리(ASD)
step17_help   = 바덴-바덴 릴리(ASD)는 자신 주변에 전기공격을 하는 스킬입니다. 점프 및 피격 중 사용가능하며, 설치된 모든 로벨리아를 발동시킵니다.

step18_title  = 레이첼 - 게오르그 13세(AD)
step18_help   = 게오르그 13세(AD)는 소환된 개구리를 조종해 공격하는 스킬입니다. S키를 눌러 실피드를 사용하면 개구리의 이동속도가 빨라집니다.

step19_title = 레이첼 - 템페스트 달리아(AS)
step19_help  = 템페스트 달리아(AS)은 박쥐 4마리를 연속으로 소환하여 공격하는 스킬입니다. 소환된 박쥐들은 넘어진 대상이나, 장애물 뒤에 있는 대상도 공격할 수 있습니다.

step20_title = 레이첼 - 국민콤보 ①
step20_help  = ★바덴-바덴 릴리(ASD) → 템페스트 달리아(AS) 바덴-바덴 릴리(ASD)로 공격해 대상을 띄운 후 템페스트 달리아(AS)로 마무리합니다.

step21_title = 레이첼 - 국민콤보 ②
step21_help  = ★바덴-바덴 릴리(ASD) →대시공격(->-> D) 바덴-바덴 릴리(ASD)로 공격해 대상을 띄운 후 대시공격(->-> D)으로 마무리합니다.

step22_title = 레이첼 - 국민콤보 ③
step22_help  = ★바덴-바덴 릴리(ASD) →대시공격(->-> D) 후 D키 입력으로 추가공격 → 게오로그 13세(AD) → 템페스트 달리아(AS)로 마무리합니다.


[Set63]

max_step = 17

step0_title  = 일지매 - 기본소개
step0_help   = 일지매는 조선 제일의 의적으로 이형환위를 이용해 대상에게 순식간에 접근 후 이어지는 빠른 공격으로 대상을 제압하는 근거리 계열 용병입니다.

step1_title  = 일지매 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 일지매 - 매화 (D 누름떼기)
step2_help   = 공격키(D)를 살짝 눌렀다 떼면 일정범위 안 전방에 있는 대상을 매화로 표시합니다. 표시된 대상은 이형환위를 이용하여 표시된 대상에게 순간이동 할 수 있습니다.

step3_title  = 일지매 - 이형환위 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 매화표시가 된 대상에게 순간이동을 합니다. 무기아이콘 위의 숫자만큼 이동이 가능하고 대기나 걷기상태에서 최대 6개 까지 자동충전 됩니다.

step4_title  = 일지매 - 대시공격1 (->-> D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상에게 빠르게 접근하여 타격하는 대시 공격이 가능합니다.

step5_title  = 일지매 - 대시공격2 (->-> D + D)
step5_help   = 대시공격1 중에 공격키(D)를 입력하면 대상을 발차기로 공격하여 공중에 띄우는 공격을 합니다. 대상이 공중에 띄워지기 때문에 다음 공격을 이어갈 때 유용합니다.

step6_title  = 일지매 - 점프공격(A →D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 연타하면 대상을 3번 연타하는 점프공격이 가능합니다.

step7_title  = 일지매 -  점프 중 이형환위(A →D 오래누름)
step7_help   = 점프상태에서 공격키(D)를 오래누르면 이형환위가 발동되어, 매화표시가 있는 곳으로 이동을 하게 됩니다. 무기 아이콘 위의 숫자가 0일 경우 점프상태를 유지합니다.

step8_title  = 일지매 - 이중점프 (A 두번 누름)
step8_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step9_title  = 일지매 - 공중대시 (A → ->->)
step9_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 내려오면서 대상에게 발차기 공격을 합니다.

step10_title  = 일지매 - 매화검술(SD)
step10_help   = 매화검술(SD)은 지상에서는 대상을 공중에 띄우는 연타공격을, 공중에서는 대상을 공격해 띄우는 공격을 다운상태에는 전진하면서 대상을 공격해 경직 시키는 스킬입니다.

step11_title  = 일지매 - 매화난무(ASD)
step11_help   = 매화난무(ASD)는 매화로 소용돌이를 일으켜 주변을 공격하는 스킬입니다. 사용 중 공격키(D)를 누르면 대상을 따라가 공격하는 매화를 발사합니다..

step12_title  = 일지매 - 점혈(AD)
step12_help   = 점혈(AD)는 빠르게 앞으로 다가가 대상을 공격해 잠시동안 경직 시켜주는 스킬입니다. 공격당한 대상은 기립상태가 되어 다음 공격을 하기에 유용합니다.

step13_title  = 일지매 - 연막탄(AS)
step13_help   = 연막탄(AS)은 연막탄을 터트려 랜덤한 위치로 자신을 순간이동 시켜주는 스킬입니다. 피격 중이나 다운상태에서도 사용할 수 있습니다.

step14_title  = 일지매 - 국민콤보 ①
step14_help   = ★매화검술(SD) → 점프공격(A →D) 매화검술(SD)로 대상을 띄운 후 점프공격(A →D)중 D키를  연타해 마무리 합니다.

step15_title  = 일지매 - 국민콤보 ②
step15_help   = ★점혈(AD) →매화난무(ASD) 점혈(AD)로 대상을 경직상태로 만든 후 매화난무로 공격하여 마무리합니다.

step16_title  = 일지매 - 국민콤보 ③
step16_help   = ★점혈(AD)→대시공격2(->-> D+ D)→기본공격(DDDD)→매화난무(ASD)→매화검술(SD)→점프공격(A →D)중 D키 연타로 마무리합니다.


[Set64]

max_step = 15

step0_title  = 홍길동 - 기본소개
step0_help   = 홍길동은 활빈당의 두령으로 죽봉을 무기로 사용하고, 다양한 상황에서 분신술을 이용해 상대를 끊임없이 괴롭히는 근거리 계열 용병입니다.

step1_title  = 홍길동 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 홍길동 - 붕익 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 상대의 방어를 무시하고 경직을 잡는 붕익공격이 발동됩니다. 기본 공격과 섞어서 사용하면 전투에서 쉽게 우위를 차지할 수 있습니다.

step3_title  = 홍길동 - 대시공격(->-> D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상에게 순간적으로 빠르게 접근해 타격하는 대시 공격을 합니다.

step4_title  = 홍길동 - 점프공격(A →D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 봉으로 올려치는 공격을 합니다. 추가로 공격키(D)를 한번 더 누르면 봉으로 내려치는 공격을 합니다.

step5_title  = 홍길동 -  이단 옆차기(A →D 오래누름)
step5_help   = 점프 중 공격키(D)를 오래누르면 대각선 아래로 이단 옆차기 공격을 합니다. 이 후 다시 점프상태로 전환되어 점프공격이나 이단옆차기 공격을 한번 더 할 수 있습니다.

step6_title  = 홍길동 - 분신술 사용방법①
step6_help   = 특정행동 중 방어키(S)를 누르면 무기아이콘 상단의 분신술 개수만큼 연속해서 소환이 가능합니다. 소진된 분신개수는 대기자세나 걷기상태에서 충전됩니다

step7_title  = 홍길동 - 분신술 사용방법(특정행동 중 S키)②
step7_help   = 붕익, 대시, 대시공격, 점프, 이중점프, 점프공격, 이단 옆차기 중 방어키(S)를 누르면 분신을 소환합니다. 소환된 분신은 주변의 대상을 자동공격합니다.

step8_title  = 홍길동 - 대차륜(SD)
step8_help   = 대차륜(SD)은 점프 중 사용가능하며, 봉을 휘둘러 360도 전진 회전공격을 한 후4명의 분신을 소환해 추가로 공격하는 스킬입니다.

step9_title  = 홍길동 - 권각술(ASD)
step9_help   = 권각술(ASD)은 점프 중 사용가능하며, 전진하면서 상대를 난타하는 스킬입니다. 공격 중 방향전환이 가능할 뿐만 아니라 S키를 눌러 강력한 발차기 공격이 가능합니다.

step10_title  = 홍길동 - 무영각(AD)
step10_help   = 무영각(AD)은 넘어져 있는 대상을 일으켜 세운 후 발로 차서 공중에 띄우는 공격을 하는 스킬입니다. 넘어진 대상뿐만 아니라 서있는 대상도 잡을 수 있습니다.

step11_title  = 홍길동 - 경공술(AS)
step11_help   = 경공술(AS)은 일정시간 동안 점프키를 연타하면 공중을 이동하는 스킬입니다. 다운시 사용이 가능하며 이동 중 점프공격이 가능하고 AS키를 다시 누르면 취소됩니다.

step12_title  = 홍길동 - 국민콤보 ①
step12_help   = ★대차륜(SD) →무영각(AD) 대차륜(SD)으로 대상을 공격한 후 무영각(AD)으로 공격해 마무리합니다.

step13_title  = 홍길동 - 국민콤보 ②
step13_help   = ★대시공격 후 분신술 (->-> D, S) →이단옆차기(A →D 오래누름) 대시공격 후 바로 분신술을 사용해 대상을 띄운 후 이단옆차기로 두번 공격합니다.

step14_title  = 홍길동 - 국민콤보 ③
step14_help   = ★붕익(D 오래누름) →권각술(ASD) →무영각(AD)→이단 옆차기(A→D오래누름)2번 →공중에서 대차륜(SD)으로 마무리합니다.


[Set65]

max_step = 15

step0_title  = 위치 - 기본소개
step0_help   = 위치는 마법 빗자루와 수정구슬을 무기로 사용하며, 마법 빗자루를 타고 하늘을 날면서 영혼을 발사해 상대를 괴롭히는 마법형 용병입니다.

step1_title  = 위치 - 기본공격 (D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 위치 - 비행 (D 오래유지)
step2_help   = 공격키(D)를 누르고 있으면 비행상태로 전환이 됩니다. 비행은 무기아이콘 상단의 비행게이지가 노란색일 때만 비행이 가능하며, 비행 시 게이지가 소모됩니다.

step3_title  = 위치 - 비행 중 상승 또는 하강 (비행 중 A키 또는 S키)
step3_help   = 비행상태에서 점프키(A)를 누르면 위로 상승하며, 방어키(S)를 누르면, 아래로 하강합니다. 공격키(D)를 오래 누르면 점프상태로 전환되면서 비행을 종료합니다.

step4_title  = 위치 - 비행 중 공격 (비행 중 D키)
step4_help   = 비행 중 공격키(D)를 누르면 대상을 따라가며 공격하는 영혼을 발사합니다. 공격 당한 대상 머리 위에 유령이 생성되며, 중첩공격 성공 시 대상을 공중에 띄웁니다.

step5_title  = 위치 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 빗자루를 타고 빠르게 하강하여 대상을 공격합니다. 공격당한 대상은 바운딩상태가 됩니다.

step6_title  = 위치 - 이중점프 (A 두번 누름)
step6_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step7_title  = 위치 - 영혼 발사 (->->)
step7_help   = 방향키를 빠르게 두 번 누르면 그 방향으로 영혼을 발사합니다. 공격당한 대상의 머리 위에 유령이 생성되며, 중첩공격 성공 시 대상을 공중에 띄웁니다.

step8_title  = 위치 - 문나이트 / 무기스킬(SD)
step8_help   = 문나이트(SD)는 스킬게이지를 소모해 비행하는 스킬입니다. 넘어진 대상도 공격하며, 공격 당한 대상을 공중에 띄웁니다. 비행 중 SD키 입력 시 스킬을 해제합니다.

step9_title  = 위치 - 블랙캣 / 갑옷스킬(ASD)
step9_help   = 블랙캣(ASD)은 소환된 고양이가 가까운 대상에게 접근하여 대상의 얼굴을 덮쳐 랜덤하게 움직이다 경직이 되는 스킬입니다. 넘어진 대상에게도 사용가능합니다.

step10_title  = 위치 - 페인쏜 / 투구스킬(AD)
step10_help   = 페인쏜(AD)은 마법진 위치에 가시덤불을 소환하여 공격하는 스킬입니다. 넘어진 대상도 공격하며, 공격한 대상을 띄움상태로 만듭니다.

step11_title  = 위치 - 소울파이어 / 망토스킬(AS)
step11_help   = 소울파이어(AS)는 오랜 시간동안 조종 가능한 화염구 2개를 발사하는 스킬입니다.  화염구는 빠른 속도로 이동하며, 주변대상을 공격합니다.

step12_title = 위치 - 국민콤보 ①
step12_help  = ★점프공격(A →D) → 기본공격(D →D →D) 점프공격(A →D) 후 바운딩 된 대상을 기본공격으로 공격해 마무리합니다.

step13_title = 위치 - 국민콤보 ②
step13_help  = ★블랙캣(ASD) →소울파이어(AS) 블랙캣(ASD)으로 대상을 공격한 후 대상이 경직상태가 될 때 다가가 소울파이어(AS)로 마무리합니다.

step14_title = 위치 - 국민콤보 ③
step14_help  = ★페인쏜(AD) →문나이트(SD)로 비행공격해 대상을 띄운 다음 SD키로 스킬취소하여 바로 점프공격(A →D) →기본공격(D →D →D) →블랙캣(ASD) →소울파이어(AS)


[Set66]

max_step = 16

step0_title  = V-메카닉 - 기본소개
step0_help   = V-메카닉는 두 자루의 빔샤벨을 무기로 사용하며 빠른속도로 적에게 접근할 수 있는 부스터 능력을 이용해 상대를 신속하고 빠르게 제압하는 근거리 계열 용병입니다.

step1_title  = V-메카닉 - 기본공격 (D →D →D →D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = V-메카닉 - 부스터 (D 오래노름)
step2_help   = 공격키(D)를 누르고 있으면 부스터 상태로 전환이 됩니다. 부스터는 무기아이콘 상단의 부스터게이지가 노란색일 때만 부스터가 사용되며, 게이지가 소모됩니다.

step3_title  = V-메카닉 - 부스터 사용방법 ①
step3_help   = 부스터 게이지는 걷기나 대기상태에서 충전되며, 부스터 중 방향키를 입력시 바라보는 방향을 유지한 상태로 대시 이동을 합니다. 또한 A키는 상승, S키는 하강을 합니다.

step4_title  = V-메카닉 - 부스터 사용방법 ②
step4_help   = 부스터 중 공격키(D)를 누르면 조준점이 있는 곳으로 빠르게 이동 후 대상을 공중에 띄우는 2연타 공격을 합니다 조준은 대상이 일정범위 안에 접근 시 자동조준이 됩니다.

step5_title  = V-메카닉 - 부스터 사용방법 ③
step5_help   = 대기, 걷기, 대시, 점프 중 공격키(D)를 오래 누르고 있으면 부스터 상태가 됩니다. 점프 중이나, 고도가 상승된 상태에서 부스터 종료 시 점프상태로 전환됩니다.

step6_title  = V-메카닉 - 대시공격 (->-> D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 빔샤벨로 공격합니다.

step7_title  = V-메카닉 - 대시공격 확장(->-> D + D)
step7_help   = 대시공격 후 공격키(D)를 한번 더 누르면 2연타 공격을 하여 대상을 공중에 띄우고 자신도 점프상태가 됩니다. 이 후 점프공격으로 연결할 수 있습니다.

step8_title  = V-메카닉 - 점프공격(A →D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 연타하면 총 3연타를 하는 점프 공격을 사용할 수 있습니다.

step9_title  = V-메카닉 - 빔슬래쉬 / 무기스킬(SD)
step9_help   = 빔슬래쉬(SD)는 자신 앞의 주변대상에게 빠르게 이동 후 빔샤벨로 연타공격을 하는 스킬입니다. 점프 중 사용가능하고 공격키(D)를 연타해 5연타 공격을 합니다.

step10_title  = V-메카닉 - 와일드샷 / 갑옷스킬(ASD)
step10_help   = 와일드샷(ASD)은 전방의 대상을 자동으로 타겟지정을 해 레이져건으로 공격키(D)연타하여 공격하는 스킬입니다. 최대 6번까지 공격이 가능합니다.

step11_title  = V-메카닉 - 빔실드 / 투구스킬(AD)
step11_help   = 빔실드(AD)은 전방에 공격을 방어해주는 실드를 생성하는 스킬입니다. 피격 중 사용가능하며, 빔실드는 방파공격 외 의 모든 공격을 일정시간동안 막아줍니다.

step12_title  = V-메카닉 - 하이퍼빔 / 망토스킬(AS)
step12_help   = 하이퍼빔(AS)는 런쳐를 이용해 하이퍼빔을 3번 발사하는 스킬입니다. 방향키를 눌러 방향전환이 가능하고, D키는 발사, A키는 상승, S키는 하강을 합니다.

step13_title = V-메카닉 - 국민콤보 ①
step13_help  = ★빔슬래쉬(SD) → 와일드샷(ASD) 빔슬래쉬(SD)로 공격키(D)연타로 대상을 띄운 후 바로 와일드샷(ASD)을 사용해 공격키(D)연타하여 마무리합니다.

step14_title = V-메카닉 - 국민콤보 ②
step14_help  = ★부스터(D오래누름)후 D키→점프공격(A→D) 부스터(D오래누름)사용해 D키를 눌러 상대를 띄운 다음 점프공격(A→D)의 D키 연타로 마무리합니다.

step15_title = V-메카닉 - 국민콤보 ③
step15_help  = ★빔슬래쉬(SD)→대시공격 확장(->-> D + D)으로 대상을 띄운 후 점프공격(A→D)으로 D키 연타를 한 다음 와일드샷(ASD) D키 연타로 마무리 합니다.



[Set67]

max_step = 17

step0_title  = 아서 펜드래건 - 기본소개
step0_help   = 아서 펜드래건은 성검 엑스칼리버와 방패를 사용하여 적을 제압하며, 타격 혹은 피격시 회복하는 특수게이지를 이용하여 적들을 공격하는 근거리 계열 용병입니다.

step1_title  = 아서 펜드래건 - 기본공격 (D →D →D )
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 아서 펜드래건 - 엑스칼리버의 능력  1
step2_help   = 적을 공격하거나, 피격당할 경우 엑스칼리버의 기운이 차오릅니다. 게이지는 무기 아이콘 우측에 표시되며 노란색으로 활성화 되면 빛의 성검을 발동 시킬 수 있습니다.

step3_title  = 아서 펜드래건 - 엑스칼리버의 능력 2
step3_help   = 엑스칼리버의 기운은 최대 2회까지 아서 펜드래건이 빛의 성검을 사용할 수 있도록 모여 집니다. 그 이상의 기운은 사용자의 몸을 해치기 때문에 사라져 버립니다.

step4_title  = 아서 펜드래건 - 엑스칼리버의 능력 3 - 빛의 성검
step4_help   = 엑스칼리버의 게이지가 활성화 된 상태에서 빛의 성검(D오래누름)을 사용하면 전방의 적들을 밀어내는 빛을 발사합니다. 점프중 사용 가능 합니다.

step5_title  = 아서 펜드래건 - 엑스칼리버의 능력 4 - 빛의 보호
step5_help   = 엑스칼리버의 기운이 활성화 되면, 아서 펜드래건의 몸을 감싸는 빛을 발합니다. 이때는 검의 기운이 소유자를 보호하여 밀려나는 거리를 감소시켜 줍니다.

step6_title  = 아서 펜드래건 - 대시공격1(→→ D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 공중에 띄우는 대시 공격이 가능합니다.

step7_title  = 아서 펜드래건 - 대시공격2 (→→ D 오래누름)
step7_help   =  방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 오래 누르면 대상을 강하게 밀쳐내는 대시 공격이 가능합니다.

step8_title  = 아서 펜드래건 - 점프공격1(A →D)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대상을 사선으로 베는 점프 공격을 합니다. 점프 공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step9_title  = 아서 펜드래건 - 점프공격2(A →D 오래누름)
step9_help   = 엑스칼리버의 기운이 활성화 되어있는 경우, 점프키(A)를 이용하여 점프를 발동시킨 이후, 공격키(D오래누름)을 이용하여 대각선 아래의 적에게 빛의 성검을 발사 합니다.

step10_title  = 아서 펜드래건 - 검의 노래 / 무기스킬(SD)
step10_help   = 검의 노래(SD)는 엑스칼리버를 바닥에 꼽아 그 기운을 뿜어내어 주변의 적들을 공격하는 스킬입니다. 점프 중 사용 가능하며 공격키(D)를 연타해 최대 4연타 공격을 합니다.

step11_title  = 아서 펜드래건 - 왕의 기운 / 갑옷스킬(ASD)
step11_help   = 왕의 기운(ASD)은 왕의 기운을 뿜어내어 주변의 적들을 무릎 꿇게 만드는 스킬입니다. 추가적인 공격이 가능하며 공격 및 피격시 게이지가 회복되며 방어가 증가합니다.

step12_title  = 아서 펜드래건 - 왕의 축복 / 투구스킬(AD)
step12_help   = 왕의 축복(AD)는 주변의 아군의 공격에 방어파괴효과를 부여하는 스킬입니다. 시전중 멈출 수 있으며 넘어져도 오라가 멈추지 않습니다.

step13_title  = 아서 펜드래건 - 왕의 귀환 / 망토스킬(AS)
step13_help   = 왕의 귀환(AS)은 아군의 위치로 순간이동을 하는 스킬입니다. S키를 눌러 아군을 선택하고, D키를 눌러 이동합니다. 아군이없으면 시작점으로 이동합니다.

step14_title = 아서 펜드래건 - 국민콤보 ①
step14_help  = ★왕의 기운(ASD) →검의 노래(SD) 왕의 기운(ASD)로 적을 밀어낸 후, 쓰러진 적에게 다가가 검의 노래(SD)를 사용하여 마무리 합니다.

step15_title = 아서 펜드래건 - 국민콤보 ②
step15_help  = ★대시공격2(→→D오래누름)으로 적을 밀어낸 후, 기본공격(D→D→D)이후, 점프 후 검의노래(SD)로 연속공격하여 깔끔하게 마무리 합니다.

step16_title = 아서 펜드래건 - 국민콤보 ③
step16_help  = ★대시공격1(→→D)이후, 검의 노래(SD)로 적을 연속공격하고 빛의 성검(D 오래누름)으로 대상을 공격하면서 적을 날려보냅니다.


[Set68]

max_step = 15

step0_title  = 상산 조자룡 - 기본소개
step0_help   = 상산 조자룡은 창술의 달인 입니다. 긴 창을 이용해 쉴 틈 조차 주지 않는 빠른 찌르기 공격을 주력으로 사용하여 적을 빠르게 제압하는 근거리 계열 용병입니다.

step1_title  = 상산 조자룡 - 기본공격(D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 상산 조자룡 - 연(D 오래누름 후 D연타)
step2_help   = D키를 오래누르면 창을 휘두르며, 이 때 공격키(D)를 빠르게 연타하면 총 6번의 찌르기 공격을 할 수 있습니다. 공격 중 방향키를 입력해 공격방향을 변경할 수 있습니다

step3_title  = 상산 조자룡 - 연 연타 중 이동(연 연타 중 방향키->->)
step3_help   = 연(D 오래누름 후 D연타)중 방향키를 두번 클릭하면 해당 방향으로 구르기 이동을 합니다. 이를 이용하여 공격을 끊고 다른 행동을 취할 수 있습니다.

step4_title  = 상산 조자룡 - 점프공격(A →D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 위에서 아래로 적을 공격합니다. 이후 공격키(D) 연타로 3번의 추가공격이 가능하며 적을 공중에 띄웁니다.

step5_title  = 상산 조자룡 - 대시 구르기(→→ D)
step5_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 구르기를 하며, 방향키를 같이 누르면 해당방향으로 이동합니다

step6_title  = 상산 조자룡 - 대시 띄움공격(→→ D+D 또는 D 오래누름)
step6_help   = 대시 구르기 상태에서 공격키(D)와 방향키를 입력하면 해당 방향으로 대상을 띄우는 공격을 합니다. 또한 대시 중 공격키(D)를 오래 누를 경우 바로 띄움 공격을 합니다.

step7_title  = 상산 조자룡 - 튕겨내기(공격 받는 순간 방어)
step7_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step8_title  = 상산 조자룡 - 창룡출해 / 무기스킬(SD)
step8_help   = 창룡출해(SD)는 전진이동하며, 창을 회전시켜 공격하는 스킬입니다. 다운상태일 때 사용이 가능하고,방향을 바꿀 수 있습니다. S키를 눌러 다운된 대상도 공격 가능합니다.

step9_title  = 상산 조자룡 - 제압 / 갑옷스킬(ASD)
step9_help   = 제압(ASD)은 적을 잡고 전방으로 이동 후 강하게 던지는 스킬입니다. 방향키를 입력으로 방향을 바꿀 수 있고, D키 입력으로 이동 중 바로 던질 수 있습니다.

step10_title = 상산 조자룡 - 일기당천 / 투구스킬(AD)
step10_help  = 일기당천(AD)은 다수의 적들을 밀고 이동하다가 D키를 누르면 한 번 더 세게 밀수 있습니다.방향키로 방향전환이 가능하며 다운된 대상을 타격 할 수 있습니다.

step11_title  = 상산 조자룡 - 일격 / 망토스킬(AS)
step11_help   = 일격(AS)은 입력한 방향으로 이동 후 검으로 대상을 공격해 경직 시키는 스킬입니다. 점프, 피격, 다운 중 사용 가능하며, S키 입력 시 대상을 띄우는 공격을 합니다

step12_title = 상산 조자룡 - 국민콤보 ①
step12_help  = ★창룡출해(SD) →연(D키 오래누름 후 D연타) 창룡출해(SD)로 대상을 넘어트리고 바로 S키를 눌러 대상을 띄운 후 연(D 오래누름 후 D연타)으로 마무리합니다.

step13_title = 상산 조자룡 - 국민콤보 ②
step13_help  = ★점프공격(A →D) →연(D 오래누름 후 D연타) 점프공격(A →D)의 D키 연타로 대상을 공격 한 후 연(D 오래누름 후 D연타)로 마무리합니다.

step14_title = 상산 조자룡 - 국민콤보 ③
step14_help  = ★창룡출해(SD)로 공격 후 넘어진 대상 S키로 대상 띄움→점프공격(A →D) 4연타 후 기본공격 3타 →연(D키 오래누름 후 D연타) →제압(ASD)으로 마무리합니다.



[Set69]

max_step = 14

step0_title  = 카드마술사 - 기본소개
step0_help   = 카드마술사는 고속 이동과 마술카드를 이용한 날리기 공격으로 대상을 견제 및 공격하고 여러가지 마술로 대상을 제압하는 근거리 계열 용병입니다.

step1_title  = 카드마술사 - 기본공격(D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 카드마술사 - 셔플(D 오래누름)
step2_help   = D키를 오래누르면 여러방향으로 날릴 수 있는 카드를 모으는 자세를 취합니다. 이동이 가능하며, 누름의 시간에 따라 날릴 수 있는 카드가 증가합니다.

step3_title  = 카드마술사 - 대시공격(->-> →D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 전방을 향해 마술카드를 날립니다.

step4_title  = 카드마술사 - 고속이동(→→ D오래누름 →D )
step4_help   = 대시 달리기 중에 공격키를 오래누르면 전방으로 빠르게 고속이동을 합니다. 고속 이동 이후에 공격키를 누르면 대상을 띄우는 공격이 발동됩니다.

step5_title  = 카드마술사 - 점프공격(A → D → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 마술카드를 아래로 던지는 공격을 합니다. 이 때공격키(D)를 한번 더 입력하면 추가로 공격이 가능합니다.

step6_title  = 카드마술사 - 고속하강(A → D오래누름 →D D D )
step6_help   = 점프 중에 공격키를 오래누르면 전방으로 고속하강을 합니다. 고속하강 이후에 공격키를 누르면 대상을 약한 경직상태를 만드는 3연속 공격을 합니다.

step7_title  = 카드마술사 - 와일드카드 / 무기스킬(SD)
step7_help   = 와일드카드(SD)는 전방으로 다수의 카드를 날려 대상을 공격하는 스킬입니다. 카드를 날린 후 공격키(D)를 추가로 입력하면 해당 방향으로 거대한 카드를 날립니다.

step8_title  = 카드마술사 - 마술상자 / 갑옷스킬(ASD)
step8_help   = 마술상자(ASD)는 주변 범위내의 적군의 위에 마술상자를 소환하여 가두고 대상이 누른키에 따라 카드가 결정되고 틀릴 경우 공중으로 이동시켜 낙하시키는 스킬입니다.

step9_title  = 카드마술사 - 비둘기 마술 / 투구스킬(AD)
step9_help   = 비둘기 마술(AD)은 마술로 비둘기를 소환하는 스킬입니다. 소환된 비둘기는 가까운 적에게 날아가 타격하고 피격시 대상을 랜덤방향으로 데리고 이동합니다.

step10_title = 카드마술사 - 시간제어 / 망토스킬(AS)
step10_help  = 시간제어(AS)는 대상을 피격시 대상의 이동 속도를 감속시키는 스킬입니다. 중첩이 가능하며, 중첩시 시간과 감속효과가 증가됩니다.

step11_title = 카드마술사 - 국민콤보 ①
step11_help  = ★와일드카드(SD) → 대시공격(->-> →D) 와일드카드(SD)로 대상을 공격하여 띄운 후 대시공격(->-> →D)으로 마무리합니다.

step12_title = 카드마술사 - 국민콤보 ②
step12_help  = ★셔플(D오래누름) → 대시1타 → 고속이동 셔플로 대상을 가격한 후 대시1타 공격으로 대상을 띄우고 고속이동 이후 공격으로 대상을 가격합니다.

step13_title = 카드마술사 - 국민콤보 ③
step13_help  = ★와일드카드(SD) → 마술상자(ASD) → 기본공격 와일드카드(SD)로 대상을 넘어트리고 마술상자(ASD)로 대상을 낙하시키고 기본공격으로 마무리합니다.



[Set70]

max_step = 13

step0_title  = 바바리안 - 기본소개
step0_help   = 바바리안은 커다란 도끼 두자루를 이용하여, 대상에게 순식간에 접근해 내려찍는 립어택과 무자비한 공격들로 대상을 제압하는 근거리 계열 용병입니다.

step1_title  = 바바리안 - 기본공격(D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 바바리안 - 립어택(D 누름떼기)
step2_help   = D키를 오래누르면 점프해 상대를 공격합니다. 공격키(D)를 오래 누를 수록 이동거리가 증가하며, 넘어진 대상도 공격할 수 있습니다.

step3_title  = 바바리안 - 휠윈드(->-> →D)
step3_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 주변의 적들을 공격하는 휠 윈드를 사용합니다.

step4_title  = 바바리안 - 점프공격(A → D )
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 전방으로 도끼를 찍어내리는 공격을 하며, 점프 중인 대상은 바운딩, 기립대상은 경직상태로 만듭니다.

step5_title  = 바바리안 - 튕겨내기 (공격 받는 순간 방어)
step5_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step6_title  = 바바리안 - 레이지어택 / 무기스킬(SD)
step6_help   = 레이지어택(SD)은 발을 굴러 넘어진 대상을 일으켜 세우는 범위공격을 한 후, 연타공격을 하는 스킬입니다. 방어키(S)입력 시 회전공격으로 대상들을 날려버립니다.

step7_title  = 바바리안 - 바디크래셔 / 갑옷스킬(ASD)
step7_help   = 바디크래셔(ASD)는 피격 중 사용가능하고 적을 붙잡은 후 공격키(D)연타로 대상을 지면에 3번 내려치는 스킬입니다. 잡은 대상을 이용해 주변 대상을 공격할 수 있습니다.

step8_title  = 바바리안 - 워하울 / 투구스킬(AD)
step8_help   = 워하울(AD)은 넘어진 대상도 일으켜 세우는 함성을 내질러 주변 대상들을 놀래켜 경직시켰다가 랜덤하게 이동시킨 후 다시 경직상태로 만드는 스킬입니다.

step9_title = 바바리안 - 버서크 / 망토스킬(AS)
step9_help  = 버서크(AS)는 일정 시간동안 이동속도와 공격력 상승하고 상대 방어를 무시하고 데미지를 주는 대신 HP를 소모하는 스킬입니다. 스킬키(AS)로 끌 수가 있습니다.

step10_title = 바바리안 - 국민콤보 ①
step10_help  = ★레이지어택(SD) → 바디크래셔(ASD) 레이지 어택(SD)으로 적을 공격한 후에 바디크래셔(ASD)로 마무리 합니다.

step11_title = 바바리안 - 국민콤보 ②
step11_help  = ★립어택(D 누름떼기) →휠윈드(->-> →D) 립어택(D 누름떼기)으로 대상을 띄운 후 바로 휠윈드(->-> →D)로 공격해 마무리 합니다.

step12_title = 바바리안 - 국민콤보 ③
step12_help  = ★레이지어택(SD) →점프공격(A → D) →기본공격(D→D→D)→바디크래셔(ASD)→점프공격(A →D)→기본공격→립어택(D 누름떼기)으로 마무리합니다.


;------------------------/ 071. IORI
[Set71]

max_step = 21

step0_title  = 이오리 - 기본소개
step0_help   = 이오리는 The  King Of Fighters 게임에 등장하는 캐릭터로 불을 사용한 다양하고 강력한 공격을 통하여 상대를 제압하는 프리미엄 캐릭터입니다.

step1_title  = 이오리 - 기본공격(D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 이오리 - 108식 어둠쫓기(D 오래누름)
step2_help   = D키를 오래 누르면 바닥을 타고가는 불을 발사합니다. 어둠쫓기 공격에 맞은 대상은 경직이 발생되어 추가 공격에 용이하며 넘어진 대상도 공격 가능합니다.

step3_title  = 이오리 - 카스미(->->)
step3_help   = 방향키를 빠르게 두 번 눌렀다 때면 일정거리를 낮은 자세로 미끄러 지듯이 이동하는 카스미가 발동됩니다. 카스미를 사용하면 대상을 관통하는 이동이 가능합니다.

step4_title  = 이오리 - 127식 규화(->-> → D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 경직시키는 규화 공격이 발동됩니다.

step5_title  = 이오리 - 127식 규화 확장(->-> → D → D → D)
step5_help   = 달리는 중에 공격키를 눌러 규화 공격을 발동 시킨 후 추가로 공격키를 입력하면 첫번째 규화 공격과 연결되는 두번째, 세번째 규화 공격이 발동됩니다.

step6_title  = 이오리 - 외식 백합 꺾기(A → D )
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 옆차기 공격이 발동됩니다. 공격키 입력시 방향키를 통하여 원하는 방향의 공격이 가능합니다.

step7_title  = 이오리 - 외식 봉린 음 (방어 성공시 바로 공격)
step7_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step8_title  = 이오리 - 커맨드 기능 ①
step8_help   = 기본공격, 대시공격, 특별공격, 반격, 점프착지, 커맨드 공격 중에 지정된 방향키를 연속으로 입력하면 커맨드 및 스킬 공격을 즉시 발동 시킬 수 있습니다.

step9_title  = 이오리 - 커맨드 기능 ②
step9_help   = 커맨드에 사용되는 방향키는 상하좌우(↑↓←→) 4개이며 캐릭터 방향과 관계 없이 입력키 그대로 적용하여 커맨드 기능을 발동 시킵니다.

step10_title = 이오리 - 108식 어둠쫓기 (↓ →)
step10_help  = 특별 조작을 사용할 때보다 빠르게 발동되는 어둠쫓기 공격이 발사됩니다. 동일한 공격은 최대 2회 연속까지만 커맨드를 통하여 발동 시킬 수 있습니다.

step11_title = 이오리 - 100식 귀신태우기 (→ ↓)
step11_help  = 회전하면서 대상을 불로 강타하는 공격이 발동됩니다. 대상을 공중에 띄우는 공격으로 기본 및 다른 커맨드 공격으로 연결하기에 유용합니다.

step12_title = 이오리 - 127식 규화 (↓ ←)
step12_help  = 대시 조작을 사용할 때보다 빠르게 발동되는 규화 공격이 발동됩니다. 동일 커맨드를 연속으로 입력하면 첫번째,두번째, 세번째 규화 공격이 발동됩니다.

step13_title = 이오리 - 설풍 (→ ↓ ← →)
step13_help  = 전방에 대상을 잡아서 뒤쪽으로 보내는 공격이 발동됩니다. 설풍은 상대의 방어를 무시하고 공격할 뿐만 아니라 공중에 뜬 대상을 다운시킬 수 있습니다.

step14_title  = 이오리-212식 금월 음 / 무기스킬(SD or ↓←↑)
step14_help   = 212식 금월 음(SD)은 일정 거리를 달려가 대상을 잡고 바닥에 눕힌 후 불을 폭파시켜 공격하는 스킬입니다. (↓←↑) 커맨드를 사용하여 발동 시킬 수 있습니다.

step15_title  = 이오리-1211식 팔치녀 / 갑옷스킬(ASD or ↓→↓←)
step15_help   = 1211식 팔치녀(ASD)는 전방으로 빠르게 이동하여 대상을 잡고 난타한후 불을 폭파시켜 공격하는 스킬입니다. (↓→↓←) 커맨드를 사용하여 발동 시킬 수 있습니다.

step16_title  = 이오리-1207식 어둠삭히기 / 투구스킬(AD or ↓→↓)
step16_help   = 1207식 어둠 삭히기(AD)는 빠르게 2연타후 불기둥을 폭파 시켜서 대상을 공격하는 스킬입니다. (↓→↓) 커맨드를 사용하여 발동 시킬 수 있습니다.

step17_title = 이오리 - 1209식 염구 / 망토스킬(AS or ↓←↓→)
step17_help  = 1209식 염구(AS)는 지정된 위치로 도약 이동후 강력한 불을 폭파 시켜서 대상을 공격하는 스킬입니다. (↓←↓→) 커맨드를 사용하여 발동 시킬 수 있습니다.

step18_title = 이오리 - 국민콤보 ①
step18_help  = ★팔치녀(ASD) → 어둠삭히기(AD) 팔치녀(ASD)로 대상을 잡아서 난타하는 중에 어둠삭히기(AD)를 발동하여 연결 공격으로 마무리 합니다.

step19_title = 이오리 - 국민콤보 ②
step19_help  = ★금월(SD) → 국민콤보① → 염구(AS) 금월로 대상을 띄운후 뜨거나 떨어질때 국민콤보①로 연결하고 염구로 강하게 마무리 합니다.

step20_title = 이오리 - 국민콤보 ③
step20_help  = ★점프공격(A→D) → 귀신태우기(→↓) → 기본공격 → 금월 음(↓←↑) → 기본공격 → 팔치녀(↓→↓←) → 기본공격 → 규화(↓←)3회 → 어둠쫓기(↓→)


[Set72]

max_step = 17

step0_title  = 달타냥 - 기본소개
step0_help   = 달타냥는 레이피어를 이용한 빠른 찌르기 공격과 잽싼 몸놀림으로 방향을 바꾸면서 대상을 공격하는 근거리 계열의 용병입니다.

step1_title  = 달타냥 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 달타냥 - 쾌검 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 쾌검 공격이 발동됩니다. 쾌검 공격은 2연속 사용할 수 있으며 1타 이후 방향키를 바꾸어 공격할 수 있기 때문에 드랍존으로 밀기에 유용합니다.

step3_title  = 달타냥 - 이중점프 (A 두번 누름)
step3_help   = 점프키(A)를 눌러 점프한 상태에서 다시 점프키를 누르면 공중에서 한 번 더 점프가 발동되어 좀 더 높이 또는 멀리 이동할 수 있게 됩니다.

step4_title  = 달타냥 - 점프공격 (A → D + D + D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 최대 3연속까지 공격을 합니다. 마지막 타격으로 공중대상을 피격하면 바운딩 효과가 발동됩니다.

step5_title  = 달타냥 - 회전 찌르기 (A → ->->)
step5_help   = 점프한 상태에서 방향키를 두번 빠르게 누르면 해당방향으로 내려오면서 대상에게 찌르기 공격을 합니다. 2연속 타격시 대상을 넘어트리는 효과가 발동 됩니다.

step6_title  = 달타냥 - 대시공격 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 일정 시간 경직시키는 대시 공격이 가능합니다.

step7_title  = 달타냥 - 대시공격 차징(대시 이후 D오래)
step7_help   = 대시 이동 중 D키를 오래 누르면 대시 차징이 발동됩니다. 대시 차징은 차징길이에 따라 전진 속도, 거리, 경직시간이 길어져서 추가 공격에 용이합니다.

step8_title  = 달타냥 - 대시공격2 (대시 공격 이후 D)
step8_help   = 대시 공격 이후 D키를 추가로 누르면 대상을 띄우는 대시공격이 발생됩니다. 대시공격2는 대상을 띄우기 때문에 추가 공격을 하기에 매우 좋은 기술입니다.

step9_title  = 달타냥 - 반격 (방어 성공시 바로 공격)
step9_help   = 공격을 방어한 후 바로 공격키(D)를 누르면 반격이 발동 됩니다. 달타냥의 반격은 다른 용병과는 다르게 반격이 발동되는 순간 쾌검상태로 전환이 됩니다.

step10_title  = 달타냥 - 피어싱 / 무기스킬(SD)
step10_help   = 피어싱(SD)은 전방으로 이동하면서 연타하여 대상을 제압하는 스킬입니다.  스킬 중 S키를 누르면 전방으로 빠르게 관통하며 대상을 경직시키는 기술을 사용합니다.

step11_title  = 달타냥 - 가이드샷 / 갑옷스킬(ASD)
step11_help   = 가이드샷(ASD)은 소형 산탄총을 꺼내 주변의 가까운 대상에게 자동으로 5연속 공격을 하는 스킬입니다. 다수의 적이 있을 경우 번갈아가면서 공격합니다.

step12_title = 달타냥 - 스프링 / 투구스킬(AD)
step12_help   = 스프링(AD)은 다운 공격을 받았을 때 점프키(A)를 사용하여 재점핑 시켜주는 반패시브 스킬입니다. 넘어지지 않고 재점핑이 되어 공격을 바로 이어갈 수 있습니다.

step13_title = 달타냥 - 사이드킥 / 망토스킬(AS)
step13_help  = 사이드킥(AS)은 상황별 스킬로서 기립중에는 대상을 띄우는 공격을하고, 다운중 사용시에는 뒤로 날리는 공격을 하는 스킬입니다.

step14_title = 달타냥 - 국민콤보 ①
step14_help  = ★대시공격(->-> → D) → 점프공격3타 → 회전찌르기 대시공격으로 대상을 띄우고 빠르게 뛰어올라 점프 공격으로 대상을 바운딩 시키고 회전찌르기로 마무리 합니다.

step15_title = 달타냥 - 국민콤보 ②
step15_help  = ★피어싱(SD+S) → 대시공격(->-> → D) → 기본 공격 피어싱(SD)로 대상을 공격하고 S키로 경직 시킨 후 대시 공격으로 띄우고 기본 공격으로 마무리합니다.

step16_title = 달타냥 - 국민콤보 ③
step16_help  = ★쾌검(D오래) → 사이드킥(AS) → 점프 공격 쾌검(D오래) 2연타로 대상을 넘어트린 후 사이드킥(AS)으로 대상을 띄운 후 점프 공격으로 마무리 합니다.

[Set73]
max_step = 16

step0_title  = 그래피티 아티스트 - 기본소개
step0_help   = 그래피티 아티스트는 두개의 스프레이를 이용하여 자신이 원할 때 터트릴 수 있는 그래피티를 그려서 대상을 제압하는 근거리계열 용병입니다.

step1_title  = 그래피티 아티스트 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기가가능하며, 마지막 3타에서 그래피티를 그립니다.

step2_title  = 그래피티 아티스트 - 그래피티 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 전방에 그래피티를 그립니다. 그래피티는 최대 3개까지 동시 그릴 수 있으며 3개를 넘어갈 경우 최초 그려진 그래피티가 작동됩니다.

step3_title  = 그래피티 아티스트 - 그래피티 터트리기
step3_help   = 그래피티는 일정시간이 지나거나, 점프/대시/대시공격 점프공격 중 방어키(S)를 누르면 그래피티가 터지면서 대상을 살짝 띄웁니다.

step4_title  = 그래피티 아티스트 - 점프공격 (A →D →D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 대각선 아래로 스프레이를 뿌려 그래피티를 생성하면서 대상을 타격합니다. 총 2번 사용이 가능합니다.

step5_title  = 그래피티 아티스트 - 하이점프 (A 오래)
step5_help   = 점프키(A)를 오래 누르면 하이 점프가 발동됩니다. 하이 점프를 사용하면 일반 점프보다 높이 뛸 수 있어 높은 지형도 쉽고 빠르게 이동할 수 있습니다.

step6_title  = 그래피티 아티스트 - 대시 공격 (->-> →D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 스프레이를 뿌리며 대상을 공격합니다.

step7_title  = 그래피티 아티스트 - 대시 확장 공격 (->-> →D+D)
step7_help   = 대시 공격 후 바로 D키를 누르면 대상을 위로 띄우는 발차기 공격을 합니다. 대상을 공중으로 띄우기 때문에 콤보에 유용합니다.

step8_title  = 그래피티 아티스트 - 대시 공격 2(->-> →D 오래누름)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 오래 누르면 대상을 위로 띄우는 발차기 공격을 합니다

step9_title  = 그래피티 아티스트 - 스프레이 / 무기스킬(SD)
step9_help   = 스프레이(SD)는 빠르게 이동하면서 양 옆에 스프레이를 분사해 공격하는 스킬입니다. 방향키로 방향전환이 가능하며, 사용 중 A, S, D키 입력 시 스킬을 중지합니다.

step10_title = 그래피티 아티스트 - 크루 / 갑옷스킬(ASD)
step10_help  = 크루(ASD)은 자신은 엎드린 후 동료들을 불러서 원거리 공격을 하는 스킬입니다. 다운 및 피격 중 사용 가능하고 방향키 입력 시 해당방향으로 구르면서 일어납니다.

step11_title  = 그래피티 아티스트 - 힙합댄스 / 투구스킬(AD)
steP11_help   = 힙합댄스(AD)는 춤을 추면서 대상을 공격하는 스킬입니다 총 7번 띄움공격을 하며, 스킬 사용 중 D키-공격, S키 방어, A키-점프로 전환이 가능합니다.

step12_title  = 그래피티 아티스트 - 스파이 / 망토스킬(AS)
step12_help   = 스파이(AS)는 피격 중 사용가능한 스킬로 상대편의 공격을 받지 않는 위장상태가 됩니다. 대시 및 대상을 공격하거나 하이점프 및 이중점프 사용 시 스킬이 해지됩니다.

step13_title = 그래피티 아티스트 - 국민콤보 ①
step13_help  = ★크루(ASD) →힙합댄스(AD) 크루(ASD)로 대상을 경직 시킨 후 굴러서 대상에게 접근한 다음 힙합댄스(AD)로 마무리합니다.

step14_title = 그래피티 아티스트 - 국민콤보 ②
step14_help  = ★대시확장공격(->-> →D+D) →점프공격(A →D →D) 대시확장공격(->-> →D+D)으로 대상을 띄운 후 점프공격으로 타격 후 S키를 눌러 그래피티로 공격합니다.

step15_title = 그래피티 아티스트 - 국민콤보 ③
step15_help  = ★크루(ASD)→대시 공격2(->-> →D 오래누름)→기본공격→ 점프한 다음 S키→바로 점프공격 후 S키 → 힙합댄스(AD)→기본공격→점프한 다음 S키→바로 점프공격 후 S키


;------------------------/ 074. Hao-maru
[Set74]

max_step = 22

step0_title  = 하오마루 - 기본소개
step0_help   = 하오마루는 사무라이 스피릿츠 게임에 등장하는 캐릭터로 복어의 맹독을 바른 명검 하돈독을 이용해 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 하오마루 - 기본공격(D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 하오마루 - 선풍열참(D 오래누름)
step2_help   = D키를 오래 누르면 바닥을 타고가는 회오리를 발사합니다. 선풍열참에 맞은 대상은 띄움 상태가 되기 때문에 추가공격을 하기에 용이합니다.

step3_title  = 하오마루 - 열진참(->->)
step3_help   = 방향키를 빠르게 두 번 눌렀다 때면 전방으로 일정거리를 점프하여 강하게 대상을 베어버리는 공격을 합니다. 공격당한 대상은 경직상태가 됩니다.

step4_title  = 하오마루 - 질풍 호월참(->-> → D)
step4_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 3연속 올려베기를 합니다.

step5_title  = 하오마루 - 점프공격(A → D )
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 위에서 아래로 베기공격을 합니다. 점프공격은 공중에 뜬 대상을 공격할 때 유용합니다.

step6_title  = 하오마루 - 연참 (방어 성공시 바로 공격)
step6_help   = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 공격키(D)를 연속으로 입력 시 빠르게 검으로 연속 베기를 합니다.

step7_title  = 하오마루 - 커맨드 기능 ①
step7_help   = 기본공격, 대시공격, 특별공격, 반격, 점프착지, 커맨드 공격 중에 지정된 방향키를 연속으로 입력하면 커맨드 및 스킬 공격을 즉시 발동 시킬 수 있습니다.

step8_title  = 하오마루 - 커맨드 기능 ②
step8_help   = 커맨드에 사용되는 방향키는 상하좌우(↑↓←→) 4개이며 캐릭터 방향과 관계 없이 입력키 그대로 적용하여 커맨드 기능을 발동 시킵니다.

step9_title = 하오마루 - 호월참 ( → ↓)
step9_help  = 대시 공격 조작을 할때보다 빠르게 시전되는 호월참 공격이 발동합니다. 대시공격 조작과 마찬가지로 회전하면서 3연속 올려베기를 하며 대상을 공중에 띄웁니다.

step10_title = 하오마루 - 열진참 ( ← ↓)
step10_help  = 대시 조작 할때보다 빠르게 시전되는 열진참 공격이 발동됩니다. 대시 조작 시와 마찬가지로 대상을 잠시동안 경직 시키기 때문에 추가공격에 용이합니다.

step11_title = 하오마루 - 선풍열참 ( ↓ →)
step11_help  = 특별 조작을 사용할 때보다 빠르게 발동되는 선풍열참 공격이 발동됩니다. 특별 조작으로 사용할 때와 마찬가지로 대상을 공중에 띄웁니다.

step12_title = 하오마루 - 전방대시 ( → →)
step12_help  = 전방으로 짧은 거리를 빠르게 굴러서 이동합니다. 기습적으로 빠르게 이동하기 때문에 상대에게 접근할 때 유용합니다.

step13_title = 하오마루 - 후방대시 (← ←)
step13_help  = 후방으로 짧은 거리를 빠르게 이동합니다. 기습적으로 빠르게 이동하기 때문에 상대의 타이밍을 끊기에 유용합니다.

step14_title = 하오마루 - 엎드리기 ( ↓ ↓ )
step14_help  = 제자리에서 엎드립니다. 순간적으로 빠르게 엎드려 상대의 공격을 재빨리 피할 수 있습니다. 상대의 공격 타이밍을 빼앗을 수 있습니다.

step15_title  = 하오마루-천패봉신참 / 무기스킬(SD or ↓→↓)
step15_help   = 참패봉신참(SD)은 전방으로 전진하면서 5연속 베기 공격으로 대상을 공중에 띄우는 스킬입니다. (↓→↓) 커맨드를 사용하여 발동 시킬 수 있습니다.

step16_title  = 하오마루-천패처황참 / 갑옷스킬(ASD)
step16_help   = 천패처황참(ASD)은 강한 베기공격으로 대상을 드랍시키는 스킬입니다. 일정 확률로 대상의 무기를 드랍시킬 수 있습니다.

step17_title  = 하오마루-무기파괴 오의 / 투구스킬(AD)
step17_help   = 무기파괴 오의(AD)는 D키 연타를 통해 상대 무기를 드랍시키는 스킬입니다. 연타를 상대보다 많이 했을 때 무기를 드랍시키며, 스킬이 끝나면 상대를 밀쳐 냅니다.

step18_title = 하오마루 - 주공격 / 망토스킬(AS or ←↓←)
step18_help  = 주공격(AS)은 술병으로 상대를 타격하여 피격된 대상을 강한 경직상태로 만드는 스킬입니다. (←↓←) 커맨드를 사용하여 발동 시킬 수 있습니다.

step19_title = 하오마루 - 국민콤보 ①
step19_help  = ★주공격(AS) → 천패봉신참(SD) 주공격(AS)로 경직상태로 만든 후 천패봉신참(SD)로 마무리합니다.

step20_title = 하오마루 - 국민콤보 ②
step20_help  = ★주공격(AS)→천패봉신참(SD)→기본공격→호월참(→↓) 주공격(AS)으로 경직시키고 천패봉신참(SD)으로 띄우고 기본공격 후 호월참(→↓)으로 마무리합니다.

step21_title = 하오마루 - 국민콤보 ③
step21_help  = ★열진참(→→)→선풍열참(D오래)→선풍열참(↓→)→D+D +D→호월참(→↓)→ SD →D+D→주공격(←↓←)→선풍열참(D오래)→선풍열참(↓→)→ASD→D+D+D→열진참(→→)


