max_step = 18

step0_title  = 방탄소년단 - 기본소개
step0_help   = 방탄소년단은 검술과 총기술을 이용해 상대를 공격하고, 표식을 남겨 순간이동 하며, 제압하는 프리미엄 용병입니다.
                         
step1_title  = 방탄소년단 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 방탄소년단 - 대시공격1 (->-> → D)
step2_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 상대를 띄우는 공격을 합니다.
														   
step3_title  = 방탄소년단 - 대시공격2 (대시공격1 →D→D→D)
step3_help   = 대시공격1을 타격 성공시 상대를 띄우고, 추가 공격이 가능합니다. 최대 3발의 총알을 공중으로 발사 하는 공격을 합니다
               
step4_title  = 방탄소년단 - 대시공격3 (->-> → D 오래누름)
step4_help   = 대시 상태에서 공격키(D)를 오래 누르면 전방으로 검기를 발사하고, 검기 타격에 성공하면, 상대 앞으로 순간이동하고, 자동으로 타격을 1회 합니다.

step5_title  = 방탄소년단 - 대시공격4 (대시공격3 →D→D→D)
step5_help   = 대시공격3을 타격 성공시 상대를 띄우고, 전방으로 순간 이동 후 최대 3회의 추가 공격이 가능합니다.
                                       
step6_title  = 방탄소년단 - 점프공격1 (A →D 연타)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 검으로 대상을 공격을 합니다. 최대 4타 공격 가능하며, 4타는 다운 대상 공격이 가능합니다.

step7_title  = 방탄소년단 - 점프공격2(A →D 오래누름)
step7_help   = 점프 상태에서 공격키(D)를 오래 누르면 대상을 띄우는 공격을 합니다. 차징 시간이 짧아 빠른 발동이 가능하며, 사용자가 먼저 착지하여 후속타가 가능합니다.

step8_title  = 방탄소년단 - 점프 대시공격 (A → ->->)
step8_help   = 점프키(A)를 눌러 점프한 후 원하는 방향으로 방향키를 빠르게 두 번 누르면 공중에서 해당 방향으로 빠르게 이동하며 공격하는 점프공격이 발동됩니다.

step9_title  = 방탄소년단 - 검기발사 (D 오래누름)
step9_help   = 공격키(D)를 오래 누르면 전방으로 검기를 발사하고, 대상이 검기에 피격된 후 방어키(S)를 입력시 피격된 대상의 뒤로 순간이동 합니다.

step10_title = 방탄소년단 - 튕겨내기 (공격 받는 순간 방어)
step10_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step11_title = 방탄소년단 - 花樣年華 / 무기스킬(SD)
step11_help  = 花樣年華(SD)는 주변에 상대를 공격하고, 더 큰 범위로 상대에게 꽃기운을 뿌려, 일정시간 뒤 폭파되는 공격을 합니다. 다운 대상도 공격이 가능합니다.

step12_title = 방탄소년단 - DARK&WILD / 갑옷스킬(ASD)
step12_help  = DARK & WILD(ASD)은 주변에 상대에 어둠을 걸어 시야를 막은뒤에 어둠에 걸린 대상이 일정시간이 지난 뒤 추가 베기공격을 진행 됩니다.

step13_title = 방탄소년단 - DOPE / 투구스킬(AD)
step13_help  = DOPE(AD)은 자신이 타격이 안되는 스킬입니다. 방어가능 공격과 방어 파괴 공격 모두 회피가 가능합니다.

step14_title = 방탄소년단 - WAKE UP / 망토스킬(AS)
step14_help  = WAKE UP(AS)은 전방에 땅을 찍어, 파동으로 공격하는 스킬입니다. 누워있는 대상도 기립시키며, 추가 공격키(D)키 입력시 다단 히트 공격이 가능합니다.

step15_title = 방탄소년단 - 국민콤보 ①
step15_help  = ★대시공격4 (대시공격3 →D→D→D) → WAKE UP(AS) 대시공격으로 상대를 띄운 뒤 WAKE UP(AS) 스킬을 사용해 마무리 합니다.

step16_title = 방탄소년단 - 국민콤보 ②
step16_help  = ★花樣年華(SD)로 상대를 경직 시킨 뒤 → 대시공격4(대시공격3 →D→D→D) 로 상대를 띄운 뒤에 → WAKE UP(AS) 스킬로 마무리 합니다.

step17_title = 방탄소년단 - 국민콤보 ③
step17_help  = ★대시공격4 (대시공격3 →D→D→D)으로 상대를 띄운 뒤 → 검기발사(D 오래누름)로 상대를 피격 후 → S키를 입력해 점프공격으로 마무리합니다.


[Set174]
max_step = 20

step0_title  = 부두술사 - 기본소개
step0_help   = 부두술사는 좀비를 소환하여 상대를 감염 시키거나 폭발시켜 상대를 제압하는 레어용병입니다.

step1_title  = 부두술사 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 부두술사 - 좀비 소환 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 작은 좀비를 앞에 소환합니다. 소환된 좀비는 부두술사를 따라다니다가 상대가 있으면 상대에게 가서 좀비로 만드는 공격을 합니다.

step3_title  = 부두술사 - 좀비 소환 (D 오래누름)
step3_help   = 감염된 상대는 잠시동안 부두술사에게로 따라온 뒤 부두술사의 움직임을 따라하게 됩니다.

step4_title  = 부두술사 - 좀비 강화 (D 오래누름)
step4_help   = 소환된 좀비에 붙어서 공격키(D)를 오래 누르면 대형 좀비로 강화시킬 수 있습니다. 대형 좀비는 주변을 느려지게 하고, 방어를 무시하는 공격을 합니다.

step5_title  = 부두술사 - 좀비 강화 (D 오래누름)
step5_help   = 대형 좀비는 유지시간이 짧지만, 공격 성공 시마다 유지시간이 일정량 늘어나게 됩니다.

step6_title  = 부두술사 - 좀비 폭파 (D 오래누름)
step6_help   = 작은 좀비와 떨어져서 공격키(D)를 오래 누르거나 대형 좀비를 소환한 후 공격키(D)를 오래 누르면 방어를 무시하고 공격하는 좀비 폭파를 사용할 수 있습니다.

step7_title  = 부두술사 - 점프공격 (A → D → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 점프 공격이 가능합니다. 2회 공격이 가능하며 마지막 공격은 폭탄을 떨어트립니다.

step8_title  = 부두술사 - 공중 망자의 손 (A → D 오래누름)
step8_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 지면에서 좀비 손이 튀어나와 상대를 띄우는 공격을 합니다.

step9_title  = 부두술사 - 공중 망자의 손 (A → D 오래누름)
step9_help   = 좀비가 소환된 상태에서 공중 망자의 손을 사용하면 부두술사의 위치로 좀비를 소환할 수 있습니다.

step10_title = 부두술사 - 대시공격 (->-> → D → D)
step10_help  = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 경직시킨 후 당겨오는 공격을 합니다.

step11_title = 부두술사 - 대시 망자의 손 (->-> → D 오래누름)
step11_help  = 대시 상태에서 공격키(D)를 오래 누르면 전방에 좀비 손이 튀어나와 상대를 경직시키고 느려지게 하는 공격을 합니다.

step12_title = 부두술사 - 감염 (특수능력)
step12_help  = 부두술사의 기본 공격과 대시 공격, 점프 공격 1타에 피격 될 때마다 부두의 힘으로 조금씩 감염됩니다. 일정 중첩이 되면 좀비로 변하게 됩니다.

step13_title = 부두술사 - 망자들의 걸음  / 무기스킬 (SD)
step13_help  = 망자들의 걸음(SD)은 전진하는 좀비를 소환하여 상대를 공격하는 스킬로 방향전환이 가능하며, 최대 4번까지 보낼 수 있습니다.

step14_title = 부두술사 - 저주하는 인형  / 갑옷스킬 (ASD)
step14_help  = 저주하는 인형(ASD)는 범위 내의 상대에게 부두인형을 붙여서 연속 공격하는 스킬입니다.

step15_title = 부두술사 - 무덤에서 온 그대  / 투구스킬 (AD)
step15_help  = 무덤에서 온 그대(AD)는 원하는 지역에 좀비를 소환하여 공격하는 스킬입니다. 좀비에 피격된 상대도 좀비가 되어 상대를 공격합니다.

step16_title = 부두술사 - 나의 소리가 들려  / 망토스킬 (AS)
step16_help  = 나의 소리가 들려(AS)는 상대를 좀비로 만들어서 나의 행동을 따라하게 만드는 스킬입니다. 

step17_title = 부두술사 - 국민콤보 ①
step17_help  = 저주하는 인형(ASD) → 망자들의 걸음(SD) 저주하는 인형으로 상대가 움직이지 못하게 한 다음 망자들의 걸음으로 연속 공격해 마무리 합니다.

step18_title = 부두술사 - 국민콤보 ②
step18_help  = 저주하는 인형(ASD) → 공중 망자의 손(A → D 오래누름) → 점프공격(A → D → D) 저주하는 인형으로 공격 한 후 공중 망자의 손과 점프 공격으로 마무리합니다.

step19_title = 부두술사 - 국민콤보 ③
step19_help  = 대형 좀비 공격(D 오래누름) → 점프 공격(A → D →D) 대형 좀비가 공격하여 상대가 바운딩 되면 바로 점프해서 점프 공격으로 마무리 합니다.


[Set175]
max_step = 15

step0_title  = 서퍼 - 기본소개
step0_help   = 서퍼는 보드를 타고 파도를 타며 상대를 밀어내거나 일으켜 세워 제압하는 레어용병입니다.

step1_title  = 서퍼 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 서퍼 - 파도 타기 (D 누름유지)
step2_help   = 공격키(D)를 누름 유지하면 파도 타는 상태가 됩니다 이 때는 전진과 상승이 자동으로 이루어지며, 방향 전환이 가능하며, 달리기, 점프 중 사용 가능합니다.

step3_title  = 서퍼 - 전진 파도 (D 누름떼기)
step3_help   = 공격키(D)를 누름 유지 중 누름떼기 시 자신은 점프 상태가 되고, 타고 있던 파도는 앞으로 나가게 됩니다. 파도는 전진 할수록 하강합니다.

step4_title  = 서퍼 - 점프공격 - (A →D + D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이 때 공격키(D)를 누르면 발로 공격합니다. 이때 추가로 D키를 눌러 추가공격할 수 있습니다. 최대 2연타가 가능합니다.

step5_title = 서퍼 - 파도 몰이 (패시브)
step5_help  = 대시 달리기를 사용시 서핑을 타는 상태가 됩니다. 이때 유지한 시간에 따라 3단계로 강화됩니다. 강화후 대시공격시 파도 거리와 밀림, 데미지가 증가합니다.

step6_title  = 서퍼 - 대시공격1 (->-> → D)
step6_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키를 누르면 대상을 강하게 밀쳐내는 대시 공격이 가능합니다.

step7_title  = 서퍼 - 튕겨내기 (공격 받는 순간 방어)
step7_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step8_title  = 서퍼 - 해일 생성  / 무기스킬 (SD)
step8_help   = 해일 생성(SD)은 자신의 뒤로 부터 거대한 크기의 해일을 소환해 전방의 상대를 쓸어버리는 공격을 합니다.

step9_title  = 서퍼 - 파도타기  / 갑옷스킬 (ASD)
step9_help   = 파도타기(ASD)는 서핑을 타며, 추가 공격키(D) 입력시 전방으로 상대를 공격하는 파도를 발생시켜 공격합니다.

step10_title = 서퍼 - 파도생성  / 투구스킬 (AD)
step10_help  = 파도생성(AD)은 서핑보드를 타며, 추가 공격키(D) 누름 유지시 상대를 휩쓰는 파도를 생성하여 공격합니다.

step11_title = 서퍼 - 파도풀  / 망토스킬 (AS)
step11_help  = 파도풀(AS)은 튜브와 파도를 타고 다니며, 주변의 대상을 연속적으로 공격하는 스킬입니다.

step12_title = 서퍼 - 국민콤보 ①
step12_help  = 파도타기(ASD) → 파도생성(AD) 파도타기(ASD)로 상대를 밀어낸 뒤 파도생성(AD)의 큰 파도로 마무리 공격합니다.

step13_title = 서퍼 - 국민콤보 ②
step13_help  = 기본공격 (D → D → D) → 파도풀(AS) 기본공격 (D → D → D)으로 상대를 넘어트린 뒤 파도풀(AS)스킬 공격으로 마무리 합니다.

step14_title = 서퍼 - 국민콤보 ③
step14_help  = 기본공격(D→D→D)→점프공격(A→D+D)→해일생성(SD) 기본공격 으로 상대를 띄운뒤 점프공격 후 해일 생성(SD)스킬로 마무리 합니다.


[Set176]

max_step = 19

step0_title  = 버블파이터 - 기본소개
step0_help   = 버블파이터는 물총을 발사해 상대를 버블 상태로 만들고 터트려서 제압하는 프리미엄 원거리 용병입니다.

step1_title  = 버블파이터 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연속 발사를 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 버블파이터 - 연속발사 (D 누름유지)
step2_help   = 공격키(D)를 누르고 있으면, 조준점으로 물총을 발사 합니다. 공격키(D)를 떼거나 총알이 모두 소모될 때까지 유지됩니다. 대시 중에도 사용이 가능합니다.

step3_title  = 버블파이터 - 연속발사 (D 누름유지)
step3_help   = 공격키(D)를 누르고 있는 상태에서 점프키(A)를 누르면 발사 상태를 유지하면서 점프하게 됩니다. 착지 시에도 공격키(D)를 누르고 있으면 발사 상태가 유지됩니다.

step4_title  = 버블파이터 - 구르기 (조작 중 ->->)
step4_help   = 공격 중 방향키를 빠르게 두 번 누르면 해당 방향으로 이동하는 구르기를 사용 할 수 있습니다. 기본, 점프, 대시, 특별공격 중 모두 사용이 가능합니다. 

step5_title  = 버블파이터 - 점프공격 (A → D → D → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 전방으로 물총을 발사 합니다. 최대 3연속 발사까지 가능합니다.

step6_title  = 버블파이터 - 점프 연속발사 (A → D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르고 있으면 조준점으로 물총을 연속 발사합니다.

step7_title  = 버블파이터 - 물폭탄 투척 (A → S)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 방어키(S)를 누르면 전방으로 물폭탄을 투척 합니다.

step8_title  = 버블파이터 - 대시공격 (->-> → D → D → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 전방으로 물총을 발사합니다. 3회까지 가능합니다.

step9_title  = 버블파이터 - 버블 상태
step9_help   = 버블파이터의 공격에 7회 피격되면 상대는 버블 상태가 됩니다. 느리게 이동만 할 수 있으며, 유지시간이 다하거나 아군이 공격으로 풀어야만 해제됩니다.

step10_title = 버블파이터 - 버블 팡 (버블에 붙어서 D 오래누름)
step10_help  = 버블 상태가 된 상대에게 붙어서 공격키(D)를 오래누르면 발로 올려차면서 상대를 멀리 날려보내는 버블 팡 공격을 할 수 있습니다.

step11_title = 버블파이터 - 총알 게이지
step11_help  = 버블파이터는 물폭탄 투척을 제외한 모든 공격이 게이지를 소모합니다. 모두 사용 후 공격키(D)를 누르거나 방어키(S)를 오래 눌러서 장전할 수 있습니다.

step12_title = 버블파이터 - 튕겨내기 (공격 받는 순간 방어)
step12_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step13_title = 버블파이터 - 공중 폭격 / 무기스킬(SD)
step13_help  = 공중 폭격(SD)은 지원요청을 통해 전방에 미사일을 투하하는 스킬입니다. 피격된 상대는 중첩 수와 상관없이 바로 버블 상태가 됩니다.

step14_title = 버블파이터 - 배리어 / 갑옷스킬(ASD)
step14_help  = 배리어(ASD)는 총알류들을 막아낼 수 있는 보호막을 설치하는 스킬입니다. 밖에서 오는 총알을 막아낼 순 있지만 안에 들어와서 발사하는 것은 막지 못합니다.

step15_title = 버블파이터 - 팀 구급약 / 투구스킬(AD)
step15_help  = 팀 구급약(AD)은 자신과 범위 내의 팀원들의 HP를 회복 시켜주는 스킬입니다. 자신과 팀원은 회복되는 HP속도가 각각 다릅니다.

step16_title = 버블파이터 - 버블 터렛 / 망토스킬(AS)
step16_help  = 버블 터렛(AS)은 자동 공격하는 터렛을 마법진으로 지정해서 설치하는 스킬입니다. 터렛의 공격도 7회 피격 시 버블에 갇히게 됩니다.

step17_title = 버블파이터 - 국민콤보 ①
step17_help  = ★공중 폭격(SD) → 버블 팡(D 오래누름) 공중 폭격으로 상대를 버블 상태로 만든 다음 근접한 후 공격키(D)를 오래 눌러서 버블 팡으로 날려 보냅니다.

step18_title = 버블파이터 - 국민콤보 ②
step18_help  = ★공중 폭격(SD) → 버블 팡(D 오래누름) → 물폭탄 투척(A → S) 공중 폭격과 버블 팡으로 상대를 날린 후 바로 물폭탄을 던져 마무리 합니다.


[Set177]

max_step = 17

step0_title  = 홍진영 - 기본소개
step0_help   = 홍진영은 연쇄적으로 퍼져나가는 번개를 발사해 상대를 제압하는 프리미엄 용병입니다.

step1_title  = 홍진영 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 홍진영 - 연쇄번개 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 전방으로 번개를 발사합니다. 첫번째 번개에 맞은 대상이 있으면 근처의 다른 대상에게 번개가 이어져 나갑니다.

step3_title  = 홍진영 - 연쇄번개 (D 오래누름 → D → D → D → D)
step3_help   = 연쇄번개를 발사한 후 이어서 공격키(D)를 연타하면 계속 번개를 발사할 수 있습니다. 발사 할수록 튕겨나가는 번개의 횟수가 증가합니다. 최대 5번까지 튕깁니다.

step4_title  = 홍진영 - 매력발산 (연쇄번개 중 S)
step4_help   = 연쇄번개를 발사하는 중에 방어키(S)를 누르면 전방으로 하트를 보내서 상대를 자신 앞으로 끌고 옵니다. 최대 5명까지 가능합니다.

step5_title  = 홍진영 - 점프공격 (A → D → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 무기를 휘둘러서 상대를 공격합니다. 최대 2회 공격이 가능합니다.

step6_title  = 홍진영 - 점프 연쇄번개 (A → D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 대각선 아래로 번개를 발사합니다. 다운된 대상을 기립시킬 수 있으며, 최대 5명까지 튕깁니다.

step7_title  = 홍진영 - 대시공격 (->-> → D → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 상대를 약경직 시키는 대시 공격이 가능합니다.

step8_title  = 홍진영 - 슬라이딩 (->-> → D 오래누름 → D)
step8_help   = 대시 중 공격키(D)를 오래 누르면 상대를 관통하여 전진하는 슬라이딩이 가능합니다. 이후 공격키(D)를 한번 더 누르면 상대를 바운딩 시키는 공격이 가능합니다.

step9_title  = 홍진영 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격 권을 가져올 수 있게 됩니다.

step10_title = 홍진영 - 사랑의 배터리 / 무기스킬(SD)
step10_help  = 사랑의 배터리(SD)는 자신의 위치에 번개가 떨어져 범위로 상대를 감전시키는 스킬입니다. 최대 4번 떨어지며, 피격 중에도 사용할 수 있습니다.

step11_title = 홍진영 - 너어어~ / 갑옷스킬(ASD)
step11_help  = 너어어~(ASD)는 타겟을 지정하여 상대를 자신에게 뛰어오도록 만드는 스킬입니다. A, S키로 타겟을 변경할 수 있습니다.

step12_title = 홍진영 - 비타민C / 투구스킬(AD)
step12_help  = 비타민C(AD)는 자신과 범위 내의 팀원들의 스킬게이지를 회복 시켜주는 스킬입니다. 회복되는 장비 부위는 랜덤으로 지정됩니다.

step13_title = 홍진영 - 트로트 싱어 / 망토스킬(AS)
step13_help  = 트로트 싱어(AS)는 마이크를 들고 노래를 불러서 상대를 춤추게 만드는 스킬입니다. 스킬 사용 후 이동하면서 사용할 수도 있습니다.

step14_title = 홍진영 - 국민콤보 ①
step14_help  = ★너어어~(ASD) → 사랑의 배터리(SD) 너어어~로 상대를 오게 만든 다음 사랑의 배터리로 감전시켜서 마무리 합니다.

step15_title = 홍진영 - 국민콤보 ②
step15_help  = ★너어어~(ASD) → 연쇄번개(D 오래누름) 너어어~로 상대를 오게 만든 다음 연쇄 번개로 연속공격하여 마무리 합니다.

step16_title = 홍진영 - 국민콤보 ③
step16_help  = ★트로트 싱어(AS) → 슬라이딩(->-> → D 오래누름 → D) → 연쇄번개(D 오래누름 → Dx4) → 매력발산(연쇄번개 중 S) → 기본공격(D → D → D)로 마무리 합니다.


[Set178]

max_step = 22

step0_title  = 우리엘 - 기본소개
step0_help   = 심판관 우리엘은 정화의 불꽃으로 상대를 끌어당겨서 공격하고 자신의 해로운 효과를 제거하며 상대를 제압하는 유니크 용병입니다.

step1_title  = 우리엘 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 우리엘 - 징벌 (D 오래누름)
step2_help   = 공격키(D)를 오래 누르면 전방으로 전진이동하는 징벌이 발동됩니다. 상대를 관통하며 공격하고, 최대 거리까지 도달하면 점프상태로 전환됩니다.

step3_title  = 우리엘 - 징벌 추가 공격 (D 오래누름 → D)
step3_help   = 징벌 발동 후 점프하기 전까지 공격키(D)를 입력하면 상대를 자신쪽으로 끌고온 후 위로 띄우는 추가 공격을 할 수 있습니다.

step4_title  = 우리엘 - 점프공격 (A → D → D → D)
step4_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 무기를 휘둘러서 상대를 공격합니다. 최대 3회 공격이 가능합니다.

step5_title  = 우리엘 - 점프 대시 공격 (A → ->->)
step5_help   = 점프중에 방향키를 빠르게 2번 입력하면 전진하며 공격하는 점프 대시가 발동됩니다. 최대 두번까지 가능하며 발동 이후 점프 공격 가능 횟수가 초기화 됩니다.

step6_title  = 우리엘 - 공중 징벌 (A → D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 대각선 아래로 이동 공격하는 공중 징벌이 발동됩니다. 지면에 닿으면 다시 점프 상태로 전환됩니다.

step7_title  = 우리엘 - 공중 징벌 추가 공격 (A → D 오래누름 → D)
step7_help   = 공중 징벌 발동 후 점프하기 전까지 공격키(D)를 입력하면 상대를 자신쪽으로 끌고온 후 위로 띄우는 추가 공격을 할 수 있습니다.

step8_title  = 우리엘 - 부유 (A → S)
step8_help   = 점프중에 방어키(S)를 누르면 공중에서 멈춰있을 수 있습니다. 지속시간이 끝나거나 키를 떼면 낮게 점프하며, 점프공격, 점프대시의 사용 개수가 초기화 됩니다.

step9_title  = 우리엘 - 대시 공격 (->-> → D → D → D)
step9_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 빠르게 3연타하는 대시 공격이 가능합니다.

step10_title = 우리엘 - 대시 징벌 (->-> → D 오래누름)
step10_help  = 대시중 공격키(D)를 오래 누르면 대각선 위로 이동하는 징벌이 발동됩니다. 상대를 관통하며 공격하고, 최대 거리까지 도달하면 점프상태로 전환됩니다.

step11_title = 우리엘 - 대시 징벌 추가 공격 (->-> → D 오래누름 → D)
step11_help  = 대시 징벌 발동 후 점프하기 전까지 공격키(D)를 입력하면 상대를 자신쪽으로 끌고온 후 위로 띄우는 추가 공격을 할 수 있습니다.

step12_title = 우리엘 - 반격 (방어 성공시 바로 공격)
step12_help  = 공격을 방어한 후 바로 공격을 하면 반격이 발동합니다. 강공격을 반격하는 경우에는 반격의 성공률이 높지만, 연타 약공격을 반격하면 실패할 확률이 높습니다.

step13_title = 우리엘 - 보호 (피격 중 SD)
step13_help  = 피격 중 SD키를 입력하면 게이지를 소모하여 즉시 칼을 내리쳐서 상대를 밀쳐내고 걸려있는 모든 해로운 효과를 제거합니다.

step14_title = 우리엘 - 게이지
step14_help  = 게이지는 기본, 걷기, 달리기 상태에서 회복되며, 각 상태의 징벌과 피격 중 보호공격 사용시 차감됩니다.

step15_title = 우리엘 - 심판의 날 / 무기스킬(SD)
step15_help  = 심판의 날(SD)은 천천히 내려오는 큰 불덩이와 상대를 찾아가서 공격하는 작은 불덩이를 소환하여 공격하는 스킬입니다. 작은 불덩이에 피격시 시전자 위치로 끌려옵니다.

step16_title = 우리엘 - 심판 / 갑옷스킬(ASD)
step16_help  = 심판(ASD)은 범위 안에 있는 상대를 일정시간 후 폭발하게 만들어서 날리는 스킬입니다. 발동 후 범위에 있었으면 이후에 범위를 벗어나도 폭발이 이루어집니다.

step17_title = 우리엘 - 심판의 화염 / 투구스킬(AD)
step17_help  = 심판의 화염(AD)은 자신과 범위 내의 팀원들에게 화염의 힘을 부여하여 자동으로 공격하는 스킬입니다. 효과를 받은 팀원 수에 따라 발사되는 화염의 개수가 달라집니다.

step18_title = 우리엘 - 심판의 불꽃 / 망토스킬(AS)
step18_help  = 심판의 불꽃(AS)은 비행 상태로 전환하며 다수의 불꽃을 소환하는 스킬입니다. A키와 S키로 고도 조절을 할 수 있으며 범위 내 상대를 자동으로 공격합니다.

step19_title = 우리엘 - 국민콤보 ①
step19_help  = ★심판의 날(SD) → 심판의 불꽃(AS) 심판의 날로 상대를 연속 공격한 후 심판의 불꽃으로 날아올라 다시 연속공격하여 마무리 합니다.

step20_title = 우리엘 - 국민콤보 ②
step20_help  = ★심판의 날(SD) → 심판의 화염(AD) → 심판의 불꽃(AS) 심판의 날로 상대를 넘어트리고, 심판의 화염으로 자동 연속공격한 뒤 심판의 불꽃으로 마무리 합니다.

step21_title = 우리엘 - 국민콤보 ③
step21_help  = ★심판의 날(SD) → 기본공격(D→D→D→D) → 캔슬점프(공격 중 A) → 점프공격(A→D→D→D) → 점프대시(A→->->) → 점프공격(A→D→D→D)으로 마무리 합니다.



[Set179]

max_step = 18

step0_title  = 패트리어트 - 기본소개
step0_help   = 패트리어트는 미사일 런쳐를 통해 공중에 있는 상대를 요격하여 제압하는 일반용병입니다.

step1_title  = 패트리어트 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 패트리어트 - 방어체계 (D 누름유지)
step2_help   = 공격키(D)를 오래 누르고 있으면 방어체계 상태로 전환됩니다. 범위 안에 떠있는 상대가 있으면 타겟이 지정되고, 이때 공격키(D)를 떼면 요격 미사일이 발사됩니다.

step3_title  = 패트리어트 - 방어체계 (D 누름유지)
step3_help   = 방어체계를 유지하는 동안 게이지가 지속적으로 차감됩니다. 공격키(D)를 떼면 게이지가 추가로 소모되고, 유지 중에 점프키(A)를 눌러 취소할 수 있습니다.

step4_title  = 패트리어트 - 방어체계 (D 누름유지)
step4_help   = 방어체계에 피격된 상대는 일정시간 동안 패시브, 반패시브 스킬을 사용할 수 없습니다.

step5_title  = 패트리어트 - 점프공격 (A → D)
step5_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 회전하면서 상대를 2연속 공격합니다. 상대가 공중에서 맞으면 바운딩되어 떨어집니다.

step6_title  = 패트리어트 - 지면강타 (A → D 오래누름)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 지면으로 착지하면서 강한 충격을 주는 지면강타 공격이 발동합니다.

step7_title  = 패트리어트 - 대시 공격 (->-> → D → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 빠르게 2연타하는 대시 공격이 가능합니다.

step8_title  = 패트리어트 - 지대지 미사일 (->-> → D 오래누름)
step8_help   = 대시중 공격키(D)를 오래 누르면 전방으로 미사일을 발사하는 지대지 미사일을 발사합니다. 추가 공격키(D) 입력으로 최대 2회 더 발사 할 수 있습니다.

step9_title  = 패트리어트 - 튕겨내기 (공격 받는 순간 방어)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면\n상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격\n권을 가져올 수 있게 됩니다.

step10_title = 패트리어트 - 게이지
step10_help  = 게이지는 기본, 걷기, 달리기 상태에서 회복됩니다.

step11_title = 패트리어트 - 안티 에어 디펜스 / 무기스킬(SD)
step11_help  = 안티 에어 디펜스(SD)는 지면을 강하게 내리쳐서 띄운 후 공중 요격 미사일로 상대를 연타하는 스킬입니다. 스킬 사용 후 공격키(D)를 연타해야 합니다.

step12_title = 패트리어트 - 일렉트론 웨이브 / 갑옷스킬(ASD)
step12_help  = 일렉트론 웨이브(ASD)는 전자파를 발산해 범위 안 상대의 HP를 일정 간격으로 계속 깎는 스킬입니다. 방어로 막을 수 없으며 범위를 벗어나야만 해제됩니다.

step13_title = 패트리어트 - 디텍트 레이더 / 투구스킬(AD)
step13_help  = 디텍트 레이더(AD)는 원하는 위치에 레이더를 설치하고, 레이더 주변에서 스킬을 사용하면 피해를 입게 만드는 스킬입니다.

step14_title = 패트리어트 - I.C.B.M / 망토스킬(AS)
step14_help  = I.C.B.M(AS)은 원거리로 핵폭탄을 발사하여 피해를 주는 스킬입니다. 사용 후 방향키로 위치를 조정할 수 있으며, 핵폭탄이 떨어진 지역은 방사능으로 오염됩니다.

step15_title = 패트리어트 - 국민콤보 ①
step15_help  = ★안티 에어 디펜스(SD) → I.C.B.M(AS) 안티 에어 디펜스로 연타한 뒤 I.C.B.M으로 폭발시켜 마무리 합니다.

step16_title = 패트리어트 - 국민콤보 ②
step16_help  = ★I.C.B.M(AS) → 방어체계(D 오래누름) I.C.B.M으로 상대를 띄운 후 방어체계로 조준 한 뒤 떨어져서 바운딩 되는 타이밍에 발사하여 마무리 합니다.

step17_title = 패트리어트 - 국민콤보 ③
step17_help  = ★지면강타(A → D 오래누름) → 방어체계(D 오래누름) → 기본공격(D → D → D) 지면강타로 띄운 후 방어체계로 요격하고 기본공격으로 마무리 합니다. 



[Set180]

max_step = 19

step0_title  = 풍신 - 기본소개
step0_help   = 풍신은 바람을 이용해 상대를 공중으로 띄우고 공격하여 제압하는 레어용병입니다.

step1_title  = 풍신 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 풍신 - 게이지
step2_help   = 게이지는 공격 상태일 때를 제외한 모든 상태일 때 회복됩니다.

step3_title  = 풍신 - 바람의 씨앗 ① (D 누름유지)
step3_help   = 공격키(D)를 오래 누르고 있으면 바람 소환 차징 상태로 전환됩니다. 유지 중에 이동이 가능하며 방어키(S)를 눌러 취소할 수 있습니다.

step4_title  = 풍신 - 바람의 씨앗 ②  (D 떼기)
step4_help   = 공격키(D)를 떼면 전방으로 바람의 씨앗이 발사 되고, 게이지가 소모 됩니다. 바람의 씨앗은 최대 이동거리 이상으로 나아가면 사라집니다.

step5_title  = 풍신 - 바람의 씨앗 ③ (D 누름)
step5_help   = 공격키(D)를 누르면 바람의 씨앗이 정지하고 해당 위치에 회오리가 생성 됩니다. 회오리에 맞은 상대는 공중으로 뜨고 자신의 위치 근처로 떨어지게 됩니다.  

step6_title  = 풍신 - 점프공격 (A → D → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 주먹을 휘둘러서 상대를 공격합니다. 최대 2회 공격이 가능하며, 2타는 상대를 바운딩 시키는 공격을 합니다.

step7_title  = 풍신 - 살랑바람 (A → D 오래누름)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 오래 누르면 대각선 아래로 회오리를 발사합니다. 다운 대상도 공격이 가능하며 상대를 띄우는 공격을 합니다.

step8_title  = 풍신 - 대시 공격 (->-> → D → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 최대 2연타를 하는 대시 공격이 가능합니다.

step9_title  = 풍신 - 풍신의 진격 (->-> → D 오래누름)
step9_help   = 대시중 공격키(D)를 오래 누르면 풍신의 진격 상태로 변신합니다. 이동할 수 있으며 충돌한 상대를 연타하며 띄우는 공격을 합니다. 방어키(S)로 취소가 가능합니다.

step10_title = 풍신 - 풍신의 진격 추가 공격 (->-> → D 오래누름 → A)
step10_help  = 풍신의 진격 상태 도중 점프키(A)를 누르게 되면 대각선 위로 공격을 하며, 점프 상태가 됩니다.

step11_title = 풍신 - 튕겨내기 (공격 받는 순간 방어)
step11_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step12_title = 풍신 - 거스트 / 무기스킬(SD)
step12_help  = 거스트(SD)는 거대한 돌풍을 일으켜 범위내의 상대를 연타 후 공중으로 띄우는 스킬입니다.

step13_title = 풍신 - 타이푼 / 갑옷스킬(ASD)
step13_help  = 타이푼(ASD)은 전방으로 회전하여 연타 하는 공격을 하며, 주변의 상대에게 회오리를 발사하는 공격을 하는 스킬입니다.

step14_title = 풍신 - 볼텍스 / 투구스킬(AD)
step14_help  = 볼텍스(AD)는 8방향으로 유도 회오리를 발사하고, 자신은 회오리로 변신하여 이동하며 상대를 공격하고 멀리 날려버리는 스킬입니다. 

step15_title = 풍신 - 트위스터 / 망토스킬(AS)
step15_help  = 트위스터(AS)는 자신에게 8방향에서 회오리가 몰려들게 하는 공격을 하는 스킬입니다.  

step16_title = 풍신 - 국민콤보 ①
step16_help  = ★타이푼(ASD) → 거스트(SD) 타이푼으로 상대를 기절시킨 후 거스트로 연타하여 마무리합니다.

step17_title = 풍신 - 국민콤보 ②
step17_help  = ★거스트(SD) → 타이푼(ASD) → 볼텍스(AD) 거스트로 상대를 연타하고 띄운 후 타이푼으로 상대를 기절시키고 볼텍스로 상대를 날려 마무리 합니다. 

step18_title = 풍신 - 국민콤보 ③
step18_help  = ★바람의 씨앗(D 오래누름 →D떼기 →D누름) → 타이푼(ASD) → 기본공격(D → D → D) 바람의 씨앗으로 상대를 띄운 후 타이푼으로 기절 시키고 기본공격으로 마무리 합니다.


[Set181]

max_step = 17

step0_title  = 워프 - 기본소개
step0_help   = 워프는 상대에게 순간이동하여 같이 순간이동하거나 상대만 순간이동시켜 제압하는 일반 용병입니다.

step1_title  = 워프 - 기본공격 (D → D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 4연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 워프 - 게이지
step2_help   = 게이지는 대기, 걷기, 달리기 상태에서 회복되며, 첫 순간이동 시 1개씩 게이지를 소모합니다.

step3_title  = 워프 - 순간이동 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 전방의 가까운 상대 뒤로 순간이동 합니다. 이후 추가 공격키(D) 입력을 통해 2회 추가 공격을 할 수 있으며 점프 중에도 사용이 가능합니다.

step4_title  = 워프 - 추가 순간이동 (D 오래누름 → A)
step4_help   = 첫 순간이동 이후 점프키(A)를 누르면 상대를 잡고 위로 같이 순간이동 합니다. 순간이동 추가 공격 중에도 사용할 수 있으며, 이동이 끝나면 점프 상태로 전환됩니다.

step5_title  = 워프 - 타겟 순간이동 (D 오래누름 → ->->)
step5_help   = 첫 순간이동 이후 대시키를 입력하면 입력한 방향쪽으로 상대를 순간이동 시킵니다. 순간이동 추가 공격 중에도 사용할 수 있습니다.

step6_title  = 워프 - 점프공격 (A → D → D)
step6_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 장갑과 단검을 휘둘러서 상대를 공격합니다. 최대 2회 공격이 가능합니다.

step7_title  = 워프 - 대시 공격 (->-> → D → D)
step7_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상을 최대 2연타를 하는 대시 공격이 가능합니다.

step8_title  = 워프 - 대시 순간이동 (->-> → D 오래누름)
step8_help   = 대시중 공격키(D)를 오래 누르면 전방으로 빠르게 전진하며 상대를 공격합니다. 상대가 피격 됐을 경우 상대방 뒤로 순간이동 합니다.

step9_title  = 워프 - 튕겨내기 순간이동 (공격 받는 순간 방어 + D)
step9_help   = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되며 이때 공격키(D)를 누르면 상대 뒤로 순간이동 합니다.

step10_title = 워프 - 에어드롭 / 무기스킬(SD)
step10_help  = 에어드롭(SD)은 지면을 내려쳐서 상대를 빨아들인 후 위로 띄워 올리는 스킬입니다. 누워있는 상대도 공격할 수 있습니다.

step11_title = 워프 - 블링크 / 갑옷스킬(ASD)
step11_help  = 블링크(ASD)는 가까운 상대 뒤로 순간이동하여 공격하는 스킬입니다. 기본, 대시, 점프 중에는 1개의 게이지를 소모하며, 피격, 다운 중에 사용하면 2개를 소모합니다.

step12_title = 워프 - 포탈 러쉬 / 투구스킬(AD)
step12_help  = 포탈 러쉬(AD)는 전진하며 상대를 공격한 뒤 원하는 위치로 같이 순간이동 할 수 있는 스킬입니다. 일정 시간안에 위치를 지정하지 않으면 상대가 취소할 수 있습니다.

step13_title = 워프 - 일루젼 블레이드 / 망토스킬(AS)
step13_help  = 일루젼 블레이드(AS)는 단검을 던져서 상대에게 순간이동 하는 스킬입니다. 상대가 피격되면 자동으로 순간이동하며, 피격 전이면 점프키(A)로 할 수 있습니다.

step14_title = 워프 - 국민콤보 ①
step14_help  = ★일루젼 블레이드(AS) → 에어드롭(SD) 일루젼 블레이드로 상대 뒤로 이동한 다음 에어드롭으로 마무리 합니다.

step15_title = 워프 - 국민콤보 ②
step15_help  = ★일루젼 블레이드(AS) → 포탈 러쉬(AD) → 에어드롭(SD) 일루젼 블레이드로 상대를 경직시킨 다음 포탈 러쉬로 이동 후 에어 드롭으로 마무리 합니다.

step16_title = 워프 - 국민콤보 ③
step16_help  = ★일루젼 블레이드(AS)로 상대를 경직 시킨 후 순간이동(D 오래누름 → D → D) → 추가 순간이동(D 오래누름 A)으로 공중으로 이동한 뒤 점프공격(A → D → D)



[Set182]

max_step = 17

step0_title  = 루돌프 - 기본소개
step0_help   = 루돌프는 썰매를 끌고 다니면서 빙판을 생성하여 상대를 미끄러지게 하거나 눈덩이로 눈사람을 만들어 상대를 제압하는 레어용병입니다.

step1_title  = 루돌프 - 기본공격 (D → D → D)
step1_help   = 공격키(D)를 연속해서 누르면 3연타 공격을 합니다. 특히, 연타를 끊은 후 첫타부터 다시 공격하는 끊어치기 를 활용하면 기본 전투에서 우위를 차지할 수 있습니다.

step2_title  = 루돌프 - 게이지
step2_help   = 게이지는 대기, 걷기, 달리기 상태에서 회복되며, 썰매를 소환할 때 1개의 게이지를 소모합니다.

step3_title  = 루돌프 - 썰매소환 (D 오래누름)
step3_help   = 공격키(D)를 오래 누르면 눈사람이 타고 있는 썰매를 소환합니다. 자동 이동되며, 방향키를 통해 방향을 전환할 수 있습니다. 점프 중에도 사용이 가능합니다.

step4_title  = 루돌프 - 빙판생성 (D 오래누름 → D)
step4_help   = 썰매를 소환한 상태에서 공격키(D)를 누르면 눈사람이 눈덩이를 던져서 바닥에 빙판을 생성합니다. 빙판 위에서는 대시를 하면 미끄러지며, 마찰력이 매우 적습니다.

step5_title  = 루돌프 - 썰매 상승 (D 오래누름 → A)
step5_help   = 썰매를 소환한 상태에서 점프키(A)를 누르면 위로 상승하며, 피격 시 눈사람으로 변하는 큰 눈덩이를 떨어트립니다 단, 동물은 변하지 않습니다.

step6_title  = 루돌프 - 썰매 하강 (D 오래누름 → S)
step6_help   = 썰매를 소환한 상태에서 방어키(S)를 누르면 아래로 하강하게 됩니다. 하강 시 루돌프는 머리를 들이밀면서 박치기를 합니다.

step7_title  = 루돌프 - 점프공격 (A → D → D)
step7_help   = 점프키(A)를 누르면 점프가 발동되며 이때 공격키(D)를 누르면 손을 휘둘러서 상대를 공격합니다. 최대 2회 공격이 가능합니다.

step8_title  = 루돌프 - 대시 공격 (->-> → D → D)
step8_help   = 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 발동되며 달리는 중에 공격키(D)를 누르면 대상에게 최대 2연타를 하는 대시 공격이 가능합니다.

step9_title  = 루돌프 - 박치기 (->-> → D 오래누름)
step9_help   = 대시중 공격키(D)를 오래 누르면 전방으로 빠르게 전진하며 상대를 들이박습니다. 피격된 상대는 크게 뒤로 날아가게 됩니다.

step10_title = 루돌프 - 튕겨내기 (공격 받는 순간 방어)
step10_help  = 상대의 공격이 들어오는 순간에 맞추어 방어에 성공하면 상대가 뒤로 튕겨져나가는 효과가 발동되어 상대의 공격권을 가져올 수 있게 됩니다.

step11_title = 루돌프 - 하늘에서 눈이 내려 와요~ / 무기스킬(SD)
step11_help  = 하늘에서 눈이 내려 와요~(SD)는 넓은 지역에 눈을 내리게 하여 바닥에 빙판을 생성하는 스킬입니다. 빙판의 효과는 썰매로 생성한 것과 동일합니다.

step12_title = 루돌프 - 산타의 선물 / 갑옷스킬(ASD)
step12_help  = 산타의 선물(ASD)은 선물 상자를 뿌리면서 피격된 대상이 자신을 따라오도록 만드는 스킬입니다. 시전자는 드랍존 이동이 가능하지만 피격자는 바로 떨어지게 됩니다.

step13_title = 루돌프 - 손이 시려워 / 투구스킬(AD)
step13_help  = 손이 시려워(AD)는 눈보라를 일으켜 상대를 눈사람으로 만드는 스킬입니다. 여러번 피격될 경우 큰 눈사람이 되어 오랫동안 움직일 수 없게 됩니다.

step14_title = 루돌프 - 썰매를타고 / 망토스킬(AS)
step14_help  = 썰매를타고(AS)는 썰매를 직접 타고다니면서 선물을 떨어트려 공격하는 스킬입니다. 스노우타운의 작은 몬스터들도 같이 소환됩니다.

step15_title = 루돌프 - 국민콤보 ①
step15_help  = ★손이 시려워(AD) → 산타의 선물(ASD) 손이 시려워로 상대를 얼려서 스턴시킨 다음 산타의 선물로 끌고와서 드랍시켜 마무리 합니다.

step16_title = 루돌프 - 국민콤보 ②
step16_help  = ★빙판생성(D 오래누름 → D) → 썰매 상승(D 오래누름 → A) 빙판을 생성하면서 약경직시킨 후 썰매를 상승시켜 눈덩이로 스턴시키면서 마무리 합니다.



