[common]
max_clause  = 25

[clause1]
offset = 0
text   = ▣ 청약철회 규정 보기 

[clause2]
offset = 0
text   = * 이용약관 제 21조 유료서비스의 환불 및 취소 보기 

[clause3]
offset = 0
text   = ① 회원이 구매하는 유료서비스(아바타, 아이템, 회원제 서비스 등)는 청약철회가 

[clause4]
offset = 16
text   = 가능한 서비스와 청약철회가 제한되는 서비스로 구분됩니다. 

[clause5]
offset = 0
text   = ② 청약철회가 가능한 서비스를 구매한 회원은 구입 후 7일 이내에 청약철회를 할 수 

[clause6]
offset = 16
text   = 있습니다. 

[clause7]
offset = 16
text   = 단, 다음과 같은 경우에는 청약철회가 제한됩니다.  

[clause8]
offset = 16
text   = 1) 회원이 유료서비스를 구매한 후 이를 사용하기 위하여 캐쉬 인벤토리에서 게임

[clause9]
offset = 32
text   = 내 인벤토리로 이동한 경우 

[clause10]
offset = 16
text   = 2) 회원이 게임 내에서 유료서비스를 이용한 것이 확인된 경우 

[clause11]
offset = 0
text   = ③ 유료서비스의 유형별로 다음과 같은 서비스는 환불이 제한될 수 있습니다. 

[clause12]
offset = 16
text   = 1) 프리미엄, 자동결제(월정액) 또는 기간을 한정하여 이용할 수 있는 유료 회원제 

[clause13]
offset = 32
text   = 서비스와 같이 구매 동시에 적용 및 소진이 시작되어 컨텐츠를 사용할 수 있는

[clause14]
offset = 32
text   = 정액제 서비스. 

[clause15]
offset = 16
text   = 2) 정해진 시간이 소진될 때까지 서비스를 이용할 수 있는 정량제 서비스. 

[clause16]
offset = 16
text   = 3) 기간내 횟수제한 없이 사용 가능한 영구 아이템. 

[clause17]
offset = 16
text   = 4) 사용 횟수가 카운트 되는 아이템이나 일정범위를 지급받고 이를 소진하는 

[clause18]
offset = 32
text   = 형태의 서비스. 

[clause19]
offset = 16
text   = 5) 구매 후 개봉이 곧 사용인 캡슐형과 개봉행위로 효용이 결정되는 확률형 아이템. 

[clause20]
offset = 16
text   = 6) 구매시 치장 결과를 확인할 수 있는 아바타 아이템과 같은 시연 아이템. 

[clause21]
offset = 16
text   = 7) 부가혜택이 제공되는 서비스를 구매한 경우에 제공되는 부가혜택을 사용한 경우 

[clause22]
offset = 32
text   = (유료상품 구입시 유무료 아이템이 사은품 등으로 추가지급된 경우에 이를 

[clause23]
offset = 38
text   = 사용한 경우) 

[clause24]
offset = 16
text   = 8) 패키지형 아이템의 경우 포함된 아이템 중 일부를 사용한 경우. 

[clause25]
offset = 16
text   = 9) 영화, 만화, 음악, 운세, 폰조이 등의 컨텐츠 상품 

[clause26]
offset = 0
text   = * 엠캐쉬 약관 제 15조 5항 

[clause27]
offset = 0
text   = ⑤ 회사는 부정한 엠캐쉬 이용을 방지하기 위하여 타인으로부터 선물 받은 엠캐쉬,

[clause28]
offset = 16
text   =  상품권, 캐릭터, 아이템 또는 회사가 무상으로 지급하는 엠캐쉬, 상풍권, 캐릭터, 

[clause29]
offset = 16
text   = 아이템 또는 회사가 무상으로 지급하는 엠캐쉬, 상품권, 캐릭터, 아이템, 운영자 

[clause30]
offset = 16
text   = 충전 등은 철회 및 환불 하지 않으며, 이용 및 해지 시에는 전액 소멸 됩니다. 
