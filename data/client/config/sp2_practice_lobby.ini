[Practice1]
Title_text = STR(1)
Guide_text = 1. 방향키를 빠르게 두 번 누르고 유지하면 걷기보다 빠른 달리기가 가능합니다.\n \n2. 점프키를 누르면 점프가 발동되며 높은 지형으로 이동이 가능합니다.\n \n3. 방향키를 조합해서 누르면 대각선 이동이 가능합니다.

[Practice2]
Title_text = STR(1)
Guide_text = 1. 조로는 점프한 상태에서 점프키(A)를 누르면 한번 더 점프 할 수 있습니다.\n \n2. 조로는 착지 중에 방향키를 빠르게 두 번 누르면 해당 방향으로 구르기 이동이 가능합니다.\n \n3. 베니쉬(Q), 로즈밤(E)은 공중/다운상태에서도 사용이 가능합니다. 사용후 추가 점프가 가능합니다.

[Practice3]
Title_text = STR(1)
Guide_text = 1. 포로가 된 아군을 근접해서 일반공격으로 타격하면 포로상태가 해제됩니다.\n \n2. 조로는 점프한 상태에서 점프키를 누르면 공중에서 한 번 더 점프를 할 수 있습니다\n \n3. 베니쉬(Q), 로즈밤(E)은 공중/다운상태에서도 사용이 가능합니다. 사용후 추가 점프가 가능합니다.

[Practice4]
Title_text = STR(1)
Guide_text = 1. 공격키(D)를 누르고 있으면 소환된 마법진을 방향키로 조종이 가능합니다.\n \n2. 공격키를 누른 상태로 마법진을 원하는 위치로 이동 시킨 후 방어키(S)를 누르면 메테오가 소환됩니다\n \n3. 공격키(D)를 누르고 있으면 메테오 소환 스킬의 게이지 회복속도가 1.5배 증가합니다.

[Practice5]
Title_text = STR(1)
Guide_text = 1. 지뢰는 가까이 다가가서 방어키(S)를 누르면 방어가 가능합니다.\n \n2. 지뢰는 방어키 외에 스킬을 사용해도 제거가 가능합니다.\n \n3. 색으로 아군과 적군의 지뢰를 구분할 수 있습니다.

[Practice6]
Title_text = STR(1)
Guide_text = 1. 상대의 공격을 방어한 후 바로 공격키(D)를 누르면 반격이 가능합니다.\n \n2. 강공격을 반격하는 경우 반격의 성공률이 높습니다.\n \n3. 연타 약공격을 반격하는 경우 실패할 확률이 높습니다.

[Practice7]
Title_text = STR(1)
Guide_text = 1. 공격키(D)를 오래 누르면 파워차징 공격이 발동됩니다.\n \n2. 공격키를 누르고 있는 동안 파워가 지속적으로 증가하여 대상을 공격시 매우 멀리 날려 버릴 수 있습니다. \n \n3. 집중의의지(AD)는 집중을 통해 공격시 밀림을 증가시키는 스킬입니다.