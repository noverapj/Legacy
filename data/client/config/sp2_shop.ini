[unable_present_bonus]
;선물 보너스 불가능 세팅
;UI에 선물하기 이벤트 시 아이콘 표시
;게임서버의 sp2_event.ini 파일에서 39번 타입(event51) 이벤트와 연동되도록 설정되어있음
;아래의 인에이블 프레젠트 보너스는 위의 파일에서 41번 타입(event56) 이벤트와 연동되도록 설정되어있음
;기존에는 두 이벤트가 하나였으나 분리 시킴(161207업데이트)
;따라서 선물하기 이벤트 시 둘 중 하나를 활성화 시키면 됨
;*주의사항*
;2개의 이벤트가 동일하게 걸리는 경우, event.ini 파일에서 하나의 이벤트에 선물 불가를 걸면 됨(가급적 39번타입 이벤트에 거는걸 추천)
;둘 중 하나를 막지 않으면 선물을 2번 받음

