[common]
background = BaseImage001#icon0_rec_bg
start_sound=
sec_move_width = 84.0f
add_width = 20

max_announce = 3

;------------------------// 청소년 보호 
[announce1]

; 셧다운 유저 ON
shut_down_user = 1

; 매일 반복 메세지
every_day      = 1

; 시간과 분을 기록
every_start_date = 2251
every_end_date   = 2400
rotate_time      = 600000
priority         = 1000


check_mode  = -1
check_room_style = -1

line_count  = 1
line1_color = 0xFFFFB400
line1_text  = <고객님께서는 청소년보호법 제23조의 3, 제①에 근거하여 매일 오전0시부터 오전6시까지 게임을 이용하실 수 없습니다. 참고하시고 오전6시 이후에 다시 접속해 주시기 바랍니다.>




;------------------------// 이벤트공지
[announce2]

; 셧다운 유저 OFF
shut_down_user = 0

; 매일 반복 메세지
every_day      = 0

; 시간과 분을 기록
every_start_date = 0000
every_end_date   = 2400
rotate_time      = 3420000
priority         = 1000


check_mode  = -1
check_room_style = -1

line_count  = 1
line1_color = 0xFFFFB400
line1_text  = < 매일 12시! 로스트상가는 확인하셨나요? 언제나 특별한 상품과 함께!! >




;------------------------// 계정도용
[announce3]

; 셧다운 유저 OFF
shut_down_user = 0

; 매일 반복 메세지
every_day      = 1

; 시간과 분을 기록
every_start_date = 0000
every_end_date   = 2400
rotate_time      = 10800000
priority         = 1000


check_mode  = -1
check_room_style = -1

line_count  = 1
line1_color = 0xFFFFB400
line1_text  = <계정을 공유(부주, 양도 등)하여 계정도용 피해를 받을 경우 운영정책에 따라 복구가 불가능하며, 타인의 계정에 접속하여 계정도용을 시도 할 경우 운영정책에 따라 제재 될 수 있습니다.>
