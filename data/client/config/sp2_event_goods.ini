; PresentType   = 1(용병),2(치장),3(권한),4(페소),5(장비),6(장비상자),7(치장, ;
;		1용병 : 코드, 기간(h)		
;2치장 : 부위, 코드		
;3권한 : 코드, 수량		
;4페소 : 지급량, X		
;5장비 : 코드, (강화값x10000)+기간(h)		
;5성장장비 : 코드, 100000000 + (강화값x10000) + 기간(h)		
;6장비보급 : 코드(machine_code), 되팔기 가격		
;9메달 : 코드, 기간(h)		
		
		
;기타		
;MarkType    = 6 (수량제한)		
;ManualIndex = 0부터 시작한다.		
		
